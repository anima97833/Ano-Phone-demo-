<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>棉花娃娃手作工坊 · Cotton Doll Atelier</title>
<style>
  :root {
    --cream-bg: #FAF6F0;
    --cream-card: #FFFDF9;
    --apricot-soft: #F3E6D8;
    --pink-mist: #E7B7C1;
    --pink-deep: #C46F7F;
    --pink-soft: #FDF2F4;
    --sage-green: #6D9381;
    --sage-soft: #EAF3EE;
    --brown-dark: #433128;
    --brown-mid: #755B4E;
    --brown-light: #A48D7E;
    --border-warm: #E4D4C3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; height: 100dvh; overflow: hidden;
    background: radial-gradient(circle at 50% 20%, #3E332D 0%, #201A17 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--brown-dark);
  }
  #app {
    display: flex; flex-direction: column; width: 100%; max-width: 520px; height: 100%;
    margin: 0 auto; position: relative; background: var(--cream-bg);
    box-shadow: 0 0 48px rgba(0, 0, 0, 0.45); overflow: hidden;
  }

  /* 顶部栏 + 清爽 6 步导航 */
  .top-header {
    flex-shrink: 0; padding: 7px 10px 6px;
    background: linear-gradient(180deg, #FFFDF9 0%, #F7EFE4 100%);
    border-bottom: 1px solid var(--border-warm);
    box-shadow: 0 2px 8px rgba(67, 49, 40, 0.06); z-index: 25;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; gap: 6px; }
  .brand-title { font-size: 14.5px; font-weight: 800; color: var(--brown-dark); display: flex; align-items: center; gap: 6px; min-width: 0; }
  .brand-title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .icon-btn {
    width: 27px; height: 27px; border-radius: 50%; border: 1px solid var(--border-warm);
    background: var(--cream-card); color: var(--brown-mid);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 12px; font-weight: 700; transition: all 0.16s;
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn:disabled { opacity: 0.36; pointer-events: none; }
  .icon-btn.text-pill { width: auto; padding: 0 9px; border-radius: 14px; font-size: 11px; }

  .stepper {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px;
    background: rgba(243, 230, 216, 0.68); border: 1px solid var(--border-warm);
    border-radius: 13px; padding: 3px; font-size: 11px; font-weight: 700; color: var(--brown-light);
  }
  .step-item {
    text-align: center; cursor: pointer; padding: 3.5px 2px; border-radius: 9px;
    transition: all 0.18s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .step-item.active {
    color: #FFF; background: linear-gradient(135deg, #D58391 0%, #B76373 100%);
    box-shadow: 0 2px 6px rgba(183, 99, 115, 0.3);
  }
  .step-item.done { color: var(--sage-green); background: var(--sage-soft); }

  /* 舞台区 */
  .stage-wrap {
    flex: 1 1 0; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: #EADBC8;
  }
  #dollCanvas { width: 100%; height: 100%; display: block; touch-action: none; }

  .stage-top-hud {
    position: absolute; top: 8px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 15; gap: 6px;
  }
  .hud-pill {
    pointer-events: auto; padding: 4px 10px; border-radius: 14px;
    background: rgba(255, 253, 249, 0.9); backdrop-filter: blur(5px);
    border: 1px solid var(--border-warm); color: var(--brown-dark);
    font-size: 10.5px; font-weight: 700; box-shadow: 0 2px 8px rgba(67, 49, 40, 0.08);
    max-width: 65%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hud-btn {
    cursor: pointer; border: 1px solid var(--pink-mist); background: var(--pink-soft);
    color: var(--pink-deep); padding: 4px 10px; border-radius: 12px;
    font-size: 10.5px; font-weight: 800; pointer-events: auto; transition: all 0.15s;
  }
  .hud-btn:active { transform: scale(0.94); }

  .selection-toolbar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    z-index: 18; display: none; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 15px;
    background: rgba(255, 253, 249, 0.95); border: 1.5px solid var(--pink-mist);
    box-shadow: 0 4px 14px rgba(67, 49, 40, 0.15);
  }
  .selection-toolbar.show { display: flex; }
  .sel-btn {
    padding: 3px 7px; border-radius: 9px; border: 1px solid var(--border-warm);
    background: var(--cream-card); color: var(--brown-dark); font-size: 10.5px; font-weight: 700; cursor: pointer;
  }
  .sel-btn.danger { color: #C94A4A; border-color: #F1C5C5; background: #FFF5F5; }

  .stage-toast {
    position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
    z-index: 22; padding: 5px 13px; border-radius: 15px;
    background: rgba(67, 49, 40, 0.9); color: #FFFDF9; font-size: 11px; font-weight: 700;
    pointer-events: none; opacity: 0; transition: opacity 0.2s; white-space: nowrap;
  }
  .stage-toast.show { opacity: 1; }

  /* 舞台右侧缩放与抓手平移浮栏 */
  .zoom-controls {
    position: absolute; right: 9px; bottom: 10px; z-index: 16;
    display: flex; flex-direction: column; gap: 4px; align-items: center;
    background: rgba(255, 253, 249, 0.9); backdrop-filter: blur(5px);
    border: 1px solid var(--border-warm); border-radius: 14px; padding: 4px;
    box-shadow: 0 3px 10px rgba(67, 49, 40, 0.1);
  }
  .zoom-btn {
    width: 28px; height: 26px; border-radius: 9px; border: 1px solid var(--border-warm);
    background: var(--cream-card); color: var(--brown-dark); font-size: 12px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .zoom-btn:active { transform: scale(0.92); }
  .zoom-btn.active { background: var(--pink-soft); border-color: var(--pink-deep); color: var(--pink-deep); }
  .zoom-pct { font-size: 9.5px; font-weight: 800; color: var(--brown-mid); cursor: pointer; padding: 1px 0; }

  /* 底部工作台 */
  .bottom-dock {
    flex-shrink: 0;
    background: linear-gradient(180deg, #FFFDF9 0%, #F5ECE0 100%);
    border-top: 1.5px solid var(--border-warm);
    border-radius: 20px 20px 0 0;
    padding: 8px 11px calc(8px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 24px rgba(67, 49, 40, 0.1);
    z-index: 25; display: flex; flex-direction: column; gap: 6px;
  }
  .sub-tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
  .sub-tabs::-webkit-scrollbar { display: none; }
  .sub-tab {
    padding: 3.5px 10px; border-radius: 12px; border: 1px solid var(--border-warm);
    background: var(--cream-card); color: var(--brown-mid); font-size: 11px; font-weight: 700;
    cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .sub-tab.active { background: var(--brown-dark); color: #FFFDF9; border-color: var(--brown-dark); }

  /* 动态控制区（支持款式缩略图 + Tomodachi 滑块 + 自由色盘） */
  .dock-body { display: flex; flex-direction: column; gap: 6px; max-height: 186px; overflow-y: auto; scrollbar-width: none; }
  .dock-body::-webkit-scrollbar { display: none; }

  .options-scroll { display: flex; gap: 7px; overflow-x: auto; padding: 2px 1px; scrollbar-width: none; align-items: stretch; }
  .options-scroll::-webkit-scrollbar { display: none; }
  .option-card {
    flex: 0 0 auto; min-width: 64px; padding: 5px 6px; border-radius: 12px;
    background: var(--cream-card); border: 1.5px solid var(--border-warm);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; transition: all 0.15s; position: relative;
  }
  .option-card:active { transform: scale(0.95); }
  .option-card.active { border-color: var(--pink-deep); background: var(--pink-soft); box-shadow: 0 2px 8px rgba(196, 111, 127, 0.18); }
  .option-card canvas { display: block; }
  .opt-title { font-size: 10.5px; font-weight: 800; color: var(--brown-dark); white-space: nowrap; }
  .opt-sub { font-size: 9px; color: var(--brown-light); white-space: nowrap; }

  /* 自由色盘行 */
  .color-row { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 1px; }
  .color-row::-webkit-scrollbar { display: none; }
  .color-row-label { font-size: 10.5px; font-weight: 800; color: var(--brown-mid); white-space: nowrap; flex-shrink: 0; }
  .color-picker-wrap {
    position: relative; width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: conic-gradient(#F26B6B, #F2C94C, #6FCF97, #56CCF2, #9B51E0, #F26B6B);
    border: 2px solid #FFF; box-shadow: 0 0 0 1.2px var(--brown-light);
    cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .color-picker-wrap input[type="color"] {
    position: absolute; inset: -6px; width: 40px; height: 40px; opacity: 0; cursor: pointer;
  }
  .color-picker-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #FFF; pointer-events: none; }
  .swatch-btn {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; cursor: pointer;
    border: 1.5px solid rgba(67, 49, 40, 0.22); transition: transform 0.14s;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.4);
  }
  .swatch-btn.active { border: 2px solid var(--brown-dark); transform: scale(1.12); box-shadow: 0 0 0 2px #FFF inset; }

  /* Tomodachi 精雕滑块网格 */
  .slider-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px 10px; padding: 2px 2px; }
  .slider-item { display: flex; align-items: center; gap: 6px; }
  .slider-lbl { font-size: 10px; font-weight: 700; color: var(--brown-mid); width: 34px; flex-shrink: 0; }
  .slider-item input[type="range"] {
    flex: 1; height: 4px; accent-color: var(--pink-deep); cursor: pointer; min-width: 0;
  }
  .toggle-chip {
    padding: 3px 9px; border-radius: 10px; border: 1px solid var(--border-warm);
    background: var(--cream-card); color: var(--brown-mid); font-size: 10.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
  }
  .toggle-chip.active { background: var(--pink-soft); border-color: var(--pink-deep); color: var(--pink-deep); }

  .dock-action-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .small-pill-btn {
    padding: 6px 10px; border-radius: 14px; border: 1.2px solid var(--border-warm);
    background: var(--cream-card); color: var(--brown-mid); font-size: 11px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
  }
  .small-pill-btn:active { transform: scale(0.95); }
  .small-pill-btn.accent { border-color: var(--sage-green); background: var(--sage-soft); color: #365B4A; }
  .primary-next-btn {
    margin-left: auto; padding: 7px 14px; border-radius: 15px;
    border: 1.5px solid #B05F6E;
    background: linear-gradient(135deg, #D98997 0%, #BF6A7A 100%);
    color: #FFF; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(191, 106, 122, 0.28);
  }
  .primary-next-btn:active { transform: scale(0.96); }

  /* 弹窗 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(30, 23, 19, 0.58); backdrop-filter: blur(4px); z-index: 60; display: none; align-items: center; justify-content: center; padding: 14px; }
  .modal-overlay.show { display: flex; }
  .card-modal { width: 100%; max-width: 400px; background: var(--cream-bg); border-radius: 22px; border: 1.5px solid var(--border-warm); padding: 15px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.34); display: flex; flex-direction: column; gap: 9px; max-height: 90dvh; overflow-y: auto; align-items: center; }
  .card-input, .card-textarea { width: 100%; border: 1px solid var(--border-warm); background: var(--cream-card); border-radius: 11px; padding: 7px 10px; font-size: 12.5px; color: var(--brown-dark); font-family: inherit; outline: none; }
  .card-textarea { resize: none; height: 54px; }
  .poster-img { width: 100%; max-width: 300px; border-radius: 14px; border: 1.5px solid var(--border-warm); box-shadow: 0 8px 24px rgba(67, 49, 40, 0.18); }
  .btn-pink-large { width: 100%; padding: 10px; border-radius: 14px; border: 1.5px solid #B05F6E; background: linear-gradient(135deg, #D98997 0%, #BF6A7A 100%); color: #FFF; font-size: 13px; font-weight: 800; cursor: pointer; }
  .btn-outline-large { width: 100%; padding: 9px; border-radius: 14px; border: 1.2px solid var(--border-warm); background: var(--cream-card); color: var(--brown-dark); font-size: 12px; font-weight: 700; cursor: pointer; }
  .gallery-list { width: 100%; display: flex; flex-direction: column; gap: 8px; max-height: 58dvh; overflow-y: auto; }
  .gallery-item { display: flex; gap: 9px; align-items: center; background: var(--cream-card); border: 1px solid var(--border-warm); border-radius: 13px; padding: 8px; }
  .gallery-thumb { width: 52px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-warm); flex-shrink: 0; }
  .gallery-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .gallery-title { font-size: 12.5px; font-weight: 800; color: var(--brown-dark); }
  .gallery-sub { font-size: 10px; color: var(--brown-mid); }

  @media (max-height: 740px) {
    .top-header { padding: 5px 8px 4px; }
    .bottom-dock { padding: 6px 9px calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
    .dock-body { max-height: 158px; gap: 4px; }
    .option-card { min-width: 58px; padding: 4px 5px; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="top-header">
    <div class="header-row">
      <div class="brand-title">
        <button type="button" class="icon-btn" id="backToWorkshopBtn" title="返回东汉工坊" style="width:24px;height:24px;font-size:14px;font-weight:800;flex-shrink:0;">‹</button>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="9" r="6" fill="#F3E5D8" stroke="#433128" stroke-width="1.8"/>
          <circle cx="9.8" cy="8.5" r="1" fill="#433128"/>
          <circle cx="14.2" cy="8.5" r="1" fill="#433128"/>
          <path d="M10.5 11C11.2 11.7 12.8 11.7 13.5 11" stroke="#C46F7F" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M7 20C7 16.8 9.2 15 12 15C14.8 15 17 16.8 17 20" stroke="#433128" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>棉花娃娃手作工坊 · Atelier</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="undoBtn" title="撤销" disabled>↶</button>
        <button class="icon-btn" id="redoBtn" title="重做" disabled>↷</button>
        <button class="icon-btn text-pill" id="openGalleryBtn">娃柜</button>
        <button class="icon-btn" id="soundToggleBtn" title="音效">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </button>
        <button class="icon-btn" id="newProjectBtn" title="新建娃娃">↻</button>
      </div>
    </div>

    <div class="stepper" id="stepperBar">
      <span class="step-item active" data-step="0">1.捏脸</span>
      <span class="step-item" data-step="1">2.裁绣</span>
      <span class="step-item" data-step="2">3.缝棉</span>
      <span class="step-item" data-step="3">4.发型</span>
      <span class="step-item" data-step="4">5.娃衣</span>
      <span class="step-item" data-step="5">6.展示</span>
    </div>
  </header>

  <div class="stage-wrap" id="stageWrap">
    <canvas id="dollCanvas"></canvas>

    <div class="stage-top-hud">
      <div class="hud-pill" id="stageStatusPill">流畅脸型 · 自由捏娃</div>
      <button type="button" class="hud-btn" id="stageQuickBtn">随机灵感</button>
    </div>

    <div class="selection-toolbar" id="selectionToolbar">
      <button type="button" class="sel-btn" id="selScaleUpBtn">放大</button>
      <button type="button" class="sel-btn" id="selScaleDownBtn">缩小</button>
      <button type="button" class="sel-btn" id="selRotLeftBtn">左转</button>
      <button type="button" class="sel-btn" id="selRotRightBtn">右转</button>
      <button type="button" class="sel-btn danger" id="selDeleteBtn">移除</button>
    </div>

    <div class="zoom-controls" id="zoomControls">
      <button type="button" class="zoom-btn" id="zoomInBtn" title="放大画布">+</button>
      <span class="zoom-pct" id="zoomPctLabel" title="点击重置100%">100%</span>
      <button type="button" class="zoom-btn" id="zoomOutBtn" title="缩小画布">-</button>
      <button type="button" class="zoom-btn" id="panModeBtn" title="抓手平移画布" style="font-size:10px;">移</button>
    </div>

    <div class="stage-toast" id="stageToast">提示</div>
  </div>

  <div class="bottom-dock" id="bottomDock">
    <div class="sub-tabs" id="subTabs"></div>
    <div class="dock-body" id="dockBody"></div>
    <div class="dock-action-row">
      <button type="button" class="small-pill-btn" id="prevStepBtn">‹ 上一步</button>
      <button type="button" class="small-pill-btn accent" id="contextActionBtn" style="display:none;">快捷动作</button>
      <button type="button" class="primary-next-btn" id="nextStepBtn">下一步 ›</button>
    </div>
  </div>
</div>

<!-- 出生证登记弹窗 -->
<div class="modal-overlay" id="namingModal">
  <div class="card-modal">
    <div style="width:100%;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="font-size:15px;">登记棉花娃娃出生证</h3>
      <button class="icon-btn" id="closeNamingModalBtn">×</button>
    </div>
    <input type="text" class="card-input" id="dollNameInput" maxlength="14" placeholder="为你的棉花娃娃取个名字" value="奶糖小兔">
    <textarea class="card-textarea" id="dollNoteInput" maxlength="64" placeholder="写下给崽崽的出生寄语...">一针一线亲手缝制的小可爱，愿你永远蓬松温暖。</textarea>
    <button type="button" class="btn-pink-large" id="generatePosterBtn">生成高清出生证纪念卡</button>
  </div>
</div>

<!-- 纪念卡展示弹窗 -->
<div class="modal-overlay" id="posterModal">
  <div class="card-modal">
    <div style="width:100%;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="font-size:15px;">棉花娃娃专属纪念卡</h3>
      <button class="icon-btn" id="closePosterModalBtn">×</button>
    </div>
    <img id="posterImg" class="poster-img" alt="棉花娃娃出生证">
    <button type="button" class="btn-pink-large" id="downloadPngBtn">保存高清 PNG 纪念卡 ↓</button>
    <div style="display:flex;gap:8px;width:100%;">
      <button type="button" class="btn-outline-large" id="setHomePetBtn" style="flex:1;border-color:var(--pink-mist);color:var(--pink-deep);background:var(--pink-soft);">设为桌宠</button>
      <button type="button" class="btn-outline-large" id="saveBackpackBtn" style="flex:1;">收入行囊</button>
      <button type="button" class="btn-outline-large" id="openForwardModalBtn" style="flex:1;">赠予好友</button>
    </div>
    <div style="display:flex;gap:8px;width:100%;">
      <button type="button" class="btn-outline-large" id="backToEditBtn" style="flex:1;">继续装扮</button>
      <button type="button" class="btn-outline-large" id="makeAnotherBtn" style="flex:1;">再做一只</button>
    </div>
    <div id="posterActionToast" style="font-size:11px;color:var(--pink-deep);font-weight:700;min-height:14px;text-align:center;"></div>
  </div>
</div>

<!-- 本地娃柜作品集 -->
<div class="modal-overlay" id="galleryModal">
  <div class="card-modal">
    <div style="width:100%;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="font-size:15px;">我的娃柜 · 历次作品</h3>
      <button class="icon-btn" id="closeGalleryModalBtn">×</button>
    </div>
    <div class="gallery-list" id="galleryList"></div>
  </div>
</div>

<!-- 赠予传讯好友弹窗 -->
<div class="modal-overlay" id="forwardModal">
  <div class="card-modal">
    <div style="width:100%;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="font-size:15px;">飞鸽传书 · 分享棉花娃娃</h3>
      <button class="icon-btn" id="closeForwardModalBtn">×</button>
    </div>
    <select class="card-input" id="forwardCharSelect"><option value="">选择传讯好友</option></select>

  class AtelierSoundEngine {
    constructor() { this.ctx = null; this.enabled = true; this.lastT = 0; }
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    playPop(freq = 540, dur = 0.08) {
      if (!this.enabled) return;
      this.init(); if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(freq * 0.82, now);
      o.frequency.exponentialRampToValueAtTime(freq * 1.24, now + dur);
      g.gain.setValueAtTime(0.075, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g); g.connect(this.ctx.destination); o.start(now); o.stop(now + dur + 0.01);
    }
    playSnip() {
      if (!this.enabled || performance.now() - this.lastT < 95) return;
      this.lastT = performance.now(); this.init(); if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * 0.04), this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.014));
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1750;
      const g = this.ctx.createGain(); g.gain.value = 0.13;
      src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start(now);
    }
    playStitch() {
      if (!this.enabled || performance.now() - this.lastT < 85) return;
      this.lastT = performance.now(); this.playPop(780 + Math.random() * 140, 0.045);
    }
    playStuff() {
      if (!this.enabled) return;
      this.init(); if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(195, now); o.frequency.exponentialRampToValueAtTime(325, now + 0.12);
      g.gain.setValueAtTime(0.11, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      o.connect(g); g.connect(this.ctx.destination); o.start(now); o.stop(now + 0.14);
    }
    playChime() {
      if (!this.enabled) return;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => this.playPop(f, 0.15), i * 75));
    }
  }

  function applyNomadSculptBrush(localX, localY, moveDx, moveDy) {
    const ui = state.sculptUI;
    const offs = ensureSculptOffsets(state.body);
    const pts = generateSmoothHeadPoints(state.body, 1.0);
    const N = pts.length;
    const R = ui.radius || 42;

    const applyAt = (bx, by, mdx, mdy) => {
      const next = offs.map(o => ({ dx: o.dx, dy: o.dy }));
      for (let i = 0; i < N; i++) {
        const d = Math.hypot(pts[i].x - bx, pts[i].y - by);
        if (d >= R) continue;
        // 余弦平方衰减，呈现 Nomad 黏土柔和推拉手感
        const w = Math.pow(Math.cos((d / R) * Math.PI * 0.5), 2);
        if (ui.brush === 'move') {
          next[i].dx = clamp(next[i].dx + mdx * w * 0.85, -34, 34);
          next[i].dy = clamp(next[i].dy + mdy * w * 0.85, -30, 30);
        } else if (ui.brush === 'inflate' || ui.brush === 'pinch') {
          const len = Math.hypot(pts[i].x, pts[i].y) || 1;
          const dir = ui.brush === 'inflate' ? 1 : -1;
          next[i].dx = clamp(next[i].dx + (pts[i].x / len) * dir * w * 1.45, -34, 34);
          next[i].dy = clamp(next[i].dy + (pts[i].y / len) * dir * w * 1.45, -30, 30);
        } else if (ui.brush === 'smooth') {
          const prev = offs[(i - 1 + N) % N], nxt = offs[(i + 1) % N];
          next[i].dx = lerp(next[i].dx, (prev.dx + nxt.dx) * 0.5, w * 0.45);
          next[i].dy = lerp(next[i].dy, (prev.dy + nxt.dy) * 0.5, w * 0.45);
        }
      }
      // 轻度拉普拉斯松弛，确保边缘永远顺滑不打结
      for (let i = 0; i < N; i++) {
        const p = next[(i - 1 + N) % N], c = next[i], n = next[(i + 1) % N];
        offs[i].dx = lerp(c.dx, (p.dx + n.dx) * 0.5, 0.08);
        offs[i].dy = lerp(c.dy, (p.dy + n.dy) * 0.5, 0.08);
      }
    };

    applyAt(localX, localY, moveDx, moveDy);
    if (ui.symmetry) {
      applyAt(-localX, localY, -moveDx, moveDy);
    }
  }


  function eraseStrokesAt(strokesArr, x, y, radius = 10, mirror = false) {
    if (!Array.isArray(strokesArr) || !strokesArr.length) return false;
    const targets = mirror ? [[x, y], [-x, y]] : [[x, y]];
    let changed = false;
    for (let i = strokesArr.length - 1; i >= 0; i--) {
      const st = strokesArr[i];
      const pts = st.points || [];
      const hitAt = (px, py) => targets.some(([tx, ty]) => {
        if (Math.hypot(px - tx, py - ty) <= radius + (st.width || 3) * 0.4) return true;
        if (st.mirror && Math.hypot(-px - tx, py - ty) <= radius + (st.width || 3) * 0.4) return true;
        return false;
      });
      if (st.type === 'dot' || st.type === 'fill' || st.type === 'circle' || st.type === 'ellipse') {
        const hitShape = pts.some(p => hitAt(p.x, p.y)) || (pts.length >= 2 && hitAt((pts[0].x + pts[pts.length - 1].x) * 0.5, (pts[0].y + pts[pts.length - 1].y) * 0.5));
        if (hitShape) {
          strokesArr.splice(i, 1);
          changed = true;
        }
      } else if (st.type === 'airbrush') {
        const kept = pts.filter(p => !hitAt(p.x, p.y));
        if (kept.length !== pts.length) {
          changed = true;
          if (kept.length > 0) st.points = kept; else strokesArr.splice(i, 1);
        }
      } else {
        // 线段局部擦断：把未命中的连续段落保留为新线段
        let anyHit = false;
        const segments = [];
        let curSeg = [];
        for (let k = 0; k < pts.length; k++) {
          if (hitAt(pts[k].x, pts[k].y)) {
            anyHit = true;
            if (curSeg.length >= 2) segments.push(curSeg);
            curSeg = [];
          } else {
            curSeg.push(pts[k]);
          }
        }
        if (curSeg.length >= 2) segments.push(curSeg);
        if (anyHit) {
          changed = true;
          const replacements = segments.map(seg => ({ ...st, points: seg }));
          strokesArr.splice(i, 1, ...replacements);
        }
      }
    }
    return changed;
  }


  // 绘制可拖拽四肢绑骨骨架叠加层（仅在“绑骨摆姿”页签显示）
  function getBoneHandlesWorld(cx, cy) {
    const isSlender = state.body.bodyType === 'slender';
    const j = getSkeletonJoints(isSlender);
    const pose = state.pose;
    const baseY = cy + 16;
    const endOf = (piv, ang, len) => ({
      px: cx + piv.x, py: baseY + piv.y,
      x: cx + piv.x - Math.sin(ang) * len,
      y: baseY + piv.y + Math.cos(ang) * len
    });
    const headLen = 88;
    const ht = pose.headTilt || 0;
    return {
      head: { px: cx, py: baseY + j.neckY, x: cx + Math.sin(ht) * headLen, y: baseY + j.neckY - Math.cos(ht) * headLen, label: '歪头' },
      leftArm:  { ...endOf(j.leftArm,  pose.leftArm,  j.armLen), label: '左手' },
      rightArm: { ...endOf(j.rightArm, pose.rightArm, j.armLen), label: '右手' },
      leftLeg:  { ...endOf(j.leftLeg,  pose.leftLeg,  j.legLen), label: '左脚' },
      rightLeg: { ...endOf(j.rightLeg, pose.rightLeg, j.legLen), label: '右脚' }
    };
  }

  function drawSkeletonOverlay(c, cx, cy) {
    const hds = getBoneHandlesWorld(cx, cy);

      c.beginPath(); c.moveTo(h.px, h.py); c.lineTo(h.x, h.y); c.stroke();

      c.fillStyle = '#433128'; c.font = '800 9.5px sans-serif'; c.textAlign = 'center';
      c.fillText(h.label, h.x, h.y - 13);
    });
    c.restore();
  }

      const limX = runtime.w * 0.45 * runtime.zoom;

    updateZoomLabel();
  }

  function resizeCanvas() {
    const wrap = document.getElementById('stageWrap');
    const r = wrap.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    runtime.w = Math.round(r.width);
    runtime.h = Math.round(r.height);
    runtime.cx = runtime.w * 0.5;
    runtime.cy = runtime.h * 0.52;
    const targetW = Math.round(runtime.w * dpr);
    const targetH = Math.round(runtime.h * dpr);
    if (canvas.width !== targetW || canvas.height !== targetH) {
      canvas.width = targetW;
      canvas.height = targetH;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(() => resizeCanvas()).observe(document.getElementById('stageWrap'));
  }

  function drawShowcaseBg(c, w, h, bgId) {
    const bg = BACKGROUNDS.find(b => b.id === bgId) || BACKGROUNDS[0];
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, bg.top); g.addColorStop(1, bg.bot);
    c.fillStyle = g; c.fillRect(0, 0, w, h);

    if (bgId === 'worktable') {
      c.save();
      c.strokeStyle = 'rgba(138, 110, 88, 0.13)'; c.lineWidth = 1;
      for (let x = (w % 28) * 0.5; x < w; x += 28) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
      for (let y = (h % 28) * 0.5; y < h; y += 28) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
      c.strokeStyle = 'rgba(138, 110, 88, 0.25)'; c.lineWidth = 1.5; c.strokeRect(12, 12, w - 24, h - 24);
      c.restore();
    } else if (bgId === 'berry_picnic') {
      c.save(); c.fillStyle = 'rgba(232, 168, 182, 0.18)';
      for (let x = 0; x < w; x += 36) c.fillRect(x, 0, 14, h);
      for (let y = 0; y < h; y += 36) c.fillRect(0, y, w, 14);
      c.restore();
    } else if (bgId === 'star_box') {
      c.save();
      for (let i = 0; i < 28; i++) {
        c.fillStyle = i % 3 === 0 ? 'rgba(255, 238, 180, 0.8)' : 'rgba(210, 228, 255, 0.55)';
        const sx = ((i * 89 + 37) % Math.max(100, Math.floor(w - 20))) + 10;
        const sy = ((i * 67 + 23) % Math.max(100, Math.floor(h - 20))) + 10;
        drawStarPath(c, sx, sy, 4, (i % 3) + 2.2, 1); c.fill();
      }
      c.restore();
    }
  }

  function ensureCraftSamples() {
    const pts = generateSmoothHeadPoints(state.body, 1.08);
    if (state.craft.cutSamples.length !== pts.length) {
      state.craft.cutSamples = pts.map(() => state.craft.cutProgress >= 0.85);
    }
    if (state.craft.sewSamples.length !== pts.length) {
      state.craft.sewSamples = pts.map((_, i) => (i >= 20 && i <= 28) ? false : state.craft.sewProgress >= 0.85);
    }
  }

  function renderScene() {
    const w = runtime.w, h = runtime.h, cx = runtime.cx, cy = runtime.cy;
    const fit = getBaseFitScale();
    ctx.clearRect(0, 0, w, h);
    drawShowcaseBg(ctx, w, h, state.step === 5 ? state.showcase.background : 'worktable');
    ensureCraftSamples();

    // 统一舞台缩放与平移摄像机矩阵（所有步骤皆可无损放大至 320% 精细绘制）
    ctx.save();
    ctx.translate(cx + runtime.panX, cy + runtime.panY);
    ctx.scale(runtime.zoom * fit, runtime.zoom * fit);
    ctx.translate(-cx, -cy);

    if (state.step === 0) {
      // 1. Tomodachi 捏脸定稿（纯净裸娃脸型与精绣五官，不遮挡额头与脸廓）
      drawFullDoll(ctx, cx, cy + 16, 1.0, 0, false, false);
      if (state.subTab === 'sculpt') {
        const j = getSkeletonJoints(state.body.bodyType === 'slender');
        const r = state.sculptUI.radius * j.faceScale;
        ctx.save();
        ctx.strokeStyle = 'rgba(196, 111, 127, 0.72)';
        ctx.fillStyle = 'rgba(196, 111, 127, 0.08)';
        ctx.lineWidth = 1.6 / Math.max(1, runtime.zoom);
        ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.arc(runtime.pointerPos.x, runtime.pointerPos.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        if (state.sculptUI.symmetry) {
          const mx = cx - (runtime.pointerPos.x - cx);
          ctx.strokeStyle = 'rgba(109, 147, 129, 0.58)';
          ctx.beginPath(); ctx.arc(mx, runtime.pointerPos.y, r, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
      } else if (runtime.pointerDown && (runtime.pointerMode === 'drag-eye' || runtime.pointerMode === 'drag-brow' || runtime.pointerMode === 'drag-mouth')) {
        const j = getSkeletonJoints(state.body.bodyType === 'slender');
        const headY = cy + 16 + j.actualHeadY;
        const sc = j.faceScale, f = state.face;
        let hx = cx, hy = headY;
        if (runtime.pointerMode === 'drag-eye') { hx = cx + f.eyeSpacing * sc; hy = headY + f.eyeY * sc; }
        else if (runtime.pointerMode === 'drag-brow') { hx = cx - f.browSpacing * sc; hy = headY + (f.eyeY + f.browY) * sc; }
        else { hx = cx; hy = headY + f.mouthY * sc; }
        ctx.save();
        ctx.strokeStyle = 'rgba(196, 111, 127, 0.72)'; ctx.lineWidth = 1.5 / Math.max(1, runtime.zoom);
        ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.arc(hx, hy, 18, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
    } else if (state.step === 1) {
      // 2. 裁布 & 竹绣绷对称刺绣
      ctx.save(); ctx.translate(cx, cy);
      if (state.subTab === 'cut') {
        const outer = generateSmoothHeadPoints(state.body, 1.08);
        const inner = generateSmoothHeadPoints(state.body, 0.94);
        ctx.fillStyle = state.body.skinColor; ctx.strokeStyle = '#C4B09B'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(-142, -138, 284, 276, 10); ctx.fill(); ctx.stroke();
        fillPlushShape(ctx, outer, state.body.skinColor, state.body.fabricType, 0);
        traceSmoothClosedCurve(ctx, inner);
        ctx.strokeStyle = 'rgba(196,111,127,0.45)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
        outer.forEach((p, i) => {
          const nxt = outer[(i + 1) % outer.length];
          const done = state.craft.cutSamples[i];
          ctx.strokeStyle = done ? '#433128' : 'rgba(164, 141, 126, 0.6)';
          ctx.lineWidth = done ? 3 : 1.6; ctx.setLineDash(done ? [] : [4, 4]);
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nxt.x, nxt.y); ctx.stroke();
        });
        ctx.setLineDash([]);
        ctx.fillStyle = '#433128'; ctx.font = '800 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`沿外圈虚线滑动裁剪 · ${Math.round(state.craft.cutProgress * 100)}%`, 0, 122);
      } else {
        // 竹制绣绷
        ctx.fillStyle = '#C9A276'; ctx.strokeStyle = '#785636'; ctx.lineWidth = 2;
        ctx.fillRect(-16, -152, 32, 14); ctx.strokeRect(-16, -152, 32, 14);
        ctx.strokeStyle = '#D6B388'; ctx.lineWidth = 11;
        ctx.beginPath(); ctx.arc(0, 0, 134, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = '#8C6844'; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.arc(0, 0, 140, 0, Math.PI * 2); ctx.stroke();
        const headPts = generateSmoothHeadPoints(state.body, 1.0);
        fillPlushShape(ctx, headPts, state.body.skinColor, state.body.fabricType, 12);
        if (state.craft.mirrorEmbroidery) {
          ctx.strokeStyle = 'rgba(196, 111, 127, 0.25)'; ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.moveTo(0, -100); ctx.lineTo(0, 100); ctx.stroke(); ctx.setLineDash([]);
        }
        ctx.save(); traceSmoothClosedCurve(ctx, headPts); ctx.clip();
        drawFaceAll(ctx, state.face, state.craft, 1.0, true);
        ctx.restore();
      }
      ctx.restore();
    } else if (state.step === 2) {
      // 3. 缝合翻面 + 弹性塞棉（真实 rAF 翻面与 Q 弹动画）
      ctx.save(); ctx.translate(cx, cy);
      const pts = generateSmoothHeadPoints(state.body, 1.0);
      if (state.subTab === 'sew') {
        if (state.craft.turned) {
          const flipX = runtime.flipAnim > 0.01 ? Math.max(0.08, Math.abs(Math.cos(runtime.flipAnim * Math.PI))) : 1;
          ctx.scale(flipX, 1);
          fillPlushShape(ctx, pts, state.body.skinColor, state.body.fabricType, 28);
          ctx.save(); traceSmoothClosedCurve(ctx, pts); ctx.clip();
          drawFaceAll(ctx, state.face, state.craft, 1.0, true);
          ctx.restore();
          ctx.fillStyle = '#4B7A66'; ctx.font = '800 12px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('已由返口翻至正面，可切换“塞棉”', 0, 118);
        } else {
          fillPlushShape(ctx, pts, state.body.skinColor, state.body.fabricType, 0);
          ctx.save();
          if (!state.craft.aligned) ctx.translate(runtime.unalignedOffset.x, runtime.unalignedOffset.y);
          fillPlushShape(ctx, pts, state.body.skinColor, state.body.fabricType, 0);
          if (!state.craft.aligned) {
            ctx.fillStyle = '#B85D6C'; ctx.font = '800 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('拖动上层布片对齐（或点底部对齐）', 0, 0);
          } else {
            pts.forEach((p, i) => {
              const nxt = pts[(i + 1) % pts.length];
              const isOpen = i >= 20 && i <= 28;
              ctx.strokeStyle = isOpen ? '#6D9381' : (state.craft.sewSamples[i] ? state.craft.sewThreadColor : 'rgba(117,91,78,0.35)');
              ctx.lineWidth = isOpen ? 3 : (state.craft.sewSamples[i] ? 2.8 : 1.5);
              ctx.setLineDash(isOpen ? [3, 5] : [6, 3]);
              ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nxt.x, nxt.y); ctx.stroke();
            });
            ctx.setLineDash([]);
            ctx.fillStyle = '#433128'; ctx.font = '800 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`沿虚线走针缝合（留底口）· ${Math.round(state.craft.sewProgress * 100)}%`, 0, 0);
          }
          ctx.restore();
        }
      } else {
        // 塞棉蓬松 Q 弹动效
        const bounce = 1 + Math.sin(runtime.puffBounce * Math.PI) * 0.08 + (state.craft.fillLevel / 100) * 0.06;
        ctx.scale(bounce, 2 - bounce * 0.99);
        fillPlushShape(ctx, pts, state.body.skinColor, state.body.fabricType, state.craft.fillLevel);
        ctx.save(); traceSmoothClosedCurve(ctx, pts); ctx.clip();
        drawFaceAll(ctx, state.face, state.craft, 1.0, true);
        ctx.restore();
        ctx.fillStyle = state.craft.closed ? '#4B7A66' : '#755B4E';
        ctx.font = '800 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(state.craft.closed ? '已塞满高弹PP棉并藏针封口' : `点击娃头塞入PP棉 · 饱满度 ${state.craft.fillLevel}%`, 0, 122);
      }
      ctx.restore();
    } else {
      // 4. 发型 / 5. 娃衣 / 6. 展示（在“绑骨摆姿”下显示可拖拽四肢骨架）
      const turn = state.step === 5 ? (state.showcase.turnAngle || 0) : 0;
      drawFullDoll(ctx, cx, cy + 16, 1.0, turn, true, true, true);
      if (state.step === 5 && state.subTab === 'pose' && state.pose.animClip === 'static') {
        drawSkeletonOverlay(ctx, cx, cy);
      }
    }
    // 橡皮擦笔刷预览圆环
    const isErasingUI =
      ((state.step === 0 && state.subTab === 'draw_face') || (state.step === 1 && state.subTab === 'emb')) && state.craft.embTool === 'eraser' ||
      (state.step === 3 && state.subTab === 'draw_hair' && state.hairDraw.tool === 'eraser') ||
      (state.step === 4 && state.subTab === 'draw_cloth' && state.outfitDraw.tool === 'eraser') ||
      (state.step === 5 && state.subTab === 'draw_acc' && state.accDraw.tool === 'eraser');
    if (isErasingUI) {
      ctx.save();
      ctx.strokeStyle = 'rgba(196, 111, 127, 0.85)'; ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
      ctx.lineWidth = 1.5 / Math.max(1, runtime.zoom); ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.arc(runtime.pointerPos.x, runtime.pointerPos.y, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore(); // 结束摄像机缩放/平移矩阵
  }


  function animLoop(ts) {
    if (runtime.flipAnim > 0) runtime.flipAnim = Math.max(0, runtime.flipAnim - 0.055);
    if (runtime.puffBounce > 0) runtime.puffBounce = Math.max(0, runtime.puffBounce - 0.07);
    stepSpineRigAnimation((ts || performance.now()) * 0.001);
    renderScene();
    requestAnimationFrame(animLoop);
  }

  /* =========================================================================
   * 7. 手绘 Canvas 缩略图生成器（0 Emoji，告别纯文字盲选）
   * ========================================================================= */
  function makeThumbCanvas(kind, item) {
    const cvs = document.createElement('canvas');
    cvs.width = 40; cvs.height = 32;
    const c = cvs.getContext('2d');
    c.save(); c.translate(20, 16);
    if (item.id === 'none') {
      c.strokeStyle = '#A48D7E'; c.lineWidth = 1.6; c.setLineDash([3, 3]);
      c.beginPath(); c.arc(0, 0, 9, 0, Math.PI * 2); c.stroke();
      c.setLineDash([]); c.beginPath(); c.moveTo(-6, -6); c.lineTo(6, 6); c.stroke();
    } else if (kind === 'eye') {
      const f = { ...state.face, eyeStyle: item.id, eyeSpacing: 0, eyeY: 0, eyeSize: 0.72, browStyle: 'none', noseStyle: 'none', mouthStyle: 'none', blushStyle: 'none', marks: {} };
      // 只画单眼
      c.save();
      if (item.id === 'smile') { c.strokeStyle = f.eyeColorL; c.lineWidth = 2.6; c.beginPath(); c.arc(0, 4, 9, Math.PI * 1.12, Math.PI * 1.88); c.stroke(); }
      else if (item.id === 'closed') { c.strokeStyle = f.eyeColorL; c.lineWidth = 2.4; c.beginPath(); c.arc(0, -3, 9, Math.PI * 0.14, Math.PI * 0.86); c.stroke(); }
      else if (item.id === 'button') { c.fillStyle = f.eyeColorL; c.beginPath(); c.arc(0, 0, 6, 0, Math.PI * 2); c.fill(); c.fillStyle = '#FFF'; c.beginPath(); c.arc(-2, -2, 2, 0, Math.PI * 2); c.fill(); }
      else {
        const rx = item.id === 'fox' ? 11 : 9.5, ry = item.id === 'fox' ? 6.5 : 9.5;
        c.fillStyle = f.eyeColorL; c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = shadeHex(f.eyeColorL, -0.5); c.beginPath(); c.arc(0, 0.5, 4, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#FFF'; c.beginPath(); c.arc(-3, -3, 2.5, 0, Math.PI * 2); c.fill();
        if (item.id === 'star') { drawStarPath(c, 0, 0, 5, 4.5, 2); c.fill(); }
      }
      c.restore();
    } else if (kind === 'brow') {
      c.strokeStyle = state.face.browColor; c.fillStyle = state.face.browColor; c.lineWidth = 2.4; c.lineCap = 'round';
      if (item.id === 'dot') { c.beginPath(); c.ellipse(0, 0, 5, 3.8, 0, 0, Math.PI * 2); c.fill(); }
      else if (item.id === 'straight') { c.beginPath(); c.moveTo(-11, 0); c.lineTo(11, 0); c.stroke(); }
      else if (item.id === 'worried') { c.beginPath(); c.moveTo(-10, -4); c.quadraticCurveTo(0, -1, 10, 4); c.stroke(); }
      else if (item.id === 'sharp') { c.beginPath(); c.moveTo(-11, 3); c.lineTo(2, -3); c.lineTo(11, 0); c.stroke(); }
      else if (item.id === 'raised') { c.beginPath(); c.moveTo(-10, 2); c.quadraticCurveTo(2, -6, 11, -1); c.stroke(); }
      else { c.beginPath(); c.moveTo(-11, 2); c.quadraticCurveTo(0, -4, 11, 2); c.stroke(); }
    } else if (kind === 'mouth') {
      c.strokeStyle = state.face.mouthColor; c.fillStyle = state.face.mouthColor; c.lineWidth = 2.2; c.lineCap = 'round';
      if (item.id === 'cat') { c.beginPath(); c.arc(-5, -1, 5, 0.2, 2.9); c.arc(5, -1, 5, 0.2, 2.9); c.stroke(); }
      else if (item.id === 'pout') { c.beginPath(); c.ellipse(0, 0, 5.5, 3.5, 0, 0, Math.PI * 2); c.fill(); }
      else if (item.id === 'happy') { c.beginPath(); c.arc(0, -3, 8, 0, Math.PI); c.closePath(); c.fill(); }
      else if (item.id === 'sad') { c.beginPath(); c.arc(0, 6, 7.5, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
      else if (item.id === 'oh') { c.beginPath(); c.ellipse(0, 0, 4, 5.5, 0, 0, Math.PI * 2); c.stroke(); }
      else { c.beginPath(); c.arc(0, -3, 7.5, 0.3, Math.PI - 0.3); c.stroke(); }
    } else if (kind === 'acc') {
      c.scale(0.36, 0.36);
      drawAccessoryItem(c, { ...item, x: 0, y: 0, scale: 1, rot: 0 }, 0, false);
    }
    c.restore();
    return cvs;
  }

  function addColorRow(container, label, currentHex, swatches, onChange) {
    const row = document.createElement('div'); row.className = 'color-row';
    const lbl = document.createElement('span'); lbl.className = 'color-row-label'; lbl.textContent = label;
    row.appendChild(lbl);

    // 任意自由色盘取色器
    const wrap = document.createElement('label'); wrap.className = 'color-picker-wrap'; wrap.title = '打开自由色盘';
    const dot = document.createElement('span'); dot.className = 'color-picker-dot'; dot.style.background = currentHex;
    const inp = document.createElement('input'); inp.type = 'color'; inp.value = currentHex;
    inp.oninput = (e) => { dot.style.background = e.target.value; onChange(e.target.value, false); };
    inp.onchange = (e) => { onChange(e.target.value, true); historyMgr.snapshot(); scheduleSave(); };
    wrap.appendChild(dot); wrap.appendChild(inp);
    row.appendChild(wrap);

    swatches.forEach(hex => {
      const b = document.createElement('button'); b.type = 'button';
      b.className = `swatch-btn ${currentHex.toLowerCase() === hex.toLowerCase() ? 'active' : ''}`;
      b.style.background = hex;
      b.onclick = () => { onChange(hex, true); sfx.playPop(580); historyMgr.snapshot(); scheduleSave(); renderDock(); };
      row.appendChild(b);
    });
    container.appendChild(row);
  }

  function addSliders(container, specs) {
    const grid = document.createElement('div'); grid.className = 'slider-grid';
    specs.forEach(sp => {
      const it = document.createElement('div'); it.className = 'slider-item';
      const lbl = document.createElement('span'); lbl.className = 'slider-lbl'; lbl.textContent = sp.label;
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = sp.min; inp.max = sp.max; inp.step = sp.step || 0.01; inp.value = sp.val;
      inp.oninput = (e) => sp.onInput(parseFloat(e.target.value));
      inp.onchange = () => { historyMgr.snapshot(); scheduleSave(); };
      it.appendChild(lbl); it.appendChild(inp);
      grid.appendChild(it);
    });
    container.appendChild(grid);
  }

  function addCard(scroll, { title, sub, active, thumb, onClick }) {
    const card = document.createElement('div');
    card.className = `option-card ${active ? 'active' : ''}`;
    if (thumb) card.appendChild(thumb);
    const t = document.createElement('div'); t.className = 'opt-title'; t.textContent = title; card.appendChild(t);
    if (sub) { const s = document.createElement('div'); s.className = 'opt-sub'; s.textContent = sub; card.appendChild(s); }
    card.onclick = () => { onClick(); sfx.playPop(540); historyMgr.snapshot(); scheduleSave(); renderDock(); };
    scroll.appendChild(card);
  }

  // 统一专业手绘工具栏（画笔 / 填充笔 / 喷枪+强度阈值 / 正圆 / 椭圆 / 珠点 / 取色器 / 橡皮擦）
  function renderProDrawToolbar(body, cfg) {
    const curTool = cfg.getTool();
    const row = document.createElement('div'); row.className = 'color-row';
    const items = [
      ...(cfg.prefixChips || []),
      { lbl: '画笔', act: curTool === 'line', fn: () => cfg.setTool('line') },
      { lbl: '填充笔', act: curTool === 'fill', fn: () => cfg.setTool('fill') },
      { lbl: '喷枪', act: curTool === 'airbrush', fn: () => cfg.setTool('airbrush') },
      { lbl: '正圆', act: curTool === 'circle', fn: () => cfg.setTool('circle') },
      { lbl: '椭圆', act: curTool === 'ellipse', fn: () => cfg.setTool('ellipse') },
      { lbl: '珠点', act: curTool === 'dot', fn: () => cfg.setTool('dot') },
      ...(cfg.extraChips || []),
      { lbl: '取色器', act: curTool === 'eyedropper', fn: () => { cfg.setTool('eyedropper'); showToast('点击画布任意位置吸取颜色'); } },
      { lbl: '橡皮擦', act: curTool === 'eraser', fn: () => cfg.setTool('eraser') },
      { lbl: cfg.getMirror() ? '对称：开' : '对称：关', act: cfg.getMirror(), fn: () => cfg.setMirror(!cfg.getMirror()) },
      { lbl: '撤回', act: false, fn: cfg.onUndo },
      { lbl: '清空', act: false, fn: cfg.onClear }
    ];
    items.forEach(x => {
      const btn = document.createElement('button'); btn.type = 'button';
      btn.className = `toggle-chip ${x.act ? 'active' : ''}`;
      btn.textContent = x.lbl;
      btn.onclick = () => { x.fn(); sfx.playPop(); historyMgr.snapshot(); renderDock(); };
      row.appendChild(btn);
    });
    body.appendChild(row);

    const sliders = [{ label: '粗细', min: cfg.minW || 1.2, max: cfg.maxW || 14, step: 0.3, val: cfg.getWidth(), onInput: cfg.setWidth }];
    if (curTool === 'airbrush') {
      sliders.push({ label: '喷枪强', min: 0.06, max: 1.0, step: 0.02, val: cfg.getStrength(), onInput: cfg.setStrength });
    }
    addSliders(body, sliders);
    addColorRow(body, cfg.colorLabel || '画笔色', cfg.getColor(), cfg.swatches || CLOTH_SWATCHES, cfg.setColor);
  }

  function pickCanvasColorAt(sp) {
    try {
      const dprX = canvas.width / Math.max(1, runtime.w);
      const dprY = canvas.height / Math.max(1, runtime.h);
      const px = clamp(Math.round(sp.x * dprX), 0, canvas.width - 1);
      const py = clamp(Math.round(sp.y * dprY), 0, canvas.height - 1);
      const d = ctx.getImageData(px, py, 1, 1).data;
      return rgbToHex(d[0], d[1], d[2]);
    } catch (_) { return '#C46F7F'; }
  }

  function renderDock() {
    const tabs = STEP_TABS[state.step];
    if (!tabs.some(t => t.id === state.subTab)) state.subTab = tabs[0].id;

    document.querySelectorAll('#stepperBar .step-item').forEach((el, i) => {
      el.classList.toggle('active', i === state.step);
      el.classList.toggle('done', i < state.step);
    });

    const subTabsEl = document.getElementById('subTabs');
    subTabsEl.innerHTML = '';
    tabs.forEach(t => {
      const b = document.createElement('button'); b.type = 'button';
      b.className = `sub-tab ${state.subTab === t.id ? 'active' : ''}`;
      b.textContent = t.name;
      b.onclick = () => { state.subTab = t.id; sfx.playPop(520); renderDock(); };
      subTabsEl.appendChild(b);
    });

    const body = document.getElementById('dockBody');
    body.innerHTML = '';
    const f = state.face, b = state.body, tab = state.subTab;

    // 顶部 HUD 与快捷按钮
    const statusPill = document.getElementById('stageStatusPill');
    const quickBtn = document.getElementById('stageQuickBtn');
    const ctxBtn = document.getElementById('contextActionBtn');
    ctxBtn.style.display = 'none';

    if (state.step === 0) {
      statusPill.textContent = '自由捏脸 · 支持色盘与连续微调';
      quickBtn.style.display = 'inline-block'; quickBtn.textContent = '随机灵感';
      quickBtn.onclick = randomizeDoll;

      if (tab === 'face') {
        const sc = document.createElement('div'); sc.className = 'options-scroll';
        FACE_PRESETS.forEach(fp => addCard(sc, {
          title: fp.name,
          active: Math.abs(b.faceWidth - fp.faceWidth) < 0.02 && Math.abs(b.chinRound - fp.chinRound) < 0.05,
          onClick: () => { b.faceWidth = fp.faceWidth; b.cheekPlump = fp.cheekPlump; b.chinRound = fp.chinRound; }
        }));
        body.appendChild(sc);
