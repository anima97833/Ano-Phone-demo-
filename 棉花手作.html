              else { const it = { uid: 'a_' + Date.now() + '_' + ac.id, ...ac, scale: 1, rot: 0 }; state.accessories.push(it); state.selectedAccUid = it.uid; }
              updateSelectionToolbar();
            }
          });
        });
        body.appendChild(sc);
        const sel = state.accessories.find(x => x.uid === state.selectedAccUid);
        if (sel) addColorRow(body, '配饰色', sel.color || '#DF7A8A', CLOTH_SWATCHES, hex => sel.color = hex);
      } else if (tab === 'draw_acc') {
        statusPill.textContent = '手绘首饰：正圆/椭圆画耳环眼镜，喷枪画高光光晕';
        const d = state.accDraw;
        renderProDrawToolbar(body, {
          getTool: () => d.tool, setTool: v => d.tool = v,
          getMirror: () => d.mirror, setMirror: v => d.mirror = v,
          getWidth: () => d.width, setWidth: v => d.width = v, maxW: 12,
          getStrength: () => d.airStrength ?? 0.35, setStrength: v => d.airStrength = v,
          getColor: () => d.color, setColor: v => d.color = v,
          colorLabel: '首饰色', swatches: ['#E4B854', '#FFF6E3', '#DF7A8A', '#7AB4E0', '#9DC4B1', '#433128', '#C4474E'],
          onUndo: () => state.customAccStrokes.pop(),
          onClear: () => { state.customAccStrokes = []; }
        });
      } else {
        addSliders(body, [{ label: '转向', min: -18, max: 18, step: 1, val: state.showcase.turnAngle, onInput: v => state.showcase.turnAngle = v }]);
        const sc = document.createElement('div'); sc.className = 'options-scroll';
        BACKGROUNDS.forEach(bg => addCard(sc, { title: bg.name, active: state.showcase.background === bg.id, onClick: () => state.showcase.background = bg.id }));
        body.appendChild(sc);
      }
    }

    document.getElementById('prevStepBtn').style.visibility = state.step === 0 ? 'hidden' : 'visible';
    document.getElementById('nextStepBtn').textContent = state.step === 5 ? '生成出生证 ›' : '下一步 ›';
  }

  function randomizeDoll() {
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    const fp = pick(FACE_PRESETS);
    state.body.faceWidth = fp.faceWidth; state.body.cheekPlump = fp.cheekPlump; state.body.chinRound = fp.chinRound;
    state.body.ears = pick(EAR_TYPES).id;
    state.body.skinColor = pick(SKIN_SWATCHES.slice(0, 5));
    state.face.eyeStyle = pick(EYE_STYLES).id;
    state.face.eyeColorL = pick(EYE_SWATCHES);
    state.face.heterochromia = Math.random() < 0.25;
    state.face.eyeColorR = state.face.heterochromia ? pick(EYE_SWATCHES) : state.face.eyeColorL;
    state.face.browStyle = pick(BROW_STYLES).id;
    state.face.mouthStyle = pick(MOUTH_STYLES).id;
    state.face.noseStyle = pick(NOSE_STYLES).id;
    state.face.blushStyle = pick(BLUSH_STYLES.slice(1)).id;
    state.hair.backStyle = pick(HAIR_BACK_STYLES).id;
    state.hair.bangStyle = pick(HAIR_BANG_STYLES).id;
    state.hair.ahogeStyle = pick(AHOGE_STYLES).id;
    state.hair.mainColor = pick(HAIR_SWATCHES);
    state.face.browColor = shadeHex(state.hair.mainColor, -0.15);
    state.outfit.mainColor = pick(CLOTH_SWATCHES);
    sfx.playChime(); historyMgr.snapshot(); scheduleSave(); renderDock();
  }

  /* =========================================================================
   * 9. 画布触控交互：双指缩放平移、滚轮缩放、五官拖拽、裁剪、镜像刺绣、缝合、配饰拖拽
   * ========================================================================= */
  function getScreenPt(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (runtime.w / r.width), y: (e.clientY - r.top) * (runtime.h / r.height) };
  }
  function getPt(e) {
    const sp = getScreenPt(e);
    const totalScale = runtime.zoom * getBaseFitScale();
    return {
      x: (sp.x - (runtime.cx + runtime.panX)) / totalScale + runtime.cx,
      y: (sp.y - (runtime.cy + runtime.panY)) / totalScale + runtime.cy
    };
  }

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    setCameraZoom(runtime.zoom * factor);
  }, { passive: false });

  canvas.addEventListener('pointerdown', (e) => {
    const sp = getScreenPt(e);
    runtime.pointers.set(e.pointerId, sp);
    canvas.setPointerCapture(e.pointerId);

    // 双指捏合缩放 & 平移
    if (runtime.pointers.size === 2) {
      const [p1, p2] = [...runtime.pointers.values()];
      runtime.pinchStartDist = Math.max(10, dist(p1.x, p1.y, p2.x, p2.y));
      runtime.pinchStartZoom = runtime.zoom;
      runtime.panStart = { x: (p1.x + p2.x) * 0.5, y: (p1.y + p2.y) * 0.5, panX: runtime.panX, panY: runtime.panY };
      runtime.pointerMode = 'pinch';
      runtime.pointerDown = true;
      return;
    }

    // 抓手平移模式
    if (runtime.panMode) {
      runtime.pointerDown = true;
      runtime.pointerMode = 'pan';
      runtime.panStart = { x: sp.x, y: sp.y, panX: runtime.panX, panY: runtime.panY };
      return;
    }

    const pt = getPt(e);
    runtime.pointerDown = true; runtime.pointerPos = pt;
    const cx = runtime.cx, cy = runtime.cy;

    if (state.step === 0) {
      const j = getSkeletonJoints(state.body.bodyType === 'slender');
      const headY = cy + 16 + j.actualHeadY;
      const sc = j.faceScale, f = state.face;
      if (state.subTab === 'sculpt') {
        runtime.pointerMode = 'sculpt-face';
        const lx = (pt.x - cx) / sc, ly = (pt.y - headY) / sc;
        if (state.sculptUI.brush !== 'move') applyNomadSculptBrush(lx, ly, 0, 0);
        return;
      }
      if (state.subTab === 'draw_face') {
        const lx = (pt.x - cx) / sc, ly = (pt.y - headY) / sc;
        if (state.craft.embTool === 'eyedropper') {
          const picked = pickCanvasColorAt(sp);
          state.craft.embColor = picked; state.craft.embTool = 'line';
          sfx.playPop(720); showToast(`已吸取颜色 ${picked}`); renderDock(); return;
        }
        if (state.craft.embTool === 'eraser') {
          runtime.pointerMode = 'erase-face';
          eraseStrokesAt(state.craft.freeStrokes, lx, ly, 12 / sc, state.craft.mirrorEmbroidery);
          return;
        }
        if (Math.hypot(lx, ly) < 108) {
          runtime.pointerMode = 'draw-face';
          const isShape = state.craft.embTool === 'circle' || state.craft.embTool === 'ellipse';
          state.craft.freeStrokes.push({
            color: state.craft.embColor, width: state.craft.embWidth,
            strength: state.craft.airStrength ?? 0.35,
            type: state.craft.embTool, mirror: state.craft.mirrorEmbroidery,
            points: isShape ? [{ x: lx, y: ly }, { x: lx, y: ly }] : [{ x: lx, y: ly }]
          });
          sfx.playStitch();
        }
        return;
      }
      if (dist(pt.x, pt.y, cx + f.eyeSpacing * sc, headY + f.eyeY * sc) < 22 || dist(pt.x, pt.y, cx - f.eyeSpacing * sc, headY + f.eyeY * sc) < 22) { runtime.pointerMode = 'drag-eye'; return; }
      if (dist(pt.x, pt.y, cx - f.browSpacing * sc, headY + (f.eyeY + f.browY) * sc) < 20 || dist(pt.x, pt.y, cx + f.browSpacing * sc, headY + (f.eyeY + f.browY) * sc) < 20) { runtime.pointerMode = 'drag-brow'; return; }
      if (dist(pt.x, pt.y, cx, headY + f.mouthY * sc) < 20) { runtime.pointerMode = 'drag-mouth'; return; }
    } else if (state.step === 1) {
      if (state.subTab === 'cut') { runtime.pointerMode = 'cut'; hitCut(pt); }
      else {
        const lx = pt.x - cx, ly = pt.y - cy;
        if (state.craft.embTool === 'eyedropper') {
          const picked = pickCanvasColorAt(sp);
          state.craft.embColor = picked; state.craft.embTool = 'line';
          sfx.playPop(720); showToast(`已吸取颜色 ${picked}`); renderDock(); return;
        }
        if (state.craft.embTool === 'eraser') {
          runtime.pointerMode = 'erase-emb';
          eraseStrokesAt(state.craft.freeStrokes, lx, ly, 12, state.craft.mirrorEmbroidery);
          return;
        }
        if (Math.hypot(lx, ly) < 98) {
          runtime.pointerMode = 'emb';
          const isShape = state.craft.embTool === 'circle' || state.craft.embTool === 'ellipse';
          state.craft.freeStrokes.push({
            color: state.craft.embColor, width: state.craft.embWidth,
            strength: state.craft.airStrength ?? 0.35,
            type: state.craft.embTool, mirror: state.craft.mirrorEmbroidery,
            points: isShape ? [{ x: lx, y: ly }, { x: lx, y: ly }] : [{ x: lx, y: ly }]
          });
          sfx.playStitch();
        }
      }
    } else if (state.step === 2) {
      if (state.subTab === 'sew') {
        if (!state.craft.aligned) runtime.pointerMode = 'align';
        else if (!state.craft.turned) { runtime.pointerMode = 'sew'; hitSew(pt); }
      } else {
        if (dist(pt.x, pt.y, cx, cy) < 115) {
          if (state.craft.fillLevel < 100) {
            state.craft.fillLevel = Math.min(100, state.craft.fillLevel + 20);
            runtime.puffBounce = 1.0; sfx.playStuff(); renderDock();
          } else if (!state.craft.closed) {
            state.craft.closed = true; sfx.playChime(); showToast('藏针封口完成！'); renderDock();
          }
        }
      }
    } else if (state.step === 3 && state.subTab === 'draw_hair') {
      const d = state.hairDraw;
      if (d.tool === 'eyedropper') {
        const picked = pickCanvasColorAt(sp);
        d.color = picked; d.tool = 'line';
        sfx.playPop(720); showToast(`已吸取颜色 ${picked}`); renderDock(); return;
      }
      const j = getSkeletonJoints(state.body.bodyType === 'slender');
      const headY = cy + 16 + j.actualHeadY;
      const arr = d.layer === 'front' ? state.hair.customFrontStrokes : state.hair.customBackStrokes;
      const hx = (pt.x - cx) / HEAD_SCALE, hy = (pt.y - headY) / HEAD_SCALE;
      if (d.tool === 'eraser') {
        runtime.pointerMode = 'erase-hair';
        eraseStrokesAt(arr, hx, hy, 14 / HEAD_SCALE, d.mirror);
        return;
      }
      runtime.pointerMode = 'draw-hair';
      const isShape = d.tool === 'circle' || d.tool === 'ellipse';
      arr.push({
        color: d.color, width: d.width, strength: d.airStrength ?? 0.35, type: d.tool, mirror: d.mirror,
        points: isShape ? [{ x: hx, y: hy }, { x: hx, y: hy }] : [{ x: hx, y: hy }]
      });
      sfx.playPop(580, 0.04);
    } else if (state.step === 4 && state.subTab === 'draw_cloth') {
      const d = state.outfitDraw;
      if (d.tool === 'eyedropper') {
        const picked = pickCanvasColorAt(sp);
        d.color = picked; d.tool = 'line';
        sfx.playPop(720); showToast(`已吸取颜色 ${picked}`); renderDock(); return;
      }
      const lx = pt.x - cx, ly = pt.y - (cy + 16);
      if (d.tool === 'eraser') {
        runtime.pointerMode = 'erase-cloth';
        eraseStrokesAt(state.outfit.customStrokes, lx, ly, 13, d.mirror);
        return;
      }
      runtime.pointerMode = 'draw-cloth';
      const isShape = d.tool === 'circle' || d.tool === 'ellipse';
      state.outfit.customStrokes.push({
        color: d.color, width: d.width, strength: d.airStrength ?? 0.35, type: d.tool, mirror: d.mirror,
        points: isShape ? [{ x: lx, y: ly }, { x: lx, y: ly }] : [{ x: lx, y: ly }]
      });
      sfx.playPop(560, 0.04);
    } else if (state.step === 5) {
      if (state.subTab === 'pose') {
        if (state.pose.animClip !== 'static') return;
        const hds = getBoneHandlesWorld(cx, cy);
        for (const [k, h] of Object.entries(hds)) {
          if (dist(pt.x, pt.y, h.x, h.y) < 28) {
            runtime.pointerMode = 'drag-bone';
            runtime.activeTarget = k;
            sfx.playPop(660, 0.04);
            return;
          }
        }
        return;
      }
      if (state.subTab === 'draw_acc') {
        const d = state.accDraw;
        if (d.tool === 'eyedropper') {
          const picked = pickCanvasColorAt(sp);
          d.color = picked; d.tool = 'line';
          sfx.playPop(720); showToast(`已吸取颜色 ${picked}`); renderDock(); return;
        }
        const turnShift = ((state.showcase.turnAngle || 0) / 18) * 16 * 0.65;
        const lx = pt.x - cx - turnShift, ly = pt.y - (cy + 16);
        if (d.tool === 'eraser') {
          runtime.pointerMode = 'erase-acc';
          eraseStrokesAt(state.customAccStrokes, lx, ly, 13, d.mirror);
          return;
        }
        runtime.pointerMode = 'draw-acc';
        const isShape = d.tool === 'circle' || d.tool === 'ellipse';
        state.customAccStrokes.push({
          color: d.color, width: d.width, strength: d.airStrength ?? 0.35, type: d.tool, mirror: d.mirror,
          points: isShape ? [{ x: lx, y: ly }, { x: lx, y: ly }] : [{ x: lx, y: ly }]
        });
        sfx.playPop(640, 0.04);
        return;
      }
      const turnShift = ((state.showcase.turnAngle || 0) / 18) * 16 * 0.65;
      for (let i = state.accessories.length - 1; i >= 0; i--) {
        const ac = state.accessories[i];
        const ax = cx + (ac.x + turnShift), ay = cy + 16 + ac.y;
        if (dist(pt.x, pt.y, ax, ay) < 38) {
          state.selectedAccUid = ac.uid; runtime.activeTarget = ac; runtime.pointerMode = 'drag-acc';
          updateSelectionToolbar(); renderDock(); return;
        }
      }
      state.selectedAccUid = null; updateSelectionToolbar(); renderDock();
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const sp = getScreenPt(e);
    if (runtime.pointers.has(e.pointerId)) runtime.pointers.set(e.pointerId, sp);
    const prevPt = runtime.pointerPos;
    const curPt = getPt(e);
    runtime.pointerPos = curPt;
    if (!runtime.pointerDown) return;

    if (runtime.pointerMode === 'pinch' && runtime.pointers.size === 2 && runtime.panStart) {
      const [p1, p2] = [...runtime.pointers.values()];
      const curD = Math.max(10, dist(p1.x, p1.y, p2.x, p2.y));
      const midX = (p1.x + p2.x) * 0.5, midY = (p1.y + p2.y) * 0.5;
      runtime.panX = runtime.panStart.panX + (midX - runtime.panStart.x);
      runtime.panY = runtime.panStart.panY + (midY - runtime.panStart.y);
      setCameraZoom(runtime.pinchStartZoom * (curD / runtime.pinchStartDist));
      return;
    }
    if (runtime.pointerMode === 'pan' && runtime.panStart) {
      const limX = runtime.w * 0.5 * Math.max(1, runtime.zoom);
      const limY = runtime.h * 0.5 * Math.max(1, runtime.zoom);
      runtime.panX = clamp(runtime.panStart.panX + (sp.x - runtime.panStart.x), -limX, limX);
      runtime.panY = clamp(runtime.panStart.panY + (sp.y - runtime.panStart.y), -limY, limY);
      return;
    }

    const pt = curPt;
    const cx = runtime.cx, cy = runtime.cy;
    const j = getSkeletonJoints(state.body.bodyType === 'slender');
    const headY = cy + 16 + j.actualHeadY;
    const sc = j.faceScale, f = state.face;
    const minStep = Math.max(1.2, 3.0 / runtime.zoom);

    if (runtime.pointerMode === 'erase-face') {
      eraseStrokesAt(state.craft.freeStrokes, (pt.x - cx) / sc, (pt.y - headY) / sc, 12 / sc, state.craft.mirrorEmbroidery);
    } else if (runtime.pointerMode === 'erase-emb') {
      eraseStrokesAt(state.craft.freeStrokes, pt.x - cx, pt.y - cy, 12, state.craft.mirrorEmbroidery);
    } else if (runtime.pointerMode === 'erase-hair') {
      const d = state.hairDraw;
      const arr = d.layer === 'front' ? state.hair.customFrontStrokes : state.hair.customBackStrokes;
      eraseStrokesAt(arr, (pt.x - cx) / HEAD_SCALE, (pt.y - headY) / HEAD_SCALE, 14 / HEAD_SCALE, d.mirror);
    } else if (runtime.pointerMode === 'erase-cloth') {
      eraseStrokesAt(state.outfit.customStrokes, pt.x - cx, pt.y - (cy + 16), 13, state.outfitDraw.mirror);
    } else if (runtime.pointerMode === 'erase-acc') {
      const turnShift = ((state.showcase.turnAngle || 0) / 18) * 16 * 0.65;
      eraseStrokesAt(state.customAccStrokes, pt.x - cx - turnShift, pt.y - (cy + 16), 13, state.accDraw.mirror);
    } else if (runtime.pointerMode === 'sculpt-face') {
      const lx = (pt.x - cx) / sc, ly = (pt.y - headY) / sc;
      const mdx = (pt.x - prevPt.x) / sc, mdy = (pt.y - prevPt.y) / sc;
      applyNomadSculptBrush(lx, ly, mdx, mdy);
    } else if (runtime.pointerMode === 'draw-face') {
      const cur = state.craft.freeStrokes[state.craft.freeStrokes.length - 1];
      if (cur && cur.type !== 'dot') {
        const lx = (pt.x - cx) / sc, ly = (pt.y - headY) / sc;
        if (cur.type === 'circle' || cur.type === 'ellipse') { cur.points[1] = { x: lx, y: ly }; }
        else {
          const last = cur.points[cur.points.length - 1];
          const stepD = cur.type === 'airbrush' ? Math.max(3, cur.width * 0.65) : minStep;
          if (Math.hypot(lx, ly) < 105 && dist(lx, ly, last.x, last.y) > stepD) { cur.points.push({ x: lx, y: ly }); if (cur.type !== 'airbrush') sfx.playStitch(); }
        }
      }
    } else if (runtime.pointerMode === 'draw-hair') {
      const d = state.hairDraw;
      const arr = d.layer === 'front' ? state.hair.customFrontStrokes : state.hair.customBackStrokes;
      const cur = arr[arr.length - 1];
      if (cur && cur.type !== 'dot') {
        const lx = (pt.x - cx) / HEAD_SCALE, ly = (pt.y - headY) / HEAD_SCALE;
        if (cur.type === 'circle' || cur.type === 'ellipse') { cur.points[1] = { x: lx, y: ly }; }
        else {
          const last = cur.points[cur.points.length - 1];
          const stepD = cur.type === 'airbrush' ? Math.max(3.5, cur.width * 0.65) : minStep;
          if (dist(lx, ly, last.x, last.y) > stepD) cur.points.push({ x: lx, y: ly });
        }
      }
    } else if (runtime.pointerMode === 'drag-bone' && runtime.activeTarget) {
      const hds = getBoneHandlesWorld(cx, cy);
      const k = runtime.activeTarget;
      const h = hds[k];
      if (h) {
        if (k === 'head') {
          const ang = Math.atan2(pt.x - h.px, -(pt.y - h.py));
          state.pose.headTilt = clamp(ang, -0.35, 0.35);
        } else {
          // 肢体自然下垂为 0，顺时针为正，逆时针为负
          const ang = Math.atan2(-(pt.x - h.px), pt.y - h.py);
          if (k === 'leftArm') state.pose.leftArm = clamp(ang, -0.9, 2.4);
          else if (k === 'rightArm') state.pose.rightArm = clamp(ang, -2.4, 0.9);
          else if (k === 'leftLeg') state.pose.leftLeg = clamp(ang, -0.65, 0.95);
          else if (k === 'rightLeg') state.pose.rightLeg = clamp(ang, -0.95, 0.65);
        }
      }
    } else if (runtime.pointerMode === 'draw-cloth') {
      const cur = state.outfit.customStrokes[state.outfit.customStrokes.length - 1];
      if (cur && cur.type !== 'dot') {
        const lx = pt.x - cx, ly = pt.y - (cy + 16);
        if (cur.type === 'circle' || cur.type === 'ellipse') { cur.points[1] = { x: lx, y: ly }; }
        else {
          const last = cur.points[cur.points.length - 1];
          const stepD = cur.type === 'airbrush' ? Math.max(3.5, cur.width * 0.65) : minStep;
          if (dist(lx, ly, last.x, last.y) > stepD) cur.points.push({ x: lx, y: ly });
        }
      }
    } else if (runtime.pointerMode === 'draw-acc') {
      const cur = state.customAccStrokes[state.customAccStrokes.length - 1];
      if (cur && cur.type !== 'dot') {
        const turnShift = ((state.showcase.turnAngle || 0) / 18) * 16 * 0.65;
        const lx = pt.x - cx - turnShift, ly = pt.y - (cy + 16);
        if (cur.type === 'circle' || cur.type === 'ellipse') { cur.points[1] = { x: lx, y: ly }; }
        else {
          const last = cur.points[cur.points.length - 1];
          const stepD = cur.type === 'airbrush' ? Math.max(3.5, cur.width * 0.65) : minStep;
          if (dist(lx, ly, last.x, last.y) > stepD) cur.points.push({ x: lx, y: ly });
        }
      }
    } else if (runtime.pointerMode === 'drag-eye') {
      f.eyeSpacing = clamp(Math.round(Math.abs(pt.x - cx) / sc), 28, 54);
      f.eyeY = clamp(Math.round((pt.y - headY) / sc), -12, 20);
    } else if (runtime.pointerMode === 'drag-brow') {
      f.browSpacing = clamp(Math.round(Math.abs(pt.x - cx) / sc), 26, 54);
      f.browY = clamp(Math.round((pt.y - headY) / sc - f.eyeY), -38, -14);
    } else if (runtime.pointerMode === 'drag-mouth') {
      f.mouthY = clamp(Math.round((pt.y - headY) / sc), 20, 46);
    } else if (runtime.pointerMode === 'cut') {
      hitCut(pt);
    } else if (runtime.pointerMode === 'emb') {
      const cur = state.craft.freeStrokes[state.craft.freeStrokes.length - 1];
      if (cur && cur.type !== 'dot') {
        const lx = pt.x - cx, ly = pt.y - cy;
        if (cur.type === 'circle' || cur.type === 'ellipse') { cur.points[1] = { x: lx, y: ly }; }
        else {
          const last = cur.points[cur.points.length - 1];
          const stepD = cur.type === 'airbrush' ? Math.max(3, cur.width * 0.65) : Math.max(1.4, 3.2 / runtime.zoom);
          if (Math.hypot(lx, ly) < 96 && dist(lx, ly, last.x, last.y) > stepD) { cur.points.push({ x: lx, y: ly }); if (cur.type !== 'airbrush') sfx.playStitch(); }
        }
      }
    } else if (runtime.pointerMode === 'align') {
      runtime.unalignedOffset.x = clamp(pt.x - cx, -38, 38);
      runtime.unalignedOffset.y = clamp(pt.y - cy, -38, 38);
      if (Math.hypot(runtime.unalignedOffset.x, runtime.unalignedOffset.y) < 14) {
        state.craft.aligned = true; sfx.playPop(640); showToast('正反布片已对齐，请沿线缝合！'); renderDock();
      }
    } else if (runtime.pointerMode === 'sew') {
      hitSew(pt);
    } else if (runtime.pointerMode === 'drag-acc' && runtime.activeTarget) {
      runtime.activeTarget.x = clamp(pt.x - cx, -135, 135);
      runtime.activeTarget.y = clamp(pt.y - (cy + 16), -165, 145);
    }
  });

  const endPtr = (e) => {
    if (e && e.pointerId !== undefined) runtime.pointers.delete(e.pointerId);
    if (runtime.pointers.size > 0) return;
    if (!runtime.pointerDown) return;
    const wasDraw = runtime.pointerMode !== 'pan' && runtime.pointerMode !== 'pinch' && runtime.pointerMode !== 'idle';
    runtime.pointerDown = false; runtime.pointerMode = 'idle'; runtime.activeTarget = null; runtime.panStart = null;
    if (wasDraw) { historyMgr.snapshot(); scheduleSave(); }
  };
  canvas.addEventListener('pointerup', endPtr);
  canvas.addEventListener('pointercancel', endPtr);

  function hitCut(pt) {
    const outer = generateSmoothHeadPoints(state.body, 1.08);
    const lx = pt.x - runtime.cx, ly = pt.y - runtime.cy;
    let ch = false;
    outer.forEach((p, i) => { if (!state.craft.cutSamples[i] && dist(lx, ly, p.x, p.y) < 28) { state.craft.cutSamples[i] = true; ch = true; } });
    if (ch) {
      sfx.playSnip();
      state.craft.cutProgress = state.craft.cutSamples.filter(Boolean).length / outer.length;
      if (state.craft.cutProgress >= 0.85) {
        state.craft.cutSamples = outer.map(() => true); state.craft.cutProgress = 1;
        sfx.playChime(); showToast('纸样裁剪完成！可切到“绣绷自由绣”');
      }
    }
  }
  function hitSew(pt) {
    const pts = generateSmoothHeadPoints(state.body, 1.0);
    const lx = pt.x - runtime.cx, ly = pt.y - runtime.cy;
    let ch = false, tot = 0, cnt = 0;
    pts.forEach((p, i) => {
      if (i >= 20 && i <= 28) return;
      tot++;
      if (!state.craft.sewSamples[i] && dist(lx, ly, p.x, p.y) < 26) { state.craft.sewSamples[i] = true; ch = true; }
      if (state.craft.sewSamples[i]) cnt++;
    });
    if (ch) {
      sfx.playStitch();
      state.craft.sewProgress = cnt / Math.max(1, tot);
      if (state.craft.sewProgress >= 0.85) {
        state.craft.sewProgress = 1; sfx.playChime(); showToast('缝合完成，点底部“由返口翻至正面”！'); renderDock();
      }
    }
  }

  /* =========================================================================
   * 10. 出生证高清离屏导出（同步完整星空/格子背景）与娃柜管理
   * ========================================================================= */
  function updateSelectionToolbar() {
    const bar = document.getElementById('selectionToolbar');
    bar.classList.toggle('show', Boolean(state.step === 5 && state.accessories.some(a => a.uid === state.selectedAccUid)));
  }

  async function generatePoster() {
    state.showcase.name = document.getElementById('dollNameInput').value.trim() || '奶糖小兔';
    state.showcase.note = document.getElementById('dollNoteInput').value.trim() || '一针一线亲手缝制的小可爱。';

    const off = document.createElement('canvas');
    off.width = 900; off.height = 1240;
    const c = off.getContext('2d');

    c.fillStyle = '#FAF5EE'; c.fillRect(0, 0, 900, 1240);
    c.strokeStyle = '#D9C3B0'; c.lineWidth = 4; c.strokeRect(26, 26, 848, 1188);
    c.strokeStyle = '#C46F7F'; c.lineWidth = 2; c.setLineDash([10, 6]); c.strokeRect(40, 40, 820, 1160); c.setLineDash([]);

    // 完整背景（包含星空星点与格子垫）
    c.save(); c.beginPath(); c.roundRect(70, 72, 760, 760, 24); c.clip();
    c.translate(70, 72);
    drawShowcaseBg(c, 760, 760, state.showcase.background);
    drawFullDoll(c, 380, 400, 2.15, state.showcase.turnAngle || 0, true, true, false);
    c.restore();
    c.strokeStyle = '#E4D4C3'; c.lineWidth = 3;
    c.beginPath(); c.roundRect(70, 72, 760, 760, 24); c.stroke();

    c.fillStyle = '#433128'; c.font = '800 40px "PingFang SC", sans-serif'; c.textAlign = 'left';
    c.fillText(state.showcase.name, 78, 904);
    c.fillStyle = '#C46F7F'; c.beginPath(); c.roundRect(686, 862, 138, 54, 14); c.fill();
    c.fillStyle = '#FFF'; c.font = '800 21px "PingFang SC", sans-serif'; c.textAlign = 'center';
    c.fillText('15cm手作娃', 755, 896);

    const fb = FABRIC_TYPES.find(x => x.id === state.body.fabricType) || FABRIC_TYPES[0];
    const d = new Date();
    const ds = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    c.textAlign = 'left'; c.fillStyle = '#755B4E'; c.font = '700 22px "PingFang SC", sans-serif';
    c.fillText(`体型：${state.body.bodyType === 'slender' ? '修长比例 1:1.8' : '奶团Q版 1:1.5'}   |   诞生日：${ds}`, 78, 956);
    c.fillText(`面料：${fb.name}   |   ${state.face.heterochromia ? '双色异瞳' : '精绣双眸'}`, 78, 994);

    c.fillStyle = '#FFFDF9'; c.strokeStyle = '#E4D4C3'; c.lineWidth = 2;
    c.beginPath(); c.roundRect(78, 1026, 744, 132, 16); c.fill(); c.stroke();
    c.fillStyle = '#433128'; c.font = '600 23px "PingFang SC", sans-serif';
    const note = state.showcase.note;
    c.fillText(note.slice(0, 27), 102, 1080);
    if (note.length > 27) c.fillText(note.slice(27, 54), 102, 1122);

    const dataUrl = off.toDataURL('image/png');
    document.getElementById('posterImg').src = dataUrl;
    document.getElementById('namingModal').classList.remove('show');
    document.getElementById('posterModal').classList.add('show');
    sfx.playChime();

    await saveGallery({
      id: 'doll_' + Date.now(), name: state.showcase.name, sub: `${fb.name} · ${ds}`,
      dataUrl, snapshot: JSON.parse(JSON.stringify(state)), createdAt: Date.now()
    });
  }

  async function renderGallery() {
    const el = document.getElementById('galleryList');
    const items = await loadGallery();
    if (!items.length) {
      el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--brown-light);font-size:12px;">娃柜尚空，生成出生证后会自动收录在此。</div>';
      return;
    }
    el.innerHTML = '';
    items.forEach(it => {
      const row = document.createElement('div'); row.className = 'gallery-item';
      row.innerHTML = `<img class="gallery-thumb" src="${it.dataUrl}" alt="${it.name}">
        <div class="gallery-meta"><div class="gallery-title">${it.name}</div><div class="gallery-sub">${it.sub || ''}</div></div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <button type="button" class="small-pill-btn view-btn">查看</button>
          <button type="button" class="small-pill-btn load-btn accent">再编辑</button>
          <button type="button" class="small-pill-btn del-btn" style="color:#C94A4A;">删除</button>
        </div>`;
      row.querySelector('.view-btn').onclick = () => {
        document.getElementById('posterImg').src = it.dataUrl;
        document.getElementById('galleryModal').classList.remove('show');
        document.getElementById('posterModal').classList.add('show');
      };
      row.querySelector('.load-btn').onclick = () => {
        if (it.snapshot) { state = JSON.parse(JSON.stringify(it.snapshot)); state.step = 0; renderDock(); showToast(`已载入「${it.name}」`); }
        document.getElementById('galleryModal').classList.remove('show');
      };
      row.querySelector('.del-btn').onclick = async () => { await deleteGallery(it.id); renderGallery(); };
      el.appendChild(row);
    });
  }

  /* =========================================================================
   * 11. 全局事件绑定与启动
   * ========================================================================= */
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('stageToast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2100);
  }
  function goToStep(s) {
    state.step = clamp(s, 0, 5);
    updateSelectionToolbar(); scheduleSave(); renderDock(); sfx.playPop(560);
  }

  function bindEvents() {
    document.getElementById('undoBtn').onclick = () => historyMgr.undo();
    document.getElementById('redoBtn').onclick = () => historyMgr.redo();
    document.getElementById('zoomInBtn').onclick = () => { setCameraZoom(runtime.zoom * 1.25); sfx.playPop(620); };
    document.getElementById('zoomOutBtn').onclick = () => { setCameraZoom(runtime.zoom * 0.8); sfx.playPop(460); };
    document.getElementById('zoomPctLabel').onclick = () => { runtime.panX = 0; runtime.panY = 0; setCameraZoom(1); sfx.playPop(540); };
    document.getElementById('panModeBtn').onclick = () => {
      runtime.panMode = !runtime.panMode; updateZoomLabel();
      showToast(runtime.panMode ? '抓手平移已开启：拖动画布移动视角' : '已切回绘制/编辑模式');
    };
    document.getElementById('openGalleryBtn').onclick = () => { renderGallery(); document.getElementById('galleryModal').classList.add('show'); };
    document.getElementById('soundToggleBtn').onclick = (e) => { sfx.enabled = !sfx.enabled; e.currentTarget.style.opacity = sfx.enabled ? '1' : '0.4'; };
    document.getElementById('newProjectBtn').onclick = () => { state = createDefaultState(); historyMgr.snapshot(); scheduleSave(); renderDock(); showToast('已开启新娃娃设计台'); };

    document.querySelectorAll('#stepperBar .step-item').forEach(el => { el.onclick = () => goToStep(Number(el.dataset.step)); });
    document.getElementById('prevStepBtn').onclick = () => goToStep(state.step - 1);
    document.getElementById('nextStepBtn').onclick = () => {
      if (state.step === 5) {
        document.getElementById('dollNameInput').value = state.showcase.name || '奶糖小兔';
        document.getElementById('dollNoteInput').value = state.showcase.note || '';
        document.getElementById('namingModal').classList.add('show');
      } else goToStep(state.step + 1);
    };

    const withAcc = fn => {
      const ac = state.accessories.find(a => a.uid === state.selectedAccUid);
      if (!ac) return; fn(ac); historyMgr.snapshot(); scheduleSave();
    };
    document.getElementById('selScaleUpBtn').onclick = () => withAcc(a => a.scale = clamp((a.scale || 1) + 0.12, 0.5, 1.8));
    document.getElementById('selScaleDownBtn').onclick = () => withAcc(a => a.scale = clamp((a.scale || 1) - 0.12, 0.5, 1.8));
    document.getElementById('selRotLeftBtn').onclick = () => withAcc(a => a.rot = (a.rot || 0) - 0.2);
    document.getElementById('selRotRightBtn').onclick = () => withAcc(a => a.rot = (a.rot || 0) + 0.2);
    document.getElementById('selDeleteBtn').onclick = () => {
      state.accessories = state.accessories.filter(a => a.uid !== state.selectedAccUid);
      state.selectedAccUid = null; updateSelectionToolbar(); historyMgr.snapshot(); renderDock();
    };

    document.getElementById('closeNamingModalBtn').onclick = () => document.getElementById('namingModal').classList.remove('show');
    document.getElementById('generatePosterBtn').onclick = generatePoster;
    document.getElementById('closePosterModalBtn').onclick = () => document.getElementById('posterModal').classList.remove('show');
    document.getElementById('backToEditBtn').onclick = () => document.getElementById('posterModal').classList.remove('show');
    document.getElementById('makeAnotherBtn').onclick = () => { document.getElementById('posterModal').classList.remove('show'); state = createDefaultState(); historyMgr.snapshot(); renderDock(); };
    document.getElementById('downloadPngBtn').onclick = () => {
      const a = document.createElement('a'); a.href = document.getElementById('posterImg').src;
      a.download = `${state.showcase.name || '棉花娃娃'}_出生证.png`; a.click(); sfx.playPop(640);
    };
    document.getElementById('closeGalleryModalBtn').onclick = () => document.getElementById('galleryModal').classList.remove('show');
  }

  async function init() {
    resizeCanvas(); bindEvents();
    const saved = await loadLatest();
    if (saved && saved.version === 5 && saved.face && saved.body) {
      const def = createDefaultState();
      state = {
        ...def, ...saved,
        body: { ...def.body, ...saved.body },
        sculptUI: { ...def.sculptUI, ...(saved.sculptUI || {}) },
        hair: { ...def.hair, ...(saved.hair || {}), customBackStrokes: (saved.hair && saved.hair.customBackStrokes) || [], customFrontStrokes: (saved.hair && saved.hair.customFrontStrokes) || [] },
        hairDraw: { ...def.hairDraw, ...(saved.hairDraw || {}) },
        pose: { ...def.pose, ...(saved.pose || {}) },
        outfit: { ...def.outfit, ...(saved.outfit || {}), customStrokes: (saved.outfit && saved.outfit.customStrokes) || [] },
        outfitDraw: { ...def.outfitDraw, ...(saved.outfitDraw || {}) },
        customAccStrokes: saved.customAccStrokes || [],
        accDraw: { ...def.accDraw, ...(saved.accDraw || {}) }
      };
      showToast('已恢复上次捏娃进度');
    }
    // 暴露标准骨骼与捏娃数据接口，方便后续接入小手机网页自定义名士
    window.CottonDollRig = {
      getState: () => JSON.parse(JSON.stringify(state)),
      setAnimation: (clipId) => {
        if (ANIM_CLIPS.some(c => c.id === clipId)) { state.pose.animClip = clipId; renderDock(); }
      },
      listAnimations: () => ANIM_CLIPS.map(c => ({ id: c.id, name: c.name }))
    };
    historyMgr.snapshot(); renderDock();
    initDollHostBridge();
    requestAnimationFrame(animLoop);
  }

  /* =========================================================================
   * 12. 东汉工坊纯宿主轻桥接（零 AI：仅返回择坊 / 收入行囊 / 赠予好友）
   * ========================================================================= */
  function initDollHostBridge() {
    const backBtn = document.getElementById('backToWorkshopBtn');
    const setPetBtn = document.getElementById('setHomePetBtn');
    const saveBpBtn = document.getElementById('saveBackpackBtn');
    const openFwdBtn = document.getElementById('openForwardModalBtn');
    const closeFwdBtn = document.getElementById('closeForwardModalBtn');
    const confirmFwdBtn = document.getElementById('confirmForwardBtn');
    const fwdModal = document.getElementById('forwardModal');
    const fwdSelect = document.getElementById('forwardCharSelect');
    const fwdNote = document.getElementById('forwardNoteInput');
    const posterImg = document.getElementById('posterImg');
    const toastEl = document.getElementById('posterActionToast');

    let friends = [];
    const pending = {};
    let seq = 0;

    function showPosterToast(msg) {
      if (!toastEl) return;
      toastEl.textContent = msg || '';
      if (msg) setTimeout(() => { if (toastEl.textContent === msg) toastEl.textContent = ''; }, 3600);
    }

    function sendHostRpc(type, payload) {
      return new Promise((resolve, reject) => {
        if (!window.parent || window.parent === window) {
          reject(new Error('当前为独立预览模式，请在小手机「东汉工坊」内使用'));
          return;
        }
        const reqId = `doll_rpc_${Date.now()}_${++seq}`;
        const timer = setTimeout(() => { delete pending[reqId]; reject(new Error('宿主响应超时')); }, 15000);
        pending[reqId] = { resolve, reject, timer };
        window.parent.postMessage({ type, requestId: reqId, payload: payload || {} }, '*');
      });
    }

    window.addEventListener('message', (ev) => {
      const data = ev && ev.data;
      if (!data || typeof data !== 'object' || !data.type) return;
      if (data.type === 'WORKSHOP_DOLL_HOST_SYNC') {
        const list = data.payload && Array.isArray(data.payload.friends) ? data.payload.friends : [];
        friends = list;
        if (fwdSelect) {
          fwdSelect.innerHTML = list.length > 0
            ? list.map(c => `<option value="${String(c.id).replace(/"/g, '&quot;')}">${c.name}</option>`).join('')
            : '<option value="">暂未检测到传讯好友</option>';
        }
        return;
      }
      if (data.requestId && pending[data.requestId]) {
        const entry = pending[data.requestId];
        clearTimeout(entry.timer);
        delete pending[data.requestId];
        if (data.error) entry.reject(new Error(data.error));
        else entry.resolve(data.result);
      }
    });

    function buildDollBrief() {
      const fb = (typeof FABRIC_TYPES !== 'undefined' && FABRIC_TYPES.find(x => x.id === state.body.fabricType)) || { name: '水晶超柔' };
      const name = (state.showcase && state.showcase.name) || document.getElementById('dollNameInput').value.trim() || '奶糖小兔';
      const note = (state.showcase && state.showcase.note) || '';
      const desc = `${state.body.bodyType === 'slender' ? '修长比例' : '奶团Q版'} · ${fb.name}${note ? ' · ' + note : ''}`;
      return { dollName: name, dollDesc: desc };
    }

    if (backBtn) {
      backBtn.onclick = () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'WORKSHOP_DOLL_CLOSE' }, '*');
        } else {
          showToast('当前为独立打开模式');
        }
      };
    }

    if (setPetBtn) {
      setPetBtn.onclick = async () => {
        const brief = buildDollBrief();
        try {
          const res = await sendHostRpc('WORKSHOP_DOLL_SET_HOME_PET', {
            dollName: brief.dollName,
            dollSub: brief.dollDesc,
            thumb: posterImg ? posterImg.src : '',
            snapshot: JSON.parse(JSON.stringify(state))
          });
          showPosterToast((res && res.message) || '已设为桌面宠物');
        } catch (err) {
          showPosterToast(err.message || '设为桌宠失败');
        }
      };
    }

    if (saveBpBtn) {
      saveBpBtn.onclick = async () => {
        const brief = buildDollBrief();
        try {
          const res = await sendHostRpc('WORKSHOP_DOLL_SAVE_BACKPACK', {
            dollName: brief.dollName,
            dollDesc: brief.dollDesc,
            posterDataUrl: posterImg ? posterImg.src : ''
          });
          showPosterToast((res && res.message) || '已收入行囊');
        } catch (err) {
          showPosterToast(err.message || '收入行囊失败');
        }
      };
    }

    if (openFwdBtn) {
      openFwdBtn.onclick = () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'WORKSHOP_DOLL_REQUEST_SYNC' }, '*');
        }
        if (fwdModal) fwdModal.classList.add('show');
      };
    }
    if (closeFwdBtn) closeFwdBtn.onclick = () => { if (fwdModal) fwdModal.classList.remove('show'); };

    if (confirmFwdBtn) {
      confirmFwdBtn.onclick = async () => {
        const targetId = fwdSelect ? fwdSelect.value : '';
        const targetObj = friends.find(c => String(c.id) === String(targetId));
        const brief = buildDollBrief();
        try {
          const res = await sendHostRpc('WORKSHOP_DOLL_SEND_CHAT', {
            charId: targetId,
            charName: targetObj ? targetObj.name : '',
            dollName: brief.dollName,
            dollDesc: brief.dollDesc,
            forwardNote: fwdNote ? fwdNote.value.trim() : '',
            posterDataUrl: posterImg ? posterImg.src : ''
          });
          if (fwdModal) fwdModal.classList.remove('show');
          showPosterToast((res && res.message) || '已发送至传讯');
        } catch (err) {
          showPosterToast(err.message || '发送失败');
        }
      };
    }

    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'WORKSHOP_DOLL_REQUEST_SYNC' }, '*');
    }
  }
  init();
})();
</script>
</body>
</html>
