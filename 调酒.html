        shakeBtn.textContent = '点击摇和起沫（激荡酒液）';
        shakeBtn.onclick = () => {
          liquid.shakePulse(1.1);
          state.shakerAnim = 1.0;
          sfx.playClink(1820, 0.08);
          setTimeout(() => sfx.playClink(1460, 0.06), 90);
        };
        info.appendChild(shakeBtn);
      }
      bottomDock.appendChild(info);

      const row = document.createElement('div'); row.className = 'dock-action-row';
      const prevBtn = document.createElement('button'); prevBtn.type = 'button'; prevBtn.className = 'small-pill-btn'; prevBtn.textContent = '‹ 继续注酒';
      prevBtn.onclick = () => goToStep(2);
      const nextBtn = document.createElement('button'); nextBtn.type = 'button'; nextBtn.className = 'primary-next-btn'; nextBtn.textContent = '下一步：点睛 ›';
      nextBtn.onclick = () => goToStep(4);
      row.appendChild(prevBtn); row.appendChild(nextBtn);
      bottomDock.appendChild(row);

      document.getElementById('toolSpoonBtn').onclick = () => { state.mixTool = 'spoon'; renderDock(); };
      document.getElementById('toolShakerBtn').onclick = () => { state.mixTool = 'shaker'; renderDock(); };
    } else if (state.step === 4) {
      stageHintPill.textContent = '轻点添加手绘配饰 · 在杯上直接拖动可微调位置';
      const head = document.createElement('div'); head.className = 'dock-head';
      head.innerHTML = `<div class="dock-instruction">第五步 · 雅趣点睛与香气</div>
        <div class="dock-sub-tabs">
          <button type="button" class="sub-tab ${state.garnishTab === 'in' ? 'active' : ''}" data-gtab="in">浮杯中</button>
          <button type="button" class="sub-tab ${state.garnishTab === 'rim' ? 'active' : ''}" data-gtab="rim">挂杯口</button>
          <button type="button" class="sub-tab ${state.garnishTab === 'stirrer' ? 'active' : ''}" data-gtab="stirrer">饮具</button>
          <button type="button" class="sub-tab ${state.garnishTab === 'aroma' ? 'active' : ''}" data-gtab="aroma">香气</button>
        </div>`;
      bottomDock.appendChild(head);
      head.querySelectorAll('[data-gtab]').forEach(btn => {
        btn.onclick = () => { state.garnishTab = btn.dataset.gtab; renderDock(); };
      });

      const scroll = document.createElement('div'); scroll.className = 'options-scroll';
      if (state.garnishTab === 'in' || state.garnishTab === 'rim') {
        const list = GARNISH_CATALOG.filter(g => g.mode === 'both' || g.mode === state.garnishTab);
        list.forEach(item => {
          const card = document.createElement('div'); card.className = 'thumb-card'; card.style.minWidth = '66px';
          const c = document.createElement('canvas'); c.width = 44; c.height = 42;
          drawGarnishGraphic(c.getContext('2d'), item.id, 22, 21, 0.62, 0);
          card.appendChild(c);
          const lbl = document.createElement('div'); lbl.className = 'thumb-label'; lbl.textContent = item.name;
          card.appendChild(lbl);
          card.onclick = () => addGarnishItem(item, state.garnishTab);
          scroll.appendChild(card);
        });
      } else if (state.garnishTab === 'stirrer') {
        STIRRER_TYPES.forEach(st => {
          const card = document.createElement('div');
          card.className = `thumb-card ${state.stirrer.id === st.id ? 'active' : ''}`;
          card.innerHTML = `<div class="thumb-label">${st.name}</div>`;
          card.onclick = () => { state.stirrer = st; sfx.playPop(580); renderDock(); };
          scroll.appendChild(card);
        });
      } else {
        AROMA_TYPES.forEach(ar => {
          const card = document.createElement('div');
          card.className = `thumb-card ${state.aroma.id === ar.id ? 'active' : ''}`;
          card.innerHTML = `<div class="thumb-label">${ar.name}</div>`;
          card.onclick = () => { state.aroma = ar; sfx.playPop(620); renderDock(); };
          scroll.appendChild(card);
        });
      }
      bottomDock.appendChild(scroll);

      const row = document.createElement('div'); row.className = 'dock-action-row';
      const prevBtn = document.createElement('button'); prevBtn.type = 'button'; prevBtn.className = 'small-pill-btn'; prevBtn.textContent = '‹ 搅和';
      prevBtn.onclick = () => goToStep(3);
      const undoBtn = document.createElement('button'); undoBtn.type = 'button'; undoBtn.className = 'small-pill-btn'; undoBtn.textContent = '撤回饰品';
      undoBtn.onclick = () => {
        if (state.garnishTab === 'rim' && state.rimItems.length) state.rimItems.pop();
        else if (state.inWineItems.length) state.inWineItems.pop();
        else if (state.rimItems.length) state.rimItems.pop();
        sfx.playPop(360);
      };
      const nextBtn = document.createElement('button'); nextBtn.type = 'button'; nextBtn.className = 'primary-next-btn'; nextBtn.textContent = '题名封存 ›';
      nextBtn.onclick = () => openCardModal();
      row.appendChild(prevBtn); row.appendChild(undoBtn); row.appendChild(nextBtn);
      bottomDock.appendChild(row);
    } else {
      stageHintPill.textContent = '佳酿已封存，可继续微调或开启新杯';
      const row = document.createElement('div'); row.className = 'dock-action-row';
      const backBtn = document.createElement('button'); backBtn.type = 'button'; backBtn.className = 'small-pill-btn'; backBtn.textContent = '‹ 返回修饰';
      backBtn.onclick = () => goToStep(4);
      const cardBtn = document.createElement('button'); cardBtn.type = 'button'; cardBtn.className = 'primary-next-btn'; cardBtn.textContent = '打开收藏酒卡';
      cardBtn.onclick = () => document.getElementById('posterModal').classList.add('show');
      row.appendChild(backBtn); row.appendChild(cardBtn);
      bottomDock.appendChild(row);
    }
  }

  function goToStep(s) {
    state.step = clamp(s, 0, 5);
    renderDock();
    if (typeof window.__drinkOnStepChanged === 'function') window.__drinkOnStepChanged(state.step);
  }

  function triggerMuddle() {
    state.muddlerAnim = 1.0;
    sfx.playMuddle();
    if (state.muddleItems.length > 0) {
      state.muddleItems.forEach(m => { m.crush = Math.min(1, m.crush + 0.34); });
      const pick = state.muddleItems[state.muddleItems.length - 1];
      liquid.injectMuddleJuice(pick.juice, 0.032);
      updateFlavorHud();
    }
  }

  function addGarnishItem(item, mode = 'in') {
    const glass = state.glass;
    const surfY = glass.botY - liquid.fillLevel * (glass.botY - glass.topY);
    if (mode === 'rim' || item.mode === 'rim') {
      // 沿杯口弧线智能分布，避免重叠堆砌
      const idx = state.rimItems.length;
      const angles = [-0.15, Math.PI + 0.15, -0.52, Math.PI + 0.52, -0.88];
      const a = angles[idx % angles.length];
      const rx = glass.rimRx + 2;
      const x = CX + Math.cos(a) * rx;
      const y = glass.topY + Math.sin(a) * 14 - 4;
      state.rimItems.push({ ...item, x, y, rot: (Math.cos(a) > 0 ? 0.22 : -0.22), scale: 1.05 });
    } else {
      const targetY = clamp(surfY + 24 + Math.random() * 55, glass.topY + 28, glass.botY - 26);
      const hw = Math.max(18, getGlassHalfWidthAtY(glass, targetY) - 24);
      state.inWineItems.push({
        ...item,
        x: CX + (Math.random() - 0.5) * hw * 1.4,
        y: targetY,
        rot: (Math.random() - 0.5) * 1.2,
        scale: 0.94,
        phase: Math.random() * Math.PI * 2
      });
    }
    sfx.playPop(560);
  }

  /* ============================================================================
   * 9. 画布交互：捣压、吧勺搅拌、配饰拖拽微调
   * ============================================================================ */
  function canvasCoordsFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    const pt = canvasCoordsFromEvent(e);
    const glass = state.glass;

    if (state.step === 1) {
      if (Math.abs(pt.x - CX) < glass.midRx + 20 && pt.y > glass.topY - 20 && pt.y < glass.botY + 20) {
        triggerMuddle();
      }
      return;
    }
    if (state.step === 3 && state.mixTool === 'spoon') {
      state.stirPos = { active: true, x: pt.x, y: pt.y, vx: 0, vy: 0 };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (state.step === 4) {
      // 优先拾取杯口配饰，其次杯中配饰
      for (let i = state.rimItems.length - 1; i >= 0; i--) {
        const it = state.rimItems[i];
        if (Math.hypot(pt.x - it.x, pt.y - it.y) < 36) {
          state.dragItem = { list: 'rim', idx: i, ox: it.x - pt.x, oy: it.y - pt.y };
          canvas.setPointerCapture(e.pointerId);
          return;
        }
      }
      for (let i = state.inWineItems.length - 1; i >= 0; i--) {
        const it = state.inWineItems[i];
        if (Math.hypot(pt.x - it.x, pt.y - it.y) < 32) {
          state.dragItem = { list: 'in', idx: i, ox: it.x - pt.x, oy: it.y - pt.y };
          canvas.setPointerCapture(e.pointerId);
          return;
        }
      }
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const pt = canvasCoordsFromEvent(e);
    const glass = state.glass;

    if (state.stirPos.active && state.step === 3) {
      const dx = pt.x - state.stirPos.x;
      const dy = pt.y - state.stirPos.y;
      state.stirPos.x = clamp(pt.x, CX - glass.midRx + 16, CX + glass.midRx - 16);
      state.stirPos.y = clamp(pt.y, glass.topY + 20, glass.botY - 18);
      const normX = clamp((state.stirPos.x - (CX - glass.midRx)) / (glass.midRx * 2), 0.05, 0.95);
      const normY = clamp((glass.botY - state.stirPos.y) / (glass.botY - glass.topY), 0.05, 0.95);
      liquid.stirAt(normX, normY, clamp(dx * 0.16, -2.5, 2.5), clamp(-dy * 0.12, -2.0, 2.0));
      state.stirCount++;
      if (state.stirCount % 16 === 0) sfx.playClink(1580 + Math.random() * 260, 0.04);
      return;
    }
    if (state.dragItem) {
      const arr = state.dragItem.list === 'rim' ? state.rimItems : state.inWineItems;
      const it = arr[state.dragItem.idx];
      if (!it) return;
      if (state.dragItem.list === 'rim') {
        it.x = clamp(pt.x + state.dragItem.ox, CX - glass.rimRx - 22, CX + glass.rimRx + 22);
        it.y = clamp(pt.y + state.dragItem.oy, glass.topY - 34, glass.topY + 28);
      } else {
        it.x = clamp(pt.x + state.dragItem.ox, CX - glass.midRx + 18, CX + glass.midRx - 18);
        it.y = clamp(pt.y + state.dragItem.oy, glass.topY + 22, glass.botY - 18);
      }
    }
  });

  const endPointer = () => { state.stirPos.active = false; state.dragItem = null; };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  /* ============================================================================
   * 10. 真实笔速压感毛笔签名板 & 高清酒卡导出 + 酒谱画廊
   * ============================================================================ */
  const sigCanvas = document.getElementById('sigCanvas');
  const sigCtx = sigCanvas.getContext('2d');
  let sigDrawing = false, sigLast = null, sigWidth = 3.2;

  sigCanvas.addEventListener('pointerdown', (e) => {
    const r = sigCanvas.getBoundingClientRect();
    sigDrawing = true; sigWidth = 3.6;
    sigLast = { x: (e.clientX - r.left) * (sigCanvas.width / r.width), y: (e.clientY - r.top) * (sigCanvas.height / r.height), t: performance.now() };
    sigCanvas.setPointerCapture(e.pointerId);
  });
  sigCanvas.addEventListener('pointermove', (e) => {
    if (!sigDrawing || !sigLast) return;
    const r = sigCanvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (sigCanvas.width / r.width);
    const y = (e.clientY - r.top) * (sigCanvas.height / r.height);
    const now = performance.now();
    const dist = Math.hypot(x - sigLast.x, y - sigLast.y);
    const dt = Math.max(4, now - sigLast.t);
    const speed = dist / dt; // px/ms
    const targetW = clamp(4.6 - speed * 2.2, 1.35, 5.0);
    sigWidth = lerp(sigWidth, targetW, 0.35);

    sigCtx.strokeStyle = '#2B211C';
    sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
    sigCtx.lineWidth = sigWidth;
    sigCtx.beginPath(); sigCtx.moveTo(sigLast.x, sigLast.y); sigCtx.lineTo(x, y); sigCtx.stroke();
    sigLast = { x, y, t: now };
  });
  sigCanvas.addEventListener('pointerup', () => { sigDrawing = false; sigLast = null; });
  document.getElementById('clearSigBtn').onclick = () => sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);

  /* ============================================================================
   * 11. 主动画循环

  function renderLoop(t) {
    // 瓶身倾倒平滑插值 + 实时注酒
    const targetTilt = state.activePourWine ? 1 : 0;
    state.bottleTilt = lerp(state.bottleTilt, targetTilt, 0.18);
    if (state.activePourWine && state.bottleTilt > 0.55) {
      const slow = state.pourMode === 'float';
      const delta = slow ? 0.0052 : 0.0085;
      const poured = liquid.pourStep(state.activePourWine, delta, slow, slow ? 0.72 : 0.54);
      if (poured) {
        state.pourLog[state.activePourWine.name] = (state.pourLog[state.activePourWine.name] || 0) + delta;
        sfx.updatePour(liquid.fillLevel, slow);
        updateFlavorHud();
        if (!slow && Math.random() < 0.45) {
          const surfY = state.glass.botY - liquid.fillLevel * (state.glass.botY - state.glass.topY);
          state.bubbles.push({ x: CX + (Math.random() - 0.5) * 85, y: surfY + 12 + Math.random() * 50, r: 1.5 + Math.random() * 2.5, vy: 0.9 + Math.random() * 1.4 });
        }
      }
    }

    // 气泡与冷凝水珠物理更新
    if (liquid.fillLevel > 0.08 && Math.random() < 0.08) {
      state.bubbles.push({ x: CX + (Math.random() - 0.5) * (state.glass.botRx * 1.1), y: state.glass.botY - 12, r: 1.2 + Math.random() * 2.1, vy: 0.7 + Math.random() * 1.1 });
    }
    state.bubbles.forEach(b => { b.y -= b.vy; b.x += Math.sin(t * 0.006 + b.y * 0.1) * 0.3; });
    state.bubbles = state.bubbles.filter(b => b.y > state.glass.topY).slice(-60);

    if (state.chilled) {
      state.condensationDrops.forEach(d => { d.v += d.vy; if (d.v > 0.92) { d.v = 0.12; d.u = (Math.random() - 0.5) * 1.55; } });
    }
    if (state.muddlerAnim > 0) state.muddlerAnim = Math.max(0, state.muddlerAnim - 0.055);
    if (state.shakerAnim > 0) state.shakerAnim = Math.max(0, state.shakerAnim - 0.045);

    liquid.step();
    renderDrinkScene(ctx, t, false);
    requestAnimationFrame(renderLoop);
  }

    const pendingRpcs = {};

    function sendHostRpc(reqType, resType, payload) {
      return new Promise((resolve, reject) => {
        const reqId = `drink_rpc_${Date.now()}_${++rpcSeq}`;
        const timer = setTimeout(() => { delete pendingRpcs[reqId]; reject(new Error('通信超时')); }, 50000);
        pendingRpcs[reqId] = { resType, resolve, reject, timer };
        window.parent.postMessage({ type: reqType, requestId: reqId, payload: Object.assign({ edition: EDITION }, payload || {}) }, '*');
      });
    }

    window.addEventListener('message', (ev) => {
      const data = ev && ev.data;
      if (!data || typeof data !== 'object' || !data.type) return;
      if (data.type === 'WORKSHOP_CAKE_HOST_SYNC') {
        coop.hostConnected = true;
        const p = data.payload || {};
        coop.characters = Array.isArray(p.characters) ? p.characters : [];
        coop.userName = p.userName || '广陵王';
        const opts = coop.characters.length > 0
          ? coop.characters.map(c => `<option value="${String(c.id).replace(/"/g, '&quot;')}">${c.name}</option>`).join('')

        if (!coop.selectedCharId && coop.characters.length > 0) coop.selectedCharId = String(coop.characters[0].id);
        if (coop.selectedCharId) { charSelectEl.value = coop.selectedCharId; forwardCharSelectEl.value = coop.selectedCharId; }
        syncCoopUI();
        return;
      }
      if (data.requestId && pendingRpcs[data.requestId]) {
        const entry = pendingRpcs[data.requestId];
        clearTimeout(entry.timer); delete pendingRpcs[data.requestId];
        if (data.error) entry.reject(new Error(data.error)); else entry.resolve(data.result);
      }
    });

    function getCharName() {

    function captureSmallDrinkSnapshot() {
      try {
        const tmp = document.createElement('canvas');
        tmp.width = 360; tmp.height = 380;

        renderDrinkScene(tc, performance.now(), true);
        return tmp.toDataURL('image/jpeg', 0.78);
      } catch (_) { return ''; }
    }

    function loadSvgToImage(svgStr, w, h) {
      return new Promise((resolve) => {
        if (!svgStr || typeof svgStr !== 'string' || svgStr.indexOf('<svg') < 0) return resolve(null);
        const fixed = svgStr.replace(/<svg\b([^>]*)>/i, (m, attrs) => {
          let a = String(attrs || '');
          if (!/xmlns=/i.test(a)) a = ' xmlns="http://www.w3.org/2000/svg"' + a;
          if (!/\bwidth=/i.test(a)) a += ` width="${w}"`;
          if (!/\bheight=/i.test(a)) a += ` height="${h}"`;
          return `<svg${a}>`;
        });
        let settled = false;
        const done = (img) => { if (!settled) { settled = true; resolve(img); } };
        const timer = setTimeout(() => done(null), 2600);
        try {
          const blob = new Blob([fixed], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url); clearTimeout(timer);
            if (img.naturalWidth > 0) done(img); else tryDataUrl();
          };
          img.onerror = () => { URL.revokeObjectURL(url); tryDataUrl(); };
          img.src = url;
        } catch (_) { tryDataUrl(); }
        function tryDataUrl() {
          const img2 = new Image();
          img2.onload = () => { clearTimeout(timer); done(img2.naturalWidth > 0 ? img2 : null); };
          img2.onerror = () => { clearTimeout(timer); done(null); };
          img2.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(fixed);
        }
      });
    }

    function drawFallbackDrinkSignature(charName, sketchTitle) {
      const c = sigCtx;
      c.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      c.save();
      c.strokeStyle = '#634F43'; c.lineWidth = 2.2; c.lineCap = 'round';
      c.beginPath(); c.moveTo(18, 52); c.quadraticCurveTo(72, 30, 134, 38); c.quadraticCurveTo(158, 40, 174, 24); c.stroke();
      [[116, 30, 3.4, '#E4BD72'], [125, 25, 3.2, '#C89B4B'], [134, 32, 3.4, '#E4BD72'], [146, 27, 3.0, '#C89B4B']].forEach(([x, y, r, col]) => {
        c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
      });
      c.strokeStyle = '#B84336'; c.lineWidth = 1.8;
      c.beginPath(); c.roundRect(188, 17, 25, 25, 4); c.stroke();
      c.fillStyle = '#B84336'; c.font = '800 13px "Songti SC", serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('觞', 200.5, 30);
      c.fillStyle = '#2B211C'; c.font = '800 20px "Songti SC", serif'; c.textAlign = 'left';
      c.fillText(String(charName || '名士').slice(0, 4), 226, 36);
      if (sketchTitle) {
        c.fillStyle = '#9A8475'; c.font = '600 10px "Songti SC", serif';
        c.fillText(`· ${String(sketchTitle).slice(0, 6)}`, 226, 56);
      }
      c.restore();
    }

    function describeStepActionChoice(stepIdx, act) {
      if (!act) return '';
      if (stepIdx === 0) {
        const sc = SCENE_THEMES.find(x => x.id === act.sceneId);
        const gl = HAN_GLASSES.find(x => x.id === act.glassId);
        const rc = RIM_CRUSTS.find(x => x.id === act.rimCrustId);
        return [sc && sc.name, gl && gl.name, rc && rc.name, act.chilled ? '冰杯凝露' : '常温'].filter(Boolean).join(' · ');
      }
      if (stepIdx === 1) {
        const ic = ICE_TYPES.find(x => x.id === act.iceTypeId);
        const ms = (act.muddleIds || []).map(id => { const m = MUDDLE_INGREDIENTS.find(x => x.id === id); return m ? m.name : ''; }).filter(Boolean);
        return [ic && ic.name, ms.length ? `捣入${ms.join('、')}` : ''].filter(Boolean).join(' · ');
      }
      if (stepIdx === 2) {
        return (act.pours || []).map(p => { const w = WINE_PALETTE.find(x => x.id === p.id); return w ? w.name : ''; }).filter(Boolean).join(' → ');
      }
      if (stepIdx === 3) {
        return act.mixStyle === 'shake' ? '摇和起沫' : (act.mixStyle === 'stir' ? '吧勺轻搅' : '静置留层');
      }
      if (stepIdx === 4) {
        const g1 = (act.inWineGarnishes || []).map(id => (GARNISH_CATALOG.find(x => x.id === id) || {}).name).filter(Boolean);
        const g2 = (act.rimGarnishes || []).map(id => (GARNISH_CATALOG.find(x => x.id === id) || {}).name).filter(Boolean);
        const st = STIRRER_TYPES.find(x => x.id === act.stirrerId);
        const ar = AROMA_TYPES.find(x => x.id === act.aromaId);
        return [...g1, ...g2, st && st.id !== 'none' ? st.name : '', ar && ar.id !== 'none' ? ar.name : '', act.glassSketchTitle ? `杯身微雕「${act.glassSketchTitle}」` : ''].filter(Boolean).join(' · ');
      }
      if (stepIdx === 5) {
        return `《${act.drinkTitle || '月下流霞'}》${act.cardSketchTitle ? ` · 花押「${act.cardSketchTitle}」` : ''}`;
      }
      return '';
    }

    function recordMakingNote(stepIdx, charName, choiceText, line) {
      const idx = coop.makingNotes.findIndex(n => n.stepIdx === stepIdx);
      const item = { stepIdx, stepName: STEP_NAMES[stepIdx] || `第${stepIdx + 1}步`, charName: charName || getCharName(), choiceText: choiceText || '', line: line || '' };
      if (idx >= 0) coop.makingNotes[idx] = item; else coop.makingNotes.push(item);
      coop.makingNotes.sort((a, b) => a.stepIdx - b.stepIdx);
      coop.relayHistory.push(`第${stepIdx + 1}步(${item.stepName}) ${item.charName}：${choiceText} — ${line}`);
    }

    function switchPosterTab(tab) {
      const showNotes = tab === 'notes';
      tabPosterImgEl.classList.toggle('active', !showNotes);
      tabPosterNotesEl.classList.toggle('active', showNotes);
      posterImgEl.style.display = showNotes ? 'none' : 'block';
      posterNotesPageEl.classList.toggle('show', showNotes);
    }
    tabPosterImgEl.onclick = () => switchPosterTab('img');
    tabPosterNotesEl.onclick = () => switchPosterTab('notes');

    function renderPosterNotesView(notes) {
      const list = Array.isArray(notes) ? notes : coop.makingNotes;
      if (list.length > 0) {
        posterViewTabsEl.classList.add('show');
        posterNotesPageEl.innerHTML = list.map(n => `
          <div class="poster-note-item">
            <div class="poster-note-head">
              <span>第${(n.stepIdx || 0) + 1}步 · ${n.stepName || ''}</span>
              <span>${n.charName || getCharName()}</span>
            </div>
            ${n.choiceText ? `<div class="poster-note-choice">${n.choiceText}</div>` : ''}
            <div class="poster-note-line">${n.line || ''}</div>
          </div>`).join('');
      } else {
        posterViewTabsEl.classList.remove('show');
        posterNotesPageEl.innerHTML = '';
      }
      switchPosterTab('img');
    }

    function buildDrinkSummary() {
      const sc = SCENE_THEMES[state.sceneIdx] || SCENE_THEMES[0];
      const wines = Object.keys(state.pourLog).join('、') || '桂花蜜露、青梅冰酿、西域葡酿';
      const muddles = state.muddleItems.map(m => m.name).join('、');
      const garnishes = [...state.inWineItems, ...state.rimItems].map(i => i.name).join('、') || '青柠轮片、金桂花枝';
      const f = computeFlavorProfile();
      const flavorStr = `甜${Math.round(f.sweet * 100)}% 酸${Math.round(f.sour * 100)}% 花果${Math.round(f.floral * 100)}% 酒韵${Math.round(f.abv * 100)}%`;
      const desc = `景致「${sc.name}」，以「${state.glass.name}」盛装（${state.rimCrust.name}、${state.chilled ? '冰杯' : '常温'}、${state.iceType.name}${muddles ? '、捣料:' + muddles : ''}），调入${wines}，点缀${garnishes}${state.stirrer.id !== 'none' ? '，配' + state.stirrer.name : ''}${state.aroma.id !== 'none' ? '，熏' + state.aroma.name : ''}${state.glassSketchTitle ? '，杯身微雕「' + state.glassSketchTitle + '」' : ''}（风味：${flavorStr}）`;
      return {
        cakeName: state.card.title || document.getElementById('drinkTitleInput').value.trim() || '月下流霞',
        cakeDesc: desc,
        plaqueText: state.card.to || '饮胜',
        visualSnapshotText: `${desc}；酒名《${state.card.title || '月下流霞'}》，题词「${state.card.msg || ''}」`
      };
    }

    async function applyCharStep(stepIdx, act, charName) {
      if (!act) return;
      if (stepIdx === 0) {
        const sIdx = SCENE_THEMES.findIndex(x => x.id === act.sceneId);
        if (sIdx >= 0) {
          state.sceneIdx = sIdx;
          document.getElementById('sceneThemeBtn').textContent = `景致：${SCENE_THEMES[sIdx].name}`;
        }
        const g = HAN_GLASSES.find(x => x.id === act.glassId);
        if (g) state.glass = g;
        const r = RIM_CRUSTS.find(x => x.id === act.rimCrustId);
        if (r) state.rimCrust = r;
        state.chilled = act.chilled !== false;
        rebuildIcePieces();
        goToStep(0);
        sfx.playPop(540);
      } else if (stepIdx === 1) {
        const ic = ICE_TYPES.find(x => x.id === act.iceTypeId);
        if (ic) state.iceType = ic;
        rebuildIcePieces();
        state.muddleItems = [];
        const ms = Array.isArray(act.muddleIds) ? act.muddleIds : [];
        ms.forEach((mid, idx) => {
          const obj = MUDDLE_INGREDIENTS.find(x => x.id === mid);
          if (obj) {
            state.muddleItems.push({ ...obj, rx: (idx - (ms.length - 1) / 2) * 0.36, ry: 0.18 + (idx % 2) * 0.16, r: 11, rot: idx * 0.7, crush: 0.55 });
          }
        });
        if (state.muddleItems.length > 0) triggerMuddle();
        updateFlavorHud();
        goToStep(1);
        sfx.playClink(1580, 0.08);
      } else if (stepIdx === 2) {
        liquid.reset();
        state.pourLog = {};
        const pours = Array.isArray(act.pours) && act.pours.length > 0 ? act.pours : [
          { id: 'osmanthus_honey', amount: 0.24, slow: true },
          { id: 'green_plum', amount: 0.26, slow: true },
          { id: 'butterfly_pea', amount: 0.24, slow: true }
        ];
        pours.forEach((p, idx) => {
          const w = WINE_PALETTE.find(x => x.id === p.id);
          if (!w) return;
          const totalAmt = clamp(Number(p.amount) || 0.24, 0.12, 0.34);
          const slow = typeof p.slow === 'boolean' ? p.slow : (idx > 0);
          const subSteps = 10;
          for (let k = 0; k < subSteps; k++) {
            liquid.pourStep(w, totalAmt / subSteps, slow, slow ? 0.72 : 0.54);
          }
          state.pourLog[w.name] = (state.pourLog[w.name] || 0) + totalAmt;
        });
        updateFlavorHud();
        goToStep(2);
        sfx.playChime();
      } else if (stepIdx === 3) {
        if (act.mixStyle === 'shake') {
          liquid.shakePulse(1.0);
          state.shakerAnim = 1.0;
          sfx.playClink(1720, 0.09);
        } else if (act.mixStyle === 'stir') {
          for (let k = 0; k < 6; k++) {
            liquid.stirAt(0.5 + Math.cos(k) * 0.22, 0.45 + Math.sin(k) * 0.2, 1.2, 0.6);
          }
          sfx.playClink(1520, 0.06);
        } else {
          sfx.playPop(500);
        }
        goToStep(3);
      } else if (stepIdx === 4) {
        state.inWineItems = [];
        state.rimItems = [];
        (act.inWineGarnishes || []).forEach(gid => {
          const g = GARNISH_CATALOG.find(x => x.id === gid);
          if (g) addGarnishItem(g, 'in');
        });
        (act.rimGarnishes || []).forEach(gid => {
          const g = GARNISH_CATALOG.find(x => x.id === gid);
          if (g) addGarnishItem(g, 'rim');
        });
        const st = STIRRER_TYPES.find(x => x.id === act.stirrerId);
        if (st) state.stirrer = st;
        const ar = AROMA_TYPES.find(x => x.id === act.aromaId);
        if (ar) state.aroma = ar;
        state.glassSketchTitle = act.glassSketchTitle || '';
        state.glassSketchImg = act.glassSketchSvg ? await loadSvgToImage(act.glassSketchSvg, 180, 180) : null;
        goToStep(4);
        sfx.playPop(620);
      } else if (stepIdx === 5) {
        const title = act.drinkTitle || suggestDrinkTitle();
        const to = act.cardTo || `致：${coop.userName}`;
        const note = act.cardNote || '晚风微凉，共饮此盏流霞，愿岁岁常欢愉。';
        document.getElementById('drinkTitleInput').value = title;
        document.getElementById('drinkToInput').value = to;
        document.getElementById('drinkMsgInput').value = note;
        state.card.title = title;
        state.card.to = to;
        state.card.msg = note;
        drawFallbackDrinkSignature(charName || getCharName(), act.cardSketchTitle || '');
        if (act.cardSketchSvg) {
          const img = await loadSvgToImage(act.cardSketchSvg, 320, 70);
          if (img && img.naturalWidth > 0) {
            sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            sigCtx.drawImage(img, 8, 2, sigCanvas.width - 16, sigCanvas.height - 4);
          }
        }
        goToStep(5);
      }
      renderDock();
    }

    function waitForUserStepAdvance(curIdx) {
      if (coop.skipFullAnim) return Promise.resolve();
      return new Promise((resolve) => {
        coop.stepWaitResolver = resolve;
        bubbleActionsEl.style.display = 'flex';
        nextStepBtnEl.textContent = curIdx < 5 ? `看下一步 (${curIdx + 2}/6)` : '封存酒笺 · 端上酒盏';
      });
    }
    nextStepBtnEl.onclick = () => {
      bubbleActionsEl.style.display = 'none';
      if (coop.stepWaitResolver) { const fn = coop.stepWaitResolver; coop.stepWaitResolver = null; fn(); }
    };
    skipAnimBtnEl.onclick = () => {
      coop.skipFullAnim = true;
      bubbleActionsEl.style.display = 'none';
      if (coop.stepWaitResolver) { const fn = coop.stepWaitResolver; coop.stepWaitResolver = null; fn(); }
    };

    async function runCharacterFullMake() {
      if (coop.busy) return;
      if (!coop.selectedCharId) { showBubble('系统', '提示', '请先选择一位传讯名士。'); return; }
      coop.busy = true;
      coop.skipFullAnim = false;
      coop.makingNotes = [];
      coop.relayHistory = [];
      coop.lastReview = null;
      actionBtnEl.disabled = true;
      const cname = getCharName();
      showBubble(cname, '构思酒谱', `${cname} 正在灯下斟酌你的口味与酒趣，稍候片刻…`);
      try {
        const res = await sendHostRpc('WORKSHOP_CAKE_FULL_MAKE_REQUEST', 'WORKSHOP_CAKE_FULL_MAKE_RESPONSE', {
          charId: coop.selectedCharId
        });
        const plan = res.plan || {};
        const lines = Array.isArray(res.stepLines) ? res.stepLines : [];
        const realName = res.charName || cname;

        const stepPayloads = [
          { sceneId: plan.sceneId, glassId: plan.glassId, rimCrustId: plan.rimCrustId, chilled: plan.chilled },
          { iceTypeId: plan.iceTypeId, muddleIds: plan.muddleIds },
          { pours: plan.pours },
          { mixStyle: plan.mixStyle },
          { inWineGarnishes: plan.inWineGarnishes, rimGarnishes: plan.rimGarnishes, stirrerId: plan.stirrerId, aromaId: plan.aromaId, glassSketchTitle: plan.glassSketchTitle, glassSketchSvg: plan.glassSketchSvg },
          { drinkTitle: plan.drinkTitle, cardTo: plan.cardTo, cardNote: plan.cardNote, cardSketchTitle: plan.cardSketchTitle, cardSketchSvg: plan.cardSketchSvg }
        ];

        for (let i = 0; i < 6; i++) {
          await applyCharStep(i, stepPayloads[i], realName);
          const line = lines[i] || `完成了第 ${i + 1} 步。`;
          const choiceText = describeStepActionChoice(i, stepPayloads[i]);
          recordMakingNote(i, realName, choiceText, line);
          showBubble(realName, `${STEP_NAMES[i]} (${i + 1}/6)`, line);
          await waitForUserStepAdvance(i);
        }

        bubbleActionsEl.style.display = 'none';
        await generateAndShowPoster();
        if (res.introNote) showBubble(realName, '敬君一盏', res.introNote);
      } catch (err) {
        showBubble(cname, '调酒中断', `未能连上 AI 调酒：${err.message || err}`);
      } finally {
        bubbleActionsEl.style.display = 'none';
        coop.busy = false;
        actionBtnEl.disabled = false;
        syncCoopUI();
      }
    }

    async function runCharacterRelayStep() {
      if (coop.busy) return;
      if (!coop.selectedCharId) { showBubble('系统', '提示', '请先选择一位传讯名士。'); return; }
      coop.busy = true;
      actionBtnEl.disabled = true;
      const curStep = clamp(state.step, 0, 5);
      const cname = getCharName();
      showBubble(cname, `${STEP_NAMES[curStep]}中`, `${cname} 正在端详眼前这杯酒，构思「${STEP_NAMES[curStep]}」…`);
      try {
        const snap = buildDrinkSummary();
        const imgSnap = captureSmallDrinkSnapshot();
        const res = await sendHostRpc('WORKSHOP_CAKE_STEP_RELAY_REQUEST', 'WORKSHOP_CAKE_STEP_RELAY_RESPONSE', {
          charId: coop.selectedCharId,
          stepIndex: curStep,
          visualSnapshotText: snap.visualSnapshotText,
          cakeSummary: snap.cakeDesc,
          relayHistory: coop.relayHistory,
          imageDataUrl: imgSnap
        });
        const realName = res.charName || cname;
        await applyCharStep(curStep, res.stepAction, realName);
        const choiceText = describeStepActionChoice(curStep, res.stepAction);
        recordMakingNote(curStep, realName, choiceText, res.spokenLine || '');
        showBubble(realName, res.moodTag || STEP_NAMES[curStep], res.spokenLine || '这一步交给我来。');
        if (curStep === 5) {
          await generateAndShowPoster();
        } else {
          goToStep(curStep + 1);
        }
      } catch (err) {
        showBubble(cname, '提示', `接力调酒失败：${err.message || err}`);
      } finally {
        coop.busy = false;
        actionBtnEl.disabled = false;
        syncCoopUI();
      }
    }

    function syncCoopUI() {
      const m = coop.mode;
      swapBtnEl.style.display = m === 'relay_coop' ? 'inline-block' : 'none';
      swapBtnEl.textContent = coop.userFirst ? '我先手' : 'TA先手';
      const isCharTurn = m === 'relay_coop' && (coop.userFirst ? (state.step % 2 === 1) : (state.step % 2 === 0));
      actionBtnEl.style.display = (m === 'char_make_user_eat' || isCharTurn) ? 'inline-block' : 'none';
      actionBtnEl.textContent = m === 'char_make_user_eat' ? '请TA调酒' : '让TA做这步';
      askCharTasteBtnEl.textContent = `请「${getCharName()}」品评`;
      feedbackRowEl.classList.toggle('show', m === 'char_make_user_eat');
    }

    document.getElementById('backToWorkshopBtn').onclick = () => window.parent.postMessage({ type: 'WORKSHOP_CAKE_CLOSE' }, '*');
    charSelectEl.onchange = () => { coop.selectedCharId = charSelectEl.value; forwardCharSelectEl.value = coop.selectedCharId; syncCoopUI(); };
    modeSelectEl.onchange = () => { coop.mode = modeSelectEl.value; syncCoopUI(); };
    swapBtnEl.onclick = () => { coop.userFirst = !coop.userFirst; syncCoopUI(); };

    actionBtnEl.onclick = () => {
      if (coop.mode === 'char_make_user_eat') runCharacterFullMake();
      else runCharacterRelayStep();
    };

    askCharTasteBtnEl.onclick = async () => {
      if (coop.busy || !coop.selectedCharId) return;
      coop.busy = true; askCharTasteBtnEl.textContent = '浅酌品评中…';
      try {
        const snap = buildDrinkSummary();
        const imgSnap = captureSmallDrinkSnapshot();
        const res = await sendHostRpc('WORKSHOP_CAKE_TASTE_REQUEST', 'WORKSHOP_CAKE_TASTE_RESPONSE', {
          charId: coop.selectedCharId,
          mode: coop.mode,
          visualSnapshotText: snap.visualSnapshotText,
          cakeSummary: snap.cakeDesc,
          imageDataUrl: imgSnap
        });
        coop.lastReview = res;
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML = `<div style="font-weight:800;color:var(--cinnabar);margin-bottom:3px;">${res.charName} 的品酒回函（${res.reactionTag}）</div><div>${res.comment}</div><div style="font-weight:700;margin-top:3px;">${res.dialogue}</div>`;
      } catch (err) { showToast(`品评失败：${err.message || err}`); }
      coop.busy = false; syncCoopUI();
    };

    sendFeedbackBtnEl.onclick = async () => {
      const fb = feedbackInputEl.value.trim();
      if (!fb || coop.busy || !coop.selectedCharId) return;
      coop.busy = true; sendFeedbackBtnEl.disabled = true; sendFeedbackBtnEl.textContent = '回应中…';
      try {
        const snap = buildDrinkSummary();
        const res = await sendHostRpc('WORKSHOP_CAKE_FEEDBACK_REQUEST', 'WORKSHOP_CAKE_FEEDBACK_RESPONSE', {
          charId: coop.selectedCharId,
          userFeedback: fb,
          visualSnapshotText: snap.visualSnapshotText,
          cakeSummary: snap.cakeDesc
        });
        coop.lastReview = res;
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML = `<div style="font-weight:800;color:var(--cinnabar);margin-bottom:3px;">${res.charName} 闻言回应（${res.reactionTag}）</div><div>${res.comment}</div><div style="font-weight:700;margin-top:3px;">${res.dialogue}</div>`;
        feedbackInputEl.value = '';
      } catch (err) { showToast(`发送失败：${err.message || err}`); }
      coop.busy = false; sendFeedbackBtnEl.disabled = false; sendFeedbackBtnEl.textContent = '告诉TA';
    };

    saveBackpackBtnEl.onclick = async () => {
      const snap = buildDrinkSummary();
      try {
        const res = await sendHostRpc('WORKSHOP_CAKE_SAVE_BACKPACK', 'WORKSHOP_CAKE_ACTION_RESULT', {
          cakeName: snap.cakeName, cakeDesc: snap.cakeDesc, posterDataUrl: posterImgEl.src
        });
        showToast((res && res.message) || '已收入行囊');
      } catch (err) { showToast(`收入失败：${err.message || err}`); }
    };

    openForwardModalBtnEl.onclick = () => forwardModalEl.classList.add('show');
    document.getElementById('closeForwardModalBtn').onclick = () => forwardModalEl.classList.remove('show');
    confirmForwardBtnEl.onclick = async () => {
      const targetId = forwardCharSelectEl.value;
      const targetObj = coop.characters.find(c => String(c.id) === String(targetId));
      const snap = buildDrinkSummary();
      try {
        const res = await sendHostRpc('WORKSHOP_CAKE_SEND_CHAT', 'WORKSHOP_CAKE_ACTION_RESULT', {
          charId: targetId, charName: targetObj ? targetObj.name : '',
          cakeName: snap.cakeName, cakeDesc: snap.cakeDesc, plaqueText: snap.plaqueText,
          forwardNote: forwardNoteInputEl.value.trim(), posterDataUrl: posterImgEl.src
        });
        forwardModalEl.classList.remove('show');
        showToast((res && res.message) || '已送出佳酿');
      } catch (err) { showToast(`送出失败：${err.message || err}`); }
    };

    window.__drinkOnPosterReady = async (dataUrl) => {
      coop.lastPosterDataUrl = dataUrl;
      renderPosterNotesView(coop.makingNotes);
      feedbackRowEl.classList.toggle('show', coop.mode === 'char_make_user_eat');
      if (!coop.lastReview) posterReviewBoxEl.style.display = 'none';
      const snap = buildDrinkSummary();
      const rec = {
        id: `drink_${Date.now()}`,
        cakeName: snap.cakeName,
        cakeDesc: snap.cakeDesc,
        plaqueText: snap.plaqueText,
        mode: coop.mode,
        charId: coop.selectedCharId,
        charName: getCharName(),
        posterDataUrl: dataUrl,
        makingNotes: coop.makingNotes.slice(0, 8),
        review: coop.lastReview,
        createdAt: Date.now()
      };
      if (coop.hostConnected) {
        try { await sendHostRpc('WORKSHOP_CAKE_SAVE_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', rec); return; } catch (_) {}
      }
      await saveDrinkToDB({ id: rec.id, title: rec.cakeName, desc: rec.cakeDesc, dataUrl, createdAt: rec.createdAt });
    };

    window.__drinkLoadHostHistory = async () => {
      if (!coop.hostConnected) return [];
      const res = await sendHostRpc('WORKSHOP_CAKE_LIST_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', {});
      return Array.isArray(res) ? res : [];
    };

    window.__drinkDeleteHostHistory = async (id) => {
      if (!coop.hostConnected) return;
      await sendHostRpc('WORKSHOP_CAKE_DELETE_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', { id });
    };

    window.__drinkOpenHistoryItem = (item) => {
      renderPosterNotesView(item && item.makingNotes ? item.makingNotes : []);
      if (item && item.review && item.review.comment) {
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML = `<div style="font-weight:800;color:var(--cinnabar);margin-bottom:3px;">${item.review.charName || item.charName || '名士'} 的品酒回函（${item.review.reactionTag || '雅评'}）</div><div>${item.review.comment}</div><div style="font-weight:700;margin-top:3px;">${item.review.dialogue || ''}</div>`;
      } else {
        posterReviewBoxEl.style.display = 'none';
      }
    };

    window.__drinkOnReset = () => {
      coop.makingNotes = [];
      coop.relayHistory = [];
      coop.lastReview = null;
      posterReviewBoxEl.style.display = 'none';
      renderPosterNotesView([]);
    };

    window.__drinkOnStepChanged = () => syncCoopUI();
    window.parent.postMessage({ type: 'WORKSHOP_CAKE_REQUEST_SYNC', payload: { edition: EDITION } }, '*');
  }

  // 启动工坊
  bindGlobalEvents();
  initDrinkCoCreationBridge();
  renderDock();
  requestAnimationFrame(renderLoop);
})();
</script>
</body>
</html>
