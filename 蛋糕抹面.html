        g.addColorStop(1, '#C9B29B');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, sz, 0, Math.PI * 2);
        ctx.fill();
      } else if (sp.type === 'sprinkle_gold') {
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.moveTo(-sz, 0);
        ctx.lineTo(0, -sz * 0.7);
        ctx.lineTo(sz, sz * 0.3);
        ctx.lineTo(0, sz);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.roundRect(-sz * 1.4, -sz * 0.45, sz * 2.8, sz * 0.9, 2);
        ctx.fill();
      }
      ctx.restore();
    });
  }

  // 6.3 绘制巧克力祝福插牌与桌面信封贺卡
  function drawChocolatePlaque(ctx, viewMode = state.camera.viewMode) {
    if (!state.card.hasPlaque) return;
    const cx = viewMode === 'top' ? TOP_VIEW.cx : CAKE.cx;
    const ty = viewMode === 'top' ? TOP_VIEW.cy + 70 : getCakeTopY() + 26;

    ctx.save();
    ctx.translate(cx, ty);

    // 底部阴影
    ctx.fillStyle = 'rgba(60, 25, 10, 0.25)';
    ctx.beginPath();
    ctx.ellipse(0, 14, 58, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // 椭圆形黑巧牌底座
    const pg = ctx.createLinearGradient(-55, -20, 55, 20);
    pg.addColorStop(0, '#4E2A1A');
    pg.addColorStop(0.5, '#381C0F');
    pg.addColorStop(1, '#241007');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.roundRect(-56, -16, 112, 32, 12);
    ctx.fill();

    // 金色裱花边框
    ctx.strokeStyle = '#F2C15E';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.roundRect(-52, -12, 104, 24, 9);
    ctx.stroke();

    // 巧克力牌刻字
    ctx.fillStyle = '#FFE8B3';
    ctx.font = 'bold 14px "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(state.card.plaqueText || 'Happy Day', 0, 0);
    ctx.restore();
  }

  // 6.35 绘制立在蛋糕前方的折叠手作贺卡（含主题纸纹、祝福语与玩家亲笔手写字）
  function drawStandingGreetingCard(ctx, viewMode = state.camera.viewMode) {
    if (!state.card.hasPlaque) return;

    const cardThemes = [
      { bgTop: '#FFFDF8', bgBot: '#FBF0DF', back: '#E8D5BA', border: '#E2C499', ink: '#4A2E1B', sub: '#7D5338' },
      { bgTop: '#FFF6F7', bgBot: '#FCE2E6', back: '#EABCC4', border: '#EBAFB6', ink: '#5C2630', sub: '#8F4A56' },
      { bgTop: '#F6FCF8', bgBot: '#E1F2E7', back: '#B7D9C2', border: '#A9D1B5', ink: '#2B4A34', sub: '#4D7558' },
      { bgTop: '#FCF8EE', bgBot: '#EFE2C8', back: '#D6C098', border: '#C7AD7F', ink: '#4A381E', sub: '#78603C' }
    ];
    const th = cardThemes[state.card.theme] || cardThemes[0];

    const isTop = viewMode === 'top';
    const cardW = isTop ? 196 : 226;
    const cardH = isTop ? 112 : 128;
    const cx = isTop ? (CW - 122) : (CAKE.cx + 118);
    const cy = isTop ? (CH - 78) : (CAKE.baseY + 126);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(isTop ? -0.05 : -0.035);

    // 1. 桌面接触软投影（让贺卡稳稳立在蛋糕前方桌面上）
    const shGrad = ctx.createRadialGradient(0, cardH * 0.5 + 4, 10, 0, cardH * 0.5 + 4, cardW * 0.62);
    shGrad.addColorStop(0, 'rgba(85, 50, 25, 0.28)');
    shGrad.addColorStop(0.7, 'rgba(85, 50, 25, 0.10)');
    shGrad.addColorStop(1, 'rgba(85, 50, 25, 0)');
    ctx.fillStyle = shGrad;
    ctx.beginPath();
    ctx.ellipse(2, cardH * 0.5 + 4, cardW * 0.58, 15, 0, 0, Math.PI * 2);
    ctx.fill();

    // 2. 折叠贺卡背面立脚（顶部微折与右侧立体撑脚）
    ctx.fillStyle = th.back;
    ctx.beginPath();
    ctx.moveTo(-cardW * 0.48, -cardH * 0.5);
    ctx.lineTo(cardW * 0.48, -cardH * 0.5);
    ctx.lineTo(cardW * 0.54, cardH * 0.48);
    ctx.lineTo(cardW * 0.44, cardH * 0.5);
    ctx.closePath();
    ctx.fill();

    // 3. 贺卡正面立牌主体（微微上窄下宽的轻透视感）
    const topHalfW = cardW * 0.485;
    const botHalfW = cardW * 0.5;
    const halfH = cardH * 0.5;

    const faceGrad = ctx.createLinearGradient(0, -halfH, 0, halfH);
    faceGrad.addColorStop(0, th.bgTop);
    faceGrad.addColorStop(1, th.bgBot);
    ctx.fillStyle = faceGrad;
    ctx.strokeStyle = th.border;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-topHalfW + 8, -halfH);
    ctx.lineTo(topHalfW - 8, -halfH);
    ctx.quadraticCurveTo(topHalfW, -halfH, topHalfW, -halfH + 8);
    ctx.lineTo(botHalfW, halfH - 6);
    ctx.quadraticCurveTo(botHalfW, halfH, botHalfW - 8, halfH);
    ctx.lineTo(-botHalfW + 8, halfH);
    ctx.quadraticCurveTo(-botHalfW, halfH, -botHalfW, halfH - 6);
    ctx.lineTo(-topHalfW, -halfH + 8);
    ctx.quadraticCurveTo(-topHalfW, -halfH, -topHalfW + 8, -halfH);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 精致内框金线
    ctx.strokeStyle = th.border;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(-topHalfW + 7, -halfH + 6, (topHalfW - 7) * 2, cardH - 12, 6);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 顶部迷你火漆印章点缀
    ctx.fillStyle = '#E86A53';
    ctx.beginPath();
    ctx.arc(topHalfW - 20, -halfH + 17, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.arc(topHalfW - 21.5, -halfH + 15.5, 1.8, 0, Math.PI * 2);
    ctx.fill();

    // 4. 贺卡收件人 & 暖心祝福文字
    const padX = -topHalfW + 14;
    const textMaxW = cardW - 34;
    ctx.fillStyle = th.ink;
    ctx.font = 'bold 11.5px "PingFang SC", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const toStr = (state.card.to || '致：温柔闪耀的你').slice(0, 14);
    ctx.fillText(toStr, padX, -halfH + 12, textMaxW - 14);

    ctx.fillStyle = th.sub;
    ctx.font = '10px "PingFang SC", sans-serif';
    const bodyStr = state.card.body || '愿你每一个日子都如奶油蛋糕般甜美温暖。';
    ctx.fillText(bodyStr.slice(0, 18), padX, -halfH + 29, textMaxW);
    if (bodyStr.length > 18) {
      ctx.fillText(bodyStr.slice(18, 36) + (bodyStr.length > 36 ? '…' : ''), padX, -halfH + 43, textMaxW);
    }

    // 5. 展示玩家亲笔手写字（完整清晰呈现在贺卡下半区）
    const sigBoxX = -topHalfW + 12;
    const sigBoxY = -halfH + 56;
    const sigBoxW = (topHalfW - 12) * 2;
    const sigBoxH = cardH - 64;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.beginPath();
    ctx.roundRect(sigBoxX, sigBoxY, sigBoxW, sigBoxH, 5);
    ctx.fill();

    ctx.drawImage(sigCanvas, sigBoxX + 4, sigBoxY + 2, sigBoxW - 8, sigBoxH - 4);

    ctx.restore();
  }

// 6.4 绘制跟随手指的交互烘焙工具（视频同款半透明染色奶油裱花袋、巧克力挤酱笔、火柴）
  function drawActiveTool(ctx, time) {
    const p = state.pointer;

    // Step 2 裱花环形辅助点提示（兼容俯视正圆与 2.5D 椭圆）
    if (state.step === 2 && state.pipingSymmetry) {
      const isTop = state.camera.viewMode === 'top';
      const gcx = isTop ? TOP_VIEW.cx : CAKE.cx;
      const gcy = isTop ? TOP_VIEW.cy : getCakeTopY();
      const grx = isTop ? TOP_VIEW.r - 22 : CAKE.rx - 18;
      const gry = isTop ? TOP_VIEW.r - 22 : CAKE.ry - 9;
      ctx.save();
      ctx.fillStyle = 'rgba(232, 106, 83, 0.35)';
      for (let i = 0; i < 12; i++) {
        const a = state.turntableAngle + (i * Math.PI * 2) / 12;
        const gx = gcx + Math.cos(a) * grx;
        const gy = gcy + Math.sin(a) * gry;
        ctx.beginPath();
        ctx.arc(gx, gy, 3.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Step 0 等待叠放蛋糕胚时的悬浮引导提示
    if (state.step === 0 && (state.layerPhase === 2 || state.layerPhase === 5) && state.dropAnimY === 0) {
      const targetLayer = state.layerPhase === 2 ? 1 : 2;
      const hoverY = getLayerTopY(targetLayer) + CAKE.layerH - 85 + Math.sin(time * 0.005) * 6;
      ctx.save();
      ctx.globalAlpha = 0.85;
      drawSpongeLayer(ctx, hoverY, state.spongeFlavor, 0);
      ctx.fillStyle = '#E86A53';
      ctx.beginPath();
      ctx.moveTo(CAKE.cx - 12, hoverY - CAKE.layerH - 25);
      ctx.lineTo(CAKE.cx + 12, hoverY - CAKE.layerH - 25);
      ctx.lineTo(CAKE.cx, hoverY - CAKE.layerH - 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    if (!p.down) return;

    ctx.save();
    // 1. 丝滑刮刀模式（Step 1 + spatula）：手绘烘焙曲柄不锈钢抹刀 + 实时刀刃沾色
    if (state.step === 1 && state.subTab === 'spatula') {
      const bRad = Math.max(12, (state.brushSize || 24) * 0.65);
      const bladeHex = p.bladeColorHex || state.frostingColor.mid;
      const tilt = Math.max(-0.45, Math.min(0.45, (p.vx || 0) * 0.025));

      ctx.translate(p.x, p.y);

      // 刮刀柔和作用范围指示圈（无生硬实线，虚线轻提示）
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 1.8;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(0, 0, bRad, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // 烘焙曲柄金属抹刀
      ctx.rotate(-0.55 + tilt);

      // 不锈钢刀身（带金属拉丝渐变）
      const bladeGrad = ctx.createLinearGradient(-10, -58, 12, 4);
      bladeGrad.addColorStop(0, '#B0BEC5');
      bladeGrad.addColorStop(0.35, '#ECEFF1');
      bladeGrad.addColorStop(0.6, '#FFFFFF');
      bladeGrad.addColorStop(1, '#90A4AE');
      ctx.fillStyle = bladeGrad;
      ctx.strokeStyle = '#78909C';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-9, -6);
      ctx.lineTo(-10, -54);
      ctx.quadraticCurveTo(-9, -62, 0, -64);
      ctx.quadraticCurveTo(9, -62, 10, -54);
      ctx.lineTo(9, -6);
      ctx.quadraticCurveTo(0, 4, -9, -6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 刀刃前沿沾染的实时混合奶油色
      ctx.fillStyle = bladeHex;
      ctx.globalAlpha = 0.92;
      ctx.beginPath();
      ctx.moveTo(-8.5, -5);
      ctx.quadraticCurveTo(0, 5, 8.5, -5);
      ctx.quadraticCurveTo(0, -1, -8.5, -5);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;

      // 曲柄连接颈部
      ctx.fillStyle = '#CFD8DC';
      ctx.fillRect(-3.5, -76, 7, 14);

      // 暖色原木圆润手柄
      const handleGrad = ctx.createLinearGradient(-8, -124, 8, -76);
      handleGrad.addColorStop(0, '#A47148');
      handleGrad.addColorStop(0.45, '#D4A373');
      handleGrad.addColorStop(1, '#7F4F24');
      ctx.fillStyle = handleGrad;
      ctx.beginPath();
      ctx.roundRect(-8, -124, 16, 48, 7);
      ctx.fill();
      ctx.strokeStyle = '#6B4226';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 金属箍环
      ctx.fillStyle = '#E0E7EC';
      ctx.fillRect(-8.5, -81, 17, 5);
    }
    // 2. 视频同款：涂抹夹心(Step 0)、奶油抹面(Step 1)与精致裱花(Step 2)时的跟随式奶油裱花袋
    else if ((state.step === 0 && (state.layerPhase === 0 || state.layerPhase === 3)) || state.step === 1 || state.step === 2) {
      const isSpreadingFilling = state.step === 0 && (state.layerPhase === 0 || state.layerPhase === 3);
      // 确定当前裱花袋内的奶油颜色
      let bagColor = '#FFF5EB';
      let collarColor = '#F4A9B8';
      if (isSpreadingFilling) {
        bagColor = state.fillingCream.jam;
      } else if (state.step === 1) {
        if (state.subTab === 'sauce' && state.saucePen) {
          bagColor = state.saucePen.color;
          collarColor = '#7D5338';
        } else {
          bagColor = state.frostingColor.mid;
        }
      } else if (state.step === 2) {
        bagColor = state.pipingColor.mid;
      }

      ctx.translate(p.x, p.y);

      // 触控挤压圆环指示器（如同视频中的白色准星小圆圈）
      const bSize = (state.brushSize || 24) * 0.45;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(8, bSize), 0, Math.PI * 2);
      ctx.stroke();

      // 倾斜45度的精致立体裱花袋
      ctx.rotate(0.75);

      // 金属锯齿裱花嘴尖
      ctx.fillStyle = '#CFD8DC';
      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.lineTo(-7, -18);
      ctx.lineTo(7, -18);
      ctx.closePath();
      ctx.fill();

      // 粉色/暖色固定硅胶套环
      ctx.fillStyle = collarColor;
      ctx.beginPath();
      ctx.moveTo(-8, -17);
      ctx.lineTo(-15, -34);
      ctx.lineTo(15, -34);
      ctx.lineTo(8, -17);
      ctx.closePath();
      ctx.fill();

      // 装着对应颜色奶油的半透明圆润裱花袋身
      ctx.fillStyle = bagColor;
      ctx.beginPath();
      ctx.moveTo(-15, -33);
      ctx.quadraticCurveTo(-30, -82, -16, -98);
      ctx.quadraticCurveTo(0, -108, 16, -98);
      ctx.quadraticCurveTo(30, -82, 15, -33);
      ctx.closePath();
      ctx.fill();

      // 裱花袋外层半透明磨砂光泽与高光
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.strokeStyle = 'rgba(220, 195, 175, 0.7)';
      ctx.lineWidth = 1.5;
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.beginPath();
      ctx.ellipse(-8, -66, 4.5, 18, 0.12, 0, Math.PI * 2);
      ctx.fill();
    }
    // 2. 点蜡烛火柴
    else if (state.step === 5 && !state.candlesLit) {
      ctx.translate(p.x, p.y);
      ctx.rotate(-0.4);
      ctx.fillStyle = '#D9B382';
      ctx.fillRect(0, -3, 65, 6);
      ctx.fillStyle = '#B8332A';
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFA824';
      ctx.beginPath();
      ctx.arc(-2, -6, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFF8B8';
      ctx.beginPath();
      ctx.arc(-2, -5, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* ============================================================================
   * 7. 主渲染循环 (60FPS 相机平滑阻尼 + 双视角渲染 + 2.5D 景深排序)
   * ============================================================================ */
  function renderCakeScene(targetCtx, cam, time, includeTool = true) {
    const viewMode = cam.viewMode || 'iso';
    const isTop = viewMode === 'top';

    targetCtx.save();
    targetCtx.translate(CW * 0.5 + cam.panX, CH * 0.5 + cam.panY);
    targetCtx.scale(cam.zoom, cam.zoom);
    targetCtx.translate(-CW * 0.5, -CH * 0.5);

    if (isTop) {
      drawTopDownCake(targetCtx);
    } else {
      // 1. 绘制旋转托盘
      drawCakeStand(targetCtx, state.turntableAngle);

      // 2. Step 0 时绘制内部三层蛋糕胚与双层夹心
      if (state.step === 0) {
        drawSpongeLayer(targetCtx, CAKE.baseY, state.spongeFlavor, 0);
        const f1Y = getLayerTopY(0);
        drawFillingLayer(targetCtx, f1Y, state.fillings[0], state.layersVisible >= 2);

        if (state.layersVisible >= 2) {
          const l2BotY = f1Y - CAKE.fillingH + CAKE.layerH;
          const anim2 = (state.layersVisible === 2 && state.dropAnimY < 0) ? state.dropAnimY : 0;
          drawSpongeLayer(targetCtx, l2BotY, state.spongeFlavor, anim2);

          const f2Y = getLayerTopY(1);
          drawFillingLayer(targetCtx, f2Y, state.fillings[1], state.layersVisible >= 3);
        }

        if (state.layersVisible >= 3) {
          const f2Y = getLayerTopY(1);
          const l3BotY = f2Y - CAKE.fillingH + CAKE.layerH;
          const anim3 = (state.layersVisible === 3 && state.dropAnimY < 0) ? state.dropAnimY : 0;
          drawSpongeLayer(targetCtx, l3BotY, state.spongeFlavor, anim3);
        }
      }

      // 3. Step >= 1 时绘制外部奶油抹面（双通道表面缓冲）
      if (state.step >= 1) {
        drawOuterFrosting(targetCtx);
      }
    }

    // 4. 绘制糖珠与金箔散落
    if (state.sprinkles.length > 0) {
      drawSprinkles(targetCtx, viewMode);
    }

    // 5. 景深排序绘制：将所有裱花与水果装饰按当前视角投影坐标从后往前排列
    const itemScaleBoost = isTop ? 1.18 : 1.0;
    const renderQueue = [];
    state.pipings.forEach(p => {
      const wp = resolveItemWorldPos(p, viewMode);
      if (wp) renderQueue.push({ kind: 'pipe', y: wp.y, data: { ...p, x: wp.x, y: wp.y, scale: (p.scale || 1) * itemScaleBoost } });
    });
    if (state.pointer.growingPipe) {
      const gp = state.pointer.growingPipe;
      gp.scale = Math.min(1.25, gp.scale + 0.03);
      const wp = resolveItemWorldPos(gp, viewMode);
      if (wp) renderQueue.push({ kind: 'pipe', y: wp.y, data: { ...gp, x: wp.x, y: wp.y, scale: gp.scale * itemScaleBoost } });
    }
    state.decorations.forEach(d => {
      const wp = resolveItemWorldPos(d, viewMode);
      if (wp) renderQueue.push({ kind: 'deco', y: wp.y + (d.type === 'candle' ? 6 : 0), data: { ...d, x: wp.x, y: wp.y, scale: (d.scale || 1) * itemScaleBoost } });
    });

    renderQueue.sort((a, b) => a.y - b.y);
    renderQueue.forEach(entry => {
      if (entry.kind === 'pipe') {
        drawPipingDollop(targetCtx, entry.data);
      } else {
        drawDecorationItem(targetCtx, entry.data, time);
      }
    });

    // 6. 绘制巧克力祝福插牌与立在蛋糕前方的手写贺卡
    drawChocolatePlaque(targetCtx, viewMode);
    drawStandingGreetingCard(targetCtx, viewMode);

    // 7. 绘制跟随手指的烘焙工具（仅在交互画布中绘制）
    if (includeTool) {
      drawActiveTool(targetCtx, time);
    }

    targetCtx.restore();
  }

  function renderLoop(time) {
    ctx.clearRect(0, 0, CW, CH);

    // 相机平滑阻尼插值
    const cam = state.camera;
    cam.zoom += (cam.targetZoom - cam.zoom) * 0.22;
    cam.panX += (cam.targetPanX - cam.panX) * 0.22;
    cam.panY += (cam.targetPanY - cam.panY) * 0.22;
    if (Math.abs(cam.targetZoom - cam.zoom) < 0.001) cam.zoom = cam.targetZoom;
    if (Math.abs(cam.targetPanX - cam.panX) < 0.1) cam.panX = cam.targetPanX;
    if (Math.abs(cam.targetPanY - cam.panY) < 0.1) cam.panY = cam.targetPanY;

    if (state.dropAnimY < 0) {
      state.dropAnimY = Math.min(0, state.dropAnimY + 14);
      if (state.dropAnimY === 0) sfx.playPop(320);
    }

    renderCakeScene(ctx, cam, time, true);

    // 吹灭蜡烛后的袅袅青烟与庆祝彩带粒子（屏幕空间覆盖）
    if (state.smokeParticles.length > 0) {
      ctx.save();
      state.smokeParticles.forEach(sp => {
        sp.y -= sp.vy;
        sp.x += Math.sin(time * 0.006 + sp.seed) * 0.8;
        sp.r += 0.25;
        sp.alpha -= 0.012;
        if (sp.alpha > 0) {
          ctx.fillStyle = `rgba(200, 195, 190, ${sp.alpha})`;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      state.smokeParticles = state.smokeParticles.filter(sp => sp.alpha > 0);
      ctx.restore();
    }

    if (state.confettiParticles.length > 0) {
      ctx.save();
      state.confettiParticles.forEach(cp => {
        cp.y += cp.vy;
        cp.x += cp.vx;
        cp.rot += cp.vrot;
        ctx.save();
        ctx.translate(cp.x, cp.y);
        ctx.rotate(cp.rot);
        ctx.fillStyle = cp.color;
        ctx.fillRect(-5, -3, 10, 6);
        ctx.restore();
      });
      state.confettiParticles = state.confettiParticles.filter(cp => cp.y < CH + 20);
      ctx.restore();
    }

    requestAnimationFrame(renderLoop);
  }

  /* ============================================================================
   * 8. 画布触控与鼠标交互逻辑（视频同款连续挤奶油抹面 + 多色混合 + 自由切换粗细）
   * ============================================================================ */
  function ensureBrushState() {
    if (!state.brushSize) state.brushSize = 24; // 默认中等粗细 (小:15, 中:24, 大:36)
    if (!state.frostStrokes) state.frostStrokes = [];
    if (!state.baseCoatColor) state.baseCoatColor = FROSTING_COLORS[0];
    if (!state.saucePen) state.saucePen = DRIP_GLAZES[1];
  }

  // 多点触控与桌面平移手势状态机（区分单指绘制 vs 双指捏合缩放/平移，含防误触回滚）
  const activePointers = new Map();
  const gesture = {
    mode: 'none', // 'none' | 'draw' | 'pinch' | 'pan'
    startDist: 0,
    startZoom: 1,
    lastMidX: 0,
    lastMidY: 0,
    drawStartTime: 0,
    drawPushedUndo: false,
    spaceHeld: false
  };

  function handlePointerDown(e) {
    e.preventDefault();
    ensureBrushState();
    const raw = getRawCanvasPos(e);
    activePointers.set(e.pointerId, { rawX: raw.rawX, rawY: raw.rawY });

    // A. 双指手势：进入双指缩放+平移，并在 90ms 内自动回滚首指误触
    if (activePointers.size === 2) {
      if (gesture.mode === 'draw' && gesture.drawPushedUndo && (performance.now() - gesture.drawStartTime < 95)) {
        undoFrostingAction();
        gesture.drawPushedUndo = false;
      }
      state.pointer.down = false;
      state.pointer.currentStroke = null;
      state.pointer.lastSurfaceHit = null;
      state.pointer.growingPipe = null;

      const pts = Array.from(activePointers.values());
      gesture.mode = 'pinch';
      gesture.startDist = Math.max(10, Math.hypot(pts[1].rawX - pts[0].rawX, pts[1].rawY - pts[0].rawY));
      gesture.startZoom = state.camera.targetZoom;
      gesture.lastMidX = (pts[0].rawX + pts[1].rawX) * 0.5;
      gesture.lastMidY = (pts[0].rawY + pts[1].rawY) * 0.5;
      return;
    }

    // B. 桌面端：空格+左键 / 中键 / 右键 拖动画布平移
    if (gesture.spaceHeld || e.button === 1 || e.button === 2) {
      gesture.mode = 'pan';
      gesture.lastMidX = raw.rawX;
      gesture.lastMidY = raw.rawY;
      return;
    }

    if (activePointers.size > 2) return;

    // C. 单指正常绘制交互
    gesture.mode = 'draw';
    gesture.drawStartTime = performance.now();
    gesture.drawPushedUndo = false;

    const pos = canvasToWorld(raw.rawX, raw.rawY);
    state.pointer.down = true;
    state.pointer.x = pos.x;
    state.pointer.y = pos.y;
    state.pointer.currentStroke = null;

    // Step 0: 蛋糕胚夹心涂抹、撒水果粒与叠放蛋糕胚
    if (state.step === 0) {
      if (state.layerPhase === 2) {
        state.layersVisible = 2;
        state.dropAnimY = -120;
        state.layerPhase = 3;
        sfx.playPop(420);
        updateUI();
        return;
      } else if (state.layerPhase === 5) {
        state.layersVisible = 3;
        state.dropAnimY = -120;
        state.layerPhase = 6;
        sfx.playChime();
        updateUI();
        return;
      } else if (state.layerPhase === 1 || state.layerPhase === 4) {
        addFruitChunkAt(pos.x, pos.y);
      } else if (state.layerPhase === 0 || state.layerPhase === 3) {
        startFillingStrokeAt(pos.x, pos.y);
      }
    }
    // Step 1: 奶油多色涂抹、丝滑刮刀、巧克力酱画笔与淋面
    else if (state.step === 1) {
      const prevUndoLen = state.surfaceUndoStack ? state.surfaceUndoStack.length : 0;
      startFrostingStrokeAt(pos.x, pos.y);
      const nextUndoLen = state.surfaceUndoStack ? state.surfaceUndoStack.length : 0;
      if (nextUndoLen > prevUndoLen) gesture.drawPushedUndo = true;
    }
    // Step 2: 挤压裱花
    else if (state.step === 2) {
      placePipingAt(pos.x, pos.y, true);
    }
    // Step 3: 放置或拖拽调整水果装饰（双视角坐标统一）
    else if (state.step === 3) {
      if (state.activeDecorTool.mode === 'scatter') {
        scatterSprinklesAt(pos.x, pos.y);
      } else {
        let hitItem = null;
        const viewMode = state.camera.viewMode;
        const hitBoost = viewMode === 'top' ? 1.18 : 1.0;
        for (let i = state.decorations.length - 1; i >= 0; i--) {
          const d = state.decorations[i];
          const wp = resolveItemWorldPos(d, viewMode);
          if (wp && Math.hypot(pos.x - wp.x, pos.y - wp.y) < 28 * d.scale * hitBoost) {
            hitItem = d;
            break;
          }
        }
        if (hitItem) {
          state.selectedDecorUid = hitItem.uid;
          sfx.playPop(600);
          updateSelectionToolbar();
        } else if (isPointOnCakeSurface(pos.x, pos.y)) {
          const surf = worldToSurface(pos.x, pos.y);
          const newDeco = {
            uid: Date.now() + Math.random(),
            type: state.activeDecorTool.id,
            x: pos.x,
            y: pos.y,
            surface: surf ? surf.surface : undefined,
            u: surf ? surf.u : undefined,
            v: surf ? surf.v : undefined,
            scale: 1,
            rot: (Math.random() - 0.5) * 0.35
          };
          state.decorations.push(newDeco);
          state.selectedDecorUid = newDeco.uid;
          sfx.playPop(540);
          updateSelectionToolbar();
          updatePromptAndProgress();
        } else {
          state.selectedDecorUid = null;
          updateSelectionToolbar();
        }
      }
    }
    // Step 4: 点击打开贺卡编辑
    else if (state.step === 4) {
      openCardModal();
    }
    // Step 5: 划火柴点亮蜡烛
    else if (state.step === 5) {
      checkLightCandleAt(pos.x, pos.y);
    }
  }

  function handlePointerMove(e) {
    if (activePointers.has(e.pointerId)) {
      const raw = getRawCanvasPos(e);
      activePointers.set(e.pointerId, { rawX: raw.rawX, rawY: raw.rawY });

      // 双指捏合缩放与双指平移
      if (gesture.mode === 'pinch' && activePointers.size === 2) {
        e.preventDefault();
        const pts = Array.from(activePointers.values());
        const dist = Math.max(10, Math.hypot(pts[1].rawX - pts[0].rawX, pts[1].rawY - pts[0].rawY));
        const midX = (pts[0].rawX + pts[1].rawX) * 0.5;
        const midY = (pts[0].rawY + pts[1].rawY) * 0.5;
        const dx = midX - gesture.lastMidX;
        const dy = midY - gesture.lastMidY;
        gesture.lastMidX = midX;
        gesture.lastMidY = midY;

        const nextZoom = gesture.startZoom * (dist / gesture.startDist);
        const cam = state.camera;
        const clamped = clampCameraPan(cam.targetZoom, cam.targetPanX + dx, cam.targetPanY + dy);
        cam.targetPanX = clamped.panX;
        cam.targetPanY = clamped.panY;
        cam.panX = clamped.panX;
        cam.panY = clamped.panY;
        setCameraZoom(nextZoom, midX, midY, true);
        return;
      }

      // 桌面端拖动画布平移
      if (gesture.mode === 'pan') {
        e.preventDefault();
        const dx = raw.rawX - gesture.lastMidX;
        const dy = raw.rawY - gesture.lastMidY;
        gesture.lastMidX = raw.rawX;
        gesture.lastMidY = raw.rawY;
        const cam = state.camera;
        const clamped = clampCameraPan(cam.targetZoom, cam.targetPanX + dx, cam.targetPanY + dy);
        cam.targetPanX = clamped.panX;
        cam.targetPanY = clamped.panY;
        cam.panX = clamped.panX;
        cam.panY = clamped.panY;
        return;
      }
    }

    if (!state.pointer.down || gesture.mode !== 'draw') return;
    e.preventDefault();
    const pos = getCanvasPos(e);
    state.pointer.vx = pos.x - state.pointer.x;
    state.pointer.vy = pos.y - state.pointer.y;
    state.pointer.x = pos.x;
    state.pointer.y = pos.y;

    if (state.step === 0) {
      if (state.layerPhase === 0 || state.layerPhase === 3) {
        continueFillingStrokeAt(pos.x, pos.y);
      } else if (state.layerPhase === 1 || state.layerPhase === 4) {
        if (Math.random() < 0.35) addFruitChunkAt(pos.x, pos.y);
      }
    } else if (state.step === 1) {
      continueFrostingStrokeAt(pos.x, pos.y);
    } else if (state.step === 2) {
      placePipingAt(pos.x, pos.y, false);
    } else if (state.step === 3) {
      if (state.activeDecorTool.mode === 'scatter') {
        scatterSprinklesAt(pos.x, pos.y);
      } else if (state.selectedDecorUid) {
        const item = state.decorations.find(d => d.uid === state.selectedDecorUid);
        if (item && isPointOnCakeSurface(pos.x, pos.y)) {
          item.x = pos.x;
          item.y = pos.y;
          const surf = worldToSurface(pos.x, pos.y);
          if (surf) {
            item.surface = surf.surface;
            item.u = surf.u;
            item.v = surf.v;
          }
        }
      }
    } else if (state.step === 5) {
      checkLightCandleAt(pos.x, pos.y);
    }
  }

  function handlePointerUp(e) {
    if (e && e.pointerId !== undefined) {
      activePointers.delete(e.pointerId);
    } else {
      activePointers.clear();
    }
    if (activePointers.size === 0) {
      gesture.mode = 'none';
      gesture.drawPushedUndo = false;
    }
    state.pointer.down = false;
    state.pointer.currentStroke = null;
    state.pointer.lastSurfaceHit = null;
    state.pointer.wetPickup = null;
    state.pointer.bladeColor = null;
    state.pointer.bladeColorHex = null;
    if (state.pointer.growingPipe) {
      state.pipings.push(state.pointer.growingPipe);
      state.pointer.growingPipe = null;
      updatePromptAndProgress();
    }
  }

  function isPointOnCakeSurface(px, py) {
    if (state.camera.viewMode === 'top') {
      return Math.hypot(px - TOP_VIEW.cx, py - TOP_VIEW.cy) <= TOP_VIEW.r + 12;
    }
    const ty = getCakeTopY();
    if (isInsideEllipse(px, py, CAKE.cx, ty, CAKE.rx + 12, CAKE.ry + 12)) return true;
    if (px >= CAKE.cx - CAKE.rx - 10 && px <= CAKE.cx + CAKE.rx + 10 && py >= ty && py <= CAKE.baseY + CAKE.ry) return true;
    return false;
  }

  // Step 0 辅助：将当前视角点击映射为夹心层归一化 (u, v) 与 2.5D 坐标 (x, y)
  function mapFillingPoint(px, py, surfY, marginRatio = 1.0) {
    if (state.camera.viewMode === 'top') {
      const r = TOP_VIEW.r * marginRatio;
      const u = (px - TOP_VIEW.cx) / TOP_VIEW.r;
      const v = (py - TOP_VIEW.cy) / TOP_VIEW.r;
      if (Math.hypot(px - TOP_VIEW.cx, py - TOP_VIEW.cy) > r + 8) return null;
      return {
        u,
        v,
        x: CAKE.cx + u * CAKE.rx,
        y: surfY + v * CAKE.ry
      };
    }
    if (!isInsideEllipse(px, py, CAKE.cx, surfY, CAKE.rx * marginRatio + 8, CAKE.ry * marginRatio + 6)) return null;
    return {
      u: (px - CAKE.cx) / CAKE.rx,
      v: (py - surfY) / CAKE.ry,
      x: px,
      y: py
    };
  }

  // Step 0 交互：连续一笔一划涂抹夹心果酱与奶油（支持 2.5D 与俯视双视角）
  function startFillingStrokeAt(px, py) {
    const fIdx = state.layerPhase === 0 ? 0 : 1;
    const surfY = getLayerTopY(fIdx);
    const pt = mapFillingPoint(px, py, surfY, 1.0);
    if (!pt) return;

    const filling = state.fillings[fIdx];
    filling.cream = state.fillingCream;
    const stroke = {
      points: [pt],
      size: state.brushSize || 24,
      color: {
        light: state.fillingCream.cream,
        mid: state.fillingCream.jam,
        shade: state.fillingCream.jam
      }
    };
    filling.strokes.push(stroke);
    state.pointer.currentStroke = stroke;
    filling.spreadProgress = Math.min(1, filling.spreadProgress + 0.02);
    sfx.playSwish();
    updatePromptAndProgress();
  }

  function continueFillingStrokeAt(px, py) {
    const fIdx = state.layerPhase === 0 ? 0 : 1;
    const surfY = getLayerTopY(fIdx);
    const pt = mapFillingPoint(px, py, surfY, 1.0);
    if (!pt) return;

    let stroke = state.pointer.currentStroke;
    const filling = state.fillings[fIdx];
    if (!stroke) {
      startFillingStrokeAt(px, py);
      return;
    }
    const lastPt = stroke.points[stroke.points.length - 1];
    if (Math.hypot(pt.x - lastPt.x, pt.y - lastPt.y) < 3) return;

    stroke.points.push(pt);
    const gain = (state.brushSize || 24) / 1600;
    const prevProg = filling.spreadProgress;
    filling.spreadProgress = Math.min(1, filling.spreadProgress + gain);
    sfx.playSwish();

    if (prevProg < 1 && filling.spreadProgress >= 1) {
      sfx.playChime();
      updateUI();
    } else {
      updatePromptAndProgress();
    }
  }

  // Step 0 交互：撒入鲜切水果粒（支持 2.5D 与俯视双视角）
  function addFruitChunkAt(px, py) {
    const fIdx = (state.layerPhase <= 2) ? 0 : 1;
    const surfY = getLayerTopY(fIdx);
    const pt = mapFillingPoint(px, py, surfY, 0.9);
    if (!pt) return;

    const filling = state.fillings[fIdx];
    const last = filling.chunks[filling.chunks.length - 1];
    if (last && Math.hypot(pt.x - last.x, pt.y - last.y) < 18) return;

    filling.fruit = state.fillingFruit;
    filling.chunks.push({
      x: pt.x,
      y: pt.y,
      u: pt.u,
      v: pt.v,
      fruit: state.fillingFruit,
      s: 0.85 + Math.random() * 0.35,
      rot: (Math.random() - 0.5) * 1.2
    });
    sfx.playPop(560 + filling.chunks.length * 15);

    if (filling.chunks.length >= 10) {
      state.layerPhase = fIdx === 0 ? 2 : 5;
      sfx.playChime();
      updateUI();
    } else {
      updatePromptAndProgress();
    }
  }

  // Phase 2：采样表面局部 5 点在线性空间的平均底色（用于湿画法自然混色）
  function sampleLocalAlbedo(buf, px, py, radius) {
    const w = buf.width;
    const h = buf.height;
    const wrapX = buf.wrapX;
    const off = Math.max(2, radius * 0.45);
    const pts = [
      [px, py],
      [px - off, py],
      [px + off, py],
      [px, py - off],
      [px, py + off]
    ];
    let r = 0, g = 0, b = 0, count = 0;
    for (let i = 0; i < pts.length; i++) {
      let sx = Math.round(pts[i][0]);
      const sy = Math.max(0, Math.min(h - 1, Math.round(pts[i][1])));
      if (wrapX) {
        sx = ((sx % w) + w) % w;
      } else if (sx < 0 || sx >= w) {
        continue;
      }
      const i4 = (sy * w + sx) * 4;
      r += buf.albedo[i4];
      g += buf.albedo[i4 + 1];
      b += buf.albedo[i4 + 2];
      count++;
    }
    if (count === 0) return { r: 0.9, g: 0.85, b: 0.78 };
    return { r: r / count, g: g / count, b: b / count };
  }

  // Phase 2：软羽化 + 线性空间湿混 + 方向性柔和棱纹奶油笔刷（彻底告别硬边缘与发灰脏边）
  function stampCreamBrush(hit, brushSize, colorObj, dirX = 1, dirY = 0) {
    const buf = hit.buf;
    const w = buf.width;
    const h = buf.height;
    const wrapX = buf.wrapX;
    const isBlendStyle = state.creamStyle === 'blend';

    // 柔雾渐变模式半径稍宽，过渡更柔和
    const baseScale = hit.surface === 'top' ? 1.45 : 1.72;
    const radius = brushSize * baseScale * (isBlendStyle ? 1.28 : 1.0);

    // 目标奶油线性色
    const rgb = hexToRgb(colorObj.mid);
    const targetR = srgbToLin(rgb.r);
    const targetG = srgbToLin(rgb.g);
    const targetB = srgbToLin(rgb.b);

    // 湿画法底色采样与动态混色（避免不同颜色交界处硬切）
    const under = sampleLocalAlbedo(buf, hit.px, hit.py, radius);
    if (!state.pointer.wetPickup) {
      state.pointer.wetPickup = { r: under.r, g: under.g, b: under.b };
    } else {
      // 平滑追踪当前笔尖下方的底色
      state.pointer.wetPickup.r += (under.r - state.pointer.wetPickup.r) * 0.35;
      state.pointer.wetPickup.g += (under.g - state.pointer.wetPickup.g) * 0.35;
      state.pointer.wetPickup.b += (under.b - state.pointer.wetPickup.b) * 0.35;
    }

    const wetRatio = isBlendStyle ? 0.44 : 0.20;
    const mixR = targetR * (1 - wetRatio) + state.pointer.wetPickup.r * wetRatio;
    const mixG = targetG * (1 - wetRatio) + state.pointer.wetPickup.g * wetRatio;
    const mixB = targetB * (1 - wetRatio) + state.pointer.wetPickup.b * wetRatio;

    // 垂直于笔触移动方向的法向量（用于立体奶油的柔和棱纹）
    const perpX = -dirY;
    const perpY = dirX;
    const ridgeFreq = (Math.PI * 3.0) / Math.max(8, radius);

    const x0 = Math.floor(hit.px - radius);
    const x1 = Math.ceil(hit.px + radius);
    const y0 = Math.max(0, Math.floor(hit.py - radius));
    const y1 = Math.min(h - 1, Math.ceil(hit.py + radius));
    const r2 = radius * radius;
    const invR = 1 / radius;

    const maxFlow = isBlendStyle ? 0.28 : 0.46;

    for (let y = y0; y <= y1; y++) {
      const dy = y - hit.py;
      const rowOff = y * w;
      for (let x = x0; x <= x1; x++) {
        const dx = x - hit.px;
        const d2 = dx * dx + dy * dy;
        if (d2 >= r2) continue;

        let sx = x;
        if (wrapX) {
          sx = ((x % w) + w) % w;
        } else if (x < 0 || x >= w) {
          continue;
        }

        const normDist2 = d2 * invR * invR; // (r/R)^2 ∈ [0, 1)
        let falloff;
        if (isBlendStyle) {
          // C2 连续双平方核：全程平滑羽化，边缘导数为 0，零硬边
          const q = 1 - normDist2;
          falloff = q * q;
        } else {
          // 立体奶油：中心饱满、外圈 40% 平滑羽化
          const normDist = Math.sqrt(normDist2);
          if (normDist <= 0.55) {
            falloff = 1.0;
          } else {
            const u = (1.0 - normDist) / 0.45;
            falloff = u * u * (3 - 2 * u);
          }
        }

        const alpha = falloff * maxFlow;
        const idx = rowOff + sx;
        const i4 = idx * 4;

        // 线性近似空间柔和混色
        buf.albedo[i4] += (mixR - buf.albedo[i4]) * alpha;
        buf.albedo[i4 + 1] += (mixG - buf.albedo[i4 + 1]) * alpha;
        buf.albedo[i4 + 2] += (mixB - buf.albedo[i4 + 2]) * alpha;

        // 高度场沉积：柔雾模式平滑微隆，立体模式带柔和波浪棱纹（边缘自动衰减归零）
        if (isBlendStyle) {
          const targetH = Math.max(buf.heightMap[idx], 0.36);
          buf.heightMap[idx] += (targetH - buf.heightMap[idx]) * (alpha * 0.45);
        } else {
          const perpDist = dx * perpX + dy * perpY;
          const ridge = 0.5 + 0.5 * Math.cos(perpDist * ridgeFreq);
          const targetH = Math.min(0.95, 0.34 + falloff * (0.28 + ridge * 0.24));
          buf.heightMap[idx] += (targetH - buf.heightMap[idx]) * (alpha * 0.52);
        }
      }
    }
    buf.markDirty(x0 - 2, y0 - 2, x1 + 2, y1 + 2);
  }

  // Phase 3：紧凑型撤销栈（最多保存 12 步，支持顶面/侧面/流心酱统一撤销）
  function pushSurfaceUndo(kind, surfaceName = null) {
    if (!state.surfaceUndoStack) state.surfaceUndoStack = [];
    if (kind === 'sauce') {
      state.surfaceUndoStack.push({ kind: 'sauce' });
    } else if (kind === 'both') {
      state.surfaceUndoStack.push({
        kind: 'both',
        top: state.topSurface.captureSnapshot(),
        side: state.sideSurface.captureSnapshot(),
        baseCoatColor: state.baseCoatColor
      });
    } else if (surfaceName === 'top') {
      state.surfaceUndoStack.push({ kind: 'top', data: state.topSurface.captureSnapshot() });
    } else if (surfaceName === 'side') {
      state.surfaceUndoStack.push({ kind: 'side', data: state.sideSurface.captureSnapshot() });
    }
    if (state.surfaceUndoStack.length > 12) {
      state.surfaceUndoStack.shift();
    }
  }

  function undoFrostingAction() {
    if (!state.surfaceUndoStack || state.surfaceUndoStack.length === 0) {
      if (state.frostStrokes.length > 0) state.frostStrokes.pop();
      return;
    }
    const entry = state.surfaceUndoStack.pop();
    if (entry.kind === 'sauce') {
      state.frostStrokes.pop();
    } else if (entry.kind === 'top') {
      state.topSurface.restoreSnapshot(entry.data);
    } else if (entry.kind === 'side') {
      state.sideSurface.restoreSnapshot(entry.data);
    } else if (entry.kind === 'both') {
      state.topSurface.restoreSnapshot(entry.top);
      state.sideSurface.restoreSnapshot(entry.side);
      if (entry.baseCoatColor) state.baseCoatColor = entry.baseCoatColor;
    }
  }

  // Phase 3 核心：Nomad 风格物理刮刀（ROI 可分离平滑核 + 方向推匀 + 高度展平，彻底杜绝小圆斑）
  function applySpatulaStep(hit, brushSize, mode, dirX = 1, dirY = 0) {
    const buf = hit.buf;
    const w = buf.width;
    const h = buf.height;
    const wrapX = buf.wrapX;

    const baseScale = hit.surface === 'top' ? 1.55 : 1.85;
    const radius = Math.max(16, brushSize * baseScale);
    const blurRad = Math.max(3, Math.min(14, Math.round(radius * 0.25)));
    const pad = blurRad + 2;

    const cx = hit.px;
    const cy = hit.py;
    const roiX0 = Math.floor(cx - radius - pad);
    const roiX1 = Math.ceil(cx + radius + pad);
    const roiY0 = Math.max(0, Math.floor(cy - radius - pad));
    const roiY1 = Math.min(h - 1, Math.ceil(cy + radius + pad));

    const rw = roiX1 - roiX0 + 1;
    const rh = roiY1 - roiY0 + 1;
    if (rw <= 2 || rh <= 2) return;

    // 1. 提取 ROI 内的线性颜色与高度到临时局部数组（4通道：r, g, b, height）
    const total = rw * rh;
    const src = new Float32Array(total * 4);
    const tmpH = new Float32Array(total * 4);
    const blurred = new Float32Array(total * 4);
    const albedo = buf.albedo;
    const hm = buf.heightMap;

    for (let ry = 0; ry < rh; ry++) {
      const sy = roiY0 + ry;
      const rowOff = sy * w;
      const dstRow = ry * rw;
      for (let rx = 0; rx < rw; rx++) {
        let sx = roiX0 + rx;
        if (wrapX) {
          sx = ((sx % w) + w) % w;
        } else {
          sx = sx < 0 ? 0 : (sx >= w ? w - 1 : sx);
        }
        const sIdx = rowOff + sx;
        const s4 = sIdx * 4;
        const d4 = (dstRow + rx) * 4;
        src[d4] = albedo[s4];
        src[d4 + 1] = albedo[s4 + 1];
        src[d4 + 2] = albedo[s4 + 2];
        src[d4 + 3] = hm[sIdx];
      }
    }

    // 2. 水平 1D 滑动窗口均值滤波（O(1)/像素）
    const winSize = blurRad * 2 + 1;
    const invWin = 1 / winSize;
    for (let ry = 0; ry < rh; ry++) {
      const rowBase = ry * rw * 4;
      let sr = 0, sg = 0, sb = 0, sh = 0;
      for (let k = -blurRad; k <= blurRad; k++) {
        const kx = k < 0 ? 0 : (k >= rw ? rw - 1 : k);
        const p4 = rowBase + kx * 4;
        sr += src[p4]; sg += src[p4 + 1]; sb += src[p4 + 2]; sh += src[p4 + 3];
      }
      for (let rx = 0; rx < rw; rx++) {
        const o4 = rowBase + rx * 4;
        tmpH[o4] = sr * invWin;
        tmpH[o4 + 1] = sg * invWin;
        tmpH[o4 + 2] = sb * invWin;
        tmpH[o4 + 3] = sh * invWin;

        const addX = rx + blurRad + 1 < rw ? rx + blurRad + 1 : rw - 1;
        const remX = rx - blurRad > 0 ? rx - blurRad : 0;
        const a4 = rowBase + addX * 4;
        const r4 = rowBase + remX * 4;
        sr += src[a4] - src[r4];
        sg += src[a4 + 1] - src[r4 + 1];
        sb += src[a4 + 2] - src[r4 + 2];
        sh += src[a4 + 3] - src[r4 + 3];
      }
    }

    // 3. 垂直 1D 滑动窗口均值滤波 -> 得到平滑目标场 blurred
    for (let rx = 0; rx < rw; rx++) {
      let sr = 0, sg = 0, sb = 0, sh = 0;
      for (let k = -blurRad; k <= blurRad; k++) {
        const ky = k < 0 ? 0 : (k >= rh ? rh - 1 : k);
        const p4 = (ky * rw + rx) * 4;
        sr += tmpH[p4]; sg += tmpH[p4 + 1]; sb += tmpH[p4 + 2]; sh += tmpH[p4 + 3];
      }
      for (let ry = 0; ry < rh; ry++) {
        const o4 = (ry * rw + rx) * 4;
        blurred[o4] = sr * invWin;
        blurred[o4 + 1] = sg * invWin;
        blurred[o4 + 2] = sb * invWin;
        blurred[o4 + 3] = sh * invWin;

        const addY = ry + blurRad + 1 < rh ? ry + blurRad + 1 : rh - 1;
        const remY = ry - blurRad > 0 ? ry - blurRad : 0;
        const a4 = (addY * rw + rx) * 4;
        const r4 = (remY * rw + rx) * 4;
        sr += tmpH[a4] - tmpH[r4];
        sg += tmpH[a4 + 1] - tmpH[r4 + 1];
        sb += tmpH[a4 + 2] - tmpH[r4 + 2];
        sh += tmpH[a4 + 3] - tmpH[r4 + 3];
      }
    }

    // 更新刀刃沾色记忆（供拉丝过渡与工具刃口视觉反馈）
    const cRx = Math.max(0, Math.min(rw - 1, Math.round(cx - roiX0)));
    const cRy = Math.max(0, Math.min(rh - 1, Math.round(cy - roiY0)));
    const c4 = (cRy * rw + cRx) * 4;
    if (!state.pointer.bladeColor) {
      state.pointer.bladeColor = { r: blurred[c4], g: blurred[c4 + 1], b: blurred[c4 + 2] };
    } else {
      state.pointer.bladeColor.r += (blurred[c4] - state.pointer.bladeColor.r) * 0.25;
      state.pointer.bladeColor.g += (blurred[c4 + 1] - state.pointer.bladeColor.g) * 0.25;
      state.pointer.bladeColor.b += (blurred[c4 + 2] - state.pointer.bladeColor.b) * 0.25;
    }
    const bc = state.pointer.bladeColor;
    state.pointer.bladeColorHex = `rgb(${linToSrgb(bc.r)},${linToSrgb(bc.g)},${linToSrgb(bc.b)})`;

    // 4. 按 C2 双平方衰减核写回：平滑融合 + 方向性奶油推匀 + 高度场展平
    const strength = mode.strength;
    const drag = mode.drag;
    const shift = Math.min(blurRad * 0.9, 5.0);
    const invR2 = 1 / (radius * radius);

    const innerX0 = Math.floor(cx - radius);
    const innerX1 = Math.ceil(cx + radius);
    const innerY0 = Math.max(0, Math.floor(cy - radius));
    const innerY1 = Math.min(h - 1, Math.ceil(cy + radius));

    for (let y = innerY0; y <= innerY1; y++) {
      const dy = y - cy;
      const ry = y - roiY0;
      const rowOff = y * w;
      for (let x = innerX0; x <= innerX1; x++) {
        const dx = x - cx;
        const d2 = dx * dx + dy * dy;
        if (d2 >= radius * radius) continue;

        let sx = x;
        if (wrapX) {
          sx = ((x % w) + w) % w;
        } else if (x < 0 || x >= w) {
          continue;
        }

        // C2 连续双平方核：边缘导数为 0，彻底无圆圈边界
        const q = 1 - d2 * invR2;
        const falloff = q * q;

        const rx = x - roiX0;
        const b4 = (ry * rw + rx) * 4;

        // 沿反移动方向采样上游平滑值，产生真实刮刀推匀延展感
        const upRx = Math.max(0, Math.min(rw - 1, Math.round(rx - dirX * shift)));
        const upRy = Math.max(0, Math.min(rh - 1, Math.round(ry - dirY * shift)));
        const u4 = (upRy * rw + upRx) * 4;

        const targetR = blurred[b4] * (1 - drag) + blurred[u4] * drag;
        const targetG = blurred[b4 + 1] * (1 - drag) + blurred[u4 + 1] * drag;
        const targetB = blurred[b4 + 2] * (1 - drag) + blurred[u4 + 2] * drag;
        const targetH = blurred[b4 + 3] * (1 - drag * 0.5) + blurred[u4 + 3] * (drag * 0.5);

        const idx = rowOff + sx;
        const i4 = idx * 4;
        const colorW = falloff * strength * 0.72;
        const heightW = falloff * Math.min(0.95, strength * 1.15);

        // 混入微弱刀刃沾色增强拉丝渐变自然度
        const finalR = targetR * 0.92 + bc.r * 0.08;
        const finalG = targetG * 0.92 + bc.g * 0.08;
        const finalB = targetB * 0.92 + bc.b * 0.08;

        albedo[i4] += (finalR - albedo[i4]) * colorW;
        albedo[i4 + 1] += (finalG - albedo[i4 + 1]) * colorW;
        albedo[i4 + 2] += (finalB - albedo[i4 + 2]) * colorW;
        hm[idx] += (targetH - hm[idx]) * heightW;
      }
    }

    buf.markDirty(innerX0 - 2, innerY0 - 2, innerX1 + 2, innerY1 + 2);
  }

  // 一键转盘抹平：对侧面执行水平环绕平滑，对顶面执行柔和展平，模拟真实转盘收光
  function autoTurntableSmooth() {
    pushSurfaceUndo('both');
    const smoothHorizontal = (buf, rad, blendC, blendH) => {
      const w = buf.width;
      const h = buf.height;
      const wrapX = buf.wrapX;
      const win = rad * 2 + 1;
      const inv = 1 / win;
      const albedo = buf.albedo;
      const hm = buf.heightMap;
      const rowR = new Float32Array(w);
      const rowG = new Float32Array(w);
      const rowB = new Float32Array(w);
      const rowH = new Float32Array(w);

      for (let y = 0; y < h; y++) {
        const off = y * w;
        let sr = 0, sg = 0, sb = 0, sh = 0;
        for (let k = -rad; k <= rad; k++) {
          const kx = wrapX ? ((k % w) + w) % w : Math.max(0, Math.min(w - 1, k));
          const i4 = (off + kx) * 4;
          sr += albedo[i4]; sg += albedo[i4 + 1]; sb += albedo[i4 + 2]; sh += hm[off + kx];
        }
        for (let x = 0; x < w; x++) {
          rowR[x] = sr * inv; rowG[x] = sg * inv; rowB[x] = sb * inv; rowH[x] = sh * inv;
          const ax = wrapX ? ((x + rad + 1) % w + w) % w : Math.min(w - 1, x + rad + 1);
          const rx = wrapX ? ((x - rad) % w + w) % w : Math.max(0, x - rad);
          const a4 = (off + ax) * 4;
          const r4 = (off + rx) * 4;
          sr += albedo[a4] - albedo[r4];
          sg += albedo[a4 + 1] - albedo[r4 + 1];
          sb += albedo[a4 + 2] - albedo[r4 + 2];
          sh += hm[off + ax] - hm[off + rx];
        }
        for (let x = 0; x < w; x++) {
          const i4 = (off + x) * 4;
          albedo[i4] += (rowR[x] - albedo[i4]) * blendC;
          albedo[i4 + 1] += (rowG[x] - albedo[i4 + 1]) * blendC;
          albedo[i4 + 2] += (rowB[x] - albedo[i4 + 2]) * blendC;
          hm[off + x] += (rowH[x] - hm[off + x]) * blendH;
        }
      }
      buf.rebuildRegion(0, 0, w - 1, h - 1);
      buf.dirty = null;
    };

    smoothHorizontal(state.sideSurface, 12, 0.55, 0.82);
    smoothHorizontal(state.topSurface, 7, 0.42, 0.78);
    state.turntableAngle += 0.9;
    sfx.playChime();
  }

  // Step 1 交互：双通道表面奶油抹面、Nomad 级丝滑刮刀、巧克力酱画笔与淋面
  function startFrostingStrokeAt(px, py) {
    if (!isPointOnCakeSurface(px, py)) return;
    ensureBrushState();

    // 若在“边缘淋面”标签下，滑动顶缘挤出垂落水滴
    if (state.subTab === 'drip' && state.dripGlaze.color) {
      continueFrostingStrokeAt(px, py);
      return;
    }

    const isSauce = state.subTab === 'sauce';
    if (isSauce) {
      pushSurfaceUndo('sauce');
      const hitS = worldToSurface(px, py);
      const pt = hitS ? { x: px, y: py, surface: hitS.surface, u: hitS.u, v: hitS.v } : { x: px, y: py };
      const stroke = {
        points: [pt],
        size: state.brushSize || 24,
        isSauce: true,
        color: state.saucePen,
        shards: []
      };
      state.frostStrokes.push(stroke);
      state.pointer.currentStroke = stroke;
      state.roughCoverage = Math.min(1, state.roughCoverage + 0.015);
      sfx.playSwish();
      updatePromptAndProgress();
      return;
    }

    const hit = worldToSurface(px, py);
    if (!hit) return;
    pushSurfaceUndo(hit.surface, hit.surface);
    state.pointer.lastSurfaceHit = hit;
    state.pointer.wetPickup = null;
    state.pointer.bladeColor = null;

    if (state.subTab === 'spatula') {
      applySpatulaStep(hit, state.brushSize || 24, state.spatulaMode || SPATULA_MODES[1], 1, 0);
      sfx.playScrape(1);
      updatePromptAndProgress();
      return;
    }

    stampCreamBrush(hit, state.brushSize || 24, state.frostingColor, 1, 0);
    state.roughCoverage = Math.min(1, state.roughCoverage + 0.015);
    sfx.playSwish();
    updatePromptAndProgress();
  }

  function continueFrostingStrokeAt(px, py) {
    if (!isPointOnCakeSurface(px, py)) return;
    ensureBrushState();

    // 边缘甘纳许淋面拖动
    if (state.subTab === 'drip' && state.dripGlaze.color) {
      const relX = (px - (CAKE.cx - CAKE.rx)) / (CAKE.rx * 2);
      if (relX >= 0 && relX <= 1) {
        const col = Math.floor(relX * state.drips.length);
        for (let k = Math.max(0, col - 1); k <= Math.min(state.drips.length - 1, col + 1); k++) {
          state.drips[k] = Math.min(88, Math.max(state.drips[k], 24 + Math.random() * 52));
        }
        sfx.playSwish();
        updatePromptAndProgress();
      }
      return;
    }

    // 流心酱画笔仍走矢量线条与脆片
    if (state.subTab === 'sauce') {
      let stroke = state.pointer.currentStroke;
      if (!stroke) {
        startFrostingStrokeAt(px, py);
        return;
      }
      const lastPt = stroke.points[stroke.points.length - 1];
      if (Math.hypot(px - lastPt.x, py - lastPt.y) < 4) return;
      const hitS = worldToSurface(px, py);
      stroke.points.push(hitS ? { x: px, y: py, surface: hitS.surface, u: hitS.u, v: hitS.v } : { x: px, y: py });
      if (stroke.shards && Math.random() < 0.16) {
        const sx = px + (Math.random() - 0.5) * 10;
        const sy = py + (Math.random() - 0.5) * 10;
        const shHit = worldToSurface(sx, sy);
        stroke.shards.push({
          x: sx,
          y: sy,
          surface: shHit ? shHit.surface : undefined,
          u: shHit ? shHit.u : undefined,
          v: shHit ? shHit.v : undefined,
          w: 7 + Math.random() * 6,
          h: 4 + Math.random() * 4,
          rot: Math.random() * Math.PI
        });
      }
      sfx.playSwish();
      updatePromptAndProgress();
      return;
    }

    const hit = worldToSurface(px, py);
    if (!hit) {
      state.pointer.lastSurfaceHit = null;
      return;
    }
    const isSpatula = state.subTab === 'spatula';
    const prev = state.pointer.lastSurfaceHit;
    if (prev && prev.surface === hit.surface) {
      let dx = hit.px - prev.px;
      if (hit.buf.wrapX) {
        const halfW = hit.buf.width * 0.5;
        if (dx > halfW) dx -= hit.buf.width;
        else if (dx < -halfW) dx += hit.buf.width;
      }
      const dy = hit.py - prev.py;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.8) return;
      const dirX = dx / dist;
      const dirY = dy / dist;
      const step = Math.max(isSpatula ? 2.5 : 1.5, (state.brushSize || 24) * (isSpatula ? 0.24 : 0.16));
      const steps = Math.min(18, Math.max(1, Math.ceil(dist / step)));
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        let ipx = prev.px + dx * t;
        if (hit.buf.wrapX) ipx = ((ipx % hit.buf.width) + hit.buf.width) % hit.buf.width;
        const subHit = {
          surface: hit.surface,
          buf: hit.buf,
          px: ipx,
          py: prev.py + dy * t
        };
        if (isSpatula) {
          applySpatulaStep(subHit, state.brushSize || 24, state.spatulaMode || SPATULA_MODES[1], dirX, dirY);
        } else {
          stampCreamBrush(subHit, state.brushSize || 24, state.frostingColor, dirX, dirY);
        }
      }
      if (isSpatula) sfx.playScrape(dist);
    } else {
      if (isSpatula) {
        applySpatulaStep(hit, state.brushSize || 24, state.spatulaMode || SPATULA_MODES[1], 1, 0);
        sfx.playScrape(1);
      } else {
        stampCreamBrush(hit, state.brushSize || 24, state.frostingColor, 1, 0);
      }
    }
    state.pointer.lastSurfaceHit = hit;

    if (!isSpatula) {
      const prevCov = state.roughCoverage;
      const gain = (state.brushSize || 24) / 2200;
      state.roughCoverage = Math.min(1, state.roughCoverage + gain);
      state.smoothProgress = state.roughCoverage;
      sfx.playSwish();

      if (prevCov < 1 && state.roughCoverage >= 1) {
        state.frostPhase = 2;
        sfx.playChime();
      }
    }
    updatePromptAndProgress();
  }

  // Step 2 交互：挤压立体奶油裱花（支持双视角坐标统一与环形对称）
  function placePipingAt(px, py, isFirstDown) {
    if (!isPointOnCakeSurface(px, py)) return;
    const viewMode = state.camera.viewMode;
    const minDist = viewMode === 'top' ? 32 : 26;
    for (let i = state.pipings.length - 1; i >= 0; i--) {
      const wp = resolveItemWorldPos(state.pipings[i], viewMode);
      if (wp && Math.hypot(px - wp.x, py - wp.y) < minDist) return;
    }

    const surf = worldToSurface(px, py);
    const centerX = viewMode === 'top' ? TOP_VIEW.cx : CAKE.cx;
    const centerY = viewMode === 'top' ? TOP_VIEW.cy : getCakeTopY();
    const angle = Math.atan2(py - centerY, px - centerX);
    const newPipe = {
      x: px,
      y: py,
      surface: surf ? surf.surface : undefined,
      u: surf ? surf.u : undefined,
      v: surf ? surf.v : undefined,
      nozzleId: state.pipingNozzle.id,
      color: state.pipingColor,
      scale: isFirstDown ? 0.85 : 1,
      angle
    };
    state.pipings.push(newPipe);

    if (state.pipingSymmetry && surf && surf.surface === 'top') {
      const symU = -surf.u;
      const symV = -surf.v;
      const symWp = surfaceToWorld('top', symU, symV, viewMode);
      if (symWp && Math.hypot(symWp.x - px, symWp.y - py) > 30) {
        state.pipings.push({
          x: symWp.x,
          y: symWp.y,
          surface: 'top',
          u: symU,
          v: symV,
          nozzleId: state.pipingNozzle.id,
          color: state.pipingColor,
          scale: 1,
          angle: angle + Math.PI
        });
      }
    }

    sfx.playPop(480 + (state.pipings.length % 8) * 20);
    updatePromptAndProgress();
  }

  // Step 3 交互：挥洒珍珠糖、金箔与彩糖针（支持双视角坐标统一）
  function scatterSprinklesAt(px, py) {
    if (!isPointOnCakeSurface(px, py)) return;
    const viewMode = state.camera.viewMode;
    const last = state.sprinkles[state.sprinkles.length - 1];
    if (last) {
      const lwp = resolveItemWorldPos(last, viewMode);
      if (lwp && Math.hypot(px - lwp.x, py - lwp.y) < 14) return;
    }

    const sugarColors = ['#FF8FA0', '#F2B749', '#88C9A1', '#9AC4F8', '#FFF5E4'];
    const goldColors = ['#F9D968', '#E5B83B', '#FFF0A8'];
    const t = state.activeDecorTool.id;

    for (let i = 0; i < 2; i++) {
      const sx = px + (Math.random() - 0.5) * 24;
      const sy = py + (Math.random() - 0.5) * 16;
      const surf = worldToSurface(sx, sy);
      state.sprinkles.push({
        type: t,
        x: sx,
        y: sy,
        surface: surf ? surf.surface : undefined,
        u: surf ? surf.u : undefined,
        v: surf ? surf.v : undefined,
        size: t === 'sprinkle_pearl' ? 3.5 + Math.random() * 2 : 4 + Math.random() * 2.5,
        angle: Math.random() * Math.PI * 2,
        color: t === 'sprinkle_gold'
          ? goldColors[Math.floor(Math.random() * goldColors.length)]
          : sugarColors[Math.floor(Math.random() * sugarColors.length)]
      });
    }
    sfx.playPop(740);
    updatePromptAndProgress();
  }

  // Step 5 交互：划火柴靠近烛芯点亮蜡烛（支持双视角坐标）
  function checkLightCandleAt(px, py) {
    if (state.candlesLit) return;
    const viewMode = state.camera.viewMode;
    const candles = state.decorations.filter(d => d.type === 'candle');
    candles.forEach(c => {
      const wp = resolveItemWorldPos(c, viewMode);
      if (wp && Math.hypot(px - wp.x, py - (wp.y - 46)) < 54) {
        state.candlesLit = true;
        state.wishBlown = false;
        sfx.playChime();
        updateUI();
      }
    });
  }

  // 吹灭蜡烛与许愿彩带仪式
  function blowOutCandles() {
    if (!state.candlesLit || state.wishBlown) return;
    state.wishBlown = true;
    sfx.playChime();

    const candles = state.decorations.filter(d => d.type === 'candle');
    candles.forEach(c => {
      for (let i = 0; i < 10; i++) {
        state.smokeParticles.push({
          x: c.x,
          y: c.y - 48 - i * 3,
          vy: 0.7 + Math.random() * 0.6,
          r: 3 + i * 0.6,
          alpha: 0.65,
          seed: Math.random() * 10
        });
      }
    });

    const colors = ['#E86A53', '#F2B749', '#88C9A1', '#F7A1AE', '#9AC4F8'];
    for (let i = 0; i < 55; i++) {
      state.confettiParticles.push({
        x: CAKE.cx + (Math.random() - 0.5) * 320,
        y: 60 + Math.random() * 120,
        vx: (Math.random() - 0.5) * 3,
        vy: 2 + Math.random() * 3.5,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.15,
        color: colors[i % colors.length]
      });
    }
    updateUI();
  }

      const colors = type === 'sprinkle_gold' ? ['#F9D968', '#E5B83B'] : ['#FF8FA0', '#F2B749', '#88C9A1', '#FFF'];
      for (let i = 0; i < 12; i++) {
        cctx.fillStyle = colors[i % colors.length];
        cctx.beginPath();
        cctx.arc(14 + (i % 4) * 9, 15 + Math.floor(i / 4) * 11, 3.5, 0, Math.PI * 2);

    ];
    sizes.forEach(sz => {
      const pill = document.createElement('div');
      pill.className = `sub-tab ${state.brushSize === sz.val ? 'active' : ''}`;
      pill.style.fontWeight = '700';
      pill.textContent = sz.label;
      pill.onclick = () => {
        state.brushSize = sz.val;
        sfx.playPop(540);
        updateUI();
      };
      subTabsEl.appendChild(pill);
    });
  }

  function updateUI() {
    ensureBrushState();

    // 1. 顶部步骤条高亮
    document.querySelectorAll('#stepperBar .step-item').forEach(el => {
      const s = Number(el.dataset.step);
      el.classList.toggle('active', s === state.step);
      el.classList.toggle('done', s < state.step);
    });

    updatePromptAndProgress();
    updateSelectionToolbar();
    updateCameraControlsUI();

    // 2. 右侧浮动快捷工具栏
    floatingToolsEl.innerHTML = '';
    if (state.step === 0) {
      if (state.layerPhase === 0 || state.layerPhase === 3) {
        const toFruitBtn = document.createElement('button');
        toFruitBtn.className = 'float-pill active';
        toFruitBtn.textContent = '涂好了，下一步撒果粒';
        toFruitBtn.onclick = () => {
          const fIdx = state.layerPhase === 0 ? 0 : 1;
          state.fillings[fIdx].spreadProgress = 1;
          state.layerPhase = fIdx === 0 ? 1 : 4;
          state.subTab = 'fruit';
          sfx.playChime();
          updateUI();
        };
        floatingToolsEl.appendChild(toFruitBtn);
      }
      if (state.layerPhase < 6) {
        const quickBtn = document.createElement('button');
        quickBtn.className = 'float-pill';
        quickBtn.textContent = '一键完成当前层';
        quickBtn.onclick = () => {
          const fIdx = state.layerPhase <= 2 ? 0 : 1;
          const surfY = getLayerTopY(fIdx);
          state.fillings[fIdx].spreadProgress = 1;
          // 自动生成一圈螺旋夹心纹理
          const spiralPts = [];
          for (let a = 0; a < Math.PI * 5; a += 0.25) {
            const r = (a / (Math.PI * 5)) * 0.85;
            spiralPts.push({
              x: CAKE.cx + Math.cos(a) * CAKE.rx * r,
              y: surfY + Math.sin(a) * CAKE.ry * r
            });
          }
          state.fillings[fIdx].strokes.push({
            points: spiralPts,
            size: 28,
            color: { light: state.fillingCream.cream, mid: state.fillingCream.jam, shade: state.fillingCream.jam }
          });
          while (state.fillings[fIdx].chunks.length < 10) {
            const a = Math.random() * Math.PI * 2;
            const r = Math.random() * 0.75;
            state.fillings[fIdx].chunks.push({
              x: CAKE.cx + Math.cos(a) * CAKE.rx * r,
              y: surfY + Math.sin(a) * CAKE.ry * r,
              fruit: state.fillingFruit,
              s: 1, rot: a
            });
          }
          if (fIdx === 0) {
            state.layersVisible = 2;
            state.dropAnimY = -100;
            state.layerPhase = 3;
            state.subTab = 'cream';
          } else {
            state.layersVisible = 3;
            state.dropAnimY = -100;
            state.layerPhase = 6;
          }
          sfx.playChime();
          updateUI();
        };
        floatingToolsEl.appendChild(quickBtn);
      }
    } else if (state.step === 1) {
      // 撤销上一笔（支持奶油抹面、刮刀磨平、流心酱与换底色）
      const hasUndo = (state.surfaceUndoStack && state.surfaceUndoStack.length > 0) || state.frostStrokes.length > 0;
      if (hasUndo) {
        const undoStrokeBtn = document.createElement('button');
        undoStrokeBtn.className = 'float-pill';
        undoStrokeBtn.textContent = '撤销上一笔';
        undoStrokeBtn.onclick = () => {
          undoFrostingAction();
          sfx.playPop(380);
          updateUI();
        };
        floatingToolsEl.appendChild(undoStrokeBtn);
      }

      // 一键转盘抹平（带转盘旋转的温和水平收光）
      const autoSmoothBtn = document.createElement('button');
      autoSmoothBtn.className = 'float-pill';
      autoSmoothBtn.textContent = '一键转盘抹平';
      autoSmoothBtn.onclick = () => {
        autoTurntableSmooth();
        updateUI();
      };
      floatingToolsEl.appendChild(autoSmoothBtn);

      // 切换软边立体奶油 / 柔雾渐变混色模式
      if (state.subTab === 'frostColor') {
        const texToggleBtn = document.createElement('button');
        const isBlend = state.creamStyle === 'blend';
        texToggleBtn.className = `float-pill ${isBlend ? 'active' : ''}`;
        texToggleBtn.textContent = isBlend ? '涂抹: 柔雾渐变' : '涂抹: 立体软边';
        texToggleBtn.onclick = () => {
          state.creamStyle = isBlend ? 'sculpt' : 'blend';
          sfx.playPop(520);
          updateUI();
        };
        floatingToolsEl.appendChild(texToggleBtn);
      }

      // 更换底胚底色
      const baseBtn = document.createElement('button');
      baseBtn.className = 'float-pill';
      baseBtn.textContent = '设为全蛋糕底色';
      baseBtn.onclick = () => {
        pushSurfaceUndo('both');
        state.baseCoatColor = state.frostingColor;
        state.topSurface.fillBaseColor(state.frostingColor.mid, 0.25);
        state.sideSurface.fillBaseColor(state.frostingColor.mid, 0.25);
        state.roughCoverage = 1;
        state.turntableAngle += 0.8;
        sfx.playChime();
        updateUI();
      };
      floatingToolsEl.appendChild(baseBtn);
    } else if (state.step === 2) {
      const symBtn = document.createElement('button');
      symBtn.className = `float-pill ${state.pipingSymmetry ? 'active' : ''}`;
      symBtn.textContent = state.pipingSymmetry ? '对称裱花: 开启' : '对称裱花: 关闭';
      symBtn.onclick = () => {
        state.pipingSymmetry = !state.pipingSymmetry;

        updateUI();
      };
      floatingToolsEl.appendChild(symBtn);

      const ringBtn = document.createElement('button');
      ringBtn.className = 'float-pill';
      ringBtn.textContent = '一键环形花边';
      ringBtn.onclick = () => {
        const ty = getCakeTopY();
        for (let i = 0; i < 12; i++) {
          const a = (i * Math.PI * 2) / 12;
          const u = Math.cos(a) * 0.88;
          const v = Math.sin(a) * 0.88;
          state.pipings.push({
            x: CAKE.cx + u * (CAKE.rx + 4),
            y: ty + v * (CAKE.ry + 2),
            surface: 'top',
            u,
            v,
            nozzleId: state.pipingNozzle.id,
            color: state.pipingColor,
            scale: 1,
            angle: a

        sfx.playChime();
        updateUI();
      };
      floatingToolsEl.appendChild(ringBtn);

      if (state.pipings.length > 0) {
        const undoBtn = document.createElement('button');
        undoBtn.className = 'float-pill';
        undoBtn.textContent = '撤销一朵';
        undoBtn.onclick = () => {

          updateUI();

    // 3. 底部子分类标签与选项卡片

    if (state.step === 0) {

      } else if (state.subTab === 'cream') {

            updateUI();
          });

        });
      } else {
        FILLING_FRUITS.forEach(ff => {
          const card = createSwatchCard(ff.name, ff.color, state.fillingFruit.id === ff.id, () => {

            if (state.layerPhase === 0) state.layerPhase = 1;
            if (state.layerPhase === 3) state.layerPhase = 4;
            sfx.playPop(520);
            updateUI();
          });
          optionsScrollEl.appendChild(card);
        });
      }
    } else if (state.step === 1) {
      const tabs = [

      if (state.subTab === 'frostColor') {

          const card = createSwatchCard(fc.name, fc.mid, state.frostingColor.id === fc.id, () => {
            state.frostingColor = fc;
            sfx.playPop(520);
            updateUI();
          });
          optionsScrollEl.appendChild(card);
        });
      } else if (state.subTab === 'spatula') {
        const curMode = state.spatulaMode || SPATULA_MODES[1];
        SPATULA_MODES.forEach(sm => {
          const card = createSwatchCard(sm.name, sm.swatch, curMode.id === sm.id, () => {

            updateUI();

        });
      } else if (state.subTab === 'sauce') {

    } else if (state.step === 2) {

      } else {

    } else if (state.step === 3) {

      DECOR_ITEMS.filter(d => d.category === state.subTab).forEach(item => {

      '完成夹心，进入奶油抹面',

      '完成裱花，挑选鲜果装饰',

      '生成专属蛋糕纪念海报'

    tabs.forEach(t => {
      const el = document.createElement('div');

        updateUI();

  function createSwatchCard(name, colorHex, isActive, onClick) {
    const card = document.createElement('div');
    card.className = `option-card ${isActive ? 'active' : ''}`;
    const swatch = document.createElement('div');
    swatch.className = 'swatch-circle';
    swatch.style.background = colorHex;
    const label = document.createElement('span');
    label.className = 'option-name';
    label.textContent = name;
    card.append(swatch, label);

  /* ============================================================================
   * 10. 贺卡手写签名画板与纪念海报合成导出
   * ============================================================================ */
  const cardModal = document.getElementById('cardModal');
  const sigCanvas = document.getElementById('sigCanvas');
  const sigCtx = sigCanvas.getContext('2d');
  let sigDrawing = false;

  function initSignaturePad() {
    sigCtx.strokeStyle = '#5C3A21';
    sigCtx.lineWidth = 2.4;
    sigCtx.lineCap = 'round';
    sigCtx.lineJoin = 'round';

    const getSigPos = (e) => {
      const r = sigCanvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - r.left) * (sigCanvas.width / r.width),
        y: (cy - r.top) * (sigCanvas.height / r.height)
      };
    };

    sigCanvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      sigDrawing = true;
      const p = getSigPos(e);
      sigCtx.beginPath();
      sigCtx.moveTo(p.x, p.y);
    });
    sigCanvas.addEventListener('pointermove', (e) => {
      if (!sigDrawing) return;
      e.preventDefault();
      const p = getSigPos(e);
      sigCtx.lineTo(p.x, p.y);
      sigCtx.stroke();
    });
    window.addEventListener('pointerup', () => { sigDrawing = false; });

    document.getElementById('clearSigBtn').onclick = () => {
      sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      sfx.playPop(400);
    };
  }

  function openCardModal() {
    cardModal.classList.add('show');
    sfx.playPop(520);
  }

  // 生成包含「手作蛋糕 + 祝福贺卡 + 手写签名」的高清拍立得纪念海报
  function generateAndShowPoster() {
    const pCanvas = document.createElement('canvas');
    pCanvas.width = 760;
    pCanvas.height = 1040;
    const pctx = pCanvas.getContext('2d');

    // 1. 温暖奶杏色渐变海报背景
    const bg = pctx.createLinearGradient(0, 0, 0, 1040);
    bg.addColorStop(0, '#FFFDF9');
    bg.addColorStop(0.6, '#FFF5E8');
    bg.addColorStop(1, '#F9E2CA');
    pctx.fillStyle = bg;
    pctx.fillRect(0, 0, 760, 1040);

    // 精致外框线
    pctx.strokeStyle = '#E5C6A0';
    pctx.lineWidth = 3;
    pctx.strokeRect(24, 24, 712, 992);

    // 2. 顶部工坊标题
    pctx.fillStyle = '#4A2E1B';
    pctx.font = 'bold 28px "PingFang SC", sans-serif';
    pctx.textAlign = 'center';
    pctx.fillText('暖光手作蛋糕坊 · 专属甜品纪念', 380, 76);

    pctx.fillStyle = '#9E7356';
    pctx.font = '16px "PingFang SC", sans-serif';
    pctx.fillText('HANDCRAFTED PATISSERIE & WARM WISHES', 380, 106);

    // 3. 离屏渲染标准 2.5D 全景成品蛋糕（不受当前缩放、平移、俯视视角与工具光标影响）
    const snapCanvas = document.createElement('canvas');
    snapCanvas.width = CW;
    snapCanvas.height = CH;
    const snapCtx = snapCanvas.getContext('2d');
    renderCakeScene(snapCtx, { viewMode: 'iso', zoom: 1.0, panX: 0, panY: 0 }, performance.now(), false);
    pctx.drawImage(snapCanvas, 20, 95, 720, 720);

    // 4. 底部手写贺卡展示区
    const cardThemes = [
      { bg: '#FFFDF7', border: '#E2C499' },
      { bg: '#FFF5F6', border: '#EBAFB6' },
      { bg: '#F4FBF6', border: '#A9D1B5' },
      { bg: '#FBF5E8', border: '#C7AD7F' }
    ];
    const th = cardThemes[state.card.theme] || cardThemes[0];
    pctx.fillStyle = th.bg;
    pctx.strokeStyle = th.border;
    pctx.lineWidth = 2.5;
    pctx.beginPath();
    pctx.roundRect(64, 770, 632, 210, 18);
    pctx.fill();
    pctx.stroke();

    // 贺卡文字内容
    pctx.fillStyle = '#4A2E1B';
    pctx.font = 'bold 20px "PingFang SC", sans-serif';
    pctx.textAlign = 'left';
    pctx.fillText(state.card.to || '致：最珍贵的你', 96, 814);

    pctx.fillStyle = '#6E4930';
    pctx.font = '18px "PingFang SC", sans-serif';
    const bodyText = state.card.body || '愿你每一个日子都如奶油蛋糕般甜美温暖。';
    const line1 = bodyText.slice(0, 26);
    const line2 = bodyText.slice(26, 52);
    pctx.fillText(line1, 96, 854);
    if (line2) pctx.fillText(line2, 96, 884);

    // 嵌入玩家手写签名
    pctx.drawImage(sigCanvas, 430, 895, 230, 52);
    pctx.fillStyle = '#B88B6A';
    pctx.font = '13px "PingFang SC", sans-serif';
    pctx.fillText('手作甜点师亲笔签名', 96, 945);

    const dataUrl = pCanvas.toDataURL('image/png');
    document.getElementById('posterImage').src = dataUrl;
    document.getElementById('posterModal').classList.add('show');
    sfx.playChime();
  }

  /* ============================================================================
   * 11. 绑定页面按钮事件与初始化启动
   * ============================================================================ */
  function bindEvents() {
    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerUp);
    window.addEventListener('pointercancel', handlePointerUp);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // 桌面端鼠标滚轮以光标为中心无级缩放
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const raw = getRawCanvasPos(e);
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      setCameraZoom(state.camera.targetZoom * factor, raw.rawX, raw.rawY, false);
    }, { passive: false });

    // 空格键按住配合鼠标左键拖动画布
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        gesture.spaceHeld = true;
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') gesture.spaceHeld = false;
    });

    // 左上角视角切换与缩放按钮
    document.getElementById('viewModeBtn').onclick = () => {
      state.camera.viewMode = state.camera.viewMode === 'top' ? 'iso' : 'top';
      resetCamera(true);
      sfx.playPop(560);
      updateUI();
    };
    document.getElementById('zoomInBtn').onclick = () => {
      setCameraZoom(state.camera.targetZoom + 0.3, CW * 0.5, CH * 0.5, false);
      sfx.playPop(580);
    };
    document.getElementById('zoomOutBtn').onclick = () => {
      setCameraZoom(state.camera.targetZoom - 0.3, CW * 0.5, CH * 0.5, false);
      sfx.playPop(460);
    };

    };

      el.addEventListener('click', () => {
        const targetStep = Number(el.dataset.step);
        goToStep(targetStep);
      });
    });

    // 上一步 / 下一步
    prevStepBtn.addEventListener('click', () => {
      if (state.step > 0) goToStep(state.step - 1);
    });

    nextStepBtn.addEventListener('click', () => {
      if (state.step < 5) {
        goToStep(state.step + 1);
      } else {
        generateAndShowPoster();
      }
    });

    // 选中装饰物的缩放、旋转与移除按钮
    document.getElementById('btnScaleUp').onclick = () => {
      const item = state.decorations.find(d => d.uid === state.selectedDecorUid);
      if (item) { item.scale = Math.min(1.65, item.scale + 0.14); sfx.playPop(600); }
    };
    document.getElementById('btnScaleDown').onclick = () => {
      const item = state.decorations.find(d => d.uid === state.selectedDecorUid);
      if (item) { item.scale = Math.max(0.6, item.scale - 0.14); sfx.playPop(460); }
    };
    document.getElementById('btnRotate').onclick = () => {

    document.getElementById('btnDeleteDeco').onclick = () => {

  function goToStep(targetStep) {
    // 若跳到抹面之后，自动补齐3层蛋糕胚，保证画面完整
    if (targetStep >= 1 && state.layersVisible < 3) {
      state.layersVisible = 3;
      state.fillings[0].spreadProgress = 1;
      state.fillings[1].spreadProgress = 1;
      state.layerPhase = 6;
    }
    if (targetStep >= 2 && state.roughCoverage < 0.5) {
      state.roughCoverage = 1;
      state.smoothProgress = 1;
      state.frostPhase = 2;
    }
    state.step = targetStep;
    state.selectedDecorUid = null;
    sfx.playPop(520);
    updateUI();
    if (targetStep === 4 && !state.card.hasPlaque) {
      openCardModal();
    }
  }

  initSignaturePad();
  bindEvents();
  updateUI();
  requestAnimationFrame(renderLoop);

   * ============================================================================ */
  (() => {

    const pendingRpcs = new Map();
    const coop = {

    const bubbleTagEl = document.getElementById('coopBubbleTag');

    function sendHostRpc(reqType, respType, payload) {
      return new Promise((resolve, reject) => {
        const requestId = `cake_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
        const timer = setTimeout(() => {
          pendingRpcs.delete(requestId);
          reject(new Error('宿主响应超时'));
        }, 50000);
        pendingRpcs.set(requestId, { respType, resolve, reject, timer });
        window.parent.postMessage({ type: reqType, requestId, payload }, '*');
      });
    }

    function showBubble(name, tag, text, showDemoControls, nextLabel) {
      bubbleNameEl.textContent = name || '同行名士';
      bubbleTagEl.textContent = tag || '共创中';
      bubbleTextEl.textContent = text || '';
      bubblePillLabelEl.textContent = `${name || '名士'} · ${tag || '留言'}`;
      nextDemoBtnEl.style.display = showDemoControls ? 'inline-block' : 'none';
      if (nextLabel) nextDemoBtnEl.textContent = nextLabel;
      skipAnimBtnEl.style.display = showDemoControls && coop.fullMakeSession && coop.fullMakeSession.currentStep < 5 ? 'inline-block' : 'none';
      // 默认收起成左下角胶囊，绝不遮挡蛋糕画布；用户点击胶囊可随时展开查看
      bubbleEl.classList.add('show');
    }

    function hideBubble() {
      bubbleEl.classList.remove('show');
      bubbleEl.classList.remove('expanded');

      skipAnimBtnEl.style.display = 'none';
    }

    bubblePillEl.onclick = () => {
