    bubbleCollapseBtnEl.onclick = () => {
      bubbleEl.classList.remove('expanded');
    };

    function describeStepActionChoice(stepIdx, act) {
      if (!act) return '';
      if (stepIdx === 0) {
        const sp = (SPONGE_FLAVORS.find(x => x.id === act.spongeId) || {}).name || '法式香草胚';
        const fc = (FILLING_CREAMS.find(x => x.id === act.fillingCreamId) || {}).name || '香草草莓酱';
        const ff = (FILLING_FRUITS.find(x => x.id === act.fillingFruitId) || {}).name || '鲜切草莓丁';
        return `${sp} + ${fc} + ${ff}`;
      }
      if (stepIdx === 1) {
        const col = (FROSTING_COLORS.find(x => x.id === act.frostingColorId) || {}).name || '动物鲜奶油';
        const gl = (DRIP_GLAZES.find(x => x.id === act.dripGlazeId) || {}).name || '无淋面';
        return `${col} · ${gl}（${act.neatness === 'rustic' ? '手工随性肌理' : '工整抹平'}）`;
      }
      if (stepIdx === 2) {
        const nz = (PIPING_NOZZLES.find(x => x.id === act.pipingNozzleId) || {}).name || '八齿曲奇花';
        const pc = (PIPING_COLORS.find(x => x.id === act.pipingColorId) || {}).name || '香缇白';
        return `${pc} · ${nz}`;
      }
      if (stepIdx === 3) {
        const names = (Array.isArray(act.decorList) ? act.decorList : [])
          .map(id => (DECOR_ITEMS.find(x => x.id === id) || {}).name)
          .filter(Boolean);
        return names.length > 0 ? names.join('、') : '鲜果点缀';
      }
      if (stepIdx === 4) {
        return `巧克力牌「${act.plaqueText || ''}」｜ 贺卡「${act.cardBody || ''}」`;
      }
      return '点亮许愿蜡烛';
    }

    function recordMakingNote(stepIdx, charName, act, reasonText) {
      const stepNames = ['步骤一 · 胚与夹心', '步骤二 · 奶油抹面', '步骤三 · 精致裱花', '步骤四 · 鲜果装饰', '步骤五 · 手写贺卡', '步骤六 · 点亮仪式'];
      const note = {
        stepIdx,
        stepName: stepNames[stepIdx] || `步骤 ${stepIdx + 1}`,
        charName: charName || getSelectedCharName(),
        pickedSummary: describeStepActionChoice(stepIdx, act),
        reasonText: String(reasonText || '').trim()
      };
      const exist = coop.makingNotes.findIndex(n => n.stepIdx === stepIdx);
      if (exist >= 0) coop.makingNotes[exist] = note;
      else coop.makingNotes.push(note);
      coop.makingNotes.sort((a, b) => a.stepIdx - b.stepIdx);
      renderPosterNotesView();
    }

    function setPosterViewTab(which) {
      const showNotes = which === 'notes' && coop.makingNotes.length > 0;
      tabPosterImgEl.classList.toggle('active', !showNotes);
      tabPosterNotesEl.classList.toggle('active', showNotes);
      posterImgEl.style.display = showNotes ? 'none' : 'block';
      posterNotesPageEl.classList.toggle('show', showNotes);
    }

    function renderPosterNotesView() {
      const hasNotes = coop.makingNotes.length > 0;
      posterViewTabsEl.classList.toggle('show', hasNotes);
      if (!hasNotes) {
        setPosterViewTab('img');
        return;
      }
      const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      posterNotesPageEl.innerHTML = coop.makingNotes.map(n =>
        `<div class="poster-note-item">` +
          `<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px;">` +
            `<span style="font-size:11.5px;font-weight:800;color:#C94E38;">${esc(n.stepName)}</span>` +
            `<span style="font-size:10px;padding:1px 7px;border-radius:999px;background:#FCE5CD;color:#7D5338;font-weight:700;">${esc(n.charName)} 选配</span>` +
          `</div>` +
          `<div style="font-size:11.5px;font-weight:700;color:#5A3822;margin-bottom:4px;">所选配料：${esc(n.pickedSummary)}</div>` +
          `<div style="font-size:12px;line-height:1.65;color:#4A2E1B;">「${esc(n.reasonText)}」</div>` +
        `</div>`
      ).join('');
    }

    tabPosterImgEl.onclick = () => setPosterViewTab('img');
    tabPosterNotesEl.onclick = () => setPosterViewTab('notes');

    function getSelectedCharName() {
      const found = coop.characters.find(c => String(c.id) === String(coop.selectedCharId));
      return (found && found.name) || 'TA';
    }

    function isCharTurnInRelay(stepIdx) {
      if (coop.mode !== 'relay_coop') return false;
      if (stepIdx >= 5) return false; // 第6步点亮仪式由双方共同收尾
      return coop.userFirst ? (stepIdx % 2 === 1) : (stepIdx % 2 === 0);
    }

    function captureSmallCakeSnapshot() {
      try {
        const tmp = document.createElement('canvas');
        tmp.width = 384;
        tmp.height = 404;
        const tctx = tmp.getContext('2d');
        tctx.fillStyle = '#FFF8EE';
        tctx.fillRect(0, 0, tmp.width, tmp.height);
        tctx.drawImage(canvas, 0, 0, tmp.width, tmp.height);
        return tmp.toDataURL('image/jpeg', 0.78);
      } catch (_) {
        return '';
      }
    }

    function buildCakeVisualSnapshot() {
      const spongeName = (state.spongeFlavor && state.spongeFlavor.name) || '法式香草胚';
      const f0 = state.fillings[0] || {};
      const f1 = state.fillings[1] || {};
      const fillDesc = `第1层夹心：${(f0.cream && f0.cream.name) || '香草草莓酱'} + ${(f0.fruit && f0.fruit.name) || '鲜切草莓丁'}；第2层夹心：${(f1.cream && f1.cream.name) || '香草草莓酱'} + ${(f1.fruit && f1.fruit.name) || '鲜切草莓丁'}`;
      const frostName = (state.frostingColor && state.frostingColor.name) || '动物鲜奶油';
      const dripName = (state.dripGlaze && state.dripGlaze.name) || '无淋面';
      const covPct = Math.round(Math.min(1, state.roughCoverage || 0) * 100);
      const smoothPct = Math.round(Math.min(1, state.smoothProgress || 0) * 100);
      const frostLook = covPct < 55
        ? `抹面覆盖率约 ${covPct}%（仍隐约露出蛋糕胚，很有手工随性感）`
        : smoothPct >= 75
          ? `抹面覆盖率 ${covPct}%、顺滑度 ${smoothPct}%（奶油表面平整细腻）`
          : `抹面覆盖率 ${covPct}%、顺滑度 ${smoothPct}%（表面带着手工刮刀的自然凹凸肌理）`;

      const pipeDesc = state.pipings.length > 0
        ? `共挤了 ${state.pipings.length} 处${(state.pipingColor && state.pipingColor.name) || '香缇白'}${(state.pipingNozzle && state.pipingNozzle.name) || '花边'}`
        : '尚未挤裱花';

      const decorCounts = {};
      state.decorations.forEach(d => {
        const meta = DECOR_ITEMS.find(x => x.id === d.type);
        const label = (meta && meta.name) || d.type;
        decorCounts[label] = (decorCounts[label] || 0) + 1;
      });
      const decorSummary = Object.keys(decorCounts).length > 0
        ? Object.keys(decorCounts).map(k => `${k}×${decorCounts[k]}`).join('、')
        : '暂未摆放水果或糖饰';

      const cardInfo = state.card && state.card.hasPlaque
        ? `巧克力牌刻字：「${state.card.plaqueText || 'Happy Day'}」；贺卡抬头「${state.card.to || ''}」，祝福正文：「${state.card.body || ''}」`
        : '尚未插上巧克力牌与贺卡';

      const fullText = [
        `1. 蛋糕胚与夹心：${spongeName}（3层）；${fillDesc}`,
        `2. 外层奶油与淋面：${frostName}，${dripName}；视觉观感：${frostLook}`,
        `3. 裱花外观：${pipeDesc}`,
        `4. 顶面鲜果与装饰：${decorSummary}（总计 ${state.decorations.length} 件）`,
        `5. 贺卡与刻字：${cardInfo}`,
        `6. 蜡烛状态：${state.candlesLit ? '已点亮许愿烛' : '未点亮'}`
      ].join('\n');

      return {
        cakeName: `${frostName.replace(/奶油$/, '')}${spongeName.replace(/胚$/, '')}蛋糕`,
        cakeDesc: `${spongeName}配${(f0.cream && f0.cream.name) || '果酱'}，${frostName}与${dripName}，点缀${decorSummary}`,
        plaqueText: (state.card && state.card.plaqueText) || '',
        visualSnapshotText: fullText
      };
    }

    function applyCharacterStepToCanvas(stepIdx, act) {
      if (!act || typeof act !== 'object') return;
      if (stepIdx === 0) {
        const sp = SPONGE_FLAVORS.find(x => x.id === act.spongeId) || SPONGE_FLAVORS[0];
        const fc = FILLING_CREAMS.find(x => x.id === act.fillingCreamId) || FILLING_CREAMS[0];
        const ff = FILLING_FRUITS.find(x => x.id === act.fillingFruitId) || FILLING_FRUITS[0];
        state.spongeFlavor = sp;
        state.fillingCream = fc;
        state.fillingFruit = ff;
        state.fillings.forEach(f => {
          f.cream = fc;
          f.fruit = ff;
          f.spreadProgress = 1;
        });
        state.layersVisible = 3;
        state.layerPhase = 6;
        sfx.playChime();
      } else if (stepIdx === 1) {
        const col = FROSTING_COLORS.find(x => x.id === act.frostingColorId) || FROSTING_COLORS[0];
        const gl = DRIP_GLAZES.find(x => x.id === act.dripGlazeId) || DRIP_GLAZES[0];
        state.frostingColor = col;
        state.baseCoatColor = col;
        state.topSurface.fillBaseColor(col.mid, act.neatness === 'rustic' ? 0.42 : 0.62);
        state.sideSurface.fillBaseColor(col.mid, act.neatness === 'rustic' ? 0.42 : 0.62);
        state.roughCoverage = 1;
        state.smoothProgress = act.neatness === 'rustic' ? 0.72 : 1;
        state.frostPhase = 2;
        state.dripGlaze = gl;
        state.drips = new Array(32).fill(0).map((_, i) => gl.id === 'none' ? 0 : (16 + ((i * 19) % 28)));
        sfx.playChime();
      } else if (stepIdx === 2) {
        const nz = PIPING_NOZZLES.find(x => x.id === act.pipingNozzleId) || PIPING_NOZZLES[0];
        const pc = PIPING_COLORS.find(x => x.id === act.pipingColorId) || PIPING_COLORS[0];
        state.pipingNozzle = nz;
        state.pipingColor = pc;
        const count = act.pipingPattern === 'minimal' ? 8 : 12;
        const radius = act.pipingPattern === 'crown' ? 0.78 : 0.88;
        const ty = getCakeTopY();
        for (let i = 0; i < count; i++) {
          const a = (i * Math.PI * 2) / count;
          const u = Math.cos(a) * radius;
          const v = Math.sin(a) * radius;
          state.pipings.push({
            x: CAKE.cx + u * (CAKE.rx + 4),
            y: ty + v * (CAKE.ry + 2),
            surface: 'top',
            u,
            v,
            nozzleId: nz.id,
            color: pc,
            scale: 1,
            angle: a
          });
        }
        sfx.playChime();
      } else if (stepIdx === 3) {
        const list = Array.isArray(act.decorList) && act.decorList.length > 0 ? act.decorList : ['straw_whole', 'blueberry', 'mint_leaf'];
        const ty = getCakeTopY();
        const layout = act.decorLayout || 'symmetric';
        list.forEach((dId, i) => {
          const valid = DECOR_ITEMS.find(x => x.id === dId);
          if (!valid) return;
          let u = 0, v = 0;
          if (layout === 'cluster') {
            const a = (i * 2.39996);
            const r = Math.min(0.55, 0.14 + i * 0.06);
            u = Math.cos(a) * r;
            v = Math.sin(a) * r;
          } else {
            const a = (i * Math.PI * 2) / Math.max(1, list.length);
            const r = layout === 'playful' ? (0.35 + ((i % 3) * 0.16)) : 0.56;
            u = Math.cos(a) * r;
            v = Math.sin(a) * r;
          }
          state.decorations.push({
            uid: Date.now() + i * 17,
            type: valid.id,
            x: CAKE.cx + u * CAKE.rx,
            y: ty + v * CAKE.ry,
            surface: 'top',
            u,
            v,
            scale: 0.96 + (i % 3) * 0.06,
            rot: (i % 2 === 0 ? 1 : -1) * 0.12
          });
        });
        sfx.playChime();
      } else if (stepIdx === 4) {
        state.card.theme = Math.max(0, Math.min(3, Number(act.cardTheme) || 0));
        state.card.to = String(act.cardTo || `致：${coop.userName}`).slice(0, 18);
        state.card.body = String(act.cardBody || '愿你岁岁常欢愉。').slice(0, 60);
        state.card.plaqueText = String(act.plaqueText || '岁岁安暖').slice(0, 10);
        state.card.hasPlaque = true;
        sfx.playChime();
      } else if (stepIdx === 5) {
        if (!state.decorations.some(d => d.type === 'candle')) {
          state.decorations.push({
            uid: Date.now() + 99,
            type: 'candle',
            x: CAKE.cx,
            y: getCakeTopY() - 4,
            surface: 'top',
            u: 0,
            v: 0,
            scale: 1.05,
            rot: 0
          });
        }
        state.candlesLit = true;
        sfx.playChime();
      }
      updateUI();
    }

    function syncCoopBarUI() {
      const m = coop.mode;
      swapBtnEl.style.display = m === 'relay_coop' ? 'inline-block' : 'none';
      swapBtnEl.textContent = coop.userFirst ? '我先手' : 'TA先手';
      if (m === 'char_make_user_eat') {
        actionBtnEl.style.display = 'inline-block';
        actionBtnEl.textContent = coop.busy ? '制作中…' : '请TA动手';
      } else if (m === 'relay_coop' && isCharTurnInRelay(state.step)) {
        actionBtnEl.style.display = 'inline-block';
        actionBtnEl.textContent = coop.busy ? 'TA操作中…' : '让TA做这步';
      } else {
        actionBtnEl.style.display = 'none';
      }
      posterTasteRowEl.style.display = m === 'char_make_user_eat' ? 'none' : 'flex';
      posterUserFeedbackRowEl.style.display = m === 'char_make_user_eat' ? 'flex' : 'none';
      askCharTasteBtnEl.textContent = `请「${getSelectedCharName()}」品尝点评`;
    }

    async function runCharacterRelayStep(stepIdx) {
      if (coop.busy) return;
      if (!coop.selectedCharId) {
        showBubble('提示', '未选名士', '请先在上方选择一位传讯名士同行。', false);
        return;
      }
      coop.busy = true;
      syncCoopBarUI();
      showBubble(getSelectedCharName(), '思索配料中', '正在打量眼前的蛋糕台面，准备亲手接力这一步…', false);
      try {
        const snap = buildCakeVisualSnapshot();
        const res = await sendHostRpc('WORKSHOP_CAKE_STEP_RELAY_REQUEST', 'WORKSHOP_CAKE_STEP_RELAY_RESPONSE', {
          charId: coop.selectedCharId,
          stepIndex: stepIdx,
          visualSnapshotText: snap.visualSnapshotText,
          cakeSummary: snap.cakeDesc,
          imageDataUrl: captureSmallCakeSnapshot(),
          relayHistory: coop.relayHistory
        });
        applyCharacterStepToCanvas(stepIdx, res.stepAction);
        coop.relayHistory.push(`第${stepIdx + 1}步(${res.charName})：${res.spokenLine}`);
        recordMakingNote(stepIdx, res.charName, res.stepAction, res.spokenLine);
        showBubble(res.charName, res.moodTag || '接力完成', res.spokenLine, false);
      } catch (err) {
        showBubble(getSelectedCharName(), '网络波动', `接力失败：${err.message || err}`, false);
      }
      coop.busy = false;
      syncCoopBarUI();
    }

    function advanceFullMakeStep(jumpToEnd) {
      const sess = coop.fullMakeSession;
      if (!sess) return;

      if (jumpToEnd) {
        for (let s = sess.currentStep + 1; s < 6; s++) {
          state.step = s;
          applyCharacterStepToCanvas(s, sess.stepActions[s]);
          recordMakingNote(s, sess.charName, sess.stepActions[s], sess.stepLines[s] || '专注制作中…');
        }
        sess.currentStep = 5;
        showBubble(sess.charName, '成品出炉', sess.introNote || '端上来了，尝尝合不合胃口。', true, '查看成品纪念卡');
        return;
      }

      if (sess.currentStep < 5) {
        const nextS = sess.currentStep + 1;
        sess.currentStep = nextS;
        state.step = nextS;
        applyCharacterStepToCanvas(nextS, sess.stepActions[nextS]);
        recordMakingNote(nextS, sess.charName, sess.stepActions[nextS], sess.stepLines[nextS] || '专注制作中…');
        if (nextS < 5) {
          showBubble(sess.charName, `第 ${nextS + 1}/6 步`, sess.stepLines[nextS] || '专注制作中…', true, `看下一步 (${nextS + 2}/6)`);
        } else {
          showBubble(sess.charName, '成品出炉', sess.introNote || sess.stepLines[5] || '端上来了，尝尝合不合胃口。', true, '查看成品纪念卡');
        }
      } else {
        // Already at step 5 -> open commemorative poster modal
        generateAndShowPoster();
        setPosterViewTab('img');
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML = `<div style="font-weight:800;color:#C94E38;margin-bottom:4px;">${sess.charName} 亲手端上蛋糕：</div><div>「${sess.introNote || '趁新鲜尝尝罢。'}」</div>`;
        syncCoopBarUI();
      }
    }

    async function runCharacterFullMake() {
      if (coop.busy) return;
      if (!coop.selectedCharId) {
        showBubble('提示', '未选名士', '请先在上方选择一位传讯名士。', false);
        return;
      }
      coop.busy = true;
      coop.skipFullAnim = false;
      coop.lastReview = null;
      coop.makingNotes = [];
      coop.fullMakeSession = null;
      renderPosterNotesView();
      syncCoopBarUI();
      state = createInitialState();
      sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      updateUI();
      showBubble(getSelectedCharName(), '构思配方中', '正在按自己的心意挑选蛋糕胚、奶油与装饰，请稍候…', false);

      try {
        const res = await sendHostRpc('WORKSHOP_CAKE_FULL_MAKE_REQUEST', 'WORKSHOP_CAKE_FULL_MAKE_RESPONSE', {
          charId: coop.selectedCharId
        });
        const plan = res.plan || {};
        const stepLines = res.stepLines || [];
        const stepActions = [
          { spongeId: plan.spongeId, fillingCreamId: plan.fillingCreamId, fillingFruitId: plan.fillingFruitId },
          { frostingColorId: plan.frostingColorId, dripGlazeId: plan.dripGlazeId, neatness: plan.neatness },
          { pipingNozzleId: plan.pipingNozzleId, pipingColorId: plan.pipingColorId, pipingPattern: plan.pipingPattern },
          { decorList: plan.decorList, decorLayout: plan.decorLayout },
          { cardTheme: plan.cardTheme, cardTo: plan.cardTo, cardBody: plan.cardBody, plaqueText: plan.plaqueText },
          {}
        ];

        // Execute Step 1 immediately, then let the user manually click「看下一步」at their own pace!
        coop.fullMakeSession = {
          charName: res.charName,
          stepActions,
          stepLines,
          introNote: res.introNote || stepLines[5] || '端上来了，尝尝合不合胃口。',
          currentStep: 0
        };
        state.step = 0;
        applyCharacterStepToCanvas(0, stepActions[0]);
        recordMakingNote(0, res.charName, stepActions[0], stepLines[0] || '先把底胚与夹心铺好。');
        showBubble(res.charName, '第 1/6 步', stepLines[0] || '先把底胚与夹心铺好。', true, '看下一步 (2/6)');
      } catch (err) {
        showBubble(getSelectedCharName(), '制作中断', `生成失败：${err.message || err}`, false);
      }
      coop.busy = false;
      syncCoopBarUI();
    }

    // Bind UI events
    document.getElementById('backToWorkshopBtn').onclick = () => {
      window.parent.postMessage({ type: 'WORKSHOP_CAKE_CLOSE' }, '*');
    };

    charSelectEl.onchange = () => {
      coop.selectedCharId = charSelectEl.value;
      syncCoopBarUI();
    };

    modeSelectEl.onchange = () => {
      coop.mode = modeSelectEl.value;
      coop.relayHistory = [];
      hideBubble();
      syncCoopBarUI();
      if (coop.mode === 'relay_coop' && isCharTurnInRelay(state.step)) {
        runCharacterRelayStep(state.step);
      }
    };

    swapBtnEl.onclick = () => {
      coop.userFirst = !coop.userFirst;
      syncCoopBarUI();
      if (isCharTurnInRelay(state.step)) {
        runCharacterRelayStep(state.step);
      }
    };

    actionBtnEl.onclick = () => {
      if (coop.mode === 'char_make_user_eat') runCharacterFullMake();
      else if (coop.mode === 'relay_coop') runCharacterRelayStep(state.step);
    };

    nextDemoBtnEl.onclick = () => {
      advanceFullMakeStep(false);
    };

    skipAnimBtnEl.onclick = () => {
      advanceFullMakeStep(true);
    };

    // Observe step transitions in relay mode to auto-trigger character's turn
    const origNextClick = nextStepBtn.onclick;
    nextStepBtn.addEventListener('click', () => {
      setTimeout(() => {
        syncCoopBarUI();
        if (coop.mode === 'relay_coop' && isCharTurnInRelay(state.step) && !coop.busy) {
          runCharacterRelayStep(state.step);
        }
      }, 60);
    });

    document.getElementById('resetGameBtn').addEventListener('click', () => {
      coop.relayHistory = [];
      coop.makingNotes = [];
      coop.fullMakeSession = null;
      coop.lastReview = null;
      hideBubble();
      renderPosterNotesView();
      posterReviewBoxEl.style.display = 'none';
      posterStatusEl.textContent = '';
      syncCoopBarUI();
    });

    // Poster modal: Ask character to taste
    askCharTasteBtnEl.onclick = async () => {
      if (coop.busy || !coop.selectedCharId) return;
      coop.busy = true;
      askCharTasteBtnEl.disabled = true;
      askCharTasteBtnEl.textContent = `正在请「${getSelectedCharName()}」品尝…`;
      posterStatusEl.textContent = '';
      try {
        const snap = buildCakeVisualSnapshot();
        const res = await sendHostRpc('WORKSHOP_CAKE_TASTE_REQUEST', 'WORKSHOP_CAKE_TASTE_RESPONSE', {
          charId: coop.selectedCharId,
          mode: coop.mode,
          visualSnapshotText: snap.visualSnapshotText,
          cakeSummary: snap.cakeDesc,
          imageDataUrl: captureSmallCakeSnapshot()
        });
        coop.lastReview = res;
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML =
          `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">` +
          `<strong style="color:#C94E38;">${res.charName} 的品鉴回函</strong>` +
          `<span style="font-size:10px;padding:1px 6px;border-radius:999px;background:#FCE5CD;color:#7D5338;">${res.reactionTag || '细品慢尝'}</span></div>` +
          `<div style="margin-bottom:5px;">${res.comment}</div>` +
          `<div style="font-weight:700;color:#7D3C26;">${res.dialogue}</div>`;
      } catch (err) {
        posterStatusEl.textContent = '品鉴失败：' + (err.message || err);
      }
      coop.busy = false;
      askCharTasteBtnEl.disabled = false;
      syncCoopBarUI();
    };

    // Poster modal: User tasting feedback -> Character reply
    document.getElementById('sendUserFeedbackBtn').onclick = async () => {
      const inp = document.getElementById('userFeedbackInput');
      const txt = inp.value.trim();
      if (!txt || coop.busy || !coop.selectedCharId) return;
      coop.busy = true;
      posterStatusEl.textContent = `正在转告「${getSelectedCharName()}」…`;
      try {
        const snap = buildCakeVisualSnapshot();
        const res = await sendHostRpc('WORKSHOP_CAKE_FEEDBACK_REQUEST', 'WORKSHOP_CAKE_FEEDBACK_RESPONSE', {
          charId: coop.selectedCharId,
          visualSnapshotText: snap.visualSnapshotText,
          userFeedback: txt
        });
        coop.lastReview = res;
        inp.value = '';
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML =
          `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">` +
          `<strong style="color:#C94E38;">${res.charName} 听完你的评价</strong>` +
          `<span style="font-size:10px;padding:1px 6px;border-radius:999px;background:#FCE5CD;color:#7D5338;">${res.reactionTag || '闻言微哂'}</span></div>` +
          `<div style="margin-bottom:5px;">${res.comment}</div>` +
          `<div style="font-weight:700;color:#7D3C26;">${res.dialogue}</div>`;
        posterStatusEl.textContent = '';
      } catch (err) {
        posterStatusEl.textContent = '回应失败：' + (err.message || err);
      }
      coop.busy = false;
    };

    // Poster modal: Save to backpack (设置 -> 隐私 -> 我的背包)
    async function saveCurrentOrCustomCakeToBackpack(targetData, statusEl) {
      if (statusEl) statusEl.textContent = '正在存入「我的背包」…';
      try {
        const res = await sendHostRpc('WORKSHOP_CAKE_SAVE_BACKPACK', 'WORKSHOP_CAKE_ACTION_RESULT', targetData);
        if (statusEl) statusEl.textContent = (res && res.message) || '已存入我的背包';
      } catch (err) {
        if (statusEl) statusEl.textContent = '存入失败：' + (err.message || err);
      }
    }

    document.getElementById('saveCakeBackpackBtn').onclick = () => {
      const snap = buildCakeVisualSnapshot();
      saveCurrentOrCustomCakeToBackpack({
        cakeName: snap.cakeName,
        cakeDesc: snap.cakeDesc,
        plaqueText: snap.plaqueText,
        posterDataUrl: document.getElementById('posterImage').src || ''
      }, posterStatusEl);
    };

    // Forward-to-Chat modal (仿超话圈好友选择转发)
    const forwardModalEl = document.getElementById('forwardChatModal');
    const forwardListEl = document.getElementById('forwardFriendsList');
    const forwardNoteEl = document.getElementById('forwardNoteInput');
    const forwardStatusEl = document.getElementById('forwardStatusText');

    function openForwardModal(cakeData) {
      coop.forwardPayload = cakeData;
      forwardNoteEl.value = '';
      forwardStatusEl.textContent = '';
      forwardListEl.innerHTML = '';
      if (!coop.characters || coop.characters.length === 0) {
        forwardListEl.innerHTML = '<div style="text-align:center;padding:18px;font-size:12px;color:#9A7B63;">暂未检测到传讯好友，请先在传讯中添加名士。</div>';
      } else {
        coop.characters.forEach(c => {
          const row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid #EBD5BD;border-radius:10px;background:#FFFBF5;';
          row.innerHTML = `<div><div style="font-size:13px;font-weight:800;color:#4A2E1B;">${c.name}</div><div style="font-size:10.5px;color:#8D6B52;">${c.mbti || '传讯好友'}</div></div>`;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'coop-pill-btn accent';
          btn.style.padding = '5px 12px';
          btn.textContent = '转发';
          btn.onclick = async () => {
            btn.disabled = true;
            btn.textContent = '转发中…';
            try {
              const res = await sendHostRpc('WORKSHOP_CAKE_SEND_CHAT', 'WORKSHOP_CAKE_ACTION_RESULT', {
                charId: c.id,
                charName: c.name,
                cakeName: cakeData.cakeName,
                cakeDesc: cakeData.cakeDesc,
                plaqueText: cakeData.plaqueText,
                reviewDialogue: cakeData.reviewDialogue || '',
                forwardNote: forwardNoteEl.value.trim(),
                posterDataUrl: cakeData.posterDataUrl || ''
              });
              forwardStatusEl.textContent = (res && res.message) || `已转发给 ${c.name}`;
              btn.textContent = '已转发';
            } catch (err) {
              forwardStatusEl.textContent = '转发失败：' + (err.message || err);
              btn.disabled = false;
              btn.textContent = '重试';
            }
          };
          row.appendChild(btn);
          forwardListEl.appendChild(row);
        });
      }
      forwardModalEl.classList.add('show');
    }

    document.getElementById('closeForwardModalBtn').onclick = () => {
      forwardModalEl.classList.remove('show');
    };

    document.getElementById('sendCakeChatBtn').onclick = () => {
      const snap = buildCakeVisualSnapshot();
      openForwardModal({
        cakeName: snap.cakeName,
        cakeDesc: snap.cakeDesc,
        plaqueText: snap.plaqueText,
        reviewDialogue: coop.lastReview && coop.lastReview.dialogue ? coop.lastReview.dialogue : '',
        posterDataUrl: document.getElementById('posterImage').src || ''
      });
    };

    // Auto-archive cake to independent IndexedDB history whenever poster opens or review updates
    async function persistCurrentCakeToHistory() {
      const posterSrc = document.getElementById('posterImage').src || '';
      if (!posterSrc) return;
      const snap = buildCakeVisualSnapshot();
      if (!coop.currentHistoryId) {
        coop.currentHistoryId = `cake_hist_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
      }
      try {
        await sendHostRpc('WORKSHOP_CAKE_SAVE_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', {
          id: coop.currentHistoryId,
          cakeName: snap.cakeName,
          cakeDesc: snap.cakeDesc,
          plaqueText: snap.plaqueText,
          mode: coop.mode,
          charId: coop.selectedCharId,
          charName: getSelectedCharName(),
          posterDataUrl: posterSrc,
          makingNotes: coop.makingNotes,
          review: coop.lastReview
        });
      } catch (_) {}
    }

    // Observe posterModal opening to auto-save to history
    const posterModalEl = document.getElementById('posterModal');
    const posterObserver = new MutationObserver(() => {
      if (posterModalEl.classList.contains('show')) {
        setTimeout(() => persistCurrentCakeToHistory(), 120);
      }
    });
    posterObserver.observe(posterModalEl, { attributes: true, attributeFilter: ['class'] });

    // Also update history after tasting review / feedback arrives
    const origTasteClick = askCharTasteBtnEl.onclick;
    askCharTasteBtnEl.onclick = async () => {
      await origTasteClick();
      persistCurrentCakeToHistory();
    };
    const origFbClick = document.getElementById('sendUserFeedbackBtn').onclick;
    document.getElementById('sendUserFeedbackBtn').onclick = async () => {
      await origFbClick();
      persistCurrentCakeToHistory();
    };

    // History Gallery Modal (手作蛋糕历史回顾)
    const historyModalEl = document.getElementById('historyModal');
    const historyGridEl = document.getElementById('historyGridView');
    const historyDetailEl = document.getElementById('historyDetailView');
    const historyBackBtnEl = document.getElementById('historyBackListBtn');
    const historyTitleEl = document.getElementById('historyModalTitle');

    function modeLabel(m) {
      if (m === 'relay_coop') return '轮流接力';
      if (m === 'char_make_user_eat') return 'TA做·我尝';
      return '我做·TA尝';
    }

    function showHistoryList(records) {
      historyTitleEl.textContent = `手作蛋糕历史回顾（${records.length}）`;
      historyBackBtnEl.style.display = 'none';
      historyDetailEl.style.display = 'none';
      historyGridEl.style.display = 'grid';
      historyGridEl.innerHTML = '';

      if (records.length === 0) {
        historyGridEl.style.display = 'block';
        historyGridEl.innerHTML = '<div style="text-align:center;padding:28px 12px;font-size:12.5px;color:#9A7B63;">还没有制作完成的蛋糕记录，完成一份蛋糕后会自动珍藏在这里哦。</div>';
        return;
      }

      const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      records.forEach(rec => {
        const card = document.createElement('div');
        card.style.cssText = 'background:#FFFBF5;border:1px solid #EBD5BD;border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;';

          `</div>`;

      const actions = document.createElement('div');
      actions.style.cssText = 'display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:4px;';

      const bpBtn = document.createElement('button');
      bpBtn.className = 'btn-secondary';
      bpBtn.style.cssText = 'padding:8px 6px;font-size:11.5px;';
      bpBtn.textContent = '存入我的背包';
      bpBtn.onclick = () => saveCurrentOrCustomCakeToBackpack({
        cakeName: rec.cakeName,
        cakeDesc: rec.cakeDesc,
        plaqueText: rec.plaqueText,
        posterDataUrl: rec.posterDataUrl
      }, statusDiv);

      const fwdBtn = document.createElement('button');
      fwdBtn.className = 'btn-secondary';
      fwdBtn.style.cssText = 'padding:8px 6px;font-size:11.5px;';
      fwdBtn.textContent = '转发好友';
      fwdBtn.onclick = () => openForwardModal({
        cakeName: rec.cakeName,
        cakeDesc: rec.cakeDesc,
        plaqueText: rec.plaqueText,
        reviewDialogue: rec.review && rec.review.dialogue ? rec.review.dialogue : '',
        posterDataUrl: rec.posterDataUrl
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'coop-pill-btn';
      delBtn.style.cssText = 'padding:6px 10px;color:#C94E38;border-color:#E5B4A8;';
      delBtn.textContent = '删除';
      delBtn.onclick = async () => {
        await sendHostRpc('WORKSHOP_CAKE_DELETE_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', { id: rec.id });
        const rest = allRecords.filter(x => x.id !== rec.id);
        showHistoryList(rest);
      };

      actions.appendChild(bpBtn);
      actions.appendChild(fwdBtn);
      actions.appendChild(delBtn);
      historyDetailEl.appendChild(actions);
      historyDetailEl.appendChild(statusDiv);
    }

    document.getElementById('openHistoryBtn').onclick = async () => {
      historyModalEl.classList.add('show');
      historyGridEl.style.display = 'block';
      historyDetailEl.style.display = 'none';
      historyBackBtnEl.style.display = 'none';
      historyGridEl.innerHTML = '<div style="text-align:center;padding:24px;font-size:12px;color:#9A7B63;">正在加载历史蛋糕…</div>';
      try {
        const list = await sendHostRpc('WORKSHOP_CAKE_LIST_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', {});
        showHistoryList(Array.isArray(list) ? list : []);
      } catch (_) {
        showHistoryList([]);
      }
    };

    historyBackBtnEl.onclick = async () => {
      const list = await sendHostRpc('WORKSHOP_CAKE_LIST_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', {});
      showHistoryList(Array.isArray(list) ? list : []);
    };

    document.getElementById('closeHistoryModalBtn').onclick = () => {
      historyModalEl.classList.remove('show');
    };

    document.getElementById('resetGameBtn').addEventListener('click', () => {
      coop.currentHistoryId = '';
    });

    // Message listener from host bridge
    window.addEventListener('message', (ev) => {
      const data = ev && ev.data;
      if (!data || typeof data !== 'object' || !data.type) return;
      if (data.type === 'WORKSHOP_CAKE_HOST_SYNC' && data.payload) {
        coop.characters = Array.isArray(data.payload.characters) ? data.payload.characters : [];
        coop.userName = data.payload.userName || '广陵王';
        charSelectEl.innerHTML = '';
        if (coop.characters.length === 0) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = '暂无传讯名士';
          charSelectEl.appendChild(opt);
        } else {
          coop.characters.forEach((c, idx) => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.name;
            charSelectEl.appendChild(opt);
            if (idx === 0 && !coop.selectedCharId) coop.selectedCharId = c.id;
          });
          charSelectEl.value = coop.selectedCharId;
        }
        syncCoopBarUI();
        return;
      }
      if (data.requestId && pendingRpcs.has(data.requestId)) {
        const p = pendingRpcs.get(data.requestId);
        clearTimeout(p.timer);
        pendingRpcs.delete(data.requestId);
        if (data.error) p.reject(new Error(data.error));
        else p.resolve(data.result);
      }
    });

    window.parent.postMessage({ type: 'WORKSHOP_CAKE_REQUEST_SYNC' }, '*');
  })();
})();
</script>
</body>
</html>
