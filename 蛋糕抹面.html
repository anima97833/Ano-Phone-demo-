<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>暖光甜品屋 - 手工蛋糕工坊</title>
<style>
  :root {
    --bg-cream: #FFF8EE;
    --bg-peach: #FCE5CD;
    --panel-bg: rgba(255, 252, 246, 0.95);
    --brown-dark: #4A2E1B;
    --brown-mid: #7D5338;
    --brown-light: #B88B6A;
    --accent-coral: #E86A53;
    --accent-coral-dark: #C94E38;
    --accent-gold: #F2B749;
    --accent-green: #68A357;
    --border-warm: #EED7C1;
    --shadow-warm: 0 8px 24px rgba(125, 83, 56, 0.12);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: radial-gradient(circle at 50% 32%, #FFFDF9 0%, var(--bg-cream) 52%, var(--bg-peach) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--brown-dark);
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 520px;
    height: 100%;
    margin: 0 auto;
    position: relative;
    box-shadow: 0 0 40px rgba(125, 83, 56, 0.08);
  }

  /* 顶部步骤导航 */
  .top-header {
    flex-shrink: 0;
    padding: 10px 14px 6px;
    background: rgba(255, 251, 245, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-warm);
    z-index: 20;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .brand-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--brown-dark);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border-warm);
    background: #FFF;
    color: var(--brown-mid);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }

  .icon-btn:active {
    transform: scale(0.92);
    background: var(--bg-cream);
  }

  .stepper {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    padding: 0 4px;
  }

  .stepper::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 20px;
    right: 20px;
    height: 2px;
    background: var(--border-warm);
    z-index: 0;
  }

  .step-item {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    opacity: 0.55;
    transition: all 0.25s;
  }

  .step-item.active, .step-item.done {
    opacity: 1;
  }

  .step-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #FFF;
    border: 2px solid var(--border-warm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--brown-mid);
    transition: all 0.25s;
  }

  .step-item.active .step-dot {
    background: var(--accent-coral);
    border-color: var(--accent-coral);
    color: #FFF;
    transform: scale(1.12);
    box-shadow: 0 3px 10px rgba(232, 106, 83, 0.35);
  }

  .step-item.done .step-dot {
    background: var(--accent-gold);
    border-color: var(--accent-gold);
    color: #FFF;
  }

  .step-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--brown-mid);
  }

  .step-item.active .step-label {
    color: var(--accent-coral-dark);
    font-weight: 700;
  }

  /* 引导提示与进度条 */
  .prompt-bar {
    flex-shrink: 0;
    margin: 8px 12px 0;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid var(--border-warm);
    border-radius: 14px;
    box-shadow: 0 4px 12px rgba(125, 83, 56, 0.06);
    display: flex;
    flex-direction: column;
    gap: 5px;
    z-index: 15;
  }

  .prompt-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--brown-dark);
  }

  .prompt-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #FFF0E5;
    color: var(--accent-coral-dark);
    font-weight: 700;
    white-space: nowrap;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: #F3E5D7;
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-gold), var(--accent-coral));
    border-radius: 4px;
    transition: width 0.15s ease-out;
  }

  /* 中央画布舞台 */
  .stage-wrap {
    flex: 1 1 0;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #cakeCanvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    aspect-ratio: 720 / 760;
    touch-action: none;
    display: block;
  }

  /* 舞台浮动工具按钮 */
  .stage-floating-tools {
    position: absolute;
    top: 10px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 12;
  }

  /* 舞台左上角视角与缩放控件 */
  .stage-camera-controls {
    position: absolute;
    top: 10px;
    left: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 12;
  }

  .zoom-group {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--border-warm);
    border-radius: 18px;
    box-shadow: 0 4px 10px rgba(125, 83, 56, 0.08);
    overflow: hidden;
  }

  .zoom-btn {
    border: none;
    background: transparent;
    color: var(--brown-dark);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 8px;
    cursor: pointer;
    min-width: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .zoom-btn:active {
    background: var(--bg-cream);
  }

  .zoom-readout {
    font-size: 11px;
    font-weight: 700;
    color: var(--brown-mid);
    padding: 4px 6px;
    border-left: 1px solid var(--border-warm);
    border-right: 1px solid var(--border-warm);
    cursor: pointer;
    min-width: 44px;
    text-align: center;
  }

  .float-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 11px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--border-warm);
    box-shadow: 0 4px 10px rgba(125, 83, 56, 0.08);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--brown-dark);
    cursor: pointer;
    transition: all 0.2s;
  }

  .float-pill:active {
    transform: scale(0.94);
  }

  .float-pill.active {
    background: var(--accent-coral);
    color: #FFF;
    border-color: var(--accent-coral);
  }

  /* 选中装饰物的浮动调整条 */
  .selection-toolbar {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 252, 246, 0.96);
    border: 1px solid var(--border-warm);
    border-radius: 22px;
    padding: 5px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 18px rgba(125, 83, 56, 0.16);
    z-index: 15;
  }

  .sel-btn {
    padding: 5px 10px;
    border-radius: 14px;
    border: 1px solid var(--border-warm);
    background: #FFF;
    font-size: 11px;
    font-weight: 600;
    color: var(--brown-dark);
    cursor: pointer;
  }

  .sel-btn.danger {
    color: #D94330;
    border-color: #F5C6BE;
    background: #FFF5F3;
  }

  /* 底部控制坞 */
  .bottom-dock {
    flex-shrink: 0;
    background: var(--panel-bg);
    border-top: 1px solid var(--border-warm);
    border-radius: 22px 22px 0 0;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 24px rgba(125, 83, 56, 0.08);
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sub-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .sub-tabs::-webkit-scrollbar { display: none; }

  .sub-tab {
    padding: 5px 12px;
    border-radius: 14px;
    background: #F6EBE0;
    color: var(--brown-mid);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  .sub-tab.active {
    background: #FFF;
    color: var(--accent-coral-dark);
    border-color: var(--accent-coral);
    box-shadow: 0 2px 8px rgba(232, 106, 83, 0.15);
  }

  .options-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px;
    scrollbar-width: none;
    min-height: 68px;
    align-items: center;
  }
  .options-scroll::-webkit-scrollbar { display: none; }

  .option-card {
    flex: 0 0 auto;
    min-width: 64px;
    padding: 7px 8px;
    border-radius: 14px;
    background: #FFF;
    border: 2px solid var(--border-warm);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .option-card.active {
    border-color: var(--accent-coral);
    background: #FFF7F4;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(232, 106, 83, 0.16);
  }

  .swatch-circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.9);
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    position: relative;
  }

  .option-thumb {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .option-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--brown-dark);
    white-space: nowrap;
  }

  .dock-footer {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn-secondary {
    padding: 11px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--border-warm);
    background: #FFF;
    color: var(--brown-mid);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-primary {
    flex: 1;
    padding: 12px 18px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #F28B66 0%, var(--accent-coral) 100%);
    color: #FFF;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(232, 106, 83, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
  }

  .btn-primary:active {
    transform: scale(0.98);
  }

  /* 贺卡工作台弹窗 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(74, 46, 27, 0.45);
    backdrop-filter: blur(4px);
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-overlay.show {
    display: flex;
  }

  .card-modal {
    width: 100%;
    max-width: 420px;
    background: #FFFDF9;
    border-radius: 24px;
    border: 2px solid var(--border-warm);
    padding: 16px;
    box-shadow: 0 20px 50px rgba(74, 46, 27, 0.25);
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 92dvh;
    overflow-y: auto;
  }

  .card-preview-box {
    border-radius: 16px;
    padding: 16px;
    position: relative;
    transition: all 0.3s;
    border: 2px solid #E6CFAF;
    background: #FFF9F0;
    box-shadow: inset 0 0 0 4px rgba(255,255,255,0.6);
  }

  .card-theme-0 {
    background: linear-gradient(145deg, #FFFDF8 0%, #FDF2E4 100%);
    border-color: #E2C499;
  }
  .card-theme-1 {
    background: linear-gradient(145deg, #FFF5F5 0%, #FCE1E4 100%);
    border-color: #EBAFB6;
  }
  .card-theme-2 {
    background: linear-gradient(145deg, #F5FBF7 0%, #E0F2E6 100%);
    border-color: #A9D1B5;
  }
  .card-theme-3 {
    background: linear-gradient(145deg, #FBF7EE 0%, #EFE2C8 100%);
    border-color: #C7AD7F;
  }

  .card-input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card-input, .card-textarea {
    width: 100%;
    border: 1px solid rgba(125, 83, 56, 0.25);
    background: rgba(255, 255, 255, 0.75);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    color: var(--brown-dark);
    font-family: inherit;
    outline: none;
  }

  .card-textarea {
    resize: none;
    height: 64px;
    line-height: 1.5;
  }

  .preset-chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .preset-chips::-webkit-scrollbar { display: none; }

  .preset-chip {
    padding: 4px 10px;
    border-radius: 12px;
    background: #F6EBE0;
    color: var(--brown-mid);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }

  .sig-pad-wrap {
    margin-top: 4px;
    border: 1px dashed var(--brown-light);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.65);
    position: relative;
    height: 76px;
    overflow: hidden;
  }

  #sigCanvas {
    width: 100%;
    height: 100%;
    touch-action: none;
    display: block;
  }

  .sig-hint {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 10.5px;
    color: var(--brown-light);
    pointer-events: none;
  }

  .sig-clear {
    position: absolute;
    top: 5px;
    right: 6px;
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 8px;
    background: #FFF;
    border: 1px solid var(--border-warm);
    color: var(--brown-mid);
    cursor: pointer;
  }

  /* 海报保存展示弹窗 */
  .coop-only { display: none !important; }
  body.is-embedded .coop-only { display: flex !important; }
  .coop-bar {
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    padding: 4px 6px;
    background: rgba(255, 245, 232, 0.92);
    border: 1px solid var(--border-warm);
    border-radius: 10px;
    font-size: 11px;
  }
  .coop-select {
    border: 1px solid #DFC4A8;
    background: #FFFDF9;
    color: var(--brown-dark);
    border-radius: 7px;
    padding: 3px 6px;
    font-size: 11px;
    font-weight: 600;
    outline: none;
    max-width: 116px;
  }
  .coop-pill-btn {
    border: 1px solid #E5B494;
    background: #FFF;
    color: var(--brown-dark);
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .coop-pill-btn.accent {
    border-color: var(--accent-coral);
    background: var(--accent-coral);
    color: #FFF;
  }
  .coop-bubble-wrap {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 8px;
    z-index: 25;
    display: none;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    pointer-events: none;
  }
  .coop-bubble-wrap.show { display: flex; }
  .coop-bubble-pill {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 252, 246, 0.94);
    border: 1.5px solid #E5B996;
    border-radius: 999px;
    padding: 4px 11px;
    box-shadow: 0 4px 12px rgba(74, 46, 27, 0.14);
    font-size: 11px;
    color: var(--brown-dark);
    cursor: pointer;
  }
  .coop-bubble-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-coral);
    flex-shrink: 0;
  }
  .coop-bubble-card {
    pointer-events: auto;
    width: 100%;
    background: rgba(255, 252, 246, 0.96);
    border: 1.5px solid #E5B996;
    border-radius: 12px;
    padding: 9px 12px;
    box-shadow: 0 8px 20px rgba(74, 46, 27, 0.16);
    display: none;
    flex-direction: column;
    gap: 4px;
  }
  .coop-bubble-wrap.expanded .coop-bubble-card { display: flex; }
  .poster-view-tabs {
    width: 100%;
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    background: #F5E7D7;
    padding: 3px;
    border-radius: 10px;
  }
  .poster-view-tabs.show { display: grid; }
  .poster-view-tab {
    border: none;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--brown-mid);
    background: transparent;
    cursor: pointer;
  }
  .poster-view-tab.active {
    background: #FFFDF9;
    color: var(--accent-coral-dark);
    box-shadow: 0 1px 4px rgba(74, 46, 27, 0.1);
  }
  .poster-notes-page {
    width: 100%;
    max-height: 290px;
    overflow-y: auto;
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 2px;
  }
  .poster-notes-page.show { display: flex; }
  .poster-note-item {
    background: #FFFBF4;
    border: 1px solid #EBD5BD;
    border-radius: 10px;
    padding: 9px 11px;
    text-align: left;
  }
  .poster-coop-panel {
    width: 100%;
    flex-direction: column;
    gap: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border-warm);
    margin-top: 4px;
  }
  .poster-review-box {
    background: #FFF9F0;
    border: 1px solid #EBD2B7;
    border-left: 3px solid var(--accent-coral);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 12px;
    line-height: 1.65;
    color: var(--brown-dark);
    text-align: left;
  }
  .poster-img {
    width: 100%;
    border-radius: 16px;
    border: 2px solid var(--border-warm);
    box-shadow: 0 8px 25px rgba(74, 46, 27, 0.15);
  }

  .hidden {
    display: none !important;
  }

  /* 矮屏/移动端紧凑适配，确保底部选项与操作按钮永不被裁切遮挡 */
  @media (max-height: 740px) {
    .top-header {
      padding: 6px 12px 4px;
    }
    .header-row {
      margin-bottom: 4px;
    }
    .prompt-bar {
      margin: 5px 10px 0;
      padding: 6px 10px;
      gap: 4px;
    }
    .prompt-top {
      font-size: 11.5px;
    }
    .bottom-dock {
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      gap: 6px;
      border-radius: 18px 18px 0 0;
    }
    .options-scroll {
      min-height: 54px;
      padding: 2px;
      gap: 8px;
    }
    .option-card {
      min-width: 58px;
      padding: 5px 6px;
      gap: 3px;
    }
    .swatch-circle {
      width: 24px;
      height: 24px;
    }
    .option-thumb {
      width: 30px;
      height: 30px;
    }
    .btn-primary, .btn-secondary {
      padding: 9px 14px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<div id="app">
  <!-- 顶部导航 -->
  <header class="top-header">
    <div class="header-row">
      <div class="brand-title">
        <button class="icon-btn coop-only" id="backToWorkshopBtn" title="返回东汉工坊" style="width:28px;height:28px;margin-right:2px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7M8 12h11"/></svg>
        </button>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">

<script>
(() => {
  /* ============================================================================
   * 1. 合成音效引擎 (Web Audio API，无需外部音频，零延迟)
   * ============================================================================ */
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.enabled = true;
      this.lastSwish = 0;
    }
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }
    playPop(freq = 520) {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.45, now + 0.08);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    }
    playSwish() {
      if (!this.enabled) return;
      const nowMs = performance.now();
      if (nowMs - this.lastSwish < 90) return;
      this.lastSwish = nowMs;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220 + Math.random() * 80, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.07);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    }
    playScrape(speed = 1) {
      if (!this.enabled) return;
      const nowMs = performance.now();
      if (nowMs - this.lastSwish < 75) return;
      this.lastSwish = nowMs;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const dur = 0.08;
      const sampleCount = Math.floor(this.ctx.sampleRate * dur);
      const buffer = this.ctx.createBuffer(1, sampleCount, this.ctx.sampleRate);
      const ch = buffer.getChannelData(0);
      for (let i = 0; i < sampleCount; i++) {
        ch[i] = (Math.random() * 2 - 1) * 0.45;
      }
      const src = this.ctx.createBufferSource();
      src.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      const cutoff = Math.max(340, Math.min(920, 400 + speed * 28));
      filter.frequency.setValueAtTime(cutoff, now);
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.032, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      src.start(now);
      src.stop(now + dur);
    }
    playChime() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((n, i) => {
        const now = this.ctx.currentTime + i * 0.07;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(n, now);
        gain.gain.setValueAtTime(0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      });
    }
  }
  const sfx = new SoundEngine();

  /* ============================================================================
   * 3.5 双通道表面缓冲系统 (Albedo 线性颜色场 + Height 奶油高度场 + 局部法线着色)
   * ============================================================================ */
  function hexToRgb(hex) {
    const clean = (hex || '#F6EDE0').replace('#', '');
    const num = parseInt(clean.length === 3
      ? clean.split('').map(c => c + c).join('')
      : clean, 16);
    return {
      r: (num >> 16) & 255,
      g: (num >> 8) & 255,
      b: num & 255
    };
  }

  function srgbToLin(c255) {
    const n = c255 / 255;
    return n * n;
  }

  function linToSrgb(lin) {
    const clamped = lin <= 0 ? 0 : (lin >= 1 ? 1 : lin);
    return Math.round(Math.sqrt(clamped) * 255);
  }

  class SurfaceBuffer {
    constructor(width, height, wrapX = false) {
      this.width = width;
      this.height = height;
      this.wrapX = wrapX;
      // 线性近似色彩空间 RGBA (0~1)
      this.albedo = new Float32Array(width * height * 4);
      // 奶油厚度/浮雕高度场 (0~1)
      this.heightMap = new Float32Array(width * height);
      this.canvas = document.createElement('canvas');
      this.canvas.width = width;
      this.canvas.height = height;
      this.ctx = this.canvas.getContext('2d');
      this.imgData = this.ctx.createImageData(width, height);
      this.dirty = null;
    }

    fillBaseColor(hexColor, baseHeight = 0.25) {
      const rgb = hexToRgb(hexColor);
      const lr = srgbToLin(rgb.r);
      const lg = srgbToLin(rgb.g);
      const lb = srgbToLin(rgb.b);
      const total = this.width * this.height;
      for (let i = 0; i < total; i++) {
        const i4 = i * 4;
        this.albedo[i4] = lr;
        this.albedo[i4 + 1] = lg;
        this.albedo[i4 + 2] = lb;
        this.albedo[i4 + 3] = 1.0;
        this.heightMap[i] = baseHeight;
      }
      this.rebuildRegion(0, 0, this.width - 1, this.height - 1);
      this.dirty = null;
    }

    markDirty(x0, y0, x1, y1) {
      const w = this.width;
      const h = this.height;
      const cy0 = Math.max(0, Math.floor(y0));
      const cy1 = Math.min(h - 1, Math.ceil(y1));
      let cx0 = Math.floor(x0);
      let cx1 = Math.ceil(x1);
      if (!this.wrapX) {
        cx0 = Math.max(0, cx0);
        cx1 = Math.min(w - 1, cx1);
      } else if (cx0 < 0 || cx1 >= w) {
        // 跨接缝时直接更新整行宽度区间（保持实现简洁且无撕裂）
        cx0 = 0;
        cx1 = w - 1;
      }
      if (!this.dirty) {
        this.dirty = { x0: cx0, y0: cy0, x1: cx1, y1: cy1 };
      } else {
        this.dirty.x0 = Math.min(this.dirty.x0, cx0);
        this.dirty.y0 = Math.min(this.dirty.y0, cy0);
        this.dirty.x1 = Math.max(this.dirty.x1, cx1);
        this.dirty.y1 = Math.max(this.dirty.y1, cy1);
      }
    }

    flushDirty() {
      if (!this.dirty) return;
      const d = this.dirty;
      this.rebuildRegion(d.x0, d.y0, d.x1, d.y1);
      this.dirty = null;
    }

    rebuildRegion(x0, y0, x1, y1) {
      const w = this.width;
      const h = this.height;
      const wrapX = this.wrapX;
      const rx0 = Math.max(0, Math.floor(x0));
      const ry0 = Math.max(0, Math.floor(y0));
      const rx1 = Math.min(w - 1, Math.ceil(x1));
      const ry1 = Math.min(h - 1, Math.ceil(y1));
      const rw = rx1 - rx0 + 1;
      const rh = ry1 - ry0 + 1;
      if (rw <= 0 || rh <= 0) return;

      const data = this.imgData.data;
      const albedo = this.albedo;
      const hm = this.heightMap;

      // 左上柔和主光方向 (nx, ny, nz)
      const lx = -0.58;
      const ly = -0.66;
      const lz = 0.48;
      const bumpStrength = 3.6;

      for (let y = ry0; y <= ry1; y++) {
        const yUp = y > 0 ? y - 1 : 0;
        const yDn = y < h - 1 ? y + 1 : h - 1;
        const rowOff = y * w;
        const rowUp = yUp * w;
        const rowDn = yDn * w;

        for (let x = rx0; x <= rx1; x++) {
          const xL = x > 0 ? x - 1 : (wrapX ? w - 1 : 0);
          const xR = x < w - 1 ? x + 1 : (wrapX ? 0 : w - 1);

          const gx = (hm[rowOff + xR] - hm[rowOff + xL]) * bumpStrength;
          const gy = (hm[rowDn + x] - hm[rowUp + x]) * bumpStrength;

          // 归一化法线 (-gx, -gy, 1)
          const invLen = 1 / Math.sqrt(gx * gx + gy * gy + 1);
          const nx = -gx * invLen;
          const ny = -gy * invLen;
          const nz = invLen;

          // 柔和漫反射 + 奶油丝绒微高光
          const ndotl = nx * lx + ny * ly + nz * lz;
          const diff = 0.90 + (ndotl - lz) * 0.42;
          const specBase = Math.max(0, ndotl - 0.55);
          const spec = specBase * specBase * 0.24;

          const idx = rowOff + x;
          const i4 = idx * 4;
          const lr = albedo[i4] * diff + spec;
          const lg = albedo[i4 + 1] * diff + spec;
          const lb = albedo[i4 + 2] * diff + spec;

          data[i4] = linToSrgb(lr);
          data[i4 + 1] = linToSrgb(lg);
          data[i4 + 2] = linToSrgb(lb);
          data[i4 + 3] = 255;
        }
      }

      this.ctx.putImageData(this.imgData, 0, 0, rx0, ry0, rw, rh);
    }

    // 紧凑型快照（将线性 RGB 与高度场打包为 4 字节/像素，用于高效撤销栈）
    captureSnapshot() {
      const total = this.width * this.height;
      const packed = new Uint8Array(total * 4);
      const albedo = this.albedo;
      const hm = this.heightMap;
      for (let i = 0; i < total; i++) {
        const i4 = i * 4;
        packed[i4] = linToSrgb(albedo[i4]);
        packed[i4 + 1] = linToSrgb(albedo[i4 + 1]);
        packed[i4 + 2] = linToSrgb(albedo[i4 + 2]);
        packed[i4 + 3] = Math.max(0, Math.min(255, Math.round(hm[i] * 255)));
      }
      return packed;
    }

    restoreSnapshot(packed) {
      if (!packed) return;
      const total = this.width * this.height;
      const albedo = this.albedo;
      const hm = this.heightMap;
      for (let i = 0; i < total; i++) {
        const i4 = i * 4;
        albedo[i4] = srgbToLin(packed[i4]);
        albedo[i4 + 1] = srgbToLin(packed[i4 + 1]);
        albedo[i4 + 2] = srgbToLin(packed[i4 + 2]);
        albedo[i4 + 3] = 1.0;
        hm[i] = packed[i4 + 3] / 255;
      }
      this.rebuildRegion(0, 0, this.width - 1, this.height - 1);
      this.dirty = null;
    }
  }

  let state = createInitialState();

  function createInitialState() {

  /* ============================================================================
   * 4. 坐标转换与辅助几何函数
   * ============================================================================ */
  function getLayerTopY(layerIndex) {
    // layerIndex: 0(第一层顶), 1(第二层顶), 2(第三层顶)
    const stepH = CAKE.layerH + CAKE.fillingH;
    return CAKE.baseY - CAKE.layerH - layerIndex * stepH;
  }

  function getCakeTopY() {
    return getLayerTopY(2);
  }

  function clampCameraPan(zoom, panX, panY) {
    const maxPan = Math.max(0, (zoom - 0.85) * 290);
    return {
      panX: Math.max(-maxPan, Math.min(maxPan, panX)),
      panY: Math.max(-maxPan, Math.min(maxPan, panY))
    };
  }

  function setCameraZoom(nextZoom, anchorRawX = CW * 0.5, anchorRawY = CH * 0.5, immediate = false) {
    const cam = state.camera;
    const clampedZoom = Math.max(0.85, Math.min(3.0, nextZoom));
    const baseZoom = immediate ? cam.zoom : cam.targetZoom;
    const basePanX = immediate ? cam.panX : cam.targetPanX;
    const basePanY = immediate ? cam.panY : cam.targetPanY;

    // 保持锚点世界坐标在缩放前后屏幕位置不变
    const wx = (anchorRawX - CW * 0.5 - basePanX) / baseZoom + CW * 0.5;
    const wy = (anchorRawY - CH * 0.5 - basePanY) / baseZoom + CH * 0.5;
    const rawPanX = anchorRawX - CW * 0.5 - (wx - CW * 0.5) * clampedZoom;
    const rawPanY = anchorRawY - CH * 0.5 - (wy - CH * 0.5) * clampedZoom;
    const clamped = clampCameraPan(clampedZoom, rawPanX, rawPanY);

    cam.targetZoom = clampedZoom;
    cam.targetPanX = clamped.panX;
    cam.targetPanY = clamped.panY;
    if (immediate) {
      cam.zoom = clampedZoom;
      cam.panX = clamped.panX;
      cam.panY = clamped.panY;
    }
    updateCameraControlsUI();
  }

  function resetCamera(keepViewMode = true) {
    const cam = state.camera;
    if (!keepViewMode) cam.viewMode = 'iso';
    cam.targetZoom = 1.0;
    cam.targetPanX = 0;
    cam.targetPanY = 0;
    updateCameraControlsUI();
  }

  function updateCameraControlsUI() {
    const viewBtn = document.getElementById('viewModeBtn');
    const viewLabel = document.getElementById('viewModeLabel');
    const zoomReset = document.getElementById('zoomResetBtn');
    if (!viewBtn || !viewLabel || !zoomReset) return;
    const isTop = state.camera.viewMode === 'top';
    viewBtn.classList.toggle('active', isTop);
    viewLabel.textContent = isTop ? '切回立体' : '俯视视角';
    zoomReset.textContent = `${Math.round(state.camera.targetZoom * 100)}%`;
  }

  function canvasToWorld(rawX, rawY) {
    const cam = state.camera;
    return {
      x: (rawX - CW * 0.5 - cam.panX) / cam.zoom + CW * 0.5,
      y: (rawY - CH * 0.5 - cam.panY) / cam.zoom + CH * 0.5,
      rawX,
      rawY
    };
  }

  function getRawCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      rawX: (clientX - rect.left) * (CW / rect.width),
      rawY: (clientY - rect.top) * (CH / rect.height)
    };
  }

  function getCanvasPos(e) {
    const raw = getRawCanvasPos(e);
    return canvasToWorld(raw.rawX, raw.rawY);
  }

  function isInsideEllipse(px, py, cx, cy, rx, ry) {
    const dx = (px - cx) / rx;
    const dy = (py - cy) / ry;
    return (dx * dx + dy * dy) <= 1.05;
  }

  // 将世界画布坐标 (wx, wy) 映射到蛋糕顶面或侧面归一化坐标 (u, v) 与缓冲像素坐标 (px, py)
  function worldToSurface(wx, wy, viewMode = state.camera.viewMode) {
    const topS = state.topSurface;

    // A. 正俯视圆形视角：100% 精准映射至顶面缓冲
    if (viewMode === 'top') {
      const rawDu = (wx - TOP_VIEW.cx) / TOP_VIEW.r;
      const rawDv = (wy - TOP_VIEW.cy) / TOP_VIEW.r;
      if (rawDu * rawDu + rawDv * rawDv <= 1.02) {
        const cosA = Math.cos(-state.turntableAngle);
        const sinA = Math.sin(-state.turntableAngle);
        const du = rawDu * cosA - rawDv * sinA;
        const dv = rawDu * sinA + rawDv * cosA;
        return {
          surface: 'top',
          buf: topS,
          u: du,
          v: dv,
          px: (du * 0.5 + 0.5) * topS.width,
          py: (dv * 0.5 + 0.5) * topS.height
        };
      }
      return null;
    }

    // B. 2.5D 立体视角
    const cx = CAKE.cx;
    const rx = CAKE.rx + 4;
    const ry = CAKE.ry + 2;
    const by = CAKE.baseY;
    const ty = getCakeTopY() - 2;

    // 1. 优先命中顶面椭圆（同步扣除转盘旋转角）
    const rawDu = (wx - cx) / rx;
    const rawDv = (wy - ty) / ry;
    if (rawDu * rawDu + rawDv * rawDv <= 1.02) {
      const cosA = Math.cos(-state.turntableAngle);
      const sinA = Math.sin(-state.turntableAngle);
      const du = rawDu * cosA - rawDv * sinA;
      const dv = rawDu * sinA + rawDv * cosA;
      return {
        surface: 'top',
        buf: topS,
        u: du,
        v: dv,
        px: (du * 0.5 + 0.5) * topS.width,
        py: (dv * 0.5 + 0.5) * topS.height
      };
    }

    // 2. 命中侧面圆柱正面弧
    if (Math.abs(wx - cx) <= rx + 2) {
      const cosTheta = Math.max(-1, Math.min(1, (wx - cx) / rx));
      const theta = Math.acos(cosTheta); // 0(右) ~ PI(左)
      const sinTheta = Math.sin(theta);
      const rimTopY = ty + sinTheta * ry;
      const rimBotY = by + sinTheta * ry;
      if (wy >= rimTopY - 4 && wy <= rimBotY + 4) {
        const v = Math.max(0, Math.min(1, (wy - rimTopY) / Math.max(1, rimBotY - rimTopY)));
        const twoPi = Math.PI * 2;
        const worldAngle = (((theta - state.turntableAngle) % twoPi) + twoPi) % twoPi;
        const u = worldAngle / twoPi;
        const sideS = state.sideSurface;
        return {
          surface: 'side',
          buf: sideS,
          u,
          v,
          px: u * sideS.width,
          py: v * sideS.height
        };
      }
    }
    return null;
  }

  // 将表面归一化坐标 (surface, u, v) 投影回当前视角的世界坐标 (x, y)
  function surfaceToWorld(surface, u, v, viewMode = state.camera.viewMode) {
    if (surface === 'top') {
      const cosA = Math.cos(state.turntableAngle);
      const sinA = Math.sin(state.turntableAngle);
      const ru = u * cosA - v * sinA;
      const rv = u * sinA + v * cosA;
      if (viewMode === 'top') {
        return {
          x: TOP_VIEW.cx + ru * TOP_VIEW.r,
          y: TOP_VIEW.cy + rv * TOP_VIEW.r
        };
      }
      const rx = CAKE.rx + 4;
      const ry = CAKE.ry + 2;
      const ty = getCakeTopY() - 2;
      return {
        x: CAKE.cx + ru * rx,
        y: ty + rv * ry
      };
    }
    if (surface === 'side') {
      if (viewMode === 'top') return null; // 俯视视角下不渲染侧面装饰
      const twoPi = Math.PI * 2;
      const theta = (((u * twoPi + state.turntableAngle) % twoPi) + twoPi) % twoPi;
      if (theta > Math.PI + 0.05 && theta < twoPi - 0.05) return null; // 背面不可见
      const clampedTheta = Math.max(0, Math.min(Math.PI, theta));
      const rx = CAKE.rx + 4;
      const ry = CAKE.ry + 2;
      const ty = getCakeTopY() - 2;
      const cylH = CAKE.baseY - ty;
      return {
        x: CAKE.cx + Math.cos(clampedTheta) * rx,
        y: ty + Math.sin(clampedTheta) * ry + v * cylH
      };
    }
    return null;
  }

  function resolveItemWorldPos(item, viewMode = state.camera.viewMode) {
    if (item.surface) {
      return surfaceToWorld(item.surface, item.u, item.v, viewMode);
    }
    if (viewMode === 'top') {
      // 兼容尚未带 surface 字段的旧元素，按 2.5D 顶面映射近似转换
      const rx = CAKE.rx + 4;
      const ry = CAKE.ry + 2;
      const ty = getCakeTopY() - 2;
      const du = (item.x - CAKE.cx) / rx;
      const dv = (item.y - ty) / ry;
      if (du * du + dv * dv <= 1.2) {
        return { x: TOP_VIEW.cx + du * TOP_VIEW.r, y: TOP_VIEW.cy + dv * TOP_VIEW.r };
      }
      return null;
    }
    return { x: item.x, y: item.y };
  }

  /* ============================================================================
   * 5. 精致烘焙视觉绘制函数 (无Emoji，纯Canvas手绘渲染)
   * ============================================================================ */

  // 5.1 绘制旋转裱花台与欧式陶瓷蛋糕托盘
  function drawCakeStand(ctx, angle) {
    const cx = CAKE.cx;
    const by = CAKE.baseY + 12;

    // 桌面柔和投影
    ctx.save();
    const shadowGrad = ctx.createRadialGradient(cx, by + 65, 30, cx, by + 65, 255);
    shadowGrad.addColorStop(0, 'rgba(115, 72, 42, 0.24)');
    shadowGrad.addColorStop(1, 'rgba(115, 72, 42, 0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.ellipse(cx, by + 65, 250, 75, 0, 0, Math.PI * 2);
    ctx.fill();

    // 托盘高脚底座
    const standGrad = ctx.createLinearGradient(cx - 85, by + 20, cx + 85, by + 70);
    standGrad.addColorStop(0, '#F5E9DA');
    standGrad.addColorStop(0.5, '#FFFDF9');
    standGrad.addColorStop(1, '#D8C3AC');
    ctx.fillStyle = standGrad;
    ctx.beginPath();
    ctx.moveTo(cx - 52, by + 10);
    ctx.quadraticCurveTo(cx - 65, by + 48, cx - 95, by + 62);
    ctx.ellipse(cx, by + 62, 95, 28, 0, Math.PI, 0, true);
    ctx.quadraticCurveTo(cx + 65, by + 48, cx + 52, by + 10);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#DFCBB5';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 托盘盘面厚度边缘
    ctx.fillStyle = '#E2CEB8';
    ctx.beginPath();
    ctx.ellipse(cx, by + 10, CAKE.rx + 46, CAKE.ry + 22, 0, 0, Math.PI * 2);
    ctx.fill();

    // 托盘主盘面
    const plateGrad = ctx.createLinearGradient(cx - 220, by - 40, cx + 220, by + 40);
    plateGrad.addColorStop(0, '#FFFFFF');
    plateGrad.addColorStop(0.6, '#FCF5EC');
    plateGrad.addColorStop(1, '#EADACA');
    ctx.fillStyle = plateGrad;
    ctx.beginPath();
    ctx.ellipse(cx, by, CAKE.rx + 46, CAKE.ry + 20, 0, 0, Math.PI * 2);
    ctx.fill();

    // 托盘旋转刻度纹理与金色描边
    ctx.strokeStyle = '#E5C384';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, by, CAKE.rx + 36, CAKE.ry + 15, 0, 0, Math.PI * 2);
    ctx.stroke();

    // 旋转花纹点，让玩家在抹面旋转时看到真实的转盘转动
    ctx.fillStyle = '#E5C384';
    for (let i = 0; i < 16; i++) {
      const a = angle + (i * Math.PI * 2) / 16;
      const px = cx + Math.cos(a) * (CAKE.rx + 41);
      const py = by + Math.sin(a) * (CAKE.ry + 17.5);
      ctx.beginPath();
      ctx.arc(px, py, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 5.2 绘制单层海绵蛋糕胚（含烘焙焦边与细腻气孔）
  function drawSpongeLayer(ctx, bottomY, flavor, yOffset = 0) {
    const cx = CAKE.cx;
    const rx = CAKE.rx;
    const ry = CAKE.ry;
    const h = CAKE.layerH;
    const by = bottomY + yOffset;
    const ty = by - h;

    ctx.save();
    // 圆柱侧面
    const sideGrad = ctx.createLinearGradient(cx - rx, ty, cx + rx, ty);
    sideGrad.addColorStop(0, flavor.sideBot);
    sideGrad.addColorStop(0.28, flavor.sideTop);
    sideGrad.addColorStop(0.7, flavor.sideTop);
    sideGrad.addColorStop(1, flavor.crust);

    ctx.fillStyle = sideGrad;
    ctx.beginPath();
    ctx.moveTo(cx - rx, ty);
    ctx.lineTo(cx - rx, by);
    ctx.ellipse(cx, by, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(cx + rx, ty);
    ctx.ellipse(cx, ty, rx, ry, 0, 0, Math.PI, false);
    ctx.closePath();
    ctx.fill();

    // 侧面海绵气孔质感
    ctx.save();
    ctx.clip();
    SPONGE_PORES.forEach(p => {
      const px = cx - rx + p.u * (rx * 2);
      const py = ty + p.v * (h + ry);
      ctx.fillStyle = p.dark ? flavor.crust : flavor.top;
      ctx.globalAlpha = 0.28;
      ctx.beginPath();
      ctx.arc(px, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    // 顶面椭圆
    const topGrad = ctx.createRadialGradient(cx - 35, ty - 12, 20, cx, ty, rx);
    topGrad.addColorStop(0, flavor.top);
    topGrad.addColorStop(0.82, flavor.sideTop);
    topGrad.addColorStop(1, flavor.crust);

    ctx.fillStyle = topGrad;
    ctx.beginPath();
    ctx.ellipse(cx, ty, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // 顶面海绵气孔
    ctx.save();
    ctx.clip();
    for (let i = 0; i < 110; i++) {
      const p = SPONGE_PORES[i];
      const angle = p.u * Math.PI * 2;
      const dist = Math.sqrt(p.v) * 0.92;
      const px = cx + Math.cos(angle) * rx * dist;
      const py = ty + Math.sin(angle) * ry * dist;
      ctx.fillStyle = p.dark ? flavor.crumb : '#FFF5E1';
      ctx.globalAlpha = 0.24;
      ctx.beginPath();
      ctx.arc(px, py, p.r * 0.85, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 烘焙金棕色微焦边缘
    ctx.strokeStyle = flavor.crust;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, ty, rx - 1, ry - 1, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 5.25 核心渲染器：绘制视频同款3D连续棱纹奶油轨迹 / 流心巧克力酱线条
  function traceSmoothPath(ctx, pts) {
    if (!pts || pts.length === 0) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 1) {
      ctx.lineTo(pts[0].x + 0.5, pts[0].y);
      return;
    }
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) * 0.5;
      const my = (pts[i].y + pts[i + 1].y) * 0.5;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last.x, last.y);
  }

  function drawRibbedCreamStroke(ctx, stroke, isSmoothed = false) {
    const pts = stroke.points;
    if (!pts || pts.length === 0) return;
    const w = stroke.size || 24;
    const col = stroke.color;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 如果是在奶油表面画巧克力酱/果酱淋线（视频 00:18-00:21 效果）
    if (stroke.isSauce) {
      // 酱料底影
      ctx.save();
      ctx.translate(0, 2);
      traceSmoothPath(ctx, pts);
      ctx.strokeStyle = 'rgba(60, 25, 10, 0.2)';
      ctx.lineWidth = w * 0.42;
      ctx.stroke();
      ctx.restore();

      // 酱料主体
      traceSmoothPath(ctx, pts);
      ctx.strokeStyle = col.color;
      ctx.lineWidth = w * 0.36;
      ctx.stroke();

      // 水润高光芯
      ctx.save();
      ctx.translate(-1, -1);
      traceSmoothPath(ctx, pts);
      ctx.strokeStyle = col.highlight || 'rgba(255,255,255,0.6)';
      ctx.lineWidth = w * 0.12;
      ctx.stroke();
      ctx.restore();

      // 沿线条散落的巧克力卷屑碎片（视频同款）
      if (stroke.shards) {
        stroke.shards.forEach(sh => {
          ctx.save();
          ctx.translate(sh.x, sh.y);
          ctx.rotate(sh.rot);
          ctx.fillStyle = col.color;
          ctx.fillRect(-sh.w * 0.5, -sh.h * 0.5, sh.w, sh.h);
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          ctx.fillRect(-sh.w * 0.5, -sh.h * 0.5, sh.w * 0.4, sh.h * 0.35);
          ctx.restore();
        });
      }
      ctx.restore();
      return;
    }

    // 若玩家开启了“丝滑抹平”效果，将多色轨迹柔和晕染融合
    if (isSmoothed) {
      traceSmoothPath(ctx, pts);
      ctx.strokeStyle = col.mid;
      ctx.lineWidth = w * 1.45;
      ctx.globalAlpha = 0.85;
      ctx.stroke();

      traceSmoothPath(ctx, pts);
      ctx.strokeStyle = col.light;
      ctx.lineWidth = w * 0.9;
      ctx.globalAlpha = 0.6;
      ctx.stroke();
      ctx.restore();
      return;
    }

    // 视频同款：立体多层凹凸棱纹奶油挤出效果
    const shadeColor = col.shade || col.dark || '#D5C5B2';

    // 1. 奶油条底部接触立体阴影（让后涂的奶油自然压在先涂的奶油之上）
    ctx.save();
    ctx.translate(0, 2.5);
    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = 'rgba(75, 45, 25, 0.16)';
    ctx.lineWidth = w + 3;
    ctx.stroke();
    ctx.restore();

    // 2. 外侧暗部棱边
    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = shadeColor;
    ctx.lineWidth = w + 1.5;
    ctx.stroke();

    // 3. 外层高光奶油脊
    ctx.save();
    ctx.translate(0, -0.5);
    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = col.light;
    ctx.lineWidth = w * 0.86;
    ctx.stroke();

    // 4. 中层裱花嘴凹槽
    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = col.mid;
    ctx.lineWidth = w * 0.56;
    ctx.stroke();

    // 5. 内层高光奶油脊
    ctx.translate(0, -0.6);
    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = col.light;
    ctx.lineWidth = w * 0.30;
    ctx.stroke();

    // 6. 中心精细棱线
    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = shadeColor;
    ctx.lineWidth = Math.max(1.2, w * 0.09);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  // 5.3 绘制夹心层（修复悬空紫圈，改为真实手指连续挤涂多色果酱奶油+切丁鲜果粒）
  function drawFillingLayer(ctx, surfaceY, fillingObj, isCoveredAbove) {
    const cx = CAKE.cx;
    const rx = CAKE.rx - 4;
    const ry = CAKE.ry - 3;

    ctx.save();

    // A. 如果还没有盖上下一层蛋糕胚，严格在当前蛋糕胚顶面内绘制玩家的真实涂抹轨迹
    if (!isCoveredAbove) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, surfaceY, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();

      // 绘制每一笔连续的3D棱纹夹心奶油/果酱（支持多色混合）
      fillingObj.strokes.forEach(st => {
        if (st.points) {
          drawRibbedCreamStroke(ctx, st, false);
        }
      });
      ctx.restore();

      // 绘制立体切丁水果粒
      fillingObj.chunks.forEach(c => {
        const f = c.fruit || fillingObj.fruit;
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);

        ctx.fillStyle = 'rgba(90, 40, 20, 0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 4, 12 * c.s, 7 * c.s, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.roundRect(-10 * c.s, -8 * c.s, 20 * c.s, 15 * c.s, 4);
        ctx.fill();

        ctx.fillStyle = f.inner;
        ctx.beginPath();
        ctx.roundRect(-8 * c.s, -6 * c.s, 14 * c.s, 9 * c.s, 3);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.beginPath();
        ctx.arc(-4 * c.s, -3 * c.s, 2.2 * c.s, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }
    // B. 当上层蛋糕胚已经盖上后，仅在两层蛋糕胚之间的正面接缝处露出饱满的夹心奶油与果酱边
    else if (fillingObj.spreadProgress > 0.05 || fillingObj.strokes.length > 0) {
      // 夹心奶油波浪侧边
      ctx.strokeStyle = fillingObj.cream.cream;
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.ellipse(cx, surfaceY - 2, CAKE.rx + 1, CAKE.ry, 0, 0.03 * Math.PI, 0.97 * Math.PI);
      ctx.stroke();

      // 夹心果酱流心内芯线
      ctx.strokeStyle = fillingObj.cream.jam;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(cx, surfaceY - 1, CAKE.rx + 1, CAKE.ry, 0, 0.06 * Math.PI, 0.94 * Math.PI);
      ctx.stroke();
    }

    ctx.restore();
  }

  // 5.4 绘制外部奶油抹面（双通道表面缓冲渲染 + 圆柱体积光影解耦 + 流心酱与边缘淋面）
  function drawOuterFrosting(ctx) {
    const cx = CAKE.cx;
    const rx = CAKE.rx + 4;
    const ry = CAKE.ry + 2;
    const by = CAKE.baseY;
    const ty = getCakeTopY() - 2;
    const baseCol = state.baseCoatColor || FROSTING_COLORS[0];
    const topS = state.topSurface;
    const sideS = state.sideSurface;

    // 仅在有脏区域时刷新局部法线光影到离屏画布
    topS.flushDirty();
    sideS.flushDirty();

    ctx.save();

    // 1. 圆柱侧面：按 2px 垂直条带映射 sideSurface 柱面纹理，完美贴合椭圆弧并支持转盘旋转
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - rx, ty);
    ctx.lineTo(cx - rx, by);
    ctx.ellipse(cx, by, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(cx + rx, ty);
    ctx.ellipse(cx, ty, rx, ry, 0, 0, Math.PI, false);
    ctx.closePath();
    ctx.clip();

    const cylH = by - ty;
    const twoPi = Math.PI * 2;
    const stepX = 2;
    for (let sx = -rx; sx < rx; sx += stepX) {
      const midX = Math.max(-rx, Math.min(rx, sx + stepX * 0.5));
      const cosTheta = Math.max(-1, Math.min(1, midX / rx));
      const theta = Math.acos(cosTheta);
      const sinTheta = Math.sin(theta);
      const rimTopY = ty + sinTheta * ry;
      const worldAngle = (((theta - state.turntableAngle) % twoPi) + twoPi) % twoPi;
      const srcX = (worldAngle / twoPi) * sideS.width;
      const srcW = Math.min(sideS.width - srcX, Math.max(1.5, (stepX / (rx * Math.max(0.22, sinTheta))) * (sideS.width / twoPi)));
      ctx.drawImage(sideS.canvas, srcX, 0, srcW, sideS.height, cx + sx, rimTopY - 1, stepX + 0.8, cylH + 2);
    }

    // 统一叠加柔和的圆柱侧面体积光影（与颜料混色解耦，不发灰不脏边）
    const sideLight = ctx.createLinearGradient(cx - rx, ty, cx + rx, ty);
    sideLight.addColorStop(0, 'rgba(95, 58, 34, 0.22)');
    sideLight.addColorStop(0.24, 'rgba(255, 252, 245, 0.16)');
    sideLight.addColorStop(0.58, 'rgba(255, 255, 255, 0)');
    sideLight.addColorStop(0.88, 'rgba(95, 58, 34, 0.20)');
    sideLight.addColorStop(1, 'rgba(95, 58, 34, 0.12)');
    ctx.fillStyle = sideLight;
    ctx.fillRect(cx - rx, ty, rx * 2, cylH + ry + 2);
    ctx.restore();

    // 2. 蛋糕顶面：将 512x512 顶面正圆纹理压扁映射到 2.5D 顶面椭圆
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, ty, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();

    // 若转盘旋转，顶面纹理同步旋转
    ctx.translate(cx, ty);
    ctx.scale(1, ry / rx);
    ctx.rotate(state.turntableAngle);
    ctx.drawImage(topS.canvas, -rx, -rx, rx * 2, rx * 2);
    ctx.restore();

    // 顶面柔和环境高光与边缘微压暗
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, ty, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();
    const topLight = ctx.createRadialGradient(cx - 48, ty - 16, 12, cx, ty, rx);
    topLight.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
    topLight.addColorStop(0.55, 'rgba(255, 255, 255, 0)');
    topLight.addColorStop(1, 'rgba(95, 58, 34, 0.12)');
    ctx.fillStyle = topLight;
    ctx.fillRect(cx - rx, ty - ry, rx * 2, ry * 2);
    ctx.restore();

    // 蛋糕底圈精致小珍珠奶油裙边
    ctx.save();
    for (let i = 0; i <= 22; i++) {
      const a = (i / 22) * Math.PI;
      const px = cx + Math.cos(a) * (rx + 2);
      const py = by + Math.sin(a) * (ry + 1);
      const pg = ctx.createRadialGradient(px - 2, py - 2, 1, px, py, 8);
      pg.addColorStop(0, '#FFFFFF');
      pg.addColorStop(0.6, baseCol.light);
      pg.addColorStop(1, baseCol.shade);
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(px, py, 7.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 3. 裁剪在蛋糕立体轮廓内，绘制流心巧克力/果酱画笔线条
    if (state.frostStrokes && state.frostStrokes.length > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, ty, rx + 2, ry + 2, 0, Math.PI, 0, false);
      ctx.lineTo(cx + rx + 2, by);
      ctx.ellipse(cx, by, rx + 2, ry + 2, 0, 0, Math.PI, false);
      ctx.closePath();
      ctx.clip();

      state.frostStrokes.forEach(st => {
        if (st.isSauce) drawRibbedCreamStroke(ctx, st, false);
      });
      ctx.restore();
    }

    // 4. 绘制甘纳许边缘淋面 (Ganache Drip)
    if (state.dripGlaze && state.dripGlaze.color) {
      drawGanacheDrip(ctx, cx, ty, rx, ry, state.dripGlaze);
    }

    ctx.restore();
  }

  // 5.45 正俯视圆形视角渲染器（圆盘转盘 + 顶面正圆蛋糕胚/奶油缓冲 + 顶面流心酱与淋面环）
  function drawTopDownCake(ctx) {
    const cx = TOP_VIEW.cx;
    const cy = TOP_VIEW.cy;
    const R = TOP_VIEW.r;
    const baseCol = state.baseCoatColor || FROSTING_COLORS[0];

    ctx.save();

    // 1. 俯视圆形陶瓷转盘与投影
    const shadowGrad = ctx.createRadialGradient(cx, cy + 8, R * 0.7, cx, cy + 8, R + 75);
    shadowGrad.addColorStop(0, 'rgba(115, 72, 42, 0.22)');
    shadowGrad.addColorStop(1, 'rgba(115, 72, 42, 0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.arc(cx, cy + 8, R + 72, 0, Math.PI * 2);
    ctx.fill();

    const plateGrad = ctx.createRadialGradient(cx - 50, cy - 50, 20, cx, cy, R + 54);
    plateGrad.addColorStop(0, '#FFFFFF');
    plateGrad.addColorStop(0.7, '#FCF5EC');
    plateGrad.addColorStop(1, '#E6D4C1');
    ctx.fillStyle = plateGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, R + 52, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#DFCBB5';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 托盘金色圆环与 16 颗旋转刻度珠
    ctx.strokeStyle = '#E5C384';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(cx, cy, R + 36, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#E5C384';
    for (let i = 0; i < 16; i++) {
      const a = state.turntableAngle + (i * Math.PI * 2) / 16;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * (R + 44), cy + Math.sin(a) * (R + 44), 2.8, 0, Math.PI * 2);
      ctx.fill();
    }

    // 2. Step 0：俯视正圆海绵蛋糕胚与当前夹心
    if (state.step === 0) {
      const fl = state.spongeFlavor;
      const topGrad = ctx.createRadialGradient(cx - 45, cy - 45, 20, cx, cy, R);
      topGrad.addColorStop(0, fl.top);
      topGrad.addColorStop(0.84, fl.sideTop);
      topGrad.addColorStop(1, fl.crust);
      ctx.fillStyle = topGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fill();

      // 顶面气孔
      ctx.save();
      ctx.clip();
      for (let i = 0; i < 140; i++) {
        const p = SPONGE_PORES[i];
        const a = p.u * Math.PI * 2;
        const dist = Math.sqrt(p.v) * 0.93;
        ctx.fillStyle = p.dark ? fl.crumb : '#FFF5E1';
        ctx.globalAlpha = 0.24;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * R * dist, cy + Math.sin(a) * R * dist, p.r * 1.15, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 当前暴露的夹心层（若有）
      const activeFillIdx = state.layersVisible === 1 ? 0 : (state.layersVisible === 2 ? 1 : -1);
      if (activeFillIdx >= 0) {
        const fObj = state.fillings[activeFillIdx];
        const surfY = getLayerTopY(activeFillIdx);
        fObj.strokes.forEach(st => {
          if (!st.points) return;
          const mappedPts = st.points.map(pt => {
            if (pt.u !== undefined) {
              return { x: cx + pt.u * R, y: cy + pt.v * R };
            }
            return {
              x: cx + ((pt.x - CAKE.cx) / CAKE.rx) * R,
              y: cy + ((pt.y - surfY) / CAKE.ry) * R
            };
          });
          drawRibbedCreamStroke(ctx, { ...st, points: mappedPts, size: (st.size || 24) * 1.25 }, false);
        });
        fObj.chunks.forEach(c => {
          const f = c.fruit || fObj.fruit;
          const fx = c.u !== undefined ? (cx + c.u * R) : (cx + ((c.x - CAKE.cx) / CAKE.rx) * R);
          const fy = c.v !== undefined ? (cy + c.v * R) : (cy + ((c.y - surfY) / CAKE.ry) * R);
          ctx.save();
          ctx.translate(fx, fy);
          ctx.rotate(c.rot);
          ctx.fillStyle = 'rgba(90, 40, 20, 0.22)';
          ctx.beginPath();
          ctx.ellipse(0, 4, 14 * c.s, 10 * c.s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = f.color;
          ctx.beginPath();
          ctx.roundRect(-12 * c.s, -10 * c.s, 24 * c.s, 20 * c.s, 5);
          ctx.fill();
          ctx.fillStyle = f.inner;
          ctx.beginPath();
          ctx.roundRect(-9 * c.s, -7 * c.s, 16 * c.s, 12 * c.s, 3);
          ctx.fill();
          ctx.restore();
        });
      }
      ctx.restore();

      ctx.strokeStyle = fl.crust;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(cx, cy, R - 1, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      return;
    }

    // 3. Step >= 1：俯视正圆奶油顶面缓冲渲染
    const topS = state.topSurface;
    topS.flushDirty();

    // 蛋糕底圈外露小珍珠奶油花边
    for (let i = 0; i < 36; i++) {
      const a = state.turntableAngle + (i * Math.PI * 2) / 36;
      const px = cx + Math.cos(a) * (R + 6);
      const py = cy + Math.sin(a) * (R + 6);
      const pg = ctx.createRadialGradient(px - 2, py - 2, 1, px, py, 9);
      pg.addColorStop(0, '#FFFFFF');
      pg.addColorStop(0.6, baseCol.light);
      pg.addColorStop(1, baseCol.shade);
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(px, py, 8.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // 正圆顶面贴图（1:1 无压扁变形，同步转盘旋转）
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.clip();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(state.turntableAngle);
    ctx.drawImage(topS.canvas, -R, -R, R * 2, R * 2);
    ctx.restore();

    // 柔和顶部体积光影
    const topLight = ctx.createRadialGradient(cx - 65, cy - 65, 16, cx, cy, R);
    topLight.addColorStop(0, 'rgba(255, 255, 255, 0.20)');
    topLight.addColorStop(0.6, 'rgba(255, 255, 255, 0)');
    topLight.addColorStop(1, 'rgba(95, 58, 34, 0.14)');
    ctx.fillStyle = topLight;
    ctx.fillRect(cx - R, cy - R, R * 2, R * 2);

    // 顶面流心酱/巧克力线条（按表面坐标投影至俯视正圆）
    if (state.frostStrokes && state.frostStrokes.length > 0) {
      state.frostStrokes.forEach(st => {
        if (!st.isSauce || !st.points) return;
        const mappedPts = [];
        for (let i = 0; i < st.points.length; i++) {
          const pt = st.points[i];
          const wp = pt.surface ? surfaceToWorld(pt.surface, pt.u, pt.v, 'top') : resolveItemWorldPos(pt, 'top');
          if (wp) mappedPts.push(wp);
        }
        if (mappedPts.length > 0) {
          const mappedShards = (st.shards || []).map(sh => {
            const wp = sh.surface ? surfaceToWorld(sh.surface, sh.u, sh.v, 'top') : resolveItemWorldPos(sh, 'top');
            return wp ? { ...sh, x: wp.x, y: wp.y } : null;
          }).filter(Boolean);
          drawRibbedCreamStroke(ctx, { ...st, points: mappedPts, shards: mappedShards, size: (st.size || 24) * 1.2 }, false);
        }
      });
    }

    ctx.restore();

    // 俯视甘纳许边缘糖衣环
    if (state.dripGlaze && state.dripGlaze.color) {
      ctx.strokeStyle = state.dripGlaze.color;
      ctx.lineWidth = 13;
      ctx.beginPath();
      ctx.arc(cx, cy, R - 4, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = state.dripGlaze.highlight || 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.45;
      ctx.beginPath();
      ctx.arc(cx, cy, R - 6, -Math.PI * 0.75, Math.PI * 0.15);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  // 5.5 绘制欲滴的甘纳许淋面
  function drawGanacheDrip(ctx, cx, ty, rx, ry, glaze) {
    ctx.save();
    // 顶部边缘淋面环与水滴流挂
    ctx.fillStyle = glaze.color;

    // 前半圈水滴（可见的正面弧线 0 ~ PI）
    const numCols = state.drips.length;
    for (let i = 0; i < numCols; i++) {
      const dripLen = state.drips[i];
      if (dripLen <= 2) continue;
      const t = i / (numCols - 1); // 0 ~ 1 对应角度 0.03*PI ~ 0.97*PI
      const angle = (0.02 + t * 0.96) * Math.PI;
      const dx = cx + Math.cos(angle) * rx;
      const dy = ty + Math.sin(angle) * ry;
      const w = 7 + (i % 3) * 1.8;

      // 水滴柱与圆润底部水珠
      ctx.fillStyle = glaze.color;
      ctx.beginPath();
      ctx.moveTo(dx - w, dy - 3);
      ctx.quadraticCurveTo(dx - w * 0.7, dy + dripLen * 0.6, dx - w * 0.85, dy + dripLen);
      ctx.arc(dx, dy + dripLen, w * 0.85, Math.PI, 0, true);
      ctx.quadraticCurveTo(dx + w * 0.7, dy + dripLen * 0.6, dx + w, dy - 3);
      ctx.closePath();
      ctx.fill();

      // 水珠高光
      ctx.fillStyle = glaze.highlight;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.ellipse(dx - w * 0.25, dy + dripLen - 2, 2, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 顶面外圈淋面糖衣边框
    ctx.strokeStyle = glaze.color;
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.ellipse(cx, ty, rx - 3, ry - 2, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = glaze.highlight;
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    ctx.ellipse(cx, ty - 1, rx - 4, ry - 3, 0, 0.1 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  // 5.6 绘制立体3D裱花嘴花型 (八齿曲奇花、法式贝壳、云朵球、五瓣花)
  function drawPipingDollop(ctx, item) {
    const { x, y, nozzleId, color, scale = 1, angle = 0 } = item;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // 接触面柔和阴影
    ctx.fillStyle = 'rgba(85, 50, 25, 0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 5, 16, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    if (nozzleId === 'rosette') {
      // 八齿立体旋转曲奇花：双层棱纹花瓣 + 旋转顶尖
      const petals = 8;
      for (let ring = 0; ring < 2; ring++) {
        const rad = ring === 0 ? 14 : 8.5;
        const yOff = ring === 0 ? 0 : -4;
        for (let i = 0; i < petals; i++) {
          const a = (i * Math.PI * 2) / petals + ring * 0.4;
          const px = Math.cos(a) * (rad * 0.55);
          const py = yOff + Math.sin(a) * (rad * 0.38);

          const g = ctx.createRadialGradient(px - 2, py - 2, 1, px, py, rad * 0.65);
          g.addColorStop(0, color.light);
          g.addColorStop(0.65, color.mid);
          g.addColorStop(1, color.dark);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(px, py, rad * 0.52, 0, Math.PI * 2);
          ctx.fill();

          // 裱花嘴挤压棱线
          ctx.strokeStyle = color.dark;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.arc(px, py, rad * 0.5, a - 0.8, a + 0.8);
          ctx.stroke();
        }
      }
      // 中心奶油尖峰
      const topG = ctx.createRadialGradient(-2, -8, 1, 0, -6, 7);
      topG.addColorStop(0, '#FFFFFF');
      topG.addColorStop(0.6, color.light);
      topG.addColorStop(1, color.mid);
      ctx.fillStyle = topG;
      ctx.beginPath();
      ctx.moveTo(-6, -5);
      ctx.quadraticCurveTo(0, -16, 4, -12);
      ctx.quadraticCurveTo(7, -5, 0, -2);
      ctx.closePath();
      ctx.fill();

    } else if (nozzleId === 'shell') {
      // 法式贝壳纹：带5道立体沟槽的水滴贝壳
      ctx.rotate(angle * 0.25);
      for (let i = 3; i >= 0; i--) {
        const s = 1 - i * 0.18;
        const g = ctx.createLinearGradient(-12, -10, 12, 8);
        g.addColorStop(0, color.light);
        g.addColorStop(0.55, color.mid);
        g.addColorStop(1, color.dark);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(0, -i * 2.2, 14 * s, 10 * s, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      // 贝壳放射棱线
      ctx.strokeStyle = color.dark;
      ctx.lineWidth = 1;
      for (let r = -2; r <= 2; r++) {
        ctx.beginPath();
        ctx.moveTo(r * 2.5, -10);
        ctx.quadraticCurveTo(r * 4.5, 0, r * 1.8, 9);
        ctx.stroke();
      }

    } else if (nozzleId === 'pearl') {
      // 云朵圆润雪顶球
      const g = ctx.createRadialGradient(-5, -8, 2, 0, -2, 16);
      g.addColorStop(0, '#FFFFFF');
      g.addColorStop(0.35, color.light);
      g.addColorStop(0.8, color.mid);
      g.addColorStop(1, color.dark);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-14, 2);
      ctx.bezierCurveTo(-15, -10, -4, -14, 0, -19);
      ctx.bezierCurveTo(5, -13, 15, -10, 14, 2);
      ctx.ellipse(0, 2, 14, 7.5, 0, 0, Math.PI);
      ctx.closePath();
      ctx.fill();

    } else if (nozzleId === 'blossom') {
      // 五瓣奶油花 + 金色糖珠花蕊
      for (let i = 0; i < 5; i++) {
        const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
        const px = Math.cos(a) * 8.5;
        const py = Math.sin(a) * 6.5 - 2;
        const g = ctx.createRadialGradient(px - 1, py - 2, 1, px, py, 8);
        g.addColorStop(0, '#FFFFFF');
        g.addColorStop(0.6, color.light);
        g.addColorStop(1, color.dark);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(px, py, 7, 5.5, a, 0, Math.PI * 2);
        ctx.fill();
      }
      // 金色糖珠花心
      const centerG = ctx.createRadialGradient(-1, -3, 0.5, 0, -2, 4);
      centerG.addColorStop(0, '#FFF8D6');
      centerG.addColorStop(0.5, '#F2B749');
      centerG.addColorStop(1, '#B87E1A');
      ctx.fillStyle = centerG;
      ctx.beginPath();
      ctx.arc(0, -2, 3.8, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  /* ============================================================================
   * 6. 高精度写实水果与高定装饰手绘渲染器 (零Emoji)
   * ============================================================================ */
  function drawDecorationItem(ctx, item, time = 0) {
    const { type, x, y, scale = 1, rot = 0 } = item;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.rotate(rot);

    // 装饰物陷入奶油的柔和底影
    if (type !== 'candle') {
      ctx.fillStyle = 'rgba(75, 35, 20, 0.22)';
      ctx.beginPath();
      ctx.ellipse(2, 7, 20, 10, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    switch (type) {
      case 'straw_whole': {
        // 写实红颜整颗草莓：饱满圆锥心形、凹陷金籽、水润高光、翠绿萼片
        const grad = ctx.createRadialGradient(-7, -8, 3, 0, 0, 26);
        grad.addColorStop(0, '#FF5E6C');
        grad.addColorStop(0.35, '#E31C33');
        grad.addColorStop(0.82, '#9E0B1C');
        grad.addColorStop(1, '#680510');
        ctx.fillStyle = grad;

        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.bezierCurveTo(18, -20, 22, -4, 15, 10);
        ctx.bezierCurveTo(9, 20, 4, 23, 0, 23);
        ctx.bezierCurveTo(-4, 23, -9, 20, -15, 10);
        ctx.bezierCurveTo(-22, -4, -18, -20, 0, -20);
        ctx.closePath();
        ctx.fill();

        // 左侧立体水润高光带
        ctx.fillStyle = 'rgba(255, 255, 255, 0.36)';
        ctx.beginPath();
        ctx.ellipse(-8, -3, 3.5, 11, -0.25, 0, Math.PI * 2);
        ctx.fill();

        // 真实分布的草莓金籽与微凹暗坑
        const seeds = [
          [-9,-9],[-2,-10],[6,-9],
          [-12,-1],[-5,-2],[3,-2],[10,-1],
          [-9,7],[-2,7],[5,7],
          [-4,15],[3,15]
        ];
        seeds.forEach(([sx, sy]) => {
          ctx.fillStyle = '#5E040E';
          ctx.beginPath();
          ctx.ellipse(sx, sy + 0.7, 1.8, 2.3, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#F9D66B';
          ctx.beginPath();
          ctx.ellipse(sx, sy, 1.1, 1.6, 0, 0, Math.PI * 2);
          ctx.fill();
        });

        // 顶部5片鲜绿萼片与果蒂
        ctx.fillStyle = '#4B9B38';
        const leaves = [-1.1, -0.55, 0, 0.55, 1.1];
        leaves.forEach(a => {
          ctx.save();
          ctx.translate(0, -18);
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-5, -5, 0, -11);
          ctx.quadraticCurveTo(5, -5, 0, 0);
          ctx.fill();
          ctx.restore();
        });
        ctx.strokeStyle = '#2E6E1E';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -19);
        ctx.quadraticCurveTo(2, -25, 5, -27);
        ctx.stroke();
        break;
      }

      case 'straw_half': {
        // 鲜切半颗草莓：展现外层红圈、粉白髓心与放射状果肉脉络
        // 底部3D果皮厚度
        ctx.fillStyle = '#9E0D1E';
        ctx.beginPath();
        ctx.moveTo(0, -17);
        ctx.bezierCurveTo(19, -17, 21, 0, 13, 14);
        ctx.bezierCurveTo(6, 23, -6, 23, -13, 14);
        ctx.bezierCurveTo(-21, 0, -19, -17, 0, -17);
        ctx.fill();

        // 切面果肉渐变
        const cutGrad = ctx.createRadialGradient(0, 2, 2, 0, 1, 20);
        cutGrad.addColorStop(0, '#FFF8F8');
        cutGrad.addColorStop(0.35, '#FFD0D6');
        cutGrad.addColorStop(0.72, '#F54B5E');
        cutGrad.addColorStop(1, '#C91629');
        ctx.fillStyle = cutGrad;
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.bezierCurveTo(17, -18, 19, -2, 12, 11);
        ctx.bezierCurveTo(5, 20, -5, 20, -12, 11);
        ctx.bezierCurveTo(-19, -2, -17, -18, 0, -18);
        ctx.fill();

        // 放射状果肉白色维管束脉络
        ctx.strokeStyle = 'rgba(255, 245, 246, 0.75)';
        ctx.lineWidth = 1.3;
        const rays = [[-9,-9],[9,-9],[-11,0],[11,0],[-7,9],[7,9],[0,14]];
        rays.forEach(([rx, ry]) => {
          ctx.beginPath();
          ctx.moveTo(0, 1);
          ctx.quadraticCurveTo(rx * 0.5, ry * 0.3, rx, ry);
          ctx.stroke();
        });

        // 切面水润反光
        ctx.fillStyle = 'rgba(255,255,255,0.38)';
        ctx.beginPath();
        ctx.ellipse(-5, -5, 6, 2.5, -0.4, 0, Math.PI * 2);
        ctx.fill();

        // 顶部翠绿小叶
        ctx.fillStyle = '#56A842';
        [-0.7, 0, 0.7].forEach(a => {
          ctx.save();
          ctx.translate(0, -17);
          ctx.rotate(a);
          ctx.beginPath();
          ctx.ellipse(0, -4, 3.5, 6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
        break;
      }

      case 'blueberry': {
        // 双颗带果粉蓝莓簇 + 鲜薄荷叶衬底
        // 衬底薄荷小叶
        ctx.save();
        ctx.rotate(-0.5);
        const leafG = ctx.createLinearGradient(-18, -10, 5, 10);
        leafG.addColorStop(0, '#72C25B');
        leafG.addColorStop(1, '#367A26');
        ctx.fillStyle = leafG;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-14, -14, -24, -2);
        ctx.quadraticCurveTo(-14, 12, 0, 0);
        ctx.fill();
        ctx.restore();

        // 绘制两颗蓝莓（果粉质感 + 五角星花萼冠）
        const berries = [
          { bx: -7, by: -4, r: 11.5 },
          { bx: 7, by: 3, r: 13 }
        ];
        berries.forEach(b => {
          const bg = ctx.createRadialGradient(b.bx - b.r * 0.35, b.by - b.r * 0.35, 1.5, b.bx, b.by, b.r);
          bg.addColorStop(0, '#9DB4E0'); // 天然白霜果粉高光
          bg.addColorStop(0.35, '#4A5F94');
          bg.addColorStop(0.8, '#232F54');
          bg.addColorStop(1, '#121930');
          ctx.fillStyle = bg;
          ctx.beginPath();
          ctx.arc(b.bx, b.by, b.r, 0, Math.PI * 2);
          ctx.fill();

          // 顶部五角花萼凹冠
          ctx.fillStyle = '#141B33';
          ctx.beginPath();
          ctx.arc(b.bx + 1, b.by - 1, b.r * 0.34, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#7E96C7';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          for (let k = 0; k < 5; k++) {
            const a = (k * Math.PI * 2) / 5;
            const px = b.bx + 1 + Math.cos(a) * (b.r * 0.42);
            const py = b.by - 1 + Math.sin(a) * (b.r * 0.42);
            ctx.moveTo(b.bx + 1, b.by - 1);
            ctx.lineTo(px, py);
          }
          ctx.stroke();
        });
        break;
      }

      case 'fig_slice': {
        // 法式高定甜品常客：鲜切无花果（紫红果皮、奶白内圈、宝石红籽囊）
        // 外皮
        ctx.fillStyle = '#5E2346';
        ctx.beginPath();
        ctx.moveTo(0, -21);
        ctx.bezierCurveTo(15, -14, 20, 3, 13, 14);
        ctx.bezierCurveTo(6, 22, -6, 22, -13, 14);
        ctx.bezierCurveTo(-20, 3, -15, -14, 0, -21);
        ctx.fill();

        // 奶白果肉层
        ctx.fillStyle = '#FDF6E4';
        ctx.beginPath();
        ctx.moveTo(0, -17);
        ctx.bezierCurveTo(12, -11, 16, 3, 10, 12);
        ctx.bezierCurveTo(5, 18, -5, 18, -10, 12);
        ctx.bezierCurveTo(-16, 3, -12, -11, 0, -17);
        ctx.fill();

        // 宝石红果芯
        const coreG = ctx.createRadialGradient(0, 3, 2, 0, 3, 13);
        coreG.addColorStop(0, '#9E1432');
        coreG.addColorStop(0.7, '#E0425B');
        coreG.addColorStop(1, '#F7A1AE');
        ctx.fillStyle = coreG;
        ctx.beginPath();
        ctx.ellipse(0, 3, 10, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        // 细密金色果籽点缀
        ctx.fillStyle = '#FFE49E';
        for (let i = 0; i < 12; i++) {
          const a = (i * Math.PI * 2) / 12;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 6, 3 + Math.sin(a) * 6.5, 0.9, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      }

      case 'mango_wedge': {
        // 晶莹黄桃/甜芒月牙果瓣
        // 3D侧边厚度
        ctx.fillStyle = '#D9730D';
        ctx.beginPath();
        ctx.arc(0, 0, 19, 0.1 * Math.PI, 0.95 * Math.PI);
        ctx.quadraticCurveTo(0, 5, -17, 6);
        ctx.closePath();
        ctx.fill();

        const mg = ctx.createLinearGradient(-15, -10, 15, 15);
        mg.addColorStop(0, '#FFF1A8');
        mg.addColorStop(0.45, '#FFB72B');
        mg.addColorStop(1, '#E87E13');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(0, -3, 18, 0.08 * Math.PI, 0.92 * Math.PI);
        ctx.quadraticCurveTo(0, 0, -17, 1);
        ctx.closePath();
        ctx.fill();

        // 水润高光条
        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, -3, 13, 0.25 * Math.PI, 0.72 * Math.PI);
        ctx.stroke();
        break;
      }

      case 'cherry': {
        // 琉璃感带梗红樱桃
        const cg = ctx.createRadialGradient(-5, -5, 2, 0, 0, 15);
        cg.addColorStop(0, '#FF7582');
        cg.addColorStop(0.3, '#D11528');
        cg.addColorStop(0.8, '#7A0612');
        cg.addColorStop(1, '#470209');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(0, 2, 13.5, 0, Math.PI * 2);
        ctx.fill();

        // 顶部凹窝
        ctx.strokeStyle = '#52030B';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(0, -5, 4, 0.2 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();

        // 晶莹月牙反光
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.beginPath();
        ctx.ellipse(-5, -3, 3.5, 2, -0.5, 0, Math.PI * 2);
        ctx.fill();

        // 修长翠绿果梗
        ctx.strokeStyle = '#5B8C33';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -5);
        ctx.bezierCurveTo(4, -20, 15, -28, 22, -26);
        ctx.stroke();
        break;
      }

      case 'mint_leaf': {
        // 双叶鲜嫩薄荷枝（带锯齿边缘与叶脉）
        const drawLeaf = (angle, len, w) => {
          ctx.save();
          ctx.rotate(angle);
          const lg = ctx.createLinearGradient(0, 0, len, 0);
          lg.addColorStop(0, '#3C852B');
          lg.addColorStop(0.6, '#6AC252');
          lg.addColorStop(1, '#98E37D');
          ctx.fillStyle = lg;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(len * 0.5, -w, len, 0);
          ctx.quadraticCurveTo(len * 0.5, w, 0, 0);
          ctx.fill();

          // 主叶脉与侧叶脉
          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(2, 0);
          ctx.lineTo(len - 3, 0);
          ctx.moveTo(len * 0.35, 0); ctx.lineTo(len * 0.5, -w * 0.45);
          ctx.moveTo(len * 0.45, 0); ctx.lineTo(len * 0.6, w * 0.45);
          ctx.stroke();
          ctx.restore();
        };
        drawLeaf(-0.4, 23, 11);
        drawLeaf(0.45, 19, 9.5);
        break;
      }

      case 'macaron_pink':
      case 'macaron_green': {
        // 法式斜插3D马卡龙（带标志性蕾丝裙边与夹心层）
        const isPink = type === 'macaron_pink';
        const cTop = isPink ? '#FFB8C6' : '#C5E3A6';
        const cMid = isPink ? '#F0869B' : '#9DC478';
        const cDark = isPink ? '#C95F74' : '#759C52';
        const cFill = isPink ? '#FFF5F7' : '#FFFDF2';

        ctx.rotate(-0.2);
        // 下层杏仁饼底壳
        ctx.fillStyle = cDark;
        ctx.beginPath();
        ctx.ellipse(0, 7, 18, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // 奶油甘纳许夹心层
        ctx.fillStyle = cFill;
        ctx.beginPath();
        ctx.ellipse(0, 3.5, 17.5, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // 马卡龙烘烤蕾丝裙边 (Pied)
        ctx.fillStyle = cMid;
        for (let i = -15; i <= 15; i += 3.5) {
          ctx.beginPath();
          ctx.arc(i, 1, 2.4, 0, Math.PI * 2);
          ctx.fill();
        }

        // 上层光滑圆润饼壳
        const mg = ctx.createRadialGradient(-6, -8, 2, 0, -3, 19);
        mg.addColorStop(0, '#FFFFFF');
        mg.addColorStop(0.28, cTop);
        mg.addColorStop(0.85, cMid);
        mg.addColorStop(1, cDark);
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.ellipse(0, -2, 18, 9.5, 0, Math.PI, 0, false);
        ctx.ellipse(0, -1, 18, 7.5, 0, 0, Math.PI, false);
        ctx.closePath();
        ctx.fill();
        break;
      }

      case 'choco_sail': {
        // 金箔黑巧几何风帆插片
        const cg = ctx.createLinearGradient(-15, -24, 15, 16);
        cg.addColorStop(0, '#543020');
        cg.addColorStop(0.5, '#331A0F');
        cg.addColorStop(1, '#1F0E07');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.moveTo(-12, 12);
        ctx.quadraticCurveTo(-16, -12, 2, -26);
        ctx.quadraticCurveTo(18, -8, 12, 12);
        ctx.closePath();
        ctx.fill();

        // 巧克力高光折面线
        ctx.strokeStyle = 'rgba(255, 225, 200, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-11, 11);
        ctx.quadraticCurveTo(-14, -10, 2, -24);
        ctx.stroke();

        // 食用金箔碎点缀
        ctx.fillStyle = '#F7D05E';
        [[0,-14],[4,-8],[-3,-5],[2,-2]].forEach(([gx, gy], idx) => {
          ctx.beginPath();
          ctx.ellipse(gx, gy, 3.2 - idx * 0.5, 1.8, 0.5 * idx, 0, Math.PI * 2);
          ctx.fill();
        });
        break;
      }

      case 'meringue': {
        // 焦糖烤蛋白糖吻
        const mg = ctx.createRadialGradient(-4, -6, 2, 0, 0, 17);
        mg.addColorStop(0, '#FFFFFF');
        mg.addColorStop(0.65, '#FFF3DF');
        mg.addColorStop(1, '#D9A05B'); // 烘烤焦糖边
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.moveTo(-14, 5);
        ctx.bezierCurveTo(-15, -8, -4, -15, 0, -22);
        ctx.bezierCurveTo(4, -15, 15, -8, 14, 5);
        ctx.ellipse(0, 5, 14, 7, 0, 0, Math.PI);
        ctx.closePath();
        ctx.fill();

        // 螺旋烘烤棱线
        ctx.strokeStyle = 'rgba(217, 160, 91, 0.55)';
        ctx.lineWidth = 1.3;
        [-6, 0, 6].forEach(ox => {
          ctx.beginPath();
          ctx.moveTo(0, -20);
          ctx.quadraticCurveTo(ox * 1.4, -5, ox, 11);
          ctx.stroke();
        });
        break;
      }

      case 'candle': {
        // 螺旋马卡龙色生日蜡烛 + 动态摇曳烛火
        // 底部固定奶油座
        ctx.fillStyle = '#FFFDF9';
        ctx.beginPath();
        ctx.ellipse(0, 6, 11, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // 蜡烛柱身
        const cw = 7;
        const ch = 46;
        const cg = ctx.createLinearGradient(-cw, 0, cw, 0);
        cg.addColorStop(0, '#F5E4D0');
        cg.addColorStop(0.4, '#FFFFFF');
        cg.addColorStop(1, '#DFC8B0');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.roundRect(-cw, -ch + 4, cw * 2, ch, 4);
        ctx.fill();

        // 螺旋粉色糖霜条纹
        ctx.save();
        ctx.clip();
        ctx.strokeStyle = '#F28B82';
        ctx.lineWidth = 4.5;
        for (let sy = -ch; sy < 12; sy += 12) {
          ctx.beginPath();
          ctx.moveTo(-cw - 2, sy);
          ctx.lineTo(cw + 2, sy + 8);
          ctx.stroke();
        }
        ctx.restore();

        // 烛芯
        ctx.strokeStyle = '#3A2618';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -ch + 4);
        ctx.quadraticCurveTo(1, -ch - 2, 0, -ch - 5);
        ctx.stroke();

        // 点亮状态下的动态摇曳火焰与暖光晕
        if (state.candlesLit && !state.wishBlown) {
          const sway = Math.sin(time * 0.008 + x) * 2.2;
          const stretch = Math.cos(time * 0.012 + y) * 1.5;

          // 外层暖光晕
          const halo = ctx.createRadialGradient(0, -ch - 14, 2, 0, -ch - 14, 34);
          halo.addColorStop(0, 'rgba(255, 200, 70, 0.55)');
          halo.addColorStop(1, 'rgba(255, 160, 40, 0)');
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(0, -ch - 14, 34, 0, Math.PI * 2);
          ctx.fill();

          // 外焰
          const fg = ctx.createLinearGradient(0, -ch - 26, 0, -ch - 4);
          fg.addColorStop(0, '#FFF6A6');
          fg.addColorStop(0.5, '#FFA824');
          fg.addColorStop(1, '#E84C18');
          ctx.fillStyle = fg;
          ctx.beginPath();
          ctx.moveTo(0, -ch - 5);
          ctx.quadraticCurveTo(-9, -ch - 14, sway, -ch - 26 - stretch);
          ctx.quadraticCurveTo(9, -ch - 14, 0, -ch - 5);
          ctx.closePath();
          ctx.fill();

          // 内焰亮芯
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.ellipse(sway * 0.3, -ch - 10, 2.2, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      }
    }

    // 如果当前装饰物被选中，绘制温暖的虚线调节框
    if (state.step === 3 && item.uid === state.selectedDecorUid) {
      ctx.strokeStyle = '#E86A53';
      ctx.lineWidth = 1.8;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  // 6.2 绘制散落的珍珠糖、食用金箔与彩糖针（支持 2.5D 与俯视双视角投影）
  function drawSprinkles(ctx, viewMode = state.camera.viewMode) {
    const scaleBoost = viewMode === 'top' ? 1.2 : 1.0;
    state.sprinkles.forEach(sp => {
      const wp = resolveItemWorldPos(sp, viewMode);
      if (!wp) return;
      const sz = sp.size * scaleBoost;
      ctx.save();
      ctx.translate(wp.x, wp.y);
      ctx.rotate(sp.angle);
      if (sp.type === 'sprinkle_pearl') {
        const g = ctx.createRadialGradient(-1.5, -1.5, 0.5, 0, 0, sz);
        g.addColorStop(0, '#FFFFFF');
        g.addColorStop(0.6, '#FFF5EA');
