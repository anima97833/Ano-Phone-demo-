        function paintArtisanGlazeSurface(buf, primaryHex, secondaryHex, style, baseHeight, isTop) {
          if (!secondaryHex || style === 'solid') {
            buf.fillBaseColor(primaryHex, baseHeight);
            return;
          }
          const c1 = hexToRgb(primaryHex);
          const c2 = hexToRgb(secondaryHex);
          const r1 = srgbToLin(c1.r), g1 = srgbToLin(c1.g), b1 = srgbToLin(c1.b);
          const r2 = srgbToLin(c2.r), g2 = srgbToLin(c2.g), b2 = srgbToLin(c2.b);
          const w = buf.width, h = buf.height;
          const albedo = buf.albedo, hm = buf.heightMap;
          for (let y = 0; y < h; y++) {
            const ny = y / Math.max(1, h - 1);
            for (let x = 0; x < w; x++) {
              const nx = x / Math.max(1, w - 1);
              let t = 0;
              if (style === 'marble') {
                const w1 = Math.sin(nx * Math.PI * 4 + Math.sin(ny * Math.PI * 3) * 1.5) * 0.5 + 0.5;
                const w2 = Math.cos((nx * 2.4 - ny * 2.6) * Math.PI) * 0.5 + 0.5;
                t = Math.max(0, Math.min(1, (w1 * 0.6 + w2 * 0.4) * 0.74));
              } else {
                if (isTop) {
                  const dx = (nx - 0.5) * 2, dy = (ny - 0.5) * 2;
                  t = Math.pow(Math.min(1, Math.hypot(dx, dy)), 1.4) * 0.72;
                } else {
                  const wave = Math.sin(nx * Math.PI * 4) * 0.04;
                  t = Math.max(0, Math.min(1, (ny + wave - 0.14) * 1.05));
                }
              }
              const idx = y * w + x, i4 = idx * 4;
              albedo[i4] = r1 + (r2 - r1) * t;
              albedo[i4 + 1] = g1 + (g2 - g1) * t;
              albedo[i4 + 2] = b1 + (b2 - b1) * t;
              albedo[i4 + 3] = 1.0;
              hm[idx] = baseHeight + (style === 'marble' ? (t - 0.35) * 0.06 : 0);
            }
          }
          buf.rebuildRegion(0, 0, w - 1, h - 1);
          buf.dirty = null;
        }

        function buildCakeVisualSnapshot() {
          const app = getPorcelainAppraisal();
          const dgName = (state.dripGlaze && state.dripGlaze.name) || '无厚积流釉';
          const skNote = state.vesselSketchTitle ? `，器腹手绘「${state.vesselSketchTitle}」` : '';
          const spNote = state.sprinkles && state.sprinkles.length > 0 ? `，窑变撒料 ${state.sprinkles.length} 粒` : '';
          const fullText = [
            `1. 器型与素胎：${state.vessel.name}（${state.spongeFlavor.name}）`,
            `2. 施釉与窑变：主釉色 ${state.frostingColor.name}，${dgName}${skNote}，成品鉴定「${app.title}」`,
            `3. 暗刻与纹饰：共暗刻 ${state.pipings.length} 处，贴花彩绘 ${state.decorations.length} 处${spNote}`,
            `4. 底款与题跋：底款「${state.card.plaqueText || '奉华清赏'}」，题跋「${state.card.body || ''}」` + (state.card.sketchTitle ? `，花押「${state.card.sketchTitle}」` : ''),
            `5. 窑火状态：${app.kilnName}（${state.isFired ? '已出窑成瓷' : '待入窑'}）`
          ].join('\n');
          return { cakeName: app.title, cakeDesc: `${state.spongeFlavor.name}${app.title}，${app.subtitle}`, plaqueText: state.card.plaqueText || '奉华清赏', visualSnapshotText: fullText };
        }

        function applyCharacterStepToCanvas(stepIdx, act) {
          if (!act || typeof act !== 'object') return;
          if (stepIdx === 0) {
            state.vessel = HAN_VESSELS.find(x => x.id === act.vesselId) || state.vessel;
            state.spongeFlavor = SPONGE_FLAVORS.find(x => x.id === act.spongeId) || state.spongeFlavor;
            state.topSurface.fillBaseColor(state.spongeFlavor.sideTop, 0.18);
            state.sideSurface.fillBaseColor(state.spongeFlavor.sideTop, 0.18);
          } else if (stepIdx === 1) {
            const col = FROSTING_COLORS.find(x => x.id === act.frostingColorId) || FROSTING_COLORS[0];
            const sec = (act.secondaryFrostingColorId && act.secondaryFrostingColorId !== 'none')
              ? FROSTING_COLORS.find(x => x.id === act.secondaryFrostingColorId) : null;
            const gStyle = sec ? (act.glazeStyle || 'ombre') : 'solid';
            state.frostingColor = col;
            state.glazeUsageCounts[col.id] = 10;
            if (sec) state.glazeUsageCounts[sec.id] = 6;
            paintArtisanGlazeSurface(state.topSurface, col.mid, sec ? sec.mid : null, gStyle, 0.62, true);
            paintArtisanGlazeSurface(state.sideSurface, col.mid, sec ? sec.mid : null, gStyle, 0.62, false);
            if (sec) {
              for (let i = 0; i < 16; i++) {
                const hit = { surface: 'side', buf: state.sideSurface, px: (i / 16) * state.sideSurface.width, py: (0.28 + Math.sin(i * 1.1) * 0.14) * state.sideSurface.height };
                stampCreamBrush(hit, 34, sec, 1, 0, 1.3);
              }
            }
            const dg = DRIP_GLAZES.find(x => x.id === act.dripGlazeId) || DRIP_GLAZES[0];
            state.dripGlaze = dg;
            state.drips = new Array(32).fill(0).map((_, i) => dg.id === 'none' ? 0 : (16 + Math.round(Math.sin(i * 1.2) * 9 + ((i * 17) % 16))));
            if (act.vesselSketchSvg) {
              state.vesselSketchTitle = act.vesselSketchTitle || '器腹青花小画';
              loadSvgToImage(act.vesselSketchSvg, img => { state.vesselSketchImg = img; });
            } else {
              state.vesselSketchImg = null;
              state.vesselSketchTitle = '';
            }
            state.roughCoverage = 1;
          } else if (stepIdx === 2) {
            const nz = PIPING_NOZZLES.find(x => x.id === act.pipingNozzleId) || PIPING_NOZZLES[0];
            const pc = PIPING_COLORS.find(x => x.id === act.pipingColorId) || PIPING_COLORS[0];
            const spc = (act.secondaryPipingColorId && act.secondaryPipingColorId !== 'none')
              ? (PIPING_COLORS.find(x => x.id === act.secondaryPipingColorId) || pc) : pc;
            const pat = act.pipingPattern || 'double_band';
            const pushBand = (v, count, nozzleId, colorObj, sc) => {
              for (let i = 0; i < count; i++) {
                const u = i / count;
                const wp = surfaceToWorld('side', u, v, 'iso');
                state.pipings.push({ x: wp ? wp.x : CAKE.cx, y: wp ? wp.y : CAKE.baseY - 40, surface: 'side', u, v, nozzleId, color: i % 2 === 0 ? colorObj : spc, scale: sc, angle: 0 });
              }
            };
            if (pat === 'double_band') {
              pushBand(0.28, 12, nz.id, pc, 0.78);
              pushBand(0.80, 14, nz.id === 'blossom' ? 'shell' : nz.id, spc, 0.86);
            } else if (pat === 'shoulder') {
              pushBand(0.28, 12, nz.id, pc, 0.84);
            } else if (pat === 'minimal') {
              pushBand(0.76, 8, nz.id, pc, 0.82);
            } else {
              pushBand(0.78, 12, nz.id, pc, 0.88);
            }
          } else if (stepIdx === 3) {
            const list = Array.isArray(act.decorList) && act.decorList.length > 0
              ? act.decorList : ['straw_whole', 'straw_half', 'macaron_pink', 'cherry', 'mint_leaf', 'fig_slice'];
            const total = Math.min(12, list.length);
            const hasBellySketch = Boolean(state.vesselSketchImg || state.vesselSketchTitle);
            list.slice(0, total).forEach((dId, i) => {
              const valid = DECOR_ITEMS.find(x => x.id === dId) || DECOR_ITEMS[0];
              let u = (i / Math.max(1, total) + 0.04) % 1;
              if (hasBellySketch && Math.abs(u - 0.25) < 0.07) u = (u + 0.09) % 1;
              const v = 0.40 + (i % 3) * 0.13;
              const wp = surfaceToWorld('side', u, v, 'iso');
              state.decorations.push({ uid: Date.now() + i * 19, type: valid.id, x: wp ? wp.x : CAKE.cx, y: wp ? wp.y : 360, surface: 'side', u, v, scale: 0.86 + (i % 3) * 0.06, rot: (i % 2 === 0 ? -0.1 : 0.1) });
            });
            const spTypes = Array.isArray(act.sprinkleTypes) && act.sprinkleTypes.length > 0
              ? act.sprinkleTypes.filter(t => t === 'sprinkle_pearl' || t === 'sprinkle_gold' || t === 'sprinkle_sugar') : [];
            const densMap = { none: 0, light: 18, medium: 32, rich: 46 };
            const spCount = densMap[act.sprinkleDensity] !== undefined ? densMap[act.sprinkleDensity] : (spTypes.length > 0 ? 30 : 0);
            const ashColors = ['#B89352', '#8C6D3B', '#D4B272', '#5E4828'];
            const goldColors = ['#F9D968', '#E5B83B', '#FFF0A8'];
            for (let k = 0; k < spCount && spTypes.length > 0; k++) {
              const t = spTypes[k % spTypes.length];
              const u = (k * 0.6180339) % 1;
              const v = 0.20 + ((k * 0.37) % 1) * 0.66;
              const wp = surfaceToWorld('side', u, v, 'iso');
              state.sprinkles.push({
                type: t,
                x: wp ? wp.x : CAKE.cx,
                y: wp ? wp.y : 360,
                surface: 'side',
                u,
                v,
                size: t === 'sprinkle_pearl' ? (3.0 + (k % 3) * 0.7) : (3.6 + (k % 3) * 0.8),
                angle: (k * 1.4) % (Math.PI * 2),
                color: t === 'sprinkle_gold' ? goldColors[k % goldColors.length] : ashColors[k % ashColors.length]
              });
            }
          } else if (stepIdx === 4) {
            state.card.theme = Math.max(0, Math.min(3, Number(act.cardTheme) || 0));
            state.card.to = String(act.cardTo || `致：${coop.userName}`).slice(0, 18);
            state.card.body = String(act.cardBody || '雨过天青云破处，这般颜色做将来。').slice(0, 60);
            state.card.plaqueText = String(act.plaqueText || '奉华清赏').slice(0, 10);
            state.card.sketchTitle = String(act.cardSketchTitle || '').slice(0, 12);
            state.card.hasPlaque = true;
            drawFallbackPorcelainSignature(getSelectedCharName());
            if (act.cardSketchSvg) {
              loadSvgToImage(act.cardSketchSvg, img => {
                const iw = img.naturalWidth || img.width || 320;
                const ih = img.naturalHeight || img.height || 80;
                if (iw <= 0 || ih <= 0) return;
                sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
                const pad = 4, ratio = Math.min((sigCanvas.width - pad * 2) / iw, (sigCanvas.height - pad * 2) / ih);
                const dw = iw * ratio, dh = ih * ratio;
                sigCtx.drawImage(img, (sigCanvas.width - dw) * 0.5, (sigCanvas.height - dh) * 0.5, dw, dh);
              }, () => drawFallbackPorcelainSignature(getSelectedCharName()));
            }
          } else if (stepIdx === 5) {
            if (act.kilnType && KILN_FIRES.some(k => k.id === act.kilnType)) {
              state.kilnType = act.kilnType;
            }
            executeKilnTransmutation(state.kilnType);
            state.kilnPhase = 'fired';
          }
          sfx.playChime();
          updateUI();
        }

        function isCharTurnInRelay(stepIdx) {
          if (coop.mode !== 'relay_coop' || stepIdx >= 5) return false;
          return coop.userFirst ? (stepIdx % 2 === 1) : (stepIdx % 2 === 0);
        }

        function syncCoopBarUI() {
          const m = coop.mode;
          swapBtnEl.style.display = m === 'relay_coop' ? 'inline-block' : 'none';
          swapBtnEl.textContent = coop.userFirst ? '我先手' : 'TA先手';
          if (m === 'char_make_user_eat') {
            actionBtnEl.style.display = 'inline-block';
            actionBtnEl.textContent = coop.busy ? '制瓷中…' : '请TA制瓷';
          } else if (m === 'relay_coop' && isCharTurnInRelay(state.step)) {
            actionBtnEl.style.display = 'inline-block';
            actionBtnEl.textContent = coop.busy ? 'TA施釉中…' : '让TA做这步';
          } else {
            actionBtnEl.style.display = 'none';
          }
          posterTasteRowEl.style.display = m === 'char_make_user_eat' ? 'none' : 'flex';
          posterUserFeedbackRowEl.style.display = m === 'char_make_user_eat' ? 'flex' : 'none';
          askCharTasteBtnEl.textContent = `请「${getSelectedCharName()}」赏器品鉴`;
        }

        async function runCharacterRelayStep(stepIdx) {
          if (coop.busy || !coop.selectedCharId) return;
          coop.busy = true; syncCoopBarUI();
          showBubble(getSelectedCharName(), '调配矿物釉中', '正在端详素胎弧度，准备落笔接力这一步…', false);
          try {
            const snap = buildCakeVisualSnapshot();
            const res = await sendHostRpc('WORKSHOP_CAKE_STEP_RELAY_REQUEST', 'WORKSHOP_CAKE_STEP_RELAY_RESPONSE', {
              charId: coop.selectedCharId,
              stepIndex: stepIdx,
              visualSnapshotText: snap.visualSnapshotText,
              cakeSummary: snap.cakeDesc,
              imageDataUrl: captureSmallPorcelainSnapshot(),
              relayHistory: coop.relayHistory
            });
            applyCharacterStepToCanvas(stepIdx, res.stepAction);
            coop.relayHistory.push(`第${stepIdx + 1}步(${res.charName})：${res.spokenLine}`);
            recordMakingNote(stepIdx, res.charName, res.stepAction, res.spokenLine);
            showBubble(res.charName, res.moodTag || '接力完成', res.spokenLine, false);
          } catch (err) { showBubble(getSelectedCharName(), '网络波动', `接力失败：${err.message || err}`, false); }
          coop.busy = false; syncCoopBarUI();
        }

        async function runCharacterFullMake() {
          if (coop.busy || !coop.selectedCharId) return;
          coop.busy = true;
          coop.lastReview = null;
          coop.makingNotes = [];
          coop.fullMakeSession = null;
          renderPosterNotesView();
          syncCoopBarUI();
          state = createInitialState();
          sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
          updateUI();
          showBubble(getSelectedCharName(), '选器调釉中', '正在挑选器型与矿物釉料，准备亲手为你烧制一件名瓷…', false);
          try {
            const res = await sendHostRpc('WORKSHOP_CAKE_FULL_MAKE_REQUEST', 'WORKSHOP_CAKE_FULL_MAKE_RESPONSE', { charId: coop.selectedCharId });
            const plan = res.plan || {}, stepLines = res.stepLines || [];
            const stepActions = [
              { vesselId: plan.vesselId, spongeId: plan.spongeId },
              { frostingColorId: plan.frostingColorId, secondaryFrostingColorId: plan.secondaryFrostingColorId, glazeStyle: plan.glazeStyle, dripGlazeId: plan.dripGlazeId, vesselSketchTitle: plan.vesselSketchTitle, vesselSketchSvg: plan.vesselSketchSvg },
              { pipingNozzleId: plan.pipingNozzleId, pipingColorId: plan.pipingColorId, secondaryPipingColorId: plan.secondaryPipingColorId, pipingPattern: plan.pipingPattern },
              { decorList: plan.decorList, sprinkleTypes: plan.sprinkleTypes, sprinkleDensity: plan.sprinkleDensity },
              { cardTheme: plan.cardTheme, cardTo: plan.cardTo, cardBody: plan.cardBody, plaqueText: plan.plaqueText, cardSketchTitle: plan.cardSketchTitle, cardSketchSvg: plan.cardSketchSvg },
              { kilnType: plan.kilnType }
            ];
            coop.fullMakeSession = { charName: res.charName, stepActions, stepLines, introNote: res.introNote || '刚出窑，快看看这抹窑变釉色。', currentStep: 0 };
            state.step = 0;
            applyCharacterStepToCanvas(0, stepActions[0]);
            recordMakingNote(0, res.charName, stepActions[0], stepLines[0] || '先选一件合心意的素胎器型。');
            showBubble(res.charName, '第 1/6 步', stepLines[0] || '先选一件合心意的素胎器型。', true, '看下一步 (2/6)');
          } catch (err) { showBubble(getSelectedCharName(), '制作中断', `生成失败：${err.message || err}`, false); }
          coop.busy = false; syncCoopBarUI();
        }

        nextStepBtnEl.onclick = () => {
          const sess = coop.fullMakeSession;
          if (!sess) return;
          if (sess.currentStep < 5) {
            sess.currentStep++;
            state.step = sess.currentStep;
            applyCharacterStepToCanvas(sess.currentStep, sess.stepActions[sess.currentStep]);
            recordMakingNote(sess.currentStep, sess.charName, sess.stepActions[sess.currentStep], sess.stepLines[sess.currentStep] || sess.introNote);
            showBubble(sess.charName, sess.currentStep < 5 ? `第 ${sess.currentStep + 1}/6 步` : '开窑呈器', sess.stepLines[sess.currentStep] || sess.introNote, true, sess.currentStep < 5 ? `看下一步 (${sess.currentStep + 2}/6)` : '查看珍藏图录');
          } else {
            generateAndShowPoster();
            setPosterViewTab('img');
            posterReviewBoxEl.style.display = 'block';
            posterReviewBoxEl.innerHTML = `<div style="font-weight:800;color:#425D4F;margin-bottom:4px;">${sess.charName} 开窑奉器：</div><div>「${sess.introNote || '刚出窑，快看看这抹窑变釉色。'}」</div>`;
            syncCoopBarUI();
          }
        };
        skipAnimBtnEl.onclick = () => {
          const sess = coop.fullMakeSession;
          if (!sess) return;
          for (let s = sess.currentStep + 1; s < 6; s++) {
            state.step = s;
            applyCharacterStepToCanvas(s, sess.stepActions[s]);
            recordMakingNote(s, sess.charName, sess.stepActions[s], sess.stepLines[s] || sess.introNote);
          }
          sess.currentStep = 5;
          showBubble(sess.charName, '开窑呈器', sess.introNote || '刚出窑，快看看这抹窑变釉色。', true, '查看珍藏图录');
        };

        async function saveCurrentToHistory(posterDataUrl) {
          try {
            const snap = buildCakeVisualSnapshot();
            const id = coop.currentHistoryId || (`porcelain_hist_${Date.now()}`);
            coop.currentHistoryId = id;
            await sendHostRpc('WORKSHOP_CAKE_SAVE_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', {
              id,
              cakeName: snap.cakeName,
              cakeDesc: snap.cakeDesc,
              plaqueText: snap.plaqueText,
              mode: coop.mode,
              charId: coop.selectedCharId,
              charName: getSelectedCharName(),
              posterDataUrl: posterDataUrl || posterImgEl.src,
              makingNotes: coop.makingNotes,
              review: coop.lastReview
            });
          } catch (_) {}
        }

        window.__hanCakeOnPosterReady = (dataUrl) => {
          coop.currentHistoryId = `porcelain_hist_${Date.now()}`;
          renderPosterNotesView();
          syncCoopBarUI();
          saveCurrentToHistory(dataUrl);
        };

        window.__hanCakeOnStepChanged = (targetStep) => {
          syncCoopBarUI();
          if (coop.mode === 'relay_coop' && isCharTurnInRelay(targetStep)) {
            runCharacterRelayStep(targetStep);
          }
        };

        document.getElementById('backToWorkshopBtn').onclick = () => window.parent.postMessage({ type: 'WORKSHOP_CAKE_CLOSE' }, '*');
        charSelectEl.onchange = () => { coop.selectedCharId = charSelectEl.value; forwardCharSelectEl.value = coop.selectedCharId; syncCoopBarUI(); };
        modeSelectEl.onchange = () => {
          coop.mode = modeSelectEl.value;
          coop.relayHistory = [];
          hideBubble();
          syncCoopBarUI();
          if (coop.mode === 'relay_coop' && isCharTurnInRelay(state.step)) runCharacterRelayStep(state.step);
        };
        swapBtnEl.onclick = () => {
          coop.userFirst = !coop.userFirst;
          syncCoopBarUI();
          if (coop.mode === 'relay_coop' && isCharTurnInRelay(state.step)) runCharacterRelayStep(state.step);
        };
        actionBtnEl.onclick = () => { if (coop.mode === 'char_make_user_eat') runCharacterFullMake(); else runCharacterRelayStep(state.step); };

        askCharTasteBtnEl.onclick = async () => {
          if (coop.busy || !coop.selectedCharId) return;
          coop.busy = true; askCharTasteBtnEl.textContent = '名士赏器中…';
          try {
            const snap = buildCakeVisualSnapshot();
            const res = await sendHostRpc('WORKSHOP_CAKE_TASTE_REQUEST', 'WORKSHOP_CAKE_TASTE_RESPONSE', {
              charId: coop.selectedCharId,
              mode: coop.mode,
              visualSnapshotText: snap.visualSnapshotText,
              cakeSummary: snap.cakeDesc,
              imageDataUrl: captureSmallPorcelainSnapshot()
            });
            coop.lastReview = res;
            posterReviewBoxEl.style.display = 'block';
            posterReviewBoxEl.innerHTML = `<div style="font-weight:800;color:#425D4F;margin-bottom:4px;">${res.charName} 的赏器评语（${res.reactionTag}）</div><div>${res.comment}</div><div style="font-weight:700;margin-top:4px;">${res.dialogue}</div>`;
            saveCurrentToHistory(posterImgEl.src);
          } catch (err) { showToast(`品鉴失败：${err.message || err}`); }
          coop.busy = false; syncCoopBarUI();
        };

        sendUserFeedbackBtnEl.onclick = async () => {
          const fb = userFeedbackInputEl.value.trim();
          if (!fb || coop.busy || !coop.selectedCharId) return;
          coop.busy = true;
          sendUserFeedbackBtnEl.textContent = '回应中…';
          try {
            const snap = buildCakeVisualSnapshot();
            const res = await sendHostRpc('WORKSHOP_CAKE_FEEDBACK_REQUEST', 'WORKSHOP_CAKE_FEEDBACK_RESPONSE', {
              charId: coop.selectedCharId,
              userFeedback: fb,
              visualSnapshotText: snap.visualSnapshotText,
              cakeSummary: snap.cakeDesc
            });
            coop.lastReview = res;
            posterReviewBoxEl.style.display = 'block';
            posterReviewBoxEl.innerHTML = `<div style="font-weight:800;color:#425D4F;margin-bottom:4px;">${res.charName} 的回响（${res.reactionTag}）</div><div>${res.comment}</div><div style="font-weight:700;margin-top:4px;">${res.dialogue}</div>`;
            userFeedbackInputEl.value = '';
            saveCurrentToHistory(posterImgEl.src);
          } catch (err) { showToast(`回应失败：${err.message || err}`); }
          coop.busy = false;
          sendUserFeedbackBtnEl.textContent = '发给TA';
        };

        saveBackpackBtnEl.onclick = async () => {
          const snap = buildCakeVisualSnapshot();
          try {
            const res = await sendHostRpc('WORKSHOP_CAKE_SAVE_BACKPACK', 'WORKSHOP_CAKE_ACTION_RESULT', { cakeName: snap.cakeName, cakeDesc: snap.cakeDesc, posterDataUrl: posterImgEl.src });
            showToast((res && res.message) || '已收入行囊');
          } catch (err) { showToast(`收入失败：${err.message || err}`); }
        };

        openForwardModalBtnEl.onclick = () => {
          if (coop.selectedCharId) forwardCharSelectEl.value = coop.selectedCharId;
          forwardModalEl.classList.add('show');
        };
        document.getElementById('closeForwardModalBtn').onclick = () => forwardModalEl.classList.remove('show');
        confirmForwardBtnEl.onclick = async () => {
          const targetId = forwardCharSelectEl.value;
          const targetObj = coop.characters.find(c => String(c.id) === String(targetId));
          const snap = buildCakeVisualSnapshot();
          confirmForwardBtnEl.textContent = '赠予中…';
          try {
            const res = await sendHostRpc('WORKSHOP_CAKE_SEND_CHAT', 'WORKSHOP_CAKE_ACTION_RESULT', {
              charId: targetId, charName: targetObj ? targetObj.name : '', cakeName: snap.cakeName, cakeDesc: snap.cakeDesc, plaqueText: snap.plaqueText, forwardNote: forwardNoteInputEl.value.trim(), posterDataUrl: posterImgEl.src
            });
            forwardModalEl.classList.remove('show');
            forwardNoteInputEl.value = '';
            showToast((res && res.message) || '已赠予好友');
          } catch (err) { showToast(`赠予失败：${err.message || err}`); }
          confirmForwardBtnEl.textContent = '确认赠予好友';
        };

        async function openHistoryModal() {
          historyModalEl.classList.add('show');
          historyListEl.innerHTML = '<div style="text-align:center;color:#6E685F;padding:18px;font-size:12.5px;">正在翻阅寻窑珍藏图录…</div>';
          try {
            const list = await sendHostRpc('WORKSHOP_CAKE_LIST_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', {});
            if (!Array.isArray(list) || list.length === 0) {
              historyListEl.innerHTML = '<div style="text-align:center;color:#6E685F;padding:22px;font-size:12.5px;">尚无出窑瓷器记录，快与名士共烧一窑吧！</div>';
              return;
            }
            const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            historyListEl.innerHTML = list.map(item => {
              const dt = new Date(item.createdAt || Date.now());
              const dStr = `${dt.getMonth() + 1}/${dt.getDate()} ${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
              return `<div class="history-card">` +
                (item.posterDataUrl ? `<img class="history-thumb" src="${item.posterDataUrl}" alt="瓷器图录">` : '') +
                `<div style="flex:1;min-width:0;">` +
                  `<div style="font-size:13px;font-weight:800;color:#26231F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(item.cakeName)}</div>` +
                  `<div style="font-size:11px;color:#6E685F;margin:2px 0;">${esc(dStr)}${item.charName ? ' · 同行：' + esc(item.charName) : ''}</div>` +
                  `<div style="font-size:11px;color:#555049;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(item.cakeDesc)}</div>` +
                `</div>` +
                `<button type="button" class="sel-btn danger" data-del-id="${esc(item.id)}" style="flex-shrink:0;">删</button>` +
              `</div>`;
            }).join('');
            historyListEl.querySelectorAll('[data-del-id]').forEach(btn => {
              btn.onclick = async () => {
                await sendHostRpc('WORKSHOP_CAKE_DELETE_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', { id: btn.dataset.delId });
                openHistoryModal();
              };
            });
          } catch (err) {
            historyListEl.innerHTML = `<div style="text-align:center;color:#A84A44;padding:18px;font-size:12px;">读取图录失败：${err.message || err}</div>`;
          }
        }

        document.getElementById('openHistoryBtn').onclick = openHistoryModal;
        document.getElementById('closeHistoryModalBtn').onclick = () => historyModalEl.classList.remove('show');

        window.parent.postMessage({ type: 'WORKSHOP_CAKE_REQUEST_SYNC', payload: { edition: EDITION } }, '*');
      }

      // 启动古法瓷器工坊
      initSignaturePad();
      bindEvents();
      initHanCoCreationBridge();
      updateUI();
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>

</html>
