        ctx.fillStyle = fireG;
        ctx.fillRect(cx - 65, ky - 85, 130, 110);

        // 窑膛中央隐约可见正在高温烧制泛红的器物剪影
        ctx.fillStyle = `rgba(255, 180, 90, ${0.28 * fireIntensity})`;
        ctx.beginPath();
        ctx.ellipse(cx, ky - 28, 18, 28, 0, 0, Math.PI * 2);
        ctx.fill();

        // 底部通红炭火床与跳动火苗
        for (let i = 0; i < 14; i++) {
          const ex = cx - 46 + i * 7;
          const ey = ky + 2 + Math.sin(i * 1.7 + time * 0.01) * 3;
          ctx.fillStyle = i % 2 === 0 ? '#FF6B1A' : '#FFD05B';
          ctx.beginPath();
          ctx.arc(ex, ey, 4.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        ctx.fillStyle = '#9E9689';
        ctx.font = '14px "Songti SC", serif';
        ctx.textAlign = 'right';
        ctx.fillText(isFiring ? '窑 中 烧 制 · 点击窑火可鼓风添柴' : '待 选 窑 火', cx + 185, ky + 65);
        ctx.restore();
      }

      // 像素级真·窑变物理变换（重力流釉泪痕 + 氧化焰清亮 / 还原焰紫翠窑变 / 柴烧松灰落釉 + 冰裂纹生成）
      function executeKilnTransmutation(kilnType) {
        const applyToBuffer = (buf, isSide) => {
          const w = buf.width, h = buf.height;
          const albedo = buf.albedo, hm = buf.heightMap;

          // 1. 高温重力流釉（厚釉区向下垂流平流）
          const loops = kilnType === 'reducing' ? 5 : (kilnType === 'wood_ash' ? 6 : 3);
          if (isSide) {
            for (let pass = 0; pass < loops; pass++) {
              for (let y = h - 2; y >= 1; y--) {
                const row = y * w, rowUp = (y - 1) * w;
                for (let x = 0; x < w; x++) {
                  const idx = row + x, upIdx = rowUp + x;
                  const upT = hm[upIdx];
                  const wave = 0.5 + 0.5 * Math.sin((x / w) * Math.PI * 16 + pass);
                  const thresh = 0.36 + wave * 0.12;
                  if (upT > thresh) {
                    const u4 = upIdx * 4, i4 = idx * 4;
                    albedo[i4] += (albedo[u4] - albedo[i4]) * 0.32;
                    albedo[i4 + 1] += (albedo[u4 + 1] - albedo[i4 + 1]) * 0.32;
                    albedo[i4 + 2] += (albedo[u4 + 2] - albedo[i4 + 2]) * 0.32;
                    hm[idx] = Math.min(1.0, hm[idx] + (upT - thresh) * 0.22);
                  }
                }
              }
            }
          }

          // 2. 三大窑火化学显色
          const ashR = srgbToLin(196), ashG = srgbToLin(156), ashB = srgbToLin(86);
          for (let y = 0; y < h; y++) {
            const v = y / h, row = y * w;
            for (let x = 0; x < w; x++) {
              const u = x / w, idx = row + x, i4 = idx * 4;
              if (kilnType === 'oxidizing') {
                albedo[i4] = Math.min(1, albedo[i4] * 1.03);
                albedo[i4 + 1] = Math.min(1, albedo[i4 + 1] * 1.07);
                albedo[i4 + 2] = Math.min(1, albedo[i4 + 2] * 1.05);
              } else if (kilnType === 'reducing') {
                if (albedo[i4] > albedo[i4 + 1] * 1.05) {
                  albedo[i4] = Math.min(1, albedo[i4] * 1.15);
                  albedo[i4 + 1] *= 0.88;
                  albedo[i4 + 2] = Math.min(1, albedo[i4 + 2] * 1.10);
                } else {
                  albedo[i4] *= 0.94;
                  albedo[i4 + 2] = Math.min(1, albedo[i4 + 2] * 1.08);
                }
              } else if (kilnType === 'wood_ash') {
                const shoulderMask = isSide ? Math.max(0, 1 - Math.abs(v - 0.32) * 2.4) : 0.45;
                const windMask = 0.5 + 0.5 * Math.cos((u - 0.35) * Math.PI * 2);
                const noise = 0.5 + 0.5 * Math.sin(u * 38 + Math.cos(v * 24) * 3);
                const wAsh = shoulderMask * windMask * noise * 0.48;
                albedo[i4] += (ashR - albedo[i4]) * wAsh;
                albedo[i4 + 1] += (ashG - albedo[i4 + 1]) * wAsh;
                albedo[i4 + 2] += (ashB - albedo[i4 + 2]) * wAsh;
              }
            }
          }
          buf.rebuildRegion(0, 0, w - 1, h - 1);
          buf.dirty = null;
        };

        applyToBuffer(state.sideSurface, true);
        applyToBuffer(state.topSurface, false);

        // 3. 生成器身开窑冰裂开片网络 (Crackle Network)
        const vessel = state.vessel || HAN_VESSELS[0];
        const topY = vessel.topY, botY = vessel.botY, totalH = botY - topY;
        state.crackleLines = [];
        for (let i = 0; i < 22; i++) {
          const v1 = 0.14 + Math.random() * 0.72;
          const rx1 = getVesselRadiusAtV(vessel, v1) * 0.75;
          const x1 = CAKE.cx + (Math.random() - 0.5) * rx1 * 1.6;
          const y1 = topY + v1 * totalH;
          const ang = Math.random() * Math.PI * 2;
          const len = 24 + Math.random() * 38;
          const x2 = x1 + Math.cos(ang) * len;
          const y2 = y1 + Math.sin(ang) * len;
          state.crackleLines.push({
            x1, y1, x2, y2,
            cx: (x1 + x2) * 0.5 + (Math.random() - 0.5) * 12,
            cy: (y1 + y2) * 0.5 + (Math.random() - 0.5) * 12
          });
        }
        state.crackleRevealCount = 0;
        state.isFired = true;
        state.candlesLit = true;
      }

      // 视频 00:16 同款：智能生成成品诗意标题与窑变判词
      function getPorcelainAppraisal() {
        const shapeName = (state.vessel && state.vessel.name) || '梅瓶';
        const counts = state.glazeUsageCounts || {};
        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
        const primaryId = sorted[0] ? sorted[0][0] : (state.frostingColor ? state.frostingColor.id : 'snow_curd');
        const secondaryId = (sorted[1] && sorted[1][1] > sorted[0][1] * 0.22) ? sorted[1][0] : null;

        const pName = (FROSTING_COLORS.find(g => g.id === primaryId) || FROSTING_COLORS[0]).name;
        const sName = secondaryId ? (FROSTING_COLORS.find(g => g.id === secondaryId) || {}).name : '';

        let prefix = pName;
        if (sName && sName !== pName) {
          if ((pName === '天青' || pName === '月白') && (sName === '窑变紫' || sName === '铜红')) {
            prefix = '钧霞窑变';
          } else {
            prefix = `${pName}${sName}`;
          }
        }
        const kf = KILN_FIRES.find(k => k.id === state.kilnType) || KILN_FIRES[0];
        return {
          title: `${prefix} · ${shapeName}`,
          subtitle: kf.desc,
          kilnName: kf.name
        };
      }

      /* ============================================================================
       * 7. 主渲染循环 (含转盘慢转、停留增浓 Dwell Accumulation、窑炉动画与开片清音)
       * ============================================================================ */
      function renderCakeScene(targetCtx, cam, time, includeTool = true) {
        const viewMode = cam.viewMode || 'iso';
        const isTop = viewMode === 'top';

        targetCtx.save();
        targetCtx.translate(CW * 0.5 + cam.panX, CH * 0.5 + cam.panY);
        targetCtx.scale(cam.zoom, cam.zoom);
        targetCtx.translate(-CW * 0.5, -CH * 0.5);

        // Step 5 入窑选火与烧制期间，绘制古法青釉砖窑炉画面
        if (includeTool && state.step === 5 && (state.kilnPhase === 'select' || state.kilnPhase === 'firing')) {
          drawKilnFiringScene(targetCtx, time);
          targetCtx.restore();
          return;
        }

        if (isTop) {
          drawTopDownCake(targetCtx);
        } else {
          drawCakeStand(targetCtx, state.turntableAngle);
          drawOuterFrosting(targetCtx);
        }

        // 4. 所有星斑、遗留纹饰在立体视角下均严格裁剪于器身轮廓内，绝不悬空越界
        targetCtx.save();
        if (!isTop) {
          tracePorcelainSilhouette(targetCtx, state.vessel || HAN_VESSELS[0]);
          targetCtx.clip();
        }
        if (state.sprinkles.length > 0) {
          drawSprinkles(targetCtx, viewMode);
        }

        const itemScaleBoost = isTop ? 1.18 : 1.0;
        const renderQueue = [];
        state.pipings.forEach(p => {
          const wp = resolveItemWorldPos(p, viewMode);
          if (wp) renderQueue.push({ kind: 'pipe', y: wp.y, data: { ...p, x: wp.x, y: wp.y, scale: (p.scale || 1) * itemScaleBoost } });
        });
        state.decorations.forEach(d => {
          const wp = resolveItemWorldPos(d, viewMode);
          if (wp) renderQueue.push({ kind: 'deco', y: wp.y + (d.type === 'candle' ? 6 : 0), data: { ...d, x: wp.x, y: wp.y, scale: (d.scale || 1) * itemScaleBoost } });
        });

        renderQueue.sort((a, b) => a.y - b.y);
        renderQueue.forEach(entry => {
          if (entry.kind === 'pipe') drawPipingDollop(targetCtx, entry.data);
          else drawDecorationItem(targetCtx, entry.data, time);
        });
        targetCtx.restore();

        drawChocolatePlaque(targetCtx, viewMode);
        drawStandingGreetingCard(targetCtx, viewMode);

        if (includeTool) {
          drawActiveTool(targetCtx, time);
        }

        targetCtx.restore();
      }

      let lastCrackleTick = 0;

      function renderLoop(time) {
        ctx.clearRect(0, 0, CW, CH);

        const cam = state.camera;
        cam.zoom += (cam.targetZoom - cam.zoom) * 0.22;
        cam.panX += (cam.targetPanX - cam.panX) * 0.22;
        cam.panY += (cam.targetPanY - cam.panY) * 0.22;

        // 1. 辘轳转盘自动慢转（支持按住一处刷出水平环带釉纹）
        if (state.wheelSpinning && !(state.step === 5 && state.kilnPhase !== 'fired')) {
          state.turntableAngle = (state.turntableAngle + 0.012) % (Math.PI * 2);
        }

        // 2. 视频核心手感：“让釉色在表面停一会儿，同处多刷会更浓”——按住停留时持续柔和增浓
        if (state.pointer.down && state.step === 1 && state.subTab === 'frostColor') {
          const hit = worldToSurface(state.pointer.x, state.pointer.y);
          if (hit) {
            stampCreamBrush(hit, (state.brushSize || 24) * 0.92, state.frostingColor, 1, 0, 0.16);
          }
        }

        // 3. Step 5 窑炉烧制进度推进与开窑冰裂开片声效
        if (state.step === 5 && state.kilnPhase === 'firing') {
          state.kilnProgress = Math.min(100, state.kilnProgress + 0.65);
          progressFillEl.style.width = `${state.kilnProgress}%`;
          if (Math.random() < 0.28) {
            state.smokeParticles.push({
              x: CW * 0.5 + (Math.random() - 0.5) * 26,
              y: 148,
              vy: 1.2 + Math.random() * 1.2,
              r: 5 + Math.random() * 8,
              alpha: 0.45,
              seed: Math.random() * 10
            });
          }
          if (state.kilnProgress >= 100) {
            state.kilnPhase = 'fired';
            executeKilnTransmutation(state.kilnType);
            sfx.playChime();
            updateUI();
          }
        } else if (state.isFired && state.crackleRevealCount < state.crackleLines.length) {
          if (time - lastCrackleTick > 220) {
            lastCrackleTick = time;
            state.crackleRevealCount += 2;
            sfx.playCracklePing();
          }
        }

        renderCakeScene(ctx, cam, time, true);

        if (state.smokeParticles.length > 0) {
          ctx.save();
          state.smokeParticles.forEach(sp => {
            sp.y -= sp.vy;
            sp.x += Math.sin(time * 0.006 + sp.seed) * 0.8;
            sp.r += 0.22;
            sp.alpha -= 0.010;
            if (sp.alpha > 0) {
              ctx.fillStyle = `rgba(210, 205, 196, ${sp.alpha})`;
              ctx.beginPath();
              ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
              ctx.fill();
            }
          });
          state.smokeParticles = state.smokeParticles.filter(sp => sp.alpha > 0);
          ctx.restore();
        }

        if (state.confettiParticles.length > 0) {
          ctx.save();
          state.confettiParticles.forEach(cp => {
            cp.y += cp.vy;
            cp.x += cp.vx;
            cp.rot += cp.vrot;
            ctx.save();
            ctx.translate(cp.x, cp.y);
            ctx.rotate(cp.rot);
            ctx.fillStyle = cp.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, 5, 2.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });
          state.confettiParticles = state.confettiParticles.filter(cp => cp.y < CH + 20);
          ctx.restore();
        }

        // 雕刻迸落的细腻陶土碎屑微粒
        if (state.clayChips && state.clayChips.length > 0) {
          ctx.save();
          state.clayChips.forEach(ch => {
            ch.x += ch.vx;
            ch.y += ch.vy;
            ch.vy += 0.16;
            ch.alpha -= 0.028;
            if (ch.alpha > 0) {
              ctx.fillStyle = `rgba(218, 210, 196, ${ch.alpha})`;
              ctx.beginPath();
              ctx.ellipse(ch.x, ch.y, ch.r, ch.r * 0.65, ch.rot, 0, Math.PI * 2);
              ctx.fill();
            }
          });
          state.clayChips = state.clayChips.filter(ch => ch.alpha > 0);
          ctx.restore();
        }

        requestAnimationFrame(renderLoop);
      }

      /* ============================================================================
       * 8. 画布触控、同处叠刷渐浓算法与 Nomad 级清水晕染笔（含双指 95ms 防误触）
       * ============================================================================ */
      function ensureBrushState() {
        if (!state.brushSize) state.brushSize = 24;
        if (!state.frostStrokes) state.frostStrokes = [];
        if (!state.saucePen) state.saucePen = DRIP_GLAZES[3];
        if (!state.glazeUsageCounts) state.glazeUsageCounts = {};
      }

      const activePointers = new Map();
      const gesture = {
        mode: 'none',
        startDist: 0,
        startZoom: 1,
        lastMidX: 0,
        lastMidY: 0,
        drawStartTime: 0,
        drawPushedUndo: false,
        spaceHeld: false
      };

      function handlePointerDown(e) {
        e.preventDefault();
        ensureBrushState();
        const raw = getRawCanvasPos(e);
        activePointers.set(e.pointerId, { rawX: raw.rawX, rawY: raw.rawY });

        if (activePointers.size === 2) {
          if (gesture.mode === 'draw' && gesture.drawPushedUndo && (performance.now() - gesture.drawStartTime < 95)) {
            undoFrostingAction();
            gesture.drawPushedUndo = false;
          }
          state.pointer.down = false;
          state.pointer.currentStroke = null;
          state.pointer.lastSurfaceHit = null;

          const pts = Array.from(activePointers.values());
          gesture.mode = 'pinch';
          gesture.startDist = Math.max(10, Math.hypot(pts[1].rawX - pts[0].rawX, pts[1].rawY - pts[0].rawY));
          gesture.startZoom = state.camera.targetZoom;
          gesture.lastMidX = (pts[0].rawX + pts[1].rawX) * 0.5;
          gesture.lastMidY = (pts[0].rawY + pts[1].rawY) * 0.5;
          return;
        }

        if (gesture.spaceHeld || e.button === 1 || e.button === 2) {
          gesture.mode = 'pan';
          gesture.lastMidX = raw.rawX;
          gesture.lastMidY = raw.rawY;
          return;
        }

        if (activePointers.size > 2) return;

        gesture.mode = 'draw';
        gesture.drawStartTime = performance.now();
        gesture.drawPushedUndo = false;

        const pos = canvasToWorld(raw.rawX, raw.rawY);
        state.pointer.down = true;
        state.pointer.x = pos.x;
        state.pointer.y = pos.y;
        state.pointer.currentStroke = null;

        if (state.step === 0) {
          // 在择器步骤左右拖动可 360° 旋转打量素胎器物
          state.pointer.rotStartX = pos.x;
        } else if (state.step === 1) {
          const prevUndoLen = state.surfaceUndoStack ? state.surfaceUndoStack.length : 0;
          startFrostingStrokeAt(pos.x, pos.y);
          const nextUndoLen = state.surfaceUndoStack ? state.surfaceUndoStack.length : 0;
          if (nextUndoLen > prevUndoLen) gesture.drawPushedUndo = true;
        } else if (state.step === 2) {
          if (state.subTab === 'carve') {
            const prevUndoLen = state.surfaceUndoStack ? state.surfaceUndoStack.length : 0;
            startCarveAt(pos.x, pos.y);
            const nextUndoLen = state.surfaceUndoStack ? state.surfaceUndoStack.length : 0;
            if (nextUndoLen > prevUndoLen) gesture.drawPushedUndo = true;
          } else {
            placePipingAt(pos.x, pos.y, true);
          }
        } else if (state.step === 3) {
          if (state.subTab === 'ears') {
            // 器耳模式：左右拖动可旋转鉴赏对称双耳
            state.pointer.rotStartX = pos.x;
          } else if (state.activeDecorTool.mode === 'scatter') {
            scatterSprinklesAt(pos.x, pos.y);
          } else if (isPointOnCakeSurface(pos.x, pos.y)) {
            const surf = worldToSurface(pos.x, pos.y);
            if (surf) {
              pushSurfaceUndo(surf.surface, surf.surface);
              gesture.drawPushedUndo = true;
              bakeMotifIntoSurface(surf, state.activeDecorTool.id, 1.18, (Math.random() - 0.5) * 0.14);
              state.carveCount = (state.carveCount || 0) + 1;
              sfx.playPop(560);
              updateUI();
            }
          }
        } else if (state.step === 4) {
          openCardModal();
        } else if (state.step === 5) {
          if (state.kilnPhase === 'select') {
            startKilnFiring(state.kilnType);
          } else if (state.kilnPhase === 'firing') {
            // 点击窑炉鼓风添柴，加速烧制并喷出火星
            state.kilnProgress = Math.min(100, state.kilnProgress + 12);
            sfx.playPop(420);
          } else {
            // 开窑后点击瓷器可再次触发冰裂开片清音并旋转鉴赏
            sfx.playCracklePing();
          }
        }
      }

      function handlePointerMove(e) {
        if (activePointers.has(e.pointerId)) {
          const raw = getRawCanvasPos(e);
          activePointers.set(e.pointerId, { rawX: raw.rawX, rawY: raw.rawY });

          if (gesture.mode === 'pinch' && activePointers.size === 2) {
            e.preventDefault();
            const pts = Array.from(activePointers.values());
            const dist = Math.max(10, Math.hypot(pts[1].rawX - pts[0].rawX, pts[1].rawY - pts[0].rawY));
            const midX = (pts[0].rawX + pts[1].rawX) * 0.5;
            const midY = (pts[0].rawY + pts[1].rawY) * 0.5;
            const dx = midX - gesture.lastMidX, dy = midY - gesture.lastMidY;
            gesture.lastMidX = midX;
            gesture.lastMidY = midY;

            const nextZoom = gesture.startZoom * (dist / gesture.startDist);
            const cam = state.camera;
            const clamped = clampCameraPan(cam.targetZoom, cam.targetPanX + dx, cam.targetPanY + dy);
            cam.targetPanX = clamped.panX; cam.targetPanY = clamped.panY;
            cam.panX = clamped.panX; cam.panY = clamped.panY;
            setCameraZoom(nextZoom, midX, midY, true);
            return;
          }

          if (gesture.mode === 'pan') {
            e.preventDefault();
            const dx = raw.rawX - gesture.lastMidX, dy = raw.rawY - gesture.lastMidY;
            gesture.lastMidX = raw.rawX; gesture.lastMidY = raw.rawY;
            const cam = state.camera;
            const clamped = clampCameraPan(cam.targetZoom, cam.targetPanX + dx, cam.targetPanY + dy);
            cam.targetPanX = clamped.panX; cam.targetPanY = clamped.panY;
            cam.panX = clamped.panX; cam.panY = clamped.panY;
            return;
          }
        }

        if (!state.pointer.down || gesture.mode !== 'draw') return;
        e.preventDefault();
        const pos = getCanvasPos(e);
        state.pointer.vx = pos.x - state.pointer.x;
        state.pointer.vy = pos.y - state.pointer.y;
        state.pointer.x = pos.x;
        state.pointer.y = pos.y;

        if (state.step === 0 || (state.step === 5 && state.kilnPhase === 'fired')) {
          state.turntableAngle += state.pointer.vx * 0.012;
        } else if (state.step === 1) {
          continueFrostingStrokeAt(pos.x, pos.y);
        } else if (state.step === 2) {
          if (state.subTab === 'carve') {
            continueCarveAt(pos.x, pos.y);
          } else {
            placePipingAt(pos.x, pos.y, false);
          }
        } else if (state.step === 3) {
          if (state.activeDecorTool.mode === 'scatter') {
            scatterSprinklesAt(pos.x, pos.y);
          } else if (state.selectedDecorUid) {
            const item = state.decorations.find(d => d.uid === state.selectedDecorUid);
            if (item && isPointOnCakeSurface(pos.x, pos.y)) {
              item.x = pos.x;
              item.y = pos.y;
              const surf = worldToSurface(pos.x, pos.y);
              if (surf) { item.surface = surf.surface; item.u = surf.u; item.v = surf.v; }
            }
          }
        }
      }

      function handlePointerUp(e) {
        if (e && e.pointerId !== undefined) activePointers.delete(e.pointerId);
        else activePointers.clear();
        if (activePointers.size === 0) {
          gesture.mode = 'none';
          gesture.drawPushedUndo = false;
        }
        state.pointer.down = false;
        state.pointer.currentStroke = null;
        state.pointer.lastSurfaceHit = null;
        state.pointer.lastStampPos = null;
        state.pointer.wetPickup = null;
        state.pointer.bladeColor = null;
        state.pointer.bladeColorHex = null;
      }

      function isPointOnCakeSurface(px, py) {
        if (state.camera.viewMode === 'top') {
          return Math.hypot(px - TOP_VIEW.cx, py - TOP_VIEW.cy) <= TOP_VIEW.r + 12;
        }
        return Boolean(worldToSurface(px, py, 'iso'));
      }

      function sampleLocalAlbedo(buf, px, py, radius) {
        const w = buf.width, h = buf.height, wrapX = buf.wrapX;
        const off = Math.max(2, radius * 0.45);
        const pts = [[px, py], [px - off, py], [px + off, py], [px, py - off], [px, py + off]];
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < pts.length; i++) {
          let sx = Math.round(pts[i][0]);
          const sy = Math.max(0, Math.min(h - 1, Math.round(pts[i][1])));
          if (wrapX) sx = ((sx % w) + w) % w;
          else if (sx < 0 || sx >= w) continue;
          const i4 = (sy * w + sx) * 4;
          r += buf.albedo[i4]; g += buf.albedo[i4 + 1]; b += buf.albedo[i4 + 2];
          count++;
        }
        if (count === 0) return { r: 0.85, g: 0.82, b: 0.76 };
        return { r: r / count, g: g / count, b: b / count };
      }

      // 视频核心：“自由换色叠刷，同处多刷会更浓”（随厚度 T 从薄釉 light -> 标准 mid -> 积釉 dark 渐深）
      function stampCreamBrush(hit, brushSize, colorObj, dirX = 1, dirY = 0, flowScale = 1.0) {
        const buf = hit.buf;
        const w = buf.width, h = buf.height, wrapX = buf.wrapX;
        const isBlendStyle = state.creamStyle === 'blend';

        const baseScale = hit.surface === 'top' ? 1.45 : 1.72;
        const radius = brushSize * baseScale * (isBlendStyle ? 1.25 : 1.0);

        const rgbLight = hexToRgb(colorObj.light);
        const rgbMid = hexToRgb(colorObj.mid);
        const rgbPool = hexToRgb(colorObj.dark || colorObj.shade);

        const lR = srgbToLin(rgbLight.r), lG = srgbToLin(rgbLight.g), lB = srgbToLin(rgbLight.b);
        const mR = srgbToLin(rgbMid.r), mG = srgbToLin(rgbMid.g), mB = srgbToLin(rgbMid.b);
        const pR = srgbToLin(rgbPool.r), pG = srgbToLin(rgbPool.g), pB = srgbToLin(rgbPool.b);

        const under = sampleLocalAlbedo(buf, hit.px, hit.py, radius);
        if (!state.pointer.wetPickup) {
          state.pointer.wetPickup = { r: under.r, g: under.g, b: under.b };
        } else {
          state.pointer.wetPickup.r += (under.r - state.pointer.wetPickup.r) * 0.35;
          state.pointer.wetPickup.g += (under.g - state.pointer.wetPickup.g) * 0.35;
          state.pointer.wetPickup.b += (under.b - state.pointer.wetPickup.b) * 0.35;
        }

        const perpX = -dirY, perpY = dirX;
        const ridgeFreq = (Math.PI * 3.2) / Math.max(8, radius);

        const x0 = Math.floor(hit.px - radius), x1 = Math.ceil(hit.px + radius);
        const y0 = Math.max(0, Math.floor(hit.py - radius)), y1 = Math.min(h - 1, Math.ceil(hit.py + radius));
        const r2 = radius * radius, invR = 1 / radius;
        const maxFlow = (isBlendStyle ? 0.22 : 0.34) * flowScale;

        for (let y = y0; y <= y1; y++) {
          const dy = y - hit.py, rowOff = y * w;
          for (let x = x0; x <= x1; x++) {
            const dx = x - hit.px, d2 = dx * dx + dy * dy;
            if (d2 >= r2) continue;

            let sx = x;
            if (wrapX) sx = ((x % w) + w) % w;
            else if (x < 0 || x >= w) continue;

            const normDist2 = d2 * invR * invR;
            const q = 1 - normDist2;
            const falloff = q * q; // C2 连续双平方核，如真实水彩釉料般无硬边
            const alpha = falloff * maxFlow;
            const idx = rowOff + sx, i4 = idx * 4;

            // 1. 渐近累加釉层厚度 T ∈ [0.18, 0.98]（同处越刷越厚）
            const oldT = buf.heightMap[idx];
            const nextT = Math.min(0.98, oldT + (1.0 - oldT) * alpha * 0.38);

            // 2. 根据局部釉层厚度 nextT 计算当前矿物釉的目标深浅色（薄刷清浅 -> 多刷深润）
            const conc = Math.max(0, Math.min(1, (nextT - 0.18) / 0.72));
            let tR, tG, tB;
            if (conc < 0.5) {
              const k = conc * 2;
              tR = lR + (mR - lR) * k;
              tG = lG + (mG - lG) * k;
              tB = lB + (mB - lB) * k;
            } else {
              const k = (conc - 0.5) * 2;
              tR = mR + (pR - mR) * k;
              tG = mG + (pG - mG) * k;
              tB = mB + (pB - mB) * k;
            }

            const wetRatio = isBlendStyle ? 0.42 : 0.18;
            const mixR = tR * (1 - wetRatio) + state.pointer.wetPickup.r * wetRatio;
            const mixG = tG * (1 - wetRatio) + state.pointer.wetPickup.g * wetRatio;
            const mixB = tB * (1 - wetRatio) + state.pointer.wetPickup.b * wetRatio;

            buf.albedo[i4] += (mixR - buf.albedo[i4]) * alpha;
            buf.albedo[i4 + 1] += (mixG - buf.albedo[i4 + 1]) * alpha;
            buf.albedo[i4 + 2] += (mixB - buf.albedo[i4 + 2]) * alpha;

            if (isBlendStyle) {
              buf.heightMap[idx] = nextT;
            } else {
              const perpDist = dx * perpX + dy * perpY;
              const bristle = Math.cos(perpDist * ridgeFreq) * 0.025 * falloff;
              buf.heightMap[idx] = Math.max(0.15, Math.min(0.98, nextT + bristle));
            }
          }
        }
        buf.markDirty(x0 - 2, y0 - 2, x1 + 2, y1 + 2);
      }

      function pushSurfaceUndo(kind, surfaceName = null) {
        if (!state.surfaceUndoStack) state.surfaceUndoStack = [];
        if (kind === 'sauce') {
          state.surfaceUndoStack.push({ kind: 'sauce' });
        } else if (kind === 'both') {
          state.surfaceUndoStack.push({
            kind: 'both',
            top: state.topSurface.captureSnapshot(),
            side: state.sideSurface.captureSnapshot(),
            baseCoatColor: state.baseCoatColor
          });
        } else if (surfaceName === 'top') {
          state.surfaceUndoStack.push({ kind: 'top', data: state.topSurface.captureSnapshot() });
        } else if (surfaceName === 'side') {
          state.surfaceUndoStack.push({ kind: 'side', data: state.sideSurface.captureSnapshot() });
        }
        if (state.surfaceUndoStack.length > 12) state.surfaceUndoStack.shift();
      }

      function undoFrostingAction() {
        if (!state.surfaceUndoStack || state.surfaceUndoStack.length === 0) {
          if (state.frostStrokes.length > 0) state.frostStrokes.pop();
          return;
        }
        const entry = state.surfaceUndoStack.pop();
        if (entry.kind === 'sauce') state.frostStrokes.pop();
        else if (entry.kind === 'top') state.topSurface.restoreSnapshot(entry.data);
        else if (entry.kind === 'side') state.sideSurface.restoreSnapshot(entry.data);
        else if (entry.kind === 'both') {
          state.topSurface.restoreSnapshot(entry.top);
          state.sideSurface.restoreSnapshot(entry.side);
          if (entry.baseCoatColor) state.baseCoatColor = entry.baseCoatColor;
        }
      }

      // Nomad 级清水笔晕染算法（ROI 一维可分离滑窗均值滤波 + 方向推匀 + C2 双平方无痕写回）
      function applySpatulaStep(hit, brushSize, mode, dirX = 1, dirY = 0) {
        const buf = hit.buf;
        const w = buf.width, h = buf.height, wrapX = buf.wrapX;

        const baseScale = hit.surface === 'top' ? 1.55 : 1.85;
        const radius = Math.max(16, brushSize * baseScale);
        const blurRad = Math.max(3, Math.min(14, Math.round(radius * 0.25)));
        const pad = blurRad + 2;

        const cx = hit.px, cy = hit.py;
        const roiX0 = Math.floor(cx - radius - pad), roiX1 = Math.ceil(cx + radius + pad);
        const roiY0 = Math.max(0, Math.floor(cy - radius - pad)), roiY1 = Math.min(h - 1, Math.ceil(cy + radius + pad));

        const rw = roiX1 - roiX0 + 1, rh = roiY1 - roiY0 + 1;
        if (rw <= 2 || rh <= 2) return;

        const total = rw * rh;
        const src = new Float32Array(total * 4);
        const tmpH = new Float32Array(total * 4);
        const blurred = new Float32Array(total * 4);
        const albedo = buf.albedo, hm = buf.heightMap;

        for (let ry = 0; ry < rh; ry++) {
          const sy = roiY0 + ry, rowOff = sy * w, dstRow = ry * rw;
          for (let rx = 0; rx < rw; rx++) {
            let sx = roiX0 + rx;
            if (wrapX) sx = ((sx % w) + w) % w;
            else sx = sx < 0 ? 0 : (sx >= w ? w - 1 : sx);
            const sIdx = rowOff + sx, s4 = sIdx * 4, d4 = (dstRow + rx) * 4;
            src[d4] = albedo[s4]; src[d4 + 1] = albedo[s4 + 1]; src[d4 + 2] = albedo[s4 + 2]; src[d4 + 3] = hm[sIdx];
          }
        }

        const winSize = blurRad * 2 + 1, invWin = 1 / winSize;
        for (let ry = 0; ry < rh; ry++) {
          const rowBase = ry * rw * 4;
          let sr = 0, sg = 0, sb = 0, sh = 0;
          for (let k = -blurRad; k <= blurRad; k++) {
            const kx = k < 0 ? 0 : (k >= rw ? rw - 1 : k), p4 = rowBase + kx * 4;
            sr += src[p4]; sg += src[p4 + 1]; sb += src[p4 + 2]; sh += src[p4 + 3];
          }
          for (let rx = 0; rx < rw; rx++) {
            const o4 = rowBase + rx * 4;
            tmpH[o4] = sr * invWin; tmpH[o4 + 1] = sg * invWin; tmpH[o4 + 2] = sb * invWin; tmpH[o4 + 3] = sh * invWin;
            const addX = rx + blurRad + 1 < rw ? rx + blurRad + 1 : rw - 1;
            const remX = rx - blurRad > 0 ? rx - blurRad : 0;
            const a4 = rowBase + addX * 4, r4 = rowBase + remX * 4;
            sr += src[a4] - src[r4]; sg += src[a4 + 1] - src[r4 + 1]; sb += src[a4 + 2] - src[r4 + 2]; sh += src[a4 + 3] - src[r4 + 3];
          }
        }

        for (let rx = 0; rx < rw; rx++) {
          let sr = 0, sg = 0, sb = 0, sh = 0;
          for (let k = -blurRad; k <= blurRad; k++) {
            const ky = k < 0 ? 0 : (k >= rh ? rh - 1 : k), p4 = (ky * rw + rx) * 4;
            sr += tmpH[p4]; sg += tmpH[p4 + 1]; sb += tmpH[p4 + 2]; sh += tmpH[p4 + 3];
          }
          for (let ry = 0; ry < rh; ry++) {
            const o4 = (ry * rw + rx) * 4;
            blurred[o4] = sr * invWin; blurred[o4 + 1] = sg * invWin; blurred[o4 + 2] = sb * invWin; blurred[o4 + 3] = sh * invWin;
            const addY = ry + blurRad + 1 < rh ? ry + blurRad + 1 : rh - 1;
            const remY = ry - blurRad > 0 ? ry - blurRad : 0;
            const a4 = (addY * rw + rx) * 4, r4 = (remY * rw + rx) * 4;
            sr += tmpH[a4] - tmpH[r4]; sg += tmpH[a4 + 1] - tmpH[r4 + 1]; sb += tmpH[a4 + 2] - tmpH[r4 + 2]; sh += tmpH[a4 + 3] - tmpH[r4 + 3];
          }
        }

        const cRx = Math.max(0, Math.min(rw - 1, Math.round(cx - roiX0)));
        const cRy = Math.max(0, Math.min(rh - 1, Math.round(cy - roiY0)));
        const c4 = (cRy * rw + cRx) * 4;
        if (!state.pointer.bladeColor) {
          state.pointer.bladeColor = { r: blurred[c4], g: blurred[c4 + 1], b: blurred[c4 + 2] };
        } else {
          state.pointer.bladeColor.r += (blurred[c4] - state.pointer.bladeColor.r) * 0.25;
          state.pointer.bladeColor.g += (blurred[c4 + 1] - state.pointer.bladeColor.g) * 0.25;
          state.pointer.bladeColor.b += (blurred[c4 + 2] - state.pointer.bladeColor.b) * 0.25;
        }
        const bc = state.pointer.bladeColor;
        state.pointer.bladeColorHex = `rgb(${linToSrgb(bc.r)},${linToSrgb(bc.g)},${linToSrgb(bc.b)})`;

        const strength = mode.strength, drag = mode.drag;
        const shift = Math.min(blurRad * 0.9, 5.0), invR2 = 1 / (radius * radius);
        const innerX0 = Math.floor(cx - radius), innerX1 = Math.ceil(cx + radius);
        const innerY0 = Math.max(0, Math.floor(cy - radius)), innerY1 = Math.min(h - 1, Math.ceil(cy + radius));

        for (let y = innerY0; y <= innerY1; y++) {
          const dy = y - cy, ry = y - roiY0, rowOff = y * w;
          for (let x = innerX0; x <= innerX1; x++) {
            const dx = x - cx, d2 = dx * dx + dy * dy;
            if (d2 >= radius * radius) continue;

            let sx = x;
            if (wrapX) sx = ((x % w) + w) % w;
            else if (x < 0 || x >= w) continue;

            const q = 1 - d2 * invR2, falloff = q * q;
            const rx = x - roiX0, b4 = (ry * rw + rx) * 4;
            const upRx = Math.max(0, Math.min(rw - 1, Math.round(rx - dirX * shift)));
            const upRy = Math.max(0, Math.min(rh - 1, Math.round(ry - dirY * shift)));
            const u4 = (upRy * rw + upRx) * 4;

            const targetR = blurred[b4] * (1 - drag) + blurred[u4] * drag;
            const targetG = blurred[b4 + 1] * (1 - drag) + blurred[u4 + 1] * drag;
            const targetB = blurred[b4 + 2] * (1 - drag) + blurred[u4 + 2] * drag;
            const targetH = blurred[b4 + 3] * (1 - drag * 0.5) + blurred[u4 + 3] * (drag * 0.5);

            const idx = rowOff + sx, i4 = idx * 4;
            const colorW = falloff * strength * 0.72;
            const heightW = falloff * Math.min(0.95, strength * 1.15);

            albedo[i4] += ((targetR * 0.92 + bc.r * 0.08) - albedo[i4]) * colorW;
            albedo[i4 + 1] += ((targetG * 0.92 + bc.g * 0.08) - albedo[i4 + 1]) * colorW;
            albedo[i4 + 2] += ((targetB * 0.92 + bc.b * 0.08) - albedo[i4 + 2]) * colorW;
            hm[idx] += (targetH - hm[idx]) * heightW;
          }
        }
        buf.markDirty(innerX0 - 2, innerY0 - 2, innerX1 + 2, innerY1 + 2);
      }

      function autoTurntableSmooth() {
        pushSurfaceUndo('both');
        const smoothHorizontal = (buf, rad, blendC, blendH) => {
          const w = buf.width, h = buf.height, wrapX = buf.wrapX;
          const win = rad * 2 + 1, inv = 1 / win;
          const albedo = buf.albedo, hm = buf.heightMap;
          const rowR = new Float32Array(w), rowG = new Float32Array(w), rowB = new Float32Array(w), rowH = new Float32Array(w);

          for (let y = 0; y < h; y++) {
            const off = y * w;
            let sr = 0, sg = 0, sb = 0, sh = 0;
            for (let k = -rad; k <= rad; k++) {
              const kx = wrapX ? ((k % w) + w) % w : Math.max(0, Math.min(w - 1, k)), i4 = (off + kx) * 4;
              sr += albedo[i4]; sg += albedo[i4 + 1]; sb += albedo[i4 + 2]; sh += hm[off + kx];
            }
            for (let x = 0; x < w; x++) {
              rowR[x] = sr * inv; rowG[x] = sg * inv; rowB[x] = sb * inv; rowH[x] = sh * inv;
              const ax = wrapX ? ((x + rad + 1) % w + w) % w : Math.min(w - 1, x + rad + 1);
              const rx = wrapX ? ((x - rad) % w + w) % w : Math.max(0, x - rad);
              const a4 = (off + ax) * 4, r4 = (off + rx) * 4;
              sr += albedo[a4] - albedo[r4]; sg += albedo[a4 + 1] - albedo[r4 + 1]; sb += albedo[a4 + 2] - albedo[r4 + 2]; sh += hm[off + ax] - hm[off + rx];
            }
            for (let x = 0; x < w; x++) {
              const i4 = (off + x) * 4;
              albedo[i4] += (rowR[x] - albedo[i4]) * blendC;
              albedo[i4 + 1] += (rowG[x] - albedo[i4 + 1]) * blendC;
              albedo[i4 + 2] += (rowB[x] - albedo[i4 + 2]) * blendC;
              hm[off + x] += (rowH[x] - hm[off + x]) * blendH;
            }
          }
          buf.rebuildRegion(0, 0, w - 1, h - 1);
          buf.dirty = null;
        };

        smoothHorizontal(state.sideSurface, 12, 0.55, 0.82);
        smoothHorizontal(state.topSurface, 7, 0.42, 0.78);
        state.turntableAngle += 0.9;
        sfx.playChime();
      }

      function startFrostingStrokeAt(px, py) {
        if (!isPointOnCakeSurface(px, py)) return;
        ensureBrushState();

        if (state.subTab === 'drip' && state.dripGlaze.color) {
          continueFrostingStrokeAt(px, py);
          return;
        }

        if (state.subTab === 'sauce') {
          pushSurfaceUndo('sauce');
          const hitS = worldToSurface(px, py);
          const pt = hitS ? { x: px, y: py, surface: hitS.surface, u: hitS.u, v: hitS.v } : { x: px, y: py };
          const stroke = { points: [pt], size: state.brushSize || 24, isSauce: true, color: state.saucePen, shards: [] };
          state.frostStrokes.push(stroke);
          state.pointer.currentStroke = stroke;
          state.roughCoverage = Math.min(1, state.roughCoverage + 0.015);
          sfx.playSwish();
          updatePromptAndProgress();
          return;
        }

        const hit = worldToSurface(px, py);
        if (!hit) return;
        pushSurfaceUndo(hit.surface, hit.surface);
        state.pointer.lastSurfaceHit = hit;
        state.pointer.wetPickup = null;
        state.pointer.bladeColor = null;

        if (state.subTab === 'spatula') {
          applySpatulaStep(hit, state.brushSize || 24, state.spatulaMode || SPATULA_MODES[0], 1, 0);
          sfx.playScrape(1);
          updatePromptAndProgress();
          return;
        }

        const cId = state.frostingColor.id;
        state.glazeUsageCounts[cId] = (state.glazeUsageCounts[cId] || 0) + 1;
        stampCreamBrush(hit, state.brushSize || 24, state.frostingColor, 1, 0, 1.0);
        state.roughCoverage = Math.min(1, state.roughCoverage + 0.018);
        sfx.playSwish();
        updatePromptAndProgress();
      }

      function continueFrostingStrokeAt(px, py) {
        if (!isPointOnCakeSurface(px, py)) return;
        ensureBrushState();

        if (state.subTab === 'drip' && state.dripGlaze.color) {
          const relX = (px - (CAKE.cx - CAKE.rx)) / (CAKE.rx * 2);
          if (relX >= 0 && relX <= 1) {
            const col = Math.floor(relX * state.drips.length);
            for (let k = Math.max(0, col - 1); k <= Math.min(state.drips.length - 1, col + 1); k++) {
              state.drips[k] = Math.min(88, Math.max(state.drips[k], 24 + Math.random() * 52));
            }
            sfx.playSwish();
            updatePromptAndProgress();
          }
          return;
        }

        if (state.subTab === 'sauce') {
          let stroke = state.pointer.currentStroke;
          if (!stroke) { startFrostingStrokeAt(px, py); return; }
          const lastPt = stroke.points[stroke.points.length - 1];
          if (Math.hypot(px - lastPt.x, py - lastPt.y) < 4) return;
          const hitS = worldToSurface(px, py);
          stroke.points.push(hitS ? { x: px, y: py, surface: hitS.surface, u: hitS.u, v: hitS.v } : { x: px, y: py });
          sfx.playSwish();
          updatePromptAndProgress();
          return;
        }

        const hit = worldToSurface(px, py);
        if (!hit) { state.pointer.lastSurfaceHit = null; return; }
        const isSpatula = state.subTab === 'spatula';
        const prev = state.pointer.lastSurfaceHit;
        if (prev && prev.surface === hit.surface) {
          let dx = hit.px - prev.px;
          if (hit.buf.wrapX) {
            const halfW = hit.buf.width * 0.5;
            if (dx > halfW) dx -= hit.buf.width;
            else if (dx < -halfW) dx += hit.buf.width;
          }
          const dy = hit.py - prev.py;
          const dist = Math.hypot(dx, dy);
          if (dist < 0.8) return;
          const dirX = dx / dist, dirY = dy / dist;
          const step = Math.max(isSpatula ? 2.5 : 1.5, (state.brushSize || 24) * (isSpatula ? 0.24 : 0.16));
          const steps = Math.min(18, Math.max(1, Math.ceil(dist / step)));
          for (let i = 1; i <= steps; i++) {
            const t = i / steps;
            let ipx = prev.px + dx * t;
            if (hit.buf.wrapX) ipx = ((ipx % hit.buf.width) + hit.buf.width) % hit.buf.width;
            const subHit = { surface: hit.surface, buf: hit.buf, px: ipx, py: prev.py + dy * t };
            if (isSpatula) applySpatulaStep(subHit, state.brushSize || 24, state.spatulaMode || SPATULA_MODES[0], dirX, dirY);
            else stampCreamBrush(subHit, state.brushSize || 24, state.frostingColor, dirX, dirY, 1.0);
          }
          if (isSpatula) sfx.playScrape(dist);
        } else {
          if (isSpatula) {
            applySpatulaStep(hit, state.brushSize || 24, state.spatulaMode || SPATULA_MODES[0], 1, 0);
            sfx.playScrape(1);
          } else {
            stampCreamBrush(hit, state.brushSize || 24, state.frostingColor, 1, 0, 1.0);
          }
        }
        state.pointer.lastSurfaceHit = hit;

        if (!isSpatula) {
          const cId = state.frostingColor.id;
          state.glazeUsageCounts[cId] = (state.glazeUsageCounts[cId] || 0) + 1;
          const prevCov = state.roughCoverage;
          state.roughCoverage = Math.min(1, state.roughCoverage + (state.brushSize || 24) / 2000);
          state.smoothProgress = state.roughCoverage;
          sfx.playSwish();
          if (prevCov < 1 && state.roughCoverage >= 1) {
            state.frostPhase = 2;
            sfx.playChime();
          }
        }
        updatePromptAndProgress();
      }

      // Step 2 核心：真实瓷胎物理雕刻引擎（刻入 heightMap V型凹槽 + 刀口微脊 + 暗刻积釉加深 + 陶土碎屑）
      function carveClayPoint(hit, toolId = 'medium') {
        const buf = hit.buf;
        const w = buf.width, h = buf.height, wrapX = buf.wrapX;
        const cfg = toolId === 'fine'
          ? { rad: 6.5, depth: 0.34, ridge: 0.06, shade: 0.14 }
          : (toolId === 'deep'
            ? { rad: 15.0, depth: 0.52, ridge: 0.10, shade: 0.22 }
            : { rad: 10.5, depth: 0.44, ridge: 0.08, shade: 0.18 });

        const radius = cfg.rad * (hit.surface === 'side' ? 1.2 : 1.0);
        const outerR = radius * 1.45;
        const x0 = Math.floor(hit.px - outerR), x1 = Math.ceil(hit.px + outerR);
        const y0 = Math.max(0, Math.floor(hit.py - outerR)), y1 = Math.min(h - 1, Math.ceil(hit.py + outerR));

        const albedo = buf.albedo;
        const hm = buf.heightMap;
        // 胎底阴刻阴影色（根据当前胎土色微深）
        const clayRgb = hexToRgb((state.spongeFlavor && state.spongeFlavor.crust) || '#ABA292');
        const cR = srgbToLin(clayRgb.r * 0.78);
        const cG = srgbToLin(clayRgb.g * 0.78);
        const cB = srgbToLin(clayRgb.b * 0.78);

        for (let y = y0; y <= y1; y++) {
          const dy = y - hit.py, rowOff = y * w;
          for (let x = x0; x <= x1; x++) {
            const dx = x - hit.px;
            const dist = Math.hypot(dx, dy);
            if (dist >= outerR) continue;
            let sx = x;
            if (wrapX) sx = ((x % w) + w) % w;
            else if (x < 0 || x >= w) continue;

            const idx = rowOff + sx;
            const i4 = idx * 4;
            if (dist < radius) {
              // V 型刀槽中心下凹（清晰刻痕）
              const u = 1 - dist / radius;
              const groove = u * u * (3 - 2 * u);
              const targetH = Math.max(0.02, hm[idx] - cfg.depth * groove * 0.45);
              hm[idx] = Math.min(hm[idx], targetH);
              // 刻槽内部积釉/胎影自然变深，立刻产生“刻进瓷胎”的阴刻纵深感
              const darkW = groove * cfg.shade;
              albedo[i4] += (cR - albedo[i4]) * darkW;
              albedo[i4 + 1] += (cG - albedo[i4 + 1]) * darkW;
              albedo[i4 + 2] += (cB - albedo[i4 + 2]) * darkW;
            } else {
              // 刀口两侧微隆起的细微胎泥脊（让高光在刻痕边沿泛出清脆白线）
              const rt = 1 - (dist - radius) / (outerR - radius);
              const rim = Math.sin(rt * Math.PI);
              hm[idx] = Math.min(0.98, hm[idx] + cfg.ridge * rim * 0.25);
            }
          }
        }
        buf.markDirty(x0 - 2, y0 - 2, x1 + 2, y1 + 2);
      }

      function spawnClayChipsAt(wx, wy) {
        if (!state.clayChips) state.clayChips = [];
        for (let i = 0; i < 2; i++) {
          state.clayChips.push({
            x: wx + (Math.random() - 0.5) * 6,
            y: wy + (Math.random() - 0.5) * 6,
            vx: (Math.random() - 0.5) * 2.2,
            vy: -0.8 - Math.random() * 1.4,
            r: 1.4 + Math.random() * 1.6,
            rot: Math.random() * Math.PI,
            alpha: 0.85
          });
        }
      }

      function carveWithSymmetry(hit, toolId) {
        carveClayPoint(hit, toolId);
        if (!state.pipingSymmetry) return;
        if (hit.surface === 'side') {
          for (let k = 1; k < 6; k++) {
            const symPx = (hit.px + (hit.buf.width * k) / 6) % hit.buf.width;
            carveClayPoint({ surface: 'side', buf: hit.buf, px: symPx, py: hit.py }, toolId);
          }
        } else if (hit.surface === 'top') {
          const symPx = hit.buf.width - hit.px;
          const symPy = hit.buf.height - hit.py;
          carveClayPoint({ surface: 'top', buf: hit.buf, px: symPx, py: symPy }, toolId);
        }
      }

      function startCarveAt(px, py) {
        const hit = worldToSurface(px, py);
        if (!hit) return;
        pushSurfaceUndo(hit.surface, hit.surface);
        state.pointer.lastSurfaceHit = hit;
        carveWithSymmetry(hit, state.carveTool || 'medium');
        spawnClayChipsAt(px, py);
        state.carveCount = (state.carveCount || 0) + 1;
        sfx.playCarve(1);
        updatePromptAndProgress();
      }

      function continueCarveAt(px, py) {
        const hit = worldToSurface(px, py);
        if (!hit) { state.pointer.lastSurfaceHit = null; return; }
        const toolId = state.carveTool || 'medium';
        const prev = state.pointer.lastSurfaceHit;
        if (prev && prev.surface === hit.surface) {
          let dx = hit.px - prev.px;
          if (hit.buf.wrapX) {
            const halfW = hit.buf.width * 0.5;
            if (dx > halfW) dx -= hit.buf.width;
            else if (dx < -halfW) dx += hit.buf.width;
          }
          const dy = hit.py - prev.py;
          const dist = Math.hypot(dx, dy);
          if (dist < 1.2) return;
          const step = toolId === 'fine' ? 1.8 : 2.6;
          const steps = Math.min(24, Math.max(1, Math.ceil(dist / step)));
          for (let i = 1; i <= steps; i++) {
            const t = i / steps;
            let ipx = prev.px + dx * t;
            if (hit.buf.wrapX) ipx = ((ipx % hit.buf.width) + hit.buf.width) % hit.buf.width;
            carveWithSymmetry({ surface: hit.surface, buf: hit.buf, px: ipx, py: prev.py + dy * t }, toolId);
          }
          if (Math.random() < 0.65) spawnClayChipsAt(px, py);
          sfx.playCarve(dist);
        } else {
          carveWithSymmetry(hit, toolId);
          spawnClayChipsAt(px, py);
          sfx.playCarve(1);
        }
        state.pointer.lastSurfaceHit = hit;
        state.carveCount = (state.carveCount || 0) + 1;
        updatePromptAndProgress();
      }

      // 同釉色真实印模压印引擎：直接将古瓷浮雕/阴刻高度图压入 heightMap（彻底告别彩色贴纸）
      function stampReliefMotifToSurface(hit, nozzleId, reliefMode = 'intaglio') {
        const buf = hit.buf;
        const w = buf.width, h = buf.height, wrapX = buf.wrapX;
        const S = 64;
        const off = document.createElement('canvas');
        off.width = S; off.height = S;
        const octx = off.getContext('2d');
        octx.translate(S * 0.5, S * 0.5);
        octx.fillStyle = '#FFFFFF';
        octx.strokeStyle = '#FFFFFF';
        octx.lineCap = 'round';
        octx.lineJoin = 'round';

        if (nozzleId === 'rosette') {
          // 卷云如意纹印模
          octx.lineWidth = 4.2;
          octx.beginPath();
          octx.moveTo(0, -16);
          octx.bezierCurveTo(22, -18, 24, 6, 8, 13);
          octx.quadraticCurveTo(0, 16, -8, 13);
          octx.bezierCurveTo(-24, 6, -22, -18, 0, -16);
          octx.stroke();
          octx.lineWidth = 3.2;
          octx.beginPath();
          octx.arc(-8, -2, 6, 0, Math.PI * 1.45);
          octx.stroke();
          octx.beginPath();
          octx.arc(8, -2, 6, -Math.PI * 0.45, Math.PI);
          octx.stroke();
        } else if (nozzleId === 'shell') {
          // 宋瓷仰覆莲瓣印模
          octx.lineWidth = 3.8;
          octx.beginPath();
          octx.moveTo(0, -24);
          octx.quadraticCurveTo(20, -4, 14, 18);
          octx.quadraticCurveTo(0, 23, -14, 18);
          octx.quadraticCurveTo(-20, -4, 0, -24);
          octx.stroke();
          octx.lineWidth = 2.4;
          octx.beginPath();
          octx.moveTo(0, -18); octx.lineTo(0, 16);
          octx.moveTo(0, 8); octx.quadraticCurveTo(8, 0, 9, -8);
          octx.moveTo(0, 8); octx.quadraticCurveTo(-8, 0, -9, -8);
          octx.stroke();
        } else if (nozzleId === 'pearl') {
          // 联珠乳钉纹印模
          const g = octx.createRadialGradient(0, 0, 1, 0, 0, 14);
          g.addColorStop(0, 'rgba(255,255,255,1)');
          g.addColorStop(0.7, 'rgba(255,255,255,0.75)');
          g.addColorStop(1, 'rgba(255,255,255,0)');
          octx.fillStyle = g;
          octx.beginPath();
          octx.arc(0, 0, 14, 0, Math.PI * 2);
          octx.fill();
        } else {
          // 折枝五瓣梅花暗刻模
          octx.lineWidth = 2.8;
          for (let i = 0; i < 5; i++) {
            const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
            octx.beginPath();
            octx.arc(Math.cos(a) * 11, Math.sin(a) * 11, 7.5, 0, Math.PI * 2);
            octx.stroke();
          }
          octx.beginPath();
          octx.arc(0, 0, 4, 0, Math.PI * 2);
          octx.fill();
        }

        const stampData = octx.getImageData(0, 0, S, S).data;
        const half = S * 0.5;
        const isEmboss = reliefMode === 'emboss';
        const albedo = buf.albedo;
        const hm = buf.heightMap;
        const x0 = Math.floor(hit.px - half), y0 = Math.floor(hit.py - half);

        for (let sy = 0; sy < S; sy++) {
          const dy = y0 + sy;
          if (dy < 0 || dy >= h) continue;
          const rowOff = dy * w;
          for (let sx = 0; sx < S; sx++) {
            const aVal = stampData[(sy * S + sx) * 4 + 3] / 255;
            if (aVal < 0.03) continue;
            let dx = x0 + sx;
            if (wrapX) dx = ((dx % w) + w) % w;
            else if (dx < 0 || dx >= w) continue;

            const idx = rowOff + dx;
            const i4 = idx * 4;
            if (isEmboss) {
              // 阳刻浮雕：胎面凸起，边缘泛瓷釉柔光
              hm[idx] = Math.min(0.98, hm[idx] + aVal * 0.34);
              albedo[i4] = Math.min(1, albedo[i4] * (1 + aVal * 0.05));
              albedo[i4 + 1] = Math.min(1, albedo[i4 + 1] * (1 + aVal * 0.05));
              albedo[i4 + 2] = Math.min(1, albedo[i4 + 2] * (1 + aVal * 0.05));
            } else {
              // 阴刻暗花：胎面下凹，凹槽处同釉色自然积釉变深（宋瓷影青/龙泉质感）
              hm[idx] = Math.max(0.02, hm[idx] - aVal * 0.34);
              const poolDark = 1 - aVal * 0.16;
              albedo[i4] *= poolDark;
              albedo[i4 + 1] *= poolDark;
              albedo[i4 + 2] *= poolDark;
            }
          }
        }
        buf.markDirty(x0 - 2, Math.max(0, y0 - 2), x0 + S + 2, Math.min(h - 1, y0 + S + 2));
      }

      // 釉下拓印引擎：将青花折枝梅、铁锈飞鸟、双鱼等直接溶入器身表面釉层（贴合3D曲面、高光与窑变）
      function bakeMotifIntoSurface(hit, type, scale = 1.15, rot = 0) {
        const buf = hit.buf;
        const w = buf.width, h = buf.height, wrapX = buf.wrapX;
        const S = 96;
        const off = document.createElement('canvas');
        off.width = S; off.height = S;
        const octx = off.getContext('2d');
        drawDecorationItem(octx, { type, x: S * 0.5, y: S * 0.5, scale: scale * 1.45, rot }, 0);

        const img = octx.getImageData(0, 0, S, S).data;
        const half = S * 0.5;
        const albedo = buf.albedo;
        const hm = buf.heightMap;
        const isReliefMotif = (type === 'straw_half' || type === 'mango_wedge' || type === 'macaron_green' || type === 'macaron_pink');
        const blendStrength = type === 'macaron_pink' ? 0.92 : 0.78; // 描金浓烈，青花/铁绘带釉下温润透感
        const x0 = Math.floor(hit.px - half), y0 = Math.floor(hit.py - half);

        for (let sy = 0; sy < S; sy++) {
          const dy = y0 + sy;
          if (dy < 0 || dy >= h) continue;
          const rowOff = dy * w;
          for (let sx = 0; sx < S; sx++) {
            const p4 = (sy * S + sx) * 4;
            const a = (img[p4 + 3] / 255) * blendStrength;
            if (a < 0.02) continue;
            let dx = x0 + sx;
            if (wrapX) dx = ((dx % w) + w) % w;
            else if (dx < 0 || dx >= w) continue;

            const idx = rowOff + dx;
            const i4 = idx * 4;
            const sr = srgbToLin(img[p4]);
            const sg = srgbToLin(img[p4 + 1]);
            const sb = srgbToLin(img[p4 + 2]);
            albedo[i4] += (sr - albedo[i4]) * a;
            albedo[i4 + 1] += (sg - albedo[i4 + 1]) * a;
            albedo[i4 + 2] += (sb - albedo[i4 + 2]) * a;
            if (isReliefMotif) {
              hm[idx] = Math.min(0.96, hm[idx] + a * 0.20);
            }
          }
        }
        buf.markDirty(x0 - 2, Math.max(0, y0 - 2), x0 + S + 2, Math.min(h - 1, y0 + S + 2));
      }

      function placePipingAt(px, py, isFirstDown) {
        if (!isPointOnCakeSurface(px, py)) return;
        const surf = worldToSurface(px, py);
        if (!surf) return;

        // 限制拖动时的印模间隔，避免糊成一团
        const last = state.pointer.lastStampPos;
        if (!isFirstDown && last && Math.hypot(px - last.x, py - last.y) < 34) return;
        state.pointer.lastStampPos = { x: px, y: py };

        if (isFirstDown) pushSurfaceUndo(surf.surface, surf.surface);
        const mode = state.reliefMode || 'intaglio';
        const nozzleId = state.pipingNozzle.id;

        stampReliefMotifToSurface(surf, nozzleId, mode);
        if (state.pipingSymmetry) {
          if (surf.surface === 'top') {
            stampReliefMotifToSurface({ surface: 'top', buf: surf.buf, px: surf.buf.width - surf.px, py: surf.buf.height - surf.py }, nozzleId, mode);
          } else if (surf.surface === 'side') {
            for (let k = 1; k < 6; k++) {
              const symPx = (surf.px + (surf.buf.width * k) / 6) % surf.buf.width;
              stampReliefMotifToSurface({ surface: 'side', buf: surf.buf, px: symPx, py: surf.py }, nozzleId, mode);
            }
          }
        }
        spawnClayChipsAt(px, py);
        state.carveCount = (state.carveCount || 0) + 1;
        sfx.playCarve(1.4);
        updatePromptAndProgress();
      }

      function scatterSprinklesAt(px, py) {
        if (!isPointOnCakeSurface(px, py)) return;
        const viewMode = state.camera.viewMode;
        const last = state.sprinkles[state.sprinkles.length - 1];
        if (last) {
          const lwp = resolveItemWorldPos(last, viewMode);
          if (lwp && Math.hypot(px - lwp.x, py - lwp.y) < 14) return;
        }
        const ashColors = ['#B89352', '#8C6D3B', '#D4B272', '#5E4828'];
        const goldColors = ['#F9D968', '#E5B83B', '#FFF0A8'];
        const t = state.activeDecorTool.id;

        for (let i = 0; i < 2; i++) {
          const sx = px + (Math.random() - 0.5) * 24, sy = py + (Math.random() - 0.5) * 16;
          const surf = worldToSurface(sx, sy);
          state.sprinkles.push({
            type: t, x: sx, y: sy,
            surface: surf ? surf.surface : undefined,
            u: surf ? surf.u : undefined,
            v: surf ? surf.v : undefined,
            size: t === 'sprinkle_pearl' ? 3.5 + Math.random() * 2 : 4 + Math.random() * 2.5,
            angle: Math.random() * Math.PI * 2,
            color: t === 'sprinkle_gold' ? goldColors[Math.floor(Math.random() * goldColors.length)] : ashColors[Math.floor(Math.random() * ashColors.length)]
          });
        }
        sfx.playPop(740);
        updatePromptAndProgress();
      }

      function startKilnFiring(kilnId) {
        state.kilnType = kilnId || state.kilnType || 'oxidizing';
        state.kilnPhase = 'firing';
        state.kilnProgress = 0;
        state.isFired = false;
        sfx.playPop(360);
        updateUI();
      }

      /* ============================================================================
       * 9. UI 面板、视频同款右侧刷具浮窗（毛笔/中刷/大刷/水笔）与状态同步
       * ============================================================================ */
      const promptTextEl = document.getElementById('promptText');
      const promptBadgeEl = document.getElementById('promptBadge');
      const progressFillEl = document.getElementById('progressFill');
      const subTabsEl = document.getElementById('subTabs');
      const optionsScrollEl = document.getElementById('optionsScroll');
      const floatingToolsEl = document.getElementById('floatingTools');
      const prevStepBtn = document.getElementById('prevStepBtn');
      const nextStepBtn = document.getElementById('nextStepBtn');
      const nextStepText = document.getElementById('nextStepText');
      const selectionToolbar = document.getElementById('selectionToolbar');

      function updatePromptAndProgress() {
        ensureBrushState();
        let text = '';
        let badge = '';
        let pct = 0;

        if (state.step === 0) {
          text = '选一件喜欢的器物 · 先让形制决定光泽如何停留（左右滑动可旋转素胎）';
          badge = `${state.vessel.name} · ${state.spongeFlavor.name}`;
          pct = 100;
        } else if (state.step === 1) {
          const bName = state.brushSize <= 16 ? '毛笔' : (state.brushSize <= 26 ? '中刷' : '大刷');
          if (state.subTab === 'spatula') {
            text = '执清水笔在两种釉色交界处来回轻扫，将生硬边界自然晕染为水彩窑变渐变';
            badge = `水笔 · ${(state.spatulaMode || SPATULA_MODES[0]).name}`;
            pct = 100;
          } else if (state.subTab === 'sauce') {
            text = '执小狼毫在胎面自由勾勒青花或铁锈花细线';
            badge = '釉下彩细描';
            pct = 100;
          } else if (state.subTab === 'drip' && state.dripGlaze.color) {
            text = '沿着瓶肩或口沿左右滑动，预涂高温入窑后会垂流成泪痕的厚积釉';
            badge = '厚积流釉';
            pct = 100;
          } else {
            text = state.roughCoverage < 0.1
              ? '让釉色在表面停一会儿 · 自由换色叠刷，同处多刷会更浓'
              : `当前釉色：${state.frostingColor.name} · ${bName}，可以换色叠刷或用清水笔晕染`;
            badge = `已刷釉 ${Math.round(state.roughCoverage * 100)}%`;
            pct = Math.max(15, state.roughCoverage * 100);
          }
        } else if (state.step === 2) {
          if (state.subTab === 'carve') {
            text = '执陶艺刻刀在器身直接滑动刻划，真实刻出凹槽与刀口脊线（开启对称可车出整圈暗纹）';
            badge = `已刻划 ${state.carveCount || 0} 刀`;
            pct = Math.min(100, ((state.carveCount || 0) * 3) + state.pipings.length * 8);
          } else {
            text = '在器身或碗心点击印刻古瓷暗纹，同步压出立体阴刻凹槽';
            badge = `暗刻 ${state.pipings.length} 处`;
            pct = Math.min(100, ((state.carveCount || 0) * 3) + state.pipings.length * 8);
          }
        } else if (state.step === 3) {
          if (state.subTab === 'ears') {
            text = '为瓶身对称装配古瓷双耳，自动随釉色与肩线融合（茶碗为敞口不装耳）';
            badge = state.vesselEar && state.vesselEar !== 'none' ? '已配双耳' : '素身无耳';
          } else if (state.activeDecorTool.mode === 'scatter') {
            text = '在瓷胎表面滑动，挥洒兔毫银星、金箔星斑或松柴落灰';
            badge = `金星 ${state.sprinkles.length} 处`;
          } else {
            text = '点击器身直接将青花、铁绘或双鱼纹拓印溶入釉面（随曲面光影与窑火共变）';
            badge = `已拓印 ${state.carveCount || 0} 处`;
          }
          pct = Math.min(100, ((state.carveCount || 0) * 10) + state.sprinkles.length * 4);
        } else if (state.step === 4) {
          text = '翻转器底篆刻朱文窑款，并在收藏木匣内亲手毛笔落款题跋';
          badge = state.card.hasPlaque ? '已刻底款' : '待刻底款';
          pct = state.card.hasPlaque ? 100 : 50;
        } else if (state.step === 5) {
          if (state.kilnPhase === 'select') {
            text = '选择窑火 · 选一种火，静候它把釉色烧成自己的样子';
            badge = '待入窑';
            pct = 20;
          } else if (state.kilnPhase === 'firing') {
            const kf = KILN_FIRES.find(k => k.id === state.kilnType) || KILN_FIRES[0];
            text = `${kf.name} · 正在烧制（1280°C 高温瓷化流釉中，点击窑门可鼓风添柴）`;
            badge = `${Math.round(state.kilnProgress)}%`;
            pct = state.kilnProgress;
          } else {
            const app = getPorcelainAppraisal();
            text = `这一件，只发生一次 · 「${app.title}」 ${app.subtitle}`;
            badge = '窑火已息';
            pct = 100;
          }
        }

        promptTextEl.textContent = text;
        promptBadgeEl.textContent = badge;
        progressFillEl.style.width = `${Math.min(100, Math.max(0, pct))}%`;
      }

      function updateSelectionToolbar() {
        if (state.step === 3 && state.selectedDecorUid) selectionToolbar.classList.remove('hidden');
        else selectionToolbar.classList.add('hidden');
      }

      // 绘制视频 00:00 同款的器物极简矢量缩略图标
      function createVesselThumbCanvas(vessel) {
        const c = document.createElement('canvas');
        c.width = 48; c.height = 52;
        const cctx = c.getContext('2d');
        cctx.fillStyle = '#B8CCC2';
        cctx.strokeStyle = '#4B6B5C';
        cctx.lineWidth = 1.5;
        cctx.beginPath();
        const topY = 8, botY = 44, h = botY - topY;
        for (let i = 0; i <= 20; i++) {
          const v = i / 20, rx = (getVesselRadiusAtV(vessel, v) / vessel.maxRx) * 16;
          if (i === 0) cctx.moveTo(24 + rx, topY + v * h);
          else cctx.lineTo(24 + rx, topY + v * h);
        }
        for (let i = 20; i >= 0; i--) {
          const v = i / 20, rx = (getVesselRadiusAtV(vessel, v) / vessel.maxRx) * 16;
          cctx.lineTo(24 - rx, topY + v * h);
        }
        cctx.closePath();
        cctx.fill();
        cctx.stroke();
        c.style.width = '34px'; c.style.height = '36px';
        return c;
      }

      function createDecorThumbCanvas(type) {
        const c = document.createElement('canvas');
        c.width = 56; c.height = 56;
        const cctx = c.getContext('2d');
        if (type.startsWith('sprinkle_')) {
          const colors = type === 'sprinkle_gold' ? ['#F9D968', '#E5B83B'] : ['#97B8B2', '#8C6E9E', '#B89352'];
          for (let i = 0; i < 12; i++) {
            cctx.fillStyle = colors[i % colors.length];
            cctx.beginPath();
            cctx.arc(14 + (i % 4) * 9, 15 + Math.floor(i / 4) * 11, 3.5, 0, Math.PI * 2);
            cctx.fill();
          }
        } else {
          drawDecorationItem(cctx, { type, x: 28, y: 31, scale: 0.9, rot: 0 }, 0);
        }
        c.style.width = '36px'; c.style.height = '36px';
        return c;
      }

      function createPipingThumbCanvas(nozzleId) {
        const c = document.createElement('canvas');
        c.width = 52; c.height = 52;
        const cctx = c.getContext('2d');
        drawPipingDollop(cctx, { x: 26, y: 28, nozzleId, color: state.pipingColor, scale: 1.05, angle: 0 });
        c.style.width = '34px'; c.style.height = '34px';
        return c;
      }

      // 视频 00:05 同款：右侧竖排刷具架（毛笔·细 / 中刷·顺手 / 大刷·铺 / 水笔·晕染）
      function buildVideoBrushRack() {
        const rack = document.createElement('div');
        rack.className = 'brush-rack';
        const title = document.createElement('div');
        title.className = 'brush-rack-title';
        title.textContent = '刷子';
        rack.appendChild(title);

        const brushes = [
          { name: '毛笔', sub: '细', size: 15, tab: 'frostColor', w: 10 },
          { name: '中刷', sub: '顺手', size: 24, tab: 'frostColor', w: 15 },
          { name: '大刷', sub: '铺', size: 36, tab: 'frostColor', w: 20 },
          { name: '水笔', sub: '晕染', size: 28, tab: 'spatula', w: 16 }
        ];
        brushes.forEach(b => {
          const isAct = (b.tab === 'spatula' && state.subTab === 'spatula') ||
            (b.tab === 'frostColor' && state.subTab !== 'spatula' && state.brushSize === b.size);
          const item = document.createElement('div');
          item.className = `brush-item ${isAct ? 'active' : ''}`;
          item.innerHTML =
            `<div class="brush-item-circle"><div style="width:${b.w}px;height:4px;border-radius:3px;background:${b.tab === 'spatula' ? '#78A392' : '#4E6B5D'};transform:rotate(-28deg);"></div></div>` +
            `<span class="brush-item-name">${b.name}</span>` +
            `<span class="brush-item-sub">${b.sub}</span>`;
          item.onclick = () => {
            state.brushSize = b.size;
            state.subTab = b.tab;
            sfx.playPop(540);
            updateUI();
          };
          rack.appendChild(item);
        });
        return rack;
      }

      function updateUI() {
        ensureBrushState();

        document.querySelectorAll('#stepperBar .step-item').forEach(el => {
          const s = Number(el.dataset.step);
          el.classList.toggle('active', s === state.step);
          el.classList.toggle('done', s < state.step);
        });

        updatePromptAndProgress();
        updateSelectionToolbar();
        updateCameraControlsUI();

        floatingToolsEl.innerHTML = '';
        if (state.step === 1) {
          // 自由重刷按钮（视频右上角同款）
          const resetGlazeBtn = document.createElement('button');
          resetGlazeBtn.className = 'float-pill';
          resetGlazeBtn.textContent = '自由重刷';

       * 10. 压感毛笔手写花押画板与《名窑珍藏图录》海报合成导出

      const cardModal = document.getElementById('cardModal');
      const sigCanvas = document.getElementById('sigCanvas');
      const sigCtx = sigCanvas.getContext('2d');
      let sigDrawing = false;

      function initSignaturePad() {
        sigCtx.strokeStyle = '#26231F';
        sigCtx.lineCap = 'round';
        sigCtx.lineJoin = 'round';
        let lastPt = null, lastTime = 0, lastW = 3.4;

        const getSigPos = (e) => {
          const r = sigCanvas.getBoundingClientRect();
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          return { x: (cx - r.left) * (sigCanvas.width / r.width), y: (cy - r.top) * (sigCanvas.height / r.height) };
        };

        sigCanvas.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          sigDrawing = true;
          lastPt = getSigPos(e);
          lastTime = performance.now();
          lastW = 3.6;
        });
        sigCanvas.addEventListener('pointermove', (e) => {
          if (!sigDrawing || !lastPt) return;
          e.preventDefault();
          const p = getSigPos(e), now = performance.now();
          const vel = Math.hypot(p.x - lastPt.x, p.y - lastPt.y) / Math.max(1, now - lastTime);
          const curW = lastW + (Math.max(1.3, Math.min(5.2, 4.8 - vel * 2.2)) - lastW) * 0.35;
          sigCtx.lineWidth = curW;
          sigCtx.beginPath();
          sigCtx.moveTo(lastPt.x, lastPt.y);
          sigCtx.lineTo(p.x, p.y);
          sigCtx.stroke();
          lastPt = p; lastTime = now; lastW = curW;
        });
        window.addEventListener('pointerup', () => { sigDrawing = false; lastPt = null; });
        document.getElementById('clearSigBtn').onclick = () => { sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); sfx.playPop(400); };
      }

      function openCardModal() {
        cardModal.classList.add('show');
        sfx.playPop(520);
      }

      /* ============================================================================
       * 11. 绑定页面按钮事件与步骤跳转
       * ============================================================================ */
      function bindEvents() {
        canvas.addEventListener('pointerdown', handlePointerDown);
        canvas.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        window.addEventListener('pointercancel', handlePointerUp);
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          const raw = getRawCanvasPos(e);
          setCameraZoom(state.camera.targetZoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12), raw.rawX, raw.rawY, false);
        }, { passive: false });

        window.addEventListener('keydown', (e) => {

        function sendHostRpc(reqType, resType, payload) {
          return new Promise((resolve, reject) => {
            const reqId = `porcelain_rpc_${Date.now()}_${++rpcSeq}`;
            const timer = setTimeout(() => { delete pendingRpcs[reqId]; reject(new Error('与宿主通信超时')); }, 50000);
            pendingRpcs[reqId] = { resType, resolve, reject, timer };
            window.parent.postMessage({ type: reqType, requestId: reqId, payload: Object.assign({ edition: EDITION }, payload || {}) }, '*');
          });

        window.addEventListener('message', (ev) => {
          const data = ev && ev.data;

            const p = data.payload || {};
            coop.characters = Array.isArray(p.characters) ? p.characters : [];
            coop.userName = p.userName || '清赏客';
            const opts = coop.characters.length > 0

            syncCoopBarUI();
            return;

          if (data.requestId && pendingRpcs[data.requestId]) {
            const entry = pendingRpcs[data.requestId];

            if (data.error) entry.reject(new Error(data.error));

        function loadSvgToImage(svgStr, onLoaded, onFailed) {
          if (!svgStr || typeof svgStr !== 'string') { if (typeof onFailed === 'function') onFailed(); return; }
          let safeSvg = svgStr.trim();
          if (!/<svg[^>]*\swidth\s*=/i.test(safeSvg)) {
            safeSvg = safeSvg.replace(/<svg\b/i, '<svg width="320" height="80"');
          }
          const tryDataUri = () => {
            try {
              const img = new Image();
              img.onload = () => { if (typeof onLoaded === 'function') onLoaded(img); };
              img.onerror = () => { if (typeof onFailed === 'function') onFailed(); };
              img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(safeSvg);
            } catch (_) { if (typeof onFailed === 'function') onFailed(); }
          };
          try {
            if (typeof Blob !== 'undefined' && typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function') {
              const blob = new Blob([safeSvg], { type: 'image/svg+xml;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const img = new Image();
              img.onload = () => { try { URL.revokeObjectURL(url); } catch (_) {} if (typeof onLoaded === 'function') onLoaded(img); };
              img.onerror = () => { try { URL.revokeObjectURL(url); } catch (_) {} tryDataUri(); };
              img.src = url;
              return;
            }
          } catch (_) {}
          tryDataUri();
        }
