<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>寻窑记 · 古法瓷器施釉与窑变工坊</title>
  <style>
    :root {
      --bg-cream: #F2EFE9;
      --bg-peach: #E5DFD3;
      --panel-bg: rgba(247, 244, 238, 0.96);
      --brown-dark: #26231F;
      --brown-mid: #6E685F;
      --brown-light: #A39C91;
      --accent-coral: #587868;
      --accent-coral-dark: #425D4F;
      --accent-gold: #B88B4A;
      --accent-green: #587868;
      --border-warm: #DCD6CA;
      --shadow-warm: 0 8px 24px rgba(60, 52, 42, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #FAF8F5 0%, var(--bg-cream) 58%, var(--bg-peach) 100%);
      font-family: "Songti SC", "STSong", "Noto Serif SC", -apple-system, BlinkMacSystemFont, "PingFang SC", serif;
      color: var(--brown-dark);
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 520px;
      height: 100%;
      margin: 0 auto;
      position: relative;
      box-shadow: 0 0 40px rgba(60, 52, 42, 0.08);
    }

    .top-header {
      flex-shrink: 0;
      padding: 10px 14px 6px;
      background: rgba(246, 243, 237, 0.90);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-warm);
      z-index: 20;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--brown-dark);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border-warm);
      background: #FAF8F4;
      color: var(--brown-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: var(--bg-cream);
    }

    .stepper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      padding: 0 4px;
    }

    .stepper::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 20px;
      right: 20px;
      height: 1.5px;
      background: var(--border-warm);
      z-index: 0;
    }

    .step-item {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      opacity: 0.55;
      transition: all 0.25s;
    }

    .step-item.active,
    .step-item.done {
      opacity: 1;
    }

    .step-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #FAF8F4;
      border: 1.8px solid var(--border-warm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--brown-mid);
      transition: all 0.25s;
    }

    .step-item.active .step-dot {
      background: var(--accent-coral);
      border-color: var(--accent-coral);
      color: #FFF;
      transform: scale(1.12);
      box-shadow: 0 3px 10px rgba(88, 120, 104, 0.35);
    }

    .step-item.done .step-dot {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: #FFF;
    }

    .step-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--brown-mid);
    }

    .step-item.active .step-label {
      color: var(--accent-coral-dark);
      font-weight: 700;
    }

    .prompt-bar {
      flex-shrink: 0;
      margin: 8px 14px 0;
      padding: 8px 12px;
      background: rgba(252, 250, 246, 0.88);
      border: 1px solid var(--border-warm);
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(60, 52, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 15;
    }

    .prompt-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--brown-dark);
      gap: 8px;
    }

    .prompt-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #E3EAE5;
      color: var(--accent-coral-dark);
      font-weight: 700;
      white-space: nowrap;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: #E5E0D6;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8BA899, var(--accent-coral));
      border-radius: 4px;
      transition: width 0.15s ease-out;
    }

    .stage-wrap {
      flex: 1 1 0;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #cakeCanvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      aspect-ratio: 720 / 760;
      touch-action: none;
      display: block;
    }

    .stage-floating-tools {
      position: absolute;
      top: 8px;
      right: 10px;
      max-height: calc(100% - 14px);
      overflow-y: auto;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 12;
      align-items: flex-end;
      padding-bottom: 4px;
    }

    .stage-floating-tools::-webkit-scrollbar {
      display: none;
    }

    .stage-camera-controls {
      position: absolute;
      top: 10px;
      left: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 12;
    }

    .zoom-group {
      display: flex;
      align-items: center;
      background: rgba(252, 250, 246, 0.92);
      border: 1px solid var(--border-warm);
      border-radius: 18px;
      box-shadow: 0 4px 10px rgba(60, 52, 42, 0.06);
      overflow: hidden;
    }

    .zoom-btn {
      border: none;
      background: transparent;
      color: var(--brown-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 8px;
      cursor: pointer;
      min-width: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-btn:active {
      background: var(--bg-cream);
    }

    .zoom-readout {
      font-size: 11px;
      font-weight: 700;
      color: var(--brown-mid);
      padding: 4px 6px;
      border-left: 1px solid var(--border-warm);
      border-right: 1px solid var(--border-warm);
      cursor: pointer;
      min-width: 44px;
      text-align: center;
    }

    .float-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 11px;
      border-radius: 18px;
      background: rgba(252, 250, 246, 0.92);
      border: 1px solid var(--border-warm);
      box-shadow: 0 4px 10px rgba(60, 52, 42, 0.06);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--brown-dark);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .float-pill:active {
      transform: scale(0.94);
    }

    .float-pill.active {
      background: var(--accent-coral);
      color: #FFF;
      border-color: var(--accent-coral);
    }

    /* 紧凑 2×2 刷具盒浮窗（移动端完整显示全部四支刷子，不被底部裁切） */
    .brush-rack {
      background: rgba(250, 248, 243, 0.94);
      border: 1px solid var(--border-warm);
      border-radius: 14px;
      padding: 6px 6px;
      display: grid;
      grid-template-columns: repeat(2, auto);
      justify-items: center;
      gap: 4px 5px;
      box-shadow: 0 4px 14px rgba(60, 52, 42, 0.07);
    }

    .brush-rack-title {
      grid-column: 1 / -1;
      font-size: 10px;
      color: var(--brown-light);
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
    }

    .brush-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5px;
      cursor: pointer;
      padding: 2px 3px;
      border-radius: 9px;
      transition: all 0.2s;
    }

    .brush-item-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--border-warm);
      background: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .brush-item.active .brush-item-circle {
      border-color: var(--accent-coral);
      background: #E3ECE6;
      box-shadow: 0 0 0 2px rgba(88, 120, 104, 0.2);
    }

    .brush-item-name {
      font-size: 10px;
      font-weight: 700;
      color: var(--brown-dark);
    }

    .brush-item-sub {
      font-size: 8.5px;
      color: var(--brown-light);
    }

    .selection-toolbar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(252, 250, 246, 0.96);
      border: 1px solid var(--border-warm);
      border-radius: 22px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(60, 52, 42, 0.14);
      z-index: 15;
    }

    .sel-btn {
      padding: 5px 10px;
      border-radius: 14px;
      border: 1px solid var(--border-warm);
      background: #FFF;
      font-size: 11px;
      font-weight: 600;
      color: var(--brown-dark);
      cursor: pointer;
      font-family: inherit;
    }

    .sel-btn.danger {
      color: #B83B2A;
      border-color: #E8C5BE;
      background: #FFF5F3;
    }

    .bottom-dock {
      flex-shrink: 0;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-warm);
      border-radius: 22px 22px 0 0;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -6px 24px rgba(60, 52, 42, 0.06);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sub-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .sub-tabs::-webkit-scrollbar {
      display: none;
    }

    .sub-tab {
      padding: 5px 12px;
      border-radius: 14px;
      background: #E6E1D7;
      color: var(--brown-mid);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .sub-tab.active {
      background: #FFF;
      color: var(--accent-coral-dark);
      border-color: var(--accent-coral);
      box-shadow: 0 2px 8px rgba(88, 120, 104, 0.15);
    }

    .options-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px;
      scrollbar-width: none;
      min-height: 68px;
      align-items: center;
    }

    .options-scroll::-webkit-scrollbar {
      display: none;
    }

    .option-card {
      flex: 0 0 auto;
      min-width: 68px;
      padding: 7px 9px;
      border-radius: 14px;
      background: #FAF8F4;
      border: 1.8px solid var(--border-warm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-card.active {
      border-color: var(--accent-coral);
      background: #E4ECE7;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(88, 120, 104, 0.16);
    }

    .swatch-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      position: relative;
    }

    .option-thumb {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-name {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--brown-dark);
      white-space: nowrap;
    }

    .option-sub {
      font-size: 9.5px;
      color: var(--brown-mid);
      white-space: nowrap;
    }

    .dock-footer {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-secondary {
      padding: 11px 16px;
      border-radius: 22px;
      border: 1.5px solid var(--border-warm);
      background: #FAF8F4;
      color: var(--brown-mid);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn-primary {
      flex: 1;
      padding: 12px 18px;
      border-radius: 24px;
      border: none;
      background: linear-gradient(135deg, #698B7A 0%, var(--accent-coral) 100%);
      color: #FFF;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
      box-shadow: 0 6px 16px rgba(88, 120, 104, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(38, 35, 31, 0.48);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .card-modal {
      width: 100%;
      max-width: 420px;
      background: #FAF8F4;
      border-radius: 24px;
      border: 2px solid var(--border-warm);
      padding: 16px;
      box-shadow: 0 20px 50px rgba(38, 35, 31, 0.28);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 92dvh;
      overflow-y: auto;
    }

    .card-preview-box {
      border-radius: 16px;
      padding: 16px;
      position: relative;
      transition: all 0.3s;
      border: 2px solid #CFC6B6;
      background: #F5F2EB;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.6);
    }

    .card-theme-0 {
      background: linear-gradient(145deg, #F5F7F5 0%, #E0E8E3 100%);
      border-color: #96B0A2;
    }

    .card-theme-1 {
      background: linear-gradient(145deg, #FFFDF8 0%, #F2E8D5 100%);
      border-color: #D4BC94;
    }

    .card-theme-2 {
      background: linear-gradient(145deg, #F7F3F8 0%, #E6DDEC 100%);
      border-color: #B5A3C2;
    }

    .card-theme-3 {
      background: linear-gradient(145deg, #FBF5F2 0%, #F0DCD4 100%);
      border-color: #CFA093;
    }

    .card-input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-input,
    .card-textarea {
      width: 100%;
      border: 1px solid rgba(110, 104, 95, 0.28);
      background: rgba(255, 255, 255, 0.82);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      color: var(--brown-dark);
      font-family: inherit;
      outline: none;
    }

    .card-textarea {
      resize: none;
      height: 64px;
      line-height: 1.5;
    }

    .preset-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .preset-chips::-webkit-scrollbar {
      display: none;
    }

    .preset-chip {
      padding: 4px 10px;
      border-radius: 12px;
      background: #E6E1D7;
      color: var(--brown-mid);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .sig-pad-wrap {
      margin-top: 4px;
      border: 1px dashed var(--brown-light);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.72);
      position: relative;
      height: 76px;
      overflow: hidden;
    }

    #sigCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }

    .sig-hint {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 10.5px;
      color: var(--brown-light);
      pointer-events: none;
    }

    .sig-clear {
      position: absolute;
      top: 5px;
      right: 6px;
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 8px;
      background: #FFF;
      border: 1px solid var(--border-warm);
      color: var(--brown-mid);
      cursor: pointer;
    }

    .poster-img {
      width: 100%;
      border-radius: 16px;
      border: 2px solid var(--border-warm);
      box-shadow: 0 8px 25px rgba(38, 35, 31, 0.15);
    }

    .hidden {
      display: none !important;
    }

    @media (max-height: 740px) {
      .top-header {
        padding: 6px 12px 4px;
      }

      .header-row {
        margin-bottom: 4px;
      }

      .prompt-bar {
        margin: 5px 10px 0;
        padding: 6px 10px;
        gap: 4px;
      }

      .prompt-top {
        font-size: 11.5px;
      }

      .bottom-dock {
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
        gap: 6px;
        border-radius: 18px 18px 0 0;
      }

      .options-scroll {
        min-height: 54px;
        padding: 2px;
        gap: 8px;
      }

      .option-card {
        min-width: 58px;
        padding: 5px 6px;
        gap: 3px;
      }

      .swatch-circle {
        width: 24px;
        height: 24px;
      }

      .option-thumb {
        width: 30px;
        height: 30px;
      }

      .btn-primary,
      .btn-secondary {
        padding: 9px 14px;
        font-size: 13px;
      }
    }

    /* ===== 传讯名士共创桥接样式 ===== */
    .coop-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 1px;
    }

    .coop-bar::-webkit-scrollbar {
      display: none;
    }

    .coop-select {
      flex: 0 0 auto;
      max-width: 112px;
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid var(--border-warm);
      background: #FAF8F4;
      color: var(--brown-dark);
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      outline: none;
    }

    .coop-btn {
      flex: 0 0 auto;
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid #96B0A2;
      background: linear-gradient(135deg, #F4F7F5 0%, #E0EAE4 100%);
      color: #3A5447;
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .coop-btn.primary {
      background: linear-gradient(135deg, #698B7A 0%, #425D4F 100%);
      color: #FFF;
      border-color: #425D4F;
    }

    .coop-speaker-pill {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 18;
      display: none;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid #96B0A2;
      background: rgba(248, 250, 248, 0.94);
      color: #3A5447;
      box-shadow: 0 4px 12px rgba(45, 58, 50, 0.14);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .coop-speaker-pill.show {
      display: inline-flex;
    }

    .coop-bubble {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 19;
      background: rgba(250, 248, 244, 0.97);
      border: 1.5px solid #96B0A2;
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 10px 26px rgba(45, 58, 50, 0.22);
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .coop-bubble.show {
      display: flex;
    }

    .poster-view-tabs {
      display: none;
      width: 100%;
      background: #E6E1D7;
      border-radius: 12px;
      padding: 3px;
      gap: 4px;
    }

    .poster-view-tabs.show {
      display: flex;
    }

    .poster-tab-btn {
      flex: 1;
      border: none;
      border-radius: 9px;
      padding: 6px 8px;
      background: transparent;
      color: var(--brown-mid);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .poster-tab-btn.active {
      background: #FAF8F4;

  <script>
    (() => {
      /* ============================================================================
       * 1. 陶瓷声学合成引擎 (Web Audio API：羊毫刷釉、清水晕染、窑火熊熊与开片清音)
       * ============================================================================ */
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.enabled = true;
          this.lastSwish = 0;
        }
        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }
        playPop(freq = 640) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.38, now + 0.08);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        }
        playSwish() {
          if (!this.enabled) return;
          const nowMs = performance.now();
          if (nowMs - this.lastSwish < 85) return;
          this.lastSwish = nowMs;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(210 + Math.random() * 70, now);
          osc.frequency.exponentialRampToValueAtTime(135, now + 0.07);
          gain.gain.setValueAtTime(0.035, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        }
        playScrape(speed = 1) {
          if (!this.enabled) return;
          const nowMs = performance.now();
          if (nowMs - this.lastSwish < 70) return;
          this.lastSwish = nowMs;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const dur = 0.08;
          const sampleCount = Math.floor(this.ctx.sampleRate * dur);
          const buffer = this.ctx.createBuffer(1, sampleCount, this.ctx.sampleRate);
          const ch = buffer.getChannelData(0);
          for (let i = 0; i < sampleCount; i++) ch[i] = (Math.random() * 2 - 1) * 0.4;
          const src = this.ctx.createBufferSource();
          src.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(Math.max(380, Math.min(980, 460 + speed * 26)), now);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.032, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          src.start(now);
          src.stop(now + dur);
        }
        // 陶艺刻刀划过素胎的清脆刻划沙沙声
        playCarve(speed = 1) {
          if (!this.enabled) return;
          const nowMs = performance.now();
          if (nowMs - this.lastSwish < 55) return;
          this.lastSwish = nowMs;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const dur = 0.065;
          const sampleCount = Math.floor(this.ctx.sampleRate * dur);
          const buffer = this.ctx.createBuffer(1, sampleCount, this.ctx.sampleRate);
          const ch = buffer.getChannelData(0);
          for (let i = 0; i < sampleCount; i++) ch[i] = (Math.random() * 2 - 1) * 0.55;
          const src = this.ctx.createBufferSource();
          src.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.Q.setValueAtTime(2.6, now);
          filter.frequency.setValueAtTime(Math.max(1200, Math.min(2600, 1450 + speed * 45)), now);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.045, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          src.start(now);
          src.stop(now + dur);
        }
        // 开窑冷却时的冰裂开片天籁清音 ("叮——")
        playCracklePing() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const freq = 2350 + Math.random() * 850;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.96, now + 0.45);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.46);
        }
        playChime() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 587.33, 659.25, 783.99, 1046.5];
          notes.forEach((n, i) => {
            const now = this.ctx.currentTime + i * 0.075;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(n, now);

      // 根据归一化高度 v ∈ [0, 1] 使用单调三次埃尔米特样条 (Fritsch-Carlson) 计算丝滑无折痕的器物半径 Rx(v)
      function getVesselTangents(vessel) {
        if (vessel._tangents) return vessel._tangents;
        const prof = vessel.profile;
        const n = prof.length;
        const d = new Array(n - 1);
        const m = new Array(n).fill(0);
        for (let i = 0; i < n - 1; i++) {
          d[i] = (prof[i + 1][1] - prof[i][1]) / Math.max(0.0001, prof[i + 1][0] - prof[i][0]);
        }
        m[0] = d[0];
        m[n - 1] = d[n - 2];
        for (let i = 1; i < n - 1; i++) {
          if (d[i - 1] * d[i] <= 0) {
            m[i] = 0;
          } else {
            const w1 = 2 * (prof[i + 1][0] - prof[i][0]) + (prof[i][0] - prof[i - 1][0]);
            const w2 = (prof[i + 1][0] - prof[i][0]) + 2 * (prof[i][0] - prof[i - 1][0]);
            m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
          }
        }
        // Fritsch-Carlson 单调保形约束，杜绝波浪阶梯与过冲
        for (let i = 0; i < n - 1; i++) {
          if (Math.abs(d[i]) < 1e-6) {
            m[i] = 0;
            m[i + 1] = 0;
          } else {
            const a = m[i] / d[i];
            const b = m[i + 1] / d[i];
            const sq = a * a + b * b;
            if (sq > 9) {
              const tau = 3 / Math.sqrt(sq);
              m[i] = tau * a * d[i];
              m[i + 1] = tau * b * d[i];
            }
          }
        }
        vessel._tangents = m;
        return m;
      }

      function getVesselRadiusAtV(vessel, v) {
        const vObj = vessel || HAN_VESSELS[0];
        const prof = vObj.profile || HAN_VESSELS[0].profile;
        const maxRx = vObj.maxRx || 155;
        const cv = Math.max(0, Math.min(1, v));
        const m = getVesselTangents(vObj);
        for (let i = 0; i < prof.length - 1; i++) {
          const x0 = prof[i][0], y0 = prof[i][1];
          const x1 = prof[i + 1][0], y1 = prof[i + 1][1];
          if (cv >= x0 && cv <= x1) {
            const h = Math.max(0.0001, x1 - x0);
            const t = (cv - x0) / h;
            const t2 = t * t, t3 = t2 * t;
            const h00 = 2 * t3 - 3 * t2 + 1;
            const h10 = t3 - 2 * t2 + t;
            const h01 = -2 * t3 + 3 * t2;
            const h11 = t3 - t2;
            const rNorm = h00 * y0 + h10 * h * m[i] + h01 * y1 + h11 * h * m[i + 1];
            return Math.max(8, rNorm * maxRx);
          }
        }
        return prof[prof.length - 1][1] * maxRx;
      }

      function hexToRgb(hex) {
        const clean = (hex || '#E8E3D9').replace('#', '');
        const num = parseInt(clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean, 16);
        return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
      }

      function srgbToLin(c255) {
        const n = c255 / 255;
        return n * n;
      }

      function linToSrgb(lin) {
        const clamped = lin <= 0 ? 0 : (lin >= 1 ? 1 : lin);
        return Math.round(Math.sqrt(clamped) * 255);
      }

      class SurfaceBuffer {
        constructor(width, height, wrapX = false) {
          this.width = width;
          this.height = height;
          this.wrapX = wrapX;
          this.albedo = new Float32Array(width * height * 4);
          this.heightMap = new Float32Array(width * height); // 兼作釉水沉积浓度/厚度场 T ∈ [0.1, 1.0]
          this.canvas = document.createElement('canvas');
          this.canvas.width = width;
          this.canvas.height = height;
          this.ctx = this.canvas.getContext('2d');
          this.imgData = this.ctx.createImageData(width, height);
          this.dirty = null;
        }

        fillBaseColor(hexColor, baseHeight = 0.18) {
          const rgb = hexToRgb(hexColor);
          const lr = srgbToLin(rgb.r);
          const lg = srgbToLin(rgb.g);
          const lb = srgbToLin(rgb.b);
          const w = this.width;
          const total = w * this.height;
          for (let i = 0; i < total; i++) {
            const i4 = i * 4;
            this.albedo[i4] = lr;
            this.albedo[i4 + 1] = lg;
            this.albedo[i4 + 2] = lb;
            this.albedo[i4 + 3] = 1.0;
            const x = i % w;
            const y = (i / w) | 0;
            // 细腻温润的精修素胎（极微弱拉坯弦纹，无粗糙颗粒感）
            const wheelRing = Math.sin(y * 0.35) * 0.0025;
            const grain = (((x * 73856093) ^ (y * 19349663)) & 255) / 255 * 0.003;
            this.heightMap[i] = baseHeight + wheelRing + grain;
          }
          this.rebuildRegion(0, 0, this.width - 1, this.height - 1);
          this.dirty = null;
        }

        markDirty(x0, y0, x1, y1) {
          const w = this.width;
          const h = this.height;
          const cy0 = Math.max(0, Math.floor(y0));
          const cy1 = Math.min(h - 1, Math.ceil(y1));
          let cx0 = Math.floor(x0);
          let cx1 = Math.ceil(x1);
          if (!this.wrapX) {
            cx0 = Math.max(0, cx0);
            cx1 = Math.min(w - 1, cx1);
          } else if (cx0 < 0 || cx1 >= w) {
            cx0 = 0;
            cx1 = w - 1;
          }
          if (!this.dirty) {
            this.dirty = { x0: cx0, y0: cy0, x1: cx1, y1: cy1 };
          } else {
            this.dirty.x0 = Math.min(this.dirty.x0, cx0);
            this.dirty.y0 = Math.min(this.dirty.y0, cy0);
            this.dirty.x1 = Math.max(this.dirty.x1, cx1);
            this.dirty.y1 = Math.max(this.dirty.y1, cy1);
          }
        }

        flushDirty() {
          if (!this.dirty) return;
          const d = this.dirty;
          this.rebuildRegion(d.x0, d.y0, d.x1, d.y1);
          this.dirty = null;
        }

        rebuildRegion(x0, y0, x1, y1) {
          const w = this.width;
          const h = this.height;
          const wrapX = this.wrapX;
          const rx0 = Math.max(0, Math.floor(x0));
          const ry0 = Math.max(0, Math.floor(y0));
          const rx1 = Math.min(w - 1, Math.ceil(x1));
          const ry1 = Math.min(h - 1, Math.ceil(y1));
          const rw = rx1 - rx0 + 1;
          const rh = ry1 - ry0 + 1;
          if (rw <= 0 || rh <= 0) return;

          const data = this.imgData.data;
          const albedo = this.albedo;
          const hm = this.heightMap;

          const lx = -0.58;
          const ly = -0.66;
          const lz = 0.48;
          const bumpStrength = 5.4; // 让暗刻凹槽拥有刀削般清晰的立体受光与反光边

          for (let y = ry0; y <= ry1; y++) {
            const yUp = y > 0 ? y - 1 : 0;
            const yDn = y < h - 1 ? y + 1 : h - 1;
            const rowOff = y * w;
            const rowUp = yUp * w;
            const rowDn = yDn * w;

            for (let x = rx0; x <= rx1; x++) {
              const xL = x > 0 ? x - 1 : (wrapX ? w - 1 : 0);
              const xR = x < w - 1 ? x + 1 : (wrapX ? 0 : w - 1);

              const gx = (hm[rowOff + xR] - hm[rowOff + xL]) * bumpStrength;
              const gy = (hm[rowDn + x] - hm[rowUp + x]) * bumpStrength;

              const invLen = 1 / Math.sqrt(gx * gx + gy * gy + 1);
              const nx = -gx * invLen;
              const ny = -gy * invLen;
              const nz = invLen;

              const ndotl = nx * lx + ny * ly + nz * lz;
              const diff = 0.92 + (ndotl - lz) * 0.36;
              const specBase = Math.max(0, ndotl - 0.54);
              const spec = specBase * specBase * 0.22;

              const idx = rowOff + x;
              const i4 = idx * 4;
              data[i4] = linToSrgb(albedo[i4] * diff + spec);
              data[i4 + 1] = linToSrgb(albedo[i4 + 1] * diff + spec);
              data[i4 + 2] = linToSrgb(albedo[i4 + 2] * diff + spec);
              data[i4 + 3] = 255;
            }
          }

          this.ctx.putImageData(this.imgData, 0, 0, rx0, ry0, rw, rh);
        }

        captureSnapshot() {
          const total = this.width * this.height;
          const packed = new Uint8Array(total * 4);
          const albedo = this.albedo;
          const hm = this.heightMap;
          for (let i = 0; i < total; i++) {
            const i4 = i * 4;
            packed[i4] = linToSrgb(albedo[i4]);
            packed[i4 + 1] = linToSrgb(albedo[i4 + 1]);
            packed[i4 + 2] = linToSrgb(albedo[i4 + 2]);
            packed[i4 + 3] = Math.max(0, Math.min(255, Math.round(hm[i] * 255)));
          }
          return packed;
        }

        restoreSnapshot(packed) {
          if (!packed) return;
          const total = this.width * this.height;
          const albedo = this.albedo;
          const hm = this.heightMap;
          for (let i = 0; i < total; i++) {
            const i4 = i * 4;
            albedo[i4] = srgbToLin(packed[i4]);
            albedo[i4 + 1] = srgbToLin(packed[i4 + 1]);
            albedo[i4 + 2] = srgbToLin(packed[i4 + 2]);
            albedo[i4 + 3] = 1.0;
            hm[i] = packed[i4 + 3] / 255;
          }
          this.rebuildRegion(0, 0, this.width - 1, this.height - 1);
          this.dirty = null;
        }
      }

        const defaultClay = SPONGE_FLAVORS[0];
        return {

          fillings: [
            { spreadProgress: 1, strokes: [], chunks: [], cream: FILLING_CREAMS[0], fruit: FILLING_FRUITS[0] },
            { spreadProgress: 1, strokes: [], chunks: [], cream: FILLING_CREAMS[0], fruit: FILLING_FRUITS[0] }
          ],

          // Step 1: 施釉晕染（支持视频同款“同处多刷更浓”、停留增浓与清水笔晕染）
          frostPhase: 0,
          frostingColor: FROSTING_COLORS[0], // 默认天青釉
          baseCoatColor: { id: 'bisque', name: '素胎', light: defaultClay.top, mid: defaultClay.sideTop, dark: defaultClay.sideBot, shade: defaultClay.crust },
          brushSize: 24, // 毛笔:15, 中刷:24, 大刷:36
          creamStyle: 'sculpt', // 'sculpt': 羊毫留痕 | 'blend': 水润吹釉
          spatulaMode: SPATULA_MODES[0],
          glazeUsageCounts: {},
          surfaceUndoStack: [],
          frostStrokes: [],
          topSurface: (() => {
            const s = new SurfaceBuffer(512, 512, false);
            s.fillBaseColor(defaultClay.sideTop, 0.18);
            return s;
          })(),
          sideSurface: (() => {
            const s = new SurfaceBuffer(1024, 384, true);
            s.fillBaseColor(defaultClay.sideTop, 0.18);
            return s;
          })(),
          roughCoverage: 0,
          smoothProgress: 0,
          turntableAngle: 0,
          wheelSpinning: false,
          dripGlaze: DRIP_GLAZES[0],
          drips: new Array(32).fill(0),

          // Step 2: 暗刻与浮雕纹饰（支持自由刻刀真实刻入胎面高度场 + 印纹暗刻）
          pipingNozzle: PIPING_NOZZLES[0],
          pipingColor: PIPING_COLORS[0],
          pipingSymmetry: true,
          carveTool: 'medium', // 'fine' 细线阴刻 | 'medium' 斜刃刻花 | 'deep' 深雕剔地
          carveCount: 0,
          clayChips: [],
          pipings: [],

          // Step 3: 贴花与金彩
          activeDecorTool: DECOR_ITEMS[0],
          decorations: [],
          sprinkles: [],
          selectedDecorUid: null,

          // Step 4: 器底篆刻底款与木匣题跋
          card: {
            theme: 0,
            to: '致：清赏知音',
            body: '雨过天青云破处，这般颜色做将来。愿此器伴君朝夕。',
            plaqueText: '奉华清赏',
            hasPlaque: false,
            sigDataUrl: null
          },

          // Step 5: 入窑选火烧制与开窑冰裂开片仪式
          kilnType: 'oxidizing',
          kilnPhase: 'select', // 'select' | 'firing' | 'fired'
          kilnProgress: 0,
          isFired: false,
          crackleLines: [],
          crackleRevealCount: 0,
          candlesLit: false,
          wishBlown: false,
          vesselEar: 'none', // 对称立体器耳：'none' | 'ring' 铺首衔环 | 'guan' 宋官贯耳 | 'cloud' 如意云耳
          reliefMode: 'intaglio', // 印模凹凸：'intaglio' 阴刻积釉 | 'emboss' 阳刻浮雕
          smokeParticles: [],
          confettiParticles: [],

          camera: {
            viewMode: 'iso',
            zoom: 1.0,
            panX: 0,
            panY: 0,
            targetZoom: 1.0,
            targetPanX: 0,
            targetPanY: 0
          },

          pointer: {
            down: false,
            x: 360,
            y: 340,
            vx: 0,
            vy: 0,
            activeTool: null,
            growingPipe: null
          }
        };
      }

      /* ============================================================================
       * 4. 旋转体器物 3D 曲面坐标转换与双视角空间投影函数
       * ============================================================================ */
      function getLayerTopY(layerIndex) {
        const vessel = state.vessel || HAN_VESSELS[0];
        if (layerIndex === 2) return vessel.topY;
        const h = (vessel.botY - vessel.topY) / 3;
        return vessel.botY - (layerIndex + 1) * h;
      }

      function getCakeTopY() {
        return (state.vessel || HAN_VESSELS[0]).topY;
      }

      function clampCameraPan(zoom, panX, panY) {
        const maxPan = Math.max(0, (zoom - 0.85) * 290);
        return {
          panX: Math.max(-maxPan, Math.min(maxPan, panX)),
          panY: Math.max(-maxPan, Math.min(maxPan, panY))
        };
      }

      function setCameraZoom(nextZoom, anchorRawX = CW * 0.5, anchorRawY = CH * 0.5, immediate = false) {
        const cam = state.camera;
        const clampedZoom = Math.max(0.85, Math.min(3.0, nextZoom));
        const baseZoom = immediate ? cam.zoom : cam.targetZoom;
        const basePanX = immediate ? cam.panX : cam.targetPanX;
        const basePanY = immediate ? cam.panY : cam.targetPanY;

        const wx = (anchorRawX - CW * 0.5 - basePanX) / baseZoom + CW * 0.5;
        const wy = (anchorRawY - CH * 0.5 - basePanY) / baseZoom + CH * 0.5;
        const rawPanX = anchorRawX - CW * 0.5 - (wx - CW * 0.5) * clampedZoom;
        const rawPanY = anchorRawY - CH * 0.5 - (wy - CH * 0.5) * clampedZoom;
        const clamped = clampCameraPan(clampedZoom, rawPanX, rawPanY);

        cam.targetZoom = clampedZoom;
        cam.targetPanX = clamped.panX;
        cam.targetPanY = clamped.panY;
        if (immediate) {
          cam.zoom = clampedZoom;
          cam.panX = clamped.panX;
          cam.panY = clamped.panY;
        }
        updateCameraControlsUI();
      }

      function resetCamera(keepViewMode = true) {
        const cam = state.camera;
        if (!keepViewMode) cam.viewMode = 'iso';
        cam.targetZoom = 1.0;
        cam.targetPanX = 0;
        cam.targetPanY = 0;
        updateCameraControlsUI();
      }

      function updateCameraControlsUI() {
        const viewBtn = document.getElementById('viewModeBtn');
        const viewLabel = document.getElementById('viewModeLabel');
        const zoomReset = document.getElementById('zoomResetBtn');
        const spinBtn = document.getElementById('wheelSpinBtn');
        const spinLabel = document.getElementById('wheelSpinLabel');
        if (!viewBtn || !viewLabel || !zoomReset) return;
        const isTop = state.camera.viewMode === 'top';
        viewBtn.classList.toggle('active', isTop);
        viewLabel.textContent = isTop ? '切回器身' : '器口俯视';
        zoomReset.textContent = `${Math.round(state.camera.targetZoom * 100)}%`;
        if (spinBtn && spinLabel) {
          spinBtn.classList.toggle('active', Boolean(state.wheelSpinning));
          spinLabel.textContent = state.wheelSpinning ? '转盘: 慢转中' : '转盘: 静止';
        }
      }

      function canvasToWorld(rawX, rawY) {
        const cam = state.camera;
        return {
          x: (rawX - CW * 0.5 - cam.panX) / cam.zoom + CW * 0.5,
          y: (rawY - CH * 0.5 - cam.panY) / cam.zoom + CH * 0.5,
          rawX,
          rawY
        };
      }

      function getRawCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          rawX: (clientX - rect.left) * (CW / rect.width),
          rawY: (clientY - rect.top) * (CH / rect.height)
        };
      }

      function getCanvasPos(e) {
        const raw = getRawCanvasPos(e);
        return canvasToWorld(raw.rawX, raw.rawY);
      }

      function isInsideEllipse(px, py, cx, cy, rx, ry) {
        const dx = (px - cx) / rx;
        const dy = (py - cy) / ry;
        return (dx * dx + dy * dy) <= 1.05;
      }

      // 将世界坐标 (wx, wy) 逆映射至旋转体瓷胎表面 (top 碗心内壁 / side 器身外壁)
      function worldToSurface(wx, wy, viewMode = state.camera.viewMode) {
        const topS = state.topSurface;
        const sideS = state.sideSurface;
        const vessel = state.vessel || HAN_VESSELS[0];

        if (viewMode === 'top') {
          const rawDu = (wx - TOP_VIEW.cx) / TOP_VIEW.r;
          const rawDv = (wy - TOP_VIEW.cy) / TOP_VIEW.r;
          if (rawDu * rawDu + rawDv * rawDv <= 1.02) {
            const cosA = Math.cos(-state.turntableAngle);
            const sinA = Math.sin(-state.turntableAngle);
            const du = rawDu * cosA - rawDv * sinA;
            const dv = rawDu * sinA + rawDv * cosA;
            return {
              surface: 'top',
              buf: topS,
              u: du,
              v: dv,
              px: (du * 0.5 + 0.5) * topS.width,
              py: (dv * 0.5 + 0.5) * topS.height
            };
          }
          return null;
        }

        const cx = CAKE.cx;
        const topY = vessel.topY;
        const botY = vessel.botY;
        const mouthRx = getVesselRadiusAtV(vessel, 0);
        const mouthRy = Math.max(12, mouthRx * (vessel.hasInnerOpening ? 0.32 : 0.24));

        // 1. 优先检测器物口沿/茶碗内壁椭圆
        const rawDu = (wx - cx) / mouthRx;
        const rawDv = (wy - topY) / mouthRy;
        if (rawDu * rawDu + rawDv * rawDv <= 1.02) {
          const cosA = Math.cos(-state.turntableAngle);
          const sinA = Math.sin(-state.turntableAngle);
          const du = rawDu * cosA - rawDv * sinA;
          const dv = rawDu * sinA + rawDv * cosA;
          return {
            surface: 'top',
            buf: topS,
            u: du,
            v: dv,
            px: (du * 0.5 + 0.5) * topS.width,
            py: (dv * 0.5 + 0.5) * topS.height
          };
        }

        // 2. 检测旋转体器身曲面 (v ∈ [0, 1]) —— 与 drawOuterFrosting 严格 1:1 互逆映射，0 像素偏移！
        if (wy >= topY - 8 && wy <= botY + 14) {
          const v = Math.max(0, Math.min(1, (wy - topY) / Math.max(1, botY - topY)));
          const curRx = getVesselRadiusAtV(vessel, v);
          if (Math.abs(wx - cx) <= curRx + 4) {
            const s = Math.max(0, Math.min(1, (wx - (cx - curRx)) / Math.max(1, curRx * 2)));
            const twoPi = Math.PI * 2;
            const normShift = (((-state.turntableAngle % twoPi) + twoPi) % twoPi) / twoPi;
            const u = (normShift + s * 0.5) % 1.0;
            return {
              surface: 'side',
              buf: sideS,
              u,
              v,
              px: u * sideS.width,
              py: v * sideS.height
            };
          }
        }
        return null;
      }

      function surfaceToWorld(surface, u, v, viewMode = state.camera.viewMode) {
        const vessel = state.vessel || HAN_VESSELS[0];
        if (surface === 'top') {
          const cosA = Math.cos(state.turntableAngle);
          const sinA = Math.sin(state.turntableAngle);
          const ru = u * cosA - v * sinA;
          const rv = u * sinA + v * cosA;
          if (viewMode === 'top') {
            return { x: TOP_VIEW.cx + ru * TOP_VIEW.r, y: TOP_VIEW.cy + rv * TOP_VIEW.r };
          }
          const mouthRx = getVesselRadiusAtV(vessel, 0);
          const mouthRy = Math.max(12, mouthRx * (vessel.hasInnerOpening ? 0.32 : 0.24));
          return { x: CAKE.cx + ru * mouthRx, y: vessel.topY + rv * mouthRy };
        }
        if (surface === 'side') {
          if (viewMode === 'top') {
            const twoPi = Math.PI * 2;
            const theta = u * twoPi + state.turntableAngle;
            const rad = TOP_VIEW.r * (0.45 + v * 0.52);
            return { x: TOP_VIEW.cx + Math.cos(theta) * rad, y: TOP_VIEW.cy + Math.sin(theta) * rad };
          }
          const twoPi = Math.PI * 2;
          const normShift = (((-state.turntableAngle % twoPi) + twoPi) % twoPi) / twoPi;
          const rel = (((u - normShift) % 1) + 1) % 1;
          if (rel > 0.505 && rel < 0.995) return null; // 背面不可见
          const s = Math.max(0, Math.min(1, rel / 0.5));
          const curRx = getVesselRadiusAtV(vessel, v);
          const wy = vessel.topY + v * (vessel.botY - vessel.topY);
          return {
            x: CAKE.cx - curRx + s * (curRx * 2),
            y: wy
          };
        }
        return null;
      }

      function resolveItemWorldPos(item, viewMode = state.camera.viewMode) {
        if (item.surface) {
          return surfaceToWorld(item.surface, item.u, item.v, viewMode);
        }
        return { x: item.x, y: item.y };
      }

      /* ============================================================================
       * 5. 3D 旋转体瓷器渲染引擎（素胎生釉 vs 开窑熟釉玻璃高光 + 青砖古窑炉渲染）
       * ============================================================================ */

      // 5.1 绘制极简古宣台面投影与低调辘轳转盘刻度
      function drawCakeStand(ctx, angle) {
        const vessel = state.vessel || HAN_VESSELS[0];
        const cx = CAKE.cx;
        const by = vessel.botY;
        const footRx = getVesselRadiusAtV(vessel, 1.0);

        ctx.save();
        // 视频同款：器物底部柔和接地环境阴影（让梅瓶/茶碗沉稳立于古宣纸上）
        const shadowGrad = ctx.createRadialGradient(cx, by + 6, footRx * 0.3, cx, by + 10, footRx * 1.95);
        shadowGrad.addColorStop(0, 'rgba(42, 36, 28, 0.28)');
        shadowGrad.addColorStop(0.55, 'rgba(42, 36, 28, 0.10)');
        shadowGrad.addColorStop(1, 'rgba(42, 36, 28, 0)');
        ctx.fillStyle = shadowGrad;
        ctx.beginPath();
        ctx.ellipse(cx, by + 8, footRx * 1.9, 28, 0, 0, Math.PI * 2);
        ctx.fill();

        // 当开启转盘旋转或在制胎/刷釉阶段时，绘制极简淡墨转盘同心细环
        if (!state.isFired && state.step <= 3) {
          ctx.strokeStyle = 'rgba(140, 130, 115, 0.24)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.ellipse(cx, by + 6, footRx + 46, 20, 0, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = 'rgba(140, 130, 115, 0.38)';
          for (let i = 0; i < 12; i++) {
            const a = angle + (i * Math.PI * 2) / 12;
            const px = cx + Math.cos(a) * (footRx + 46);
            const py = by + 6 + Math.sin(a) * 20;
            ctx.beginPath();
            ctx.arc(px, py, 1.8, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // 右下角视频同款状态小字（“尚未入窑” / “素胎 · 待上釉” / “窑火已息”）
        ctx.fillStyle = '#9E9689';
        ctx.font = '14px "Songti SC", "PingFang SC", serif';
        ctx.textAlign = 'right';
        const statusLabel = state.isFired
          ? '窑 火 已 息'
          : (state.step === 0 ? '尚 未 入 窑' : (state.roughCoverage > 0.05 ? '已 施 釉 · 待 入 窑' : '素 胎 · 待 上 釉'));
        ctx.fillText(statusLabel, cx + 195, by + 65);
        ctx.restore();
      }

      // 5.15 构建旋转体器物闭合矢量轮廓路径（120 阶单调样条高精度采样，边缘温润如玉）
      function tracePorcelainSilhouette(ctx, vessel) {
        const cx = CAKE.cx;
        const topY = vessel.topY;
        const botY = vessel.botY;
        const totalH = botY - topY;
        const steps = 120;
        const mouthRx = getVesselRadiusAtV(vessel, 0);
        const mouthRy = Math.max(8, mouthRx * (vessel.hasInnerOpening ? 0.28 : 0.16));
        const footRx = getVesselRadiusAtV(vessel, 1.0);
        const footRy = Math.max(8, footRx * 0.20);

        ctx.beginPath();
        // 顶部口沿后半弧
        ctx.ellipse(cx, topY, mouthRx, mouthRy, 0, Math.PI, 0, false);
        // 右侧母线轮廓向下
        for (let i = 1; i <= steps; i++) {
          const v = i / steps;
          const rx = getVesselRadiusAtV(vessel, v);
          const y = topY + v * totalH;
          ctx.lineTo(cx + rx, y);
        }
        // 底部圈足前半弧
        ctx.ellipse(cx, botY, footRx, footRy, 0, 0, Math.PI, false);
        // 左侧母线轮廓向上
        for (let i = steps - 1; i >= 0; i--) {
          const v = i / steps;
          const rx = getVesselRadiusAtV(vessel, v);
          const y = topY + v * totalH;
          ctx.lineTo(cx - rx, y);
        }
        ctx.closePath();
      }

      // 5.25 连续笔触与釉下青花/铁绘线条渲染器
      function traceSmoothPath(ctx, pts) {
        if (!pts || pts.length === 0) return;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        if (pts.length === 1) {
          ctx.lineTo(pts[0].x + 0.5, pts[0].y);
          return;
        }
        for (let i = 1; i < pts.length - 1; i++) {
          const mx = (pts[i].x + pts[i + 1].x) * 0.5;
          const my = (pts[i].y + pts[i + 1].y) * 0.5;
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
        }
        const last = pts[pts.length - 1];
        ctx.lineTo(last.x, last.y);
      }

      function drawRibbedCreamStroke(ctx, stroke) {
        const pts = stroke.points;
        if (!pts || pts.length === 0) return;
        const w = stroke.size || 18;
        const col = stroke.color;

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (stroke.isSauce) {
          // 釉下青花/铁锈花水墨晕染笔触
          ctx.save();
          traceSmoothPath(ctx, pts);
          ctx.strokeStyle = col.color;
          ctx.globalAlpha = state.isFired ? 0.35 : 0.22;
          ctx.lineWidth = w * 0.55;
          ctx.stroke();

          traceSmoothPath(ctx, pts);
          ctx.strokeStyle = col.color;
          ctx.globalAlpha = state.isFired ? 0.88 : 0.72;
          ctx.lineWidth = w * 0.28;
          ctx.stroke();
          ctx.restore();

          if (stroke.shards) {
            stroke.shards.forEach(sh => {
              ctx.save();
              ctx.translate(sh.x, sh.y);
              ctx.rotate(sh.rot);
              ctx.fillStyle = col.highlight || '#E0B453';
              ctx.globalAlpha = 0.75;
              ctx.beginPath();
              ctx.arc(0, 0, sh.w * 0.28, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            });
          }
          ctx.restore();
          return;
        }
        ctx.restore();
      }

      // 5.38 绘制对称生长在器物左右肩线的立体瓷耳（铺首衔环 / 宋官贯耳 / 如意云耳）
      function drawVesselEars(ctx, vessel) {
        const ear = state.vesselEar || 'none';
        if (ear === 'none' || vessel.hasInnerOpening) return; // 茶碗/大口碗不装双耳
        const cx = CAKE.cx;
        const topY = vessel.topY;
        const totalH = vessel.botY - topY;
        const shoulderV = vessel.id === 'jade_lotus' ? 0.34 : 0.24;
        const sy = topY + shoulderV * totalH;
        const rx = getVesselRadiusAtV(vessel, shoulderV);
        const glaze = state.frostingColor || FROSTING_COLORS[0];
        const colLight = state.roughCoverage > 0.05 ? glaze.light : state.spongeFlavor.top;
        const colMid = state.roughCoverage > 0.05 ? glaze.mid : state.spongeFlavor.sideTop;
        const colDark = state.roughCoverage > 0.05 ? glaze.dark : state.spongeFlavor.crust;

        [-1, 1].forEach(side => {
          ctx.save();
          ctx.translate(cx + side * (rx - 2), sy);
          ctx.scale(side, 1);

          const g = ctx.createLinearGradient(0, -24, 24, 28);
          g.addColorStop(0, colLight);
          g.addColorStop(0.55, colMid);
          g.addColorStop(1, colDark);
          ctx.fillStyle = g;
          ctx.strokeStyle = colDark;
          ctx.lineWidth = 1.6;

          if (ear === 'guan') {
            // 宋官窑典雅双贯耳（方管斜贴颈肩）
            ctx.beginPath();
            ctx.moveTo(-4, -20);
            ctx.lineTo(14, -18);
            ctx.quadraticCurveTo(19, -17, 19, -11);
            ctx.lineTo(16, 18);
            ctx.quadraticCurveTo(15, 24, 10, 24);
            ctx.lineTo(-4, 20);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 贯耳中孔
            ctx.fillStyle = 'rgba(42, 36, 28, 0.35)';
            ctx.beginPath();
            ctx.ellipse(9, -16, 4.5, 2.2, 0.1, 0, Math.PI * 2);
            ctx.fill();
          } else if (ear === 'cloud') {
            // 温婉如意卷云耳
            ctx.beginPath();
            ctx.moveTo(-4, -18);
            ctx.bezierCurveTo(22, -26, 28, -4, 16, 8);
            ctx.bezierCurveTo(24, 18, 12, 32, -2, 22);
            ctx.lineTo(-4, 12);
            ctx.bezierCurveTo(8, 16, 12, 6, 4, 2);
            ctx.bezierCurveTo(14, -4, 10, -14, -4, -10);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (ear === 'ring') {
            // 古瓷铺首衔环耳
            ctx.beginPath();
            ctx.roundRect(-5, -14, 15, 16, 5);
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = colMid;
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            ctx.arc(8, 10, 10, -0.4, Math.PI * 1.45);
            ctx.stroke();
            ctx.strokeStyle = colDark;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(8, 10, 12, -0.3, Math.PI * 1.4);
            ctx.stroke();
          }
          ctx.restore();
        });
      }

      // 5.4 核心 3D 瓷器渲染器（支持梅瓶/茶碗/小罐/玉壶春母线贴图映射 + 生釉/熟釉材质跃迁 + 冰裂开片）
      function drawOuterFrosting(ctx) {
        const vessel = state.vessel || HAN_VESSELS[0];
        const clay = state.spongeFlavor || SPONGE_FLAVORS[0];
        const cx = CAKE.cx;
        const topY = vessel.topY;
        const botY = vessel.botY;
        const totalH = botY - topY;
        const topS = state.topSurface;
        const sideS = state.sideSurface;

        topS.flushDirty();
        sideS.flushDirty();

        ctx.save();
        // 先绘制紧贴器物左右肩线的立体对称瓷耳
        drawVesselEars(ctx, vessel);

        // 1. 裁剪在 3D 旋转体器物平滑样条外廓内，执行严格 1:1 水平切片无缝环绕纹理映射
        ctx.save();
        tracePorcelainSilhouette(ctx, vessel);
        ctx.clip();

        const twoPi = Math.PI * 2;
        const normShift = (((-state.turntableAngle % twoPi) + twoPi) % twoPi) / twoPi;
        const srcStartX = normShift * sideS.width;
        const srcSpanW = sideS.width * 0.5; // 正面可见 180° 半周
        const sliceH = 2.6;

        for (let y = topY - 4; y <= botY + 12; y += 2) {
          const v = Math.max(0, Math.min(1, (y - topY) / totalH));
          const rx = getVesselRadiusAtV(vessel, v);
          const sy = Math.min(sideS.height - 2, Math.floor(v * (sideS.height - 1)));
          const destX = cx - rx;
          const destW = rx * 2;

          if (srcStartX + srcSpanW <= sideS.width) {
            ctx.drawImage(sideS.canvas, srcStartX, sy, srcSpanW, 2, destX, y, destW, sliceH);
          } else {
            // 跨 0/W 接缝时自动拆分为左右两段无缝拼接
            const w1 = sideS.width - srcStartX;
            const w2 = srcSpanW - w1;
            const d1 = destW * (w1 / srcSpanW);
            ctx.drawImage(sideS.canvas, srcStartX, sy, w1, 2, destX, y, d1 + 0.6, sliceH);
            ctx.drawImage(sideS.canvas, 0, sy, w2, 2, destX + d1, y, destW - d1, sliceH);
          }
        }

        // 若瓶腹有 AI 名士或玩家绘制的青花/铁绘主纹样，贴合映射在瓶腹中央
        if (state.topSketchImg && state.topSketchImg.complete && state.topSketchImg.naturalWidth > 0) {
          const bellyRx = getVesselRadiusAtV(vessel, 0.45) * 0.72;
          const bellyY = topY + totalH * 0.45;
          ctx.save();
          ctx.globalAlpha = state.isFired ? 0.88 : 0.68;
          ctx.drawImage(state.topSketchImg, cx - bellyRx, bellyY - bellyRx * 0.75, bellyRx * 2, bellyRx * 1.5);
          ctx.restore();
        }

        // 2. 随器物轮廓每行自适应的 3D 工作室柔光阴影（彻底消除竖条色块，展现温润瓷感）
        for (let y = topY - 4; y <= botY + 14; y += 4) {
          const v = Math.max(0, Math.min(1, (y - topY) / totalH));
          const rx = getVesselRadiusAtV(vessel, v) + 2;
          const rowG = ctx.createLinearGradient(cx - rx, y, cx + rx, y);
          rowG.addColorStop(0.00, 'rgba(34, 30, 25, 0.28)');
          rowG.addColorStop(0.10, 'rgba(42, 38, 32, 0.08)');
          rowG.addColorStop(0.28, 'rgba(255, 255, 255, 0.22)');
          rowG.addColorStop(0.54, 'rgba(255, 255, 255, 0.03)');
          rowG.addColorStop(0.84, 'rgba(38, 34, 28, 0.22)');
          rowG.addColorStop(0.95, 'rgba(45, 40, 34, 0.26)');
          rowG.addColorStop(1.00, 'rgba(150, 145, 136, 0.14)'); // 右侧柔和环境反光
          ctx.fillStyle = rowG;
          ctx.fillRect(cx - rx, y, rx * 2, 4.5);
        }

        // 垂直曲率环境光（肩部受光、胫部与足底微收暗）
        const maxRx = vessel.maxRx;
        const vertShade = ctx.createLinearGradient(cx, topY, cx, botY + 12);
        vertShade.addColorStop(0.00, 'rgba(255, 255, 255, 0.12)');
        vertShade.addColorStop(0.26, 'rgba(255, 255, 255, 0.14)');
        vertShade.addColorStop(0.65, 'rgba(0, 0, 0, 0.00)');
        vertShade.addColorStop(0.93, 'rgba(32, 28, 22, 0.22)');
        vertShade.addColorStop(1.00, 'rgba(24, 20, 15, 0.34)');
        ctx.fillStyle = vertShade;
        ctx.fillRect(cx - maxRx - 10, topY - 15, maxRx * 2 + 20, totalH + 35);

        // 3. 弧形瓷器光泽带（入窑前为柔和润泽缎光，开窑后跃迁为清透玻璃玉釉天窗高光）
        ctx.save();
        ctx.beginPath();
        for (let i = 0; i <= 48; i++) {
          const v = 0.06 + (i / 48) * 0.72;
          const rx = getVesselRadiusAtV(vessel, v);
          const hx = cx - rx * 0.48;
          const hy = topY + v * totalH;
          if (i === 0) ctx.moveTo(hx, hy);
          else ctx.lineTo(hx, hy);
        }
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (!state.isFired) {
          // 未入窑：柔和的湿坯/生釉绸缎柔光，让器身显得细腻光滑
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
          ctx.lineWidth = 26;
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.lineWidth = 9;
          ctx.stroke();
        } else {
          // 开窑后：清透玻璃釉天窗弧形高光带
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.42)';
          ctx.lineWidth = 24;
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.78)';
          ctx.lineWidth = 7.5;
          ctx.stroke();
        }
        ctx.restore();

        if (state.isFired) {
          // 开窑后：渐进浮现的蝉翼冰裂开片纹 (Crackle Network)
          if (state.crackleLines && state.crackleRevealCount > 0) {
            ctx.save();
            ctx.strokeStyle = state.spongeFlavor.id === 'hibiscus'
              ? 'rgba(45, 32, 24, 0.38)' // 金丝铁线
              : 'rgba(255, 255, 255, 0.42)'; // 蝉翼冰裂
            ctx.lineWidth = 1.1;
            const limit = Math.min(state.crackleLines.length, state.crackleRevealCount);
            for (let i = 0; i < limit; i++) {
              const cl = state.crackleLines[i];
              ctx.beginPath();
              ctx.moveTo(cl.x1, cl.y1);
              ctx.quadraticCurveTo(cl.cx, cl.cy, cl.x2, cl.y2);
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        // 3.8 器腹名士手绘青花/铁绘简笔画（随陶轮旋转，背面自动隐藏）
        if (state.vesselSketchImg && state.vesselSketchImg.complete && state.vesselSketchImg.naturalWidth > 0) {
          const skPos = surfaceToWorld('side', 0.25, 0.48, 'iso');
          if (skPos) {
            const bellyRx = getVesselRadiusAtV(vessel, 0.48);
            const skSize = Math.min(bellyRx * 1.15, totalH * 0.44);
            ctx.save();
            ctx.globalAlpha = 0.88;
            ctx.shadowColor = 'rgba(38, 35, 31, 0.16)';
            ctx.shadowBlur = 2;
            ctx.drawImage(state.vesselSketchImg, skPos.x - skSize * 0.5, skPos.y - skSize * 0.5, skSize, skSize);
            ctx.restore();
          }
        }

        // 4. 釉下青花/铁绘细线与肩部厚积流釉
        if (state.frostStrokes && state.frostStrokes.length > 0) {
          state.frostStrokes.forEach(st => {
            if (st.isSauce) drawRibbedCreamStroke(ctx, st);
          });
        }
        if (state.dripGlaze && state.dripGlaze.color) {
          const shoulderV = vessel.hasInnerOpening ? 0.02 : 0.22;
          const sRx = getVesselRadiusAtV(vessel, shoulderV);
          const sY = topY + shoulderV * totalH;
          drawGanacheDrip(ctx, cx, sY, sRx, sRx * 0.22, state.dripGlaze);
        }

        // 5. 底部露胎圈足（未施釉的素胎圈足边，体现真实宋瓷“铁足/泥足”细节）
        const footRx = getVesselRadiusAtV(vessel, 1.0);
        const footRy = Math.max(8, footRx * 0.20);
        ctx.strokeStyle = clay.crust;
        ctx.lineWidth = 5.5;
        ctx.beginPath();
        ctx.ellipse(cx, botY, footRx, footRy, 0, 0, Math.PI, false);
        ctx.stroke();

        ctx.restore(); // 结束器身轮廓 clip

        // 6. 绘制器物口沿与内壁（茶碗/小罐展示宽敞内膛，梅瓶/玉壶春展示精致小口与唇边高光）
        const mouthRx = getVesselRadiusAtV(vessel, 0);
        const mouthRy = Math.max(8, mouthRx * (vessel.hasInnerOpening ? 0.28 : 0.16));

        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, topY, mouthRx, mouthRy, 0, 0, Math.PI * 2);
        ctx.clip();

        ctx.save();
        ctx.translate(cx, topY);
        ctx.scale(1, mouthRy / mouthRx);
        ctx.rotate(state.turntableAngle);
        ctx.drawImage(topS.canvas, -mouthRx, -mouthRx, mouthRx * 2, mouthRx * 2);
        ctx.restore();

        // 内膛深处柔和聚光阴影
        const innerShade = ctx.createRadialGradient(cx + 10, topY + 4, 2, cx, topY, mouthRx);
        innerShade.addColorStop(0, 'rgba(30, 26, 22, 0.38)');
        innerShade.addColorStop(0.7, 'rgba(30, 26, 22, 0.12)');
        innerShade.addColorStop(1, 'rgba(255, 255, 255, 0.2)');
        ctx.fillStyle = innerShade;
        ctx.fillRect(cx - mouthRx, topY - mouthRy, mouthRx * 2, mouthRy * 2);
        ctx.restore();

        // 口沿玉唇高光圈
        ctx.strokeStyle = state.isFired ? 'rgba(255, 255, 255, 0.78)' : clay.top;
        ctx.lineWidth = vessel.hasInnerOpening ? 3.2 : 4.2;
        ctx.beginPath();
        ctx.ellipse(cx, topY, mouthRx, mouthRy, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      // 5.45 器口/碗心正俯视圆形视角渲染器
      function drawTopDownCake(ctx) {
        const cx = TOP_VIEW.cx;
        const cy = TOP_VIEW.cy;
        const R = TOP_VIEW.r;
        const vessel = state.vessel || HAN_VESSELS[0];
        const clay = state.spongeFlavor || SPONGE_FLAVORS[0];

        ctx.save();

        const shadowGrad = ctx.createRadialGradient(cx, cy + 8, R * 0.7, cx, cy + 8, R + 68);
        shadowGrad.addColorStop(0, 'rgba(42, 36, 28, 0.24)');
        shadowGrad.addColorStop(1, 'rgba(42, 36, 28, 0)');
        ctx.fillStyle = shadowGrad;
        ctx.beginPath();
        ctx.arc(cx, cy + 8, R + 65, 0, Math.PI * 2);
        ctx.fill();

        // 辘轳转盘外圈
        ctx.strokeStyle = 'rgba(140, 130, 115, 0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, R + 28, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(140, 130, 115, 0.5)';
        for (let i = 0; i < 16; i++) {
          const a = state.turntableAngle + (i * Math.PI * 2) / 16;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * (R + 36), cy + Math.sin(a) * (R + 36), 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        const topS = state.topSurface;
        topS.flushDirty();

        // 器物外圈俯视肩腹边沿
        const rimGrad = ctx.createRadialGradient(cx - 40, cy - 40, R * 0.6, cx, cy, R + 14);
        rimGrad.addColorStop(0, clay.top);
        rimGrad.addColorStop(1, clay.crust);
        ctx.fillStyle = rimGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, R + 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.clip();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(state.turntableAngle);
        ctx.drawImage(topS.canvas, -R, -R, R * 2, R * 2);
        if (state.topSketchImg && state.topSketchImg.complete && state.topSketchImg.naturalWidth > 0) {
          const skR = R * 0.64;
          ctx.globalAlpha = state.isFired ? 0.88 : 0.68;
          ctx.drawImage(state.topSketchImg, -skR, -skR, skR * 2, skR * 2);
        }
        ctx.restore();

        const topLight = ctx.createRadialGradient(cx - 65, cy - 65, 16, cx, cy, R);
        topLight.addColorStop(0, state.isFired ? 'rgba(255, 255, 255, 0.36)' : 'rgba(255, 255, 255, 0.16)');
        topLight.addColorStop(0.6, 'rgba(255, 255, 255, 0)');
        topLight.addColorStop(1, 'rgba(45, 38, 30, 0.16)');
        ctx.fillStyle = topLight;
        ctx.fillRect(cx - R, cy - R, R * 2, R * 2);

        if (state.frostStrokes && state.frostStrokes.length > 0) {
          state.frostStrokes.forEach(st => {
            if (!st.isSauce || !st.points) return;
            const mappedPts = st.points.map(pt => pt.surface ? surfaceToWorld(pt.surface, pt.u, pt.v, 'top') : resolveItemWorldPos(pt, 'top')).filter(Boolean);
            if (mappedPts.length > 0) {
              drawRibbedCreamStroke(ctx, { ...st, points: mappedPts, size: (st.size || 24) * 1.15 });
            }
          });
        }
        ctx.restore();

        if (state.dripGlaze && state.dripGlaze.color) {
          ctx.strokeStyle = state.dripGlaze.color;
          ctx.lineWidth = 11;
          ctx.beginPath();
          ctx.arc(cx, cy, R - 3, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 5.5 绘制肩部/口沿厚积流釉泪痕
      function drawGanacheDrip(ctx, cx, ty, rx, ry, glaze) {
        ctx.save();
        ctx.globalAlpha = state.isFired ? 0.88 : 0.68;
        const numCols = state.drips.length;
        for (let i = 0; i < numCols; i++) {
          const dripLen = state.drips[i];
          if (dripLen <= 2) continue;
          const t = i / (numCols - 1);
          const angle = (0.04 + t * 0.92) * Math.PI;
          const dx = cx + Math.cos(angle) * rx;
          const dy = ty + Math.sin(angle) * ry;
          const w = 6.5 + (i % 3) * 1.6;

          ctx.fillStyle = glaze.color;
          ctx.beginPath();
          ctx.moveTo(dx - w, dy - 3);
          ctx.quadraticCurveTo(dx - w * 0.7, dy + dripLen * 0.6, dx - w * 0.82, dy + dripLen);
          ctx.arc(dx, dy + dripLen, w * 0.82, Math.PI, 0, true);
          ctx.quadraticCurveTo(dx + w * 0.7, dy + dripLen * 0.6, dx + w, dy - 3);
          ctx.closePath();
          ctx.fill();

          if (state.isFired) {
            ctx.fillStyle = glaze.highlight || '#FFFFFF';
            ctx.globalAlpha = 0.65;
            ctx.beginPath();
            ctx.ellipse(dx - w * 0.25, dy + dripLen - 2, 1.8, 4.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.88;
          }
        }
        ctx.restore();
      }

      // 5.6 绘制瓷胎暗刻与浮雕纹样（带阴刻凹陷暗影与右下高光刃边，增强真实瓷雕立体感）
      function drawPipingDollop(ctx, item) {
        const { x, y, nozzleId, color, scale = 1, angle = 0 } = item;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // 阴刻内凹左上暗影 + 右下受光亮边
        ctx.fillStyle = 'rgba(32, 26, 20, 0.22)';
        ctx.beginPath();
        ctx.ellipse(-1.2, -1.2, 14.5, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.42)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.ellipse(1.4, 1.4, 14, 8.5, 0, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();

        if (nozzleId === 'rosette') {
          // 卷云如意暗刻浮雕纹
          ctx.rotate(angle + Math.PI * 0.5);
          const g = ctx.createRadialGradient(-2, -2, 1, 0, 0, 14);
          g.addColorStop(0, color.light);
          g.addColorStop(0.65, color.mid);
          g.addColorStop(1, color.dark);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.bezierCurveTo(14, -12, 16, 4, 5, 8);
          ctx.quadraticCurveTo(0, 10, -5, 8);
          ctx.bezierCurveTo(-16, 4, -14, -12, 0, -10);
          ctx.fill();
          ctx.strokeStyle = color.dark;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(-5, -1, 4, 0, Math.PI * 1.4);
          ctx.moveTo(5, -1);
          ctx.arc(5, -1, 4, -Math.PI * 0.4, Math.PI);
          ctx.stroke();
        } else if (nozzleId === 'shell') {
          // 宋瓷仰覆莲瓣浮雕纹
          ctx.rotate(angle * 0.2);
          const g = ctx.createLinearGradient(0, -14, 0, 12);
          g.addColorStop(0, color.light);
          g.addColorStop(0.6, color.mid);
          g.addColorStop(1, color.dark);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(0, -15);
          ctx.quadraticCurveTo(13, -3, 9, 11);
          ctx.quadraticCurveTo(0, 14, -9, 11);
          ctx.quadraticCurveTo(-13, -3, 0, -15);
          ctx.fill();
          ctx.strokeStyle = color.dark;
          ctx.lineWidth = 1.1;
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(0, 10);
          ctx.stroke();
        } else if (nozzleId === 'pearl') {
          // 联珠鼓钉纹
          const g = ctx.createRadialGradient(-3, -4, 1.5, 0, 0, 11);
          g.addColorStop(0, '#FFFFFF');
          g.addColorStop(0.4, color.light);
          g.addColorStop(0.85, color.mid);
          g.addColorStop(1, color.dark);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, 9.5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // 折枝五瓣梅花纹
          for (let i = 0; i < 5; i++) {
            const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
            const px = Math.cos(a) * 7.5, py = Math.sin(a) * 7.5;
            ctx.fillStyle = color.mid;
            ctx.beginPath();
            ctx.arc(px, py, 5.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = color.dark;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
          ctx.fillStyle = '#E0B453';
          ctx.beginPath();
          ctx.arc(0, 0, 3.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      /* ============================================================================
       * 6. 12 款古瓷贴花、青花釉里红、曜变星斑与观火测温锥渲染器 (零Emoji)
       * ============================================================================ */
      function drawDecorationItem(ctx, item, time = 0) {
        const { type, x, y, scale = 1, rot = 0 } = item;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.rotate(rot);

        switch (type) {
          case 'straw_whole': {
            // 青花折枝梅花
            ctx.strokeStyle = '#24426B';
            ctx.lineWidth = 2.2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-16, 14);
            ctx.quadraticCurveTo(-2, 2, 15, -14);
            ctx.moveTo(-2, 2);
            ctx.lineTo(10, 6);
            ctx.stroke();
            [[-3, -4, 1], [10, -11, 0.72], [9, 6, 0.65]].forEach(([mx, my, ms]) => {
              ctx.save();
              ctx.translate(mx, my);
              ctx.scale(ms, ms);
              for (let i = 0; i < 5; i++) {
                const a = (i * Math.PI * 2) / 5;
                ctx.fillStyle = '#3B6499';
                ctx.beginPath();
                ctx.arc(Math.cos(a) * 6, Math.sin(a) * 6, 4.8, 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.fillStyle = '#E8EFF7';
              ctx.beginPath();
              ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            });
            break;
          }
          case 'straw_half': {
            // 暗刻影青瑞莲瓣
            const pg = ctx.createLinearGradient(0, -18, 0, 16);
            pg.addColorStop(0, '#F2FAF7');
            pg.addColorStop(0.6, '#A9C7C0');
            pg.addColorStop(1, '#587D75');
            ctx.fillStyle = pg;
            ctx.beginPath();
            ctx.moveTo(0, -19);
            ctx.bezierCurveTo(16, -8, 15, 10, 0, 17);
            ctx.bezierCurveTo(-15, 10, -16, -8, 0, -19);
            ctx.fill();
            ctx.strokeStyle = '#4B6E66';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            for (let r = -2; r <= 2; r++) {
              ctx.beginPath();
              ctx.moveTo(0, 14);
              ctx.quadraticCurveTo(r * 4, 0, r * 2.5, -13);
              ctx.stroke();
            }
            break;
          }
          case 'blueberry': {
            // 釉里红石榴纹
            const rg = ctx.createRadialGradient(-4, -3, 2, 0, 2, 16);
            rg.addColorStop(0, '#E39891');
            rg.addColorStop(0.5, '#9E332E');
            rg.addColorStop(1, '#5E1614');
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.arc(0, 3, 14, 0, Math.PI * 2);
            ctx.fill();
            // 石榴顶部花冠口
            ctx.fillStyle = '#7A201D';
            ctx.beginPath();
            ctx.moveTo(-6, -10);
            ctx.lineTo(-3, -17);
            ctx.lineTo(0, -12);
            ctx.lineTo(3, -17);
            ctx.lineTo(6, -10);
            ctx.closePath();
            ctx.fill();
            break;
          }
          case 'fig_slice': {
            // 钧窑玫瑰紫霞斑（自然流动的窑变紫红釉斑）
            const jg = ctx.createRadialGradient(-3, -3, 2, 0, 0, 20);
            jg.addColorStop(0, '#C96B84');
            jg.addColorStop(0.5, '#7D3C70');
            jg.addColorStop(0.85, '#5B708C');
            jg.addColorStop(1, 'rgba(91, 112, 140, 0)');

      // 6.2 绘制兔毫银星、洒金箔星与柴烧落灰斑

      /* ============================================================================
       * 6.5 视频 00:12-00:15 同款：古法青釉砖窑炉燃烧画面 + 真·像素级窑变算法
       * ============================================================================ */
      function drawKilnFiringScene(ctx, time) {
        const cx = CW * 0.5;

        ctx.save();

        const sh = ctx.createRadialGradient(cx, ky + 15, 30, cx, ky + 15, 220);

        ctx.fill();

        // 2. 顶部砖砌烟囱（冒出袅袅轻烟与火星）
        ctx.fillStyle = '#9C7254';
        ctx.strokeStyle = '#4A382B';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(cx - 24, 150, 48, 52, 4);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#739182';

        ctx.stroke();

        // 3. 青瓷绿斑驳穹顶窑身（还原视频 00:12 的青绿釉砖纹理与红褐窑土斑）
        const domeG = ctx.createRadialGradient(cx - 55, 250, 25, cx, 340, 185);
        domeG.addColorStop(0, '#B8D1C4');
        domeG.addColorStop(0.45, '#86A898');
        domeG.addColorStop(0.82, '#5E7A6C');
        domeG.addColorStop(1, '#3D4D44');
        ctx.fillStyle = domeG;
        ctx.beginPath();
        ctx.moveTo(cx - 148, ky);
        ctx.bezierCurveTo(cx - 165, 260, cx - 95, 192, cx, 192);
        ctx.bezierCurveTo(cx + 95, 192, cx + 165, 260, cx + 148, ky);
        ctx.quadraticCurveTo(cx, ky + 28, cx - 148, ky);

        // 窑身砖缝、铁箍与斑驳陶土肌理
        ctx.strokeStyle = 'rgba(74, 52, 38, 0.38)';

        ctx.moveTo(cx - 95, 212); ctx.quadraticCurveTo(cx - 115, 340, cx - 108, ky + 5);
        ctx.moveTo(cx + 95, 212); ctx.quadraticCurveTo(cx + 115, 340, cx + 108, ky + 5);

        // 4. 拱形砖砌窑门与内部熊熊炉火
        ctx.fillStyle = '#8C583A';

        ctx.arc(cx, ky - 20, 74, Math.PI, 0, false);
        ctx.lineTo(cx + 74, ky + 12);
        ctx.quadraticCurveTo(cx, ky + 22, cx - 74, ky + 12);

        // 窑膛内部深邃火光

        const isFiring = state.kilnPhase === 'firing';
        const fireIntensity = isFiring ? (0.85 + Math.sin(time * 0.018) * 0.15) : 0.65;
        const fireG = ctx.createRadialGradient(cx, ky - 5, 6, cx, ky - 25, 72);
        if (state.kilnType === 'reducing') {

          fireG.addColorStop(0.5, '#F27D24');

          fireG.addColorStop(0, '#FFFFFF');
          fireG.addColorStop(0.45, '#FFA824');
          fireG.addColorStop(0.85, '#C83E1B');
          fireG.addColorStop(1, '#2E0D05');
