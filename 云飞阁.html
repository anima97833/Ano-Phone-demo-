                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ================================================================
       GOODS SORTING GAME — 3D 货架收纳三消游戏 (Pointer Drag 版)
    ================================================================ */

    // ── 物品资源库 ──
    const GAME_ITEMS = [
      { id: 'guanyu', img: 'https://www.image2url.com/r2/default/images/1786274342587-e40b2098-3bee-4792-9c3c-daa204052642.png' },
      { id: 'liubei', img: 'https://www.image2url.com/r2/default/images/1786274380396-456d4da1-188c-4915-90fc-5027f7f564bd.png' },
      { id: 'xixue', img: 'https://www.image2url.com/r2/default/images/1786274413855-8e74d378-9e60-41c0-af12-f7febaecddca.png' },
      { id: 'zhangfei', img: 'https://www.image2url.com/r2/default/images/1786274454078-3554b99b-8509-488b-8834-9631d636f2c3.png' }
    ];

    // ── 关卡初始化：3行×3列，每格5层纵深，每层包含1~3个物品(多数为3个，极少数为1个) ──
    function generateLevel() {
      // 1. 生成 9 个格子 × 5 层纵深的容量结构
      const layersStructure = [];
      let totalSlots = 0;

      for (let cellIdx = 0; cellIdx < 9; cellIdx++) {
        const cellLayers = [];
        for (let l = 0; l < 5; l++) {
          const rand = Math.random();
          let size = 3;
          if (rand < 0.15) size = 1;       // 极少数: 1个 (15%)
          else if (rand < 0.40) size = 2;  // 少数: 2个 (25%)
          else size = 3;                   // 多数: 3个 (60%)
          cellLayers.push(size);
          totalSlots += size;
        }
        layersStructure.push(cellLayers);
      }

      // 调整 totalSlots 确保能被 3 整除 (凑成完整的三消组合)
      while (totalSlots % 3 !== 0) {
        layersStructure[0][0] = (layersStructure[0][0] % 3) + 1;
        totalSlots = layersStructure.flat().reduce((a, b) => a + b, 0);
      }

      // 2. 生成完全匹配的三消物品池
      const numTrios = totalSlots / 3;
      const pool = [];
      for (let i = 0; i < numTrios; i++) {
        const item = GAME_ITEMS[Math.floor(Math.random() * GAME_ITEMS.length)];
        pool.push(item.id, item.id, item.id);
      }
      pool.sort(() => Math.random() - 0.5);

      // 3. 将物品填入多层货架结构中
      let poolIdx = 0;
      const shelves = [];
      let structIdx = 0;
      for (let r = 0; r < 3; r++) {
        const row = [];
        for (let c = 0; c < 3; c++) {
          const cellSizes = layersStructure[structIdx++];
          const cellLayers = cellSizes.map((size, layerIndex) => {
            const layerItems = [];
            for (let s = 0; s < size; s++) {
              layerItems.push(pool[poolIdx++]);
            }

            // 确保游戏开始时，最外层（前排）不能全是同一种萝卜
            if (layerIndex === 0 && size > 1) {
              const allIdentical = layerItems.every(item => item === layerItems[0]);
              if (allIdentical) {
                // 从剩下的物品池中找一个不同的物品进行交换
                for (let i = poolIdx; i < pool.length; i++) {
                  if (pool[i] !== layerItems[0]) {
                    const temp = pool[i];
                    pool[i] = layerItems[size - 1];
                    layerItems[size - 1] = temp;
                    break;
                  }
                }
              }
            }

            return layerItems;
          });
          row.push(cellLayers);
        }
        shelves.push(row);
      }
      return shelves;
    }

    function GoodsSortingGame({ onClose }) {
      const itemMap = Object.fromEntries(GAME_ITEMS.map(it => [it.id, it]));

      const [shelves, setShelves] = useState(generateLevel);
      const [score, setScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [comboLabel, setComboLabel] = useState(null);
      const [gameState, setGameState] = useState('playing');
      const [visible, setVisible] = useState(false);

      // 6分钟倒计时 (360秒)
      const [timeLeft, setTimeLeft] = useState(360);

      // 点选模式
      const [selected, setSelected] = useState(null); // { r, c, idx }

      // 拖拽模式
      const [dragging, setDragging] = useState(null);
      const [dragOver, setDragOver] = useState(null);
      const gameRef = useRef(null);

      // ── 视觉特效状态 ──
      const [landedCell, setLandedCell] = useState(null);   // 落点弹跳反馈 { r, c, id }
      const [clearingCell, setClearingCell] = useState(null); // 消除闪光缩小反馈 { r, c }
      const [starParticles, setStarParticles] = useState([]); // 星星爆发粒子数组

      useEffect(() => { requestAnimationFrame(() => setVisible(true)); }, []);

      // 倒计时 Effect（每秒减 1，减至 0 判定失败）
      useEffect(() => {
        if (gameState !== 'playing') return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              setGameState('lose'); // 时间耗尽 -> 失败
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [gameState]);

      // 格式化时间 mm:ss
      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      // 通关检测（所有格子 5 层均被清空）
      useEffect(() => {
        const allEmpty = shelves.every(row =>
          row.every(cell => cell.length === 0)
        );
        if (allEmpty && gameState === 'playing') setGameState('win');
      }, [shelves, gameState]);

      const handleClose = () => {
        setVisible(false);
        setTimeout(onClose, 300);
      };

      const doDrop = (sr, sc, sIdx, tr, tc) => {
        setShelves(prev => {
          // 深拷贝所有格子的 depth layers
          const next = prev.map(row => row.map(cell => cell.map(layer => [...layer])));
          const srcCell = next[sr][sc];
          const tgtCell = next[tr][tc];

          if (tgtCell.length === 0) tgtCell.push([]);
          let tgtFront = tgtCell[0];

          // 过滤异常 null/undefined 值，确保数据准确
          tgtCell[0] = tgtCell[0].filter(Boolean);
          tgtFront = tgtCell[0];

          if (tgtFront.length >= 3) return prev; // 目标前排确实已满 (3个合法物品)

          const srcFront = srcCell[0];
          if (!srcFront || srcFront.length === 0) return prev;
          if (sIdx < 0 || sIdx >= srcFront.length) return prev; // 索引越界防护

          const item = srcFront.splice(sIdx, 1)[0];
          if (!item) return prev; // 极空防越界

          tgtFront.push(item);

          // 触发落点落地弹跳动画
          setLandedCell({ r: tr, c: tc, id: Date.now() });
          setTimeout(() => setLandedCell(null), 400);

          // 消除检测
          if (tgtFront.length === 3 &&
            tgtFront[0] === tgtFront[1] &&
            tgtFront[1] === tgtFront[2]) {

            // 触发消除动画 & 爆星粒子
            setClearingCell({ r: tr, c: tc, id: Date.now() });

            // 爆发 14 颗绚丽星星粒子
            const icons = ['✨', '⭐', '🌟', '💫', '⚡'];
            const newParticles = Array.from({ length: 14 }, (_, i) => {
              const angle = (i / 14) * 2 * Math.PI + (Math.random() * 0.4 - 0.2);
              const dist = 35 + Math.random() * 45;
              return {
                id: Date.now() + '-' + i + '-' + Math.random(),
                r: tr, c: tc,
                dx: `${Math.cos(angle) * dist}px`,
                dy: `${Math.sin(angle) * dist}px`,
                icon: icons[Math.floor(Math.random() * icons.length)],
                size: `${0.85 + Math.random() * 0.7}rem`,
              };
            });
            setStarParticles(p => [...p, ...newParticles]);
            setTimeout(() => {
              setStarParticles(p => p.filter(item => !newParticles.includes(item)));
            }, 650);

            // 得分与连击加成
            setCombo(c => {
              const nc = c + 1;
              setScore(s => s + 100 * nc);
              if (nc >= 2) {
                setComboLabel(`连击 ×${nc}！`);
                setTimeout(() => setComboLabel(null), 1200);
              }
              return nc;
            });

            // 延迟 420ms 执行实际 shift，给发光缩小及爆星动画留足展示时间
            setTimeout(() => {
              setShelves(currentShelves => {
                const nextS = currentShelves.map(row => row.map(cell => cell.map(layer => [...layer])));
                const cCell = nextS[tr][tc];
                if (cCell.length > 0) {
                  cCell.shift();
                }
                // 全局清洗
                nextS.forEach(row => {
                  row.forEach(cell => {
                    while (cell.length > 0 && (cell[0].length === 0 || cell[0].every(it => !it))) {
                      cell.shift();
                    }
                  });
                });
                return nextS;
              });
              setClearingCell(null);
            }, 420);

          } else {
            setCombo(0);
            // 全局自动清洗：清空无物品的前排空层
            next.forEach(row => {
              row.forEach(cell => {
                while (cell.length > 0 && (cell[0].length === 0 || cell[0].every(it => !it))) {
                  cell.shift();
                }
              });
            });
          }

          return next;
        });
      };

      // ── 点击选中 / 点击移动逻辑 ──
      const handleCellClick = (r, c) => {
        if (!selected) return;
        if (selected.r === r && selected.c === c) return;
        const tgtFront = (shelves[r][c][0] || []).filter(Boolean);
        if (tgtFront.length >= 3) return;
        doDrop(selected.r, selected.c, selected.idx, r, c);
        setSelected(null);
      };

      const handleItemClick = (e, r, c, idx) => {
        e.stopPropagation();
        if (gameState !== 'playing') return;

        if (!selected) {
          setSelected({ r, c, idx });
          return;
        }
        if (selected.r === r && selected.c === c && selected.idx === idx) {
          setSelected(null);
          return;
        }
        if (selected.r === r && selected.c === c) {
          setSelected({ r, c, idx });
          return;
        }
        // 跨格点击
        const tgtFront = (shelves[r][c][0] || []).filter(Boolean);
        if (tgtFront.length < 3) {
          doDrop(selected.r, selected.c, selected.idx, r, c);
          setSelected(null);
        } else {
          setSelected({ r, c, idx });
        }
      };

      // ── Pointer / Touch drag handlers ──
      const onItemPointerDown = (e, r, c, idx) => {
        if (gameState !== 'playing') return;
        const frontRow = shelves[r][c][0];
        if (!frontRow) return;
        const touch = e.touches ? e.touches[0] : e;
        const img = itemMap[frontRow[idx]]?.img;
        const isTouchDevice = !!e.touches;

        setDragging({
          r, c, idx, img,
          x: touch.clientX,
          y: touch.clientY,
          isTouch: isTouchDevice,
        });
      };

      useEffect(() => {
        if (!dragging) return;

        const onMove = (e) => {
          if (e.cancelable) e.preventDefault();
          const touch = e.touches ? e.touches[0] : e;
          const clientX = touch.clientX;
          const clientY = touch.clientY;

          setDragging(d => (d ? { ...d, x: clientX, y: clientY } : null));

          // 核心修复：直接使用精确触摸坐标获取目标格子
          const el = document.elementFromPoint(clientX, clientY);
          const cell = el?.closest('[data-cell]');
          if (cell) {
            const dr = parseInt(cell.dataset.row);
            const dc = parseInt(cell.dataset.col);
            setDragOver({ r: dr, c: dc });
          } else {
            setDragOver(null);
          }
        };

        const onUp = (e) => {
          const touch = e.changedTouches ? e.changedTouches[0] : e;
          const clientX = touch.clientX;
          const clientY = touch.clientY;

          const el = document.elementFromPoint(clientX, clientY);
          const cell = el?.closest('[data-cell]');
          if (cell) {
            const tr = parseInt(cell.dataset.row);
            const tc = parseInt(cell.dataset.col);
            if (!(tr === dragging.r && tc === dragging.c)) {
              doDrop(dragging.r, dragging.c, dragging.idx, tr, tc);
              setSelected(null);
            }
          }
          setDragging(null);
          setDragOver(null);
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);
        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onUp);
        };
      }, [dragging, shelves, combo, gameState]);

      const woodBg = 'linear-gradient(160deg,#4a2a0d 0%,#6b3a18 40%,#5a3010 70%,#3d1f08 100%)';
      const plankBg = 'linear-gradient(180deg,#7a4820 0%,#5a3010 50%,#3d1f08 100%)';

      return (
        <div
          ref={gameRef}
          style={{
            position: 'fixed', inset: 0, zIndex: 200,
            background: 'rgba(8,4,1,0.92)',
            backdropFilter: 'blur(10px)',
            display: 'flex', flexDirection: 'column',
            alignItems: 'center', justifyContent: 'space-between',
            opacity: visible ? 1 : 0,
            transition: 'opacity 0.3s ease',
            userSelect: 'none',
            touchAction: 'none',
          }}
          onClick={handleClose}
        >
          <style>{`
            @keyframes itemBounceSelect {
              0% { transform: scale(1) translateY(0); }
              40% { transform: scale(1.38) translateY(-8px); filter: drop-shadow(0 0 12px #FFD700) brightness(1.5); }
              70% { transform: scale(1.18) translateY(-3px); filter: drop-shadow(0 0 8px #FFD700) brightness(1.3); }
              100% { transform: scale(1.28) translateY(-5px); filter: drop-shadow(0 0 10px #FFD700) brightness(1.4); }
            }

            @keyframes itemLandBounce {
              0% { transform: scale(0.35) translateY(-14px); opacity: 0.5; }
              50% { transform: scale(1.32) translateY(3px); filter: drop-shadow(0 0 10px #FFD700) brightness(1.3); }
              75% { transform: scale(0.92) translateY(-2px); }
              100% { transform: scale(1) translateY(0); opacity: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }
            }

            @keyframes matchGlowShrink {
              0% {
                transform: scale(1) rotate(0deg);
                filter: brightness(2.2) drop-shadow(0 0 14px #FFD700) drop-shadow(0 0 20px #FFF);
                opacity: 1;
              }
              35% {
                transform: scale(1.45) rotate(15deg);
                filter: brightness(3.5) drop-shadow(0 0 25px #FFD700) drop-shadow(0 0 35px #FFA500);
                opacity: 1;
              }
              100% {
                transform: scale(0.02) rotate(-40deg);
                filter: brightness(5) drop-shadow(0 0 40px #FFD700);
                opacity: 0;
              }
            }

            @keyframes starBurstFly {
              0% {
                transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
                opacity: 1;
              }
              60% {
                opacity: 1;
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.5) rotate(180deg);
              }
              100% {
                transform: translate(calc(-50% + var(--dx) * 1.6), calc(-50% + var(--dy) * 1.6 + 18px)) scale(0) rotate(360deg);
                opacity: 0;
              }
            }
          `}</style>

          {/* 关闭按钮 */}
          <div
            onClick={e => { e.stopPropagation(); handleClose(); }}
            style={{
              position: 'absolute', top: 14, left: 18, zIndex: 220,
              width: 34, height: 34, borderRadius: '50%',
              border: '1px solid rgba(255,230,160,0.35)',
              background: 'rgba(15,10,5,0.7)',
              color: '#FFE6A0', fontSize: '1.3rem',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer', transition: 'all 0.2s',
            }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = 'rgba(255,230,160,0.8)'; e.currentTarget.style.transform = 'scale(1.1)'; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(255,230,160,0.35)'; e.currentTarget.style.transform = 'scale(1)'; }}
          >✕</div>

          {/* ── 顶部预留区：6分钟倒计时与得分状态栏 ── */}
          <div
            onClick={e => e.stopPropagation()}
            style={{
              flex: '1', width: '100%', maxWidth: '360px',
              display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'flex-end',
              paddingBottom: '10px', gap: '6px',
            }}
          >
            {/* 倒计时与得分栏 */}
            <div style={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              width: '100%', padding: '6px 16px',
              background: 'rgba(25,12,3,0.75)',
              border: '1px solid rgba(255,230,160,0.22)',
              borderRadius: '20px',
              boxShadow: 'inset 0 1px 0 rgba(255,200,100,0.12), 0 4px 12px rgba(0,0,0,0.5)',
            }}>
              {/* 倒计时 */}
              <div style={{
                display: 'flex', alignItems: 'center', gap: '6px',
                color: timeLeft <= 30 ? '#e74c3c' : '#FFE6A0',
                fontSize: '0.95rem', fontWeight: 'bold',
                letterSpacing: '0.08em',
                textShadow: timeLeft <= 30 ? '0 0 10px rgba(231,76,60,0.8)' : '0 1px 3px rgba(0,0,0,0.8)',
              }}>
                <span>⏱️</span>
                <span>{formatTime(timeLeft)}</span>
              </div>

              {/* 得分 */}
              <div style={{
                color: 'rgba(255,230,160,0.85)',
                fontSize: '0.88rem', letterSpacing: '0.12em',
              }}>
                得分 <span style={{ color: '#FFD700', fontWeight: 'bold' }}>{score}</span>
              </div>
            </div>

            {comboLabel && (
              <div style={{
                color: '#FFD700', fontSize: '1.5rem', fontWeight: 'bold',
                textShadow: '0 0 12px rgba(255,200,0,0.8)',
              }}>
                {comboLabel}
              </div>
            )}
          </div>

          {/* ── 货架主体 (古色古香 3D 雕花藏宝阁柜) ── */}
          <div
            onClick={e => e.stopPropagation()}
            style={{ position: 'relative', width: '100%', maxWidth: '360px', padding: '0 16px', flex: 'none', touchAction: 'none' }}
          >
            {/* 四角精致古铜包角装饰 (Brass Corners) */}
            <div style={{ position: 'absolute', left: 10, top: -4, width: 18, height: 18, borderTop: '3px solid #FFD700', borderLeft: '3px solid #FFD700', borderRadius: '3px 0 0 0', zIndex: 30, filter: 'drop-shadow(0 2px 4px rgba(0,0,0,0.8))' }} />
            <div style={{ position: 'absolute', right: 10, top: -4, width: 18, height: 18, borderTop: '3px solid #FFD700', borderRight: '3px solid #FFD700', borderRadius: '0 3px 0 0', zIndex: 30, filter: 'drop-shadow(0 2px 4px rgba(0,0,0,0.8))' }} />
            <div style={{ position: 'absolute', left: 10, bottom: -4, width: 18, height: 18, borderBottom: '3px solid #FFD700', borderLeft: '3px solid #FFD700', borderRadius: '0 0 0 3px', zIndex: 30, filter: 'drop-shadow(0 2px 4px rgba(0,0,0,0.8))' }} />
            <div style={{ position: 'absolute', right: 10, bottom: -4, width: 18, height: 18, borderBottom: '3px solid #FFD700', borderRight: '3px solid #FFD700', borderRadius: '0 0 3px 0', zIndex: 30, filter: 'drop-shadow(0 2px 4px rgba(0,0,0,0.8))' }} />

            {/* 左右重型木纹立柱 */}
            <div style={{ position: 'absolute', left: 6, top: -6, bottom: -6, width: '14px', background: 'linear-gradient(90deg,#200c03 0%,#5a2b10 40%,#3d1a06 80%,#180802 100%)', borderRadius: '6px 0 0 6px', boxShadow: '3px 0 10px rgba(0,0,0,0.85), inset 1px 0 1px rgba(255,200,120,0.2)', zIndex: 12 }} />
            <div style={{ position: 'absolute', right: 6, top: -6, bottom: -6, width: '14px', background: 'linear-gradient(270deg,#200c03 0%,#5a2b10 40%,#3d1a06 80%,#180802 100%)', borderRadius: '0 6px 6px 0', boxShadow: '-3px 0 10px rgba(0,0,0,0.85), inset -1px 0 1px rgba(255,200,120,0.2)', zIndex: 12 }} />

            <div style={{
              background: 'linear-gradient(160deg,#2c1407 0%,#46220d 40%,#361908 70%,#200c03 100%)',
              borderRadius: '12px',
              border: '4px solid #1a0a03',
              boxShadow: '0 16px 40px rgba(0,0,0,0.85), inset 0 2px 4px rgba(255,200,120,0.2), inset 0 -4px 10px rgba(0,0,0,0.7)',
              overflow: 'hidden',
              position: 'relative',
              zIndex: 10,
            }}>
              {/* 顶雕额坊门楣 (Top Carved Crown Header) */}
              <div style={{
                height: '22px',
                background: 'linear-gradient(180deg,#8c4d1e 0%,#5a2e0e 60%,#3a1a06 100%)',
                borderBottom: '2px solid #1a0a03',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: 'inset 0 1px 0 rgba(255,220,140,0.3), 0 3px 6px rgba(0,0,0,0.6)',
              }}>
                <span style={{ fontSize: '0.68rem', color: '#FFE6A0', letterSpacing: '0.25em', fontWeight: 'bold', textShadow: '0 1px 2px #000' }}>
                  ❖ 云 飞 阁 · 藏 宝 柜 ❖
                </span>
              </div>

              {shelves.map((shelfRow, rowIdx) => (
                <div key={rowIdx}>
                  <div style={{
                    display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)',
                    background: '#120702',
                    height: '86px', minHeight: '86px', maxHeight: '86px',
                    overflow: 'hidden',
                  }}>
                    {shelfRow.map((cell, colIdx) => {
                      const frontRow = cell[0] || [];
                      const backRow = cell[1] || [];
                      const isDropTarget = dragOver && dragOver.r === rowIdx && dragOver.c === colIdx;
                      const isSelectTargetable = selected && !(selected.r === rowIdx && selected.c === colIdx) && frontRow.length < 3;
                      const depthLayers = cell.length; // 剩余总层数 (如5层)
                      const isClearingThis = clearingCell && clearingCell.r === rowIdx && clearingCell.c === colIdx;

                      return (
                        <div
                          key={colIdx}
                          data-cell="1"
                          data-row={rowIdx}
                          data-col={colIdx}
                          onClick={() => handleCellClick(rowIdx, colIdx)}
                          style={{
                            position: 'relative',
                            height: '86px', minHeight: '86px', maxHeight: '86px',
                            boxSizing: 'border-box',
                            overflow: 'hidden',
                            display: 'flex', flexDirection: 'column',
                            alignItems: 'center', justifyContent: 'flex-end',
                            padding: '4px',
                            borderRight: colIdx < 2 ? '3px solid #140702' : 'none',
                            // 3D 深度凹陷阴影效果 (Recessed Wooden Alcove Box-Shadow)
                            background: isDropTarget || isSelectTargetable
                              ? 'linear-gradient(180deg, rgba(80,55,15,0.7) 0%, rgba(120,85,25,0.5) 100%)'
                              : 'linear-gradient(180deg, #100602 0%, #1e0c04 45%, #2a1307 85%, #301608 100%)',
                            boxShadow: 'inset 0 10px 18px rgba(0,0,0,0.92), inset 0 -4px 8px rgba(0,0,0,0.6), inset 4px 0 8px rgba(0,0,0,0.7), inset -4px 0 8px rgba(0,0,0,0.7)',
                            outline: isSelectTargetable ? '2px dashed #FFD700' : 'none',
                            outlineOffset: '-4px',
                            cursor: selected ? 'pointer' : 'default',
                            transition: 'background 0.15s, outline 0.15s',
                            touchAction: 'none',
                          }}
                        >
                          {/* 抽屉底部木质透视微光地板 */}
                          <div style={{
                            position: 'absolute', bottom: 0, left: 0, right: 0, height: '16px',
                            background: 'linear-gradient(180deg, transparent 0%, rgba(255,200,120,0.06) 60%, rgba(0,0,0,0.4) 100%)',
                            pointerEvents: 'none', zIndex: 2
                          }} />

                          {/* 星星爆发粒子 */}
                          {starParticles.filter(p => p.r === rowIdx && p.c === colIdx).map(p => (
                            <span
                              key={p.id}
                              style={{
                                position: 'absolute',
                                left: '50%', top: '50%',
                                fontSize: p.size,
                                zIndex: 99,
                                pointerEvents: 'none',
                                ['--dx']: p.dx,
                                ['--dy']: p.dy,
                                animation: 'starBurstFly 0.6s ease-out forwards',
                                filter: 'drop-shadow(0 0 6px #FFD700)',
                              }}
                            >
                              {p.icon}
                            </span>
                          ))}

                          {/* 深度层数古铜木质标牌 (Golden Depth Badge) */}
                          {depthLayers > 2 && (
                            <div style={{
                              position: 'absolute', top: '4px', right: '5px', zIndex: 8,
                              fontSize: '0.55rem', color: '#FFE6A0',
                              background: 'linear-gradient(135deg, #7a461b 0%, #4a280e 100%)',
                              border: '1px solid rgba(255,215,0,0.6)',
                              borderRadius: '3px', padding: '0 4px',
                              lineHeight: '1.2', fontWeight: 'bold',
                              boxShadow: '0 2px 4px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.2)',
                              pointerEvents: 'none',
                            }}>
                              x{depthLayers}
                            </div>
                          )}

                          {/* 后排（深处影藏层：暗沉景深阴影） */}
                          {backRow.length > 0 && (
                            <div style={{
                              position: 'absolute', top: '5px', left: 0, right: 0,
                              display: 'flex', justifyContent: 'center', gap: '0',
                              opacity: 0.45, pointerEvents: 'none',
                              transform: 'scale(0.68)',
                              filter: 'drop-shadow(0 4px 6px rgba(0,0,0,0.9))',
                            }}>
                              {backRow.map((id, i) => (
                                <span key={i} style={{ margin: '0 -2px', fontSize: '2.1rem', filter: 'blur(0.6px) brightness(0.5)', display: 'inline-block', lineHeight: 1 }}>
                                  <img src={itemMap[id]?.img} style={{ width: '1em', height: '1em', objectFit: 'contain', display: 'block' }} draggable="false" alt="" />
                                </span>
                              ))}
                            </div>
                          )}

                          {/* 前排（近景亮色前排层） */}
                          <div style={{
                            position: 'absolute', bottom: '5px', left: 0, right: 0,
                            display: 'flex', gap: '0', alignItems: 'center', justifyContent: 'center',
                            width: '100%', zIndex: 5, touchAction: 'none',
                          }}>
                            {frontRow.map((id, i) => {
                              const isDraggingThis = dragging && dragging.r === rowIdx && dragging.c === colIdx && dragging.idx === i;
                              const isSelectedThis = selected && selected.r === rowIdx && selected.c === colIdx && selected.idx === i;
                              const isLandedThis = landedCell && landedCell.r === rowIdx && landedCell.c === colIdx && i === frontRow.length - 1;

                              let itemAnim = 'none';
                              if (isClearingThis) {
                                itemAnim = 'matchGlowShrink 0.42s ease-in-out forwards';
                              } else if (isSelectedThis) {
                                itemAnim = 'itemBounceSelect 0.4s ease-out forwards';
                              } else if (isLandedThis) {
                                itemAnim = 'itemLandBounce 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
                              }

                              return (
                                <span
                                  key={i}
                                  onClick={e => handleItemClick(e, rowIdx, colIdx, i)}
                                  onMouseDown={e => onItemPointerDown(e, rowIdx, colIdx, i)}
                                  onTouchStart={e => onItemPointerDown(e, rowIdx, colIdx, i)}
                                  style={{
                                    margin: '0 -3px',
                                    fontSize: '2.65rem',
                                    cursor: 'pointer',
                                    display: 'inline-block',
                                    opacity: isDraggingThis ? 0.2 : 1,
                                    animation: itemAnim,
                                    filter: isSelectedThis
                                      ? 'drop-shadow(0 0 10px #FFD700) brightness(1.4)'
                                      : 'drop-shadow(0 4px 6px rgba(0,0,0,0.85))',
                                    transition: isSelectedThis || isClearingThis || isLandedThis ? 'none' : 'transform 0.15s ease, filter 0.15s ease, opacity 0.15s',
                                    touchAction: 'none',
                                    lineHeight: 1,
                                  }}
                                >
                                  <img src={itemMap[id]?.img} style={{ width: '1em', height: '1em', objectFit: 'contain', display: 'block' }} draggable="false" alt="" />
                                </span>
                              );
                            })}
                            {/* 空格占位 */}
                            {depthLayers === 0 && (
                              <span style={{ fontSize: '0.65rem', color: 'rgba(255,200,100,0.2)', letterSpacing: '0.1em' }}>空</span>
                            )}
                            {/* 目标指引提示 */}
                            {isSelectTargetable && (
                              <span style={{ fontSize: '0.9rem', color: '#FFD700', fontWeight: 'bold', opacity: 0.85, textShadow: '0 0 6px rgba(255,215,0,0.8)' }}>＋</span>
                            )}
                          </div>

                          {/* 格内底部置物下沉阴影 */}
                          <div style={{ position: 'absolute', bottom: 0, left: 2, right: 2, height: '5px', background: 'rgba(0,0,0,0.5)', borderRadius: '1px', filter: 'blur(2px)', pointerEvents: 'none' }} />
                        </div>
                      );
                    })}
                  </div>
                  {/* 立体雕花置物搁板 (3D Wooden Plank with Highlight Lip) */}
                  <div style={{
                    height: '14px',
                    background: 'linear-gradient(180deg, #8c5222 0%, #6d3d17 30%, #4a270b 80%, #2e1605 100%)',
                    borderTop: '1px solid rgba(255,215,120,0.35)',
                    borderBottom: '2px solid #140702',
                    boxShadow: '0 4px 10px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,230,160,0.25)',
                    position: 'relative',
                    zIndex: 11,
                  }} />
                </div>
              ))}

              {/* 底梁 */}
              <div style={{ height: '14px', background: 'linear-gradient(180deg,#5a2b10 0%,#3d1a06 60%,#200c03 100%)', borderTop: '2px solid #140702' }} />
            </div>
          </div>

          {/* ── 底部区：扩展功能按钮区 ── */}
          <div
            onClick={e => e.stopPropagation()}
            style={{ flex: '1', width: '100%', maxWidth: '360px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '12px', padding: '0 16px' }}
          >
            {[1, 2, 3].map(btnIndex => (
              <button
                key={btnIndex}
                style={{
                  flex: 1,
                  height: '42px',
                  background: 'linear-gradient(180deg, #8b5020, #5a3010)',
                  border: '1px solid rgba(255,215,120,0.4)',
                  borderRadius: '21px',
                  color: '#FFE6A0',
                  fontSize: '0.9rem',
                  fontWeight: 'bold',
                  letterSpacing: '0.1em',
                  boxShadow: '0 4px 8px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.1)',
                  cursor: 'pointer',
                  outline: 'none',
                  textShadow: '0 1px 2px #000',
                  transition: 'transform 0.1s, filter 0.1s',
                  padding: 0,
                }}
                onMouseDown={e => { e.currentTarget.style.transform = 'scale(0.94) translateY(2px)'; e.currentTarget.style.filter = 'brightness(0.85)'; }}
                onMouseUp={e => { e.currentTarget.style.transform = 'scale(1) translateY(0)'; e.currentTarget.style.filter = 'brightness(1)'; }}
                onMouseLeave={e => { e.currentTarget.style.transform = 'scale(1) translateY(0)'; e.currentTarget.style.filter = 'brightness(1)'; }}
                onTouchStart={e => { e.currentTarget.style.transform = 'scale(0.94) translateY(2px)'; e.currentTarget.style.filter = 'brightness(0.85)'; }}
                onTouchEnd={e => { e.currentTarget.style.transform = 'scale(1) translateY(0)'; e.currentTarget.style.filter = 'brightness(1)'; }}
              >
                待 定
              </button>
            ))}
          </div>

          {/* 浮动拖拽影子 (触摸时偏移在手指上方 -50px，避免手指遮挡落点与物品) */}
          {dragging && (
            <div style={{
              position: 'fixed',
              left: dragging.x - 22,
              top: dragging.isTouch ? dragging.y - 65 : dragging.y - 22,
              fontSize: '3.2rem', pointerEvents: 'none', zIndex: 999,
              filter: 'drop-shadow(0 6px 16px rgba(255,200,100,0.9))',
              transform: 'scale(1.35)',
              opacity: 0.95,
              lineHeight: 1,
            }}>
              <img src={dragging.img} style={{ width: '1em', height: '1em', objectFit: 'contain', display: 'block' }} draggable="false" alt="" />
            </div>
          )}

          {/* 胜负弹窗 */}
          {gameState !== 'playing' && (
            <div style={{
              position: 'absolute', inset: 0, zIndex: 230,
              background: 'rgba(5,3,1,0.88)',
              display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center', gap: '18px',
            }}>
              <div style={{ fontSize: 'clamp(2.5rem,6vw,3.5rem)', color: gameState === 'win' ? '#FFD700' : '#e74c3c' }}>
                {gameState === 'win' ? '🎉 通关！' : '😔 失败了'}
              </div>
              <div style={{ color: '#FFE6A0', fontSize: '1.1rem', letterSpacing: '0.15em' }}>
                最终得分：{score}
              </div>
              <div style={{ display: 'flex', gap: '14px' }}>
                <button onClick={() => { setShelves(generateLevel()); setScore(0); setCombo(0); setSelected(null); setGameState('playing'); }}
                  style={{ background: 'rgba(80,50,20,0.7)', border: '1px solid rgba(255,230,160,0.4)', color: '#FFE6A0', padding: '9px 26px', borderRadius: '22px', cursor: 'pointer', fontSize: '0.95rem' }}>
                  再玩一局
                </button>
                <button onClick={handleClose}
                  style={{ background: 'transparent', border: '1px solid rgba(255,255,255,0.2)', color: '#CCC', padding: '9px 26px', borderRadius: '22px', cursor: 'pointer', fontSize: '0.95rem' }}>
                  返回
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ================================================================
       DRAWER PAGE — full-screen image, blur entry
    ================================================================ */
    const DRAWER_OFFSET_X = -19;  // 向右偏移量 (%)
    const DRAWER_OFFSET_Y = -6; // 向下偏移量 (%)，负数即为向上

    const DRAWER_SLOTS = [
      { id: 'L1', src: 'https://cdn.phototourl.com/member/2026-08-05-c92643b7-c730-42f2-8405-10d888b55f90.png', style: { left: (29.82 + DRAWER_OFFSET_X) + '%', top: (43.24 + DRAWER_OFFSET_Y) + '%', width: '40.36%', height: '11.05%' } },
      { id: 'L2', src: 'https://cdn.phototourl.com/member/2026-08-05-f22c2ba8-a199-4a6b-939a-9d2cfeee7caf.png', style: { left: (29.30 + DRAWER_OFFSET_X) + '%', top: (53.71 + DRAWER_OFFSET_Y + 1.0) + '%', width: '37.76%', height: '10.90%' } },
      { id: 'L3', src: 'https://cdn.phototourl.com/member/2026-08-05-cf2e9f3b-bd4d-422a-87bc-185f5cd66b68.png', style: { left: (29.49 + DRAWER_OFFSET_X) + '%', top: (65.92 + DRAWER_OFFSET_Y) + '%', width: '38.15%', height: '11.34%' } },
      { id: 'L4', src: 'https://cdn.phototourl.com/member/2026-08-05-52f00771-a611-4edc-8db9-176ab98191d4.png', style: { left: (28.97 + DRAWER_OFFSET_X) + '%', top: (77.87 + DRAWER_OFFSET_Y) + '%', width: '38.67%', height: '12.43%' } },
      { id: 'R1', src: 'https://cdn.phototourl.com/member/2026-08-05-c90ccd4c-f18d-4b02-91b3-a3199a7c5f56.png', style: { left: (70.44 + DRAWER_OFFSET_X) + '%', top: (43.31 + DRAWER_OFFSET_Y) + '%', width: '37.76%', height: '11.19%' } },
      { id: 'R2', src: 'https://cdn.phototourl.com/member/2026-08-05-9d444d43-a24a-42a8-8ef4-9aa6a641a73e.png', style: { left: (70.44 + DRAWER_OFFSET_X) + '%', top: (53.42 + DRAWER_OFFSET_Y + 1.0) + '%', width: '38.05%', height: '11.26%' } },
      { id: 'R3', src: 'https://cdn.phototourl.com/member/2026-08-05-a00cce33-33bc-4d19-9af1-eafe2f29639b.png', style: { left: (70.25 + DRAWER_OFFSET_X) + '%', top: (66.39 + DRAWER_OFFSET_Y) + '%', width: '38.15%', height: '11.99%' } },
      { id: 'R4', src: 'https://cdn.phototourl.com/member/2026-08-05-dcc6b9dd-3ba5-43ce-b48f-cc7e4560ffa2.png', style: { left: (70.90 + DRAWER_OFFSET_X) + '%', top: (77.94 + DRAWER_OFFSET_Y) + '%', width: '38.67%', height: '12.57%' } },
    ];

    function DrawerPage({ onBack }) {
      const [visible, setVisible] = useState(false);
      const [revealed, setRevealed] = useState({}); // 记录哪些区域已经显示，如 { 'L1': true }
      const [showItemModal, setShowItemModal] = useState(false);
      const [showGoodsGame, setShowGoodsGame] = useState(false);
      const [showJumpGame, setShowJumpGame] = useState(false);
      const [showCujuGame, setShowCujuGame] = useState(false);
      const [showArcheryGame, setShowArcheryGame] = useState(false);
      const [showAgilityGame, setShowAgilityGame] = useState(false);
      const [showRowingGame, setShowRowingGame] = useState(false);
      const [showMusicGame, setShowMusicGame] = useState(false);
      const [showTrainingPage, setShowTrainingPage] = useState(false);
      const [trainingPageNum, setTrainingPageNum] = useState(0);

      useEffect(() => { requestAnimationFrame(() => setVisible(true)); }, []);

      const toggleReveal = (id) => {
        setRevealed(prev => {
          const isNowRevealed = !prev[id];
          if (isNowRevealed && id === 'L1') {
            // Wait for drawer opening animation (400ms) then show modal
            setTimeout(() => {
              setShowItemModal(true);
            }, 400);
          } else if (isNowRevealed && id === 'L2') {
            setTimeout(() => {
              setShowTrainingPage(true);
            }, 400);
          }
          return { ...prev, [id]: isNowRevealed };
        });
      };

      return (
        <div style={{
          position: 'absolute', inset: 0, zIndex: 30,
          background: '#000',
          opacity: visible ? 1 : 0,
          filter: visible ? 'blur(0px)' : 'blur(20px)',
          transition: 'opacity 1.2s ease, filter 1.2s ease',
          overflow: 'hidden',
        }}>
          {/* 背景全图 */}
          <img
            src="https://cdn.phototourl.com/free/2026-08-05-16f10c42-3f1e-4776-8691-fc399c83ab9d.png"
            alt="抽屉"
            style={{
              position: 'absolute', inset: 0,
              width: '100%', height: '100%',
              objectFit: 'cover',
              objectPosition: 'center',
            }}
          />
          {/* 局部素材覆盖层 */}
          {DRAWER_SLOTS.map(slot => {
            const isRevealed = revealed[slot.id];
            return (
              <img
                key={slot.id}
                src={slot.src}
                alt={slot.id}
                onClick={() => toggleReveal(slot.id)}
                style={{
                  position: 'absolute',
                  ...slot.style,
                  objectFit: 'contain',
                  cursor: 'pointer',
                  opacity: isRevealed ? 1 : 0,
                  transition: 'opacity 0.4s ease, transform 0.2s ease, filter 0.2s ease',
                  zIndex: 5,
                }}
                onMouseEnter={e => {
                  if (isRevealed) {
                    e.currentTarget.style.transform = 'scale(1.03)';
                    e.currentTarget.style.filter = 'brightness(1.15)';
                  }
                }}
                onMouseLeave={e => {
                  e.currentTarget.style.transform = 'scale(1)';
                  e.currentTarget.style.filter = 'brightness(1)';
                }}
              />
            );
          })}
          {/* 返回按钮，回到云飞阁 */}
          <div
            onClick={onBack}
            style={{
              position: 'absolute', top: 'clamp(14px, 3.5vw, 18px)', left: 'clamp(14px, 3.5vw, 18px)',
              display: 'flex', alignItems: 'center', gap: '5px',
              color: 'var(--gold)',
              fontSize: 'clamp(0.62rem, 1.9vw, 0.76rem)',
              letterSpacing: '0.12em',
              cursor: 'pointer',
              padding: 'clamp(6px, 1.8vw, 8px) clamp(10px, 2.8vw, 14px)',
              border: '1px solid var(--glass-border)',
              borderRadius: '20px',
              background: 'rgba(8,5,2,0.65)',
              backdropFilter: 'blur(8px)',
              transition: 'all 0.22s',
              zIndex: 10,
            }}
          >
            ← 返回书阁
          </div>

          {/* 抽屉物品查看弹窗 */}
          {showItemModal && (
            <div style={{
              position: 'fixed',
              inset: 0,
              zIndex: 100,
              background: 'rgba(5, 3, 2, 0.75)',
              backdropFilter: 'blur(10px)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              animation: 'fadeIn 0.3s ease',
            }}>
              <div style={{
                background: 'rgba(25, 20, 15, 0.9)',
                border: '1px solid var(--glass-border)',
                borderRadius: '12px',
                padding: 'clamp(20px, 4vw, 30px) clamp(30px, 6vw, 40px)',
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                gap: '20px',
                boxShadow: '0 10px 30px rgba(0,0,0,0.8)',
              }}>
                <div style={{
                  color: '#FFE6A0',
                  fontFamily: '"GuanKiapTsingKhai", serif',
                  fontSize: 'clamp(1.1rem, 2.5vw, 1.4rem)',
                  letterSpacing: '0.15em',
                  textAlign: 'center',
                }}>
                  是否查看其中物品？
                </div>
                <div style={{ display: 'flex', gap: '20px', marginTop: '10px' }}>
                  <button
                    onClick={() => {
                      setShowItemModal(false);
                      setShowGoodsGame(true);
                    }}
                    style={{
                      background: 'rgba(80, 50, 20, 0.6)',
                      border: '1px solid rgba(255, 230, 160, 0.4)',
                      color: '#FFE6A0',
                      padding: '8px 24px',
                      borderRadius: '20px',
                      cursor: 'pointer',
                      fontSize: 'clamp(0.85rem, 1.6vw, 1rem)',
                      transition: 'all 0.2s',
                    }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(100, 70, 30, 0.8)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(80, 50, 20, 0.6)'}
                  >
                    是
                  </button>
                  <button
                    onClick={() => setShowItemModal(false)}
                    style={{
                      background: 'transparent',
                      border: '1px solid rgba(255, 255, 255, 0.2)',
                      color: '#CCC',
                      padding: '8px 24px',
                      borderRadius: '20px',
                      cursor: 'pointer',
                      fontSize: 'clamp(0.85rem, 1.6vw, 1rem)',
                      transition: 'all 0.2s',
                    }}
                    onMouseEnter={e => {
                      e.currentTarget.style.background = 'rgba(255,255,255,0.1)';
                      e.currentTarget.style.color = '#FFF';
                    }}
                    onMouseLeave={e => {
                      e.currentTarget.style.background = 'transparent';
                      e.currentTarget.style.color = '#CCC';
                    }}
                  >
                    否
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 3D 货架三消游戏弹窗 */}
          {showGoodsGame && (
            <GoodsSortingGame onClose={() => setShowGoodsGame(false)} />
          )}

          {/* 修武扬文 - 训练页面 */}
          {showTrainingPage && (
            <div style={{ position: 'absolute', inset: 0, zIndex: 250, background: '#FAFAFA', animation: 'fadeIn 0.3s ease-out', display: 'flex', flexDirection: 'column', fontFamily: '"GuanKiapTsingKhai", serif' }}>
              <div style={{ padding: '20px', paddingTop: 'max(40px, env(safe-area-inset-top))', display: 'flex', alignItems: 'center', background: '#fff', boxShadow: '0 2px 10px rgba(0,0,0,0.05)' }}>
                <div onClick={() => setShowTrainingPage(false)} style={{ cursor: 'pointer', padding: '5px 10px', marginLeft: '-10px', marginRight: '10px' }}>
                  <span style={{ fontSize: '1.2rem', color: '#666' }}>←</span>
                </div>
                <h2 style={{ margin: 0, fontSize: '1.4rem', color: '#333', fontWeight: 'bold' }}>修武扬文</h2>
              </div>

              <div style={{ flex: 1, display: 'flex', position: 'relative' }}>
                {trainingPageNum > 0 && (
                  <div onClick={() => setTrainingPageNum(p => p - 1)} style={{ position: 'absolute', left: 0, top: '50%', transform: 'translateY(-50%)', padding: '20px 15px', cursor: 'pointer', zIndex: 10, fontSize: '2.5rem', color: '#aaa', userSelect: 'none' }}>‹</div>
                )}
                
                <div style={{ flex: 1, padding: '20px', overflowY: 'auto', paddingLeft: '45px', paddingRight: '45px' }}>
                  {trainingPageNum === 0 && (
                    <>

    /* ================================================================
       JUMP GAME PAGE (蓄力跳跃)
    ================================================================ */
    function JumpGamePage({ onBack }) {
      const [visible, setVisible] = useState(false);
      const [stage, setStage] = useState(1); // 1-10
      const [retries, setRetries] = useState(5);
      const [isCharging, setIsCharging] = useState(false);
      const [chargeValue, setChargeValue] = useState(0); // 0-100
      const [gameState, setGameState] = useState('idle'); // idle, charging, jumping, result
      const [logs, setLogs] = useState([{ x: 40, w: 70, hasItem: false }, { x: 240, w: 70, hasItem: true }]); // x is center
      const [charPos, setCharPos] = useState({ x: 40, y: 0 });
      const [camX, setCamX] = useState(0);

      // DOM refs for animation loops
      const chargeRef = useRef(0);
      const reqRef = useRef(null);
      const pressTimeRef = useRef(0);

      const charW = 75;
      const charH = 100;
      const logH = 120;

      useEffect(() => { requestAnimationFrame(() => setVisible(true)); }, []);

      const handlePointerDown = (e) => {
        if (gameState !== 'idle' || retries <= 0 || stage > 10) return;
        setGameState('charging');
        setIsCharging(true);
        chargeRef.current = 0;
        pressTimeRef.current = Date.now();

        const loop = () => {
          const dt = Date.now() - pressTimeRef.current;
          chargeRef.current = Math.min((dt / 1200) * 100, 100);
          setChargeValue(chargeRef.current);
          reqRef.current = requestAnimationFrame(loop);
        };
        reqRef.current = requestAnimationFrame(loop);
      };

      const handlePointerUp = () => {
        if (gameState !== 'charging') return;
        cancelAnimationFrame(reqRef.current);
        setGameState('jumping');
        setIsCharging(false);

        const power = chargeRef.current; // 0-100
        const maxJumpDist = 450;
        const jumpDist = (power / 100) * maxJumpDist + 15; // min 15px jump

        const startX = charPos.x;
        const targetX = startX + jumpDist;

        const jumpDuration = 600; // ms
        const startTime = Date.now();

        const jumpLoop = () => {
          const now = Date.now();
          const p = Math.min((now - startTime) / jumpDuration, 1);
          // Parabola
          const h = 180;
          const y = 4 * h * p * (1 - p);
          const currentX = startX + (targetX - startX) * p;

          setCharPos({ x: currentX, y });

          if (p < 1) {
            reqRef.current = requestAnimationFrame(jumpLoop);
          } else {
            checkLanding(targetX);
          }
        };
        reqRef.current = requestAnimationFrame(jumpLoop);
      };

      const checkLanding = (finalX) => {
        const nextLog = logs[1];
        const hitMargin = nextLog.w / 2 + 10;

        if (Math.abs(finalX - nextLog.x) <= hitMargin) {
          // Success
          setCharPos({ x: nextLog.x, y: 0 });

          if (nextLog.hasItem) {
            setLogs(prev => [prev[0], { ...prev[1], collected: true }]);
          }

          setTimeout(() => {
            // 缩短木桩间距，保证两根木桩在手机竖屏中同框可见
            const newLogX = nextLog.x + 100 + Math.random() * 120;
            setLogs([{ ...nextLog, hasItem: false, collected: false }, { x: newLogX, w: 70, hasItem: Math.random() > 0.4 }]);
            setCamX(nextLog.x - 40);

            if (stage < 10) {
              setStage(s => s + 1);
              setGameState('idle');
            } else {
              setGameState('result');
            }
          }, 400);
        } else {
          // Fail
          setCharPos(prev => ({ ...prev, y: -60 })); // sink
          setRetries(r => r - 1);

          setTimeout(() => {
            if (retries - 1 > 0) {
              setCharPos({ x: logs[0].x, y: 0 });
              setGameState('idle');
            } else {
              setGameState('result');
            }
          }, 1000);
        }
      };

      return (
        <div
          style={{
            position: 'absolute', inset: 0, zIndex: 300,
            background: 'linear-gradient(to bottom, #d6ebf2 0%, #b8e0e6 100%)',
            opacity: visible ? 1 : 0,
            transition: 'opacity 0.4s ease',
            fontFamily: '"GuanKiapTsingKhai", serif',
            overflow: 'hidden',
            touchAction: 'none', userSelect: 'none'
          }}
          onPointerDown={handlePointerDown}
          onPointerUp={handlePointerUp}
          onPointerCancel={handlePointerUp}
          onContextMenu={e => e.preventDefault()}
        >
          {/* Scrolling background container */}
          <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }}>
            <div style={{
              position: 'absolute', left: 0, top: 0, bottom: 0, width: '300%',
              backgroundImage: 'url(https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY-NpqewkktE5b2FPccBEOWkWKmXUYtwACrigAAmsm2Ff6xpAtWbzL-D0E.png)',
              backgroundSize: 'cover', backgroundPosition: 'bottom',
              transform: `translateX(-${camX * 0.3}px)`,
              transition: 'transform 0.5s ease-out'
            }} />
          </div>

          {/* Gameplay Area */}
          <div style={{
            position: 'absolute', bottom: 0, left: 0, right: 0, top: '40%',
          }}>
            <div style={{
              position: 'absolute', bottom: 0, left: -camX, transition: 'left 0.5s ease-out',
              width: 10000, height: '100%'
            }}>
              {/* Logs */}
              {logs.map((log, i) => (
                <div key={i} style={{ position: 'absolute', bottom: -20, left: log.x - log.w / 2, width: log.w, height: logH }}>
                  <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY-CtqevzmzJax9UBc8Y0UcSvcx6pTAQACtScAAmsm2FcLGI-XpRi6Qz0E.png" style={{ width: '100%', height: '100%', objectFit: 'fill', filter: 'drop-shadow(0 10px 10px rgba(0,0,0,0.5))' }} draggable="false" />
                  {log.hasItem && (
                    <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY-Cdqevx852wQyIhKkhpD5PHcRwKURQACsScAAmsm2FeVuGbPGveOSj0E.png"
                      style={{
                        position: 'absolute', bottom: logH - 20, left: '50%', transform: 'translateX(-50%)',
                        width: 45, height: 45, filter: 'drop-shadow(0 0 8px rgba(255,255,100,0.8))',
                        animation: log.collected ? 'itemCollect 0.4s ease forwards' : 'none'
                      }} draggable="false" />
                  )}
                </div>
              ))}

              {/* Character */}
              <div style={{
                position: 'absolute',
                bottom: logH - 45 + charPos.y,
                left: charPos.x - charW / 2,
                width: charW, height: charH,
                transition: gameState === 'idle' ? 'left 0.5s ease-out, bottom 0.2s' : 'none'
              }}>
                <img
                  src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY-ClqevymgmdqN8oAAbGwXpbrH5vAQ2cAArMnAAJrJthXTWQDSRPv8eA9BA.png"
                  style={{
                    width: '100%', height: '100%', objectFit: 'contain',
                    transform: isCharging ? `translateY(-2px)` : 'none',
                    transition: 'transform 0.1s',
                    filter: charPos.y < -20 ? 'blur(2px) opacity(0.5)' : 'none'
                  }}
                  draggable="false"
                />
                {/* Leaf Swirl Effect */}
                {isCharging && (
                  <div style={{
                    position: 'absolute', inset: -20, animation: 'swirl 1s linear infinite', pointerEvents: 'none', zIndex: 10
                  }}>
                    <div style={{ position: 'absolute', top: 0, left: '50%', transform: 'translateX(-50%)', color: '#4CAF50', fontSize: '1.2rem', textShadow: '0 0 5px rgba(255,255,255,0.8)' }}>🍃</div>
                    <div style={{ position: 'absolute', bottom: 0, left: '50%', transform: 'translateX(-50%) rotate(180deg)', color: '#8BC34A', fontSize: '1.2rem', textShadow: '0 0 5px rgba(255,255,255,0.8)' }}>🍃</div>
                    <div style={{ position: 'absolute', top: '50%', left: -5, transform: 'translateY(-50%) rotate(-90deg)', color: '#4CAF50', fontSize: '1rem', textShadow: '0 0 5px rgba(255,255,255,0.8)' }}>🍃</div>
                    <div style={{ position: 'absolute', top: '50%', right: -5, transform: 'translateY(-50%) rotate(90deg)', color: '#8BC34A', fontSize: '1rem', textShadow: '0 0 5px rgba(255,255,255,0.8)' }}>🍃</div>
                  </div>
                )}
                {/* Charge effect ring */}
                {isCharging && (
                  <div style={{
                    position: 'absolute', bottom: -5, left: '50%', transform: 'translateX(-50%)',
                    width: 50 + chargeValue * 0.8, height: 20, borderRadius: '50%',

                    boxShadow: `0 0 ${chargeValue / 3}px rgba(100, 255, 100, 0.8)`
                  }} />
                )}
              </div>
            </div>
          </div>

          {/* Water overlay */}
          <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: '15%', background: 'linear-gradient(to top, rgba(150,210,220,0.8) 0%, rgba(180,230,235,0.4) 100%)', pointerEvents: 'none' }} />

          {/* UI Overlay */}

    /* ================================================================
       OFFICE PAGE — 办公台 / 跃金桥活动界面 (9:16)
    ================================================================ */
    function OfficePage({ onBack }) {
      // Extended card pool (循环卡牌池，支持转盘滚动)
      const INITIAL_CARDS = [
        { id: 0, type: 'start', label: '起点' },
        { id: 1, type: 'event', label: '一元复始' },
        { id: 2, type: 'item', icon: '🍀', count: 5 },
        { id: 3, type: 'bridge', label: '跃金桥', sub: '约会 0/3' },
        { id: 4, type: 'item', icon: '🎋', count: 50 },
        { id: 5, type: 'item', icon: '🎏', count: 2 },
        { id: 6, type: 'event', label: '佳节同庆' },
        { id: 7, type: 'item', icon: '💎', count: 1 },
        { id: 8, type: 'bridge', label: '月圆夜', sub: '约会 0/3' },
        { id: 9, type: 'item', icon: '🌸', count: 3 },
        { id: 10, type: 'event', label: '元宵佳节' },
        { id: 11, type: 'item', icon: '🎐', count: 8 },
      ];

      const [cards, setCards] = useState(() => {
        try {
          const saved = localStorage.getItem('cloudfly_cards');
          return saved ? JSON.parse(saved) : INITIAL_CARDS;
        } catch (e) { return INITIAL_CARDS; }
      });
      const TOTAL = cards.length;
      const VISIBLE = 6; // cards visible at a time
      const CARD_W = 58;
      const CARD_H = 88;
      const CARD_GAP = 6;

      const [diceNum, setDiceNum] = useState(21);
      const [isRolling, setIsRolling] = useState(false);
      const [showSpecifyModal, setShowSpecifyModal] = useState(false);
      const [showRewardModal, setShowRewardModal] = useState(false);

      // Target position
      const [absPos, setAbsPos] = useState(0);
      // Continuous float position for rotating wheel
      const [virtualPos, setVirtualPos] = useState(0);
      // Visual result for dice roll
      const [rollResult, setRollResult] = useState(null);

      const [showEditModal, setShowEditModal] = useState(false);

      // History and Confirmation State
      const [historyRecords, setHistoryRecords] = useState(() => {
        try {
          const saved = localStorage.getItem('cloudfly_history');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });
      const [lastRolledCard, setLastRolledCard] = useState(null);
      const [pendingRollFn, setPendingRollFn] = useState(null);
      const [showConfirmModal, setShowConfirmModal] = useState(false);

      const getCard = (abs) => {
        if (TOTAL === 0) return null;
        return cards[((abs % TOTAL) + TOTAL) % TOTAL];
      };

      const doRoll = (n) => {
        if (diceNum <= 0 || isRolling) return;
        setIsRolling(true);
        setRollResult(null); // hide previous result
        setDiceNum(prev => prev - 1);

        setTimeout(() => {
          setRollResult(n); // display current result

          const currentAbs = absPos === -1 ? 0 : absPos;
          const targetPos = currentAbs + n;
          setAbsPos(targetPos);

          const startPos = virtualPos;
          const duration = 1200; // ms
          const startTime = performance.now();

          const animate = (time) => {
            const elapsed = time - startTime;
            const progress = Math.min(elapsed / duration, 1);
            // Ease out cubic
            const ease = 1 - Math.pow(1 - progress, 3);

            setVirtualPos(startPos + (targetPos - startPos) * ease);

            if (progress < 1) {
              requestAnimationFrame(animate);
            } else {
              setIsRolling(false);
              const landedCard = getCard(targetPos);
              if (landedCard && landedCard.type !== 'start') {
                setLastRolledCard(landedCard);
              }
            }
          };
          requestAnimationFrame(animate);
        }, 1000);
      };

      // Ensure we have enough cards to fill the screen (-3 to +3 from center)
      const renderCards = [];
      if (TOTAL > 0) {
        const startIdx = Math.floor(virtualPos) - 3;
        const endIdx = Math.floor(virtualPos) + 3;
        for (let i = startIdx; i <= endIdx; i++) {
          renderCards.push({
            abs: i,
            card: getCard(i)
          });
        }
      }

      const executeOrConfirmRoll = (rollFn) => {
        if (lastRolledCard) {
          setPendingRollFn(() => rollFn);
          setShowConfirmModal(true);
        } else {
          rollFn();
        }
      };

      const handleRoll = () => executeOrConfirmRoll(() => doRoll(Math.ceil(Math.random() * 6)));
      const handleSpecify = (n) => { setShowSpecifyModal(false); executeOrConfirmRoll(() => doRoll(n)); };

      // Arc logic will be calculated continuously per card in render

      // ── Card content renderer (GuFeng Oriental Styling) ──
      const renderCardContent = (card, isLanded) => {
        if (!card) return null;

        const textColor = isLanded ? '#9E2512' : '#FFF2EC';
        const textShadow = isLanded
          ? '0 1px 1px rgba(255,255,255,0.7)'
          : '0 1px 3px rgba(90, 15, 8, 0.9), 0 0 2px rgba(0,0,0,0.5)';

        if (card.type === 'start') return (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%' }}>
            <span style={{ fontFamily: '"Ma Shan Zheng", serif', fontSize: '1.25rem', color: textColor, textShadow, writingMode: 'vertical-rl', letterSpacing: '2px' }}>
              {card.label}
            </span>
          </div>
        );

        if (card.type === 'bridge') return (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', position: 'relative' }}>
            <span style={{ fontFamily: '"Ma Shan Zheng", serif', fontSize: '1.15rem', color: textColor, textShadow, writingMode: 'vertical-rl', letterSpacing: '1px' }}>{card.label}</span>
            <div style={{
              position: 'absolute', bottom: '-8px',
              background: 'linear-gradient(135deg, #E0482B, #A82512)',
              color: '#FFF7F0', fontSize: '0.6rem', padding: '2px 8px', borderRadius: '10px',
              whiteSpace: 'nowrap', border: '1px solid rgba(255, 235, 200, 0.85)',
              boxShadow: '0 2px 6px rgba(80,15,10,0.5)', fontWeight: 'bold', zIndex: 5
            }}>
              {card.sub}
            </div>
          </div>
        );

        if (card.type === 'event') return (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%' }}>
            <span style={{ fontFamily: '"Ma Shan Zheng", serif', fontSize: '1.1rem', color: textColor, textShadow, writingMode: 'vertical-rl', letterSpacing: '1px' }}>
              {card.label}
            </span>
          </div>
        );

        if (card.type === 'item') return (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', position: 'relative' }}>
            <div style={{
              fontSize: '1.6rem', filter: isLanded ? 'drop-shadow(0 2px 4px rgba(158,37,18,0.4))' : 'drop-shadow(0 2px 4px rgba(0,0,0,0.6))',
              transform: 'scale(1.05)'
            }}>{card.icon}</div>
            <div style={{
              position: 'absolute', bottom: '4px', right: '3px',
              background: 'rgba(55, 20, 15, 0.85)', color: '#FFEEDD',
              fontSize: '0.65rem', padding: '1px 5px', borderRadius: '8px',
              border: '1px solid rgba(255, 215, 160, 0.4)', fontWeight: 'bold'
            }}>
              {card.count}
            </div>
          </div>
        );
        return null;
      };

      return (
        <div style={{
          position: 'fixed', inset: 0,
          background: 'url(https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY7BtqeeIz3jaYOPZdqirml8OvBSp3AwACNiIAAmsm0FegoH4bGmX4Iz0E.png) center/cover no-repeat, #1A0F07',
          display: 'flex', flexDirection: 'column',
          zIndex: 50, fontFamily: 'sans-serif', overflow: 'hidden',
        }}>

          {/* ── Top Bar ── */}
          <div style={{ padding: 'max(40px, env(safe-area-inset-top)) 20px 12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', zIndex: 10 }}>
            <div style={{ display: 'flex', gap: '15px' }}>
              <div onClick={onBack} style={{ cursor: 'pointer', fontSize: '1.1rem', color: '#F4E4C1', textShadow: '0 2px 4px rgba(0,0,0,0.5)' }}>←</div>
              <div style={{ cursor: 'pointer', fontSize: '1.1rem', color: '#F4E4C1', textShadow: '0 2px 4px rgba(0,0,0,0.5)' }}>⚙</div>
            </div>

          </div>

          {/* ── Arc Card Carousel (True Wheel) ── */}
          <div style={{ position: 'relative', height: `${CARD_H + 50}px`, overflow: 'hidden', flexShrink: 0 }}>
            {renderCards.map(({ abs, card }) => {
              const offset = abs - virtualPos;
              const isTarget = abs === absPos;
              const isLanded = !isRolling && isTarget;

              // Arc math:
              // X: continuous step
              // Y: parabola, highest at offset 0
              // Rot: tilt proportional to offset
              const yOff = 30 - 6 * (offset * offset);
              const rot = offset * 10;

              const cardBg = isLanded
                ? 'linear-gradient(180deg, #FFFDF8 0%, #FFE9DB 40%, #FFB696 100%)'
                : 'linear-gradient(180deg, rgba(230, 115, 95, 0.76) 0%, rgba(245, 170, 150, 0.86) 100%)';

              const cardBorder = isLanded
                ? '2px solid #F7C678'
                : '1px solid rgba(255, 235, 220, 0.65)';

              const cardShadow = isLanded
                ? '0 0 25px rgba(255, 195, 80, 0.95), 0 8px 20px rgba(90, 20, 10, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.8)'
                : '0 4px 12px rgba(60, 10, 5, 0.35), inset 0 0 8px rgba(255, 255, 255, 0.25)';

              return (
                <div key={abs} style={{
                  position: 'absolute',
                  bottom: `${Math.max(-30, yOff)}px`, // Cap how far down it sinks
                  left: `calc(50% + ${offset * (CARD_W + CARD_GAP)}px)`,
                  marginLeft: `-${CARD_W / 2}px`, // Pivot center
                  width: `${CARD_W}px`,
                  height: `${CARD_H}px`,
                  background: cardBg,
                  border: cardBorder,
                  borderRadius: '6px',
                  transform: `rotate(${rot}deg) ${isLanded ? 'scale(1.18)' : 'scale(1)'}`,
                  transformOrigin: 'bottom center',
                  boxShadow: cardShadow,
                  display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                  zIndex: isLanded ? 10 : 1,
                  transition: 'background 0.3s, box-shadow 0.3s, transform 0.05s linear',
                  backdropFilter: 'blur(2px)',
                }}>
                  {/* Decorative oriental inner frame & corners */}
                  {isLanded ? (
                    <>
                      <div style={{ position: 'absolute', top: '2px', left: '2px', width: '8px', height: '8px', borderTop: '2px solid #FFE29A', borderLeft: '2px solid #FFE29A', borderRadius: '2px 0 0 0', pointerEvents: 'none' }} />
                      <div style={{ position: 'absolute', top: '2px', right: '2px', width: '8px', height: '8px', borderTop: '2px solid #FFE29A', borderRight: '2px solid #FFE29A', borderRadius: '0 2px 0 0', pointerEvents: 'none' }} />
                      <div style={{ position: 'absolute', bottom: '2px', left: '2px', width: '8px', height: '8px', borderBottom: '2px solid #FFE29A', borderLeft: '2px solid #FFE29A', borderRadius: '0 0 0 2px', pointerEvents: 'none' }} />
                      <div style={{ position: 'absolute', bottom: '2px', right: '2px', width: '8px', height: '8px', borderBottom: '2px solid #FFE29A', borderRight: '2px solid #FFE29A', borderRadius: '0 0 2px 0', pointerEvents: 'none' }} />
                      <div style={{ position: 'absolute', inset: '2px', border: '1px solid rgba(212, 175, 55, 0.5)', borderRadius: '4px', pointerEvents: 'none' }} />
                    </>
                  ) : (
                    <div style={{ position: 'absolute', inset: '2px', border: '1px solid rgba(255, 255, 255, 0.3)', borderRadius: '4px', pointerEvents: 'none' }} />
                  )}

                  {renderCardContent(card, isLanded)}
                </div>
              );
            })}
          </div>

          {/* ── Character ── */}
          <div style={{ flex: 1, display: 'flex', justifyContent: 'center', alignItems: 'flex-end', paddingBottom: '35vh' }}>
            <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY7BpqeeHUP6ToEMxVlW2eOzPYjHkupgACNSIAAmsm0Fcgpr8B8BW1vj0E.png"
              style={{ width: '80px', height: 'auto', filter: 'drop-shadow(0 10px 10px rgba(0,0,0,0.6))', zIndex: 1 }} alt="couple" />
          </div>

          {/* ── Bottom UI ── */}
          <div style={{ position: 'absolute', bottom: '50px', width: '100%', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', padding: '0 25px', boxSizing: 'border-box', zIndex: 10 }}>
            {/* Left: 游园清单 & 历史记录 */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: '15px', transform: 'translateX(-10px) translateY(-5px)' }}>
              {/* Park List / Edit Cards */}

                          <input type="number" value={c.count || 0} onChange={(e) => {

                            localStorage.setItem('cloudfly_cards', JSON.stringify(newCards));

                        </div>

                </div>
                <div onClick={() => setShowEditModal(false)} style={{ marginTop: '15px', color: '#D4AF37', cursor: 'pointer', letterSpacing: '2px', textAlign: 'center', background: 'rgba(212,175,55,0.1)', padding: '10px', borderRadius: '6px', border: '1px solid rgba(212,175,55,0.4)', fontWeight: 'bold' }}>完 成</div>
              </div>
            </div>

          <style>{`
            @keyframes spin {
              0% { transform: rotate(0deg) scale(1); }

              80%  { opacity: 1; transform: translateY(0) scale(1); }
              100% { opacity: 0; transform: translateY(-20px) scale(0.9); }
            }
          `}</style>
        </div>
      );
