<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="云飞阁 — 私人订制的古风陪伴空间" />
  <title>云飞阁</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet"
    href="https://cn-font.claude-code-best.win/packages/GuanKiapTsingKhai/dist/GuanKiapTsingKhai/result.css" />

  <!-- React 18 UMD + Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ============================================================
       RESET & ROOT TOKENS
    ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #C9A84C;
      --gold-light: #F0D080;
      --gold-bright: #FFE87A;
      --gold-dim: rgba(201, 168, 76, 0.38);
      --gold-glow: rgba(201, 168, 76, 0.18);
      --parchment: #F5E6C8;
      --ink: #1A1008;
      --glass-bg: rgba(12, 7, 2, 0.58);
      --glass-border: rgba(201, 168, 76, 0.30);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06030100;
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      -webkit-tap-highlight-color: transparent;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #110902 0%, #040200 100%);
    }

    /* ============================================================
       PHONE SHELL  —  9:16 竖屏容器
    ============================================================ */
    .shell {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      overflow: hidden;
      background: #06030100;
      user-select: none;
    }

    /* ============================================================
       BACKGROUND VIDEO / IMAGE
    ============================================================ */
    .bg-video,
    .bg-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* cinematic vignette + bottom darken */
    .bg-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(4, 2, 0, 0.55) 100%),
        linear-gradient(to bottom,
          rgba(0, 0, 0, 0.08) 0%,
          rgba(0, 0, 0, 0.00) 35%,
          rgba(0, 0, 0, 0.12) 68%,
          rgba(4, 2, 0, 0.72) 100%);
      pointer-events: none;
    }

    /* night mode layer */
    .night-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: rgba(6, 4, 22, 0.58);
      mix-blend-mode: multiply;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }

    /* ============================================================
       FLOATING DUST / PETAL PARTICLES
    ============================================================ */
    .particles {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      border-radius: 50% 0 50% 0;
      animation: petalDrift linear infinite;
      will-change: transform, opacity;
    }

    @keyframes petalDrift {
      0% {
        transform: translateY(-5%) translateX(0) rotate(0deg);
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      50% {
        transform: translateY(50vh) translateX(40px) rotate(360deg);
      }

      92% {
        opacity: 0.6;
      }

      100% {
        transform: translateY(108vh) translateX(-20px) rotate(720deg);
        opacity: 0;
      }
    }

    /* ============================================================
       BOOT SCREEN
    ============================================================ */
    .boot {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: radial-gradient(ellipse at 50% 40%, #1c0d04 0%, #06030100 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      cursor: pointer;
      animation: bootIn 1.2s ease both;
    }

    .boot.out {
      animation: bootOut 0.85s ease forwards;
    }

    @keyframes bootIn {
      from {
        opacity: 0;
        filter: blur(10px);
      }

      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    @keyframes bootOut {
      to {
        opacity: 0;
        filter: blur(6px);
        pointer-events: none;
      }
    }

    .boot-seal {
      width: clamp(56px, 14vw, 80px);
      height: clamp(56px, 14vw, 80px);
      border: 1.5px solid var(--gold-dim);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Ma Shan Zheng', serif;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: var(--gold);
      animation: sealIn 1.4s 0.3s ease both;
      box-shadow: 0 0 24px var(--gold-glow), inset 0 0 14px rgba(201, 168, 76, 0.08);
    }

    @keyframes sealIn {
      from {
        opacity: 0;
        transform: scale(0.6) rotate(-20deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .boot-title {
      font-family: 'Ma Shan Zheng', serif;
      font-size: clamp(2.2rem, 7.5vw, 3.4rem);
      color: var(--gold-light);
      letter-spacing: 0.35em;
      text-shadow: 0 0 28px rgba(201, 168, 76, 0.55), 0 0 60px rgba(201, 168, 76, 0.18);
      animation: titleReveal 1.6s 0.7s ease both;
    }

    @keyframes titleReveal {
      from {
        opacity: 0;
        letter-spacing: 0.9em;
      }

      to {
        opacity: 1;
        letter-spacing: 0.35em;
      }
    }

    .boot-divider {
      width: clamp(40px, 10vw, 60px);
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      animation: fadeUp 1s 1.3s ease both;
    }

    .boot-sub {
      font-size: clamp(0.62rem, 2vw, 0.82rem);
      color: rgba(245, 220, 175, 0.52);
      letter-spacing: 0.25em;
      animation: fadeUp 1s 1.6s ease both;
    }

    .boot-hint {
      position: absolute;
      bottom: 12%;
      font-size: clamp(0.58rem, 1.8vw, 0.72rem);
      color: rgba(245, 220, 175, 0.30);
      letter-spacing: 0.22em;
      animation: fadeUp 1s 2.4s ease both, breathe 2.4s 3s ease-in-out infinite;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.30;
      }

      50% {
        opacity: 0.68;
      }
    }

    /* ============================================================
       TOP BAR
    ============================================================ */
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: clamp(12px, 3.5vw, 18px) clamp(14px, 4vw, 20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(4, 2, 0, 0.55) 0%, transparent 100%);
      pointer-events: none;
    }

    .topbar-title {
      font-family: 'Ma Shan Zheng', serif;
      font-size: clamp(0.95rem, 3vw, 1.25rem);
      color: var(--gold-light);
      letter-spacing: 0.3em;
      text-shadow: 0 0 16px rgba(201, 168, 76, 0.45);
      pointer-events: auto;
    }

    .topbar-btns {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      width: clamp(30px, 7vw, 36px);
      height: clamp(30px, 7vw, 36px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(12, 7, 2, 0.52);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      cursor: pointer;
      font-size: clamp(0.75rem, 2.2vw, 0.95rem);
      color: var(--gold-light);
      transition: all 0.22s ease;
      backdrop-filter: blur(6px);
    }

    .icon-btn:hover {
      background: rgba(201, 168, 76, 0.18);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* ============================================================
       HOTSPOTS
    ============================================================ */
    .hotspot-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.2s ease;
    }

    .hotspot:active {
      transform: scale(0.95) !important;
    }

    /* pulsing aura ring */
    .hs-ring {
      position: absolute;
      inset: -5px;
      border: 1.5px solid rgba(201, 168, 76, 0);
      border-radius: inherit;
      transition: all 0.32s ease;
      animation: ringGlow 3.5s ease-in-out infinite;
    }

    .hotspot:hover .hs-ring {
      inset: -6px;
      border-color: var(--gold);
      box-shadow: 0 0 14px var(--gold-dim), inset 0 0 8px rgba(201, 168, 76, 0.15);
    }

    @keyframes ringGlow {

      0%,
      100% {
        box-shadow: 0 0 6px rgba(201, 168, 76, 0.10);
      }

      50% {
        box-shadow: 0 0 18px rgba(201, 168, 76, 0.25);
      }
    }

    /* label tooltip */
    .hs-label {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: clamp(0.52rem, 1.4vw, 0.68rem);
      color: var(--gold-light);
      background: rgba(8, 5, 2, 0.80);
      padding: 3px 9px;
      border-radius: 12px;
      border: 1px solid var(--gold-dim);
      letter-spacing: 0.12em;
      opacity: 0;
      transition: opacity 0.22s;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    .hotspot:hover .hs-label {
      opacity: 1;
    }

    /* small dot indicator */
    .hs-dot {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 5px;
      height: 5px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--gold);
      animation: dotPulse 2s ease-in-out infinite;
      opacity: 0.7;
    }

    @keyframes dotPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.7;
      }

      50% {
        transform: scale(1.5);
        opacity: 1;
      }
    }

    /* hover glow overlay on the hotspot itself */
    .hs-glow {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(201, 168, 76, 0);
      transition: background 0.28s;
    }

    .hotspot:hover .hs-glow {
      background: rgba(201, 168, 76, 0.08);
    }

    /* Custom Image Hotspot */
    .hs-img-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .hotspot:hover .hs-img-container {
      transform: scale(1.08);
    }

    .hs-img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
    }

    .hs-img-text {
      margin-top: 4px;
      font-size: clamp(0.55rem, 1.6vw, 0.72rem);
      color: var(--gold-light);
      background: rgba(8, 5, 2, 0.60);
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid var(--gold-dim);
      letter-spacing: 0.1em;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    /* Theater Page Hotspots */
    .th-text-btn {
      transition: transform 0.2s ease;
    }

    .th-text-btn:hover {
      transform: scale(1.08);
    }

    .th-text-btn:active {
      transform: scale(0.95) !important;
    }

    /* ============================================================
       RIPPLE
    ============================================================ */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(201, 168, 76, 0.28);
      transform: scale(0);
      animation: rippleOut 0.65s ease-out forwards;
      pointer-events: none;
    }

    @keyframes rippleOut {
      to {
        transform: scale(4.5);
        opacity: 0;
      }
    }

    /* ============================================================
       BOTTOM NAVIGATION
    ============================================================ */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: clamp(10px, 2.5vw, 14px) 4px;
      padding-bottom: max(clamp(10px, 2.5vw, 14px), env(safe-area-inset-bottom, 10px));
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: clamp(5px, 1.5vw, 8px) clamp(8px, 2.5vw, 14px);
      border-radius: 12px;
      transition: all 0.25s ease;
      color: rgba(240, 210, 140, 0.50);
      border: 1px solid transparent;
      min-width: 54px;
      position: relative;
    }

    .nav-item:hover,
    .nav-item.active {
      color: var(--gold-light);
      background: rgba(201, 168, 76, 0.10);
      border-color: var(--glass-border);
    }

    .nav-item.active .nav-icon {
      filter: drop-shadow(0 0 5px var(--gold));
    }

    .nav-item:active {
      transform: scale(0.94);
    }

    .nav-icon {
      font-size: clamp(1.05rem, 3.2vw, 1.35rem);
      transition: transform 0.22s;
      line-height: 1;
    }

    .nav-item:hover .nav-icon {
      transform: translateY(-2px);
    }

    .nav-label {
      font-size: clamp(0.52rem, 1.55vw, 0.70rem);
      letter-spacing: 0.10em;
      white-space: nowrap;
    }

    /* ============================================================
       BOTTOM SHEET MODAL
    ============================================================ */
    .backdrop {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(4, 2, 0, 0.55);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      align-items: flex-end;
      animation: bdIn 0.28s ease;
    }

    @keyframes bdIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .sheet {
      width: 100%;
      background: linear-gradient(160deg, rgba(22, 12, 5, 0.96) 0%, rgba(12, 6, 2, 0.98) 100%);
      backdrop-filter: blur(24px);
      border-top: 1px solid var(--glass-border);
      border-radius: 20px 20px 0 0;
      padding: clamp(16px, 4vw, 22px) clamp(20px, 5.5vw, 28px);
      padding-bottom: max(clamp(16px, 4vw, 22px), env(safe-area-inset-bottom, 16px));
      animation: sheetUp 0.38s cubic-bezier(0.32, 0.72, 0, 1);
    }

    @keyframes sheetUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .sheet-handle {
      width: 34px;
      height: 3px;
      background: rgba(201, 168, 76, 0.30);
      border-radius: 2px;
      margin: 0 auto clamp(14px, 3.5vw, 20px);
    }

    .sheet-icon {
      font-size: clamp(1.4rem, 4.5vw, 1.9rem);
      margin-bottom: 8px;
      display: block;
    }

    .sheet-title {
      font-family: 'Ma Shan Zheng', serif;
      font-size: clamp(1.15rem, 3.8vw, 1.55rem);
      color: var(--gold-light);
      letter-spacing: 0.22em;
      text-shadow: 0 0 18px rgba(201, 168, 76, 0.38);
      margin-bottom: 6px;
    }

    .sheet-sub {
      font-size: clamp(0.62rem, 1.9vw, 0.78rem);
      color: rgba(245, 215, 160, 0.48);
      letter-spacing: 0.18em;
      margin-bottom: 14px;
    }

    .sheet-divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
      margin-bottom: clamp(12px, 3vw, 18px);
    }

    .sheet-desc {
      font-size: clamp(0.70rem, 2.1vw, 0.85rem);
      color: rgba(245, 215, 160, 0.72);
      line-height: 1.85;
      letter-spacing: 0.06em;
      margin-bottom: clamp(18px, 4.5vw, 26px);
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
    }

    .btn-enter {
      flex: 1;
      padding: clamp(10px, 2.8vw, 14px);
      background: linear-gradient(135deg, rgba(201, 168, 76, 0.28) 0%, rgba(201, 168, 76, 0.10) 100%);
      border: 1px solid var(--gold);
      border-radius: 10px;
      color: var(--gold-light);
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(0.70rem, 2.1vw, 0.86rem);
      letter-spacing: 0.18em;
      cursor: pointer;
      transition: all 0.25s;
      text-shadow: 0 0 8px rgba(201, 168, 76, 0.38);
    }

    .btn-enter:hover {
      background: linear-gradient(135deg, rgba(201, 168, 76, 0.42) 0%, rgba(201, 168, 76, 0.20) 100%);
      box-shadow: 0 0 14px var(--gold-dim);
    }

    .btn-enter:active {
      transform: scale(0.97);
    }

    .btn-close {
      padding: clamp(10px, 2.8vw, 14px) clamp(14px, 3.5vw, 20px);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: rgba(240, 210, 140, 0.40);
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(0.65rem, 1.9vw, 0.78rem);
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: all 0.22s;
    }

    .btn-close:hover {
      background: rgba(255, 255, 255, 0.07);
      color: rgba(240, 210, 140, 0.65);
    }

    .btn-close:active {
      transform: scale(0.97);
    }

    /* ============================================================
       TRANSITION OVERLAY
    ============================================================ */
    .transition-overlay {
      position: absolute;
      inset: 0;
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 50%, rgba(201, 168, 76, 0.08) 0%, rgba(4, 2, 0, 0.98) 60%);
      animation: txIn 0.45s ease both;
    }

    @keyframes txIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .tx-circle {
      width: clamp(64px, 16vw, 88px);
      height: clamp(64px, 16vw, 88px);
      border: 1.5px solid var(--gold-dim);
      border-radius: 50%;
      position: relative;
      animation: txCircle 1s ease both;
    }

    .tx-circle::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 1px solid rgba(201, 168, 76, 0.15);
    }

    .tx-circle-char {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Ma Shan Zheng', serif;
      font-size: clamp(1.4rem, 4.5vw, 1.9rem);
      color: var(--gold);
      text-shadow: 0 0 20px var(--gold);
    }

    @keyframes txCircle {
      0% {
        transform: scale(0.4) rotate(-90deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.08) rotate(5deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .tx-text {
      font-family: 'Ma Shan Zheng', serif;
      font-size: clamp(0.85rem, 2.8vw, 1.15rem);
      color: var(--gold-light);
      letter-spacing: 0.4em;
      animation: fadeUp 0.6s 0.3s ease both;
      text-shadow: 0 0 14px rgba(201, 168, 76, 0.45);
    }

    .tx-dots {
      font-size: clamp(0.55rem, 1.6vw, 0.68rem);
      color: rgba(245, 210, 140, 0.35);
      letter-spacing: 0.5em;
      animation: fadeUp 0.6s 0.5s ease both, breathe 1.4s 1s ease-in-out infinite;
    }

    /* ============================================================
       APP PLACEHOLDER PAGE
    ============================================================ */
    .app-page {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: radial-gradient(ellipse at 50% 30%, #1a0e06 0%, #080402 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      animation: bootIn 0.55s ease both;
    }

    .page-emblem {
      font-size: clamp(2.2rem, 7vw, 3rem);
      margin-bottom: 8px;
      filter: drop-shadow(0 0 12px rgba(201, 168, 76, 0.5));
    }

    .page-title {
      font-family: 'Ma Shan Zheng', serif;
      font-size: clamp(1.3rem, 4.5vw, 1.85rem);
      color: var(--gold-light);
      letter-spacing: 0.3em;
      text-shadow: 0 0 22px rgba(201, 168, 76, 0.4);
    }

    .page-sub {
      font-size: clamp(0.60rem, 1.8vw, 0.75rem);
      color: rgba(245, 210, 140, 0.38);
      letter-spacing: 0.22em;
    }

    .page-divider {
      width: 50px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
      margin: 6px 0;
    }

    .page-notice {

    ================================================================ */
    class MusicDB {
      constructor() {
        this.dbName = 'CloudflyMusicDB';
        this.storeName = 'music_store';
        this.db = null;
      }
      async init() {
        if (this.db) return;
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, 1);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => { this.db = request.result; resolve(); };
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(this.storeName)) {
              db.createObjectStore(this.storeName, { keyPath: 'id' });
            }
          };
        });
      }
      async saveMusic(id, name, blob) {
        await this.init();
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(this.storeName, 'readwrite');
          const store = tx.objectStore(this.storeName);
          const req = store.put({ id, name, blob, addedAt: Date.now() });
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }
      async getMusicList() {
        await this.init();
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(this.storeName, 'readonly');
          const store = tx.objectStore(this.storeName);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result.map(m => ({ id: m.id, name: m.name, addedAt: m.addedAt })).sort((a, b) => b.addedAt - a.addedAt));
          req.onerror = () => reject(req.error);
        });
      }
      async getMusicBlob(id) {
        await this.init();
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(this.storeName, 'readonly');
          const store = tx.objectStore(this.storeName);
          const req = store.get(id);
          req.onsuccess = () => resolve(req.result ? req.result.blob : null);
          req.onerror = () => reject(req.error);
        });
      }
      async deleteMusic(id) {
        await this.init();
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(this.storeName, 'readwrite');
          const store = tx.objectStore(this.storeName);
          const req = store.delete(id);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

    /* ── 3D 景深偷看木牌弹窗组件 ── */
    function PeachTreePeekingModal({ cards, onClose }) {
      const [activeIndex, setActiveIndex] = useState(0);
      const [modalVisible, setModalVisible] = useState(false);
      const MAX_VISIBILITY = 3;

      useEffect(() => {
        requestAnimationFrame(() => setModalVisible(true));
      }, []);

      const handleClose = () => {
        setModalVisible(false);
        setTimeout(onClose, 300);
      };

      return (
        <div
          onClick={handleClose}
          style={{
            position: 'fixed',
            inset: 0,
            zIndex: 100,
            background: 'rgba(5, 3, 2, 0.75)',
            backdropFilter: 'blur(10px)',
            WebkitBackdropFilter: 'blur(10px)',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            justifyContent: 'center',
            opacity: modalVisible ? 1 : 0,
            transition: 'opacity 0.35s ease',
          }}
        >
          {/* 关闭按钮 */}
          <div
            onClick={e => { e.stopPropagation(); handleClose(); }}
            style={{
              position: 'absolute',
              top: 'clamp(20px, 4vw, 30px)',
              right: 'clamp(20px, 4vw, 30px)',
              color: '#FFE6A0',
              fontSize: 'clamp(1.4rem, 3vw, 2rem)',
              cursor: 'pointer',
              zIndex: 110,
              width: '40px',
              height: '40px',
              borderRadius: '50%',
              border: '1px solid rgba(255, 230, 160, 0.3)',
              background: 'rgba(15, 10, 5, 0.6)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              transition: 'all 0.2s',
            }}
            onMouseEnter={e => {
              e.currentTarget.style.transform = 'scale(1.1)';
              e.currentTarget.style.borderColor = 'rgba(255, 230, 160, 0.8)';
            }}
            onMouseLeave={e => {
              e.currentTarget.style.transform = 'scale(1)';
              e.currentTarget.style.borderColor = 'rgba(255, 230, 160, 0.3)';
            }}
          >
            ✕
          </div>

          {/* 标题说明 */}
          <div style={{
            position: 'absolute',
            top: 'clamp(25px, 5vw, 45px)',
            color: '#FFE6A0',
            fontFamily: '"GuanKiapTsingKhai", serif',
            fontSize: 'clamp(1rem, 2.5vw, 1.4rem)',
            letterSpacing: '0.25em',
            textShadow: '0 2px 6px rgba(0,0,0,0.8)',
            pointerEvents: 'none',
            zIndex: 105,
          }}>
            桃 树 寄 语
          </div>

          {/* 3D Carousel Stage */}
          <div
            onClick={e => e.stopPropagation()}
            style={{
              position: 'relative',
              width: 'clamp(280px, 48vw, 420px)',
              height: 'clamp(420px, 68vw, 600px)',
              perspective: '800px',
              transformStyle: 'preserve-3d',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
            }}
          >
            {/* 左切箭头 */}
            {activeIndex > 0 && (
              <button
                onClick={() => setActiveIndex(i => i - 1)}
                style={{
                  position: 'absolute',
                  left: '-75px',
                  top: '50%',
                  transform: 'translateY(-50%)',
                  background: 'rgba(20, 15, 10, 0.65)',
                  border: '1px solid rgba(255, 230, 160, 0.4)',
                  color: '#FFE6A0',
                  fontSize: '2.2rem',
                  borderRadius: '50%',
                  width: '50px',
                  height: '50px',
                  cursor: 'pointer',
                  zIndex: 20,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  transition: 'all 0.2s',
                  boxShadow: '0 4px 12px rgba(0,0,0,0.5)',
                }}
                onMouseEnter={e => {
                  e.currentTarget.style.background = 'rgba(40, 25, 15, 0.85)';
                  e.currentTarget.style.transform = 'translateY(-50%) scale(1.1)';
                }}
                onMouseLeave={e => {
                  e.currentTarget.style.background = 'rgba(20, 15, 10, 0.65)';
                  e.currentTarget.style.transform = 'translateY(-50%) scale(1)';
                }}
              >
                ‹
              </button>
            )}

            {/* 3D 卡片列表 */}
            {cards.map((card, i) => {
              const active = activeIndex;
              const offset = (active - i) / 3;
              const direction = Math.sign(active - i);
              const absOffset = Math.abs(active - i) / 3;
              const isVisible = Math.abs(active - i) <= MAX_VISIBILITY;
              const isCurrent = active === i;

              return (
                <div
                  key={card.id}
                  onClick={() => setActiveIndex(i)}
                  style={{
                    position: 'absolute',
                    width: '100%',
                    height: '100%',
                    transform: `
                      rotateY(${offset * 38}deg) 
                      scaleY(${1 + absOffset * -0.25})
                      translateZ(${absOffset * -24}rem)
                      translateX(${direction * -7}rem)
                    `,
                    filter: `blur(${absOffset * 0.7}rem) brightness(${isCurrent ? 1 : 0.65})`,
                    opacity: isVisible ? 1 : 0,
                    display: Math.abs(active - i) > MAX_VISIBILITY ? 'none' : 'block',
                    pointerEvents: isVisible ? 'auto' : 'none',
                    cursor: isCurrent ? 'default' : 'pointer',
                    transition: 'all 0.35s cubic-bezier(0.25, 1, 0.5, 1)',
                    willChange: 'transform, filter',
                  }}
                >
                  {/* 木牌图片及叠加文字结构 */}
                  <div
                    style={{
                      width: '100%',
                      height: '100%',
                      position: 'relative',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      filter: isCurrent
                        ? 'drop-shadow(0 14px 28px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 15px rgba(255, 230, 160, 0.35))'
                        : 'drop-shadow(0 6px 14px rgba(0,0,0,0.6))',
                      transition: 'filter 0.35s ease',
                    }}
                  >
                    {/* 木牌完整原图 */}
                    <img
                      src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY0sVqdyhFBGIPfcNDViIZCPhnVuPz6gACjikAAvmbuFeWkbuDlfjkYj0E.png"
                      alt="完整木牌"
                      style={{
                        width: '100%',
                        height: '100%',
                        objectFit: 'contain',
                        display: 'block',
                        pointerEvents: 'none',
                      }}
                    />
                  </div>
                </div>
              );
            })}

            {/* 右切箭头 */}
            {activeIndex < cards.length - 1 && (
              <button
                onClick={() => setActiveIndex(i => i + 1)}
                style={{
                  position: 'absolute',
                  right: '-75px',
                  top: '50%',
                  transform: 'translateY(-50%)',
                  background: 'rgba(20, 15, 10, 0.65)',
                  border: '1px solid rgba(255, 230, 160, 0.4)',
                  color: '#FFE6A0',
                  fontSize: '2.2rem',
                  borderRadius: '50%',
                  width: '50px',
                  height: '50px',
                  cursor: 'pointer',
                  zIndex: 20,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  transition: 'all 0.22s',
                  boxShadow: '0 4px 12px rgba(0,0,0,0.5)',
                }}
                onMouseEnter={e => {
                  e.currentTarget.style.background = 'rgba(40, 25, 15, 0.85)';
                  e.currentTarget.style.transform = 'translateY(-50%) scale(1.1)';
                }}
                onMouseLeave={e => {
                  e.currentTarget.style.background = 'rgba(20, 15, 10, 0.65)';
                  e.currentTarget.style.transform = 'translateY(-50%) scale(1)';
                }}
              >
                ›
              </button>
            )}
          </div>

          {/* 底部翻页指示说明 */}

    /* ================================================================
       API SETTINGS PANEL
    ================================================================ */
    function ApiSettingsPanel({ onClose }) {
      const [configs, setConfigs] = useState([]);
      const [currentConfig, setCurrentConfig] = useState({
        name: "", type: "official", url: "", apiKey: "", model: "", models: [],
      });
      const [isLoadingModels, setIsLoadingModels] = useState(false);
      const [selectedConfigIndex, setSelectedConfigIndex] = useState(-1);

      useEffect(() => {
        const savedConfigs = localStorage.getItem("cloudfly_api_configs");
        const savedSelectedIndex = localStorage.getItem("cloudfly_selected_api_config_index");
        if (savedConfigs) {
          try {
            const parsed = JSON.parse(savedConfigs);
            setConfigs(parsed);
            if (parsed.length > 0) {
              const index = savedSelectedIndex ? parseInt(savedSelectedIndex) : 0;
              const validIndex = index >= 0 && index < parsed.length ? index : 0;
              setSelectedConfigIndex(validIndex);
              setCurrentConfig({ ...parsed[validIndex] });
            }
          } catch (e) { console.error("Failed to load API configs:", e); }
        }
      }, []);

      useEffect(() => {
        if (selectedConfigIndex >= 0) {
          localStorage.setItem("cloudfly_selected_api_config_index", selectedConfigIndex.toString());
        }
      }, [selectedConfigIndex]);

      const saveConfigs = (newConfigs) => {
        setConfigs(newConfigs);
        localStorage.setItem("cloudfly_api_configs", JSON.stringify(newConfigs));
      };

      const fetchModels = async () => {
        if (!currentConfig.url || !currentConfig.apiKey) { alert("请先填写 URL 和 API Key"); return; }
        setIsLoadingModels(true);
        try {
          let endpoint = currentConfig.url;
          if (!endpoint.startsWith("http://") && !endpoint.startsWith("https://")) endpoint = "https://" + endpoint;
          if (!endpoint.endsWith("/")) endpoint += "/";
          let modelsEndpoint = currentConfig.type === "official" ? endpoint + "v1/models" : endpoint + "api/models";

          const response = await fetch(modelsEndpoint, {
            headers: { Authorization: `Bearer ${currentConfig.apiKey}`, "Content-Type": "application/json" },
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          const data = await response.json();
          let models = currentConfig.type === "official" ? data.data.map(item => item.id) : (data.data || []);
          setCurrentConfig(prev => ({ ...prev, models }));
          alert(`成功拉取 ${models.length} 个模型`);
        } catch (error) { alert("拉取模型失败: " + error.message); } finally { setIsLoadingModels(false); }
      };

      const saveCurrentConfig = () => {
        if (!currentConfig.name.trim()) { alert("请为配置命名"); return; }
        const newConfig = { ...currentConfig, id: Date.now(), lastUpdated: new Date().toISOString() };
        let newConfigs;
        if (selectedConfigIndex >= 0) {
          newConfigs = [...configs];
          newConfigs[selectedConfigIndex] = newConfig;
        } else {
          newConfigs = [...configs, newConfig];
          setSelectedConfigIndex(configs.length);
        }
        saveConfigs(newConfigs);
        alert("配置已保存");
      };

      const deleteConfig = (index) => {
        if (confirm("确定要删除此配置吗？")) {
          const newConfigs = configs.filter((_, i) => i !== index);
          saveConfigs(newConfigs);
          if (selectedConfigIndex === index) {
            setSelectedConfigIndex(-1);
            setCurrentConfig({ name: "", type: "official", url: "", apiKey: "", model: "", models: [] });
          } else if (selectedConfigIndex > index) {
            setSelectedConfigIndex(selectedConfigIndex - 1);
          }
        }
      };

      const testConnection = async () => {
        if (!currentConfig.url || !currentConfig.apiKey) { alert("请先填写 URL 和 API Key"); return; }
        try {
          let endpoint = currentConfig.url;
          if (!endpoint.endsWith("/")) endpoint += "/";
          endpoint += (currentConfig.type === "official" ? "v1/models" : "api/models");
          const response = await fetch(endpoint, {
            headers: { Authorization: `Bearer ${currentConfig.apiKey}`, "Content-Type": "application/json" }
          });
          if (response.ok) alert("连接成功！API 服务正常工作。");
          else alert(`连接失败：HTTP ${response.status}`);

        const id = Date.now().toString();

        try {
          await musicDB.saveMusic(id, name, file);
          const list = await musicDB.getMusicList();
          setMusicList(list);
          alert("导入成功！");

          alert("导入失败: " + error.message);

        e.stopPropagation();
        if (confirm("确定要删除此曲目吗？")) {
          await musicDB.deleteMusic(id);
          const list = await musicDB.getMusicList();
          setMusicList(list);

            window.dispatchEvent(new CustomEvent('music-changed', { detail: null }));

    /* ================================================================
       INDEXEDDB HELPERS
    ================================================================ */
    const DB_NAME = 'CloudFlyDB';
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = window.indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('voices')) {
            db.createObjectStore('voices', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('audios')) {
            db.createObjectStore('audios', { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getAllVoices() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('voices', 'readonly');
        const req = tx.objectStore('voices').getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function putVoice(voice) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('voices', 'readwrite');
        const req = tx.objectStore('voices').put(voice);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function getAllAudios() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('audios', 'readonly');
        const req = tx.objectStore('audios').getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function putAudio(id, blob) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('audios', 'readwrite');
        const req = tx.objectStore('audios').put({ id, blob });
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

      // 播放声音提示音（Web Audio API 模拟柔和的古风雅音）
      const playVoiceTone = () => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.3);

          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start();
          osc.stop(ctx.currentTime + 0.8);
        } catch (e) { }
      };
