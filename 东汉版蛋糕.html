<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>洛阳凌阴 · 东汉冰饮工坊</title>
<style>
  :root {
    --bg-cream: #FFF9EF;
    --bg-peach: #FBE4C9;
    --panel-bg: rgba(255, 252, 245, 0.95);
    --brown-dark: #3E2215;
    --brown-mid: #784B31;
    --brown-light: #B58867;
    --accent-coral: #DF5B43;
    --accent-coral-dark: #BE412B;
    --accent-gold: #EBB041;
    --accent-green: #6A9E78;
    --border-warm: #EAD4BC;
    --shadow-warm: 0 8px 24px rgba(120, 75, 49, 0.12);
  }
  * {
    box-sizing: border-box; margin: 0; padding: 0;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%; height: 100%; height: 100dvh; overflow: hidden;
    background: radial-gradient(circle at 50% 32%, #FFFDF9 0%, var(--bg-cream) 52%, var(--bg-peach) 100%);
    font-family: "Songti SC", "STSong", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", serif;
    color: var(--brown-dark);
  }
  #app {
    display: flex; flex-direction: column; width: 100%; max-width: 520px;
    height: 100%; margin: 0 auto; position: relative;
    box-shadow: 0 0 40px rgba(120, 75, 49, 0.10);
  }
  .top-header {
    flex-shrink: 0; padding: 10px 14px 6px;
    background: rgba(255, 251, 244, 0.88); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-warm); z-index: 20;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .brand-title { font-size: 16px; font-weight: 700; color: var(--brown-dark); letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-warm);
    background: #FFF; color: var(--brown-mid); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s;
  }
  .icon-btn:active { transform: scale(0.92); background: var(--bg-cream); }
  .stepper { display: flex; justify-content: space-between; align-items: center; position: relative; padding: 0 4px; }
  .stepper::before {
    content: ''; position: absolute; top: 12px; left: 20px; right: 20px;
    height: 2px; background: var(--border-warm); z-index: 0;
  }
  .step-item {
    position: relative; z-index: 1; display: flex; flex-direction: column;
    align-items: center; gap: 3px; cursor: pointer; opacity: 0.55; transition: all 0.25s;
  }
  .step-item.active, .step-item.done { opacity: 1; }
  .step-dot {
    width: 24px; height: 24px; border-radius: 50%; background: #FFF;
    border: 2px solid var(--border-warm); display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--brown-mid); transition: all 0.25s;
  }
  .step-item.active .step-dot {
    background: var(--accent-coral); border-color: var(--accent-coral); color: #FFF;
    transform: scale(1.12); box-shadow: 0 3px 10px rgba(223, 91, 67, 0.35);
  }
  .step-item.done .step-dot { background: var(--accent-gold); border-color: var(--accent-gold); color: #FFF; }
  .step-label { font-size: 10px; font-weight: 600; color: var(--brown-mid); }
  .step-item.active .step-label { color: var(--accent-coral-dark); font-weight: 700; }

  .prompt-bar {
    flex-shrink: 0; margin: 8px 12px 0; padding: 8px 12px;
    background: rgba(255, 255, 255, 0.90); border: 1px solid var(--border-warm);
    border-radius: 14px; box-shadow: 0 4px 12px rgba(120, 75, 49, 0.06);
    display: flex; flex-direction: column; gap: 5px; z-index: 15;
  }
  .prompt-top { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--brown-dark); gap: 8px; }
  .prompt-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #FFF0E5; color: var(--accent-coral-dark); font-weight: 700; white-space: nowrap; }
  .progress-track { width: 100%; height: 6px; background: #F3E5D7; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-gold), var(--accent-coral)); border-radius: 4px; transition: width 0.15s ease-out; }

  .stage-wrap { flex: 1 1 0; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #cakeCanvas { max-width: 100%; max-height: 100%; width: auto; height: auto; aspect-ratio: 720 / 760; touch-action: none; display: block; }
  .stage-floating-tools { position: absolute; top: 10px; right: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 12; }
  .stage-camera-controls { position: absolute; top: 10px; left: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 12; }
  .zoom-group { display: flex; align-items: center; background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-warm); border-radius: 18px; box-shadow: 0 4px 10px rgba(120, 75, 49, 0.08); overflow: hidden; }
  .zoom-btn { border: none; background: transparent; color: var(--brown-dark); font-size: 12px; font-weight: 700; padding: 5px 8px; cursor: pointer; min-width: 26px; display: flex; align-items: center; justify-content: center; }
  .zoom-btn:active { background: var(--bg-cream); }
  .zoom-readout { font-size: 11px; font-weight: 700; color: var(--brown-mid); padding: 4px 6px; border-left: 1px solid var(--border-warm); border-right: 1px solid var(--border-warm); cursor: pointer; min-width: 44px; text-align: center; }
  .float-pill {
    display: flex; align-items: center; gap: 4px; padding: 6px 11px; border-radius: 18px;
    background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-warm);
    box-shadow: 0 4px 10px rgba(120, 75, 49, 0.08); font-size: 11.5px; font-weight: 600;
    color: var(--brown-dark); cursor: pointer; transition: all 0.2s;
  }
  .float-pill:active { transform: scale(0.94); }
  .float-pill.active { background: var(--accent-coral); color: #FFF; border-color: var(--accent-coral); }

  .selection-toolbar {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(255, 252, 246, 0.96); border: 1px solid var(--border-warm);
    border-radius: 22px; padding: 5px 10px; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 6px 18px rgba(120, 75, 49, 0.16); z-index: 15;
  }
  .sel-btn { padding: 5px 10px; border-radius: 14px; border: 1px solid var(--border-warm); background: #FFF; font-size: 11px; font-weight: 600; color: var(--brown-dark); cursor: pointer; }
  .sel-btn.danger { color: #D94330; border-color: #F5C6BE; background: #FFF5F3; }

  .bottom-dock {
    flex-shrink: 0; background: var(--panel-bg); border-top: 1px solid var(--border-warm);
    border-radius: 22px 22px 0 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 24px rgba(120, 75, 49, 0.08); z-index: 20; display: flex; flex-direction: column; gap: 8px;
  }
  .sub-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .sub-tabs::-webkit-scrollbar { display: none; }
  .sub-tab { padding: 5px 12px; border-radius: 14px; background: #F5E9DC; color: var(--brown-mid); font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
  .sub-tab.active { background: #FFF; color: var(--accent-coral-dark); border-color: var(--accent-coral); box-shadow: 0 2px 8px rgba(223, 91, 67, 0.15); }
  .options-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; min-height: 68px; align-items: center; }
  .options-scroll::-webkit-scrollbar { display: none; }
  .option-card { flex: 0 0 auto; min-width: 64px; padding: 7px 8px; border-radius: 14px; background: #FFF; border: 2px solid var(--border-warm); display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; transition: all 0.2s; }
  .option-card.active { border-color: var(--accent-coral); background: #FFF7F4; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(223, 91, 67, 0.16); }
  .swatch-circle { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.9); box-shadow: 0 2px 6px rgba(0,0,0,0.12); position: relative; }
  .option-thumb { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .option-name { font-size: 11px; font-weight: 600; color: var(--brown-dark); white-space: nowrap; }

  .dock-footer { display: flex; gap: 10px; align-items: center; }
  .btn-secondary { padding: 11px 16px; border-radius: 14px; border: 1.5px solid var(--border-warm); background: #FFF; color: var(--brown-mid); font-size: 13.5px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .btn-primary {
    flex: 1; padding: 12px 18px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #EB7A5B 0%, var(--accent-coral) 100%);
    color: #FFF; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    box-shadow: 0 6px 16px rgba(223, 91, 67, 0.3); display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;
  }
  .btn-primary:active { transform: scale(0.98); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(62, 34, 21, 0.48); backdrop-filter: blur(4px); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.show { display: flex; }
  .card-modal { width: 100%; max-width: 420px; background: #FFFDF9; border-radius: 24px; border: 2px solid var(--border-warm); padding: 16px; box-shadow: 0 20px 50px rgba(62, 34, 21, 0.28); display: flex; flex-direction: column; gap: 12px; max-height: 92dvh; overflow-y: auto; }
  .card-preview-box { border-radius: 16px; padding: 16px; position: relative; transition: all 0.3s; border: 2px solid #D9B68C; background: #FFF9F0; box-shadow: inset 0 0 0 4px rgba(255,255,255,0.6); }
  .card-theme-0 { background: linear-gradient(145deg, #FFF7F2 0%, #F9E0D4 100%); border-color: #D98873; }
  .card-theme-1 { background: linear-gradient(145deg, #FFFDF8 0%, #F7EAD6 100%); border-color: #DEC092; }
  .card-theme-2 { background: linear-gradient(145deg, #F5FBF6 0%, #DFEFE3 100%); border-color: #9EC7A8; }
  .card-theme-3 { background: linear-gradient(145deg, #FBF6EB 0%, #EDE0C4 100%); border-color: #C7AD78; }
  .card-input-group { display: flex; flex-direction: column; gap: 8px; }
  .card-input, .card-textarea { width: 100%; border: 1px solid rgba(120, 75, 49, 0.25); background: rgba(255, 255, 255, 0.78); border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--brown-dark); font-family: inherit; outline: none; }
  .card-textarea { resize: none; height: 64px; line-height: 1.5; }
  .preset-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .preset-chips::-webkit-scrollbar { display: none; }
  .preset-chip { padding: 4px 10px; border-radius: 12px; background: #F5E9DC; color: var(--brown-mid); font-size: 11px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .sig-pad-wrap { margin-top: 4px; border: 1px dashed var(--brown-light); border-radius: 10px; background: rgba(255, 255, 255, 0.68); position: relative; height: 76px; overflow: hidden; }
  #sigCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
  .sig-hint { position: absolute; top: 6px; left: 8px; font-size: 10.5px; color: var(--brown-light); pointer-events: none; }
  .sig-clear { position: absolute; top: 5px; right: 6px; font-size: 10.5px; padding: 2px 7px; border-radius: 8px; background: #FFF; border: 1px solid var(--border-warm); color: var(--brown-mid); cursor: pointer; }
  .poster-img { width: 100%; border-radius: 16px; border: 2px solid var(--border-warm); box-shadow: 0 8px 25px rgba(62, 34, 21, 0.15); }
  .hidden { display: none !important; }

  @media (max-height: 740px) {
    .top-header { padding: 6px 12px 4px; }
    .header-row { margin-bottom: 4px; }
    .prompt-bar { margin: 5px 10px 0; padding: 6px 10px; gap: 4px; }
    .prompt-top { font-size: 11.5px; }
    .bottom-dock { padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); gap: 6px; border-radius: 18px 18px 0 0; }
    .options-scroll { min-height: 54px; padding: 2px; gap: 8px; }
    .option-card { min-width: 58px; padding: 5px 6px; gap: 3px; }
    .swatch-circle { width: 24px; height: 24px; }
    .option-thumb { width: 30px; height: 30px; }
    .btn-primary, .btn-secondary { padding: 9px 14px; font-size: 13px; }
  }

  /* ===== 东汉工坊 · 传讯名士共创桥接样式 ===== */
  .coop-bar {
    display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: nowrap;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 1px;
  }
  .coop-bar::-webkit-scrollbar { display: none; }
  .coop-select {
    flex: 0 0 auto; max-width: 112px; padding: 4px 8px; border-radius: 10px;
    border: 1px solid var(--border-warm); background: #FFFDF8; color: var(--brown-dark);
    font-size: 11.5px; font-weight: 700; font-family: inherit; outline: none;
  }
  .coop-btn {
    flex: 0 0 auto; padding: 4px 10px; border-radius: 10px; border: 1px solid #DF9E7B;
    background: linear-gradient(135deg, #FFF6EB 0%, #FCE5CD 100%); color: #8A3722;
    font-size: 11.5px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap;
  }
  .coop-btn.primary {
    background: linear-gradient(135deg, #E26A4D 0%, #C83E2B 100%); color: #FFF; border-color: #C83E2B;
  }
  .coop-speaker-pill {
    position: absolute; left: 8px; bottom: 8px; z-index: 18;
    display: none; align-items: center; gap: 4px; padding: 5px 10px;
    border-radius: 999px; border: 1px solid #D99B78;
    background: rgba(255, 250, 242, 0.92); color: #6B3A24;
    box-shadow: 0 4px 12px rgba(90, 48, 29, 0.14); font-size: 11px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
  }
  .coop-speaker-pill.show { display: inline-flex; }
  .coop-bubble {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 19;
    background: rgba(255, 251, 244, 0.97); border: 1.5px solid #D99B78;
    border-radius: 16px; padding: 10px 12px;
    box-shadow: 0 10px 26px rgba(78, 42, 22, 0.22);
    display: none; flex-direction: column; gap: 6px;
  }
  .coop-bubble.show { display: flex; }
  .poster-view-tabs {
    display: none; width: 100%; background: #F5E8D8; border-radius: 12px; padding: 3px; gap: 4px;
  }
  .poster-view-tabs.show { display: flex; }
  .poster-tab-btn {
    flex: 1; border: none; border-radius: 9px; padding: 6px 8px; background: transparent;
    color: var(--brown-mid); font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .poster-tab-btn.active {
    background: #FFFDF9; color: var(--accent-coral-dark); box-shadow: 0 2px 6px rgba(120, 75, 49, 0.12);
  }
  .poster-notes-page {
    display: none; width: 100%; max-height: 360px; overflow-y: auto;
    background: #FFF9F0; border: 1.5px solid var(--border-warm); border-radius: 14px;
    padding: 10px; flex-direction: column; gap: 8px;
  }
  .poster-notes-page.show { display: flex; }
  .poster-note-item {
    background: #FFFDF9; border: 1px solid #EAD6C0; border-radius: 11px; padding: 8px 10px;
  }
  .poster-review-box {
    width: 100%; background: #FFF8EE; border: 1.5px solid #E5C2A2; border-radius: 13px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.65; color: var(--brown-dark);
  }
  .history-list {
    width: 100%; display: flex; flex-direction: column; gap: 10px; max-height: 62dvh; overflow-y: auto;
  }
  .history-card {
    display: flex; gap: 10px; align-items: center; background: #FFF9F0;
    border: 1.5px solid var(--border-warm); border-radius: 14px; padding: 9px;
  }
  .history-thumb {
    width: 58px; height: 76px; object-fit: cover; border-radius: 9px; border: 1px solid var(--border-warm); flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="app">
  <!-- 顶部导航 -->
  <header class="top-header">
    <div class="header-row">
      <div class="brand-title">
        <button class="icon-btn" id="backToWorkshopBtn" title="返回择坊" style="width:28px;height:28px;font-size:13px;font-weight:800;">‹</button>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M5 13C5 17.5 8 20 12 20C16 20 19 17.5 19 13H5Z" fill="#DF5B43" stroke="#3E2215" stroke-width="1.6"/>
          <path d="M2 13H22" stroke="#EBB041" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M7 12C7 9.2 9.2 7 12 7C14.8 7 17 9.2 17 12" fill="#E3F0FC" stroke="#3E2215" stroke-width="1.5"/>
          <circle cx="12" cy="5" r="1.8" fill="#DF5B43"/>
        </svg>
        <span>洛阳凌阴 · 东汉冰饮坊</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="openHistoryBtn" title="消夏冰饮手账" style="width:auto;padding:0 9px;border-radius:14px;font-size:11px;font-weight:700;">历史</button>
        <button class="icon-btn" id="soundToggleBtn" title="雅乐开关">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <button class="icon-btn" id="resetGameBtn" title="重新备冰">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="coop-bar" id="coopBar">
      <select class="coop-select" id="coopCharSelect"><option value="">同步名士中…</option></select>
      <select class="coop-select" id="coopModeSelect" style="max-width:116px;">
        <option value="user_make_char_eat">我做·TA尝</option>
        <option value="relay_coop">你一步·TA一步</option>
        <option value="char_make_user_eat">TA做·我尝</option>
      </select>
      <button class="coop-btn" id="coopSwapTurnBtn" style="display:none;">我先手</button>
      <button class="coop-btn primary" id="coopActionBtn" style="display:none;">请TA动手</button>
    </div>

    <div class="stepper" id="stepperBar">
      <div class="step-item active" data-step="0"><div class="step-dot">一</div><span class="step-label">凿冰夹心</span></div>
      <div class="step-item" data-step="1"><div class="step-dot">二</div><span class="step-label">淋浆匀冰</span></div>
      <div class="step-item" data-step="2"><div class="step-dot">三</div><span class="step-label">汉宫点酥</span></div>
      <div class="step-item" data-step="3"><div class="step-dot">四</div><span class="step-label">西域仙果</span></div>
      <div class="step-item" data-step="4"><div class="step-dot">五</div><span class="step-label">木牍题词</span></div>
      <div class="step-item" data-step="5"><div class="step-dot">六</div><span class="step-label">浮荷进饮</span></div>
    </div>
  </header>

  <!-- 动态操作提示与进度 -->
  <div class="prompt-bar" id="promptBar">
    <div class="prompt-top">
      <span id="promptText">在底层凌阴碎冰表面来回滑动，铺涂香甜夹心酪酱</span>
      <span class="prompt-badge" id="promptBadge">夹心层 1/2</span>
    </div>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- 主画布舞台 -->
  <div class="stage-wrap">
    <canvas id="cakeCanvas" width="720" height="760"></canvas>

    <!-- 左上角视角切换与缩放控件 -->
    <div class="stage-camera-controls" id="cameraControls">
      <button class="float-pill" id="viewModeBtn" title="切换席案平视/羽觞俯视">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span id="viewModeLabel">羽觞俯视</span>
      </button>
      <div class="zoom-group">
        <button class="zoom-btn" id="zoomOutBtn" title="缩小">−</button>
        <span class="zoom-readout" id="zoomResetBtn" title="点击复位 100%">100%</span>
        <button class="zoom-btn" id="zoomInBtn" title="放大">+</button>
      </div>
    </div>

    <!-- 右侧浮动快捷工具 -->
    <div class="stage-floating-tools" id="floatingTools"></div>

    <!-- 选中仙果/装饰时的微调栏 -->
    <div class="selection-toolbar hidden" id="selectionToolbar">
      <button class="sel-btn" id="btnScaleUp">放大</button>
      <button class="sel-btn" id="btnScaleDown">缩小</button>
      <button class="sel-btn" id="btnRotate">旋转</button>

  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.enabled = true;
      this.lastSwish = 0;
    }
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }
    playPop(freq = 620) {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.42, now + 0.08);
      gain.gain.setValueAtTime(0.13, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    }
    playSwish() {
      if (!this.enabled) return;
      const nowMs = performance.now();
      if (nowMs - this.lastSwish < 85) return;
      this.lastSwish = nowMs;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(240 + Math.random() * 90, now);
      osc.frequency.exponentialRampToValueAtTime(145, now + 0.07);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    }
    playScrape(speed = 1) {
      if (!this.enabled) return;
      const nowMs = performance.now();
      if (nowMs - this.lastSwish < 70) return;
      this.lastSwish = nowMs;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const dur = 0.08;
      const sampleCount = Math.floor(this.ctx.sampleRate * dur);
      const buffer = this.ctx.createBuffer(1, sampleCount, this.ctx.sampleRate);
      const ch = buffer.getChannelData(0);
      for (let i = 0; i < sampleCount; i++) {
        ch[i] = (Math.random() * 2 - 1) * 0.45;
      }
      const src = this.ctx.createBufferSource();
      src.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      const cutoff = Math.max(420, Math.min(1150, 520 + speed * 32));
      filter.frequency.setValueAtTime(cutoff, now);
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.036, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      src.start(now);
      src.stop(now + dur);
    }
    playChime() {
      if (!this.enabled) return;

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      });
    }

  for (let i = 0; i < 240; i++) {
    SPONGE_PORES.push({
      u: Math.random(),
      v: Math.random(),
      r: 1.2 + Math.random() * 2.5,
      dark: Math.random() > 0.38
    });
  }

  function hexToRgb(hex) {
    const clean = (hex || '#F4EFE6').replace('#', '');
    const num = parseInt(clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function srgbToLin(c255) {
    const n = c255 / 255;
    return n * n;
  }

  function linToSrgb(lin) {
    const clamped = lin <= 0 ? 0 : (lin >= 1 ? 1 : lin);
    return Math.round(Math.sqrt(clamped) * 255);
  }

  class SurfaceBuffer {
    constructor(width, height, wrapX = false) {
      this.width = width;
      this.height = height;
      this.wrapX = wrapX;
      this.albedo = new Float32Array(width * height * 4);
      this.heightMap = new Float32Array(width * height);
      this.canvas = document.createElement('canvas');
      this.canvas.width = width;
      this.canvas.height = height;
      this.ctx = this.canvas.getContext('2d');
      this.imgData = this.ctx.createImageData(width, height);
      this.dirty = null;
    }

    fillBaseColor(hexColor, baseHeight = 0.25) {
      const rgb = hexToRgb(hexColor);
      const lr = srgbToLin(rgb.r);
      const lg = srgbToLin(rgb.g);
      const lb = srgbToLin(rgb.b);
      const w = this.width;
      const total = w * this.height;
      for (let i = 0; i < total; i++) {
        const i4 = i * 4;
        this.albedo[i4] = lr;
        this.albedo[i4 + 1] = lg;
        this.albedo[i4 + 2] = lb;
        this.albedo[i4 + 3] = 1.0;
        // 初始凌阴刨冰自带微弱晶莹颗粒基底高度
        const x = i % w;
        const y = (i / w) | 0;
        const sparkle = (((x * 73856093) ^ (y * 19349663)) & 255) / 255 * 0.025;
        this.heightMap[i] = baseHeight + sparkle;
      }
      this.rebuildRegion(0, 0, this.width - 1, this.height - 1);
      this.dirty = null;
    }

    markDirty(x0, y0, x1, y1) {
      const w = this.width;
      const h = this.height;
      const cy0 = Math.max(0, Math.floor(y0));
      const cy1 = Math.min(h - 1, Math.ceil(y1));
      let cx0 = Math.floor(x0);
      let cx1 = Math.ceil(x1);
      if (!this.wrapX) {
        cx0 = Math.max(0, cx0);
        cx1 = Math.min(w - 1, cx1);
      } else if (cx0 < 0 || cx1 >= w) {
        cx0 = 0;
        cx1 = w - 1;
      }
      if (!this.dirty) {
        this.dirty = { x0: cx0, y0: cy0, x1: cx1, y1: cy1 };
      } else {
        this.dirty.x0 = Math.min(this.dirty.x0, cx0);
        this.dirty.y0 = Math.min(this.dirty.y0, cy0);
        this.dirty.x1 = Math.max(this.dirty.x1, cx1);
        this.dirty.y1 = Math.max(this.dirty.y1, cy1);
      }
    }

    flushDirty() {
      if (!this.dirty) return;
      const d = this.dirty;
      this.rebuildRegion(d.x0, d.y0, d.x1, d.y1);
      this.dirty = null;
    }

    rebuildRegion(x0, y0, x1, y1) {
      const w = this.width;
      const h = this.height;
      const wrapX = this.wrapX;
      const rx0 = Math.max(0, Math.floor(x0));
      const ry0 = Math.max(0, Math.floor(y0));
      const rx1 = Math.min(w - 1, Math.ceil(x1));
      const ry1 = Math.min(h - 1, Math.ceil(y1));
      const rw = rx1 - rx0 + 1;
      const rh = ry1 - ry0 + 1;
      if (rw <= 0 || rh <= 0) return;

      const data = this.imgData.data;
      const albedo = this.albedo;
      const hm = this.heightMap;

      const lx = -0.58;
      const ly = -0.66;
      const lz = 0.48;
      const bumpStrength = 3.8;

      for (let y = ry0; y <= ry1; y++) {
        const yUp = y > 0 ? y - 1 : 0;
        const yDn = y < h - 1 ? y + 1 : h - 1;
        const rowOff = y * w;
        const rowUp = yUp * w;
        const rowDn = yDn * w;

        for (let x = rx0; x <= rx1; x++) {
          const xL = x > 0 ? x - 1 : (wrapX ? w - 1 : 0);
          const xR = x < w - 1 ? x + 1 : (wrapX ? 0 : w - 1);

          const gx = (hm[rowOff + xR] - hm[rowOff + xL]) * bumpStrength;
          const gy = (hm[rowDn + x] - hm[rowUp + x]) * bumpStrength;

          const invLen = 1 / Math.sqrt(gx * gx + gy * gy + 1);
          const nx = -gx * invLen;
          const ny = -gy * invLen;
          const nz = invLen;

          const ndotl = nx * lx + ny * ly + nz * lz;
          const diff = 0.91 + (ndotl - lz) * 0.42;
          const specBase = Math.max(0, ndotl - 0.52);
          const spec = specBase * specBase * 0.28;

          const idx = rowOff + x;
          const i4 = idx * 4;
          data[i4] = linToSrgb(albedo[i4] * diff + spec);
          data[i4 + 1] = linToSrgb(albedo[i4 + 1] * diff + spec);
          data[i4 + 2] = linToSrgb(albedo[i4 + 2] * diff + spec);
          data[i4 + 3] = 255;
        }
      }

      this.ctx.putImageData(this.imgData, 0, 0, rx0, ry0, rw, rh);
    }

    captureSnapshot() {
      const total = this.width * this.height;
      const packed = new Uint8Array(total * 4);
      const albedo = this.albedo;
      const hm = this.heightMap;
      for (let i = 0; i < total; i++) {
        const i4 = i * 4;
        packed[i4] = linToSrgb(albedo[i4]);
        packed[i4 + 1] = linToSrgb(albedo[i4 + 1]);
        packed[i4 + 2] = linToSrgb(albedo[i4 + 2]);
        packed[i4 + 3] = Math.max(0, Math.min(255, Math.round(hm[i] * 255)));
      }
      return packed;
    }

    restoreSnapshot(packed) {
      if (!packed) return;
      const total = this.width * this.height;
      const albedo = this.albedo;
      const hm = this.heightMap;
      for (let i = 0; i < total; i++) {
        const i4 = i * 4;
        albedo[i4] = srgbToLin(packed[i4]);
        albedo[i4 + 1] = srgbToLin(packed[i4 + 1]);
        albedo[i4 + 2] = srgbToLin(packed[i4 + 2]);
        albedo[i4 + 3] = 1.0;
        hm[i] = packed[i4 + 3] / 255;
      }
      this.rebuildRegion(0, 0, this.width - 1, this.height - 1);
      this.dirty = null;
    }
  }

  let state = createInitialState();

  function createInitialState() {
    return {
      step: 0,
      subTab: 'cream',

      // Step 0: 器皿、凿冰与双层夹心
      vessel: HAN_VESSELS[0],
      layerPhase: 0,
      spongeFlavor: SPONGE_FLAVORS[0],
      fillingCream: FILLING_CREAMS[0],
      fillingFruit: FILLING_FRUITS[0],
      layersVisible: 1,
      dropAnimY: 0,
      fillings: [
        { spreadProgress: 0, strokes: [], chunks: [], cream: FILLING_CREAMS[0], fruit: FILLING_FRUITS[0] },
        { spreadProgress: 0, strokes: [], chunks: [], cream: FILLING_CREAMS[0], fruit: FILLING_FRUITS[0] }
      ],

      // Step 1: 多色淋浆、汉白玉刮匕与挂露（双通道表面缓冲）
      frostPhase: 0,
      frostingColor: FROSTING_COLORS[1], // 默认选中西域葡萄浆，方便在白雪冰底上直接看到淋浆效果
      baseCoatColor: FROSTING_COLORS[0],
      brushSize: 24,
      creamStyle: 'sculpt', // 'sculpt': 立体刨冰纹 | 'blend': 柔雾酥酪渐变
      spatulaMode: SPATULA_MODES[1],
      surfaceUndoStack: [],
      frostStrokes: [],
      topSurface: (() => {
        const s = new SurfaceBuffer(512, 512, false);
        s.fillBaseColor(FROSTING_COLORS[0].mid, 0.25);
        return s;
      })(),
      sideSurface: (() => {
        const s = new SurfaceBuffer(1024, 384, true);
        s.fillBaseColor(FROSTING_COLORS[0].mid, 0.25);
        return s;
      })(),
      roughCoverage: 0,
      smoothProgress: 0,
      turntableAngle: 0,
      dripGlaze: DRIP_GLAZES[0],
      drips: new Array(32).fill(0),

      // Step 2: 汉宫点酥
      pipingNozzle: PIPING_NOZZLES[0],
      pipingColor: PIPING_COLORS[0],
      pipingSymmetry: true,
      pipings: [],

      // Step 3: 西域仙果与金粟
      activeDecorTool: DECOR_ITEMS[0],
      decorations: [],
      sprinkles: [],
      selectedDecorUid: null,

      // Step 4: 汉简木牍题词与玉签
      card: {
        theme: 0,
        to: '致：洛阳知音',
        body: '愿以此盏凌阴瑞雪，涤尽炎夏万里尘劳，岁岁常安。',
        plaqueText: '清凉无汗',
        hasPlaque: false,
        sigDataUrl: null
      },

      // Step 5: 浮水荷花灯点亮与纨扇拂风仪式
      candlesLit: false,
      wishBlown: false,
      smokeParticles: [],
      confettiParticles: [],

      // 视口相机（支持无级缩放、平移与 2.5D/羽觞俯视无缝切换）
      camera: {
        viewMode: 'iso',
        zoom: 1.0,
        panX: 0,
        panY: 0,
        targetZoom: 1.0,
        targetPanX: 0,
        targetPanY: 0
      },

      pointer: {
        down: false,
        x: 360,
        y: 340,
        vx: 0,
        vy: 0,
        activeTool: null,
        growingPipe: null
      }
    };
  }

  /* ============================================================================
   * 4. 坐标转换与双视角空间投影几何函数
   * ============================================================================ */
  function getLayerTopY(layerIndex) {
    const stepH = CAKE.layerH + CAKE.fillingH;
    return CAKE.baseY - CAKE.layerH - layerIndex * stepH;
  }

  function getCakeTopY() {
    return getLayerTopY(2);
  }

  function clampCameraPan(zoom, panX, panY) {
    const maxPan = Math.max(0, (zoom - 0.85) * 290);
    return {
      panX: Math.max(-maxPan, Math.min(maxPan, panX)),
      panY: Math.max(-maxPan, Math.min(maxPan, panY))
    };
  }

  function setCameraZoom(nextZoom, anchorRawX = CW * 0.5, anchorRawY = CH * 0.5, immediate = false) {
    const cam = state.camera;
    const clampedZoom = Math.max(0.85, Math.min(3.0, nextZoom));
    const baseZoom = immediate ? cam.zoom : cam.targetZoom;
    const basePanX = immediate ? cam.panX : cam.targetPanX;
    const basePanY = immediate ? cam.panY : cam.targetPanY;

    const wx = (anchorRawX - CW * 0.5 - basePanX) / baseZoom + CW * 0.5;
    const wy = (anchorRawY - CH * 0.5 - basePanY) / baseZoom + CH * 0.5;
    const rawPanX = anchorRawX - CW * 0.5 - (wx - CW * 0.5) * clampedZoom;
    const rawPanY = anchorRawY - CH * 0.5 - (wy - CH * 0.5) * clampedZoom;
    const clamped = clampCameraPan(clampedZoom, rawPanX, rawPanY);

    cam.targetZoom = clampedZoom;
    cam.targetPanX = clamped.panX;
    cam.targetPanY = clamped.panY;
    if (immediate) {
      cam.zoom = clampedZoom;
      cam.panX = clamped.panX;
      cam.panY = clamped.panY;
    }
    updateCameraControlsUI();
  }

  function resetCamera(keepViewMode = true) {
    const cam = state.camera;
    if (!keepViewMode) cam.viewMode = 'iso';
    cam.targetZoom = 1.0;
    cam.targetPanX = 0;
    cam.targetPanY = 0;
    updateCameraControlsUI();
  }

  function updateCameraControlsUI() {
    const viewBtn = document.getElementById('viewModeBtn');
    const viewLabel = document.getElementById('viewModeLabel');
    const zoomReset = document.getElementById('zoomResetBtn');
    if (!viewBtn || !viewLabel || !zoomReset) return;
    const isTop = state.camera.viewMode === 'top';
    viewBtn.classList.toggle('active', isTop);
    viewLabel.textContent = isTop ? '切回立体' : '羽觞俯视';
    zoomReset.textContent = `${Math.round(state.camera.targetZoom * 100)}%`;
  }

  function canvasToWorld(rawX, rawY) {
    const cam = state.camera;
    return {
      x: (rawX - CW * 0.5 - cam.panX) / cam.zoom + CW * 0.5,
      y: (rawY - CH * 0.5 - cam.panY) / cam.zoom + CH * 0.5,
      rawX,
      rawY
    };
  }

  function getRawCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      rawX: (clientX - rect.left) * (CW / rect.width),
      rawY: (clientY - rect.top) * (CH / rect.height)
    };
  }

  function getCanvasPos(e) {
    const raw = getRawCanvasPos(e);
    return canvasToWorld(raw.rawX, raw.rawY);
  }

  function isInsideEllipse(px, py, cx, cy, rx, ry) {
    const dx = (px - cx) / rx;
    const dy = (py - cy) / ry;
    return (dx * dx + dy * dy) <= 1.05;
  }

  function worldToSurface(wx, wy, viewMode = state.camera.viewMode) {
    const topS = state.topSurface;

    if (viewMode === 'top') {
      const rawDu = (wx - TOP_VIEW.cx) / TOP_VIEW.r;
      const rawDv = (wy - TOP_VIEW.cy) / TOP_VIEW.r;
      if (rawDu * rawDu + rawDv * rawDv <= 1.02) {
        const cosA = Math.cos(-state.turntableAngle);
        const sinA = Math.sin(-state.turntableAngle);
        const du = rawDu * cosA - rawDv * sinA;
        const dv = rawDu * sinA + rawDv * cosA;
        return {
          surface: 'top',
          buf: topS,
          u: du,
          v: dv,
          px: (du * 0.5 + 0.5) * topS.width,
          py: (dv * 0.5 + 0.5) * topS.height
        };
      }
      return null;
    }

    const cx = CAKE.cx;
    const rx = CAKE.rx + 4;
    const ry = CAKE.ry + 2;
    const by = CAKE.baseY;
    const ty = getCakeTopY() - 2;

    const rawDu = (wx - cx) / rx;
    const rawDv = (wy - ty) / ry;
    if (rawDu * rawDu + rawDv * rawDv <= 1.02) {
      const cosA = Math.cos(-state.turntableAngle);
      const sinA = Math.sin(-state.turntableAngle);
      const du = rawDu * cosA - rawDv * sinA;
      const dv = rawDu * sinA + rawDv * cosA;
      return {
        surface: 'top',
        buf: topS,
        u: du,
        v: dv,
        px: (du * 0.5 + 0.5) * topS.width,
        py: (dv * 0.5 + 0.5) * topS.height
      };
    }

    if (Math.abs(wx - cx) <= rx + 2) {
      const cosTheta = Math.max(-1, Math.min(1, (wx - cx) / rx));
      const theta = Math.acos(cosTheta);
      const sinTheta = Math.sin(theta);
      const rimTopY = ty + sinTheta * ry;
      const rimBotY = by + sinTheta * ry;
      if (wy >= rimTopY - 4 && wy <= rimBotY + 4) {
        const v = Math.max(0, Math.min(1, (wy - rimTopY) / Math.max(1, rimBotY - rimTopY)));
        const twoPi = Math.PI * 2;
        const worldAngle = (((theta - state.turntableAngle) % twoPi) + twoPi) % twoPi;
        const u = worldAngle / twoPi;
        const sideS = state.sideSurface;
        return {
          surface: 'side',
          buf: sideS,
          u,
          v,
          px: u * sideS.width,
          py: v * sideS.height
        };
      }
    }
    return null;
  }

  function surfaceToWorld(surface, u, v, viewMode = state.camera.viewMode) {
    if (surface === 'top') {
      const cosA = Math.cos(state.turntableAngle);
      const sinA = Math.sin(state.turntableAngle);
      const ru = u * cosA - v * sinA;
      const rv = u * sinA + v * cosA;
      if (viewMode === 'top') {
        return { x: TOP_VIEW.cx + ru * TOP_VIEW.r, y: TOP_VIEW.cy + rv * TOP_VIEW.r };
      }
      const rx = CAKE.rx + 4;
      const ry = CAKE.ry + 2;
      const ty = getCakeTopY() - 2;
      return { x: CAKE.cx + ru * rx, y: ty + rv * ry };
    }
    if (surface === 'side') {
      if (viewMode === 'top') return null;
      const twoPi = Math.PI * 2;
      const theta = (((u * twoPi + state.turntableAngle) % twoPi) + twoPi) % twoPi;
      if (theta > Math.PI + 0.05 && theta < twoPi - 0.05) return null;
      const clampedTheta = Math.max(0, Math.min(Math.PI, theta));
      const rx = CAKE.rx + 4;
      const ry = CAKE.ry + 2;
      const ty = getCakeTopY() - 2;
      const cylH = CAKE.baseY - ty;
      return {
        x: CAKE.cx + Math.cos(clampedTheta) * rx,
        y: ty + Math.sin(clampedTheta) * ry + v * cylH
      };
    }
    return null;
  }

  function resolveItemWorldPos(item, viewMode = state.camera.viewMode) {
    if (item.surface) {
      return surfaceToWorld(item.surface, item.u, item.v, viewMode);
    }
    if (viewMode === 'top') {
      const rx = CAKE.rx + 4;
      const ry = CAKE.ry + 2;
      const ty = getCakeTopY() - 2;
      const du = (item.x - CAKE.cx) / rx;
      const dv = (item.y - ty) / ry;
      if (du * du + dv * dv <= 1.2) {
        return { x: TOP_VIEW.cx + du * TOP_VIEW.r, y: TOP_VIEW.cy + dv * TOP_VIEW.r };
      }
      return null;
    }
    return { x: item.x, y: item.y };
  }

  /* ============================================================================
   * 5. 东汉器皿、凌阴碎冰山与双通道淋浆视觉绘制函数 (无Emoji，纯Canvas渲染)
   * ============================================================================ */

  // 5.1 绘制东汉漆案转盘与器皿底托
  function drawCakeStand(ctx, angle) {
    const cx = CAKE.cx;
    const by = CAKE.baseY + 12;
    const vessel = state.vessel || HAN_VESSELS[0];

    ctx.save();
    const shadowGrad = ctx.createRadialGradient(cx, by + 65, 30, cx, by + 65, 255);
    shadowGrad.addColorStop(0, 'rgba(62, 34, 21, 0.26)');
    shadowGrad.addColorStop(1, 'rgba(62, 34, 21, 0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.ellipse(cx, by + 65, 250, 75, 0, 0, Math.PI * 2);
    ctx.fill();

    // 承盘高脚底座
    const standGrad = ctx.createLinearGradient(cx - 85, by + 20, cx + 85, by + 70);
    standGrad.addColorStop(0, vessel.outerDark);
    standGrad.addColorStop(0.5, vessel.outerMid);
    standGrad.addColorStop(1, '#1C0D07');
    ctx.fillStyle = standGrad;
    ctx.beginPath();
    ctx.moveTo(cx - 56, by + 10);
    ctx.quadraticCurveTo(cx - 68, by + 48, cx - 98, by + 62);
    ctx.ellipse(cx, by + 62, 98, 28, 0, Math.PI, 0, true);
    ctx.quadraticCurveTo(cx + 68, by + 48, cx + 56, by + 10);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = vessel.patternColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 承盘盘面厚度边缘
    ctx.fillStyle = vessel.outerDark;
    ctx.beginPath();
    ctx.ellipse(cx, by + 10, CAKE.rx + 48, CAKE.ry + 22, 0, 0, Math.PI * 2);
    ctx.fill();

    // 承盘主盘面（内朱外黑或对应器皿材质）
    const plateGrad = ctx.createLinearGradient(cx - 220, by - 40, cx + 220, by + 40);
    plateGrad.addColorStop(0, vessel.outerMid);
    plateGrad.addColorStop(0.5, vessel.innerRim);
    plateGrad.addColorStop(1, vessel.outerDark);
    ctx.fillStyle = plateGrad;
    ctx.beginPath();
    ctx.ellipse(cx, by, CAKE.rx + 48, CAKE.ry + 20, 0, 0, Math.PI * 2);
    ctx.fill();

    // 错金云雷纹外圈与 16 颗旋转刻度金珠
    ctx.strokeStyle = vessel.patternColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, by, CAKE.rx + 36, CAKE.ry + 15, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = vessel.patternColor;
    for (let i = 0; i < 16; i++) {
      const a = angle + (i * Math.PI * 2) / 16;
      const px = cx + Math.cos(a) * (CAKE.rx + 42);
      const py = by + Math.sin(a) * (CAKE.ry + 17.5);
      ctx.beginPath();
      ctx.arc(px, py, 2.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // 若为朱漆耳杯，在盘沿两侧绘制随转盘同步旋转的汉代新月形“羽觞双耳”
    if (vessel.hasEars) {
      [0, Math.PI].forEach(offset => {
        const earA = angle + offset;
        const ex = cx + Math.cos(earA) * (CAKE.rx + 48);
        const ey = by - 8 + Math.sin(earA) * (CAKE.ry + 18);
        ctx.save();
        ctx.translate(ex, ey);
        ctx.rotate(Math.sin(earA) * 0.25);
        ctx.fillStyle = vessel.outerDark;
        ctx.strokeStyle = vessel.patternColor;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.ellipse(0, 0, 22, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = vessel.innerRim;
        ctx.beginPath();
        ctx.ellipse(0, 0, 14, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }
    ctx.restore();
  }

  // 5.2 绘制单层凌阴碎冰山（含冰晶折射颗粒与冷雾边缘）
  function drawSpongeLayer(ctx, bottomY, flavor, yOffset = 0) {
    const cx = CAKE.cx;
    const rx = CAKE.rx;
    const ry = CAKE.ry;
    const h = CAKE.layerH;
    const by = bottomY + yOffset;
    const ty = by - h;

    ctx.save();
    const sideGrad = ctx.createLinearGradient(cx - rx, ty, cx + rx, ty);
    sideGrad.addColorStop(0, flavor.sideBot);
    sideGrad.addColorStop(0.28, flavor.sideTop);
    sideGrad.addColorStop(0.7, flavor.sideTop);
    sideGrad.addColorStop(1, flavor.crust);

    ctx.fillStyle = sideGrad;
    ctx.beginPath();
    ctx.moveTo(cx - rx, ty);
    ctx.lineTo(cx - rx, by);
    ctx.ellipse(cx, by, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(cx + rx, ty);
    ctx.ellipse(cx, ty, rx, ry, 0, 0, Math.PI, false);
    ctx.closePath();
    ctx.fill();

    // 侧面冰晶雪沙闪光颗粒
    ctx.save();
    ctx.clip();
    SPONGE_PORES.forEach(p => {
      const px = cx - rx + p.u * (rx * 2);
      const py = ty + p.v * (h + ry);
      ctx.fillStyle = p.dark ? flavor.crust : '#FFFFFF';
      ctx.globalAlpha = p.dark ? 0.25 : 0.55;
      ctx.beginPath();
      ctx.arc(px, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    // 顶面椭圆
    const topGrad = ctx.createRadialGradient(cx - 35, ty - 12, 20, cx, ty, rx);
    topGrad.addColorStop(0, '#FFFFFF');
    topGrad.addColorStop(0.45, flavor.top);
    topGrad.addColorStop(0.85, flavor.sideTop);
    topGrad.addColorStop(1, flavor.crust);

    ctx.fillStyle = topGrad;
    ctx.beginPath();
    ctx.ellipse(cx, ty, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.clip();
    for (let i = 0; i < 110; i++) {
      const p = SPONGE_PORES[i];
      const angle = p.u * Math.PI * 2;
      const dist = Math.sqrt(p.v) * 0.92;
      const px = cx + Math.cos(angle) * rx * dist;
      const py = ty + Math.sin(angle) * ry * dist;
      ctx.fillStyle = p.dark ? flavor.crust : '#FFFFFF';
      ctx.globalAlpha = p.dark ? 0.22 : 0.65;
      ctx.beginPath();
      ctx.arc(px, py, p.r * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.strokeStyle = '#FFFFFF';
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, ty, rx - 1, ry - 1, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 5.25 连续 3D 棱纹酪酱轨迹与崖蜜桂花线条渲染器
  function traceSmoothPath(ctx, pts) {
    if (!pts || pts.length === 0) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 1) {
      ctx.lineTo(pts[0].x + 0.5, pts[0].y);
      return;
    }
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) * 0.5;
      const my = (pts[i].y + pts[i + 1].y) * 0.5;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last.x, last.y);
  }

  function drawRibbedCreamStroke(ctx, stroke, isSmoothed = false) {
    const pts = stroke.points;
    if (!pts || pts.length === 0) return;
    const w = stroke.size || 24;
    const col = stroke.color;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (stroke.isSauce) {
      ctx.save();
      ctx.translate(0, 2);
      traceSmoothPath(ctx, pts);
      ctx.strokeStyle = 'rgba(60, 25, 10, 0.2)';
      ctx.lineWidth = w * 0.42;
      ctx.stroke();
      ctx.restore();

      traceSmoothPath(ctx, pts);
      ctx.strokeStyle = col.color;
      ctx.lineWidth = w * 0.36;
      ctx.stroke();

      ctx.save();
      ctx.translate(-1, -1);
      traceSmoothPath(ctx, pts);
      ctx.strokeStyle = col.highlight || 'rgba(255,255,255,0.6)';
      ctx.lineWidth = w * 0.12;
      ctx.stroke();
      ctx.restore();

      // 沿蜜露线条散落的金桂花瓣
      if (stroke.shards) {
        stroke.shards.forEach(sh => {
          ctx.save();
          ctx.translate(sh.x, sh.y);
          ctx.rotate(sh.rot);
          ctx.fillStyle = '#F5C443';
          ctx.beginPath();
          ctx.ellipse(0, 0, sh.w * 0.45, sh.h * 0.35, 0, 0, Math.PI * 2);
          ctx.ellipse(0, 0, sh.h * 0.35, sh.w * 0.45, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }
      ctx.restore();
      return;
    }

    if (isSmoothed) {
      traceSmoothPath(ctx, pts);
      ctx.strokeStyle = col.mid;
      ctx.lineWidth = w * 1.45;
      ctx.globalAlpha = 0.85;
      ctx.stroke();

      traceSmoothPath(ctx, pts);
      ctx.strokeStyle = col.light;
      ctx.lineWidth = w * 0.9;
      ctx.globalAlpha = 0.6;
      ctx.stroke();
      ctx.restore();
      return;
    }

    const shadeColor = col.shade || col.dark || '#D5C5B2';

    ctx.save();
    ctx.translate(0, 2.5);
    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = 'rgba(75, 45, 25, 0.16)';
    ctx.lineWidth = w + 3;
    ctx.stroke();
    ctx.restore();

    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = shadeColor;
    ctx.lineWidth = w + 1.5;
    ctx.stroke();

    ctx.save();
    ctx.translate(0, -0.5);
    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = col.light;
    ctx.lineWidth = w * 0.86;
    ctx.stroke();

    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = col.mid;
    ctx.lineWidth = w * 0.56;
    ctx.stroke();

    ctx.translate(0, -0.6);
    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = col.light;
    ctx.lineWidth = w * 0.30;
    ctx.stroke();

    traceSmoothPath(ctx, pts);
    ctx.strokeStyle = shadeColor;
    ctx.lineWidth = Math.max(1.2, w * 0.09);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  // 5.3 绘制夹心层（赤豆/栗泥/芋酪 + 鲜果丁）
  function drawFillingLayer(ctx, surfaceY, fillingObj, isCoveredAbove) {
    const cx = CAKE.cx;
    const rx = CAKE.rx - 4;
    const ry = CAKE.ry - 3;

    ctx.save();
    if (!isCoveredAbove) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, surfaceY, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();

      fillingObj.strokes.forEach(st => {
        if (st.points) drawRibbedCreamStroke(ctx, st, false);
      });
      ctx.restore();

      fillingObj.chunks.forEach(c => {
        const f = c.fruit || fillingObj.fruit;
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);

        ctx.fillStyle = 'rgba(75, 35, 20, 0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 4, 12 * c.s, 7 * c.s, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.roundRect(-10 * c.s, -8 * c.s, 20 * c.s, 15 * c.s, 5);
        ctx.fill();

        ctx.fillStyle = f.inner;
        ctx.beginPath();
        ctx.roundRect(-8 * c.s, -6 * c.s, 14 * c.s, 9 * c.s, 3.5);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.beginPath();
        ctx.arc(-4 * c.s, -3 * c.s, 2.2 * c.s, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    } else if (fillingObj.spreadProgress > 0.05 || fillingObj.strokes.length > 0) {
      ctx.strokeStyle = fillingObj.cream.cream;
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.ellipse(cx, surfaceY - 2, CAKE.rx + 1, CAKE.ry, 0, 0.03 * Math.PI, 0.97 * Math.PI);
      ctx.stroke();

      ctx.strokeStyle = fillingObj.cream.jam;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(cx, surfaceY - 1, CAKE.rx + 1, CAKE.ry, 0, 0.06 * Math.PI, 0.94 * Math.PI);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 5.4 绘制外部冰山淋浆与凝酪表面（双通道缓冲渲染 + 器皿包边 + 崖蜜线条与杯沿挂露）
  function drawOuterFrosting(ctx) {
    const cx = CAKE.cx;
    const rx = CAKE.rx + 4;
    const ry = CAKE.ry + 2;
    const by = CAKE.baseY;
    const ty = getCakeTopY() - 2;
    const baseCol = state.baseCoatColor || FROSTING_COLORS[0];
    const vessel = state.vessel || HAN_VESSELS[0];
    const topS = state.topSurface;
    const sideS = state.sideSurface;

    topS.flushDirty();
    sideS.flushDirty();

    ctx.save();

    // 1. 冰山侧面：按 2px 垂直条带映射 sideSurface 柱面纹理
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - rx, ty);
    ctx.lineTo(cx - rx, by);
    ctx.ellipse(cx, by, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(cx + rx, ty);
    ctx.ellipse(cx, ty, rx, ry, 0, 0, Math.PI, false);
    ctx.closePath();
    ctx.clip();

    const cylH = by - ty;
    const twoPi = Math.PI * 2;
    const stepX = 2;
    for (let sx = -rx; sx < rx; sx += stepX) {
      const midX = Math.max(-rx, Math.min(rx, sx + stepX * 0.5));
      const cosTheta = Math.max(-1, Math.min(1, midX / rx));
      const theta = Math.acos(cosTheta);
      const sinTheta = Math.sin(theta);
      const rimTopY = ty + sinTheta * ry;
      const worldAngle = (((theta - state.turntableAngle) % twoPi) + twoPi) % twoPi;
      const srcX = (worldAngle / twoPi) * sideS.width;
      const srcW = Math.min(sideS.width - srcX, Math.max(1.5, (stepX / (rx * Math.max(0.22, sinTheta))) * (sideS.width / twoPi)));
      ctx.drawImage(sideS.canvas, srcX, 0, srcW, sideS.height, cx + sx, rimTopY - 1, stepX + 0.8, cylH + 2);
    }

    const sideLight = ctx.createLinearGradient(cx - rx, ty, cx + rx, ty);
    sideLight.addColorStop(0, 'rgba(75, 48, 34, 0.20)');
    sideLight.addColorStop(0.24, 'rgba(255, 253, 248, 0.18)');
    sideLight.addColorStop(0.58, 'rgba(255, 255, 255, 0)');
    sideLight.addColorStop(0.88, 'rgba(75, 48, 34, 0.18)');
    sideLight.addColorStop(1, 'rgba(75, 48, 34, 0.10)');
    ctx.fillStyle = sideLight;
    ctx.fillRect(cx - rx, ty, rx * 2, cylH + ry + 2);
    ctx.restore();

    // 2. 冰山顶面：将 512x512 顶面正圆纹理映射到 2.5D 顶面椭圆
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, ty, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();

    ctx.translate(cx, ty);
    ctx.scale(1, ry / rx);
    ctx.rotate(state.turntableAngle);
    ctx.drawImage(topS.canvas, -rx, -rx, rx * 2, rx * 2);
    if (state.topSketchImg && state.topSketchImg.complete && state.topSketchImg.naturalWidth > 0) {
      const skR = rx * 0.66;
      ctx.save();
      ctx.shadowColor = 'rgba(62, 34, 21, 0.22)';
      ctx.shadowBlur = 3;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 2;
      ctx.drawImage(state.topSketchImg, -skR, -skR, skR * 2, skR * 2);
      ctx.restore();
    }
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, ty, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();
    const topLight = ctx.createRadialGradient(cx - 48, ty - 16, 12, cx, ty, rx);
    topLight.addColorStop(0, 'rgba(255, 255, 255, 0.24)');
    topLight.addColorStop(0.55, 'rgba(255, 255, 255, 0)');
    topLight.addColorStop(1, 'rgba(75, 48, 34, 0.12)');
    ctx.fillStyle = topLight;
    ctx.fillRect(cx - rx, ty - ry, rx * 2, ry * 2);
    ctx.restore();

    // 器皿底部冰珠裙边与漆金口沿托圈
    ctx.save();
    ctx.strokeStyle = vessel.innerRim;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.ellipse(cx, by + 2, rx + 5, ry + 3, 0, 0, Math.PI);
    ctx.stroke();

    for (let i = 0; i <= 22; i++) {
      const a = (i / 22) * Math.PI;
      const px = cx + Math.cos(a) * (rx + 2);
      const py = by + Math.sin(a) * (ry + 1);
      const pg = ctx.createRadialGradient(px - 2, py - 2, 1, px, py, 8);
      pg.addColorStop(0, '#FFFFFF');
      pg.addColorStop(0.6, baseCol.light);
      pg.addColorStop(1, baseCol.shade);
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(px, py, 7.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 3. 裁剪在冰山轮廓内，绘制崖蜜/果露画笔线条
    if (state.frostStrokes && state.frostStrokes.length > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, ty, rx + 2, ry + 2, 0, Math.PI, 0, false);
      ctx.lineTo(cx + rx + 2, by);
      ctx.ellipse(cx, by, rx + 2, ry + 2, 0, 0, Math.PI, false);
      ctx.closePath();
      ctx.clip();

      state.frostStrokes.forEach(st => {
        if (st.isSauce) drawRibbedCreamStroke(ctx, st, false);
      });
      ctx.restore();
    }

    // 4. 绘制杯沿挂露 (Rim Honey Drip)
    if (state.dripGlaze && state.dripGlaze.color) {
      drawGanacheDrip(ctx, cx, ty, rx, ry, state.dripGlaze);
    }

    ctx.restore();
  }

  // 5.45 羽觞正俯视圆形视角渲染器（含双耳旋转 + 正圆冰面缓冲）
  function drawTopDownCake(ctx) {
    const cx = TOP_VIEW.cx;
    const cy = TOP_VIEW.cy;
    const R = TOP_VIEW.r;
    const baseCol = state.baseCoatColor || FROSTING_COLORS[0];
    const vessel = state.vessel || HAN_VESSELS[0];

    ctx.save();

    // 1. 俯视器皿投影与外盘
    const shadowGrad = ctx.createRadialGradient(cx, cy + 8, R * 0.7, cx, cy + 8, R + 78);
    shadowGrad.addColorStop(0, 'rgba(62, 34, 21, 0.25)');
    shadowGrad.addColorStop(1, 'rgba(62, 34, 21, 0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.arc(cx, cy + 8, R + 75, 0, Math.PI * 2);
    ctx.fill();

    // 若为朱漆耳杯，在正俯视两侧绘制随转盘同步旋转的“羽觞双耳”
    if (vessel.hasEars) {
      [0, Math.PI].forEach(offset => {
        const earA = state.turntableAngle + offset;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(earA);
        ctx.fillStyle = vessel.outerDark;
        ctx.strokeStyle = vessel.patternColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(R + 36, 0, 26, 78, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 耳上汉代卷云金纹
        ctx.strokeStyle = vessel.innerRim;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(R + 40, -24, 8, 0, Math.PI * 1.5);
        ctx.moveTo(R + 40, -16);
        ctx.lineTo(R + 40, 16);
        ctx.arc(R + 40, 24, 8, -Math.PI * 0.5, Math.PI);
        ctx.stroke();
        ctx.restore();
      });
    }

    const plateGrad = ctx.createRadialGradient(cx - 50, cy - 50, 20, cx, cy, R + 52);
    plateGrad.addColorStop(0, vessel.outerMid);
    plateGrad.addColorStop(0.75, vessel.outerDark);
    plateGrad.addColorStop(1, '#1A0C06');
    ctx.fillStyle = plateGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, R + 48, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = vessel.patternColor;
    ctx.lineWidth = 2.2;
    ctx.stroke();

    // 器皿朱漆/青瓷内圈口沿与 16 颗旋转金珠
    ctx.strokeStyle = vessel.innerRim;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(cx, cy, R + 24, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = vessel.patternColor;
    for (let i = 0; i < 16; i++) {
      const a = state.turntableAngle + (i * Math.PI * 2) / 16;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * (R + 36), cy + Math.sin(a) * (R + 36), 2.8, 0, Math.PI * 2);
      ctx.fill();
    }

    // 2. Step 0：俯视正圆刨冰基底与当前夹心
    if (state.step === 0) {
      const fl = state.spongeFlavor;
      const topGrad = ctx.createRadialGradient(cx - 45, cy - 45, 20, cx, cy, R);
      topGrad.addColorStop(0, '#FFFFFF');
      topGrad.addColorStop(0.45, fl.top);
      topGrad.addColorStop(0.85, fl.sideTop);
      topGrad.addColorStop(1, fl.crust);
      ctx.fillStyle = topGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.clip();
      for (let i = 0; i < 140; i++) {
        const p = SPONGE_PORES[i];
        const a = p.u * Math.PI * 2;
        const dist = Math.sqrt(p.v) * 0.93;
        ctx.fillStyle = p.dark ? fl.crust : '#FFFFFF';
        ctx.globalAlpha = p.dark ? 0.24 : 0.65;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * R * dist, cy + Math.sin(a) * R * dist, p.r * 1.15, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      const activeFillIdx = state.layersVisible === 1 ? 0 : (state.layersVisible === 2 ? 1 : -1);
      if (activeFillIdx >= 0) {
        const fObj = state.fillings[activeFillIdx];
        const surfY = getLayerTopY(activeFillIdx);
        fObj.strokes.forEach(st => {
          if (!st.points) return;
          const mappedPts = st.points.map(pt => {
            if (pt.u !== undefined) return { x: cx + pt.u * R, y: cy + pt.v * R };
            return { x: cx + ((pt.x - CAKE.cx) / CAKE.rx) * R, y: cy + ((pt.y - surfY) / CAKE.ry) * R };
          });
          drawRibbedCreamStroke(ctx, { ...st, points: mappedPts, size: (st.size || 24) * 1.25 }, false);
        });
        fObj.chunks.forEach(c => {
          const f = c.fruit || fObj.fruit;
          const fx = c.u !== undefined ? (cx + c.u * R) : (cx + ((c.x - CAKE.cx) / CAKE.rx) * R);
          const fy = c.v !== undefined ? (cy + c.v * R) : (cy + ((c.y - surfY) / CAKE.ry) * R);
          ctx.save();
          ctx.translate(fx, fy);
          ctx.rotate(c.rot);
          ctx.fillStyle = 'rgba(90, 40, 20, 0.22)';
          ctx.beginPath();
          ctx.ellipse(0, 4, 14 * c.s, 10 * c.s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = f.color;
          ctx.beginPath();
          ctx.roundRect(-12 * c.s, -10 * c.s, 24 * c.s, 20 * c.s, 5);
          ctx.fill();
          ctx.fillStyle = f.inner;
          ctx.beginPath();
          ctx.roundRect(-9 * c.s, -7 * c.s, 16 * c.s, 12 * c.s, 3);
          ctx.fill();
          ctx.restore();
        });
      }
      ctx.restore();

      ctx.strokeStyle = '#FFFFFF';
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(cx, cy, R - 1, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      return;
    }

    // 3. Step >= 1：俯视正圆冰山顶面缓冲渲染
    const topS = state.topSurface;
    topS.flushDirty();

    for (let i = 0; i < 36; i++) {
      const a = state.turntableAngle + (i * Math.PI * 2) / 36;
      const px = cx + Math.cos(a) * (R + 6);
      const py = cy + Math.sin(a) * (R + 6);
      const pg = ctx.createRadialGradient(px - 2, py - 2, 1, px, py, 9);
      pg.addColorStop(0, '#FFFFFF');
      pg.addColorStop(0.6, baseCol.light);
      pg.addColorStop(1, baseCol.shade);
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(px, py, 8.2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.clip();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(state.turntableAngle);
    ctx.drawImage(topS.canvas, -R, -R, R * 2, R * 2);
    if (state.topSketchImg && state.topSketchImg.complete && state.topSketchImg.naturalWidth > 0) {
      const skR = R * 0.66;
      ctx.save();
      ctx.shadowColor = 'rgba(62, 34, 21, 0.22)';
      ctx.shadowBlur = 3;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 2;
      ctx.drawImage(state.topSketchImg, -skR, -skR, skR * 2, skR * 2);
      ctx.restore();
    }
    ctx.restore();

    const topLight = ctx.createRadialGradient(cx - 65, cy - 65, 16, cx, cy, R);
    topLight.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
    topLight.addColorStop(0.6, 'rgba(255, 255, 255, 0)');
    topLight.addColorStop(1, 'rgba(75, 48, 34, 0.14)');
    ctx.fillStyle = topLight;
    ctx.fillRect(cx - R, cy - R, R * 2, R * 2);

    if (state.frostStrokes && state.frostStrokes.length > 0) {
      state.frostStrokes.forEach(st => {
        if (!st.isSauce || !st.points) return;
        const mappedPts = [];
        for (let i = 0; i < st.points.length; i++) {
          const pt = st.points[i];
          const wp = pt.surface ? surfaceToWorld(pt.surface, pt.u, pt.v, 'top') : resolveItemWorldPos(pt, 'top');
          if (wp) mappedPts.push(wp);
        }
        if (mappedPts.length > 0) {
          const mappedShards = (st.shards || []).map(sh => {
            const wp = sh.surface ? surfaceToWorld(sh.surface, sh.u, sh.v, 'top') : resolveItemWorldPos(sh, 'top');
            return wp ? { ...sh, x: wp.x, y: wp.y } : null;
          }).filter(Boolean);
          drawRibbedCreamStroke(ctx, { ...st, points: mappedPts, shards: mappedShards, size: (st.size || 24) * 1.2 }, false);
        }
      });
    }
    ctx.restore();

    if (state.dripGlaze && state.dripGlaze.color) {
      ctx.strokeStyle = state.dripGlaze.color;
      ctx.lineWidth = 13;
      ctx.beginPath();
      ctx.arc(cx, cy, R - 4, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = state.dripGlaze.highlight || 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.45;
      ctx.beginPath();
      ctx.arc(cx, cy, R - 6, -Math.PI * 0.75, Math.PI * 0.15);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  // 5.5 绘制杯沿蜜露挂滴
  function drawGanacheDrip(ctx, cx, ty, rx, ry, glaze) {
    ctx.save();
    ctx.fillStyle = glaze.color;

    const numCols = state.drips.length;
    for (let i = 0; i < numCols; i++) {
      const dripLen = state.drips[i];
      if (dripLen <= 2) continue;
      const t = i / (numCols - 1);
      const angle = (0.02 + t * 0.96) * Math.PI;
      const dx = cx + Math.cos(angle) * rx;
      const dy = ty + Math.sin(angle) * ry;
      const w = 7 + (i % 3) * 1.8;

      ctx.fillStyle = glaze.color;
      ctx.beginPath();
      ctx.moveTo(dx - w, dy - 3);
      ctx.quadraticCurveTo(dx - w * 0.7, dy + dripLen * 0.6, dx - w * 0.85, dy + dripLen);
      ctx.arc(dx, dy + dripLen, w * 0.85, Math.PI, 0, true);
      ctx.quadraticCurveTo(dx + w * 0.7, dy + dripLen * 0.6, dx + w, dy - 3);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = glaze.highlight;
      ctx.globalAlpha = 0.58;
      ctx.beginPath();
      ctx.ellipse(dx - w * 0.25, dy + dripLen - 2, 2, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.strokeStyle = glaze.color;
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.ellipse(cx, ty, rx - 3, ry - 2, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = glaze.highlight;
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.48;
    ctx.beginPath();
    ctx.ellipse(cx, ty - 1, rx - 4, ry - 3, 0, 0.1 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  // 5.6 绘制汉宫点酥 4 种花型 (卷云花、水波边、凝露珠、茱萸五瓣花)
  function drawPipingDollop(ctx, item) {
    const { x, y, nozzleId, color, scale = 1, angle = 0 } = item;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.fillStyle = 'rgba(75, 45, 25, 0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 5, 16, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    if (nozzleId === 'rosette') {
      const petals = 8;
      for (let ring = 0; ring < 2; ring++) {
        const rad = ring === 0 ? 14 : 8.5;
        const yOff = ring === 0 ? 0 : -4;
        for (let i = 0; i < petals; i++) {
          const a = (i * Math.PI * 2) / petals + ring * 0.4;
          const px = Math.cos(a) * (rad * 0.55);
          const py = yOff + Math.sin(a) * (rad * 0.38);
          const g = ctx.createRadialGradient(px - 2, py - 2, 1, px, py, rad * 0.65);
          g.addColorStop(0, color.light);
          g.addColorStop(0.65, color.mid);
          g.addColorStop(1, color.dark);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(px, py, rad * 0.52, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = color.dark;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.arc(px, py, rad * 0.5, a - 0.8, a + 0.8);
          ctx.stroke();
        }
      }
      const topG = ctx.createRadialGradient(-2, -8, 1, 0, -6, 7);
      topG.addColorStop(0, '#FFFFFF');
      topG.addColorStop(0.6, color.light);
      topG.addColorStop(1, color.mid);
      ctx.fillStyle = topG;
      ctx.beginPath();
      ctx.moveTo(-6, -5);
      ctx.quadraticCurveTo(0, -16, 4, -12);
      ctx.quadraticCurveTo(7, -5, 0, -2);
      ctx.closePath();
      ctx.fill();
    } else if (nozzleId === 'shell') {
      ctx.rotate(angle * 0.25);
      for (let i = 3; i >= 0; i--) {
        const s = 1 - i * 0.18;
        const g = ctx.createLinearGradient(-12, -10, 12, 8);
        g.addColorStop(0, color.light);
        g.addColorStop(0.55, color.mid);
        g.addColorStop(1, color.dark);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(0, -i * 2.2, 14 * s, 10 * s, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.strokeStyle = color.dark;
      ctx.lineWidth = 1;
      for (let r = -2; r <= 2; r++) {
        ctx.beginPath();
        ctx.moveTo(r * 2.5, -10);
        ctx.quadraticCurveTo(r * 4.5, 0, r * 1.8, 9);
        ctx.stroke();
      }
    } else if (nozzleId === 'pearl') {
      const g = ctx.createRadialGradient(-5, -8, 2, 0, -2, 16);
      g.addColorStop(0, '#FFFFFF');
      g.addColorStop(0.35, color.light);
      g.addColorStop(0.8, color.mid);
      g.addColorStop(1, color.dark);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-14, 2);
      ctx.bezierCurveTo(-15, -10, -4, -14, 0, -19);
      ctx.bezierCurveTo(5, -13, 15, -10, 14, 2);
      ctx.ellipse(0, 2, 14, 7.5, 0, 0, Math.PI);
      ctx.closePath();
      ctx.fill();
    } else if (nozzleId === 'blossom') {
      for (let i = 0; i < 5; i++) {
        const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
        const px = Math.cos(a) * 8.5;
        const py = Math.sin(a) * 6.5 - 2;
        const g = ctx.createRadialGradient(px - 1, py - 2, 1, px, py, 8);
        g.addColorStop(0, '#FFFFFF');
        g.addColorStop(0.6, color.light);
        g.addColorStop(1, color.dark);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(px, py, 7, 5.5, a, 0, Math.PI * 2);
        ctx.fill();
      }
      const centerG = ctx.createRadialGradient(-1, -3, 0.5, 0, -2, 4);
      centerG.addColorStop(0, '#FFF8D6');
      centerG.addColorStop(0.5, '#EBB041');
      centerG.addColorStop(1, '#B87E1A');
      ctx.fillStyle = centerG;
      ctx.beginPath();
      ctx.arc(0, -2, 3.8, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  /* ============================================================================
   * 6. 15 款东汉西域仙果、汉宫茶点与浮水荷花灯手绘渲染器 (零Emoji)
   * ============================================================================ */
  function drawDecorationItem(ctx, item, time = 0) {
    const { type, x, y, scale = 1, rot = 0 } = item;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.rotate(rot);

    if (type !== 'candle') {
      ctx.fillStyle = 'rgba(60, 30, 15, 0.20)';
      ctx.beginPath();
      ctx.ellipse(2, 7, 20, 10, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    switch (type) {
      case 'straw_whole': {
        // 岭南鲜剥荔枝：凝脂半透明白果肉、囊瓣弧纹、微露褐核与水润高光
        const lg = ctx.createRadialGradient(-6, -6, 2, 0, 0, 22);
        lg.addColorStop(0, '#FFFFFF');
        lg.addColorStop(0.55, '#F5F8FA');
        lg.addColorStop(0.88, '#D6E0EB');
        lg.addColorStop(1, '#B3C2D1');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.arc(0, 0, 18.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.78)';
        ctx.lineWidth = 1.2;
        for (let i = 0; i < 6; i++) {
          const a = (i * Math.PI) / 3;
          ctx.beginPath();
          ctx.arc(0, 0, 14, a, a + 0.7);
          ctx.stroke();
        }

        ctx.fillStyle = '#5C2C1D';
        ctx.beginPath();
        ctx.ellipse(0, -10, 6.5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#C83E4B';
        ctx.beginPath();
        ctx.arc(-6, -12, 2.5, 0, Math.PI * 2);
        ctx.arc(6, -11, 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath();
        ctx.ellipse(-7, -2, 3.2, 7.5, -0.3, 0, Math.PI * 2);
        ctx.fill();
        break;
      }

      case 'straw_half': {
        // 雕花蜜青梅：翠绿微黄果身 + S形螺旋雕花纹
        const pg = ctx.createRadialGradient(-6, -7, 2, 0, 0, 21);
        pg.addColorStop(0, '#D4F294');
        pg.addColorStop(0.45, '#8CBF47');
        pg.addColorStop(0.85, '#598A22');
        pg.addColorStop(1, '#3B6110');
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#EBF7B8';
        ctx.lineWidth = 1.6;
        for (let i = 0; i < 8; i++) {
          const a = (i * Math.PI * 2) / 8;
          ctx.save();
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(3, 0);
          ctx.quadraticCurveTo(10, 5, 16, 1);
          ctx.stroke();
          ctx.restore();
        }

        ctx.fillStyle = '#33520E';
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();
        break;
      }

      case 'blueberry': {
        // 西域红石榴簇：5颗多面体宝石红晶莹石榴籽 + 翠绿小叶
        ctx.save();
        ctx.rotate(-0.4);
        ctx.fillStyle = '#569E3E';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-15, -14, -24, -2);
        ctx.quadraticCurveTo(-14, 12, 0, 0);
        ctx.fill();
        ctx.restore();

        const arils = [[-8,-5],[4,-7],[-10,5],[1,3],[10,-1]];
        arils.forEach(([ax, ay]) => {
          const ag = ctx.createRadialGradient(ax - 2, ay - 2, 1, ax, ay, 9);
          ag.addColorStop(0, '#FF9EAB');
          ag.addColorStop(0.35, '#E01E37');
          ag.addColorStop(0.8, '#94091B');
          ag.addColorStop(1, '#59030E');
          ctx.fillStyle = ag;
          ctx.beginPath();
          ctx.roundRect(ax - 7, ay - 6.5, 14, 13, 4.5);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 235, 238, 0.55)';
          ctx.beginPath();
          ctx.ellipse(ax + 1, ay + 1, 2.8, 1.8, 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.beginPath();
          ctx.arc(ax - 3, ay - 2.5, 1.4, 0, Math.PI * 2);
          ctx.fill();
        });
        break;
      }

      case 'fig_slice': {
        // 鲜切无花果
        ctx.fillStyle = '#5E2346';
        ctx.beginPath();
        ctx.moveTo(0, -21);
        ctx.bezierCurveTo(15, -14, 20, 3, 13, 14);
        ctx.bezierCurveTo(6, 22, -6, 22, -13, 14);
        ctx.bezierCurveTo(-20, 3, -15, -14, 0, -21);
        ctx.fill();

        ctx.fillStyle = '#FDF6E4';
        ctx.beginPath();
        ctx.moveTo(0, -17);
        ctx.bezierCurveTo(12, -11, 16, 3, 10, 12);
        ctx.bezierCurveTo(5, 18, -5, 18, -10, 12);
        ctx.bezierCurveTo(-16, 3, -12, -11, 0, -17);
        ctx.fill();

        const coreG = ctx.createRadialGradient(0, 3, 2, 0, 3, 13);
        coreG.addColorStop(0, '#9E1432');
        coreG.addColorStop(0.7, '#E0425B');
        coreG.addColorStop(1, '#F7A1AE');
        ctx.fillStyle = coreG;
        ctx.beginPath();
        ctx.ellipse(0, 3, 10, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FFE49E';
        for (let i = 0; i < 12; i++) {
          const a = (i * Math.PI * 2) / 12;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 6, 3 + Math.sin(a) * 6.5, 0.9, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      }

      case 'mango_wedge': {
        // 金丸鲜枇杷瓣
        ctx.fillStyle = '#D9730D';
        ctx.beginPath();
        ctx.arc(0, 0, 19, 0.1 * Math.PI, 0.95 * Math.PI);
        ctx.quadraticCurveTo(0, 5, -17, 6);
        ctx.closePath();
        ctx.fill();

        const mg = ctx.createLinearGradient(-15, -10, 15, 15);
        mg.addColorStop(0, '#FFF1A8');
        mg.addColorStop(0.45, '#FFB72B');
        mg.addColorStop(1, '#E87E13');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(0, -3, 18, 0.08 * Math.PI, 0.92 * Math.PI);
        ctx.quadraticCurveTo(0, 0, -17, 1);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, -3, 13, 0.25 * Math.PI, 0.72 * Math.PI);
        ctx.stroke();
        break;
      }

      case 'cherry': {
        // 带梗蜜樱桃
        const cg = ctx.createRadialGradient(-5, -5, 2, 0, 0, 15);
        cg.addColorStop(0, '#FF7582');
        cg.addColorStop(0.3, '#D11528');
        cg.addColorStop(0.8, '#7A0612');
        cg.addColorStop(1, '#470209');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(0, 2, 13.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.beginPath();
        ctx.ellipse(-5, -3, 3.5, 2, -0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#5B8C33';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -5);
        ctx.bezierCurveTo(4, -20, 15, -28, 22, -26);
        ctx.stroke();
        break;
      }

      case 'mint_leaf': {
        // 兰草薄荷叶
        const drawLeaf = (angle, len, w) => {
          ctx.save();
          ctx.rotate(angle);
          const lg = ctx.createLinearGradient(0, 0, len, 0);
          lg.addColorStop(0, '#3C852B');
          lg.addColorStop(0.6, '#6AC252');
          lg.addColorStop(1, '#98E37D');
          ctx.fillStyle = lg;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(len * 0.5, -w, len, 0);
          ctx.quadraticCurveTo(len * 0.5, w, 0, 0);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(2, 0);
          ctx.lineTo(len - 3, 0);
          ctx.stroke();
          ctx.restore();
        };
        drawLeaf(-0.4, 23, 11);
        drawLeaf(0.45, 19, 9.5);
        break;
      }

      case 'macaron_pink': {
        // 汉代蜜饵环饼脆（金黄酥脆的螺旋麻花环饼）
        ctx.strokeStyle = '#B86B1E';
        ctx.lineWidth = 8.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, 17, 13, -0.15, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#F2B857';
        ctx.lineWidth = 6;
        ctx.setLineDash([7, 4]);
        ctx.beginPath();
        ctx.ellipse(0, -1, 17, 13, -0.15, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#FFFDF5';
        for (let i = 0; i < 8; i++) {
          const a = (i * Math.PI) / 4;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 16, Math.sin(a) * 12, 1.1, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      }

      case 'macaron_green': {
        // 汉瓦当云纹茯苓霜片
        ctx.fillStyle = '#D9CEBC';
        ctx.beginPath();
        ctx.arc(0, 3, 18, 0, Math.PI * 2);
        ctx.fill();

        const wg = ctx.createRadialGradient(-4, -4, 2, 0, 0, 18);
        wg.addColorStop(0, '#FFFFFF');
        wg.addColorStop(1, '#EFE8DA');
        ctx.fillStyle = wg;
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#C7B89E';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.moveTo(-10, 0); ctx.lineTo(10, 0);
        ctx.moveTo(0, -10); ctx.lineTo(0, 10);
        ctx.stroke();
        break;
      }

      case 'choco_sail': {
        // 金箔山楂果丹卷
        const cg = ctx.createLinearGradient(-15, -24, 15, 16);
        cg.addColorStop(0, '#9E1B2B');
        cg.addColorStop(0.5, '#6E0E1A');
        cg.addColorStop(1, '#42050C');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.moveTo(-12, 12);
        ctx.quadraticCurveTo(-16, -12, 2, -26);
        ctx.quadraticCurveTo(18, -8, 12, 12);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#F7D05E';
        [[0,-14],[4,-8],[-3,-5],[2,-2]].forEach(([gx, gy], idx) => {
          ctx.beginPath();
          ctx.ellipse(gx, gy, 3.2 - idx * 0.5, 1.8, 0.5 * idx, 0, Math.PI * 2);
          ctx.fill();
        });
        break;
      }

      case 'meringue': {
        // 琥珀核桃仁
        const wg = ctx.createRadialGradient(-5, -6, 2, 0, 0, 18);
        wg.addColorStop(0, '#F5B041');
        wg.addColorStop(0.5, '#B85D14');
        wg.addColorStop(1, '#632B05');
        ctx.fillStyle = wg;
        ctx.beginPath();
        ctx.ellipse(-6, 0, 10, 14, -0.1, 0, Math.PI * 2);
        ctx.ellipse(6, 0, 10, 14, 0.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#4A1E02';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(0, 12);
        ctx.arc(-6, -3, 5, 0.4, 2.6);
        ctx.arc(6, 3, 5, -2.6, -0.4);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.beginPath();
        ctx.ellipse(-6, -5, 2.5, 5, -0.2, 0, Math.PI * 2);
        ctx.fill();
        break;
      }

      case 'candle': {
        // 浮水荷花灯（双层粉白莲花瓣 + 金色莲蓬烛台 + 动态摇曳烛火）
        ctx.fillStyle = '#4C8C4A';
        ctx.beginPath();
        ctx.ellipse(0, 4, 22, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        for (let ring = 0; ring < 2; ring++) {
          const count = 8;
          const rLen = ring === 0 ? 19 : 13;
          for (let i = 0; i < count; i++) {
            const a = (i * Math.PI * 2) / count + ring * 0.4;
            ctx.save();
            ctx.rotate(a);
            const pg = ctx.createLinearGradient(0, 0, 0, -rLen);
            pg.addColorStop(0, '#FFFDF9');
            pg.addColorStop(0.65, '#FFD6E0');
            pg.addColorStop(1, '#E86A88');
            ctx.fillStyle = pg;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-5.5, -rLen * 0.6, 0, -rLen);
            ctx.quadraticCurveTo(5.5, -rLen * 0.6, 0, 0);
            ctx.fill();
            ctx.restore();
          }
        }

        ctx.fillStyle = '#EBB041';
        ctx.beginPath();
        ctx.arc(0, -1, 6.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#3A2618';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -2);
        ctx.lineTo(0, -11);
        ctx.stroke();

        if (state.candlesLit && !state.wishBlown) {
          const sway = Math.sin(time * 0.008 + x) * 2.2;
          const stretch = Math.cos(time * 0.012 + y) * 1.5;

          const halo = ctx.createRadialGradient(0, -20, 2, 0, -20, 36);
