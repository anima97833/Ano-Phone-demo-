  /* ============================================================================
   * 10. 压感毛笔手写花押画板与《洛阳消夏冰饮图》帛画合成导出
   * ============================================================================ */
  const cardModal = document.getElementById('cardModal');
  const sigCanvas = document.getElementById('sigCanvas');
  const sigCtx = sigCanvas.getContext('2d');
  let sigDrawing = false;

  function initSignaturePad() {
    sigCtx.strokeStyle = '#2B160C';
    sigCtx.lineCap = 'round';
    sigCtx.lineJoin = 'round';

    let lastPt = null;
    let lastTime = 0;
    let lastW = 3.4;

    const getSigPos = (e) => {
      const r = sigCanvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - r.left) * (sigCanvas.width / r.width),
        y: (cy - r.top) * (sigCanvas.height / r.height)
      };
    };

    sigCanvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      sigDrawing = true;
      lastPt = getSigPos(e);
      lastTime = performance.now();
      lastW = 3.6;
    });
    sigCanvas.addEventListener('pointermove', (e) => {
      if (!sigDrawing || !lastPt) return;
      e.preventDefault();
      const p = getSigPos(e);
      const now = performance.now();
      const dt = Math.max(1, now - lastTime);
      const dist = Math.hypot(p.x - lastPt.x, p.y - lastPt.y);
      const vel = dist / dt;
      // 模拟毛笔压感：慢笔顿挫粗润，快笔飞白纤细
      const targetW = Math.max(1.3, Math.min(5.2, 4.8 - vel * 2.2));
      const curW = lastW + (targetW - lastW) * 0.35;

      sigCtx.lineWidth = curW;
      sigCtx.beginPath();
      sigCtx.moveTo(lastPt.x, lastPt.y);
      sigCtx.lineTo(p.x, p.y);
      sigCtx.stroke();

      lastPt = p;
      lastTime = now;
      lastW = curW;
    });
    window.addEventListener('pointerup', () => {
      sigDrawing = false;
      lastPt = null;
    });

    document.getElementById('clearSigBtn').onclick = () => {
      sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      sfx.playPop(400);
    };
  }

  function openCardModal() {
    cardModal.classList.add('show');
    sfx.playPop(520);
  }

  function generateAndShowPoster() {
    const pCanvas = document.createElement('canvas');
    pCanvas.width = 760;
    pCanvas.height = 1040;
    const pctx = pCanvas.getContext('2d');

    // 1. 宣麻丝帛暖杏色背景
    const bg = pctx.createLinearGradient(0, 0, 0, 1040);
    bg.addColorStop(0, '#FFFDF9');
    bg.addColorStop(0.6, '#FDF3E4');
    bg.addColorStop(1, '#F6DEC2');
    pctx.fillStyle = bg;
    pctx.fillRect(0, 0, 760, 1040);

    // 汉代锦缎双层边框
    pctx.strokeStyle = '#C85A43';
    pctx.lineWidth = 3;
    pctx.strokeRect(24, 24, 712, 992);
    pctx.strokeStyle = '#D9A84E';
    pctx.lineWidth = 1.5;
    pctx.strokeRect(32, 32, 696, 976);

    // 2. 顶部题跋与朱文印章
    pctx.fillStyle = '#3E2215';
    pctx.font = 'bold 28px "Songti SC", "PingFang SC", serif';
    pctx.textAlign = 'center';
    pctx.fillText('洛阳凌阴 · 东汉消夏冰饮图', 380, 76);

    pctx.fillStyle = '#8C5B3E';
    pctx.font = '15px "Songti SC", "PingFang SC", serif';
    pctx.fillText('EASTERN HAN DYNASTY IMPERIAL ICE WORKSHOP', 380, 106);

    // 朱文方印「洛阳凌阴」
    pctx.fillStyle = '#C83E2B';
    pctx.fillRect(636, 54, 48, 48);
    pctx.strokeStyle = '#FFF9EF';
    pctx.lineWidth = 1.5;
    pctx.strokeRect(640, 58, 40, 40);
    pctx.fillStyle = '#FFF9EF';
    pctx.font = 'bold 14px "Songti SC", serif';
    pctx.fillText('洛阳', 660, 75);
    pctx.fillText('凌阴', 660, 92);

    // 3. 离屏渲染标准 2.5D 全景成品冰饮（不受当前缩放或俯视视角影响）
    const snapCanvas = document.createElement('canvas');
    snapCanvas.width = CW;
    snapCanvas.height = CH;
    const snapCtx = snapCanvas.getContext('2d');
    renderCakeScene(snapCtx, { viewMode: 'iso', zoom: 1.0, panX: 0, panY: 0 }, performance.now(), false);
    pctx.drawImage(snapCanvas, 20, 95, 720, 720);

    // 4. 底部汉简木牍展示区
    const cardThemes = [
      { bg: '#FFF7F2', border: '#D98873' },
      { bg: '#FFFDF7', border: '#DEC092' },
      { bg: '#F4FBF6', border: '#9EC7A8' },
      { bg: '#FBF5E8', border: '#C7AD78' }
    ];
    const th = cardThemes[state.card.theme] || cardThemes[0];
    pctx.fillStyle = th.bg;
    pctx.strokeStyle = th.border;
    pctx.lineWidth = 2.5;
    pctx.beginPath();
    pctx.roundRect(64, 770, 632, 210, 16);
    pctx.fill();
    pctx.stroke();

    pctx.fillStyle = '#3E2215';
    pctx.font = 'bold 20px "Songti SC", "PingFang SC", serif';
    pctx.textAlign = 'left';
    pctx.fillText(state.card.to || '致：洛阳知音', 96, 814);

    pctx.fillStyle = '#6E4930';
    pctx.font = '18px "Songti SC", "PingFang SC", serif';
    const bodyText = state.card.body || '愿以此盏凌阴瑞雪，涤尽炎夏万里尘劳，岁岁常安。';
    const line1 = bodyText.slice(0, 26);
    const line2 = bodyText.slice(26, 52);
    pctx.fillText(line1, 96, 854);
    if (line2) pctx.fillText(line2, 96, 884);

    pctx.drawImage(sigCanvas, 430, 895, 230, 52);
    pctx.fillStyle = '#B58867';
    pctx.font = '13px "Songti SC", "PingFang SC", serif';
    pctx.fillText(`凌人亲笔花押 · 器皿：${state.vessel.name}`, 96, 945);

    const dataUrl = pCanvas.toDataURL('image/png');
    document.getElementById('posterImage').src = dataUrl;
    document.getElementById('posterModal').classList.add('show');
    sfx.playChime();
    if (typeof window.__hanCakeOnPosterReady === 'function') {
      window.__hanCakeOnPosterReady(dataUrl);
    }
  }

  /* ============================================================================
   * 11. 绑定页面按钮事件与初始化启动
   * ============================================================================ */
  function bindEvents() {
    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerUp);
    window.addEventListener('pointercancel', handlePointerUp);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const raw = getRawCanvasPos(e);
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      setCameraZoom(state.camera.targetZoom * factor, raw.rawX, raw.rawY, false);
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        gesture.spaceHeld = true;
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') gesture.spaceHeld = false;
    });

    document.getElementById('viewModeBtn').onclick = () => {
      state.camera.viewMode = state.camera.viewMode === 'top' ? 'iso' : 'top';
      resetCamera(true);
      sfx.playPop(560);
      updateUI();
    };
    document.getElementById('zoomInBtn').onclick = () => {
      setCameraZoom(state.camera.targetZoom + 0.3, CW * 0.5, CH * 0.5, false);
      sfx.playPop(580);
    };
    document.getElementById('zoomOutBtn').onclick = () => {
      setCameraZoom(state.camera.targetZoom - 0.3, CW * 0.5, CH * 0.5, false);
      sfx.playPop(460);
    };
    document.getElementById('zoomResetBtn').onclick = () => {
      resetCamera(true);
      sfx.playPop(520);
    };

    document.querySelectorAll('#stepperBar .step-item').forEach(el => {
      el.addEventListener('click', () => {
        const targetStep = Number(el.dataset.step);
        goToStep(targetStep);
      });
    });

    prevStepBtn.addEventListener('click', () => {
      if (state.step > 0) goToStep(state.step - 1);
    });

    nextStepBtn.addEventListener('click', () => {
      if (state.step < 5) {
        goToStep(state.step + 1);
      } else {
        generateAndShowPoster();
      }
    });

    document.getElementById('btnScaleUp').onclick = () => {
      const item = state.decorations.find(d => d.uid === state.selectedDecorUid);
      if (item) { item.scale = Math.min(1.65, item.scale + 0.14); sfx.playPop(600); }
    };
    document.getElementById('btnScaleDown').onclick = () => {
      const item = state.decorations.find(d => d.uid === state.selectedDecorUid);
      if (item) { item.scale = Math.max(0.6, item.scale - 0.14); sfx.playPop(460); }
    };
    document.getElementById('btnRotate').onclick = () => {
      const item = state.decorations.find(d => d.uid === state.selectedDecorUid);
      if (item) { item.rot += 0.35; sfx.playPop(540); }
    };
    document.getElementById('btnDeleteDeco').onclick = () => {
      state.decorations = state.decorations.filter(d => d.uid !== state.selectedDecorUid);
      state.selectedDecorUid = null;
      sfx.playPop(340);
      updateUI();
    };

    document.getElementById('soundToggleBtn').onclick = () => {
      sfx.enabled = !sfx.enabled;
      document.getElementById('soundToggleBtn').style.opacity = sfx.enabled ? '1' : '0.45';
      if (sfx.enabled) sfx.playPop(560);
    };

    document.getElementById('resetGameBtn').onclick = () => {
      state = createInitialState();
      sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      sfx.playPop(420);
      updateUI();
    };

    document.getElementById('closeCardModalBtn').onclick = () => {
      cardModal.classList.remove('show');
    };

    document.querySelectorAll('#cardThemeTabs .sub-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('#cardThemeTabs .sub-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const th = Number(tab.dataset.theme);
        state.card.theme = th;
        const box = document.getElementById('cardPreviewBox');
        box.className = `card-preview-box card-theme-${th}`;
        sfx.playPop(520);
      };
    });

    document.querySelectorAll('#presetChips .preset-chip').forEach(chip => {
      chip.onclick = () => {
        document.getElementById('cardBodyInput').value = chip.dataset.msg;
        document.getElementById('cardPlacaInput').value = chip.dataset.plaque;
        sfx.playPop(580);
      };
    });

    document.getElementById('saveCardBtn').onclick = () => {
      state.card.to = document.getElementById('cardToInput').value.trim();
      state.card.body = document.getElementById('cardBodyInput').value.trim();
      state.card.plaqueText = document.getElementById('cardPlacaInput').value.trim() || '清凉无汗';
      state.card.hasPlaque = true;
      cardModal.classList.remove('show');
      sfx.playChime();
      updateUI();
    };

    document.getElementById('closePosterModalBtn').onclick = () => {
      document.getElementById('posterModal').classList.remove('show');
    };

    document.getElementById('downloadPosterBtn').onclick = () => {
      const link = document.createElement('a');
      link.download = `洛阳消夏冰饮图_${Date.now()}.png`;
      link.href = document.getElementById('posterImage').src;
      link.click();
      sfx.playPop(640);
    };
  }

  function goToStep(targetStep) {
    if (targetStep >= 1 && state.layersVisible < 3) {
      state.layersVisible = 3;
      state.fillings[0].spreadProgress = 1;
      state.fillings[1].spreadProgress = 1;
      state.layerPhase = 6;
    }
    if (targetStep >= 2 && state.roughCoverage < 0.5) {
      state.roughCoverage = 1;
      state.smoothProgress = 1;
      state.frostPhase = 2;
    }
    state.step = targetStep;
    state.selectedDecorUid = null;
    sfx.playPop(520);
    updateUI();
    if (targetStep === 4 && !state.card.hasPlaque) {
      openCardModal();
    }
    if (typeof window.__hanCakeOnStepChanged === 'function') {
      window.__hanCakeOnStepChanged(targetStep);
    }
  }

  /* ============================================================================
   * 12. 东汉工坊 · 传讯名士共创桥接引擎（洛阳凌阴 · 东汉版）
   * ============================================================================ */
  function initHanCoCreationBridge() {
    const EDITION = 'han';
    const charSelectEl = document.getElementById('coopCharSelect');
    const modeSelectEl = document.getElementById('coopModeSelect');
    const swapBtnEl = document.getElementById('coopSwapTurnBtn');
    const actionBtnEl = document.getElementById('coopActionBtn');
    const pillEl = document.getElementById('coopSpeakerPill');
    const pillNameEl = document.getElementById('coopPillName');
    const pillPreviewEl = document.getElementById('coopPillPreview');
    const bubbleEl = document.getElementById('coopBubble');
    const bubbleNameEl = document.getElementById('coopBubbleName');
    const bubbleTagEl = document.getElementById('coopBubbleTag');
    const bubbleTextEl = document.getElementById('coopBubbleText');
    const bubbleActionsEl = document.getElementById('coopBubbleActions');
    const nextStepBtnEl = document.getElementById('coopNextStepBtn');
    const skipAnimBtnEl = document.getElementById('coopSkipAnimBtn');
    const collapseBtnEl = document.getElementById('coopBubbleCollapseBtn');

    const posterViewTabsEl = document.getElementById('posterViewTabs');
    const tabPosterImgEl = document.getElementById('tabPosterImg');
    const tabPosterNotesEl = document.getElementById('tabPosterNotes');
    const posterImgEl = document.getElementById('posterImage');
    const posterNotesPageEl = document.getElementById('posterNotesPage');
    const posterReviewBoxEl = document.getElementById('posterReviewBox');
    const posterTasteRowEl = document.getElementById('posterTasteRow');
    const askCharTasteBtnEl = document.getElementById('askCharTasteBtn');
    const posterUserFeedbackRowEl = document.getElementById('posterUserFeedbackRow');
    const userFeedbackInputEl = document.getElementById('userFeedbackInput');
    const sendUserFeedbackBtnEl = document.getElementById('sendUserFeedbackBtn');
    const saveBackpackBtnEl = document.getElementById('saveBackpackBtn');
    const openForwardModalBtnEl = document.getElementById('openForwardModalBtn');
    const posterToastEl = document.getElementById('posterActionToast');

    const historyModalEl = document.getElementById('historyModal');
    const historyListEl = document.getElementById('historyList');
    const forwardModalEl = document.getElementById('forwardModal');
    const forwardCharSelectEl = document.getElementById('forwardCharSelect');
    const forwardNoteInputEl = document.getElementById('forwardNoteInput');
    const confirmForwardBtnEl = document.getElementById('confirmForwardBtn');

    const coop = {
      characters: [],
      selectedCharId: '',
      userName: '广陵王',
      mode: 'user_make_char_eat',
      userFirst: true,
      busy: false,
      relayHistory: [],
      makingNotes: [],
      lastReview: null,
      fullMakeSession: null,
      currentHistoryId: '',
      bubbleExpanded: false
    };

    const pendingRpcs = {};
    let rpcSeq = 0;

    function sendHostRpc(reqType, resType, payload) {
      return new Promise((resolve, reject) => {
        const reqId = `han_rpc_${Date.now()}_${++rpcSeq}`;
        const timer = setTimeout(() => {
          delete pendingRpcs[reqId];
          reject(new Error('与宿主通信超时'));
        }, 50000);
        pendingRpcs[reqId] = { resType, resolve, reject, timer };
        window.parent.postMessage({ type: reqType, requestId: reqId, payload: Object.assign({ edition: EDITION }, payload || {}) }, '*');
      });
    }

    window.addEventListener('message', (ev) => {
      const data = ev && ev.data;
      if (!data || typeof data !== 'object' || !data.type) return;
      if (data.type === 'WORKSHOP_CAKE_HOST_SYNC') {
        const p = data.payload || {};
        coop.characters = Array.isArray(p.characters) ? p.characters : [];
        coop.userName = p.userName || '广陵王';
        renderCharSelectOptions();
        syncCoopBarUI();
        return;
      }
      if (data.requestId && pendingRpcs[data.requestId]) {
        const entry = pendingRpcs[data.requestId];
        clearTimeout(entry.timer);
        delete pendingRpcs[data.requestId];
        if (data.error) entry.reject(new Error(data.error));
        else entry.resolve(data.result);
      }
    });

    function renderCharSelectOptions() {
      const opts = coop.characters.length > 0
        ? coop.characters.map(c => `<option value="${String(c.id).replace(/"/g, '&quot;')}">${c.name}</option>`).join('')
        : '<option value="">暂未检测到名士</option>';
      charSelectEl.innerHTML = opts;
      forwardCharSelectEl.innerHTML = opts;
      if (!coop.selectedCharId && coop.characters.length > 0) {
        coop.selectedCharId = String(coop.characters[0].id);
      }
      if (coop.selectedCharId) {
        charSelectEl.value = coop.selectedCharId;
        forwardCharSelectEl.value = coop.selectedCharId;
      }
    }

    function getSelectedCharName() {
      const found = coop.characters.find(c => String(c.id) === String(coop.selectedCharId));
      return (found && found.name) || '名士';
    }

    function showToast(msg) {
      posterToastEl.textContent = msg || '';
      if (msg) setTimeout(() => { if (posterToastEl.textContent === msg) posterToastEl.textContent = ''; }, 3600);
    }

    function setBubbleExpanded(expand) {
      coop.bubbleExpanded = Boolean(expand);
      bubbleEl.classList.toggle('show', coop.bubbleExpanded);
      pillEl.classList.toggle('show', !coop.bubbleExpanded && Boolean(bubbleTextEl.textContent));
    }

    function showBubble(name, tag, text, showStepBtns, nextBtnLabel) {
      bubbleNameEl.textContent = name || getSelectedCharName();
      bubbleTagEl.textContent = tag || '手作中';
      bubbleTextEl.textContent = text || '';
      pillNameEl.textContent = name || getSelectedCharName();
      pillPreviewEl.textContent = '▸';
      bubbleActionsEl.style.display = showStepBtns ? 'flex' : 'none';
      if (nextBtnLabel) nextStepBtnEl.textContent = nextBtnLabel;
      // 手动推进模式默认展开方便点「看下一步」，其他提醒默认收起成左下角胶囊不挡冰盏
      setBubbleExpanded(Boolean(showStepBtns));
    }

    function hideBubble() {
      bubbleTextEl.textContent = '';
      bubbleEl.classList.remove('show');
      pillEl.classList.remove('show');
    }

    pillEl.onclick = () => setBubbleExpanded(true);
    collapseBtnEl.onclick = () => setBubbleExpanded(false);

    function describeStepActionChoice(stepIdx, act) {
      if (!act || typeof act !== 'object') return '按心意完成本步';
      if (stepIdx === 0) {
        const vs = (HAN_VESSELS.find(x => x.id === act.vesselId) || state.vessel || {}).name || '朱漆云纹耳杯';
        const sp = (SPONGE_FLAVORS.find(x => x.id === act.spongeId) || {}).name || '凌阴清雪冰';
        const fc1 = (FILLING_CREAMS.find(x => x.id === act.fillingCreamId) || {}).name || '赤豆蜜沙';
        const ff1 = (FILLING_FRUITS.find(x => x.id === act.fillingFruitId) || {}).name || '鲜剥荔枝丁';
        const fc2 = (FILLING_CREAMS.find(x => x.id === (act.fillingCream2Id || act.fillingCreamId)) || {}).name || fc1;
        const ff2 = (FILLING_FRUITS.find(x => x.id === (act.fillingFruit2Id || act.fillingFruitId)) || {}).name || ff1;
        if (fc2 !== fc1 || ff2 !== ff1) {
          return `${vs}｜${sp}｜第1层 ${fc1}+${ff1}｜第2层 ${fc2}+${ff2}`;
        }
        return `${vs} · ${sp} + ${fc1} + ${ff1}`;
      }
      if (stepIdx === 1) {
        const col = (FROSTING_COLORS.find(x => x.id === act.frostingColorId) || {}).name || '雪白凝酪';
        const secCol = act.secondaryFrostingColorId && act.secondaryFrostingColorId !== 'none'
          ? (FROSTING_COLORS.find(x => x.id === act.secondaryFrostingColorId) || {}).name
          : '';
        const styleLabel = secCol && act.frostingStyle === 'marble'
          ? `×${secCol}(冰纹晕染)`
          : (secCol && act.frostingStyle === 'ombre' ? `×${secCol}(双色渐变)` : '');
        const gl = (DRIP_GLAZES.find(x => x.id === act.dripGlazeId) || {}).name || '无挂露';
        const spen = act.saucePenId && act.saucePenId !== 'none' && act.saucePattern && act.saucePattern !== 'none'
          ? (DRIP_GLAZES.find(x => x.id === act.saucePenId) || {}).name
          : '';
        const spenLabel = spen ? ` + ${spen}拉丝` : '';
        const skLabel = act.cakeTopSketchSvg ? ` + 冰顶手绘「${act.cakeTopSketchTitle || '简笔画'}」` : '';
        return `${col}${styleLabel} · ${gl}${spenLabel}${skLabel}`;
      }
      if (stepIdx === 2) {
        const nz = (PIPING_NOZZLES.find(x => x.id === act.pipingNozzleId) || {}).name || '汉宫卷云花';
        const pc = (PIPING_COLORS.find(x => x.id === act.pipingColorId) || {}).name || '凝脂白';
        const spc = act.secondaryPipingColorId && act.secondaryPipingColorId !== 'none'
          ? (PIPING_COLORS.find(x => x.id === act.secondaryPipingColorId) || {}).name
          : '';
        const patMap = { princess: '顶缘+底边裙边', double_crown: '双层花环', crown: '皇冠花环', ring: '经典外圈', minimal: '雅致单圈' };
        return `${pc}${spc ? '×' + spc : ''} · ${nz}（${patMap[act.pipingPattern] || '汉宫点酥'}）`;
      }
      if (stepIdx === 3) {
        const names = (Array.isArray(act.decorList) ? act.decorList : [])
          .map(id => (DECOR_ITEMS.find(x => x.id === id) || {}).name)
          .filter(Boolean);
        const spNames = (Array.isArray(act.sprinkleTypes) ? act.sprinkleTypes : [])
          .map(id => (DECOR_ITEMS.find(x => x.id === id) || {}).name)
          .filter(Boolean);
        const sideMap = {
          garland: '冰壁汉宫垂弧花环',
          blossom_wall: '冰壁凝酥浮雕小花',
          fruit_wall: '冰壁蜜梅环饼贴面',
          starlight: '冰壁星河金箔金桂'
        };
        const sideLabel = sideMap[act.sideStyle] ? `｜${sideMap[act.sideStyle]}` : '';
        const baseStr = names.length > 0 ? names.join('、') : '西域仙果';
        return (spNames.length > 0 ? `${baseStr} ＋ ${spNames.join('、')}` : baseStr) + sideLabel;
      }
      if (stepIdx === 4) {
        const skNote = act.cardSketchSvg ? `｜ 花押小画「${act.cardSketchTitle || '亲笔花押'}」` : '';
        return `玉签「${act.plaqueText || ''}」｜ 木牍「${act.cardBody || ''}」${skNote}`;
      }
      return '点亮浮水荷花灯';
    }

    function recordMakingNote(stepIdx, charName, act, reasonText) {
      const stepNames = ['步骤一 · 凿冰夹心', '步骤二 · 淋浆匀冰', '步骤三 · 汉宫点酥', '步骤四 · 西域仙果', '步骤五 · 木牍题词', '步骤六 · 浮荷进饮'];
      const note = {
        stepIdx,
        stepName: stepNames[stepIdx] || `步骤 ${stepIdx + 1}`,
        charName: charName || getSelectedCharName(),
        pickedSummary: describeStepActionChoice(stepIdx, act),
        reasonText: String(reasonText || '').trim()
      };
      const exist = coop.makingNotes.findIndex(n => n.stepIdx === stepIdx);
      if (exist >= 0) coop.makingNotes[exist] = note;
      else coop.makingNotes.push(note);
      coop.makingNotes.sort((a, b) => a.stepIdx - b.stepIdx);
      renderPosterNotesView();
    }

    function setPosterViewTab(which) {
      const showNotes = which === 'notes' && coop.makingNotes.length > 0;
      tabPosterImgEl.classList.toggle('active', !showNotes);
      tabPosterNotesEl.classList.toggle('active', showNotes);
      posterImgEl.style.display = showNotes ? 'none' : 'block';
      posterNotesPageEl.classList.toggle('show', showNotes);
    }

    function renderPosterNotesView() {
      const hasNotes = coop.makingNotes.length > 0;
      posterViewTabsEl.classList.toggle('show', hasNotes);
      if (!hasNotes) { setPosterViewTab('img'); return; }
      const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      posterNotesPageEl.innerHTML = coop.makingNotes.map(n =>
        `<div class="poster-note-item">` +
          `<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px;">` +
            `<span style="font-size:11.5px;font-weight:800;color:#C83E2B;">${esc(n.stepName)}</span>` +
            `<span style="font-size:10px;padding:1px 7px;border-radius:999px;background:#FCE5CD;color:#784B31;font-weight:700;">${esc(n.charName)} 选配</span>` +
          `</div>` +
          `<div style="font-size:11.5px;font-weight:700;color:#5A301D;margin-bottom:4px;">所选料材：${esc(n.pickedSummary)}</div>` +
          `<div style="font-size:12px;line-height:1.65;color:#3E2215;">「${esc(n.reasonText)}」</div>` +
        `</div>`
      ).join('');
    }

    tabPosterImgEl.onclick = () => setPosterViewTab('img');
    tabPosterNotesEl.onclick = () => setPosterViewTab('notes');

    function isCharTurnInRelay(stepIdx) {
      if (coop.mode !== 'relay_coop') return false;
      if (stepIdx >= 5) return false;
      return coop.userFirst ? (stepIdx % 2 === 1) : (stepIdx % 2 === 0);
    }

    function captureSmallCakeSnapshot() {
      try {
        const tmp = document.createElement('canvas');
        tmp.width = 384;
        tmp.height = 404;
        const tctx = tmp.getContext('2d');
        tctx.fillStyle = '#FFF9EF';
        tctx.fillRect(0, 0, tmp.width, tmp.height);
        tctx.drawImage(canvas, 0, 0, tmp.width, tmp.height);
        return tmp.toDataURL('image/jpeg', 0.78);
      } catch (_) { return ''; }
    }

    function buildCakeVisualSnapshot() {
      const vesselName = (state.vessel && state.vessel.name) || '朱漆云纹耳杯';
      const spongeName = (state.spongeFlavor && state.spongeFlavor.name) || '凌阴清雪冰';
      const f0 = state.fillings[0] || {};
      const f1 = state.fillings[1] || {};
      const fillDesc = `第1层夹心：${(f0.cream && f0.cream.name) || '赤豆蜜沙'} + ${(f0.fruit && f0.fruit.name) || '鲜剥荔枝丁'}；第2层夹心：${(f1.cream && f1.cream.name) || '赤豆蜜沙'} + ${(f1.fruit && f1.fruit.name) || '鲜剥荔枝丁'}`;
      const frostName = (state.frostingColor && state.frostingColor.name) || '雪白凝酪';
      const dripName = (state.dripGlaze && state.dripGlaze.name) || '无挂露';
      const pipeDesc = state.pipings.length > 0
        ? `共点酥 ${state.pipings.length} 处${(state.pipingColor && state.pipingColor.name) || '凝脂白'}${(state.pipingNozzle && state.pipingNozzle.name) || '酥花'}`
        : '尚未点酥';
      const decorCounts = {};
      state.decorations.forEach(d => {
        const meta = DECOR_ITEMS.find(x => x.id === d.type);
        const label = (meta && meta.name) || d.type;
        decorCounts[label] = (decorCounts[label] || 0) + 1;
      });
      const decorSummary = Object.keys(decorCounts).length > 0
        ? Object.keys(decorCounts).map(k => `${k}×${decorCounts[k]}`).join('、')
        : '暂未点缀仙果';
      const sprinkleCounts = {};
      (state.sprinkles || []).forEach(sp => {
        const meta = DECOR_ITEMS.find(x => x.id === sp.type);
        const label = (meta && meta.name) || sp.type;
        sprinkleCounts[label] = (sprinkleCounts[label] || 0) + 1;
      });
      const sprinkleSummary = Object.keys(sprinkleCounts).length > 0
        ? `；撒料：${Object.keys(sprinkleCounts).join('、')}（共 ${state.sprinkles.length} 粒）`
        : '';
      const topSketchNote = state.topSketchTitle ? `，冰顶手绘了「${state.topSketchTitle}」简笔画` : '';
      const cardInfo = state.card && state.card.hasPlaque
        ? `玉签刻字：「${state.card.plaqueText || '清凉无汗'}」；木牍抬头「${state.card.to || ''}」，祝文：「${state.card.body || ''}」` + (state.card.sketchTitle ? `；花押涂鸦「${state.card.sketchTitle}」` : '')
        : '尚未题写木牍';

      const fullText = [
        `1. 汉代器皿与冰胚：${vesselName} 盛 ${spongeName}（3层）；${fillDesc}`,
        `2. 凝酪蜜浆与挂露：${frostName}，${dripName}${topSketchNote}`,
        `3. 汉宫点酥：${pipeDesc}`,
        `4. 西域仙果与装饰：${decorSummary}（总计 ${state.decorations.length} 件）${sprinkleSummary}`,
        `5. 汉简木牍：${cardInfo}`,
        `6. 浮水荷花灯：${state.candlesLit ? '已点亮' : '未点亮'}`
      ].join('\n');

      return {
        cakeName: `${frostName.replace(/凝酪$|浓煎$|香露$/, '')}${spongeName.replace(/冰$/, '')}冰饮`,
        cakeDesc: `${vesselName}盛${spongeName}，配${(f0.cream && f0.cream.name) || '蜜沙'}、${frostName}与${dripName}，缀${decorSummary}`,
        plaqueText: (state.card && state.card.plaqueText) || '',
        visualSnapshotText: fullText
      };
    }

    function paintArtisanFrostingSurface(buf, primaryHex, secondaryHex, style, baseHeight, isTop) {
      if (!secondaryHex || style === 'solid') {
        buf.fillBaseColor(primaryHex, baseHeight);
        return;
      }
      const c1 = hexToRgb(primaryHex);
      const c2 = hexToRgb(secondaryHex);
      const r1 = srgbToLin(c1.r), g1 = srgbToLin(c1.g), b1 = srgbToLin(c1.b);
      const r2 = srgbToLin(c2.r), g2 = srgbToLin(c2.g), b2 = srgbToLin(c2.b);
      const w = buf.width, h = buf.height;
      const albedo = buf.albedo, hm = buf.heightMap;
      for (let y = 0; y < h; y++) {
        const ny = y / Math.max(1, h - 1);
        for (let x = 0; x < w; x++) {
          const nx = x / Math.max(1, w - 1);
          let t = 0;
          if (style === 'marble') {
            const wave = Math.sin(nx * Math.PI * 4 + Math.sin(ny * Math.PI * 3) * 1.4) * 0.5 + 0.5;
            const wave2 = Math.cos((nx * 2.2 - ny * 2.8) * Math.PI) * 0.5 + 0.5;
            t = Math.max(0, Math.min(1, (wave * 0.62 + wave2 * 0.38) * 0.72));
          } else {
            if (isTop) {
              const dx = (nx - 0.5) * 2, dy = (ny - 0.5) * 2;
              t = Math.pow(Math.min(1, Math.hypot(dx, dy)), 1.45) * 0.72;
            } else {
              const smoothWave = Math.sin(nx * Math.PI * 4) * 0.04;
              t = Math.max(0, Math.min(1, (ny + smoothWave - 0.12) * 1.05));
            }
          }
          const idx = y * w + x, i4 = idx * 4;
          albedo[i4] = r1 + (r2 - r1) * t;
          albedo[i4 + 1] = g1 + (g2 - g1) * t;
          albedo[i4 + 2] = b1 + (b2 - b1) * t;
          albedo[i4 + 3] = 1.0;
          hm[idx] = baseHeight + (style === 'marble' ? (t - 0.35) * 0.06 : 0);
        }
      }
      buf.rebuildRegion(0, 0, w - 1, h - 1);
      buf.dirty = null;
    }

    function addArtisanSauceStrokes(saucePenObj, pattern) {
      if (!saucePenObj || !saucePenObj.color || !pattern || pattern === 'none') return;
      if (!state.frostStrokes) state.frostStrokes = [];
      const pushPts = (pts, size) => {
        if (pts.length < 2) return;
        state.frostStrokes.push({ points: pts, size, isSauce: true, color: saucePenObj, shards: [] });
      };
      if (pattern === 'swirl') {
        const pts = [];
        for (let i = 0; i <= 44; i++) {
          const frac = i / 44, a = frac * Math.PI * 4.5, r = 0.08 + frac * 0.64;
          const u = Math.cos(a) * r, v = Math.sin(a) * r;
          const wp = surfaceToWorld('top', u, v, 'iso');
          pts.push({ x: wp.x, y: wp.y, surface: 'top', u, v });
        }
        pushPts(pts, 11);
      } else if (pattern === 'lace') {
        const pts = [];
        for (let i = 0; i <= 64; i++) {
          const a = (i / 64) * Math.PI * 2, r = 0.72 + Math.sin(a * 10) * 0.07;
          const u = Math.cos(a) * r, v = Math.sin(a) * r;
          const wp = surfaceToWorld('top', u, v, 'iso');
          pts.push({ x: wp.x, y: wp.y, surface: 'top', u, v });
        }
        pushPts(pts, 10);
      } else if (pattern === 'ribbon') {
        const pts = [];
        for (let i = 0; i <= 36; i++) {
          const frac = i / 36, u = 0.03 + frac * 0.44, v = 0.56 + Math.sin(frac * Math.PI * 5) * 0.14;
          const wp = surfaceToWorld('side', u, v, 'iso');
          if (wp) pts.push({ x: wp.x, y: wp.y, surface: 'side', u, v });
        }
        pushPts(pts, 11);
      }
    }

    function loadSvgToImage(svgStr, onLoaded, onFailed) {
      if (!svgStr || typeof svgStr !== 'string') { if (typeof onFailed === 'function') onFailed(); return; }
      let safeSvg = svgStr.trim();
      if (!/<svg[^>]*\swidth\s*=/i.test(safeSvg)) {
        safeSvg = safeSvg.replace(/<svg\b/i, '<svg width="320" height="80"');
      }
      const tryDataUri = () => {
        try {
          const img = new Image();
          img.onload = () => { if (typeof onLoaded === 'function') onLoaded(img); };
          img.onerror = () => { if (typeof onFailed === 'function') onFailed(); };
          img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(safeSvg);
        } catch (_) { if (typeof onFailed === 'function') onFailed(); }
      };
      try {
        if (typeof Blob !== 'undefined' && typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function') {
          const blob = new Blob([safeSvg], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.onload = () => { try { URL.revokeObjectURL(url); } catch (_) {} if (typeof onLoaded === 'function') onLoaded(img); };
          img.onerror = () => { try { URL.revokeObjectURL(url); } catch (_) {} tryDataUri(); };
          img.src = url;
          return;
        }
      } catch (_) {}
      tryDataUri();
    }

    function drawFallbackSignatureCanvas(charName) {
      sigCtx.save();
      sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      sigCtx.strokeStyle = '#5A3822';
      sigCtx.lineWidth = 2.4;
      sigCtx.lineCap = 'round';
      sigCtx.beginPath();
      sigCtx.moveTo(22, 56);
      sigCtx.quadraticCurveTo(88, 36, 152, 42);
      sigCtx.quadraticCurveTo(186, 44, 214, 26);
      sigCtx.stroke();
      sigCtx.beginPath();
      sigCtx.moveTo(96, 42);
      sigCtx.quadraticCurveTo(110, 24, 130, 18);
      sigCtx.stroke();
      [[134, 16, '#C83E2B'], [142, 20, '#F09AA9'], [128, 22, '#F09AA9'], [136, 26, '#C83E2B']].forEach(([fx, fy, fc]) => {
        sigCtx.fillStyle = fc;
        sigCtx.beginPath();
        sigCtx.arc(fx, fy, 4.4, 0, Math.PI * 2);
        sigCtx.fill();
      });
      sigCtx.fillStyle = '#F2D26B';
      sigCtx.beginPath();
      sigCtx.arc(135, 21, 2.2, 0, Math.PI * 2);
      sigCtx.fill();
      sigCtx.fillStyle = '#3E2215';
      sigCtx.font = 'bold 21px "Songti SC", "STKaiti", serif';
      sigCtx.textBaseline = 'middle';
      sigCtx.fillText(String(charName || getSelectedCharName() || '名士').slice(0, 4), 236, 42);
      sigCtx.strokeStyle = '#C83E2B';
      sigCtx.lineWidth = 1.6;
      sigCtx.beginPath();
      sigCtx.moveTo(230, 58);
      sigCtx.quadraticCurveTo(270, 54, 312, 60);
      sigCtx.stroke();
      sigCtx.restore();
    }

    function applyCharacterStepToCanvas(stepIdx, act) {
      if (!act || typeof act !== 'object') return;
      if (stepIdx === 0) {
        const vs = HAN_VESSELS.find(x => x.id === act.vesselId) || state.vessel || HAN_VESSELS[0];
        const sp = SPONGE_FLAVORS.find(x => x.id === act.spongeId) || SPONGE_FLAVORS[0];
        const fc1 = FILLING_CREAMS.find(x => x.id === act.fillingCreamId) || FILLING_CREAMS[0];
        const ff1 = FILLING_FRUITS.find(x => x.id === act.fillingFruitId) || FILLING_FRUITS[0];
        const fc2 = FILLING_CREAMS.find(x => x.id === (act.fillingCream2Id || act.fillingCreamId)) || fc1;
        const ff2 = FILLING_FRUITS.find(x => x.id === (act.fillingFruit2Id || act.fillingFruitId)) || ff1;
        state.vessel = vs;
        state.spongeFlavor = sp;
        state.fillingCream = fc1;
        state.fillingFruit = ff1;
        if (state.fillings[0]) { state.fillings[0].cream = fc1; state.fillings[0].fruit = ff1; state.fillings[0].spreadProgress = 1; }
        if (state.fillings[1]) { state.fillings[1].cream = fc2; state.fillings[1].fruit = ff2; state.fillings[1].spreadProgress = 1; }
        state.layersVisible = 3;
        state.layerPhase = 6;
        sfx.playChime();
      } else if (stepIdx === 1) {
        const col = FROSTING_COLORS.find(x => x.id === act.frostingColorId) || FROSTING_COLORS[0];
        const secCol = (act.secondaryFrostingColorId && act.secondaryFrostingColorId !== 'none')
          ? FROSTING_COLORS.find(x => x.id === act.secondaryFrostingColorId) : null;
        const fStyle = secCol ? (act.frostingStyle || 'ombre') : 'solid';
        const gl = DRIP_GLAZES.find(x => x.id === act.dripGlazeId) || DRIP_GLAZES[0];
        const baseH = act.neatness === 'rustic' ? 0.44 : 0.64;
        state.frostingColor = col;
        state.baseCoatColor = col;
        paintArtisanFrostingSurface(state.topSurface, col.mid, secCol ? secCol.mid : null, fStyle, baseH, true);
        paintArtisanFrostingSurface(state.sideSurface, col.mid, secCol ? secCol.mid : null, fStyle, baseH, false);
        state.roughCoverage = 1;
        state.smoothProgress = act.neatness === 'rustic' ? 0.74 : 1;
        state.frostPhase = 2;
        state.dripGlaze = gl;
        state.drips = new Array(32).fill(0).map((_, i) => gl.id === 'none' ? 0 : (18 + Math.round(Math.sin(i * 1.15) * 10 + ((i * 17) % 18))));
        if (act.saucePenId && act.saucePenId !== 'none' && act.saucePattern && act.saucePattern !== 'none') {
          const spen = DRIP_GLAZES.find(x => x.id === act.saucePenId);
          if (spen && spen.color) { state.saucePen = spen; addArtisanSauceStrokes(spen, act.saucePattern); }
        }
        if (act.cakeTopSketchSvg) {
          state.topSketchTitle = act.cakeTopSketchTitle || '冰顶手绘';
          loadSvgToImage(act.cakeTopSketchSvg, img => { state.topSketchImg = img; });
        } else {
          state.topSketchImg = null;
          state.topSketchTitle = '';
        }
        sfx.playChime();
      } else if (stepIdx === 2) {
        const nz = PIPING_NOZZLES.find(x => x.id === act.pipingNozzleId) || PIPING_NOZZLES[0];
        const pc = PIPING_COLORS.find(x => x.id === act.pipingColorId) || PIPING_COLORS[0];
        const spc = (act.secondaryPipingColorId && act.secondaryPipingColorId !== 'none')
          ? (PIPING_COLORS.find(x => x.id === act.secondaryPipingColorId) || pc) : pc;
        state.pipingNozzle = nz;
        state.pipingColor = pc;
        const pat = act.pipingPattern || 'princess';
        const ty = getCakeTopY();
        const outerCount = pat === 'minimal' ? 8 : 12;
        const outerRadius = pat === 'crown' ? 0.80 : 0.88;
        for (let i = 0; i < outerCount; i++) {
          const a = (i * Math.PI * 2) / outerCount;
          const u = Math.cos(a) * outerRadius, v = Math.sin(a) * outerRadius;
          const useCol = (spc !== pc && i % 2 === 1 && pat !== 'double_crown') ? spc : pc;
          state.pipings.push({ x: CAKE.cx + u * (CAKE.rx + 4), y: ty + v * (CAKE.ry + 2), surface: 'top', u, v, nozzleId: nz.id, color: useCol, scale: 1, angle: a });
        }
        if (pat === 'double_crown') {
          const innerNz = nz.id === 'shell' ? 'pearl' : (nz.id === 'rosette' ? 'blossom' : nz.id);
          for (let i = 0; i < 8; i++) {
            const a = (i * Math.PI * 2) / 8 + Math.PI / 8;
            const u = Math.cos(a) * 0.56, v = Math.sin(a) * 0.56;
            state.pipings.push({ x: CAKE.cx + u * (CAKE.rx + 4), y: ty + v * (CAKE.ry + 2), surface: 'top', u, v, nozzleId: innerNz, color: spc, scale: 0.86, angle: a });
          }
        }
        if (pat === 'princess') {
          const skirtNz = nz.id === 'blossom' ? 'pearl' : 'shell';
          for (let i = 0; i < 16; i++) {
            const u = i / 16, v = 0.95;
            const wp = surfaceToWorld('side', u, v, 'iso');
            state.pipings.push({ x: wp ? wp.x : CAKE.cx, y: wp ? wp.y : CAKE.baseY, surface: 'side', u, v, nozzleId: skirtNz, color: i % 2 === 0 ? pc : spc, scale: 0.80, angle: 0 });
          }
        }
        sfx.playChime();
      } else if (stepIdx === 3) {
        const list = Array.isArray(act.decorList) && act.decorList.length > 0
          ? act.decorList : ['straw_whole', 'straw_half', 'blueberry', 'macaron_pink', 'choco_sail', 'mint_leaf'];
        const ty = getCakeTopY();
        const hasTopSketch = Boolean(state.topSketchImg || state.topSketchTitle);
        const layout = hasTopSketch && (act.decorLayout === 'cluster' || act.decorLayout === 'symmetric')
          ? 'crescent' : (act.decorLayout || 'crescent');
        const validList = list.map(dId => DECOR_ITEMS.find(x => x.id === dId)).filter(Boolean);
        const total = validList.length;

        validList.forEach((valid, i) => {
          let u = 0, v = 0, sc = 0.96 + (i % 3) * 0.06, rot = (i % 2 === 0 ? 1 : -1) * 0.14;
          if (layout === 'crescent') {
            const frac = total > 1 ? i / (total - 1) : 0.5;
            const a = -Math.PI * 0.96 + frac * Math.PI * 1.18;
            const r = 0.44 + Math.sin(frac * Math.PI) * 0.16 + ((i % 2) * 0.08 - 0.04);
            u = Math.cos(a) * r; v = Math.sin(a) * r - 0.05;
            sc = 0.92 + Math.sin(frac * Math.PI) * 0.18; rot = (frac - 0.5) * 0.42;
          } else if (layout === 'wreath') {
            if (total >= 5 && i >= total - 2) {
              const ca = (i - (total - 2)) * Math.PI + 0.4;
              u = Math.cos(ca) * 0.16; v = Math.sin(ca) * 0.14 - 0.08; sc = 1.08;
            } else {
              const ringTotal = total >= 5 ? total - 2 : total;
              const a = (i * Math.PI * 2) / Math.max(1, ringTotal) - Math.PI * 0.5;
              const r = 0.58 + (i % 2 === 0 ? 0.04 : -0.05);
              u = Math.cos(a) * r; v = Math.sin(a) * r;
            }
          } else if (layout === 'cluster') {
            const a = i * 2.39996, r = Math.min(0.54, 0.08 + Math.sqrt(i + 0.5) * 0.15);
            u = Math.cos(a) * r; v = Math.sin(a) * r - 0.06; sc = 1.06 - Math.min(0.18, i * 0.02);
          } else if (layout === 'symmetric') {
            const innerCount = total >= 6 ? Math.min(3, Math.floor(total / 3)) : 0;
            const outerCount = total - innerCount;
            if (i < outerCount) {
              const a = (i * Math.PI * 2) / Math.max(1, outerCount) - Math.PI * 0.5;
              u = Math.cos(a) * 0.58; v = Math.sin(a) * 0.58;
            } else {
              const a = ((i - outerCount) * Math.PI * 2) / Math.max(1, innerCount) - Math.PI * 0.3;
              u = Math.cos(a) * 0.22; v = Math.sin(a) * 0.20 - 0.06; sc = 1.06;
            }
          } else {
            const a = (i * Math.PI * 2) / Math.max(1, total) + 0.25, r = 0.26 + ((i % 3) * 0.17);
            u = Math.cos(a) * r; v = Math.sin(a) * r - 0.03;
          }
          state.decorations.push({ uid: Date.now() + i * 17, type: valid.id, x: CAKE.cx + u * CAKE.rx, y: ty + v * CAKE.ry, surface: 'top', u, v, scale: sc, rot });
        });

        const spTypes = Array.isArray(act.sprinkleTypes) && act.sprinkleTypes.length > 0
          ? act.sprinkleTypes.filter(t => t === 'sprinkle_gold' || t === 'sprinkle_pearl' || t === 'sprinkle_sugar') : [];
        const densMap = { none: 0, light: 16, medium: 28, rich: 42 };
        const spCount = densMap[act.sprinkleDensity] !== undefined ? densMap[act.sprinkleDensity] : (spTypes.length > 0 ? 26 : 0);
        const sugarColors = ['#F5C443', '#FFE082', '#EBB041', '#F7A1AE'];
        const goldColors = ['#F9D968', '#E5B83B', '#FFF0A8'];
        if (spTypes.length > 0 && spCount > 0) {
          for (let k = 0; k < spCount; k++) {
            const t = spTypes[k % spTypes.length];
            const a = k * 2.39996 + 0.6, r = 0.16 + ((k * 0.6180339) % 1) * 0.68;
            const u = Math.cos(a) * r, v = Math.sin(a) * r;
            const wp = surfaceToWorld('top', u, v, 'iso');
            state.sprinkles.push({ type: t, x: wp.x, y: wp.y, surface: 'top', u, v, size: t === 'sprinkle_pearl' ? (3.2 + (k % 3) * 0.7) : (3.8 + (k % 3) * 0.8), angle: (k * 1.3) % (Math.PI * 2), color: t === 'sprinkle_gold' ? goldColors[k % goldColors.length] : sugarColors[k % sugarColors.length] });
          }
        }

        // 360° 冰壁侧装饰
        const sideStyle = act.sideStyle || 'garland';
        if (sideStyle !== 'clean') {
          const pc = state.pipingColor || PIPING_COLORS[0];
          const altPc = PIPING_COLORS.find(x => x.id !== pc.id && (x.id === 'p_white' || x.id === 'p_pink' || x.id === 'p_yellow')) || pc;
          const hasBottomSkirt = state.pipings.some(p => p.surface === 'side' && p.v >= 0.88);
          const pushSidePipe = (u, v, nozzleId, colorObj, scale) => {
            const nu = ((u % 1) + 1) % 1;
            const wp = surfaceToWorld('side', nu, v, 'iso');
            state.pipings.push({ x: wp ? wp.x : CAKE.cx, y: wp ? wp.y : CAKE.baseY, surface: 'side', u: nu, v, nozzleId, color: colorObj, scale, angle: 0 });
          };
          const pushSideSprinkle = (u, v, t, k) => {
            const nu = ((u % 1) + 1) % 1;
            const wp = surfaceToWorld('side', nu, v, 'iso');
            state.sprinkles.push({ type: t, x: wp ? wp.x : CAKE.cx, y: wp ? wp.y : CAKE.baseY - 40, surface: 'side', u: nu, v, size: t === 'sprinkle_pearl' ? (3.2 + (k % 3) * 0.75) : (4.0 + (k % 3) * 0.85), angle: (k * 1.4) % (Math.PI * 2), color: t === 'sprinkle_gold' ? goldColors[k % goldColors.length] : sugarColors[k % sugarColors.length] });
          };
          if (!hasBottomSkirt) {
            for (let i = 0; i < 18; i++) pushSidePipe(i / 18, 0.94, 'shell', i % 2 === 0 ? pc : altPc, 0.78);
          }
          const sideSpPool = spTypes.length > 0 ? spTypes : ['sprinkle_gold', 'sprinkle_sugar'];
          if (sideStyle === 'garland') {
            for (let aIdx = 0; aIdx < 8; aIdx++) {
              const u0 = aIdx / 8, uSpan = 1 / 8;
              pushSidePipe(u0, 0.38, 'blossom', pc, 0.76);
              pushSidePipe(u0, 0.50, 'pearl', altPc, 0.42);
              for (let d = 1; d < 7; d++) {
                const frac = d / 7, sag = Math.sin(frac * Math.PI);
                pushSidePipe(u0 + frac * uSpan, 0.38 + sag * 0.24, 'pearl', d % 2 === 0 ? pc : altPc, 0.38 + sag * 0.12);
              }
              pushSidePipe(u0 + uSpan * 0.5, 0.74, 'pearl', pc, 0.46);
              pushSideSprinkle(u0 + uSpan * 0.5, 0.52, sideSpPool[aIdx % sideSpPool.length], aIdx);
              pushSideSprinkle(u0 + uSpan * 0.3, 0.76, sideSpPool[(aIdx + 1) % sideSpPool.length], aIdx + 10);
            }
          } else if (sideStyle === 'blossom_wall') {
            for (let i = 0; i < 10; i++) {
              const u = i / 10;
              pushSidePipe(u, 0.44 + (i % 2) * 0.06, i % 2 === 0 ? 'blossom' : 'rosette', i % 2 === 0 ? pc : altPc, 0.68);
              pushSidePipe(u + 0.05, 0.70 - (i % 2) * 0.05, 'blossom', i % 2 === 0 ? altPc : pc, 0.62);
            }
            for (let k = 0; k < 28; k++) pushSideSprinkle((k * 0.6180339) % 1, 0.34 + ((k * 0.37) % 1) * 0.52, sideSpPool[k % sideSpPool.length], k);
          } else if (sideStyle === 'fruit_wall') {
            const flatCandidates = ['straw_half', 'fig_slice', 'mango_wedge', 'macaron_pink', 'macaron_green', 'meringue'];
            const fromList = validList.map(x => x.id).filter(id => flatCandidates.includes(id));
            const wallPool = fromList.length > 0 ? fromList : ['straw_half', 'macaron_pink', 'meringue'];
            for (let i = 0; i < 10; i++) {
              const u = i / 10, v = 0.58 + (i % 2 === 0 ? -0.04 : 0.06);
              const wp = surfaceToWorld('side', u, v, 'iso');
              state.decorations.push({ uid: Date.now() + 500 + i * 19, type: wallPool[i % wallPool.length], x: wp ? wp.x : CAKE.cx, y: wp ? wp.y : CAKE.baseY - 60, surface: 'side', u, v, scale: 0.72, rot: (i % 2 === 0 ? -0.14 : 0.14) });
              pushSidePipe(u + 0.05, 0.64, 'blossom', pc, 0.56);
            }
            for (let k = 0; k < 22; k++) pushSideSprinkle((k * 0.6180339) % 1, 0.35 + ((k * 0.41) % 1) * 0.5, sideSpPool[k % sideSpPool.length], k);
          } else if (sideStyle === 'starlight') {
            const starPool = ['sprinkle_gold', 'sprinkle_sugar'];
            for (let k = 0; k < 40; k++) {
              const u = k / 40, band = 0.56 + Math.sin(u * Math.PI * 4) * 0.16;
              const v = Math.max(0.32, Math.min(0.86, band + (((k * 0.6180339) % 1) - 0.5) * 0.24));
              pushSideSprinkle(u, v, starPool[k % starPool.length], k);
            }
            for (let i = 0; i < 8; i++) {
              const u = i / 8 + 0.04;
              pushSidePipe(u, 0.56 + Math.sin(u * Math.PI * 4) * 0.15, 'blossom', i % 2 === 0 ? pc : altPc, 0.58);
            }
          }
        }
        sfx.playChime();
      } else if (stepIdx === 4) {
        state.card.theme = Math.max(0, Math.min(3, Number(act.cardTheme) || 0));
        state.card.to = String(act.cardTo || `致：${coop.userName}`).slice(0, 18);
        state.card.body = String(act.cardBody || '愿以此盏凌阴瑞雪，涤尽炎夏万里尘劳。').slice(0, 60);
        state.card.plaqueText = String(act.plaqueText || '清凉无汗').slice(0, 10);
        state.card.sketchTitle = String(act.cardSketchTitle || '').slice(0, 12);
        state.card.hasPlaque = true;
        drawFallbackSignatureCanvas(getSelectedCharName());
        if (act.cardSketchSvg) {
          loadSvgToImage(act.cardSketchSvg, img => {
            const iw = img.naturalWidth || img.width || 320;
            const ih = img.naturalHeight || img.height || 80;
            if (iw <= 0 || ih <= 0) return;
            sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            const pad = 4, ratio = Math.min((sigCanvas.width - pad * 2) / iw, (sigCanvas.height - pad * 2) / ih);
            const dw = iw * ratio, dh = ih * ratio;
            sigCtx.drawImage(img, (sigCanvas.width - dw) * 0.5, (sigCanvas.height - dh) * 0.5, dw, dh);
          }, () => drawFallbackSignatureCanvas(getSelectedCharName()));
        }
        sfx.playChime();
      } else if (stepIdx === 5) {
        if (!state.decorations.some(d => d.type === 'candle')) {
          state.decorations.push({ uid: Date.now() + 99, type: 'candle', x: CAKE.cx, y: getCakeTopY() - 4, surface: 'top', u: 0, v: 0, scale: 1.05, rot: 0 });
        }
        state.candlesLit = true;
        sfx.playChime();
      }
      updateUI();
    }

    function syncCoopBarUI() {
      const m = coop.mode;
      swapBtnEl.style.display = m === 'relay_coop' ? 'inline-block' : 'none';
      swapBtnEl.textContent = coop.userFirst ? '我先手' : 'TA先手';
      if (m === 'char_make_user_eat') {
        actionBtnEl.style.display = 'inline-block';
        actionBtnEl.textContent = coop.busy ? '备冰中…' : '请TA动手';
      } else if (m === 'relay_coop' && isCharTurnInRelay(state.step)) {
        actionBtnEl.style.display = 'inline-block';
        actionBtnEl.textContent = coop.busy ? 'TA操作中…' : '让TA做这步';
      } else {
        actionBtnEl.style.display = 'none';
      }
      posterTasteRowEl.style.display = m === 'char_make_user_eat' ? 'none' : 'flex';
      posterUserFeedbackRowEl.style.display = m === 'char_make_user_eat' ? 'flex' : 'none';
      askCharTasteBtnEl.textContent = `请「${getSelectedCharName()}」品尝点评`;
    }

    async function runCharacterRelayStep(stepIdx) {
      if (coop.busy) return;
      if (!coop.selectedCharId) { showBubble('提示', '未选名士', '请先在上方选择一位传讯名士同行。', false); return; }
      coop.busy = true;
      syncCoopBarUI();
      showBubble(getSelectedCharName(), '思索料材中', '正在打量眼前的凌阴冰案，准备亲手接力这一步…', false);
      try {
        const snap = buildCakeVisualSnapshot();
        const res = await sendHostRpc('WORKSHOP_CAKE_STEP_RELAY_REQUEST', 'WORKSHOP_CAKE_STEP_RELAY_RESPONSE', {
          charId: coop.selectedCharId,
          stepIndex: stepIdx,
          visualSnapshotText: snap.visualSnapshotText,
          cakeSummary: snap.cakeDesc,
          imageDataUrl: captureSmallCakeSnapshot(),
          relayHistory: coop.relayHistory
        });
        applyCharacterStepToCanvas(stepIdx, res.stepAction);
        coop.relayHistory.push(`第${stepIdx + 1}步(${res.charName})：${res.spokenLine}`);
        recordMakingNote(stepIdx, res.charName, res.stepAction, res.spokenLine);
        showBubble(res.charName, res.moodTag || '接力完成', res.spokenLine, false);
      } catch (err) {
        showBubble(getSelectedCharName(), '网络波动', `接力失败：${err.message || err}`, false);
      }
      coop.busy = false;
      syncCoopBarUI();
    }

    function advanceFullMakeStep(jumpToEnd) {
      const sess = coop.fullMakeSession;
      if (!sess) return;
      if (jumpToEnd) {
        for (let s = sess.currentStep + 1; s < 6; s++) {
          state.step = s;
          applyCharacterStepToCanvas(s, sess.stepActions[s]);
          recordMakingNote(s, sess.charName, sess.stepActions[s], sess.stepLines[s] || '专注备冰中…');
        }
        sess.currentStep = 5;
        showBubble(sess.charName, '冰饮呈案', sess.introNote || '端上来了，趁寒气未散尝尝罢。', true, '查看纪念帛画');
        return;
      }
      if (sess.currentStep < 5) {
        const nextS = sess.currentStep + 1;
        sess.currentStep = nextS;
        state.step = nextS;
        applyCharacterStepToCanvas(nextS, sess.stepActions[nextS]);
        recordMakingNote(nextS, sess.charName, sess.stepActions[nextS], sess.stepLines[nextS] || '专注备冰中…');
        if (nextS < 5) {
          showBubble(sess.charName, `第 ${nextS + 1}/6 步`, sess.stepLines[nextS] || '专注备冰中…', true, `看下一步 (${nextS + 2}/6)`);
        } else {
          showBubble(sess.charName, '冰饮呈案', sess.introNote || sess.stepLines[5] || '端上来了，趁寒气未散尝尝罢。', true, '查看纪念帛画');
        }
      } else {
        generateAndShowPoster();
        setPosterViewTab('img');
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML = `<div style="font-weight:800;color:#C83E2B;margin-bottom:4px;">${sess.charName} 亲手奉上冰饮：</div><div>「${sess.introNote || '趁寒气未散尝尝罢。'}」</div>`;
        syncCoopBarUI();
      }
    }

    async function runCharacterFullMake() {
      if (coop.busy) return;
      if (!coop.selectedCharId) { showBubble('提示', '未选名士', '请先在上方选择一位传讯名士。', false); return; }
      coop.busy = true;
      coop.lastReview = null;
      coop.makingNotes = [];
      coop.fullMakeSession = null;
      renderPosterNotesView();
      syncCoopBarUI();
      state = createInitialState();
      sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      updateUI();
      showBubble(getSelectedCharName(), '构思冰饮中', '正在挑选趁手的汉代器皿、凌阴碎冰与西域仙果，请稍候…', false);
      try {
        const res = await sendHostRpc('WORKSHOP_CAKE_FULL_MAKE_REQUEST', 'WORKSHOP_CAKE_FULL_MAKE_RESPONSE', { charId: coop.selectedCharId });
        const plan = res.plan || {};
        const stepLines = res.stepLines || [];
        const stepActions = [
          { vesselId: plan.vesselId, spongeId: plan.spongeId, fillingCreamId: plan.fillingCreamId, fillingFruitId: plan.fillingFruitId, fillingCream2Id: plan.fillingCream2Id, fillingFruit2Id: plan.fillingFruit2Id },
          { frostingColorId: plan.frostingColorId, secondaryFrostingColorId: plan.secondaryFrostingColorId, frostingStyle: plan.frostingStyle, dripGlazeId: plan.dripGlazeId, saucePenId: plan.saucePenId, saucePattern: plan.saucePattern, neatness: plan.neatness, cakeTopSketchTitle: plan.cakeTopSketchTitle, cakeTopSketchSvg: plan.cakeTopSketchSvg },
          { pipingNozzleId: plan.pipingNozzleId, pipingColorId: plan.pipingColorId, secondaryPipingColorId: plan.secondaryPipingColorId, pipingPattern: plan.pipingPattern },
          { decorList: plan.decorList, decorLayout: plan.decorLayout, sideStyle: plan.sideStyle, sprinkleTypes: plan.sprinkleTypes, sprinkleDensity: plan.sprinkleDensity },
          { cardTheme: plan.cardTheme, cardTo: plan.cardTo, cardBody: plan.cardBody, plaqueText: plan.plaqueText, cardSketchTitle: plan.cardSketchTitle, cardSketchSvg: plan.cardSketchSvg },
          {}
        ];
        coop.fullMakeSession = { charName: res.charName, stepActions, stepLines, introNote: res.introNote || stepLines[5] || '端上来了，尝尝合不合胃口。', currentStep: 0 };
        state.step = 0;
        applyCharacterStepToCanvas(0, stepActions[0]);
        recordMakingNote(0, res.charName, stepActions[0], stepLines[0] || '先挑器皿备冰夹心。');
        showBubble(res.charName, '第 1/6 步', stepLines[0] || '先挑器皿备冰夹心。', true, '看下一步 (2/6)');
      } catch (err) {
        showBubble(getSelectedCharName(), '制作中断', `生成失败：${err.message || err}`, false);
      }
      coop.busy = false;
      syncCoopBarUI();
    }

    async function saveCurrentToHistory(posterDataUrl) {
      try {
        const snap = buildCakeVisualSnapshot();
        const id = coop.currentHistoryId || (`han_ice_hist_${Date.now()}`);
        coop.currentHistoryId = id;
        await sendHostRpc('WORKSHOP_CAKE_SAVE_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', {
          id,
          cakeName: snap.cakeName,
          cakeDesc: snap.cakeDesc,
          plaqueText: snap.plaqueText,
          mode: coop.mode,
          charId: coop.selectedCharId,
          charName: getSelectedCharName(),
          posterDataUrl: posterDataUrl || posterImgEl.src,
          makingNotes: coop.makingNotes,
          review: coop.lastReview
        });
      } catch (_) {}
    }

    window.__hanCakeOnPosterReady = (dataUrl) => {
      coop.currentHistoryId = `han_ice_hist_${Date.now()}`;
      renderPosterNotesView();
      syncCoopBarUI();
      saveCurrentToHistory(dataUrl);
    };

    window.__hanCakeOnStepChanged = (targetStep) => {
      syncCoopBarUI();
      if (coop.mode === 'relay_coop' && isCharTurnInRelay(targetStep)) {
        runCharacterRelayStep(targetStep);
      }
    };

    // 绑定共创与生态按钮事件
    document.getElementById('backToWorkshopBtn').onclick = () => window.parent.postMessage({ type: 'WORKSHOP_CAKE_CLOSE' }, '*');
    charSelectEl.onchange = () => { coop.selectedCharId = charSelectEl.value; forwardCharSelectEl.value = coop.selectedCharId; syncCoopBarUI(); };
    modeSelectEl.onchange = () => {
      coop.mode = modeSelectEl.value;
      coop.relayHistory = [];
      hideBubble();
      syncCoopBarUI();
      if (coop.mode === 'relay_coop' && isCharTurnInRelay(state.step)) runCharacterRelayStep(state.step);
    };
    swapBtnEl.onclick = () => {
      coop.userFirst = !coop.userFirst;
      syncCoopBarUI();
      if (coop.mode === 'relay_coop' && isCharTurnInRelay(state.step)) runCharacterRelayStep(state.step);
    };
    actionBtnEl.onclick = () => {
      if (coop.mode === 'char_make_user_eat') runCharacterFullMake();
      else if (coop.mode === 'relay_coop') runCharacterRelayStep(state.step);
    };
    nextStepBtnEl.onclick = () => advanceFullMakeStep(false);
    skipAnimBtnEl.onclick = () => advanceFullMakeStep(true);

    askCharTasteBtnEl.onclick = async () => {
      if (coop.busy) return;
      if (!coop.selectedCharId) { showToast('请先选择一位传讯名士'); return; }
      coop.busy = true;
      askCharTasteBtnEl.textContent = '名士细品中…';
      try {
        const snap = buildCakeVisualSnapshot();
        const res = await sendHostRpc('WORKSHOP_CAKE_TASTE_REQUEST', 'WORKSHOP_CAKE_TASTE_RESPONSE', {
          charId: coop.selectedCharId,
          mode: coop.mode,
          visualSnapshotText: snap.visualSnapshotText,
          cakeSummary: snap.cakeDesc,
          imageDataUrl: captureSmallCakeSnapshot()
        });
        coop.lastReview = res;
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML =
          `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">` +
            `<span style="font-weight:800;color:#C83E2B;">${res.charName} 的品鉴回函</span>` +
            `<span style="font-size:10.5px;padding:1px 7px;border-radius:999px;background:#FCE5CD;color:#784B31;font-weight:700;">${res.reactionTag}</span>` +
          `</div>` +
          `<div style="margin-bottom:4px;color:#5A3822;">${res.comment}</div>` +
          `<div style="font-weight:700;color:#3E2215;">${res.dialogue}</div>`;
        saveCurrentToHistory(posterImgEl.src);
      } catch (err) { showToast(`点评失败：${err.message || err}`); }
      coop.busy = false;
      syncCoopBarUI();
    };

    sendUserFeedbackBtnEl.onclick = async () => {
      const fb = userFeedbackInputEl.value.trim();
      if (!fb || coop.busy) return;
      coop.busy = true;
      sendUserFeedbackBtnEl.textContent = '回应中…';
      try {
        const snap = buildCakeVisualSnapshot();
        const res = await sendHostRpc('WORKSHOP_CAKE_FEEDBACK_REQUEST', 'WORKSHOP_CAKE_FEEDBACK_RESPONSE', {
          charId: coop.selectedCharId,
          userFeedback: fb,
          visualSnapshotText: snap.visualSnapshotText,
          cakeSummary: snap.cakeDesc
        });
        coop.lastReview = res;
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML =
          `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">` +
            `<span style="font-weight:800;color:#C83E2B;">${res.charName} 的回响</span>` +
            `<span style="font-size:10.5px;padding:1px 7px;border-radius:999px;background:#FCE5CD;color:#784B31;font-weight:700;">${res.reactionTag}</span>` +
          `</div>` +
          `<div style="margin-bottom:4px;color:#5A3822;">${res.comment}</div>` +
          `<div style="font-weight:700;color:#3E2215;">${res.dialogue}</div>`;
        userFeedbackInputEl.value = '';
        saveCurrentToHistory(posterImgEl.src);
      } catch (err) { showToast(`回应失败：${err.message || err}`); }
      coop.busy = false;
      sendUserFeedbackBtnEl.textContent = '发给TA';
    };

    saveBackpackBtnEl.onclick = async () => {
      const snap = buildCakeVisualSnapshot();
      try {
        const res = await sendHostRpc('WORKSHOP_CAKE_SAVE_BACKPACK', 'WORKSHOP_CAKE_ACTION_RESULT', {
          cakeName: snap.cakeName,
          cakeDesc: snap.cakeDesc,
          posterDataUrl: posterImgEl.src
        });
        showToast((res && res.message) || '已存入行囊');
      } catch (err) { showToast(`存入失败：${err.message || err}`); }
    };

    openForwardModalBtnEl.onclick = () => {
      if (coop.selectedCharId) forwardCharSelectEl.value = coop.selectedCharId;
      forwardModalEl.classList.add('show');
    };
    document.getElementById('closeForwardModalBtn').onclick = () => forwardModalEl.classList.remove('show');
    confirmForwardBtnEl.onclick = async () => {
      const targetId = forwardCharSelectEl.value;
      const targetObj = coop.characters.find(c => String(c.id) === String(targetId));
      const snap = buildCakeVisualSnapshot();
      confirmForwardBtnEl.textContent = '转发中…';
      try {
        const res = await sendHostRpc('WORKSHOP_CAKE_SEND_CHAT', 'WORKSHOP_CAKE_ACTION_RESULT', {
          charId: targetId,
          charName: targetObj ? targetObj.name : '',
          cakeName: snap.cakeName,
          cakeDesc: snap.cakeDesc,
          plaqueText: snap.plaqueText,
          forwardNote: forwardNoteInputEl.value.trim(),
          posterDataUrl: posterImgEl.src
        });
        forwardModalEl.classList.remove('show');
        forwardNoteInputEl.value = '';
        showToast((res && res.message) || '已转发给传讯好友');
      } catch (err) { showToast(`转发失败：${err.message || err}`); }
      confirmForwardBtnEl.textContent = '确认发送纪念帛画';
    };

    async function openHistoryModal() {
      historyModalEl.classList.add('show');
      historyListEl.innerHTML = '<div style="text-align:center;color:#8C6348;padding:18px;font-size:12.5px;">正在翻阅凌阴消夏手账…</div>';
      try {
        const list = await sendHostRpc('WORKSHOP_CAKE_LIST_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', {});
        if (!Array.isArray(list) || list.length === 0) {
          historyListEl.innerHTML = '<div style="text-align:center;color:#8C6348;padding:22px;font-size:12.5px;">尚无东汉冰饮记录，快与名士共制一盏吧！</div>';
          return;
        }
        const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        historyListEl.innerHTML = list.map(item => {
          const dt = new Date(item.createdAt || Date.now());
          const dStr = `${dt.getMonth() + 1}/${dt.getDate()} ${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
          return `<div class="history-card">` +
            (item.posterDataUrl ? `<img class="history-thumb" src="${item.posterDataUrl}" alt="冰饮缩略图">` : '') +
            `<div style="flex:1;min-width:0;">` +
              `<div style="font-size:13px;font-weight:800;color:#3E2215;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(item.cakeName)}</div>` +
              `<div style="font-size:11px;color:#8C6348;margin:2px 0;">${esc(dStr)}${item.charName ? ' · 同行：' + esc(item.charName) : ''}</div>` +
              `<div style="font-size:11px;color:#6E4930;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(item.cakeDesc)}</div>` +
            `</div>` +
            `<button type="button" class="sel-btn danger" data-del-id="${esc(item.id)}" style="flex-shrink:0;">删</button>` +
          `</div>`;
        }).join('');
        historyListEl.querySelectorAll('[data-del-id]').forEach(btn => {
          btn.onclick = async () => {
            await sendHostRpc('WORKSHOP_CAKE_DELETE_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', { id: btn.dataset.delId });
            openHistoryModal();
          };
        });
      } catch (err) {
        historyListEl.innerHTML = `<div style="text-align:center;color:#C83E2B;padding:18px;font-size:12px;">读取手账失败：${err.message || err}</div>`;
      }
    }

    document.getElementById('openHistoryBtn').onclick = openHistoryModal;
    document.getElementById('closeHistoryModalBtn').onclick = () => historyModalEl.classList.remove('show');

    // 启动时向宿主请求名士同步
    window.parent.postMessage({ type: 'WORKSHOP_CAKE_REQUEST_SYNC', payload: { edition: EDITION } }, '*');
  }

  // 启动东汉冰饮工坊
  initSignaturePad();
  bindEvents();
  initHanCoCreationBridge();
  updateUI();
  requestAnimationFrame(renderLoop);
})();
</script>
</body>
</html>
