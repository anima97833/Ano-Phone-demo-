<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>幽兰佩 · 东汉古法香囊工坊</title>
<style>
  :root {
    --bg-cream: #FFF9EF; --bg-peach: #F9E3C8; --panel-bg: rgba(255, 252, 245, 0.96);
    --brown-dark: #3E2215; --brown-mid: #784B31; --brown-light: #B58867;
    --accent-coral: #C84B31; --accent-coral-dark: #9E331E;
    --accent-gold: #D9A441; --accent-green: #5B8C6B; --border-warm: #E8D2B9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; height: 100dvh; overflow: hidden;
    background: radial-gradient(circle at 50% 32%, #FFFDF9 0%, var(--bg-cream) 54%, var(--bg-peach) 100%);
    font-family: "Songti SC", "STSong", "Noto Serif SC", -apple-system, BlinkMacSystemFont, "PingFang SC", serif;
    color: var(--brown-dark);
  }
  #app { display: flex; flex-direction: column; width: 100%; max-width: 520px; height: 100%; margin: 0 auto; position: relative; box-shadow: 0 0 40px rgba(120, 75, 49, 0.10); }
  .top-header { flex-shrink: 0; padding: 8px 12px 6px; background: rgba(255, 251, 244, 0.90); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-warm); z-index: 20; }
  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .brand-title { font-size: 15.5px; font-weight: 700; color: var(--brown-dark); letter-spacing: 0.8px; display: flex; align-items: center; gap: 6px; }
  .header-actions { display: flex; gap: 6px; align-items: center; }
  .icon-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border-warm); background: #FFF; color: var(--brown-mid); display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .icon-btn:active { transform: scale(0.92); background: var(--bg-cream); }
  .icon-btn:disabled { opacity: 0.38; pointer-events: none; }
  .stepper { display: flex; justify-content: space-between; align-items: center; position: relative; padding: 0 2px; }
  .stepper::before { content: ''; position: absolute; top: 11px; left: 16px; right: 16px; height: 2px; background: var(--border-warm); z-index: 0; }
  .step-item { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; opacity: 0.55; transition: all 0.25s; }
  .step-item.active, .step-item.done { opacity: 1; }
  .step-dot { width: 22px; height: 22px; border-radius: 50%; background: #FFF; border: 2px solid var(--border-warm); display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; color: var(--brown-mid); transition: all 0.25s; }
  .step-item.active .step-dot { background: var(--accent-coral); border-color: var(--accent-coral); color: #FFF; transform: scale(1.12); box-shadow: 0 3px 10px rgba(200, 75, 49, 0.35); }
  .step-item.done .step-dot { background: var(--accent-gold); border-color: var(--accent-gold); color: #FFF; }
  .step-label { font-size: 9.5px; font-weight: 600; color: var(--brown-mid); }
  .step-item.active .step-label { color: var(--accent-coral-dark); font-weight: 700; }

  .prompt-bar { flex-shrink: 0; margin: 6px 12px 0; padding: 7px 11px; background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-warm); border-radius: 13px; box-shadow: 0 4px 12px rgba(120, 75, 49, 0.05); display: flex; flex-direction: column; gap: 4px; z-index: 15; transition: border-color 0.2s; }
  .prompt-bar.warn { border-color: #D94330; background: #FFF6F4; }
  .prompt-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--brown-dark); gap: 8px; }
  .prompt-badge { font-size: 10.5px; padding: 2px 8px; border-radius: 10px; background: #FFF0E5; color: var(--accent-coral-dark); font-weight: 700; white-space: nowrap; }
  .progress-track { width: 100%; height: 5px; background: #F3E5D7; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-gold), var(--accent-coral)); border-radius: 4px; transition: width 0.15s ease-out; }

  .stage-wrap { flex: 1 1 0; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #sachetCanvas { max-width: 100%; max-height: 100%; width: auto; height: auto; aspect-ratio: 720 / 760; touch-action: none; display: block; }
  .stage-floating-tools { position: absolute; top: 8px; right: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 12; align-items: flex-end; max-width: 195px; }
  .stage-camera-controls { position: absolute; top: 8px; left: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 12; }
  .zoom-group { display: flex; align-items: center; background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-warm); border-radius: 18px; box-shadow: 0 4px 10px rgba(120, 75, 49, 0.08); overflow: hidden; }
  .zoom-btn { border: none; background: transparent; color: var(--brown-dark); font-size: 12px; font-weight: 700; padding: 5px 8px; cursor: pointer; min-width: 25px; }
  .zoom-readout { font-size: 10.5px; font-weight: 700; color: var(--brown-mid); padding: 4px 5px; border-left: 1px solid var(--border-warm); border-right: 1px solid var(--border-warm); cursor: pointer; min-width: 42px; text-align: center; }
  .float-pill { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 16px; background: rgba(255, 255, 255, 0.94); border: 1px solid var(--border-warm); box-shadow: 0 4px 10px rgba(120, 75, 49, 0.08); font-size: 11px; font-weight: 700; color: var(--brown-dark); cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .float-pill:active { transform: scale(0.94); }
  .float-pill.active { background: var(--accent-coral); color: #FFF; border-color: var(--accent-coral); }

  /* 配方比例悬浮清单 */
  .recipe-box { background: rgba(255, 252, 246, 0.95); border: 1px solid var(--border-warm); border-radius: 13px; padding: 7px 9px; width: 176px; box-shadow: 0 6px 16px rgba(120, 75, 49, 0.10); display: flex; flex-direction: column; gap: 4px; max-height: 170px; overflow-y: auto; }
  .recipe-title { font-size: 10.5px; font-weight: 800; color: var(--brown-mid); display: flex; justify-content: space-between; }
  .recipe-row { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; background: #FFF; padding: 3px 6px; border-radius: 7px; border: 1px solid #F2E2D0; }
  .recipe-del { border: none; background: #FFF0ED; color: #C83E2B; font-weight: 800; border-radius: 5px; padding: 0 5px; cursor: pointer; font-size: 10px; }

  .selection-toolbar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(255, 252, 246, 0.97); border: 1px solid var(--border-warm); border-radius: 22px; padding: 5px 9px; display: flex; align-items: center; gap: 5px; box-shadow: 0 6px 18px rgba(120, 75, 49, 0.16); z-index: 15; white-space: nowrap; }
  .sel-btn { padding: 4px 8px; border-radius: 12px; border: 1px solid var(--border-warm); background: #FFF; font-size: 10.5px; font-weight: 700; color: var(--brown-dark); cursor: pointer; font-family: inherit; }
  .sel-btn.danger { color: #D94330; border-color: #F5C6BE; background: #FFF5F3; }

  .bottom-dock { flex-shrink: 0; background: var(--panel-bg); border-top: 1px solid var(--border-warm); border-radius: 20px 20px 0 0; padding: 9px 12px calc(9px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 24px rgba(120, 75, 49, 0.08); z-index: 20; display: flex; flex-direction: column; gap: 7px; }
  .sub-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .sub-tabs::-webkit-scrollbar { display: none; }
  .sub-tab { padding: 4px 11px; border-radius: 13px; background: #F5E9DC; color: var(--brown-mid); font-size: 11.5px; font-weight: 600; white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
  .sub-tab.active { background: #FFF; color: var(--accent-coral-dark); border-color: var(--accent-coral); box-shadow: 0 2px 8px rgba(200, 75, 49, 0.14); }
  .options-scroll { display: flex; gap: 9px; overflow-x: auto; padding: 3px 2px; scrollbar-width: none; min-height: 64px; align-items: center; }
  .options-scroll::-webkit-scrollbar { display: none; }
  .option-card { flex: 0 0 auto; min-width: 62px; padding: 6px 8px; border-radius: 13px; background: #FFF; border: 1.8px solid var(--border-warm); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: all 0.2s; }
  .option-card.active { border-color: var(--accent-coral); background: #FFF6F3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(200, 75, 49, 0.15); }
  .swatch-circle { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.92); box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
  .option-thumb { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
  .option-name { font-size: 10.5px; font-weight: 700; color: var(--brown-dark); white-space: nowrap; }

  .dock-footer { display: flex; gap: 9px; align-items: center; }
  .btn-secondary { padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--border-warm); background: #FFF; color: var(--brown-mid); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .btn-primary { flex: 1; padding: 11px 16px; border-radius: 14px; border: none; background: linear-gradient(135deg, #E26B4F 0%, var(--accent-coral) 100%); color: #FFF; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 6px 16px rgba(200, 75, 49, 0.28); display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
  .btn-primary:active { transform: scale(0.98); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(62, 34, 21, 0.48); backdrop-filter: blur(4px); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.show { display: flex; }
  .card-modal { width: 100%; max-width: 420px; background: #FFFDF9; border-radius: 22px; border: 2px solid var(--border-warm); padding: 15px; box-shadow: 0 20px 50px rgba(62, 34, 21, 0.28); display: flex; flex-direction: column; gap: 10px; max-height: 92dvh; overflow-y: auto; }
  .card-preview-box { border-radius: 14px; padding: 13px; border: 2px solid #D9B68C; background: #FFF9F0; }
  .card-input-group { display: flex; flex-direction: column; gap: 7px; }
  .card-input, .card-textarea { width: 100%; border: 1px solid rgba(120, 75, 49, 0.25); background: rgba(255, 255, 255, 0.85); border-radius: 9px; padding: 7px 10px; font-size: 12.5px; color: var(--brown-dark); font-family: inherit; outline: none; }
  .card-textarea { resize: none; height: 58px; line-height: 1.45; }
  .preset-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .preset-chips::-webkit-scrollbar { display: none; }
  .preset-chip { padding: 4px 9px; border-radius: 11px; background: #F5E9DC; color: var(--brown-mid); font-size: 10.5px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .sig-pad-wrap { margin-top: 4px; border: 1px dashed var(--brown-light); border-radius: 9px; background: rgba(255, 255, 255, 0.72); position: relative; height: 72px; overflow: hidden; }
  #sigCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
  .sig-hint { position: absolute; top: 5px; left: 8px; font-size: 10px; color: var(--brown-light); pointer-events: none; }
  .sig-clear { position: absolute; top: 4px; right: 6px; font-size: 10px; padding: 2px 7px; border-radius: 7px; background: #FFF; border: 1px solid var(--border-warm); color: var(--brown-mid); cursor: pointer; }
  .poster-img { width: 100%; border-radius: 14px; border: 2px solid var(--border-warm); box-shadow: 0 8px 25px rgba(62, 34, 21, 0.15); }
  .hidden { display: none !important; }

  .coop-bar { display: flex; align-items: center; gap: 5px; margin-top: 5px; overflow-x: auto; scrollbar-width: none; }
  .coop-bar::-webkit-scrollbar { display: none; }
  .coop-select { flex: 0 0 auto; max-width: 112px; padding: 3px 7px; border-radius: 9px; border: 1px solid var(--border-warm); background: #FFFDF8; color: var(--brown-dark); font-size: 11px; font-weight: 700; font-family: inherit; }
  .coop-btn { flex: 0 0 auto; padding: 3px 9px; border-radius: 9px; border: 1px solid #DF9E7B; background: linear-gradient(135deg, #FFF6EB 0%, #FCE5CD 100%); color: #8A3722; font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .coop-btn.primary { background: linear-gradient(135deg, #E26A4D 0%, #C83E2B 100%); color: #FFF; border-color: #C83E2B; }
  .coop-speaker-pill { position: absolute; left: 8px; bottom: 8px; z-index: 18; display: none; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; border: 1px solid #D99B78; background: rgba(255, 250, 242, 0.94); color: #6B3A24; font-size: 11px; font-weight: 700; cursor: pointer; }
  .coop-speaker-pill.show { display: inline-flex; }
  .coop-bubble { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 19; background: rgba(255, 251, 244, 0.97); border: 1.5px solid #D99B78; border-radius: 15px; padding: 9px 11px; box-shadow: 0 10px 26px rgba(78, 42, 22, 0.22); display: none; flex-direction: column; gap: 5px; }
  .coop-bubble.show { display: flex; }
  .history-list { width: 100%; display: flex; flex-direction: column; gap: 9px; max-height: 60dvh; overflow-y: auto; }
  .history-card { display: flex; gap: 9px; align-items: center; background: #FFF9F0; border: 1.5px solid var(--border-warm); border-radius: 13px; padding: 8px; }
  .history-thumb { width: 54px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-warm); flex-shrink: 0; }
  .poster-view-tabs { display: none; width: 100%; background: #F5E8D8; border-radius: 11px; padding: 3px; gap: 4px; }
  .poster-view-tabs.show { display: flex; }
  .poster-tab-btn { flex: 1; border: none; border-radius: 8px; padding: 6px 8px; background: transparent; color: var(--brown-mid); font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .poster-tab-btn.active { background: #FFFDF9; color: var(--accent-coral-dark); box-shadow: 0 2px 6px rgba(120, 75, 49, 0.12); }
  .poster-notes-page { display: none; width: 100%; max-height: 340px; overflow-y: auto; background: #FFF9F0; border: 1.5px solid var(--border-warm); border-radius: 13px; padding: 9px; flex-direction: column; gap: 8px; }
  .poster-notes-page.show { display: flex; }
  .poster-note-item { background: #FFFDF9; border: 1px solid #EAD6C0; border-radius: 10px; padding: 8px 10px; }

  @media (max-height: 740px) {
    .top-header { padding: 5px 10px 4px; }
    .header-row { margin-bottom: 3px; }
    .coop-bar { margin-top: 3px; }
    .prompt-bar { margin: 4px 10px 0; padding: 5px 9px; gap: 3px; }
    .prompt-top { font-size: 11px; }
    .bottom-dock { padding: 7px 10px calc(7px + env(safe-area-inset-bottom)); gap: 5px; border-radius: 16px 16px 0 0; }
    .options-scroll { min-height: 52px; padding: 2px; gap: 7px; }
    .option-card { min-width: 56px; padding: 4px 6px; gap: 3px; }
    .swatch-circle { width: 24px; height: 24px; }
    .option-thumb { width: 30px; height: 30px; }
    .btn-primary, .btn-secondary { padding: 8px 12px; font-size: 12.5px; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="top-header">
    <div class="header-row">
      <div class="brand-title">
        <button class="icon-btn" id="backToWorkshopBtn" title="返回择坊" style="width:26px;height:26px;font-size:13px;font-weight:800;">‹</button>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 3V6M9 6H15L17 10C18 14 16 19 12 19C8 19 6 14 7 10L9 6Z" fill="#D9889A" stroke="#3E2215" stroke-width="1.6"/>
          <path d="M12 19V22M10 22H14" stroke="#D9A441" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>幽兰佩 · 东汉香囊工坊</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="undoBtn" title="撤销 (Undo)" disabled>↶</button>
        <button class="icon-btn" id="redoBtn" title="重做 (Redo)" disabled>↷</button>
        <button class="icon-btn" id="openHistoryBtn" title="香囊集录" style="width:auto;padding:0 8px;border-radius:13px;font-size:10.5px;font-weight:700;">香囊录</button>
        <button class="icon-btn" id="soundToggleBtn" title="雅乐开关">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </button>
        <button class="icon-btn" id="resetGameBtn" title="重新制作">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        </button>
      </div>
    </div>

    <div class="coop-bar" id="coopBar">
      <select class="coop-select" id="coopCharSelect"><option value="">同步名士中…</option></select>
      <select class="coop-select" id="coopModeSelect" style="max-width:116px;">
        <option value="user_make_char_eat">我制·TA佩</option>
        <option value="relay_coop">你一步·TA一步</option>
        <option value="char_make_user_eat">TA制·赠我</option>
      </select>
      <button class="coop-btn" id="coopSwapTurnBtn" style="display:none;">我先手</button>
      <button class="coop-btn primary" id="coopActionBtn" style="display:none;">请TA制囊</button>
    </div>

    <div class="stepper" id="stepperBar">
      <div class="step-item active" data-step="0"><div class="step-dot">一</div><span class="step-label">择囊选绢</span></div>
      <div class="step-item" data-step="1"><div class="step-dot">二</div><span class="step-label">裁绢定形</span></div>
      <div class="step-item" data-step="2"><div class="step-dot">三</div><span class="step-label">调香填囊</span></div>
      <div class="step-item" data-step="3"><div class="step-dot">四</div><span class="step-label">缝合囊口</span></div>
      <div class="step-item" data-step="4"><div class="step-dot">五</div><span class="step-label">刺绣绘纹</span></div>
      <div class="step-item" data-step="5"><div class="step-dot">六</div><span class="step-label">系绳缀饰</span></div>
      <div class="step-item" data-step="6"><div class="step-dot">七</div><span class="step-label">题名封礼</span></div>
    </div>
  </header>

  <div class="prompt-bar" id="promptBar">
    <div class="prompt-top">
      <span id="promptText">选定香囊形制、汉代丝帛材质、传统底色与织锦底纹</span>
      <span class="prompt-badge" id="promptBadge">步骤 1/7</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="stage-wrap">
    <canvas id="sachetCanvas" width="720" height="760"></canvas>

    <div class="stage-camera-controls">
      <button class="float-pill" id="xrayModeBtn" title="透视查看香囊内部香料">
        <span id="xrayModeLabel">内腔透视: 关</span>
      </button>
      <div class="zoom-group">
        <button class="zoom-btn" id="zoomOutBtn">−</button>
        <span class="zoom-readout" id="zoomResetBtn">100%</span>
        <button class="zoom-btn" id="zoomInBtn">+</button>
      </div>
    </div>

    <div class="stage-floating-tools" id="floatingTools"></div>

    <div class="selection-toolbar hidden" id="selectionToolbar">
      <button class="sel-btn" id="btnScaleUp">放大</button>
      <button class="sel-btn" id="btnScaleDown">缩小</button>
      <button class="sel-btn" id="btnRotate">旋转</button>
      <button class="sel-btn" id="btnLayerUp">上移层</button>
      <button class="sel-btn" id="btnLayerDown">下移层</button>
      <button class="sel-btn" id="btnLockMotif">锁定</button>
      <button class="sel-btn danger" id="btnDeleteMotif">移除</button>
    </div>

    <button class="coop-speaker-pill" id="coopSpeakerPill" type="button">
      <span id="coopPillName">名士</span><span style="font-size:10px;opacity:0.75;">▸</span>
    </button>

    <div class="coop-bubble" id="coopBubble">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:12px;font-weight:800;color:#C83E2B;" id="coopBubbleName">名士</span>
          <span style="font-size:10px;padding:1px 7px;border-radius:999px;background:#FCE5CD;color:#784B31;font-weight:700;" id="coopBubbleTag">制香中</span>
        </div>
        <button type="button" id="coopBubbleCollapseBtn" style="border:none;background:transparent;color:#8C6348;font-size:11px;font-weight:700;cursor:pointer;">收起 ▾</button>
      </div>
      <div id="coopBubbleText" style="font-size:12px;line-height:1.55;color:#3E2215;"></div>
      <div id="coopBubbleActions" style="display:none;gap:8px;margin-top:2px;">
        <button type="button" class="coop-btn primary" id="coopNextStepBtn" style="flex:1;padding:5px 10px;">看下一步</button>
        <button type="button" class="coop-btn" id="coopSkipAnimBtn" style="padding:5px 10px;">直达成品</button>
      </div>
    </div>
  </div>

  <div class="bottom-dock">

   * ============================================================================ */
  class SoundEngine {
    constructor() { this.ctx = null; this.enabled = true; this.lastTick = 0; }
    init() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    playPop(freq = 560) {
      if (!this.enabled) return; this.init(); if (!this.ctx) return;
      const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now); osc.frequency.exponentialRampToValueAtTime(freq * 1.35, now + 0.08);
      g.gain.setValueAtTime(0.11, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(g); g.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.09);
    }
    playSnip() {
      if (!this.enabled) return;
      const ms = performance.now(); if (ms - this.lastTick < 75) return; this.lastTick = ms;
      this.init(); if (!this.ctx) return;
      const now = this.ctx.currentTime, dur = 0.055, len = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.35));
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const flt = this.ctx.createBiquadFilter(); flt.type = 'highpass'; flt.frequency.setValueAtTime(1400, now);
      const g = this.ctx.createGain(); g.gain.setValueAtTime(0.08, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      src.connect(flt); flt.connect(g); g.connect(this.ctx.destination); src.start(now); src.stop(now + dur);
    }
    playChime() {
      if (!this.enabled) return; this.init(); if (!this.ctx) return;
      [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((n, i) => {
        const now = this.ctx.currentTime + i * 0.07, osc = this.ctx.createOscillator(), g = this.ctx.createGain();

        g.gain.setValueAtTime(0.09, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
        osc.connect(g); g.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.38);
      });
    }

    1: { title: '裁绢定形', tabs: [{ id: 'tool', name: '裁剪工具' }, { id: 'outline', name: '囊体形状' }, { id: 'opening', name: '囊口样式' }] },
    2: { title: '调香填囊', tabs: [{ id: 'flower', name: '花材' }, { id: 'herb', name: '香草' }, { id: 'spice', name: '香料' }, { id: 'filler', name: '辅材' }] },
    3: { title: '缝合囊口', tabs: [{ id: 'needle', name: '针具' }, { id: 'thread', name: '丝线颜色' }, { id: 'stitch', name: '缝合针法' }] },
    4: { title: '刺绣绘纹', tabs: [{ id: 'm_flower', name: '花卉纹样' }, { id: 'm_ausp', name: '吉祥纹样' }, { id: 'm_text', name: '吉语文字' }, { id: 'e_thread', name: '绣线颜色' }, { id: 'e_tool', name: '刺绣针法' }] },
    5: { title: '系绳缀饰', tabs: [{ id: 'cord', name: '顶部系绳' }, { id: 'tassel', name: '垂穗流苏' }, { id: 'bead', name: '玉珠佩饰' }, { id: 'knot', name: '汉风结饰' }] },
    6: { title: '题名封礼', tabs: [{ id: 'package', name: '礼盒包装' }, { id: 'seal', name: '工坊印章' }, { id: 'message', name: '题写祝词' }] }
  };

  /* ============================================================================
   * 3. IndexedDB 串行防抖持久化引擎 (EasternHanSachetDB)
   * ============================================================================ */
  class SachetStorageDB {
    constructor() {
      this.dbName = 'EasternHanSachetDB';
      this.dbVersion = 1;
      this.db = null;
      this.saveTimer = null;
      this.isWriting = false;
      this.pending = null;
    }
    async init() {
      return new Promise((resolve) => {
        if (!window.indexedDB) { resolve(false); return; }
        try {
          const req = indexedDB.open(this.dbName, this.dbVersion);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            ['projects', 'recipes', 'assets', 'gallery'].forEach(st => {
              if (!db.objectStoreNames.contains(st)) db.createObjectStore(st, { keyPath: 'id' });
            });
          };
          req.onsuccess = (e) => { this.db = e.target.result; resolve(true); };
          req.onerror = () => resolve(false);
        } catch (_) { resolve(false); }
      });
    }
    scheduleSave(serializableState) {
      if (this.saveTimer) clearTimeout(this.saveTimer);
      this.saveTimer = setTimeout(() => {
        this.writeRecord('projects', { id: 'current_draft', version: 1, updatedAt: Date.now(), data: serializableState });
      }, 380);
    }
    async writeRecord(storeName, record) {
      if (!this.db) return;
      if (this.isWriting) { this.pending = { storeName, record }; return; }
      this.isWriting = true;
      try {
        await new Promise((resolve, reject) => {
          const tx = this.db.transaction([storeName], 'readwrite');
          tx.objectStore(storeName).put(record);
          tx.oncomplete = () => resolve();
          tx.onerror = (e) => reject(e);
        });
      } catch (_) {}
      this.isWriting = false;
      if (this.pending) { const nxt = this.pending; this.pending = null; this.writeRecord(nxt.storeName, nxt.record); }
    }
    async loadDraft() {
      if (!this.db) return null;
      return new Promise((resolve) => {
        try {
          const tx = this.db.transaction(['projects'], 'readonly');
          const req = tx.objectStore('projects').get('current_draft');
          req.onsuccess = () => resolve(req.result ? req.result.data : null);
          req.onerror = () => resolve(null);
        } catch (_) { resolve(null); }
      });
    }
    async loadGallery() {
      if (!this.db) return [];
      return new Promise((resolve) => {
        try {
          const tx = this.db.transaction(['gallery'], 'readonly');
          const req = tx.objectStore('gallery').getAll();
          req.onsuccess = () => {
            const list = Array.isArray(req.result) ? req.result : [];
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            resolve(list);
          };
          req.onerror = () => resolve([]);
        } catch (_) { resolve([]); }
      });
    }
  }
  const storageDB = new SachetStorageDB();

  /* ============================================================================
   * 4. 全局状态树 (state)、步骤验证 (validateStep) 与 30 步 Undo/Redo 历史栈
   * ============================================================================ */
  const CW = 720, CH = 760, CX = 360, CY = 400;
  let state = createInitialState();
  const undoStack = [], redoStack = [];
  const runtimeParticles = []; // 布屑、落香动态粒子

  function createInitialState() {
    return {
      version: 1,
      step: 0,
      subTab: 'shape',
      xrayMode: false,
      fabric: { shape: 'pouch', material: 'silk', color: '#D9889A', pattern: 'cloud', opening: 'drawstring' },
      cutting: { tool: 'scissors', checkpoints: new Array(36).fill(false), progress: 0, foldProgress: 0, completed: false },
      filling: { activeHerbId: 'osmanthus', ingredients: [], particles: [], totalAmount: 0, capacity: 100 },
      sewing: { needle: 'fine', threadColor: '#C83E3B', stitchType: 'running', checkpoints: new Array(24).fill(false), progress: 0, cinchProgress: 0, completed: false },
      embroidery: { toolMode: 'motif', stitchStyle: 'satin', activeMotifId: 'm_plum', threadColor: '#E0AD45', motifs: [], freehandStrokes: [], selectedUid: null },
      accessories: {
        cord: CORDS[0],
        tassel: null,
        knot: null,
        beads: []
      },
      gift: { name: '幽兰长乐囊', recipient: '致：洛阳知音', message: '纫秋兰以为佩，寄芳馨于君侧，愿岁岁常欢愉，出入皆平安。', box: 'lacquer', seal: 'red_relief', sealText: '长乐未央', completed: false },
      stepStatus: { 0: true, 1: false, 2: false, 3: false, 4: false, 5: false, 6: false },
      camera: { zoom: 1.0, panX: 0, panY: 0, targetZoom: 1.0, targetPanX: 0, targetPanY: 0 },
      pointer: { down: false, x: 360, y: 400, vx: 0, vy: 0 }
    };
  }

  function getSerializableState() {
    const copy = JSON.parse(JSON.stringify(state));
    delete copy.pointer;
    delete copy.camera;
    return copy;
  }

  function pushHistory() {
    undoStack.push(getSerializableState());
    if (undoStack.length > 30) undoStack.shift();
    redoStack.length = 0;
    syncHistoryBtns();
    storageDB.scheduleSave(getSerializableState());
  }

  function restoreSerializedState(snap) {
    if (!snap) return;
    const cam = state.camera, ptr = state.pointer;
    state = Object.assign(createInitialState(), snap);
    state.camera = cam;
    state.pointer = ptr;
    markAllLayersDirty();
    updateUI();
    storageDB.scheduleSave(getSerializableState());
  }

  function undoAction() {
    if (undoStack.length === 0) return;
    redoStack.push(getSerializableState());
    const prev = undoStack.pop();
    restoreSerializedState(prev);
    syncHistoryBtns();
    sfx.playPop(420);
  }

  function redoAction() {
    if (redoStack.length === 0) return;
    undoStack.push(getSerializableState());
    const nxt = redoStack.pop();
    restoreSerializedState(nxt);
    syncHistoryBtns();
    sfx.playPop(540);
  }

  function syncHistoryBtns() {
    document.getElementById('undoBtn').disabled = undoStack.length === 0;
    document.getElementById('redoBtn').disabled = redoStack.length === 0;
  }

  function validateStep(stepIdx) {
    switch (stepIdx) {
      case 0: return Boolean(state.fabric.shape && state.fabric.material && state.fabric.color);
      case 1: return Boolean(state.cutting.completed && state.fabric.opening);
      case 2: return state.filling.ingredients.length >= 2 && state.filling.totalAmount >= 20;
      case 3: return state.sewing.progress >= 90 || state.sewing.completed;
      case 4: return state.embroidery.motifs.length > 0 || state.embroidery.freehandStrokes.length > 0;
      case 5: return Boolean(state.accessories.cord && (state.accessories.tassel || state.accessories.beads.length > 0 || state.accessories.knot));
      case 6: return state.gift.name.trim().length > 0;
      default: return false;
    }
  }

  function getStepIncompleteReason(stepIdx) {
    switch (stepIdx) {
      case 1: return `请先按住剪刀沿虚线完成裁绢（当前 ${state.cutting.progress}%，或点击右上角「自动裁剪」）`;
      case 2: return `请至少添入 2 种香料且总份量达 20 份（当前 ${state.filling.ingredients.length} 种 / ${state.filling.totalAmount} 份）`;
      case 3: return `请拖动针线沿囊口虚线缝合至 90% 以上（当前 ${state.sewing.progress}%，或点击「自动缝合」）`;
      case 4: return '请至少在香囊表面放置 1 枚刺绣纹样，或使用自由刺绣笔绣出纹路';
      case 5: return '请至少选择 1 条顶部系绳，并搭配流苏、玉珠或结饰中的任意一项';
      case 6: return '请为香囊题写雅名并确认封礼';
      default: return '请先完成当前步骤制作';
    }
  }

  /* ============================================================================
   * 5. 香囊六大形制几何路径与标准化表面坐标 (u, v) 双向映射
   * ============================================================================ */
  function getShapeDimensions(shapeId) {
    return SACHET_SHAPES.find(s => s.id === shapeId) || SACHET_SHAPES[0];
  }

  // 根据形制与纵向坐标 v ∈ [-1, 1] 计算香囊水平半宽 W(v)，用于 (u, v) 跨形制自适应映射
  function getSachetHalfWidthAtV(shapeId, v) {
    const dim = getShapeDimensions(shapeId);
    const av = Math.min(1, Math.abs(v));
    if (shapeId === 'round' || shapeId === 'petal') {
      return dim.rx * Math.sqrt(Math.max(0.15, 1 - av * av * 0.85));
    }
    if (shapeId === 'gourd') {
      // 上窄腰收下圆腹
      const waist = Math.exp(-Math.pow((v + 0.15) * 3.5, 2)) * 0.42;
      const topNarrow = v < 0 ? 0.72 : 1.0;
      return dim.rx * topNarrow * (1 - waist) * Math.sqrt(Math.max(0.18, 1 - av * av * 0.82));
    }
    if (shapeId === 'fangsheng') {
      return dim.rx * Math.max(0.22, 1.05 - av * 0.85);
    }
    if (shapeId === 'ruyi') {
      const lobe = v < 0.2 ? 1.05 : 0.75;
      return dim.rx * lobe * Math.sqrt(Math.max(0.2, 1 - av * av * 0.8));
    }
    // 默认荷包形 (pouch)：束颈丰腹
    const neckPinch = v < -0.55 ? 0.58 : (v < -0.25 ? 0.72 : 1.0);
    return dim.rx * neckPinch * Math.sqrt(Math.max(0.22, 1 - Math.pow(av * 0.92, 2)));
  }

  function uvToSachetWorld(u, v, shapeId = state.fabric.shape) {
    const dim = getShapeDimensions(shapeId);
    const hw = getSachetHalfWidthAtV(shapeId, v);
    return { x: CX + u * hw, y: CY + v * dim.ry };
  }

  function worldToSachetUV(wx, wy, shapeId = state.fabric.shape) {
    const dim = getShapeDimensions(shapeId);
    const v = Math.max(-0.92, Math.min(0.92, (wy - CY) / dim.ry));
    const hw = Math.max(20, getSachetHalfWidthAtV(shapeId, v));
    const u = Math.max(-0.92, Math.min(0.92, (wx - CX) / hw));
    return { u, v };
  }

  // 绘制香囊主体闭合矢量路径（供裁剪、缝合、底纹及刺绣 clip 共用）
  function traceSachetContour(ctx, shapeId = state.fabric.shape, scale = 1.0) {
    const dim = getShapeDimensions(shapeId);
    const rx = dim.rx * scale, ry = dim.ry * scale;
    ctx.save();
    ctx.beginPath();

    if (shapeId === 'round') {
      ctx.arc(CX, CY, rx, 0, Math.PI * 2);
    } else if (shapeId === 'fangsheng') {
      // 汉代同心方胜菱形叠加轮廓
      ctx.moveTo(CX, CY - ry);
      ctx.lineTo(CX + rx, CY);
      ctx.lineTo(CX, CY + ry);
      ctx.lineTo(CX - rx, CY);
      ctx.closePath();
    } else if (shapeId === 'gourd') {
      // 福禄双腹葫芦形
      ctx.moveTo(CX - rx * 0.28, CY - ry);
      ctx.lineTo(CX + rx * 0.28, CY - ry);
      ctx.bezierCurveTo(CX + rx * 0.85, CY - ry * 0.75, CX + rx * 0.75, CY - ry * 0.22, CX + rx * 0.42, CY - ry * 0.12);
      ctx.bezierCurveTo(CX + rx * 1.12, CY + ry * 0.10, CX + rx * 1.08, CY + ry * 0.95, CX, CY + ry);
      ctx.bezierCurveTo(CX - rx * 1.08, CY + ry * 0.95, CX - rx * 1.12, CY + ry * 0.10, CX - rx * 0.42, CY - ry * 0.12);
      ctx.bezierCurveTo(CX - rx * 0.75, CY - ry * 0.22, CX - rx * 0.85, CY - ry * 0.75, CX - rx * 0.28, CY - ry);
      ctx.closePath();
    } else if (shapeId === 'ruyi') {
      // 祥云如意形
      ctx.moveTo(CX, CY - ry * 0.88);
      ctx.bezierCurveTo(CX + rx * 0.75, CY - ry * 1.05, CX + rx * 1.15, CY - ry * 0.20, CX + rx * 0.75, CY + ry * 0.35);
      ctx.bezierCurveTo(CX + rx * 0.45, CY + ry * 0.75, CX + rx * 0.25, CY + ry, CX, CY + ry);
      ctx.bezierCurveTo(CX - rx * 0.25, CY + ry, CX - rx * 0.45, CY + ry * 0.75, CX - rx * 0.75, CY + ry * 0.35);
      ctx.bezierCurveTo(CX - rx * 1.15, CY - ry * 0.20, CX - rx * 0.75, CY - ry * 1.05, CX, CY - ry * 0.88);
      ctx.closePath();
    } else if (shapeId === 'petal') {
      // 六瓣海棠梅花形
      const petals = 6;
      for (let i = 0; i <= 120; i++) {
        const a = (i / 120) * Math.PI * 2;
        const r = rx * (0.86 + 0.14 * Math.abs(Math.cos(a * petals * 0.5)));
        const px = CX + Math.cos(a) * r, py = CY + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    } else {
      // 经典汉代束口荷包形 (pouch)
      const cinch = state.step >= 3 ? (0.46 - state.sewing.cinchProgress * 0.14) : 0.52;
      const flare = state.fabric.opening === 'folded' ? 0.65 : 0.54;
      ctx.moveTo(CX - rx * flare, CY - ry);
      ctx.quadraticCurveTo(CX, CY - ry * 0.92, CX + rx * flare, CY - ry);
      ctx.quadraticCurveTo(CX + rx * (cinch + 0.08), CY - ry * 0.72, CX + rx * cinch, CY - ry * 0.58);
      ctx.bezierCurveTo(CX + rx * 1.12, CY - ry * 0.18, CX + rx * 1.06, CY + ry * 0.92, CX, CY + ry);
      ctx.bezierCurveTo(CX - rx * 1.06, CY + ry * 0.92, CX - rx * 1.12, CY - ry * 0.18, CX - rx * cinch, CY - ry * 0.58);
      ctx.quadraticCurveTo(CX - rx * (cinch + 0.08), CY - ry * 0.72, CX - rx * flare, CY - ry);
      ctx.closePath();
    }
    ctx.restore();
  }

  // 生成沿香囊轮廓均匀分布的 N 个裁剪检测节点
  function getContourSamplePoints(shapeId, count = 36) {
    const dim = getShapeDimensions(shapeId);
    const rx = dim.rx, ry = dim.ry;
    const pts = [];
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 - Math.PI * 0.5;
      let rX = rx, rY = ry;
      if (shapeId === 'petal') {
        const m = 0.86 + 0.14 * Math.abs(Math.cos(a * 3));
        rX *= m; rY *= m;
      } else if (shapeId === 'gourd') {
        const v = Math.sin(a);
        rX = getSachetHalfWidthAtV('gourd', v);
      } else if (shapeId === 'pouch') {
        const v = Math.sin(a);
        rX = getSachetHalfWidthAtV('pouch', v);
      } else if (shapeId === 'fangsheng') {
        const denom = Math.abs(Math.cos(a)) + Math.abs(Math.sin(a));
        rX = rx / denom; rY = ry / denom;
      }
      pts.push({ x: CX + Math.cos(a) * rX, y: CY + Math.sin(a) * rY, angle: a });
    }
    return pts;
  }

  // 生成囊口缝合路径的 24 个针孔节点（区分束颈型香囊 vs 边缘锁边型香囊，绝不横劈囊腹）
  function getSewingSamplePoints(shapeId = state.fabric.shape, count = 24) {
    const dim = getShapeDimensions(shapeId);
    const pts = [];
    if (shapeId === 'pouch' || shapeId === 'gourd') {
      // 荷包形/葫芦形：贴合真实收窄的囊颈束口
      const neckV = shapeId === 'gourd' ? -0.34 : -0.60;
      const neckY = CY + dim.ry * neckV;
      const neckW = getSachetHalfWidthAtV(shapeId, neckV) * 0.88;
      for (let i = 0; i < count; i++) {
        const t = i / (count - 1);
        const x = (CX - neckW) + t * (neckW * 2);
        const y = neckY + Math.sin(t * Math.PI) * 10;
        pts.push({ x, y });
      }
      return pts;
    }

    // 圆形/花瓣形/方胜形/如意形：沿香囊上半外缘内缩 9px 的真实封口缝边弧线
    const startAng = -Math.PI * 0.88;
    const endAng = -Math.PI * 0.12;
    for (let i = 0; i < count; i++) {
      const t = i / (count - 1);
      const a = startAng + t * (endAng - startAng);
      let rX = dim.rx - 9, rY = dim.ry - 9;
      if (shapeId === 'petal') {
        const m = 0.86 + 0.14 * Math.abs(Math.cos(a * 3));
        rX = dim.rx * m - 8;
        rY = dim.ry * m - 8;
      } else if (shapeId === 'fangsheng') {
        const denom = Math.abs(Math.cos(a)) + Math.abs(Math.sin(a));
        rX = (dim.rx / denom) - 9;
        rY = (dim.ry / denom) - 9;
      } else if (shapeId === 'ruyi') {
        rX = dim.rx * 0.86;
        rY = dim.ry * 0.84;
      }
      pts.push({ x: CX + Math.cos(a) * rX, y: CY + Math.sin(a) * rY });
    }
    return pts;
  }

  /* ============================================================================
   * 6. 七层离屏 Canvas 脏标记合成引擎 (Layer 00 ~ Layer 06)
   * ============================================================================ */
  const mainCanvas = document.getElementById('sachetCanvas');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  mainCanvas.width = CW * dpr;
  mainCanvas.height = CH * dpr;
  const mainCtx = mainCanvas.getContext('2d');

  const LAYER_NAMES = ['bg', 'fabric', 'filling', 'sewing', 'embroidery', 'lighting', 'accessories', 'effects'];
  const layers = {};
  const layerDirty = {};

  LAYER_NAMES.forEach(name => {
    const c = document.createElement('canvas');
    c.width = CW * dpr;
    c.height = CH * dpr;
    const lctx = c.getContext('2d');
    lctx.scale(dpr, dpr);
    layers[name] = { canvas: c, ctx: lctx };
    layerDirty[name] = true;
  });

  function markDirty(...names) {
    if (names.length === 0) LAYER_NAMES.forEach(n => layerDirty[n] = true);
    else names.forEach(n => {
      if (layerDirty[n] !== undefined) layerDirty[n] = true;
      if (n === 'fabric' || n === 'filling') layerDirty.lighting = true;
    });
  }
  function markAllLayersDirty() { markDirty(); }

  // Layer 00: 东汉制香木案背景 / 第7步礼盒陈列台
  function renderLayer00_Background(ctx) {
    ctx.clearRect(0, 0, CW, CH);
    ctx.save();
    if (state.step === 6) {
      // STEP 07: 古代礼盒或丝帛陈列台
      const box = GIFT_BOXES.find(b => b.id === state.gift.box) || GIFT_BOXES[0];
      ctx.fillStyle = 'rgba(62, 34, 21, 0.22)';
      ctx.beginPath();
      ctx.roundRect(108, 128, 504, 520, 26);
      ctx.fill();

      ctx.fillStyle = box.bg;
      ctx.strokeStyle = box.border;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(100, 118, 520, 520, 22);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = box.inner;
      ctx.strokeStyle = box.border;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(122, 140, 476, 476, 16);
      ctx.fill();
      ctx.stroke();

      // 礼盒左上角雅名题签
      const isDarkBox = box.id === 'lacquer';
      ctx.fillStyle = isDarkBox ? 'rgba(247, 215, 116, 0.88)' : 'rgba(120, 75, 49, 0.85)';
      ctx.font = 'bold 16px "Songti SC", serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`《${state.gift.name || '幽兰长乐囊'}》`, 144, 158);

      // 礼盒右下角实时呈现「东汉工坊印章」（朱文方印 = 白底红框红字；白文古印 = 朱砂红底白字）
      const sx = 544, sy = 562, sz = 54;
      const isRelief = state.gift.seal !== 'white_intaglio';
      const stxt = (state.gift.sealText || '长乐未央').slice(0, 4);
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(-0.04);
      if (isRelief) {
        // 朱文方印（阳文）：素纸底 + 朱砂双框 + 朱红篆字
        ctx.fillStyle = 'rgba(255, 250, 240, 0.94)';
        ctx.beginPath(); ctx.roundRect(-sz * 0.5, -sz * 0.5, sz, sz, 4); ctx.fill();
        ctx.strokeStyle = '#C83E2B';
        ctx.lineWidth = 3.2;
        ctx.strokeRect(-sz * 0.5 + 2, -sz * 0.5 + 2, sz - 4, sz - 4);
        ctx.lineWidth = 1.0;
        ctx.strokeRect(-sz * 0.5 + 6, -sz * 0.5 + 6, sz - 12, sz - 12);
        ctx.fillStyle = '#C83E2B';
      } else {
        // 白文古印（阴文）：满朱砂印泥底 + 留白阴刻古字
        ctx.fillStyle = '#B83222';
        ctx.beginPath(); ctx.roundRect(-sz * 0.5, -sz * 0.5, sz, sz, 4); ctx.fill();
        ctx.strokeStyle = 'rgba(255, 245, 230, 0.55)';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(-sz * 0.5 + 4, -sz * 0.5 + 4, sz - 8, sz - 8);
        ctx.fillStyle = '#FFF9EF';
      }
      ctx.font = 'bold 16px "Songti SC", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(stxt.slice(0, 2), 0, -9);
      ctx.fillText(stxt.slice(2, 4) || '印', 0, 10);
      ctx.restore();
    } else {
      // 东汉木案温润纹理与案旁小工具暗影
      ctx.strokeStyle = 'rgba(181, 136, 103, 0.14)';
      ctx.lineWidth = 1.5;
      for (let y = 70; y < CH; y += 48) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(240, y - 8, 480, y + 8, CW, y);
        ctx.stroke();
      }
      // 案角静置的汉代竹尺与线轴装饰
      ctx.save();
      ctx.translate(68, 130);
      ctx.rotate(-0.22);
      ctx.fillStyle = 'rgba(212, 176, 123, 0.45)';
      ctx.strokeStyle = 'rgba(120, 75, 49, 0.3)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(-14, -70, 28, 140, 4);
      ctx.fill();
      ctx.stroke();
      for (let k = -55; k <= 55; k += 14) {
        ctx.beginPath(); ctx.moveTo(-14, k); ctx.lineTo(-4, k); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  // 生成逼真丝绸经纬肌理与雅致暗花提花织锦底纹
  function drawFabricTextureAndPattern(ctx, colObj, matId, patId) {
    ctx.save();
    // 1. 细腻织物经纬肌理（低对比、高密度，还原真实丝帛/棉麻微织纹）
    if (matId === 'linen') {
      ctx.strokeStyle = 'rgba(55, 32, 18, 0.075)';
      ctx.lineWidth = 1;
      for (let x = 150; x <= 570; x += 5) { ctx.beginPath(); ctx.moveTo(x, 160); ctx.lineTo(x, 630); ctx.stroke(); }
      for (let y = 160; y <= 630; y += 5) { ctx.beginPath(); ctx.moveTo(150, y); ctx.lineTo(570, y); ctx.stroke(); }
    } else if (matId === 'embcloth') {
      ctx.fillStyle = 'rgba(55, 32, 18, 0.08)';
      for (let x = 160; x <= 560; x += 7) {
        for (let y = 170; y <= 620; y += 7) {
          ctx.fillRect(x, y, 1.3, 1.3);
        }
      }
    } else {
      // 素绢/绫罗/锦缎：细密斜纹丝光织理
      ctx.strokeStyle = matId === 'brocade' ? 'rgba(255, 224, 145, 0.11)' : 'rgba(255, 255, 255, 0.065)';
      ctx.lineWidth = 0.9;
      for (let d = -260; d <= 560; d += 5) {
        ctx.beginPath(); ctx.moveTo(150 + d, 160); ctx.lineTo(150 + d - 280, 620); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(42, 22, 12, 0.035)';
      for (let y = 162; y <= 624; y += 4) {
        ctx.beginPath(); ctx.moveTo(150, y); ctx.lineTo(570, y); ctx.stroke();
      }
    }

    // 2. 雅致提花暗纹（柔和低对比、细腻线稿，像真实织入绸缎里的暗花而非惨白水印）
    if (patId !== 'plain') {
      const isGold = matId === 'brocade';
      ctx.strokeStyle = isGold ? 'rgba(255, 224, 136, 0.24)' : 'rgba(255, 252, 245, 0.13)';
      ctx.fillStyle = isGold ? 'rgba(255, 224, 136, 0.10)' : 'rgba(255, 252, 245, 0.06)';
      ctx.lineWidth = 1.05;
      const step = 44;
      for (let row = 0; row < 11; row++) {
        const y = 188 + row * step;
        for (let col = 0; col < 10; col++) {
          const ox = 172 + col * step + (row % 2 === 0 ? 0 : step * 0.5);
          ctx.save();
          ctx.translate(ox, y);
          if (patId === 'cloud') {
            ctx.beginPath();
            ctx.moveTo(-13, 3);
            ctx.bezierCurveTo(-15, -5, -5, -9, 0, -4);
            ctx.bezierCurveTo(6, -10, 15, -5, 13, 3);
            ctx.bezierCurveTo(8, 6, -8, 6, -13, 3);
            ctx.fill(); ctx.stroke();
          } else if (patId === 'fret') {
            ctx.beginPath();
            ctx.moveTo(-10, -10); ctx.lineTo(10, -10); ctx.lineTo(10, 10); ctx.lineTo(-10, 10);
            ctx.lineTo(-10, -4); ctx.lineTo(4, -4); ctx.lineTo(4, 4); ctx.lineTo(-4, 4);
            ctx.stroke();
          } else if (patId === 'pearl') {
            // 汉唐联珠团窠暗纹（8颗细腻小珠围成团花，告别精灵球）
            for (let k = 0; k < 8; k++) {
              const a = (k * Math.PI * 2) / 8;
              ctx.beginPath();
              ctx.arc(Math.cos(a) * 11, Math.sin(a) * 11, 1.5, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, 2, 0, Math.PI * 2);
            ctx.fill();
          } else if (patId === 'scroll') {
            ctx.beginPath();
            ctx.moveTo(-12, 4);
            ctx.bezierCurveTo(-6, -10, 6, -10, 12, 4);
            ctx.moveTo(-4, -3);
            ctx.quadraticCurveTo(0, -11, 6, -8);
            ctx.stroke();
          }
          ctx.restore();
        }
      }
    }
    ctx.restore();
  }

  // Layer 01: 布料主体、未裁匹料与立体囊体层
  function renderLayer01_Fabric(ctx) {
    ctx.clearRect(0, 0, CW, CH);
    const colObj = FABRIC_COLORS.find(c => c.hex === state.fabric.color) || FABRIC_COLORS[0];
    const matObj = FABRIC_MATERIALS.find(m => m.id === state.fabric.material) || FABRIC_MATERIALS[0];
    const isFlatCloth = (state.step === 0) || (state.step === 1 && !state.cutting.completed);

    ctx.save();
    if (isFlatCloth) {
      // 第一阶段 & 第二阶段未裁完：展示铺在木案上的方形丝帛匹料 + 白粉初绘形制虚线
      ctx.fillStyle = 'rgba(62, 34, 21, 0.16)';
      ctx.beginPath();
      ctx.roundRect(148, 178, 428, 438, 12);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(142, 170, 428, 438, 10);
      ctx.fillStyle = colObj.hex;
      ctx.fill();
      ctx.clip();

      drawFabricTextureAndPattern(ctx, colObj, matObj.id, state.fabric.pattern);

      // 匹料柔和丝绸折叠高光
      const sheenG = ctx.createLinearGradient(142, 170, 570, 608);
      sheenG.addColorStop(0, 'rgba(255,255,255,0.18)');
      sheenG.addColorStop(0.5, 'rgba(255,255,255,0)');
      sheenG.addColorStop(1, 'rgba(40,20,10,0.14)');
      ctx.fillStyle = sheenG;
      ctx.fillRect(142, 170, 428, 438);
      ctx.restore();

      // 绘制香囊形制白粉引导轮廓线
      traceSachetContour(ctx, state.fabric.shape, 1.0);
      ctx.strokeStyle = 'rgba(255, 252, 245, 0.88)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 6]);
      ctx.stroke();
      ctx.setLineDash([]);

      // STEP 02 裁剪节点进度高亮
      if (state.step === 1) {
        const pts = getContourSamplePoints(state.fabric.shape, state.cutting.checkpoints.length);
        pts.forEach((p, idx) => {
          const done = state.cutting.checkpoints[idx];
          ctx.fillStyle = done ? '#5B8C6B' : 'rgba(255, 255, 255, 0.85)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, done ? 4.2 : 3.2, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    } else {
      // 已完成裁剪：Layer 01 仅绘制底影、纯净布面底色与织锦暗花（3D曲面光影与褶皱后置到刺绣层之上统一叠加！）
      ctx.save();
      ctx.shadowColor = 'rgba(48, 24, 12, 0.24)';
      ctx.shadowBlur = 28;
      ctx.shadowOffsetX = 4;
      ctx.shadowOffsetY = 14;
      traceSachetContour(ctx, state.fabric.shape, 1.0);
      ctx.fillStyle = colObj.hex;
      ctx.fill();
      ctx.restore();

      ctx.save();
      traceSachetContour(ctx, state.fabric.shape, 1.0);
      ctx.clip();
      drawFabricTextureAndPattern(ctx, colObj, matObj.id, state.fabric.pattern);
      ctx.restore();
    }
    ctx.restore();
  }

  // Layer 04.5: 后置 3D 鼓胀球面光影、丝绸反光、束口捏褶与立体滚边（盖在刺绣层之上，让所有绣纹真正“长”进曲面丝绸里！）
  function renderLayer045_Lighting(ctx) {
    ctx.clearRect(0, 0, CW, CH);
    const isFlatCloth = (state.step === 0) || (state.step === 1 && !state.cutting.completed);
    if (isFlatCloth) return;

    const colObj = FABRIC_COLORS.find(c => c.hex === state.fabric.color) || FABRIC_COLORS[0];
    const matObj = FABRIC_MATERIALS.find(m => m.id === state.fabric.material) || FABRIC_MATERIALS[0];
    const dim = getShapeDimensions(state.fabric.shape);
    const plumpFactor = 0.20 + (state.filling.totalAmount / 100) * 0.24;

    ctx.save();
    ctx.save();
    traceSachetContour(ctx, state.fabric.shape, 1.0);
    ctx.clip();

    // 1. 囊腹 3D 鼓胀球面明暗（使边缘处的刺绣纹样自然沉入阴影、中心自然受光）
    const bodyGrad = ctx.createRadialGradient(CX - 46, CY - 42, 12, CX + 6, CY + 12, Math.max(dim.rx, dim.ry) * 1.25);
    bodyGrad.addColorStop(0.00, `rgba(255, 252, 245, ${plumpFactor + matObj.sheen * 0.45})`);
    bodyGrad.addColorStop(0.38, `rgba(255, 250, 242, ${matObj.sheen * 0.16})`);
    bodyGrad.addColorStop(0.70, 'rgba(55, 25, 14, 0.08)');
    bodyGrad.addColorStop(1.00, 'rgba(38, 16, 8, 0.46)');
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(CX - 220, CY - 220, 440, 440);

    // 2. 丝绸斜向柔滑反光缎带（轻轻掠过布面与绣线）
    if (matObj.sheen >= 0.12) {
      const silkBand = ctx.createLinearGradient(CX - 150, CY - 140, CX + 150, CY + 140);
      silkBand.addColorStop(0.00, 'rgba(255,255,255,0)');
      silkBand.addColorStop(0.36, `rgba(255,255,255,${matObj.sheen * 0.30})`);
      silkBand.addColorStop(0.46, 'rgba(255,255,255,0)');
      silkBand.addColorStop(0.72, `rgba(255,255,255,${matObj.sheen * 0.14})`);
      silkBand.addColorStop(1.00, 'rgba(255,255,255,0)');
      ctx.fillStyle = silkBand;
      ctx.fillRect(CX - 220, CY - 220, 440, 440);
    }

    // 3. 囊口束口放射状软捏褶（褶皱阴影自然压过经过此处的绣花）
    const isNeckShape = state.fabric.shape === 'pouch' || state.fabric.shape === 'gourd';
    const foldTopY = isNeckShape ? (CY - dim.ry * 0.62) : (CY - dim.ry * 0.94);
    if (state.fabric.opening === 'drawstring' || isNeckShape) {
      for (let r = -3; r <= 3; r++) {
        const sx = CX + r * (isNeckShape ? 11 : 14);
        const ex = CX + r * (isNeckShape ? 26 : 30);
        const len = isNeckShape ? 58 : 48;
        const foldG = ctx.createLinearGradient(sx, foldTopY, ex, foldTopY + len);
        foldG.addColorStop(0, 'rgba(38, 16, 8, 0.25)');
        foldG.addColorStop(0.55, 'rgba(38, 16, 8, 0.08)');
        foldG.addColorStop(1, 'rgba(38, 16, 8, 0)');
        ctx.strokeStyle = foldG;
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sx, foldTopY);
        ctx.quadraticCurveTo((sx + ex) * 0.5, foldTopY + len * 0.45, ex, foldTopY + len);
        ctx.stroke();

        const hiG = ctx.createLinearGradient(sx + 3, foldTopY, ex + 4, foldTopY + len * 0.85);
        hiG.addColorStop(0, 'rgba(255, 252, 245, 0.20)');
        hiG.addColorStop(1, 'rgba(255, 252, 245, 0)');
        ctx.strokeStyle = hiG;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(sx + 3, foldTopY + 2);
        ctx.quadraticCurveTo((sx + ex) * 0.5 + 3, foldTopY + len * 0.42, ex + 4, foldTopY + len * 0.85);
        ctx.stroke();
      }
    }

    // 4. 四周缝份内侧柔和压暗
    ctx.save();
    traceSachetContour(ctx, state.fabric.shape, 1.0);
    ctx.strokeStyle = 'rgba(36, 15, 8, 0.34)';
    ctx.lineWidth = 14;
    ctx.filter = 'blur(4px)';
    ctx.stroke();
    ctx.filter = 'none';
    ctx.restore();
    ctx.restore();

    // 5. 立体滚边包边条
    traceSachetContour(ctx, state.fabric.shape, 1.0);
    ctx.strokeStyle = colObj.dark;
    ctx.lineWidth = 5.2;
    ctx.stroke();

    traceSachetContour(ctx, state.fabric.shape, 0.992);
    ctx.strokeStyle = state.fabric.material === 'brocade' ? 'rgba(242, 206, 126, 0.72)' : colObj.light;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (state.fabric.opening === 'folded') {
      ctx.strokeStyle = colObj.light;
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(CX - dim.rx * 0.45, CY - dim.ry * 0.90);
      ctx.quadraticCurveTo(CX, CY - dim.ry * 0.82, CX + dim.rx * 0.45, CY - dim.ry * 0.90);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 绘制单枚香料矢量图形
  function drawHerbGraphic(ctx, herbMeta, x, y, scale, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.rotate(rot);

    ctx.fillStyle = 'rgba(50, 25, 10, 0.16)';
    ctx.beginPath();
    ctx.ellipse(1, 3, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    if (herbMeta.shape === 'petal4') {
      ctx.fillStyle = herbMeta.color;
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath(); ctx.ellipse(5, 0, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = herbMeta.sub;
      ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, Math.PI * 2); ctx.fill();
    } else if (herbMeta.shape === 'petal5' || herbMeta.shape === 'rose') {
      ctx.fillStyle = herbMeta.color;
      for (let i = 0; i < 5; i++) {
        const a = (i * Math.PI * 2) / 5;
        ctx.beginPath(); ctx.arc(Math.cos(a) * 5.5, Math.sin(a) * 5.5, 4.8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = herbMeta.sub;
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
    } else if (herbMeta.shape === 'leaf') {
      ctx.fillStyle = herbMeta.color;
      ctx.beginPath();
      ctx.moveTo(-11, 0); ctx.quadraticCurveTo(0, -8, 11, 0); ctx.quadraticCurveTo(0, 8, -11, 0);
      ctx.fill();
      ctx.strokeStyle = herbMeta.sub; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.stroke();
    } else if (herbMeta.shape === 'clove') {
      ctx.fillStyle = herbMeta.color;
      ctx.fillRect(-2, -2, 4, 11);
      ctx.beginPath(); ctx.arc(0, -4, 4.2, 0, Math.PI * 2); ctx.fill();
    } else if (herbMeta.shape === 'cloud') {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      ctx.arc(-5, 0, 7, 0, Math.PI * 2); ctx.arc(5, 0, 7, 0, Math.PI * 2); ctx.arc(0, -4, 8, 0, Math.PI * 2);
      ctx.fill();
    } else if (herbMeta.shape === 'powder') {
      ctx.fillStyle = herbMeta.color;
      for (let k = 0; k < 7; k++) {
        ctx.beginPath(); ctx.arc(Math.cos(k * 1.1) * 6, Math.sin(k * 1.7) * 5, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      ctx.fillStyle = herbMeta.color;
      ctx.strokeStyle = herbMeta.sub;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(-9, -4.5, 18, 9, 3);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // Layer 02: 香料与丝绸内衬层（在 STEP 03、STEP 04 未完全收口或开启「内腔透视」时可见）
  function renderLayer02_Filling(ctx) {
    ctx.clearRect(0, 0, CW, CH);
    const showCavity = (state.step === 2) || (state.step === 3 && !state.sewing.completed) || state.xrayMode;
    if (!showCavity) return;

    const dim = getShapeDimensions(state.fabric.shape);
    ctx.save();
    if (state.xrayMode && state.step !== 2) ctx.globalAlpha = 0.72;

    // 裁剪在内衬腔体椭圆内，确保任何香料绝不穿透香囊边缘
    ctx.beginPath();
    ctx.ellipse(CX, CY + 22, dim.rx * 0.72, dim.ry * 0.62, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#F7EFE2';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(120, 75, 49, 0.35)';
    ctx.stroke();
    ctx.clip();

    // 内衬腔体柔和内凹阴影
    const cavG = ctx.createRadialGradient(CX, CY + 28, 15, CX, CY + 22, dim.rx * 0.75);
    cavG.addColorStop(0, 'rgba(255, 252, 245, 0)');
    cavG.addColorStop(1, 'rgba(95, 58, 34, 0.25)');
    ctx.fillStyle = cavG;
    ctx.fillRect(CX - 160, CY - 140, 320, 320);

    // 绘制已放入囊中的香料颗粒
    state.filling.particles.forEach(pt => {
      const meta = HERB_CATALOG.find(h => h.id === pt.id) || HERB_CATALOG[0];
      const wp = uvToSachetWorld(pt.u * 0.65, pt.v * 0.55 + 0.12);
      drawHerbGraphic(ctx, meta, wp.x, wp.y, pt.scale, pt.rot);
    });

    ctx.restore();
  }

  // 绘制单段立体穿布丝线（带针孔微凹暗影 + 丝线底影 + 圆柱丝光高光）
  function drawRealisticThreadSegment(ctx, x1, y1, x2, y2, color, width = 3.0) {
    // 1. 两端针孔微凹暗点
    ctx.fillStyle = 'rgba(32, 14, 6, 0.42)';
    ctx.beginPath(); ctx.arc(x1, y1, width * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x2, y2, width * 0.42, 0, Math.PI * 2); ctx.fill();

    // 2. 丝线投射在布面上的柔影
    ctx.strokeStyle = 'rgba(30, 12, 5, 0.28)';
    ctx.lineWidth = width + 0.8;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1 + 0.8, y1 + 1.3); ctx.lineTo(x2 + 0.8, y2 + 1.3); ctx.stroke();

    // 3. 丝线主体
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

    // 4. 丝线顶部柔顺丝光高光
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.46)';
    ctx.lineWidth = Math.max(0.8, width * 0.32);
    ctx.beginPath(); ctx.moveTo(x1 - 0.3, y1 - 0.6); ctx.lineTo(x2 - 0.3, y2 - 0.6); ctx.stroke();
  }

  // Layer 03: 囊口缝线与真实立体针脚层（四种针法各具真实工艺形态）
  function renderLayer03_Sewing(ctx) {
    ctx.clearRect(0, 0, CW, CH);
    if (state.step < 3 && !state.sewing.completed) return;

    const pts = getSewingSamplePoints(state.fabric.shape, state.sewing.checkpoints.length);
    const stType = state.sewing.stitchType;
    const tColor = state.sewing.threadColor;

    ctx.save();
    // 1. 包边针：精致贴合轮廓的织锦细滚条（不再是突兀粗胶带）
    if (stType === 'binding' && (state.sewing.progress > 15 || state.sewing.completed)) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(42, 20, 8, 0.28)';
      ctx.lineWidth = 6.2;
      ctx.beginPath();
      pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y + 1.5); else ctx.lineTo(p.x, p.y + 1.5); });
      ctx.stroke();

      ctx.strokeStyle = '#C9963B';
      ctx.lineWidth = 4.8;
      ctx.beginPath();
      pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 245, 210, 0.55)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y - 1); else ctx.lineTo(p.x, p.y - 1); });
      ctx.stroke();
    }

    // 2. 绘制未缝合的淡白粉针孔引导点 & 已缝合的真实立体针脚
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const done = state.sewing.checkpoints[i] || state.sewing.completed;
      if (!done) {
        ctx.fillStyle = 'rgba(255, 252, 245, 0.85)';
        ctx.strokeStyle = 'rgba(120, 75, 49, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (i < pts.length - 1) {
        const nxt = pts[i + 1];
        const dx = nxt.x - p.x, dy = nxt.y - p.y;
        const len = Math.max(1, Math.hypot(dx, dy));
        const nx = -dy / len, ny = dx / len; // 垂直法向
        const needleId = state.sewing.needle || 'fine';
        const wScale = needleId === 'fine' ? 0.78 : (needleId === 'embroidery' ? 1.28 : 1.0);

        if (stType === 'running') {
          // 平针：工整穿布虚实交替，每针圆润有丝光
          if (i % 2 === 0) {
            drawRealisticThreadSegment(ctx, p.x, p.y, nxt.x, nxt.y, tColor, 2.8 * wScale);
          }
        } else if (stType === 'back') {
          // 回针：紧密首尾相衔的厚实连针，每段独立带起针落针微凹
          drawRealisticThreadSegment(ctx, p.x, p.y, nxt.x, nxt.y, tColor, 3.2 * wScale);
        } else if (stType === 'overlock') {
          // 锁边针：细腻人字跨边锁针（垂直跨越缝线 + 斜向连针）
          const span = 4.5 * (needleId === 'embroidery' ? 1.15 : 1.0);
          const xA = p.x - nx * span, yA = p.y - ny * span;
          const xB = p.x + nx * span, yB = p.y + ny * span;
          drawRealisticThreadSegment(ctx, xA, yA, xB, yB, tColor, 2.3 * wScale);
          drawRealisticThreadSegment(ctx, xB, yB, nxt.x - nx * span, nxt.y - ny * span, tColor, 1.9 * wScale);
        } else {
          // 包边针：沿金丝滚边斜向缠绕的细密斜缲针
          drawRealisticThreadSegment(ctx, p.x - nx * 3.4, p.y - ny * 3.4, p.x + nx * 3.4 + dx * 0.45, p.y + ny * 3.4 + dy * 0.45, tColor, 2.1 * wScale);
        }
      }
    }
    ctx.restore();
  }

  // 辅助：绘制单颗饱满立体的打籽绣绣粒 (French Knot)
  function drawFrenchKnot(ctx, x, y, r, color) {
    ctx.fillStyle = 'rgba(35, 16, 6, 0.30)';
    ctx.beginPath(); ctx.arc(x + 0.7, y + 1.0, r + 0.3, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.15, x, y, r);
    g.addColorStop(0, '#FFFFFF');
    g.addColorStop(0.32, color);
    g.addColorStop(1, 'rgba(30, 14, 6, 0.55)');
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = g;
    ctx.globalAlpha = 0.58;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 辅助：在任意路径上渲染 4 种截然不同的真实手绣针法 (平绣 / 锁绣 / 盘金绣 / 打籽绣)
  function drawEmbroideryPathStroke(ctx, pts, color, stitchStyle = 'satin', width = 3.8) {
    if (!pts || pts.length < 2) return;
    // 将路径按固定步长重采样为均匀点列，确保锁链/钉金/打籽密度均匀美观
    const step = stitchStyle === 'seed' ? 6.5 : (stitchStyle === 'chain' ? 7.5 : (stitchStyle === 'gold' ? 8.0 : 2.8));
    const samples = [pts[0]];
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const seg = Math.hypot(b.x - a.x, b.y - a.y);
      if (seg < 0.01) continue;
      let d = step - acc;
      while (d <= seg) {
        const t = d / seg;
        samples.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
        d += step;
      }
      acc = seg - (d - step);
    }
    if (samples.length < 2) samples.push(pts[pts.length - 1]);

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (stitchStyle === 'seed') {
      // 打籽绣：一颗颗圆润凸起的丝线结粒
      for (let i = 0; i < samples.length; i++) {
        drawFrenchKnot(ctx, samples[i].x, samples[i].y, Math.max(2.6, width * 0.78), color);
      }
    } else if (stitchStyle === 'chain') {
      // 锁绣：环环相扣的水滴状锁链线圈
      for (let i = 0; i < samples.length - 1; i++) {
        const p = samples[i], nxt = samples[i + 1];
        const mx = (p.x + nxt.x) * 0.5, my = (p.y + nxt.y) * 0.5;
        const ang = Math.atan2(nxt.y - p.y, nxt.x - p.x);
        const rx = Math.max(3.6, Math.hypot(nxt.x - p.x, nxt.y - p.y) * 0.58);
        const ry = Math.max(2.3, width * 0.62);
        ctx.save();
        ctx.translate(mx, my);
        ctx.rotate(ang);
        ctx.strokeStyle = 'rgba(32, 14, 6, 0.28)';
        ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.ellipse(0.6, 1.0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.0;
        ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.ellipse(-0.3, -0.5, rx * 0.85, ry * 0.7, 0, -Math.PI * 0.8, -Math.PI * 0.15); ctx.stroke();
        ctx.restore();
      }
    } else if (stitchStyle === 'gold') {
      // 盘金绣：立体双股鎏金粗丝 + 等距垂直朱红钉金小线
      ctx.strokeStyle = 'rgba(42, 20, 6, 0.34)';
      ctx.lineWidth = width + 2.2;
      ctx.beginPath();
      pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x + 1, p.y + 1.5) : ctx.lineTo(p.x + 1, p.y + 1.5));
      ctx.stroke();

      ctx.strokeStyle = '#B88122';
      ctx.lineWidth = width + 1.2;
      ctx.beginPath();
      pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();

      ctx.strokeStyle = '#F7D774';
      ctx.lineWidth = width * 0.75;
      ctx.stroke();

      ctx.strokeStyle = '#FFF7D6';
      ctx.lineWidth = Math.max(1, width * 0.28);
      ctx.beginPath();
      pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x - 0.5, p.y - 0.7) : ctx.lineTo(p.x - 0.5, p.y - 0.7));
      ctx.stroke();

      // 间隔垂直钉金红线
      for (let i = 1; i < samples.length - 1; i++) {
        const prev = samples[i - 1], nxt = samples[i + 1];
        const dx = nxt.x - prev.x, dy = nxt.y - prev.y;
        const len = Math.max(1, Math.hypot(dx, dy));
        const nx = (-dy / len) * (width * 0.75), ny = (dx / len) * (width * 0.75);
        ctx.strokeStyle = '#B83428';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(samples[i].x - nx, samples[i].y - ny);
        ctx.lineTo(samples[i].x + nx, samples[i].y + ny);
        ctx.stroke();
      }
    } else {
      // 平绣 (satin)：密集齐针斜向丝线排布，展现绸缎般顺滑光泽
      for (let i = 0; i < samples.length - 1; i++) {
        const p = samples[i], nxt = samples[i + 1];
        const dx = nxt.x - p.x, dy = nxt.y - p.y;
        const len = Math.max(1, Math.hypot(dx, dy));
        const nx = (-dy / len) * (width * 0.68), ny = (dx / len) * (width * 0.68);
        ctx.strokeStyle = 'rgba(32, 14, 6, 0.20)';
        ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(p.x - nx + 0.6, p.y - ny + 1.0); ctx.lineTo(p.x + nx + 0.6, p.y + ny + 1.0); ctx.stroke();

        ctx.strokeStyle = color;
        ctx.lineWidth = 2.1;
        ctx.beginPath(); ctx.moveTo(p.x - nx, p.y - ny); ctx.lineTo(p.x + nx, p.y + ny); ctx.stroke();

        if (i % 2 === 0) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.lineWidth = 0.8;
          ctx.beginPath(); ctx.moveTo(p.x - nx * 0.5, p.y - ny * 0.5); ctx.lineTo(p.x + nx * 0.3, p.y + ny * 0.3); ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  // 绘制单个刺绣纹样（12 款全部独立精绘 + 球面透视微压 + 贴布针孔微勒，彻底消除粘贴感）
  function drawEmbroideryMotifItem(ctx, item, overrideXY = null) {
    const wp = overrideXY || uvToSachetWorld(item.u, item.v);
    const col = item.color || '#E0AD45';
    const st = item.stitchStyle || 'satin';
    const meta = EMBROIDERY_MOTIFS.find(m => m.id === item.type) || EMBROIDERY_MOTIFS[0];

    // 根据在鼓胀囊腹上的 (u, v) 位置施加自然球面透视微压缩（靠边缘自动顺着曲面收窄）
    let curveSx = 1, curveSy = 1;
    if (!overrideXY) {
      const uu = Math.max(-0.95, Math.min(0.95, item.u || 0));
      const vv = Math.max(-0.95, Math.min(0.95, item.v || 0));
      curveSx = Math.max(0.74, Math.sqrt(Math.max(0.35, 1 - uu * uu * 0.42)));
      curveSy = Math.max(0.76, Math.sqrt(Math.max(0.40, 1 - vv * vv * 0.36)));
    }

    ctx.save();
    ctx.translate(wp.x, wp.y);
    ctx.scale((item.scale || 1) * curveSx, (item.scale || 1) * curveSy);
    ctx.rotate(item.rotation || 0);

    // 去掉纸片悬浮投影！改用紧贴布面的微勒针孔压痕 + 内部方向性真丝绣线光泽
    const fillEmbroideredPath = (drawPathFn, customFill = col) => {
      // 1. 丝线紧勒布料的极贴合微凹压痕（非悬浮投影）
      ctx.save();
      drawPathFn();
      ctx.strokeStyle = 'rgba(34, 15, 6, 0.32)';
      ctx.lineWidth = 2.0;
      ctx.stroke();
      ctx.restore();

      // 2. 绣线填充 + 细密丝线排布肌理
      ctx.save();
      drawPathFn();
      if (st === 'seed') {
        ctx.fillStyle = customFill;
        ctx.globalAlpha = 0.28;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.clip();
        for (let gx = -22; gx <= 22; gx += 5.2) {
          for (let gy = -22; gy <= 22; gy += 5.2) {
            drawFrenchKnot(ctx, gx + ((gy / 5.2) % 2 === 0 ? 0 : 2.4), gy, 2.2, customFill);
          }
        }
      } else {
        ctx.fillStyle = customFill;
        ctx.globalAlpha = 0.93; // 极微弱透出丝帛底纹呼吸感，拒绝塑料不透明贴纸
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.save();
        ctx.clip();
        // 明暗交替的细密方向性丝线排布（还原真丝平绣的拉丝光泽与层次）
        for (let k = -26; k <= 26; k += 2.2) {
          ctx.strokeStyle = (Math.abs(Math.round(k)) % 2 === 0)
            ? 'rgba(255, 252, 242, 0.32)'
            : 'rgba(36, 16, 6, 0.14)';
          ctx.lineWidth = 0.95;
          ctx.beginPath(); ctx.moveTo(k - 8, -24); ctx.lineTo(k + 8, 24); ctx.stroke();
        }
        ctx.restore();
      }
      ctx.restore();

      // 3. 针法轮廓收边
      ctx.save();
      drawPathFn();
      if (st === 'gold') {
        ctx.strokeStyle = '#F7D774';
        ctx.lineWidth = 2.1;
        ctx.stroke();
        ctx.strokeStyle = '#B83428';
        ctx.lineWidth = 1.0;
        ctx.setLineDash([2, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
      } else if (st === 'chain') {
        ctx.strokeStyle = 'rgba(255, 250, 235, 0.72)';
        ctx.lineWidth = 1.7;
        ctx.setLineDash([4, 2.5]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
    };

    if (meta.text) {
      // 吉语文字刺绣：用微勒压痕 + 细密丝线横纹融合进布面（告别冰冷系统字体贴纸）
      ctx.font = `bold ${meta.text.length > 1 ? 21 : 28}px "Songti SC", serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(34, 15, 6, 0.30)';
      ctx.lineWidth = 2.2;
      ctx.strokeText(meta.text, 0, 0);
      ctx.fillStyle = st === 'gold' ? '#F2C96B' : col;
      ctx.globalAlpha = 0.92;
      ctx.fillText(meta.text, 0, 0);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = st === 'gold' ? '#9E5B16' : 'rgba(255, 250, 238, 0.42)';
      ctx.lineWidth = st === 'gold' ? 1.0 : 0.65;
      ctx.setLineDash([2, 2.2]);
      ctx.strokeText(meta.text, 0, 0);
      ctx.setLineDash([]);
    } else if (item.type === 'm_plum') {
      // 1. 梅花（5圆瓣 + 放射金丝花蕊）
      for (let i = 0; i < 5; i++) {
        const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
        fillEmbroideredPath(() => {
          ctx.beginPath(); ctx.arc(Math.cos(a) * 10, Math.sin(a) * 10, 7.2, 0, Math.PI * 2);
        });
      }
      for (let k = 0; k < 7; k++) {
        const a = (k * Math.PI * 2) / 7;
        drawFrenchKnot(ctx, Math.cos(a) * 4.5, Math.sin(a) * 4.5, 1.5, '#FFE89E');
      }
      drawFrenchKnot(ctx, 0, 0, 2.6, '#E0AD45');
    } else if (item.type === 'm_lotus') {
      // 2. 荷花（重瓣莲华 + 莲蓬芯）
      [-0.75, -0.38, 0, 0.38, 0.75].forEach((rot, idx) => {
        const h = idx === 2 ? 22 : (idx === 1 || idx === 3 ? 19 : 15);
        fillEmbroideredPath(() => {
          ctx.save(); ctx.rotate(rot);
          ctx.beginPath(); ctx.moveTo(0, 12); ctx.quadraticCurveTo(-8, -2, 0, 12 - h); ctx.quadraticCurveTo(8, -2, 0, 12); ctx.closePath();
          ctx.restore();
        });
      });
      drawFrenchKnot(ctx, 0, 8, 3.2, '#F2C96B');
    } else if (item.type === 'm_peony') {
      // 3. 牡丹（外层8宽瓣 + 内层5卷瓣 + 富贵金蕊）
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI * 2) / 8;
        fillEmbroideredPath(() => {
          ctx.beginPath(); ctx.ellipse(Math.cos(a) * 11, Math.sin(a) * 11, 7.5, 6, a, 0, Math.PI * 2);
        });
      }
      for (let i = 0; i < 5; i++) {
        const a = (i * Math.PI * 2) / 5 + 0.3;
        fillEmbroideredPath(() => {
          ctx.beginPath(); ctx.ellipse(Math.cos(a) * 5.5, Math.sin(a) * 5.5, 5, 4.2, a, 0, Math.PI * 2);
        });
      }
      drawFrenchKnot(ctx, 0, 0, 3.5, '#FFE89E');
    } else if (item.type === 'm_orchid') {
      // 4. 兰花（修长飘逸兰叶 + 素雅三瓣兰心）
      ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-2, 16); ctx.quadraticCurveTo(-16, 2, -18, -12);
      ctx.moveTo(0, 16); ctx.quadraticCurveTo(4, -2, 16, -15);
      ctx.moveTo(2, 16); ctx.quadraticCurveTo(14, 6, 18, -2);
      ctx.stroke();
      [-0.6, 0, 0.6].forEach(a => {
        fillEmbroideredPath(() => {
          ctx.save(); ctx.translate(2, -4); ctx.rotate(a);
          ctx.beginPath(); ctx.ellipse(0, -6, 3.2, 6.5, 0, 0, Math.PI * 2);
          ctx.restore();
        }, '#FFF4D6');
      });
    } else if (item.type === 'm_osman') {
      // 5. 桂花枝（曲枝 + 簇生四瓣金桂）
      ctx.strokeStyle = '#6E472B'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-16, 12); ctx.quadraticCurveTo(-2, 2, 15, -12); ctx.stroke();
      [[-6, 4], [2, -2], [10, -8], [-2, -6], [8, 3]].forEach(([gx, gy]) => {
        for (let k = 0; k < 4; k++) {
          const a = (k * Math.PI) / 2;
          drawFrenchKnot(ctx, gx + Math.cos(a) * 3, gy + Math.sin(a) * 3, 2.2, col);
        }
      });
    } else if (item.type === 'm_chrys') {
      // 6. 菊花（14 枚纤细放射菊瓣）
      for (let i = 0; i < 14; i++) {
        const a = (i * Math.PI * 2) / 14;
        fillEmbroideredPath(() => {
          ctx.beginPath(); ctx.ellipse(Math.cos(a) * 11, Math.sin(a) * 11, 7, 2.4, a, 0, Math.PI * 2);
        });
      }
      drawFrenchKnot(ctx, 0, 0, 4.2, '#E0AD45');
    } else if (item.type === 'm_cloud') {
      // 7. 祥云（灵动卷尾汉风流云）
      fillEmbroideredPath(() => {
        ctx.beginPath();
        ctx.moveTo(-18, 6);
        ctx.bezierCurveTo(-20, -4, -10, -8, -4, -3);
        ctx.bezierCurveTo(-2, -14, 12, -14, 12, -3);
        ctx.bezierCurveTo(20, -4, 22, 6, 13, 8);
        ctx.quadraticCurveTo(0, 10, -18, 6);
        ctx.closePath();
      });
    } else if (item.type === 'm_ruyi') {
      // 8. 如意（古玉灵芝如意云头）
      fillEmbroideredPath(() => {
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.bezierCurveTo(16, -16, 20, 2, 7, 7);
        ctx.quadraticCurveTo(3, 14, 0, 17);
        ctx.quadraticCurveTo(-3, 14, -7, 7);
        ctx.bezierCurveTo(-20, 2, -16, -16, 0, -14);
        ctx.closePath();
      });
      ctx.strokeStyle = '#FFF5D6'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(-6, -3, 4, 0, Math.PI * 1.4); ctx.stroke();
      ctx.beginPath(); ctx.arc(6, -3, 4, -Math.PI * 0.4, Math.PI); ctx.stroke();
    } else if (item.type === 'm_bat') {
      // 9. 福蝠（展翅对称五福蝙蝠）
      fillEmbroideredPath(() => {
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.quadraticCurveTo(5, -12, 8, -6);
        ctx.bezierCurveTo(18, -14, 22, -2, 16, 5);
        ctx.quadraticCurveTo(10, 2, 6, 9);
        ctx.quadraticCurveTo(0, 14, -6, 9);
        ctx.quadraticCurveTo(-10, 2, -16, 5);
        ctx.bezierCurveTo(-22, -2, -18, -14, -8, -6);
        ctx.quadraticCurveTo(-5, -12, 0, -8);
        ctx.closePath();
      });
    } else if (item.type === 'm_fish') {
      // 10. 双鱼（太极环游吉庆双鱼）
      [0, Math.PI].forEach(rot => {
        fillEmbroideredPath(() => {
          ctx.save(); ctx.rotate(rot);
          ctx.beginPath();
          ctx.moveTo(-4, -14);
          ctx.quadraticCurveTo(14, -12, 14, 2);
          ctx.lineTo(18, 9); ctx.lineTo(10, 6); ctx.lineTo(7, 11);
          ctx.quadraticCurveTo(4, -2, -4, -14);
          ctx.closePath();
          ctx.restore();
        });
      });
    } else if (item.type === 'm_branch') {
      // 11. 连理枝（双枝交缠对叶含苞）
      ctx.strokeStyle = col; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-14, 14); ctx.bezierCurveTo(-4, 4, 4, -4, 14, -14);
      ctx.moveTo(14, 14); ctx.bezierCurveTo(4, 4, -4, -4, -14, -14);
      ctx.stroke();
      [[-10, -10], [10, -10], [0, -14]].forEach(([bx, by]) => drawFrenchKnot(ctx, bx, by, 3.6, '#F0A1B0'));
    } else {
      // 12. 瑞兽纹（汉代铜镜蟠螭团兽纹）
      fillEmbroideredPath(() => {
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0.25, Math.PI * 1.85);
        ctx.quadraticCurveTo(8, -8, 4, 0);
        ctx.quadraticCurveTo(-6, 8, -11, 2);
        ctx.closePath();
      });
      drawFrenchKnot(ctx, 5, -5, 2.2, '#FFE89E');
    }
    ctx.restore();
  }

  // Layer 04: 刺绣绘纹层（严格使用香囊轮廓 clip，自由刺绣与纹样均具备真实针法质感）
  function renderLayer04_Embroidery(ctx) {
    ctx.clearRect(0, 0, CW, CH);
    const hasSketch = Boolean(state.sachetSketchImg && state.sachetSketchImg.complete && state.sachetSketchImg.naturalWidth > 0);
    if (state.embroidery.motifs.length === 0 && state.embroidery.freehandStrokes.length === 0 && !hasSketch) return;

    ctx.save();
    traceSachetContour(ctx, state.fabric.shape, 0.96);
    ctx.clip();

    // 1. 绘制自由刺绣轨迹（按所选针法渲染平绣/锁绣/盘金绣/打籽绣）
    state.embroidery.freehandStrokes.forEach(st => {
      if (!st.points || st.points.length < 2) return;
      const worldPts = st.points.map(pt => uvToSachetWorld(pt.u, pt.v));
      drawEmbroideryPathStroke(ctx, worldPts, st.color || '#E0AD45', st.stitchStyle || 'satin', st.width || 3.8);
    });

    // 1.5 绘制名士囊面手绘刺绣简笔画（带柔和丝线投影）
    if (hasSketch) {
      const dim = getShapeDimensions(state.fabric.shape);
      const skW = dim.rx * 1.18;
      const skH = dim.ry * 1.05;
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.shadowColor = 'rgba(42, 20, 8, 0.25)';
      ctx.shadowBlur = 3;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 2;
      ctx.drawImage(state.sachetSketchImg, CX - skW * 0.5, CY - skH * 0.5, skW, skH);
      ctx.restore();
    }

    // 2. 按 zIndex 升序绘制对象式刺绣纹样
    const sorted = [...state.embroidery.motifs].sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
    sorted.forEach(m => drawEmbroideryMotifItem(ctx, m));

    ctx.restore();
  }

  // 辅助：绘制双股拧绳编织曲线（告别单色扁平线条）
  function drawBraidedCord(ctx, pts, color, isDouble = false, width = 5.2) {
    if (!pts || pts.length < 2) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 绳底柔影
    ctx.strokeStyle = 'rgba(42, 20, 8, 0.26)';
    ctx.lineWidth = width + 1.8;
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x + 1.5, p.y + 2.5) : ctx.lineTo(p.x + 1.5, p.y + 2.5));
    ctx.stroke();

    // 绳体主色
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();

    // 拧股斜向绞丝高光与暗纹
    ctx.strokeStyle = isDouble ? '#F2C96B' : 'rgba(255, 250, 238, 0.45)';
    ctx.lineWidth = Math.max(1.4, width * 0.42);
    ctx.setLineDash([4.5, 4.5]);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(36, 16, 6, 0.25)';
    ctx.lineWidth = Math.max(1.0, width * 0.26);
    ctx.lineDashOffset = 4.5;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Layer 05: 物理精准连接的顶部拧绳穿珠、4款汉风结饰、串联玉珠与柔顺绕线流苏层
  function renderLayer05_Accessories(ctx, time = 0) {
    ctx.clearRect(0, 0, CW, CH);
    const acc = state.accessories;
    const dim = getShapeDimensions(state.fabric.shape);
    const topY = CY - dim.ry;
    const botY = CY + dim.ry;

    ctx.save();

    // 1. 顶部双股拧绳 + 束口绕线小环 + 居中穿在绳上的玉珠（彻底杜绝悬空！）
    if (acc.cord && (state.step >= 5 || state.stepStatus[5])) {
      const loopPts = [];
      for (let i = 0; i <= 28; i++) {
        const t = i / 28;
        // 贝塞尔采样双股收拢挂绳环
        const p0x = CX - 5, p0y = topY + 2;
        const p1x = CX - 42, p1y = topY - 108;
        const p2x = CX + 42, p2y = topY - 108;
        const p3x = CX + 5, p3y = topY + 2;
        const mt = 1 - t;
        const x = mt*mt*mt*p0x + 3*mt*mt*t*p1x + 3*mt*t*t*p2x + t*t*t*p3x;
        const y = mt*mt*mt*p0y + 3*mt*mt*t*p1y + 3*mt*t*t*p2y + t*t*t*p3y;
        loopPts.push({ x, y });
      }
      drawBraidedCord(ctx, loopPts, acc.cord.color, acc.cord.double, 5.2);

      // 顶部束口缠金小扣环（紧贴香囊最顶端，使挂绳真实“长”在香囊上）
      ctx.fillStyle = '#D49B2A';
      ctx.strokeStyle = '#7A4F10';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
