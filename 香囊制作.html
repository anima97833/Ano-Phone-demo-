      ctx.roundRect(CX - 9, topY - 5, 18, 9, 4);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255, 248, 215, 0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(CX - 6, topY - 2); ctx.lineTo(CX + 6, topY - 2); ctx.stroke();

      // 若有玉珠，第一颗精准穿在顶部收拢的双股绳颈上（topY - 16），绝不漂浮在空气中
      if (acc.beads.length > 0) {
        const topBead = acc.beads[0];
        const by = topY - 17;
        ctx.save();
        ctx.translate(CX, by);
        if (topBead.isRing) {
          ctx.strokeStyle = topBead.color; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.arc(-1.5, -1.5, 12, -Math.PI * 0.85, -Math.PI * 0.15); ctx.stroke();
        } else {
          const bg = ctx.createRadialGradient(-3.5, -3.5, 1.2, 0, 0, 11);
          bg.addColorStop(0, '#FFFFFF'); bg.addColorStop(0.32, topBead.color); bg.addColorStop(1, topBead.rim);
          ctx.fillStyle = bg;
          ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
    }

    // 2. 底部连接短茎 + 4款独立精编汉风绳结 + 串联玉珠 + 鎏金帽头柔顺流苏
    const hasBottom = Boolean(acc.knot || acc.tassel || acc.beads.length > 1);
    let cursorY = botY;

    if (hasBottom) {
      const stemColor = (acc.knot && acc.knot.color) || (acc.tassel && acc.tassel.color) || (acc.cord && acc.cord.color) || '#C83E2B';
      // 底部连接金扣与短丝茎
      drawBraidedCord(ctx, [{ x: CX, y: botY - 2 }, { x: CX, y: botY + 14 }], stemColor, false, 4.2);
      ctx.fillStyle = '#D49B2A';
      ctx.beginPath(); ctx.roundRect(CX - 7, botY - 3, 14, 7, 3); ctx.fill();
      cursorY = botY + 14;
    }

    // 汉风结饰（4款独立造型）
    if (acc.knot) {
      const kc = acc.knot.color;
      const ky = cursorY + 8;
      ctx.save();
      ctx.translate(CX, ky);
      ctx.strokeStyle = 'rgba(38, 16, 6, 0.25)';
      ctx.fillStyle = kc;
      ctx.lineWidth = 2.6;
      if (acc.knot.id === 'kn_ear') {
        // 双耳结
        ctx.strokeStyle = kc; ctx.lineWidth = 4.2;
        ctx.beginPath(); ctx.ellipse(-15, 0, 12, 6, -0.22, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(15, 0, 12, 6, 0.22, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = kc; ctx.strokeStyle = '#E0AD45'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.roundRect(-7, -7, 14, 14, 4); ctx.fill(); ctx.stroke();
      } else if (acc.knot.id === 'kn_ruyi') {
        // 如意结（四向云耳）
        ctx.strokeStyle = kc; ctx.lineWidth = 4;
        [[-11, -5], [11, -5], [-11, 5], [11, 5]].forEach(([ex, ey]) => {
          ctx.beginPath(); ctx.arc(ex, ey, 6.5, 0, Math.PI * 2); ctx.stroke();
        });
        ctx.fillStyle = kc; ctx.strokeStyle = '#F2C96B'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (acc.knot.id === 'kn_simple') {
        // 同心结（交缠双环）
        ctx.strokeStyle = kc; ctx.lineWidth = 4.5;
        ctx.beginPath(); ctx.arc(-7, 0, 9.5, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(7, 0, 9.5, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = '#F2C96B'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(-2, -6); ctx.lineTo(2, 6); ctx.stroke();
      } else {
        // 盘长花结（菱形编织网结）
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = kc; ctx.strokeStyle = '#E0AD45'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(-10, -10, 20, 20, 4); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,250,235,0.48)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.moveTo(0, -10); ctx.lineTo(0, 10); ctx.stroke();
      }
      ctx.restore();
      cursorY = ky + 14;
    }

    // 底部串联玉珠（idx >= 1，紧密穿在丝绳上零缝隙）
    const botBeads = acc.beads.slice(1);
    botBeads.forEach((bd) => {
      const stemColor = (acc.tassel && acc.tassel.color) || (acc.knot && acc.knot.color) || '#C83E2B';
      drawBraidedCord(ctx, [{ x: CX, y: cursorY - 2 }, { x: CX, y: cursorY + 18 }], stemColor, false, 3.6);
      const by = cursorY + 9;
      ctx.save();
      ctx.translate(CX, by);
      if (bd.isRing) {
        ctx.strokeStyle = bd.color; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.arc(-1.5, -1.5, 12, -Math.PI * 0.85, -Math.PI * 0.15); ctx.stroke();
        cursorY += 24;
      } else {
        const bg = ctx.createRadialGradient(-3.5, -3.5, 1.2, 0, 0, 11);
        bg.addColorStop(0, '#FFFFFF'); bg.addColorStop(0.32, bd.color); bg.addColorStop(1, bd.rim);
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
        cursorY += 20;
      }
      ctx.restore();
    });

    // 3. 绕线鎏金帽头 + 42 根多层次丝光垂坠流苏（告别硬扫帚！）
    if (acc.tassel) {
      const ty = cursorY;
      const sway = Math.sin(time * 0.0026) * 6.5;
      const len = acc.tassel.len || 96;
      const tc = acc.tassel.color;

      // 柔顺垂坠丝穗底层阴影
      ctx.fillStyle = 'rgba(38, 16, 6, 0.14)';
      ctx.beginPath();
      ctx.moveTo(CX - 7, ty + 14);
      ctx.quadraticCurveTo(CX - 16 + sway * 0.45, ty + len * 0.58, CX - 19 + sway, ty + len + 2);
      ctx.lineTo(CX + 21 + sway, ty + len + 2);
      ctx.quadraticCurveTo(CX + 18 + sway * 0.45, ty + len * 0.58, CX + 9, ty + 14);
      ctx.closePath();
      ctx.fill();

      // 42 根分层丝线（中密外柔、自带真丝横向反光带）
      const strands = 42;
      for (let i = 0; i < strands; i++) {
        const ratio = (i / (strands - 1)) - 0.5;
        const spread = ratio * 34;
        const curLen = len * (0.94 + Math.cos(ratio * Math.PI) * 0.08);
        const strandCol = (acc.tassel.style === 'double' && i % 4 === 0) ? '#E5B94C' : tc;
        ctx.strokeStyle = strandCol;
        ctx.globalAlpha = 0.78 + (1 - Math.abs(ratio * 1.4)) * 0.22;
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.moveTo(CX + ratio * 11, ty + 13);
        ctx.bezierCurveTo(
          CX + ratio * 14 + sway * 0.2, ty + curLen * 0.35,
          CX + spread * 0.72 + sway * 0.65, ty + curLen * 0.72,
          CX + spread + sway, ty + curLen
        );
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // 流苏腰部真丝光泽反光带
      const sheenG = ctx.createLinearGradient(CX - 16, ty + 20, CX + 18, ty + len * 0.7);
      sheenG.addColorStop(0, 'rgba(255,255,255,0)');
      sheenG.addColorStop(0.42, 'rgba(255,252,240,0.28)');
      sheenG.addColorStop(0.58, 'rgba(255,255,255,0)');
      ctx.fillStyle = sheenG;
      ctx.beginPath();
      ctx.moveTo(CX - 8, ty + 14);
      ctx.lineTo(CX - 18 + sway, ty + len);
      ctx.lineTo(CX + 18 + sway, ty + len);
      ctx.lineTo(CX + 8, ty + 14);
      ctx.closePath();
      ctx.fill();

      // 若为花瓣流苏，在帽头处点缀小花托
      if (acc.tassel.style === 'petal') {
        ctx.fillStyle = '#F5C6D0';
        for (let k = -2; k <= 2; k++) {
          ctx.beginPath();
          ctx.ellipse(CX + k * 4.5, ty + 12, 3.8, 6.5, k * 0.22, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 绕线鎏金流苏帽头（带细密横绕金丝纹理）
      const capG = ctx.createLinearGradient(CX - 9, ty, CX + 9, ty);
      capG.addColorStop(0, '#9E6E1A');
      capG.addColorStop(0.4, '#F7D774');
      capG.addColorStop(0.7, '#D49B2A');
      capG.addColorStop(1, '#7A510E');
      ctx.fillStyle = capG;
      ctx.beginPath();
      ctx.roundRect(CX - 8.5, ty, 17, 14, 4);
      ctx.fill();
      ctx.strokeStyle = 'rgba(110, 65, 10, 0.45)';
      ctx.lineWidth = 0.9;
      for (let wy = ty + 3; wy <= ty + 11; wy += 2.6) {
        ctx.beginPath(); ctx.moveTo(CX - 8, wy); ctx.lineTo(CX + 8, wy); ctx.stroke();
      }
    }

    ctx.restore();
  }

  // Layer 06: 实时跟随工具（剪刀、穿线银针、绣花针）、布屑粒子与选中框
  function renderLayer06_Effects(ctx, time) {
    ctx.clearRect(0, 0, CW, CH);
    ctx.save();

    // 1. 刺绣选中纹样高亮虚线框
    if (state.step === 4 && state.embroidery.selectedUid) {
      const sel = state.embroidery.motifs.find(m => m.uid === state.embroidery.selectedUid);
      if (sel) {
        const wp = uvToSachetWorld(sel.u, sel.v);
        ctx.strokeStyle = sel.locked ? '#D9A441' : '#C84B31';
        ctx.lineWidth = 1.8;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.arc(wp.x, wp.y, 26 * (sel.scale || 1), 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // 2. 动态飞落布屑与香料粒子
    for (let i = runtimeParticles.length - 1; i >= 0; i--) {
      const pt = runtimeParticles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 0.25;
      pt.alpha -= 0.022;
      if (pt.alpha <= 0) { runtimeParticles.splice(i, 1); continue; }
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = pt.alpha;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 3. 跟随手指的真实女红工具（3款裁剪工具 + 3款针具独立手绘造型）
    const p = state.pointer;
    if (p.down) {
      if (state.step === 1) {
        const cTool = state.cutting.tool || 'scissors';
        ctx.save();
        ctx.translate(p.x, p.y);
        const ang = Math.atan2(p.vy || 0, p.vx || 1);
        if (cTool === 'knife') {
          // 胡桃木柄斜刃古法裁布刀
          ctx.rotate(ang - 0.35);
          const bG = ctx.createLinearGradient(0, -5, 28, 5);
          bG.addColorStop(0, '#CFD8DC'); bG.addColorStop(0.5, '#FFFFFF'); bG.addColorStop(1, '#78909C');
          ctx.fillStyle = bG; ctx.strokeStyle = '#546E7A'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-14, -6); ctx.lineTo(-24, -5); ctx.lineTo(-24, 4); ctx.lineTo(-8, 4); ctx.closePath();
          ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#C9A25B'; ctx.fillRect(-29, -5.5, 6, 10);
          ctx.fillStyle = '#6E472B';
          ctx.beginPath(); ctx.roundRect(-72, -6.5, 44, 12, 5); ctx.fill();
        } else if (cTool === 'ruler') {
          // 带刻度汉代竹布尺 + 磁吸引导光环
          ctx.strokeStyle = 'rgba(217, 164, 65, 0.55)';
          ctx.lineWidth = 1.8;
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
          ctx.rotate(ang + 0.2);
          ctx.fillStyle = '#E5C487'; ctx.strokeStyle = '#8C6239'; ctx.lineWidth = 1.3;
          ctx.beginPath(); ctx.roundRect(-54, -9, 108, 18, 3); ctx.fill(); ctx.stroke();
          ctx.strokeStyle = '#6E472B'; ctx.lineWidth = 1;
          for (let k = -44; k <= 44; k += 8) {
            ctx.beginPath(); ctx.moveTo(k, -9); ctx.lineTo(k, k % 16 === 0 ? -2 : -5); ctx.stroke();
          }
        } else {
          // 跟随开合的汉代交股小剪刀
          const snip = Math.sin(time * 0.025) * 0.28;
          ctx.rotate(ang);
          ctx.strokeStyle = '#78909C';
          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          [-1, 1].forEach(dir => {
            ctx.save();
            ctx.rotate(dir * (0.22 + Math.abs(snip)));
            ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(26, 0); ctx.stroke();
            ctx.strokeStyle = '#C84B31'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(-25, dir * 5, 7, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
          });
        }
        ctx.restore();
      } else if (state.step === 3 || (state.step === 4 && state.embroidery.toolMode === 'freehand')) {
        // 3款不同针具（细针 / 金鼻绣花针 / 半月弯针）+ 动态悬垂丝线
        const threadCol = state.step === 3 ? state.sewing.threadColor : state.embroidery.threadColor;
        const needleId = state.step === 3 ? (state.sewing.needle || 'fine') : 'embroidery';
        const tailX = needleId === 'curved' ? (p.x + 34) : (p.x + 30);
        const tailY = needleId === 'curved' ? (p.y - 22) : (p.y - 30);

        ctx.strokeStyle = threadCol;
        ctx.lineWidth = needleId === 'fine' ? 1.5 : (needleId === 'embroidery' ? 2.5 : 2.0);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(CX, CY - 90);
        ctx.quadraticCurveTo((CX + p.x) * 0.5, Math.max(CY, p.y) + 45, tailX, tailY);
        ctx.stroke();

        ctx.save();
        ctx.translate(p.x, p.y);
        if (needleId === 'curved') {
          // 半月弧形弯针
          ctx.rotate(-0.55);
          ctx.strokeStyle = '#CFD8DC';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.arc(20, 8, 22, Math.PI * 1.12, Math.PI * 1.88);
          ctx.stroke();
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 1.0;
          ctx.beginPath();
          ctx.arc(20, 7.5, 22, Math.PI * 1.15, Math.PI * 1.82);
          ctx.stroke();
        } else if (needleId === 'embroidery') {
          // 带鎏金针鼻的饱满绣花针
          ctx.rotate(-0.78);
          ctx.strokeStyle = '#CFD8DC';
          ctx.lineWidth = 3.2;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(36, 0); ctx.stroke();
          ctx.strokeStyle = '#F2C96B';
          ctx.lineWidth = 3.6;
          ctx.beginPath(); ctx.moveTo(34, 0); ctx.lineTo(44, 0); ctx.stroke();
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 1.0;
          ctx.beginPath(); ctx.moveTo(2, -0.8); ctx.lineTo(34, -0.8); ctx.stroke();
        } else {
          // 纤细银亮细针
          ctx.rotate(-0.78);
          ctx.strokeStyle = '#ECEFF1';
          ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(42, 0); ctx.stroke();
          ctx.strokeStyle = '#90A4AE';
          ctx.lineWidth = 0.7;
          ctx.beginPath(); ctx.moveTo(0, 0.8); ctx.lineTo(42, 0.8); ctx.stroke();
        }
        ctx.restore();
      }
    }
    ctx.restore();
  }

  // 合成八层离屏 Canvas 至目标画布（lighting 光影褶皱层位于刺绣层之上，让纹样真正融入曲面丝绸）
  function compositeAllLayers(targetCtx, cam, time, includeEffects = true) {
    if (layerDirty.bg)         { renderLayer00_Background(layers.bg.ctx); layerDirty.bg = false; }
    if (layerDirty.fabric)     { renderLayer01_Fabric(layers.fabric.ctx); layerDirty.fabric = false; }
    if (layerDirty.filling)    { renderLayer02_Filling(layers.filling.ctx); layerDirty.filling = false; }
    if (layerDirty.sewing)     { renderLayer03_Sewing(layers.sewing.ctx); layerDirty.sewing = false; }
    if (layerDirty.embroidery) { renderLayer04_Embroidery(layers.embroidery.ctx); layerDirty.embroidery = false; }
    if (layerDirty.lighting)   { renderLayer045_Lighting(layers.lighting.ctx); layerDirty.lighting = false; }
    // 流苏含微风物理摆动，存在流苏或处于第6步时每帧刷新 Layer 05
    if (layerDirty.accessories || state.accessories.tassel) {
      renderLayer05_Accessories(layers.accessories.ctx, time);
      layerDirty.accessories = false;
    }
    if (includeEffects) renderLayer06_Effects(layers.effects.ctx, time);

    targetCtx.save();
    targetCtx.setTransform(1, 0, 0, 1, 0, 0);
    targetCtx.clearRect(0, 0, targetCtx.canvas.width, targetCtx.canvas.height);

    // Layer 00 木案或礼盒背景
    targetCtx.drawImage(layers.bg.canvas, 0, 0);

    // 应用相机缩放与平移合成 Layer 01 ~ 06
    const scaleRatio = targetCtx.canvas.width / CW;
    targetCtx.translate((CW * 0.5 + cam.panX) * scaleRatio, (CH * 0.5 + cam.panY) * scaleRatio);
    targetCtx.scale(cam.zoom, cam.zoom);
    targetCtx.translate(-CW * 0.5 * scaleRatio, -CH * 0.5 * scaleRatio);

    ['fabric', 'filling', 'sewing', 'embroidery', 'lighting', 'accessories'].forEach(name => {
      targetCtx.drawImage(layers[name].canvas, 0, 0);
    });
    if (includeEffects) targetCtx.drawImage(layers.effects.canvas, 0, 0);
    targetCtx.restore();
  }

  let animPaused = false;
  document.addEventListener('visibilitychange', () => { animPaused = document.hidden; });

  function renderLoop(time) {
    if (!animPaused) {
      const cam = state.camera;
      cam.zoom += (cam.targetZoom - cam.zoom) * 0.22;
      cam.panX += (cam.targetPanX - cam.panX) * 0.22;
      cam.panY += (cam.targetPanY - cam.panY) * 0.22;

      if (state.cutting.completed && state.cutting.foldProgress < 1) {
        state.cutting.foldProgress = Math.min(1, state.cutting.foldProgress + 0.06);
        markDirty('fabric');
      }
      if (state.sewing.completed && state.sewing.cinchProgress < 1) {
        state.sewing.cinchProgress = Math.min(1, state.sewing.cinchProgress + 0.05);
        markDirty('fabric', 'sewing');
      }
      compositeAllLayers(mainCtx, cam, time, true);
    }
    requestAnimationFrame(renderLoop);
  }

  /* ============================================================================
   * 7. 相机缩放、坐标换算与七步触控交互系统 (含双指 95ms 防误触与 setPointerCapture)
   * ============================================================================ */
  function clampCameraPan(zoom, panX, panY) {
    const maxPan = Math.max(0, (zoom - 0.85) * 280);
    return { panX: Math.max(-maxPan, Math.min(maxPan, panX)), panY: Math.max(-maxPan, Math.min(maxPan, panY)) };
  }

  function setCameraZoom(nextZoom, anchorRawX = CW * 0.5, anchorRawY = CH * 0.5, immediate = false) {
    const cam = state.camera;
    const cz = Math.max(0.85, Math.min(3.0, nextZoom));
    const bz = immediate ? cam.zoom : cam.targetZoom;
    const bpx = immediate ? cam.panX : cam.targetPanX, bpy = immediate ? cam.panY : cam.targetPanY;
    const wx = (anchorRawX - CW * 0.5 - bpx) / bz + CW * 0.5;
    const wy = (anchorRawY - CH * 0.5 - bpy) / bz + CH * 0.5;
    const clamped = clampCameraPan(cz, anchorRawX - CW * 0.5 - (wx - CW * 0.5) * cz, anchorRawY - CH * 0.5 - (wy - CH * 0.5) * cz);
    cam.targetZoom = cz; cam.targetPanX = clamped.panX; cam.targetPanY = clamped.panY;
    if (immediate) { cam.zoom = cz; cam.panX = clamped.panX; cam.panY = clamped.panY; }
    document.getElementById('zoomResetBtn').textContent = `${Math.round(cam.targetZoom * 100)}%`;
  }

  function resetCamera() {
    state.camera.targetZoom = 1.0; state.camera.targetPanX = 0; state.camera.targetPanY = 0;
    document.getElementById('zoomResetBtn').textContent = '100%';
  }

  function getRawCanvasPos(e) {
    const rect = mainCanvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { rawX: (cx - rect.left) * (CW / rect.width), rawY: (cy - rect.top) * (CH / rect.height) };
  }

  function canvasToWorld(rawX, rawY) {
    const cam = state.camera;
    return { x: (rawX - CW * 0.5 - cam.panX) / cam.zoom + CW * 0.5, y: (rawY - CH * 0.5 - cam.panY) / cam.zoom + CH * 0.5, rawX, rawY };
  }

  function getCanvasPos(e) {
    const raw = getRawCanvasPos(e);
    return canvasToWorld(raw.rawX, raw.rawY);
  }

  function isInsideSachet(wx, wy) {
    const dim = getShapeDimensions(state.fabric.shape);
    if (Math.abs(wy - CY) > dim.ry + 12) return false;
    const v = (wy - CY) / dim.ry;
    return Math.abs(wx - CX) <= getSachetHalfWidthAtV(state.fabric.shape, v) + 12;
  }

  function spawnParticlesAt(x, y, color, count = 4) {
    for (let i = 0; i < count; i++) {
      runtimeParticles.push({
        x, y,
        vx: (Math.random() - 0.5) * 4,
        vy: -1 - Math.random() * 2.5,
        r: 2 + Math.random() * 2.5,
        color: color || state.fabric.color,
        alpha: 0.9
      });
    }
  }

  // STEP 03: 添加/移除香料与古方预设
  function addHerbToFilling(herbId, amountToAdd = 10, customUV = null) {
    const meta = HERB_CATALOG.find(h => h.id === herbId) || HERB_CATALOG[0];
    if (state.filling.totalAmount >= state.filling.capacity) {
      flashPromptWarning('香囊内腔已满 100 份，可点击右侧清单删除部分材料后再添加');
      return;
    }
    pushHistory();
    const actualAdd = Math.min(amountToAdd, state.filling.capacity - state.filling.totalAmount);
    let entry = state.filling.ingredients.find(it => it.id === meta.id);
    if (entry) entry.amount += actualAdd;
    else state.filling.ingredients.push({ id: meta.id, name: meta.name, category: meta.category, color: meta.color, amount: actualAdd });
    state.filling.totalAmount += actualAdd;

    // 生成 4~6 枚落入囊腔内部的香料图形
    const pCount = Math.max(3, Math.round(actualAdd * 0.5));
    for (let i = 0; i < pCount; i++) {
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.78;
      const u = customUV ? (customUV.u + (Math.random() - 0.5) * 0.25) : (Math.cos(a) * r);
      const v = customUV ? (customUV.v + (Math.random() - 0.5) * 0.25) : (Math.sin(a) * r);
      state.filling.particles.push({
        uid: Date.now() + Math.random(),
        id: meta.id,
        u: Math.max(-0.85, Math.min(0.85, u)),
        v: Math.max(-0.85, Math.min(0.85, v)),
        scale: 0.85 + Math.random() * 0.35,
        rot: (Math.random() - 0.5) * 1.6
      });
    }
    if (validateStep(2)) state.stepStatus[2] = true;
    markDirty('fabric', 'filling');
    sfx.playPop(540);
    updateUI();
  }

  function removeHerbFromFilling(herbId) {
    const idx = state.filling.ingredients.findIndex(it => it.id === herbId);
    if (idx < 0) return;
    pushHistory();
    state.filling.totalAmount = Math.max(0, state.filling.totalAmount - state.filling.ingredients[idx].amount);
    state.filling.ingredients.splice(idx, 1);
    state.filling.particles = state.filling.particles.filter(p => p.id !== herbId);
    state.stepStatus[2] = validateStep(2);
    markDirty('fabric', 'filling');
    sfx.playPop(380);
    updateUI();
  }

  function applyPresetRecipe(preset) {
    pushHistory();
    state.filling.ingredients = [];
    state.filling.particles = [];
    state.filling.totalAmount = 0;
    preset.items.forEach(item => {
      const meta = HERB_CATALOG.find(h => h.id === item.id) || HERB_CATALOG[0];
      state.filling.ingredients.push({ id: meta.id, name: meta.name, category: meta.category, color: meta.color, amount: item.amount });
      state.filling.totalAmount += item.amount;
      for (let i = 0; i < Math.round(item.amount * 0.45); i++) {
        const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.8;
        state.filling.particles.push({ uid: Date.now() + Math.random(), id: meta.id, u: Math.cos(a) * r, v: Math.sin(a) * r, scale: 0.9 + Math.random() * 0.3, rot: (Math.random() - 0.5) * 1.5 });
      }
    });
    state.stepStatus[2] = true;
    markDirty('fabric', 'filling');
    sfx.playChime();
    updateUI();
  }

  const activePointers = new Map();
  const gesture = { mode: 'none', startDist: 0, startZoom: 1, lastMidX: 0, lastMidY: 0, drawStartTime: 0, pushedHistory: false, spaceHeld: false };

  function handlePointerDown(e) {
    e.preventDefault();
    try { mainCanvas.setPointerCapture(e.pointerId); } catch (_) {}
    const raw = getRawCanvasPos(e);
    activePointers.set(e.pointerId, { rawX: raw.rawX, rawY: raw.rawY });

    if (activePointers.size === 2) {
      if (gesture.mode === 'draw' && gesture.pushedHistory && (performance.now() - gesture.drawStartTime < 95)) {
        undoAction();
        gesture.pushedHistory = false;
      }
      state.pointer.down = false;
      state.pointer.activeStroke = null;
      const pts = Array.from(activePointers.values());
      gesture.mode = 'pinch';
      gesture.startDist = Math.max(10, Math.hypot(pts[1].rawX - pts[0].rawX, pts[1].rawY - pts[0].rawY));
      gesture.startZoom = state.camera.targetZoom;
      gesture.lastMidX = (pts[0].rawX + pts[1].rawX) * 0.5;
      gesture.lastMidY = (pts[0].rawY + pts[1].rawY) * 0.5;
      return;
    }

    if (gesture.spaceHeld || e.button === 1 || e.button === 2) {
      gesture.mode = 'pan';
      gesture.lastMidX = raw.rawX; gesture.lastMidY = raw.rawY;
      return;
    }
    if (activePointers.size > 2) return;

    gesture.mode = 'draw';
    gesture.drawStartTime = performance.now();
    gesture.pushedHistory = false;

    const pos = canvasToWorld(raw.rawX, raw.rawY);
    state.pointer.down = true;
    state.pointer.x = pos.x; state.pointer.y = pos.y;

    if (state.step === 1 && !state.cutting.completed) {
      pushHistory(); gesture.pushedHistory = true;
      handleCuttingAt(pos.x, pos.y);
    } else if (state.step === 2) {
      if (isInsideSachet(pos.x, pos.y)) {
        const uv = worldToSachetUV(pos.x, pos.y);
        addHerbToFilling(state.filling.activeHerbId, 10, uv);
        spawnParticlesAt(pos.x, pos.y, '#F2B749', 5);
      }
    } else if (state.step === 3 && !state.sewing.completed) {
      pushHistory(); gesture.pushedHistory = true;
      handleSewingAt(pos.x, pos.y);
    } else if (state.step === 4) {
      if (state.embroidery.toolMode === 'freehand') {
        if (isInsideSachet(pos.x, pos.y)) {
          pushHistory(); gesture.pushedHistory = true;
          const uv = worldToSachetUV(pos.x, pos.y);
          const st = { uid: Date.now() + Math.random(), color: state.embroidery.threadColor, stitchStyle: state.embroidery.stitchStyle, width: 3.5, points: [uv] };
          state.embroidery.freehandStrokes.push(st);
          state.pointer.activeStroke = st;
          state.stepStatus[4] = true;
          markDirty('embroidery');
          sfx.playPop(580);
          updatePromptAndProgress();
        }
      } else {
        // 按 zIndex 从高到低进行命中检测
        const sorted = [...state.embroidery.motifs].sort((a, b) => (b.zIndex || 0) - (a.zIndex || 0));
        let hit = null;
        for (const m of sorted) {
          const wp = uvToSachetWorld(m.u, m.v);
          if (Math.hypot(pos.x - wp.x, pos.y - wp.y) < 26 * (m.scale || 1)) { hit = m; break; }
        }
        if (hit) {
          state.embroidery.selectedUid = hit.uid;
          if (!hit.locked) { pushHistory(); gesture.pushedHistory = true; state.pointer.draggingMotif = hit; }
          sfx.playPop(620);
          updateSelectionToolbar();
        } else if (isInsideSachet(pos.x, pos.y)) {
          pushHistory(); gesture.pushedHistory = true;
          const uv = worldToSachetUV(pos.x, pos.y);
          const maxZ = state.embroidery.motifs.reduce((acc, it) => Math.max(acc, it.zIndex || 0), 0);
          const newM = {
            uid: Date.now() + Math.random(),
            type: state.embroidery.activeMotifId,
            u: uv.u, v: uv.v,
            scale: 1.0, rotation: 0,
            color: state.embroidery.threadColor,
            stitchStyle: state.embroidery.stitchStyle,
            zIndex: maxZ + 1,
            locked: false
          };
          state.embroidery.motifs.push(newM);
          state.embroidery.selectedUid = newM.uid;
          state.pointer.draggingMotif = newM;
          state.stepStatus[4] = true;
          markDirty('embroidery');
          sfx.playPop(540);
          updateUI();
        } else {
          state.embroidery.selectedUid = null;
          updateSelectionToolbar();
        }
      }
    } else if (state.step === 6) {
      openCardModal();
    }
  }

  function handlePointerMove(e) {
    if (activePointers.has(e.pointerId)) {
      const raw = getRawCanvasPos(e);
      activePointers.set(e.pointerId, { rawX: raw.rawX, rawY: raw.rawY });

      if (gesture.mode === 'pinch' && activePointers.size === 2) {
        e.preventDefault();
        const pts = Array.from(activePointers.values());
        const dist = Math.max(10, Math.hypot(pts[1].rawX - pts[0].rawX, pts[1].rawY - pts[0].rawY));
        const midX = (pts[0].rawX + pts[1].rawX) * 0.5, midY = (pts[0].rawY + pts[1].rawY) * 0.5;
        const dx = midX - gesture.lastMidX, dy = midY - gesture.lastMidY;
        gesture.lastMidX = midX; gesture.lastMidY = midY;
        const cam = state.camera;
        const clamped = clampCameraPan(cam.targetZoom, cam.targetPanX + dx, cam.targetPanY + dy);
        cam.targetPanX = clamped.panX; cam.targetPanY = clamped.panY; cam.panX = clamped.panX; cam.panY = clamped.panY;
        setCameraZoom(gesture.startZoom * (dist / gesture.startDist), midX, midY, true);
        return;
      }
      if (gesture.mode === 'pan') {
        e.preventDefault();
        const dx = raw.rawX - gesture.lastMidX, dy = raw.rawY - gesture.lastMidY;
        gesture.lastMidX = raw.rawX; gesture.lastMidY = raw.rawY;
        const cam = state.camera;
        const clamped = clampCameraPan(cam.targetZoom, cam.targetPanX + dx, cam.targetPanY + dy);
        cam.targetPanX = clamped.panX; cam.targetPanY = clamped.panY; cam.panX = clamped.panX; cam.panY = clamped.panY;
        return;
      }
    }

    if (!state.pointer.down || gesture.mode !== 'draw') return;
    e.preventDefault();
    const pos = getCanvasPos(e);
    state.pointer.vx = pos.x - state.pointer.x;
    state.pointer.vy = pos.y - state.pointer.y;
    state.pointer.x = pos.x; state.pointer.y = pos.y;

    if (state.step === 1 && !state.cutting.completed) {
      handleCuttingAt(pos.x, pos.y);
    } else if (state.step === 3 && !state.sewing.completed) {
      handleSewingAt(pos.x, pos.y);
    } else if (state.step === 4) {
      if (state.embroidery.toolMode === 'freehand' && state.pointer.activeStroke) {
        if (isInsideSachet(pos.x, pos.y)) {
          const uv = worldToSachetUV(pos.x, pos.y);
          const pts = state.pointer.activeStroke.points;
          const last = pts[pts.length - 1];
          if (Math.hypot(uv.u - last.u, uv.v - last.v) > 0.025) {
            pts.push(uv);
            markDirty('embroidery');
            sfx.playSnip();
          }
        }
      } else if (state.pointer.draggingMotif && !state.pointer.draggingMotif.locked) {
        if (isInsideSachet(pos.x, pos.y)) {
          const uv = worldToSachetUV(pos.x, pos.y);
          state.pointer.draggingMotif.u = uv.u;
          state.pointer.draggingMotif.v = uv.v;
          markDirty('embroidery');
        }
      }
    }
  }

  function handlePointerUp(e) {
    if (e && e.pointerId !== undefined) {
      try { mainCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
      activePointers.delete(e.pointerId);
    } else {
      activePointers.clear();
    }
    if (activePointers.size === 0) { gesture.mode = 'none'; gesture.pushedHistory = false; }
    state.pointer.down = false;
    state.pointer.activeStroke = null;
    state.pointer.draggingMotif = null;
  }

  // STEP 02 裁剪路径覆盖率算法（小剪刀精准 / 裁布刀锋利快划 / 竹布尺强磁吸连裁）
  function handleCuttingAt(px, py) {
    const pts = getContourSamplePoints(state.fabric.shape, state.cutting.checkpoints.length);
    const cTool = state.cutting.tool || 'scissors';
    const hitRad = cTool === 'ruler' ? 62 : (cTool === 'knife' ? 48 : 32);
    const chipCnt = cTool === 'knife' ? 3 : 2;
    let hitAny = false;
    pts.forEach((p, idx) => {
      if (!state.cutting.checkpoints[idx] && Math.hypot(px - p.x, py - p.y) < hitRad) {
        state.cutting.checkpoints[idx] = true;
        // 竹布尺辅助定型：自动磁吸连带对齐相邻 1 个节点，极顺手
        if (cTool === 'ruler') {
          const nxtIdx = (idx + 1) % pts.length;
          state.cutting.checkpoints[nxtIdx] = true;
        }
        hitAny = true;
        spawnParticlesAt(p.x, p.y, state.fabric.color, chipCnt);
      }
    });
    if (hitAny) {
      sfx.playSnip();
      const done = state.cutting.checkpoints.filter(Boolean).length;
      state.cutting.progress = Math.round((done / pts.length) * 100);
      if (state.cutting.progress >= 88) {
        state.cutting.checkpoints.fill(true);
        state.cutting.progress = 100;
        state.cutting.completed = true;
        state.stepStatus[1] = true;
        sfx.playChime();
      }
      markDirty('fabric');
      updatePromptAndProgress();
    }
  }

  // STEP 04 缝合路径覆盖率算法（细针秀气 / 绣花针饱满 / 弯针宽幅顺滑收口）
  function handleSewingAt(px, py) {
    const pts = getSewingSamplePoints(state.fabric.shape, state.sewing.checkpoints.length);
    const nTool = state.sewing.needle || 'fine';
    const hitRad = nTool === 'curved' ? 50 : (nTool === 'embroidery' ? 35 : 30);
    let hitAny = false;
    pts.forEach((p, idx) => {
      if (!state.sewing.checkpoints[idx] && Math.hypot(px - p.x, py - p.y) < hitRad) {
        state.sewing.checkpoints[idx] = true;
        hitAny = true;
      }
    });
    if (hitAny) {
      sfx.playSnip();
      const done = state.sewing.checkpoints.filter(Boolean).length;
      state.sewing.progress = Math.round((done / pts.length) * 100);
      if (state.sewing.progress >= 90) {
        state.sewing.checkpoints.fill(true);
        state.sewing.progress = 100;
        state.sewing.completed = true;
        state.stepStatus[3] = true;
        sfx.playChime();
      }
      markDirty('sewing', 'fabric');
      updatePromptAndProgress();
    }
  }

  /* ============================================================================
   * 8. 动态底部面板生成 (renderBottomDock)、浮动工具与步骤守门验证
   * ============================================================================ */
  const promptBarEl = document.getElementById('promptBar');
  const promptTextEl = document.getElementById('promptText');
  const promptBadgeEl = document.getElementById('promptBadge');
  const progressFillEl = document.getElementById('progressFill');
  const subTabsEl = document.getElementById('subTabs');
  const optionsScrollEl = document.getElementById('optionsScroll');
  const floatingToolsEl = document.getElementById('floatingTools');
  const prevStepBtn = document.getElementById('prevStepBtn');
  const nextStepBtn = document.getElementById('nextStepBtn');
  const nextStepText = document.getElementById('nextStepText');
  const selectionToolbar = document.getElementById('selectionToolbar');

  function flashPromptWarning(msg) {
    promptTextEl.textContent = msg;
    promptBarEl.classList.add('warn');
    sfx.playPop(300);
    setTimeout(() => promptBarEl.classList.remove('warn'), 2400);
  }

  function updatePromptAndProgress() {
    let text = '', badge = '', pct = 0;
    const s = state.step;
    if (s === 0) {
      const sh = getShapeDimensions(state.fabric.shape).name;
      const mat = (FABRIC_MATERIALS.find(m => m.id === state.fabric.material) || {}).name;
      text = `已选「${sh} · ${mat}」——点击下方卡片可随时切换形制、布料、底色与暗纹`;
      badge = '择囊选绢'; pct = 100;
    } else if (s === 1) {
      text = state.cutting.completed
        ? '丝帛已裁定并折叠成囊体！可选择囊口样式或进入下一步调香填囊'
        : '按住剪刀沿着白色虚线拖动裁剪丝帛（或点击右上角「自动裁剪」）';
      badge = `裁剪 ${state.cutting.progress}%`; pct = state.cutting.progress;
    } else if (s === 2) {
      text = '点击或拖动香囊内衬，填入花材、香草与香料（至少2种且满20份，上限100份）';
      badge = `香方 ${state.filling.totalAmount}/${state.filling.capacity}份`;
      pct = (state.filling.totalAmount / state.filling.capacity) * 100;
    } else if (s === 3) {
      text = state.sewing.completed
        ? '囊口已严密缝合收紧！可点击下一步为香囊刺绣绘纹'
        : '选择丝线与针法，沿着囊口虚线拖动针尖缝合（达到 90% 即可收口）';
      badge = `缝合 ${state.sewing.progress}%`; pct = state.sewing.progress;
    } else if (s === 4) {
      text = state.embroidery.toolMode === 'freehand'
        ? '自由刺绣模式：按住手指在香囊表面滑动，绣出连续丝线纹路'
        : '点击香囊表面放置刺绣纹样，点击已有纹样可拖动、缩放、旋转或调整层级';
      const cnt = state.embroidery.motifs.length + state.embroidery.freehandStrokes.length;
      badge = `已刺绣 ${cnt} 处`; pct = Math.min(100, cnt * 35);
    } else if (s === 5) {
      text = '为香囊搭配顶部丝绳、垂穗流苏、玉珠与汉风绳结（可点击右上角「自动雅配」）';
      const hasAcc = Boolean(state.accessories.cord && (state.accessories.tassel || state.accessories.beads.length > 0 || state.accessories.knot));
      badge = hasAcc ? '缀饰完备' : '待配流苏/玉珠'; pct = hasAcc ? 100 : 50;
    } else if (s === 6) {
      text = '为香囊题写雅名、赠言与毛笔落款，选择礼盒封存并导出专属纪念图';
      badge = state.gift.completed ? '礼成封存' : '待题名封礼'; pct = state.gift.completed ? 100 : 80;
    }

  /* ============================================================================
   * 9. 900×1200 离屏成品图导出 (generateFinalPoster + toBlob) 与压感毛笔签名板
   * ============================================================================ */
  const cardModal = document.getElementById('cardModal');
  const sigCanvas = document.getElementById('sigCanvas');
  const sigCtx = sigCanvas.getContext('2d');
  let sigDrawing = false;

  function initSignaturePad() {
    sigCtx.strokeStyle = '#3E2215';
    sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
    let lastPt = null, lastTime = 0, lastW = 3.2;

    const getPos = (e) => {
      const r = sigCanvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (cx - r.left) * (sigCanvas.width / r.width), y: (cy - r.top) * (sigCanvas.height / r.height) };
    };
    sigCanvas.addEventListener('pointerdown', (e) => { e.preventDefault(); sigDrawing = true; lastPt = getPos(e); lastTime = performance.now(); lastW = 3.5; });
    sigCanvas.addEventListener('pointermove', (e) => {
      if (!sigDrawing || !lastPt) return; e.preventDefault();
      const p = getPos(e), now = performance.now();
      const vel = Math.hypot(p.x - lastPt.x, p.y - lastPt.y) / Math.max(1, now - lastTime);
      const curW = lastW + (Math.max(1.2, Math.min(5.0, 4.6 - vel * 2.1)) - lastW) * 0.35;
      sigCtx.lineWidth = curW;
      sigCtx.beginPath(); sigCtx.moveTo(lastPt.x, lastPt.y); sigCtx.lineTo(p.x, p.y); sigCtx.stroke();
      lastPt = p; lastTime = now; lastW = curW;
    });
    window.addEventListener('pointerup', () => { sigDrawing = false; lastPt = null; });
    document.getElementById('clearSigBtn').onclick = () => { sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); sfx.playPop(400); };
  }

  function openCardModal() { cardModal.classList.add('show'); sfx.playPop(520); }

  function generateFinalPoster() {
    const poster = document.createElement('canvas');
    poster.width = 900; poster.height = 1200;
    const pctx = poster.getContext('2d');

    // 1. 汉代丝帛暖色渐变底
    const bg = pctx.createLinearGradient(0, 0, 0, 1200);
    bg.addColorStop(0, '#FFFDF9'); bg.addColorStop(0.6, '#FDF3E4'); bg.addColorStop(1, '#F5DEC2');
    pctx.fillStyle = bg; pctx.fillRect(0, 0, 900, 1200);

    pctx.strokeStyle = '#C84B31'; pctx.lineWidth = 3.5; pctx.strokeRect(28, 28, 844, 1144);
    pctx.strokeStyle = '#D9A441'; pctx.lineWidth = 1.5; pctx.strokeRect(38, 38, 824, 1124);

    // 2. 顶部香囊雅名与工坊题头
    pctx.fillStyle = '#3E2215';
    pctx.font = 'bold 34px "Songti SC", serif';
    pctx.textAlign = 'center';
    pctx.fillText(`《 ${state.gift.name || '幽兰长乐囊'} 》`, 450, 88);

    const shName = getShapeDimensions(state.fabric.shape).name;
    const matName = (FABRIC_MATERIALS.find(m => m.id === state.fabric.material) || {}).name;
    pctx.fillStyle = '#784B31';
    pctx.font = '16px "Songti SC", serif';
    pctx.fillText(`东汉古法香囊工坊 · ${shName} · ${matName}`, 450, 120);

    // 东汉工坊印章（与主画布实时预览一致：朱文阳刻红字 vs 白文阴刻白字）
    const isRelief = state.gift.seal !== 'white_intaglio';
    if (isRelief) {
      pctx.fillStyle = '#FFFDF8';
      pctx.fillRect(745, 58, 56, 56);
      pctx.strokeStyle = '#C83E2B'; pctx.lineWidth = 3.2; pctx.strokeRect(747, 60, 52, 52);
      pctx.lineWidth = 1.0; pctx.strokeRect(751, 64, 44, 44);
      pctx.fillStyle = '#C83E2B';
    } else {
      pctx.fillStyle = '#B83222';
      pctx.fillRect(745, 58, 56, 56);
      pctx.strokeStyle = 'rgba(255, 249, 239, 0.55)'; pctx.lineWidth = 1.4; pctx.strokeRect(749, 62, 48, 48);
      pctx.fillStyle = '#FFF9EF';
    }
    pctx.font = 'bold 16px "Songti SC", serif';
    const stxt = (state.gift.sealText || '长乐未央').slice(0, 4);
    pctx.fillText(stxt.slice(0, 2), 773, 82);
    pctx.fillText(stxt.slice(2, 4) || '印', 773, 102);

    // 3. 离屏无损渲染标准 100% 视角的成品香囊主体（不受当前手机缩放与平移影响）
    const snap = document.createElement('canvas');
    snap.width = CW * dpr; snap.height = CH * dpr;
    const prevStep = state.step;
    state.step = 6; markDirty('bg', 'fabric', 'sewing', 'embroidery', 'accessories');
    compositeAllLayers(snap.getContext('2d'), { zoom: 1.0, panX: 0, panY: 0 }, performance.now(), false);
    state.step = prevStep;
    pctx.drawImage(snap, 90, 115, 720, 740);

    // 4. 内藏香方比例明细条与赠言木牍区
    pctx.fillStyle = '#FFFDF8';
    pctx.strokeStyle = '#D9B68C';
    pctx.lineWidth = 2.5;
    pctx.beginPath();
    pctx.roundRect(72, 865, 756, 265, 18);
    pctx.fill(); pctx.stroke();

    const recipeSummary = state.filling.ingredients.length > 0
      ? state.filling.ingredients.map(i => `${i.name} ${Math.round((i.amount / Math.max(1, state.filling.totalAmount)) * 100)}%`).join(' · ')
      : '桂花 40% · 艾草 30% · 白芷 30%';
    pctx.fillStyle = '#9E331E';
    pctx.font = 'bold 16px "Songti SC", serif';
    pctx.textAlign = 'left';
    pctx.fillText(`【内藏香方】 ${recipeSummary}`, 104, 906);

    pctx.fillStyle = '#3E2215';
    pctx.font = 'bold 22px "Songti SC", serif';
    pctx.fillText(state.gift.recipient || '致：洛阳知音', 104, 950);

    pctx.fillStyle = '#5A3822';
    pctx.font = '19px "Songti SC", serif';
    const msg = state.gift.message || '纫秋兰以为佩，寄芳馨于君侧，愿岁岁常欢愉。';
    pctx.fillText(msg.slice(0, 28), 104, 990);
    if (msg.length > 28) pctx.fillText(msg.slice(28, 56), 104, 1022);

    pctx.drawImage(sigCanvas, 520, 1035, 260, 60);
    pctx.fillStyle = '#B58867';
    pctx.font = '14px "Songti SC", serif';
    const boxName = (GIFT_BOXES.find(b => b.id === state.gift.box) || GIFT_BOXES[0]).name;
    pctx.fillText(`制香人亲笔花押 · 封礼：${boxName}`, 104, 1088);

    return poster;
  }

  function showPosterModal() {
    const poster = generateFinalPoster();

  /* ============================================================================
   * 10. 步骤切换守门 (tryGoToStep) 与全局事件绑定
   * ============================================================================ */
  function tryGoToStep(targetStep) {
    if (targetStep < 0 || targetStep > 6) return;
    // 允许自由返回已解锁的前序步骤修改，但向后推进必须通过当前步骤完成条件校验
    if (targetStep > state.step) {
      for (let s = state.step; s < targetStep; s++) {
        if (!validateStep(s) && !state.stepStatus[s]) {
          flashPromptWarning(getStepIncompleteReason(s));
          return;
        }
        state.stepStatus[s] = true;
      }
    }
    state.step = targetStep;
    state.embroidery.selectedUid = null;
    const cfg = STEP_CONFIG[targetStep];
    if (cfg) state.subTab = cfg.tabs[0].id;
    markAllLayersDirty();
    sfx.playPop(520);
    updateUI();
    storageDB.scheduleSave(getSerializableState());
    if (targetStep === 6 && !state.gift.completed) openCardModal();
    if (typeof window.__sachetOnStepChanged === 'function') window.__sachetOnStepChanged(targetStep);
  }

  function bindEvents() {
    mainCanvas.addEventListener('pointerdown', handlePointerDown);
    mainCanvas.addEventListener('pointermove', handlePointerMove);
    mainCanvas.addEventListener('pointerup', handlePointerUp);
    mainCanvas.addEventListener('pointercancel', handlePointerUp);
    window.addEventListener('pointerup', handlePointerUp);
    mainCanvas.addEventListener('contextmenu', e => e.preventDefault());

    mainCanvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const raw = getRawCanvasPos(e);

    function sendHostRpc(reqType, resType, payload) {
      return new Promise((resolve, reject) => {
        const reqId = `sachet_rpc_${Date.now()}_${++rpcSeq}`;
        const timer = setTimeout(() => { delete pendingRpcs[reqId]; reject(new Error('与宿主通信超时')); }, 50000);
        pendingRpcs[reqId] = { resType, resolve, reject, timer };
        window.parent.postMessage({ type: reqType, requestId: reqId, payload: Object.assign({ edition: EDITION }, payload || {}) }, '*');
      });
    }

    window.addEventListener('message', (ev) => {

        const p = data.payload || {};
        coop.characters = Array.isArray(p.characters) ? p.characters : [];
        coop.userName = p.userName || '广陵王';
        const opts = coop.characters.length > 0 ? coop.characters.map(c => `<option value="${String(c.id).replace(/"/g, '&quot;')}">${c.name}</option>`).join('') : '<option value="">暂未检测到名士</option>';

      if (data.requestId && pendingRpcs[data.requestId]) {
        const entry = pendingRpcs[data.requestId];

    function loadSvgToImage(svgStr, onLoaded, onFailed) {
      if (!svgStr || typeof svgStr !== 'string') { if (typeof onFailed === 'function') onFailed(); return; }
      let safeSvg = svgStr.trim();
      if (!/<svg[^>]*\swidth\s*=/i.test(safeSvg)) {
        safeSvg = safeSvg.replace(/<svg\b/i, '<svg width="320" height="72"');
      }
      const tryDataUri = () => {
        try {
          const img = new Image();
          img.onload = () => { if (typeof onLoaded === 'function') onLoaded(img); };
          img.onerror = () => { if (typeof onFailed === 'function') onFailed(); };
          img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(safeSvg);
        } catch (_) { if (typeof onFailed === 'function') onFailed(); }
      };
      try {
        if (typeof Blob !== 'undefined' && typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function') {
          const blob = new Blob([safeSvg], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.onload = () => { try { URL.revokeObjectURL(url); } catch (_) {} if (typeof onLoaded === 'function') onLoaded(img); };
          img.onerror = () => { try { URL.revokeObjectURL(url); } catch (_) {} tryDataUri(); };
          img.src = url;
          return;
        }
      } catch (_) {}
      tryDataUri();
    }

    function describeStepActionChoice(stepIdx, act) {
      if (!act || typeof act !== 'object') return '按心意完成本步';
      if (stepIdx === 0) {
        const sh = (SACHET_SHAPES.find(x => x.id === act.shapeId) || {}).name || '荷包形';
        const mt = (FABRIC_MATERIALS.find(x => x.id === act.materialId) || {}).name || '绫罗';
        const cl = (FABRIC_COLORS.find(x => x.id === act.colorId) || {}).name || '天水碧';
        const pt = (FABRIC_PATTERNS.find(x => x.id === act.patternId) || {}).name || '云纹';
        return `${cl}${mt}${sh} · ${pt}`;
      }
      if (stepIdx === 1) {
        const ct = (CUT_TOOLS.find(x => x.id === act.cutToolId) || {}).name || '小剪刀';
        const op = (OPENINGS.find(x => x.id === act.openingId) || {}).name || '抽绳口';
        return `${ct}裁形 · ${op}`;
      }
      if (stepIdx === 2) {
        const hs = (Array.isArray(act.herbs) ? act.herbs : []).map(h => {
          const meta = HERB_CATALOG.find(x => x.id === h.id);
          return meta ? `${meta.name}${h.amount}份` : '';
        }).filter(Boolean);
        return hs.length > 0 ? hs.join('、') : '古法君臣香方';
      }
      if (stepIdx === 3) {
        const nd = (NEEDLES.find(x => x.id === act.needleId) || {}).name || '绣花针';
        const th = (THREAD_COLORS.find(x => x.id === act.threadColorId) || {}).name || '金丝';
        const st = (STITCH_TYPES.find(x => x.id === act.stitchTypeId) || {}).name || '锁边针';
        return `${nd} · ${th}线 · ${st}`;
      }
      if (stepIdx === 4) {
        const ms = (Array.isArray(act.motifs) ? act.motifs : []).map(id => (EMBROIDERY_MOTIFS.find(x => x.id === id) || {}).name).filter(Boolean);
        const tl = (EMBROIDERY_TOOLS.find(x => x.id === act.embToolId) || {}).name || '盘金绣';
        const sk = act.sachetSketchSvg ? ` + 囊面手绣「${act.sachetSketchTitle || '简笔画'}」` : '';
        return `${tl}：${ms.join('、') || '梅兰纹'}${sk}`;
      }
      if (stepIdx === 5) {
        const cd = (CORDS.find(x => x.id === act.cordId) || {}).name || '流金丝绳';
        const kn = (KNOTS.find(x => x.id === act.knotId) || {}).name || '如意结';
        const ts = (TASSELS.find(x => x.id === act.tasselId) || {}).name || '长流苏';
        const bs = (Array.isArray(act.beadIds) ? act.beadIds : []).map(id => (BEADS.find(x => x.id === id) || {}).name).filter(Boolean);
        return `${cd} · ${kn} · ${ts}` + (bs.length ? ` + ${bs.join('、')}` : '');
      }
      const bx = (GIFT_BOXES.find(x => x.id === act.boxId) || {}).name || '朱漆木盒';
      const sk = act.cardSketchSvg ? `｜ 花押「${act.cardSketchTitle || '幽兰花押'}」` : '';
      return `雅名「${act.sachetName || '幽兰长乐囊'}」· ${bx} · 印「${act.sealText || '长乐未央'}」${sk}`;
    }

    function applyCharStep(stepIdx, act) {
      if (!act || typeof act !== 'object') return;
      if (stepIdx === 0) {
        const sh = SACHET_SHAPES.find(x => x.id === act.shapeId) || SACHET_SHAPES[0];
        const mt = FABRIC_MATERIALS.find(x => x.id === act.materialId) || FABRIC_MATERIALS[1];

        state.fabric.material = mt.id;
        state.fabric.color = cl.hex;
        state.fabric.pattern = pt.id;
        state.stepStatus[0] = true;
      } else if (stepIdx === 1) {
        state.cutting.tool = (CUT_TOOLS.find(x => x.id === act.cutToolId) || CUT_TOOLS[0]).id;
        state.cutting.opening = (OPENINGS.find(x => x.id === act.openingId) || OPENINGS[0]).id;
        state.cutting.checkpoints.fill(true);
        state.cutting.progress = 100;
        state.cutting.completed = true;
        state.stepStatus[1] = true;
      } else if (stepIdx === 2) {
        const herbs = Array.isArray(act.herbs) && act.herbs.length > 0 ? act.herbs : PRESET_RECIPES[0].items;
        applyPresetRecipe({ name: '名士私房香方', items: herbs });

        const nd = NEEDLES.find(x => x.id === act.needleId) || NEEDLES[1];

        const st = STITCH_TYPES.find(x => x.id === act.stitchTypeId) || STITCH_TYPES[2];
        state.sewing.needle = nd.id;
        state.sewing.threadColor = th.hex;
        state.sewing.stitchType = st.id;
        state.sewing.checkpoints.fill(true);
        state.sewing.progress = 100;
        state.sewing.completed = true;
        state.stepStatus[3] = true;
      } else if (stepIdx === 4) {
        const th1 = (THREAD_COLORS.find(x => x.id === act.embThreadId) || THREAD_COLORS[1]).hex;
        const th2 = (act.embThread2Id && act.embThread2Id !== 'none')
          ? (THREAD_COLORS.find(x => x.id === act.embThread2Id) || THREAD_COLORS[2]).hex : th1;
        const toolId = (EMBROIDERY_TOOLS.find(x => x.id === act.embToolId) || EMBROIDERY_TOOLS[2]).id;
        if (act.sachetSketchSvg) {
          state.sachetSketchTitle = act.sachetSketchTitle || '手绣简笔画';
          loadSvgToImage(act.sachetSketchSvg, img => {
            state.sachetSketchImg = img;
            markDirty('embroidery');
          });
        } else {
          state.sachetSketchImg = null;
          state.sachetSketchTitle = '';
        }
        const rawMotifs = Array.isArray(act.motifs) && act.motifs.length > 0 ? act.motifs : ['m_plum', 'm_cloud', 't_changle'];
        const hasCenterSketch = Boolean(act.sachetSketchSvg);
        const slots = hasCenterSketch
          ? [[-0.44, -0.34, 0.88], [0.44, -0.34, 0.88], [-0.42, 0.36, 0.86], [0.42, 0.36, 0.86], [0, -0.52, 0.82], [0, 0.52, 0.82]]
          : [[0, -0.06, 1.12], [-0.38, -0.30, 0.88], [0.38, -0.28, 0.88], [-0.34, 0.34, 0.86], [0.36, 0.32, 0.86], [0, 0.46, 0.88]];
        rawMotifs.slice(0, 6).forEach((mId, i) => {
          const valid = EMBROIDERY_MOTIFS.find(x => x.id === mId);
          if (!valid) return;
          const pos = slots[i % slots.length];
          state.embroidery.motifs.push({
            uid: Date.now() + i * 23,
            type: valid.id,
            u: pos[0],
            v: pos[1],
            scale: pos[2],
            rotation: (i % 2 === 0 ? -0.08 : 0.08),
            color: i % 2 === 0 ? th1 : th2,
            stitchStyle: toolId,
            zIndex: 2 + i,
            locked: false
          });
        });
        state.stepStatus[4] = true;
      } else if (stepIdx === 5) {
        state.accessories.cord = CORDS.find(x => x.id === act.cordId) || CORDS[2];
        state.accessories.tassel = TASSELS.find(x => x.id === act.tasselId) || TASSELS[0];
        state.accessories.knot = KNOTS.find(x => x.id === act.knotId) || KNOTS[1];
        const bIds = Array.isArray(act.beadIds) && act.beadIds.length > 0 ? act.beadIds : ['bd_jade', 'bd_ring'];
        state.accessories.beads = bIds.slice(0, 3).map((bid, i) => {
          const b = BEADS.find(x => x.id === bid) || BEADS[0];
          return { ...b, uid: Date.now() + i * 31 };
        });
        state.stepStatus[5] = true;
      } else if (stepIdx === 6) {
        state.gift.box = (GIFT_BOXES.find(x => x.id === act.boxId) || GIFT_BOXES[0]).id;
        state.gift.sealStyle = (GIFT_SEALS.find(x => x.id === act.sealStyleId) || GIFT_SEALS[0]).id;
        state.gift.name = String(act.sachetName || '幽兰长乐囊').slice(0, 12);
        state.gift.recipient = String(act.recipient || `致：${coop.userName}`).slice(0, 18);
        state.gift.message = String(act.message || '幽兰佩君侧，愿此缕清香伴你岁岁常安。').slice(0, 60);
        state.gift.sealText = String(act.sealText || '长乐未央').slice(0, 6);
        state.gift.completed = true;
        state.stepStatus[6] = true;
        drawFallbackSachetSignature(getCharName());
        if (act.cardSketchSvg) {
          loadSvgToImage(act.cardSketchSvg, img => {
            const iw = img.naturalWidth || img.width || 320;
            const ih = img.naturalHeight || img.height || 72;
            if (iw <= 0 || ih <= 0) return;
            sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            const pad = 4, ratio = Math.min((sigCanvas.width - pad * 2) / iw, (sigCanvas.height - pad * 2) / ih);
            const dw = iw * ratio, dh = ih * ratio;
            sigCtx.drawImage(img, (sigCanvas.width - dw) * 0.5, (sigCanvas.height - dh) * 0.5, dw, dh);
          }, () => drawFallbackSachetSignature(getCharName()));
        }
      }
      markAllLayersDirty(); sfx.playChime(); updateUI();
    }

    function isCharTurnInRelay(stepIdx) {
      if (coop.mode !== 'relay_coop') return false;
      return coop.userFirst ? (stepIdx % 2 === 1) : (stepIdx % 2 === 0);
    }

    function syncCoopUI() {
      const m = coop.mode;
      swapBtnEl.style.display = m === 'relay_coop' ? 'inline-block' : 'none';
      swapBtnEl.textContent = coop.userFirst ? '我先手' : 'TA先手';
      const isCharTurn = isCharTurnInRelay(state.step);
      actionBtnEl.style.display = (m === 'char_make_user_eat' || isCharTurn) ? 'inline-block' : 'none';
      if (m === 'char_make_user_eat') actionBtnEl.textContent = coop.busy ? '制香中…' : '请TA制囊';
      else actionBtnEl.textContent = coop.busy ? 'TA操作中…' : '让TA做这步';
      posterTasteRowEl.style.display = m === 'char_make_user_eat' ? 'none' : 'flex';
      posterUserFeedbackRowEl.style.display = m === 'char_make_user_eat' ? 'flex' : 'none';
      askCharTasteBtnEl.textContent = `请「${getCharName()}」佩香品评`;
    }

    async function runCharacterRelayStep(stepIdx) {
      if (coop.busy || !coop.selectedCharId) return;
      coop.busy = true; syncCoopUI();
      showBubble(getCharName(), '理线配香中', '正在细看香囊丝帛与香方，准备亲手接力这一步…', false);
      try {
        const snap = buildSachetSummary();
        const res = await sendHostRpc('WORKSHOP_CAKE_STEP_RELAY_REQUEST', 'WORKSHOP_CAKE_STEP_RELAY_RESPONSE', {
          charId: coop.selectedCharId,
          stepIndex: stepIdx,
          visualSnapshotText: snap.visualSnapshotText,
          cakeSummary: snap.cakeDesc,
          imageDataUrl: captureSmallSachetSnapshot(),
          relayHistory: coop.relayHistory
        });
        applyCharStep(stepIdx, res.stepAction);
        coop.relayHistory.push(`第${stepIdx + 1}步(${res.charName})：${res.spokenLine}`);
        recordMakingNote(stepIdx, res.charName, res.stepAction, res.spokenLine);
        showBubble(res.charName, res.moodTag || '接力完成', res.spokenLine, false);
      } catch (err) { showBubble(getCharName(), '网络波动', `接力失败：${err.message || err}`, false); }
      coop.busy = false; syncCoopUI();
    }

    async function runCharacterFullMake() {
      if (coop.busy || !coop.selectedCharId) return;
      coop.busy = true;
      coop.lastReview = null;
      coop.makingNotes = [];
      coop.fullMakeSession = null;
      renderPosterNotesView();
      syncCoopUI();
      state = createInitialState();
      sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      markAllLayersDirty();
      updateUI();
      showBubble(getCharName(), '构思香方中', '正在挑选丝帛、配伍君臣香料并细想绣纹，请稍候…', false);
      try {
        const res = await sendHostRpc('WORKSHOP_CAKE_FULL_MAKE_REQUEST', 'WORKSHOP_CAKE_FULL_MAKE_RESPONSE', { charId: coop.selectedCharId });
        const plan = res.plan || {}, stepLines = res.stepLines || [];
        const stepActions = [
          { shapeId: plan.shapeId, materialId: plan.materialId, colorId: plan.colorId, patternId: plan.patternId },
          { cutToolId: plan.cutToolId, openingId: plan.openingId },
          { herbs: plan.herbs },
          { needleId: plan.needleId, threadColorId: plan.threadColorId, stitchTypeId: plan.stitchTypeId },
          { motifs: plan.motifs, embThreadId: plan.embThreadId, embThread2Id: plan.embThread2Id, embToolId: plan.embToolId, sachetSketchTitle: plan.sachetSketchTitle, sachetSketchSvg: plan.sachetSketchSvg },
          { cordId: plan.cordId, tasselId: plan.tasselId, knotId: plan.knotId, beadIds: plan.beadIds },
          { boxId: plan.boxId, sealStyleId: plan.sealStyleId, sachetName: plan.sachetName, recipient: plan.recipient, message: plan.message, sealText: plan.sealText, cardSketchTitle: plan.cardSketchTitle, cardSketchSvg: plan.cardSketchSvg }
        ];
        coop.fullMakeSession = { charName: res.charName, stepActions, stepLines, introNote: res.introNote || stepLines[6] || '香囊缝好了，佩在腰间试试罢。', currentStep: 0 };
        state.step = 0;
        applyCharStep(0, stepActions[0]);
        recordMakingNote(0, res.charName, stepActions[0], stepLines[0] || '先挑合心意的囊形与丝帛。');
        showBubble(res.charName, '第 1/7 步', stepLines[0] || '先挑合心意的囊形与丝帛。', true, '看下一步 (2/7)');
      } catch (err) { showBubble(getCharName(), '制香中断', `生成失败：${err.message || err}`, false); }
      coop.busy = false; syncCoopUI();
    }

    nextStepBtnEl.onclick = () => {
      const sess = coop.fullMakeSession;
      if (!sess) return;
      if (sess.currentStep < 6) {
        sess.currentStep++;
        state.step = sess.currentStep;
        applyCharStep(sess.currentStep, sess.stepActions[sess.currentStep]);
        recordMakingNote(sess.currentStep, sess.charName, sess.stepActions[sess.currentStep], sess.stepLines[sess.currentStep] || sess.introNote);
        showBubble(sess.charName, sess.currentStep < 6 ? `第 ${sess.currentStep + 1}/7 步` : '封礼呈香', sess.stepLines[sess.currentStep] || sess.introNote, true, sess.currentStep < 6 ? `看下一步 (${sess.currentStep + 2}/7)` : '查看香囊纪念笺');
      } else {
        showPosterModal();
        setPosterViewTab('img');
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML = `<div style="font-weight:800;color:#C84B31;margin-bottom:4px;">${sess.charName} 亲手奉上香囊：</div><div>「${sess.introNote || '香囊缝好了，佩在腰间试试罢。'}」</div>`;
        syncCoopUI();
      }
    };

    skipAnimBtnEl.onclick = () => {
      const sess = coop.fullMakeSession;
      if (!sess) return;
      for (let s = sess.currentStep + 1; s < 7; s++) {
        state.step = s;
        applyCharStep(s, sess.stepActions[s]);
        recordMakingNote(s, sess.charName, sess.stepActions[s], sess.stepLines[s] || sess.introNote);
      }
      sess.currentStep = 6;
      showBubble(sess.charName, '封礼呈香', sess.introNote || '香囊缝好了，佩在腰间试试罢。', true, '查看香囊纪念笺');
    };

    async function saveCurrentToHistory(posterDataUrl) {
      try {
        const snap = buildSachetSummary();
        const id = coop.currentHistoryId || (`sachet_hist_${Date.now()}`);
        coop.currentHistoryId = id;
        await sendHostRpc('WORKSHOP_CAKE_SAVE_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', {
          id,
          cakeName: snap.cakeName,
          cakeDesc: snap.cakeDesc,
          plaqueText: snap.plaqueText,
          mode: coop.mode,
          charId: coop.selectedCharId,
          charName: getCharName(),
          posterDataUrl: posterDataUrl || posterImgEl.src,
          makingNotes: coop.makingNotes,
          review: coop.lastReview
        });
      } catch (_) {}
    }

    window.__sachetOnPosterReady = (dataUrl) => {
      coop.currentHistoryId = `sachet_hist_${Date.now()}`;
      renderPosterNotesView();
      syncCoopUI();
      saveCurrentToHistory(dataUrl);
    };

    window.__sachetOnStepChanged = () => {
      syncCoopUI();
      if (coop.mode === 'relay_coop' && isCharTurnInRelay(state.step)) {
        runCharacterRelayStep(state.step);
      }
    };

    document.getElementById('backToWorkshopBtn').onclick = () => window.parent.postMessage({ type: 'WORKSHOP_CAKE_CLOSE' }, '*');
    charSelectEl.onchange = () => { coop.selectedCharId = charSelectEl.value; forwardCharSelectEl.value = coop.selectedCharId; syncCoopUI(); };
    modeSelectEl.onchange = () => {
      coop.mode = modeSelectEl.value;
      coop.relayHistory = [];
      hideBubble();
      syncCoopUI();
      if (coop.mode === 'relay_coop' && isCharTurnInRelay(state.step)) runCharacterRelayStep(state.step);
    };
    swapBtnEl.onclick = () => {
      coop.userFirst = !coop.userFirst;
      syncCoopUI();
      if (coop.mode === 'relay_coop' && isCharTurnInRelay(state.step)) runCharacterRelayStep(state.step);
    };
    actionBtnEl.onclick = () => {
      if (coop.mode === 'char_make_user_eat') runCharacterFullMake();
      else runCharacterRelayStep(state.step);
    };

    askCharTasteBtnEl.onclick = async () => {
      if (coop.busy || !coop.selectedCharId) return;
      coop.busy = true; askCharTasteBtnEl.textContent = '名士嗅香品评中…';
      try {
        const snap = buildSachetSummary();
        const res = await sendHostRpc('WORKSHOP_CAKE_TASTE_REQUEST', 'WORKSHOP_CAKE_TASTE_RESPONSE', {
          charId: coop.selectedCharId,
          mode: coop.mode,
          visualSnapshotText: snap.visualSnapshotText,
          cakeSummary: snap.cakeDesc,
          imageDataUrl: captureSmallSachetSnapshot()
        });
        coop.lastReview = res;
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML = `<div style="font-weight:800;color:#C83E2B;margin-bottom:4px;">${res.charName} 的佩香回函（${res.reactionTag}）</div><div>${res.comment}</div><div style="font-weight:700;margin-top:4px;">${res.dialogue}</div>`;
        saveCurrentToHistory(posterImgEl.src);
      } catch (err) { showToast(`品评失败：${err.message || err}`); }
      coop.busy = false; syncCoopUI();
    };

    sendUserFeedbackBtnEl.onclick = async () => {
      const fb = userFeedbackInputEl.value.trim();
      if (!fb || coop.busy || !coop.selectedCharId) return;
      coop.busy = true;
      sendUserFeedbackBtnEl.textContent = '回应中…';
      try {
        const snap = buildSachetSummary();
        const res = await sendHostRpc('WORKSHOP_CAKE_FEEDBACK_REQUEST', 'WORKSHOP_CAKE_FEEDBACK_RESPONSE', {
          charId: coop.selectedCharId,
          userFeedback: fb,
          visualSnapshotText: snap.visualSnapshotText,
          cakeSummary: snap.cakeDesc
        });
        coop.lastReview = res;
        posterReviewBoxEl.style.display = 'block';
        posterReviewBoxEl.innerHTML = `<div style="font-weight:800;color:#C83E2B;margin-bottom:4px;">${res.charName} 的回响（${res.reactionTag}）</div><div>${res.comment}</div><div style="font-weight:700;margin-top:4px;">${res.dialogue}</div>`;
        userFeedbackInputEl.value = '';
        saveCurrentToHistory(posterImgEl.src);
      } catch (err) { showToast(`回应失败：${err.message || err}`); }
      coop.busy = false;
      sendUserFeedbackBtnEl.textContent = '发给TA';
    };

    saveBackpackBtnEl.onclick = async () => {
      const snap = buildSachetSummary();
      try {
        const res = await sendHostRpc('WORKSHOP_CAKE_SAVE_BACKPACK', 'WORKSHOP_CAKE_ACTION_RESULT', { cakeName: snap.cakeName, cakeDesc: snap.cakeDesc, posterDataUrl: posterImgEl.src });
        showToast((res && res.message) || '已收入行囊');
      } catch (err) { showToast(`收入失败：${err.message || err}`); }
    };

    openForwardModalBtnEl.onclick = () => {
      if (coop.selectedCharId) forwardCharSelectEl.value = coop.selectedCharId;
      forwardModalEl.classList.add('show');
    };
    document.getElementById('closeForwardModalBtn').onclick = () => forwardModalEl.classList.remove('show');
    confirmForwardBtnEl.onclick = async () => {
      const targetId = forwardCharSelectEl.value;
      const targetObj = coop.characters.find(c => String(c.id) === String(targetId));
      const snap = buildSachetSummary();
      confirmForwardBtnEl.textContent = '赠予中…';
      try {
        const res = await sendHostRpc('WORKSHOP_CAKE_SEND_CHAT', 'WORKSHOP_CAKE_ACTION_RESULT', {
          charId: targetId, charName: targetObj ? targetObj.name : '', cakeName: snap.cakeName, cakeDesc: snap.cakeDesc, plaqueText: snap.plaqueText, forwardNote: forwardNoteInputEl.value.trim(), posterDataUrl: posterImgEl.src
        });
        forwardModalEl.classList.remove('show');
        forwardNoteInputEl.value = '';
        showToast((res && res.message) || '已赠予好友');
      } catch (err) { showToast(`赠予失败：${err.message || err}`); }
      confirmForwardBtnEl.textContent = '确认赠出香囊';
    };

    async function openHistoryModal() {
      historyModalEl.classList.add('show');
      historyListEl.innerHTML = '<div style="text-align:center;color:#B58867;font-size:12px;padding:18px;">正在翻阅幽兰香囊集录…</div>';
      let records = [];
      try {
        const hostList = await sendHostRpc('WORKSHOP_CAKE_LIST_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', {});
        if (Array.isArray(hostList) && hostList.length > 0) records = hostList;
      } catch (_) {}
      if (records.length === 0) {
        try { records = (await storageDB.loadGallery()) || []; } catch (_) {}
      }
      if (!records || records.length === 0) {
        historyListEl.innerHTML = '<div style="text-align:center;color:#B58867;font-size:12px;padding:22px;">尚未封存香囊成品，完成第 7 步封礼后将自动收录于此。</div>';
        return;
      }
      const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      historyListEl.innerHTML = '';
      records.forEach(rec => {
        const card = document.createElement('div');
        card.className = 'history-card';
        const dStr = rec.createdAt ? new Date(rec.createdAt).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
        const title = rec.cakeName || rec.name || '幽兰长乐囊';
        card.innerHTML =
          `<img class="history-thumb" src="${rec.posterDataUrl || ''}" alt="${esc(title)}">` +
          `<div style="flex:1;min-width:0;">` +
            `<div style="font-size:13px;font-weight:800;color:#3E2215;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(title)}</div>` +
            `<div style="font-size:10.5px;color:#8C6348;margin-top:2px;">${esc(dStr)}${rec.charName ? ' · 同行：' + esc(rec.charName) : ''}</div>` +
            (rec.cakeDesc ? `<div style="font-size:10.5px;color:#6E4930;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(rec.cakeDesc)}</div>` : '') +
          `</div>` +
          `<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">` +
            `<button type="button" class="coop-btn" data-view="1">查看</button>` +
            `<button type="button" class="sel-btn danger" data-del="1">删</button>` +
          `</div>`;
        card.querySelector('[data-view="1"]').onclick = () => {
          posterImgEl.src = rec.posterDataUrl || '';
          historyModalEl.classList.remove('show');
          document.getElementById('posterModal').classList.add('show');
        };
        card.querySelector('[data-del="1"]').onclick = async () => {
          try { await sendHostRpc('WORKSHOP_CAKE_DELETE_HISTORY', 'WORKSHOP_CAKE_ACTION_RESULT', { id: rec.id }); } catch (_) {}
          openHistoryModal();
        };
        historyListEl.appendChild(card);
      });
    }

    document.getElementById('openHistoryBtn').onclick = openHistoryModal;
    document.getElementById('closeHistoryModalBtn').onclick = () => historyModalEl.classList.remove('show');
    window.parent.postMessage({ type: 'WORKSHOP_CAKE_REQUEST_SYNC', payload: { edition: EDITION } }, '*');
  }

  // 启动工坊并自动从 IndexedDB 恢复未完成草稿
  initSignaturePad();
  bindEvents();
  initSachetCoCreationBridge();
  storageDB.init().then(async (ok) => {
    if (ok) {
      const draft = await storageDB.loadDraft();
      if (draft && draft.version === 1) restoreSerializedState(draft);
    }
  });
  updateUI();
  requestAnimationFrame(renderLoop);
})();
</script>
</body>
</html>
